var DATA=[{"source":"周预测","order":1,"title":"Definition of Globalization 全球化的定义","code":"111024","priority":"极高频 今日预测 简单","category":"概念类","answer":"One definition of globalization is the proliferation of international trade and more international communications, and multinationals can be good examples. Besides, we can see globalization as an integrated economic system. This system splits the world into consuming countries and producing countries. This is a new era where nations’ economies depend on each other, so the post-industrial economy is global. (59 words)","logic":"","audio":"","keywords":[{"number":1,"original":"definition of globalization","noun_form":"definition of globalization","chinese":"全球化的定义"},{"number":2,"original":"the proliferation of international trade","noun_form":"the proliferation of international trade","chinese":"国际贸易的迅速增长"},{"number":3,"original":"more international communications","noun_form":"more international communications","chinese":"更多国际交流"},{"number":4,"original":"multinationals","noun_form":"multinationals","chinese":"跨国公司"},{"number":5,"original":"an integrated economic system","noun_form":"an integrated economic system","chinese":"综合性的经济体系"},{"number":6,"original":"consuming countries","noun_form":"consuming countries","chinese":"消费国家"},{"number":7,"original":"producing countries","noun_form":"producing countries","chinese":"生产国家"},{"number":8,"original":"a new era","noun_form":"a new era","chinese":"新时代"},{"number":9,"original":"nations’ economies","noun_form":"nations’ economies","chinese":"各国的经济"},{"number":10,"original":"depend on each other","noun_form":"depending on each other","chinese":"相互依赖"},{"number":11,"original":"the post-industrial economy is global","noun_form":"global post-industrial economy","chinese":"全球性的后工业经济"}]},{"source":"周预测","order":2,"title":"Obese Women 女性体脂实验","code":"111049","priority":"极高频 今日预测 简单","category":"实验类","answer":"Thirty-one obese women volunteered in a Canadian study to test changes in their body fat. They followed strict daily dietary requirements and exercised as instructed every day. After six months, some of them lost weight, while others stayed the same, and some even gained weight. There are two explanations: some of them may have been cheating on the diet, or they did less exercise consciously or unconsciously for psychological reasons. (70 words)","logic":"","audio":"","keywords":[{"number":1,"original":"thirty-one obese women","noun_form":"thirty-one obese women","chinese":"31位肥胖女性"},{"number":2,"original":"a Canadian experiment","noun_form":"a Canadian experiment","chinese":"一个加拿大实验"},{"number":3,"original":"test changes in their body fat","noun_form":"testing changes in body fat","chinese":"测试体脂改变"},{"number":4,"original":"strict daily dietary requirements","noun_form":"strict daily dietary requirements","chinese":"严格的食谱要求"},{"number":5,"original":"did exercise as instructed","noun_form":"doing exercise as instructed","chinese":"按照规定进行锻炼"},{"number":6,"original":"six months","noun_form":"six months","chinese":"六个月"},{"number":7,"original":"lost weight","noun_form":"weight loss","chinese":"减重"},{"number":8,"original":"stayed the same","noun_form":"staying the same","chinese":"不变"},{"number":9,"original":"gained weight","noun_form":"weight gain","chinese":"增重"},{"number":10,"original":"two explanations","noun_form":"two explanations","chinese":"两种解释"},{"number":11,"original":"cheating on the diet","noun_form":"cheating on the diet","chinese":"偷吃"},{"number":12,"original":"did less exercise consciously or unconsciously","noun_form":"doing less exercise consciously or unconsciously","chinese":"有意无意地少做锻炼"},{"number":13,"original":"psychological reasons","noun_form":"psychological reasons","chinese":"心理原因"}]},{"source":"周预测","order":3,"title":"Sign Language 手语","code":"111058","priority":"极高频 今日预测 简单","category":"概念类","answer":"This lecture talks about abstraction and the origin of symbolic systems. People had used sign language for a long time, but they found that they could not communicate while doing things. For example, they need to ask for help when they strangle a rhinoceros. So, they need to communicate and do something with their hands at the same time. That's how words and language came. (65 words)","logic":"","audio":"","keywords":[{"number":1,"original":"abstraction","noun_form":"abstraction","chinese":"抽象概念"},{"number":2,"original":"the origin of symbolic systems","noun_form":"the origin of symbolic systems","chinese":"符号系统的起源"},{"number":3,"original":"sign language","noun_form":"sign language","chinese":"手语"},{"number":4,"original":"communicate while doing things","noun_form":"communicating while doing things","chinese":"一边沟通一边做事"},{"number":5,"original":"ask for help","noun_form":"asking for help","chinese":"寻求帮助"},{"number":6,"original":"strangle a rhinoceros","noun_form":"strangling a rhinoceros","chinese":"勒住犀牛"},{"number":7,"original":"communicate and do something with their hands at the same time","noun_form":"communicating and doing something with their hands at the same time","chinese":"用手做事和交流同时进行"},{"number":8,"original":"words and language","noun_form":"words and language","chinese":"文字和语言"}]},{"source":"周预测","order":4,"title":"Genes Affect Human Behaviors 基因影响人类行为","code":"111059","priority":"极高频 今日预测 困难","category":"叙事类","answer":"Since the discovery of the DNA structure, people have believed that genes have an impact only on people’s physical structure. However, the study of mapping of genes in 2001 found that there is a genetic responsibility for humans’ physical and psychological behaviors, which has changed the way we understand our behaviors. The research on genes has provided integrated information and can benefit biology, psychology, and neuroscience. (66 words)","logic":"","audio":"","keywords":[{"number":1,"original":"the discovery of the DNA structure","noun_form":"discovery of the DNA structure DNA","chinese":"结构的发现"},{"number":2,"original":"genes","noun_form":"genes","chinese":"基因"},{"number":3,"original":"people’s physical structure","noun_form":"people’s physical structure","chinese":"人类的生理结构"},{"number":4,"original":"the study of mapping of genes","noun_form":"the study of mapping of genes","chinese":"基因图谱的研究"},{"number":5,"original":"a genetic responsibility","noun_form":"a genetic responsibility","chinese":"基因的责任"},{"number":6,"original":"physical and psychological behaviors","noun_form":"physical and psychological behaviors","chinese":"生理和心理行为"},{"number":7,"original":"changed the way we understand our behaviors","noun_form":"changing the way we understand our behaviors","chinese":"改变了我们理解自身行为的方式"},{"number":8,"original":"the research on genes","noun_form":"the research on genes","chinese":"对基因的研究"},{"number":9,"original":"integrated information","noun_form":"integrated information","chinese":"综合的信息"},{"number":10,"original":"biology","noun_form":"biology","chinese":"生物学"},{"number":11,"original":"psychology","noun_form":"psychology","chinese":"心理学"},{"number":12,"original":"neuroscience","noun_form":"neuroscience","chinese":"神经科学"}]},{"source":"周预测","order":5,"title":"Market Economy 市场经济","code":"111064","priority":"极高频 今日预测 困难","category":"现象类","answer":"The notions of pragmatism and democracy have succeeded in tempering the market economy in developed countries. The Industrial Revolution had negative effects on the living standards of the working classes. However, legislation about working conditions and better environmental conditions was passed to circumscribe the worst behaviors, which reversed some damage. Nowadays, the benefits of the market economy are shared far more widely than 100 years ago. (66 words)","logic":"","audio":"","keywords":[{"number":1,"original":"the notions of pragmatism and democracy","noun_form":"the notions of pragmatism and democracy","chinese":"实用主义和民主的观念"},{"number":2,"original":"tempering the market economy","noun_form":"tempering the market economy","chinese":"缓和市场经济"},{"number":3,"original":"developed countries","noun_form":"developed countries","chinese":"发达国家"},{"number":4,"original":"the Industrial Revolution","noun_form":"the Industrial Revolution","chinese":"工业革命"},{"number":5,"original":"the working classes","noun_form":"the working classes","chinese":"工人阶级"},{"number":6,"original":"negative effects on the living standards","noun_form":"negative effects on the living standards","chinese":"对生活质量的负面影响"},{"number":7,"original":"legislation about working conditions and better environmental conditions","noun_form":"legislation about working conditions and better environmental conditions","chinese":"改善工作条件和工作环境的立法"},{"number":8,"original":"circumscribe the worst behaviors","noun_form":"circumscribing the worst behaviors","chinese":"限制最恶劣的行为"},{"number":9,"original":"reversed some damage","noun_form":"reversing some damage","chinese":"扭转一些损失"},{"number":10,"original":"the benefits of the market economy","noun_form":"the benefits of the market economy","chinese":"市场经济的好处"},{"number":11,"original":"shared far more","noun_form":"widely widespread sharing","chinese":"广泛的分享"}]},{"source":"周预测","order":6,"title":"What Makes People Happy 快乐的原因","code":"111065","priority":"极高频 今日预测 困难","category":"实验类","answer":"Although people are skeptical about it, this survey on what makes people happy can be used as a valid example of happiness economics, because it found a consistent pattern that determines people's well-being all over the world, including income, health, marital status, and employment status. Apart from that, other factors can affect people's well-being more, including the environment and equality, and the nature of original living. (66 words)","logic":"","audio":"","keywords":[{"number":1,"original":"this survey","noun_form":"a survey","chinese":"一个调查"},{"number":2,"original":"what makes people happy","noun_form":"what makes people happy","chinese":"什么能让人感到快乐"},{"number":3,"original":"a valid example of happiness economics","noun_form":"a valid example of happiness economics","chinese":"关于幸福经济学的典型例子"},{"number":4,"original":"a consistent pattern","noun_form":"a consistent pattern","chinese":"一贯的模式"},{"number":5,"original":"determine people's well-being","noun_form":"determining people's well-being","chinese":"决定人们的幸福"},{"number":6,"original":"income","noun_form":"income","chinese":"收入"},{"number":7,"original":"health","noun_form":"health","chinese":"健康"},{"number":8,"original":"marital status","noun_form":"marital status","chinese":"婚姻状况"},{"number":9,"original":"employment status","noun_form":"employment status","chinese":"就业状况"},{"number":10,"original":"other factors","noun_form":"other factors","chinese":"其他因素"},{"number":11,"original":"the environment","noun_form":"the environment","chinese":"环境"},{"number":12,"original":"equality","noun_form":"equality","chinese":"平等"},{"number":13,"original":"the nature of original living","noun_form":"the nature of original living","chinese":"生活的本质"}]},{"source":"周预测","order":7,"title":"Climate Change Predictions 气候变暖预测","code":"111072","priority":"极高频 今日预测 困难","category":"现象类","answer":"People are questioning how panicked we should be about the reality of global climate change. Although the prediction of the population bomb in 1968 was criticized because some of the predictions didn’t come about, the world cannot take the risk that the climate scientists have wrong predictions, because major precipitation changes are taking place worldwide. (55 words)","logic":"","audio":"","keywords":[{"number":1,"original":"panicked","noun_form":"panic","chinese":"恐慌"},{"number":2,"original":"the reality of global climate change","noun_form":"the reality of global climate change","chinese":"全球气候变化的事实"},{"number":3,"original":"the prediction of the population bomb was criticized","noun_form":"criticizing the prediction of the population bomb","chinese":"对人口爆炸预测的批判"},{"number":4,"original":"cannot take the risk being","noun_form":"unable to take the risk","chinese":"不能承担风险"},{"number":5,"original":"the climate scientists","noun_form":"climate scientists","chinese":"气候科学家"},{"number":6,"original":"wrong predictions","noun_form":"wrong predictions","chinese":"错误的预测"},{"number":7,"original":"major precipitation changes","noun_form":"major precipitation changes","chinese":"重大降水变化"}]},{"source":"周预测","order":8,"title":"Globalization & Detraditionalization全球化导致传统文化丧失","code":"111107","priority":"极高频 今日预测 简单","category":"现象类","answer":"The world is a global village with instant communications through the internet. The world is also shrinking due to distance and speed. Globalization has brought detraditionalization because of the erosion of traditional culture and conventional ways of doing things, as young people are rejecting the culture in which they grew up and are keen on imitating the Hollywood models. (59 words)","logic":"","audio":"","keywords":[{"number":1,"original":"a global village","noun_form":"a global village","chinese":"地球村"},{"number":2,"original":"instant communications","noun_form":"instant communications","chinese":"即刻的交流"},{"number":3,"original":"the internet","noun_form":"the internet","chinese":"互联网"},{"number":4,"original":"shrinking a","noun_form":"shrinking world","chinese":"缩小的世界"},{"number":5,"original":"distance","noun_form":"distance","chinese":"距离"},{"number":6,"original":"speed","noun_form":"speed","chinese":"速度"},{"number":7,"original":"globalization","noun_form":"globalization","chinese":"全球化"},{"number":8,"original":"detraditionalization","noun_form":"detraditionalization","chinese":"去传统化"},{"number":9,"original":"the erosion of traditional culture and conventional ways of doing things","noun_form":"the erosion of traditional culture and conventional ways of doing things","chinese":"传统文化和常规做事方式的侵蚀"},{"number":10,"original":"young people","noun_form":"young people","chinese":"年轻人"},{"number":11,"original":"rejecting the culture in which they","noun_form":"grew up rejecting their own culture","chinese":"拒绝自己的文化"},{"number":12,"original":"imitating the Hollywood models","noun_form":"imitating the Hollywood models","chinese":"模仿好莱坞榜样"}]},{"source":"周预测","order":9,"title":"Manager 经理应该自我提升","code":"111112","priority":"极高频 今日预测 困难","category":"概念类","answer":"Although managers are busy, they should read more books and go back to university to improve themselves. The best manager is not someone who knows their organization better, but someone who is a professor of management and with broad perspectives. Experience is not necessary, but management knowledge is much more important because learning management is a highlighted point for being a manager. (62 words)","logic":"","audio":"","keywords":[{"number":1,"original":"managers are busy","noun_form":"busy managers","chinese":"忙碌的经理"},{"number":2,"original":"read more books","noun_form":"reading more books","chinese":"多读书"},{"number":3,"original":"go back to university","noun_form":"going back to university","chinese":"回到大学"},{"number":4,"original":"improve themselves","noun_form":"self-improvement","chinese":"自我提升"},{"number":5,"original":"the best manager","noun_form":"the best manager","chinese":"最好的经理"},{"number":6,"original":"someone who knows their organization better","noun_form":"someone who knows their organization better","chinese":"更了解自己组织的人"},{"number":7,"original":"a professor of management","noun_form":"a professor of management","chinese":"一位管理学专家"},{"number":8,"original":"broad perspectives","noun_form":"broad perspectives","chinese":"广阔视野"},{"number":9,"original":"experience","noun_form":"experience","chinese":"经验"},{"number":10,"original":"management knowledge","noun_form":"management knowledge","chinese":"管理知识"},{"number":11,"original":"learning management","noun_form":"learning management","chinese":"学习管理"},{"number":12,"original":"a highlighted point","noun_form":"a highlighted point","chinese":"一个亮点"}]},{"source":"周预测","order":10,"title":"Canned Food during the Great Depression 大萧条时期的罐装食品","code":"111121","priority":"极高频 今日预测 简单","category":"现象类","answer":"Large amounts of canned food entered the market during the Great Depression, so refrigerators became highly popular in both cities and rural areas. With the help of the Rural Electrification Administration, farmers were able to purchase appliances, leading to the rise of frozen foods. This marked the beginning of modern food technology, and since then, Americans began to see more supermarkets where there were more freezer cases and canned foods. (70 words)","logic":"","audio":"","keywords":[{"number":1,"original":"canned food","noun_form":"canned food","chinese":"罐装食物"},{"number":2,"original":"entered the market","noun_form":"entering the market","chinese":"流入市场"},{"number":3,"original":"the Great Depression","noun_form":"the Great Depression","chinese":"大萧条"},{"number":4,"original":"refrigerators","noun_form":"refrigerators","chinese":"冰箱"},{"number":5,"original":"highly popular","noun_form":"high popularity","chinese":"更高的流行度"},{"number":6,"original":"cities and rural areas","noun_form":"cities and rural areas","chinese":"城市和农村地区"},{"number":7,"original":"the Rural Electrification Administration","noun_form":"the Rural Electrification Administration","chinese":"农村电气化管理"},{"number":8,"original":"farmers","noun_form":"farmers","chinese":"农民"},{"number":9,"original":"purchase appliances","noun_form":"purchasing appliances","chinese":"购买电器"},{"number":10,"original":"the rise of frozen foods","noun_form":"the rise of frozen foods","chinese":"冷冻食品的兴起"},{"number":11,"original":"the beginning of modern food technology","noun_form":"the beginning of modern food technology","chinese":"现代视频技术的开端"},{"number":12,"original":"Americans","noun_form":"Americans","chinese":"美国人"},{"number":13,"original":"supermarkets","noun_form":"supermarkets","chinese":"超市"},{"number":14,"original":"freezer cases","noun_form":"freezer cases","chinese":"冷冻箱"}]},{"source":"周预测","order":11,"title":"Synthetic Biology & Genetic Engineering 合成生物学与基因工程","code":"111123","priority":"极高频 今日预测 困难","category":"叙事类","answer":"Synthetic biology of the biological system is the next level of genetic engineering. 40 years ago, we were able to cut and paste DNA from one organism to another, but now we can synthesize DNA to create new organisms. Besides, scientists are building a cellular factory where you can get billions of bacteria from one bacterium. (56 words)","logic":"","audio":"","keywords":[{"number":1,"original":"synthetic biology","noun_form":"synthetic biology","chinese":"合成生物学"},{"number":2,"original":"the biological system","noun_form":"the biological system","chinese":"生物系统"},{"number":3,"original":"the next level of genetic engineering","noun_form":"the next level of genetic engineering","chinese":"基因工程的下个阶段"},{"number":4,"original":"40 years ago","noun_form":"past 40 years","chinese":"过去的40年"},{"number":5,"original":"cut and paste DNA from one organism to another","noun_form":"cutting and pasting DNA from one organism to another","chinese":"从另一个生物体中复制粘贴 DNA"},{"number":6,"original":"synthesize DNA","noun_form":"synthesizing DNA","chinese":"合成DNA"},{"number":7,"original":"create new organisms","noun_form":"creating new organisms","chinese":"创造新生物体"},{"number":8,"original":"building a cellular factory","noun_form":"building a cellular factory","chinese":"创建细胞工厂"},{"number":9,"original":"get billions of bacteria from one bacterium","noun_form":"getting billions of bacteria from one bacterium","chinese":"从一个细菌中获得数亿细菌"}]},{"source":"周预测","order":12,"title":"Organization Studies 组织研究","code":"111147","priority":"极高频 今日预测 困难","category":"概念类","answer":"The two speakers are talking about organization studies and how to appreciate them. Organization studies are about a whole family of disciplines, such as social science, psychology, sociology, history, and cultural studies. The speaker enjoys doing organization studies because of their broad range and breadth. What organization studies have taught him is liberating ideas without disciplinary divisions. (57 words)","logic":"","audio":"","keywords":[{"number":1,"original":"organization studies","noun_form":"organization studies","chinese":"组织研究"},{"number":2,"original":"appreciate them the","noun_form":"appreciation of organization studies","chinese":"理解组织研究"},{"number":3,"original":"a whole family of disciplines","noun_form":"a whole family of disciplines","chinese":"一整套的学科"},{"number":4,"original":"social science","noun_form":"social science","chinese":"社会科学"},{"number":5,"original":"psychology","noun_form":"psychology","chinese":"心理学"},{"number":6,"original":"sociology","noun_form":"sociology","chinese":"社会学"},{"number":7,"original":"history","noun_form":"history","chinese":"历史学"},{"number":8,"original":"cultural studies","noun_form":"cultural studies","chinese":"文化研究"},{"number":9,"original":"enjoys doing organization studies","noun_form":"enjoying doing organization stu dies","chinese":"喜欢进行组织研究"},{"number":10,"original":"broad range and breadth","noun_form":"broad range and breadth","chinese":"宽度与广度"},{"number":11,"original":"liberating ideas without disciplinary divisions","noun_form":"liberating ideas without disciplinary divisions","chinese":"解放思想，打破学科的划分"}]},{"source":"周预测","order":13,"title":"Australian Immigration 澳大利亚移民","code":"111181","priority":"极高频 今日预测 困难","category":"叙事类","answer":"The ancestors of the present indigenous people were the first inhabitants in Australia about 43000 years before present. The Aboriginal community was established and continued to develop, diversify and settle on this continent. During the 1970s and 1980s, refugees migrated to Australia, and Australia began to adopt the multiculturalism policy. In 2004-2005, Australia accepted new settlers, increasing the immigrant population, most of whom came from Asia and moved to Sydney. (70 words)","logic":"","audio":"","keywords":[{"number":1,"original":"the ancestors of the present indigenous people","noun_form":"the ancestors of the present indigenous people","chinese":"当今原住民的祖先"},{"number":2,"original":"the first inhabitants","noun_form":"the first inhabitants","chinese":"第一批居民"},{"number":3,"original":"Australia","noun_form":"Australia","chinese":"澳大利亚"},{"number":4,"original":"43000 years before present","noun_form":"43000 years before present","chinese":"距今43000年"},{"number":5,"original":"the Aboriginal community","noun_form":"the Aboriginal community","chinese":"原住民社区"},{"number":6,"original":"develop, diversify and settle","noun_form":"development, diversification and settlement","chinese":"发展、多样化及定居"},{"number":7,"original":"the 1970s and 1980s","noun_form":"the 1970s and 1980s","chinese":"1970和80年代"},{"number":8,"original":"refugees","noun_form":"refugees","chinese":"难民"},{"number":9,"original":"the multiculturalism policy","noun_form":"the multiculturalism policy","chinese":"多元文化政策"},{"number":10,"original":"2004-2005","noun_form":"2004-2005","chinese":"2004到2005年"},{"number":11,"original":"new settlers","noun_form":"new settlers","chinese":"新移民"},{"number":12,"original":"the immigrant population","noun_form":"the immigrant population","chinese":"移民人口"},{"number":13,"original":"Asia","noun_form":"Asia","chinese":"亚洲"},{"number":14,"original":"Sydney","noun_form":"Sydney","chinese":"悉尼"}]},{"source":"周预测","order":14,"title":"The Stability of Mood 情绪稳定","code":"111185","priority":"极高频 今日预测 困难","category":"实验类","answer":"The stability of mood may vary among different people. Some people easily get intense, and their moods are like riding a roller coaster, while others may be loose all the time. According to the research, the secret of happiness is mild contentment. We should find a balance between intense and loose emotions. (52 words)","logic":"","audio":"","keywords":[{"number":1,"original":"the stability of mood","noun_form":"the stability of mood","chinese":"情绪稳定性"},{"number":2,"original":"vary among different people","noun_form":"variation among different people","chinese":"不同人之间的差异/因人而异"},{"number":3,"original":"easily get intense","noun_form":"getting intense easily","chinese":"容易情绪激动"},{"number":4,"original":"riding a roller coaster","noun_form":"riding a roller coaster","chinese":"坐过山车"},{"number":5,"original":"loose","noun_form":"loose emotions","chinese":"轻松的情绪"},{"number":6,"original":"the secret of happiness","noun_form":"the secret of happiness","chinese":"幸福的秘诀"},{"number":7,"original":"mild contentment","noun_form":"mild contentment","chinese":"适度的满足感"},{"number":8,"original":"a balance between intense and loose emotions","noun_form":"a balance between intense and loose emotions","chinese":"强烈与轻松情感间的平衡"}]},{"source":"周预测","order":15,"title":"Hook 议论文开篇","code":"111206","priority":"极高频 今日预测 普通","category":"概念类","answer":"A hook is important for writing a persuasive essay, which is intended to grab the reader's attention on the controversial issue. A hook is in the first paragraph with four or five sentences in length. The goal of a hook is to provoke emotional interest by using statistics and facts, presenting hypothetical or worst-case scenarios, and using strong wording to show the urgency of the addressed topic. (67 words)","logic":"","audio":"","keywords":[{"number":1,"original":"a hook","noun_form":"a hook","chinese":"议论文开篇"},{"number":2,"original":"writing a persuasive essay","noun_form":"writing a persuasive essay","chinese":"写议论文"},{"number":3,"original":"grab the reader's attention","noun_form":"grabbing the reader's attention","chinese":"抓住读者的注意"},{"number":4,"original":"the controversial issue","noun_form":"the controversial issue","chinese":"争议性的话题"},{"number":5,"original":"the first paragraph","noun_form":"the first paragraph","chinese":"第一段"},{"number":6,"original":"four or five sentences in length","noun_form":"four or five sentences in length","chinese":"四五句话的长度"},{"number":7,"original":"provoke emotional interest","noun_form":"provoking emotional interest","chinese":"引发情感共鸣"},{"number":8,"original":"using statistics and facts","noun_form":"using statistics and facts","chinese":"使用数据和事实"},{"number":9,"original":"presenting hypothetical or worst-case scenarios","noun_form":"presenting hypothetical or worst-case scenarios","chinese":"呈现假设的或最坏的情形"},{"number":10,"original":"using strong wording","noun_form":"using strong wording","chinese":"使用强烈的措辞"},{"number":11,"original":"the urgency of the addressed topic","noun_form":"the urgency of the addressed topic","chinese":"所讨论话题的紧迫性"}]},{"source":"周预测","order":16,"title":"Population Growth 人口增长","code":"111212","priority":"极高频 今日预测 困难","category":"现象类","answer":"Population growth has become a big challenge. So far, the world population has grown to seven billion. The biggest challenge we are facing is the limited resources, such as the water crisis, climate change and the food crisis. Moreover, population growth is not equally distributed across different parts of the world, which may change the balance of power. It is predicted that some cities will exceed 20 million people. (68 words)","logic":"","audio":"","keywords":[{"number":1,"original":"population growth","noun_form":"population growth","chinese":"人口增长"},{"number":2,"original":"a big challenge","noun_form":"a big challenge","chinese":"一个巨大的挑战"},{"number":3,"original":"the world population","noun_form":"the world population","chinese":"世界人口"},{"number":4,"original":"grown to seven billion","noun_form":"growing to seven billion","chinese":"增长到七十亿"},{"number":5,"original":"the limited resources","noun_form":"the limited resources","chinese":"有限的资源"},{"number":6,"original":"the water crisis","noun_form":"the water crisis","chinese":"水资源危机"},{"number":7,"original":"climate change","noun_form":"climate change","chinese":"气候变化"},{"number":8,"original":"the food crisis","noun_form":"the food crisis","chinese":"食物危机"},{"number":9,"original":"not equally distributed","noun_form":"unequal distribution","chinese":"分配不均"},{"number":10,"original":"change the balance of power","noun_form":"changing the balance of power","chinese":"改变权力的平衡"},{"number":11,"original":"predicted","noun_form":"prediction","chinese":"预测"},{"number":12,"original":"some cities","noun_form":"some cities","chinese":"某些城市"},{"number":13,"original":"exceed 20 million people","noun_form":"exceeding 20 million people","chinese":"超过两千万人"}]},{"source":"周预测","order":17,"title":"Tree Rings 年轮","code":"111003","priority":"极高频 重回 今日预测 困难","category":"概念类","answer":"Dendrochronologists study hidden information in tree rings that indicate the climate, just like a Morse code but with richer content. The width of tree rings indicates the rain and drought, so scientists cut down trees and count the tree rings inward to collect information. The study of tree rings can help scientists to reconstruct the climate. (56 words)","logic":"","audio":"","keywords":[{"number":1,"original":"dendrochronologists","noun_form":"dendrochronologists","chinese":"树木年代学家"},{"number":2,"original":"tree rings","noun_form":"tree rings","chinese":"树木年轮"},{"number":3,"original":"hidden information","noun_form":"hidden information","chinese":"隐藏的信息"},{"number":4,"original":"indicate the climate","noun_form":"indicating the climate","chinese":"反映气候"},{"number":5,"original":"a Morse code","noun_form":"a Morse code","chinese":"摩斯密码"},{"number":6,"original":"richer content","noun_form":"richer content","chinese":"更丰富的内容"},{"number":7,"original":"the width of tree rings","noun_form":"the width of tree rings","chinese":"树木年轮的宽度"},{"number":8,"original":"rain and drought","noun_form":"rain and drought","chinese":"降雨与干旱"},{"number":9,"original":"cut down trees","noun_form":"cutting down trees","chinese":"砍掉树木"},{"number":10,"original":"count the tree rings inward","noun_form":"counting the tree rings inward","chinese":"外向内数年轮"},{"number":11,"original":"collect information","noun_form":"collecting information","chinese":"收集信息"},{"number":12,"original":"scientists","noun_form":"scientists","chinese":"科学家们"},{"number":13,"original":"reconstruct the climate","noun_form":"reconstructing the climate","chinese":"重建气候"}]},{"source":"周预测","order":18,"title":"Vitamin D 维他命D [V1: 阳光维他命]","code":"111013","priority":"极高频 重回 今日预测 困难","category":"概念类","answer":"Vitamin D is called the sunshine vitamin because there is no dietary need for vitamin D if you are exposed to adequate sunshine, so vitamin D is in fact a prohormone. When human beings lived in tropical climates with sufficient skin exposure to sunlight, there was no dietary need for vitamin D. However, migration away from equatorial regions created a dietary need for vitamin D, especially in winter. (68 words)","logic":"","audio":"","keywords":[{"number":1,"original":"Vitamin D","noun_form":"Vitamin D","chinese":"维生素 D"},{"number":2,"original":"the sunshine vitamin","noun_form":"a sunshine vitamin","chinese":"阳光维生素"},{"number":3,"original":"adequate sunshine","noun_form":"adequate sunshine","chinese":"足够的阳光"},{"number":4,"original":"no dietary need","noun_form":"no dietary need","chinese":"没有饮食需求"},{"number":5,"original":"a prohormone","noun_form":"a prohormone","chinese":"激素原"},{"number":6,"original":"tropical climates","noun_form":"tropical climates","chinese":"热带气候"},{"number":7,"original":"sufficient skin exposure to sunlight","noun_form":"sufficient skin exposure to sunlight","chinese":"皮肤充分暴露在阳光下"},{"number":8,"original":"migration away from equatorial regions","noun_form":"migration away from equatorial regions","chinese":"迁移到赤道以外地区"},{"number":9,"original":"a dietary need","noun_form":"a dietary need","chinese":"饮食需求"},{"number":10,"original":"winter","noun_form":"winter","chinese":"冬季"}]},{"source":"周预测","order":19,"title":"Einstein 爱因斯坦","code":"111026","priority":"极高频 重回 今日预测 简单","category":"叙事类","answer":"For thousands of years, people believed that the world was like a flat floor and the universe was absolutely fixed and unchangeable. This view was transformed by Einstein in the 20th century, who suggested that the universe is under continuous dynamic change all the time. However, this was just a prediction from Einstein. The honor of discovering this theory fell to astronomer Edwin Hubble. (64 words)","logic":"","audio":"","keywords":[{"number":1,"original":"the world","noun_form":"the world","chinese":"世界"},{"number":2,"original":"a flat floor","noun_form":"a flat floor","chinese":"一块平坦的地"},{"number":3,"original":"the universe","noun_form":"the universe","chinese":"宇宙"},{"number":4,"original":"absolutely fixed and unchangeable","noun_form":"absolutely fixed and unchangeable universe","chinese":"完全固定且不变的（宇宙）"},{"number":5,"original":"the 20th century","noun_form":"the 20th century","chinese":"20世纪"},{"number":6,"original":"Einstein","noun_form":"Einstein","chinese":"爱因斯坦"},{"number":7,"original":"continuous dynamic change","noun_form":"continuous dynamic change","chinese":"持续的动态变化"},{"number":8,"original":"a prediction","noun_form":"a prediction","chinese":"预测"},{"number":9,"original":"the honor of discovering this theory","noun_form":"the honor of discovering this theory","chinese":"这一理论发现的荣誉"},{"number":10,"original":"astronomer","noun_form":"an astronomer","chinese":"天文学家"},{"number":11,"original":"Edwin Hubble","noun_form":"Edwin Hubble","chinese":"埃德温·哈勃"}]},{"source":"周预测","order":20,"title":"Tea and Coffee in England 英国的咖啡与茶","code":"111034","priority":"极高频 重回 今日预测 简单","category":"现象类","answer":"The three most favorite drinks in England are chocolate, coffee, and tea. Tea, as the most popular drink, was very expensive and could only be ordered by men in public. Men could have tea in a coffeehouse to enjoy social freedom, make trades, and have business chats. However, women could only drink tea in private places or wait for their husbands to bring tea back home. (66 words)","logic":"","audio":"","keywords":[{"number":1,"original":"the three most favorite drinks in England","noun_form":"the three most favorite drinks in England","chinese":"英国最受欢迎的三种饮品"},{"number":2,"original":"chocolate","noun_form":"chocolate","chinese":"巧克力"},{"number":3,"original":"coffee","noun_form":"coffee","chinese":"咖啡"},{"number":4,"original":"tea","noun_form":"tea","chinese":"茶"},{"number":5,"original":"the most popular drink","noun_form":"the most popular drink","chinese":"最受欢迎的饮品"},{"number":6,"original":"expensive","noun_form":"expensive drink","chinese":"昂贵的饮品"},{"number":7,"original":"only be ordered by men in public","noun_form":"being ordered by men in public","chinese":"男性在公共场合点用"},{"number":8,"original":"enjoy social freedom","noun_form":"enjoying social freedom","chinese":"享有社交自由"},{"number":9,"original":"make trades","noun_form":"making trades","chinese":"进行交易"},{"number":10,"original":"business chats","noun_form":"business chats","chinese":"商务交谈"},{"number":11,"original":"women","noun_form":"women","chinese":"女性"},{"number":12,"original":"private places","noun_form":"private places","chinese":"私人场所"},{"number":13,"original":"husbands","noun_form":"husbands","chinese":"丈夫"}]},{"source":"周预测","order":21,"title":"The Definition of Risk 定义风险","code":"111043","priority":"极高频 重回 今日预测 简单","category":"概念类","answer":"The lecture on risk analysis focuses on the definition of risk and safety. There are two literal definitions of ‘risk’ in dictionaries. One means the possibility of loss or injury, while the other means the consequences of some kinds of danger. Moreover, the definition of ‘safe’ or ‘safety’ means being free from harm, which is a simple notion of being safe or not safe. (70 words)","logic":"","audio":"","keywords":[{"number":1,"original":"risk analysis","noun_form":"risk analysis","chinese":"风险分析"},{"number":2,"original":"the definition of risk and safety","noun_form":"the definition of risk and safety","chinese":"风险和安全的定义"},{"number":3,"original":"dictionaries","noun_form":"dictionaries","chinese":"词典"},{"number":4,"original":"two literal definitions","noun_form":"two literal definitions","chinese":"两个字面定义"},{"number":5,"original":"the possibility of loss or injury","noun_form":"the possibility of loss or injury","chinese":"损失或受伤的可能性"},{"number":6,"original":"the consequences of some kinds of danger","noun_form":"the consequences of some kinds of danger","chinese":"某种危险所带来的后果"},{"number":7,"original":"being free from harm","noun_form":"being free from harm","chinese":"免受伤害"},{"number":8,"original":"a simple notion","noun_form":"a simple notion","chinese":"一个简单的概念"}]},{"source":"周预测","order":22,"title":"Wildlife as Food and Income 野生动物作为食物与经济来源","code":"111046","priority":"极高频 重回 今日预测 简单","category":"现象类","answer":"Wildlife has an important role in livelihood, especially in most East and West Africa. All humans depend on wildlife as a source of food and income. Fish is the primary source of animal protein for billions of people in poverty. Therefore, the management of fish resources is crucial for livelihoods and health. Besides, wildlife tourism can be the top source of income in many countries. (65 words)","logic":"","audio":"","keywords":[{"number":1,"original":"wildlife","noun_form":"wildlife","chinese":"野生动物"},{"number":2,"original":"livelihood","noun_form":"livelihood","chinese":"生计"},{"number":3,"original":"an important role","noun_form":"an important role","chinese":"重要角色"},{"number":4,"original":"East and West Africa","noun_form":"East and West Africa","chinese":"东非和西非"},{"number":5,"original":"humans","noun_form":"humans","chinese":"人类"},{"number":6,"original":"a source of food and income","noun_form":"a source of food and income","chinese":"食物和收入来源"},{"number":7,"original":"fish","noun_form":"fish","chinese":"鱼类"},{"number":8,"original":"poverty","noun_form":"poverty","chinese":"贫困"},{"number":9,"original":"animal protein","noun_form":"animal protein","chinese":"动物蛋白"},{"number":10,"original":"the management of fish resources","noun_form":"the management of fish resources","chinese":"鱼类资源管理"},{"number":11,"original":"health","noun_form":"health","chinese":"健康"},{"number":12,"original":"wildlife tourism","noun_form":"wildlife tourism","chinese":"野生动物旅游"},{"number":13,"original":"the top source of income","noun_form":"the top source of income","chinese":"最主要的收入来源"}]},{"source":"周预测","order":23,"title":"Big Bang Theory 宇宙大爆炸","code":"111047","priority":"极高频 重回 今日预测 简单","category":"叙事类","answer":"In cosmology, scientists previously believed the Big Bang happened about 10 to 20 billion years ago. Now, we know the universe started in a Big Bang over 13.8 billion years ago. The laws of physics can explain how the stars work. It fits well, as the universe is older than the oldest star. We know how the universe began, but we don't know what will happen in the future. (69 words)","logic":"","audio":"","keywords":[{"number":1,"original":"cosmology","noun_form":"cosmology","chinese":"宇宙学"},{"number":2,"original":"scientists","noun_form":"scientists","chinese":"科学家"},{"number":3,"original":"the Big Bang","noun_form":"the Big Bang","chinese":"大爆炸"},{"number":4,"original":"10 to 20 billion years","noun_form":"ago 10 to 20 billion years","chinese":"100亿到 200 亿年"},{"number":5,"original":"the universe","noun_form":"the universe","chinese":"宇宙"},{"number":6,"original":"started in a Big Bang over 13.8 billion years ago","noun_form":"starting in a Big Bang over 13.8 billion years ago","chinese":"在 138 亿年前的大爆炸中诞生"},{"number":7,"original":"the law of physics","noun_form":"the law of physics","chinese":"物理定律"},{"number":8,"original":"explain how the stars work","noun_form":"explaining how the stars work","chinese":"解释恒星如何运作"},{"number":9,"original":"fits well","noun_form":"fitting well","chinese":"契合良好 （合理）"},{"number":10,"original":"the universe is older than the oldest star","noun_form":"universe being older than the oldest star","chinese":"宇宙比最古老的恒星更古老"},{"number":11,"original":"how the universe began","noun_form":"how the universe began","chinese":"宇宙如何开始"},{"number":12,"original":"what will happen in the future","noun_form":"what will happen in the future","chinese":"未来会发生什么"}]},{"source":"周预测","order":24,"title":"The Decline of Bees 蜜蜂数量减少","code":"111050","priority":"极高频 重回 今日预测 困难","category":"现象类","answer":"One of the various conclusions is that bees are in decline, which is well-documented and supported by good, strong scientific evidence. The drivers of decline vary across species. Although the effects of pollinator loss are not catastrophic now, they could be. However, the positive side is that people are aware of the problem and are taking action to fix the recognized problems. (68 words)","logic":"","audio":"","keywords":[{"number":1,"original":"conclusions","noun_form":"conclusions","chinese":"结论"},{"number":2,"original":"bees are in decline","noun_form":"decline of bees","chinese":"蜜蜂数量减少"},{"number":3,"original":"well-documented a","noun_form":"well-documented conclusion","chinese":"一个有充分记录的结论"},{"number":4,"original":"supported by good, strong scientific evidence","noun_form":"being supported by good, strong scientific evidence","chinese":"受到强有力的科学证据支持"},{"number":5,"original":"drivers","noun_form":"drivers","chinese":"驱动因素"},{"number":6,"original":"vary across species","noun_form":"variation across species","chinese":"因物种有差异"},{"number":7,"original":"effects","noun_form":"effects","chinese":"影响"},{"number":8,"original":"pollinator loss","noun_form":"pollinator loss","chinese":"传粉昆虫的减少"},{"number":9,"original":"not catastrophic","noun_form":"a catastrophe","chinese":"灾难"},{"number":10,"original":"the positive side","noun_form":"the positive side","chinese":"积极的一面"},{"number":11,"original":"aware of the problem","noun_form":"awareness of the problem","chinese":"知晓问题"},{"number":12,"original":"taking actions","noun_form":"taking actions","chinese":"采取行动"},{"number":13,"original":"fix the recognized problems","noun_form":"fixing the recognized problems","chinese":"解决已知的问题"}]},{"source":"周预测","order":25,"title":"Smart Consumers and Brand 品牌与顾客需求","code":"111053","priority":"极高频 重回 今日预测 简单","category":"概念类","answer":"A brand is essential to smart consumers because they make decisions based on brands and would pay more for a better brand. However, the Second Moment of Truth is also important, which means after they went home with the products they bought, the product must be of great quality. However, there are fundamental engineering contradictions as consumers want products that are both strong and soft, or both light and strong. (70 words)","logic":"","audio":"","keywords":[{"number":1,"original":"a brand","noun_form":"a brand","chinese":"品牌"},{"number":2,"original":"smart consumers","noun_form":"smart consumers","chinese":"精明消费者"},{"number":3,"original":"essential an","noun_form":"essential thing","chinese":"重要的事情"},{"number":4,"original":"make decisions","noun_form":"making decisions","chinese":"做出决定"},{"number":5,"original":"pay more for a better brand","noun_form":"paying more for a better brand","chinese":"为更好的品牌付出更高价格"},{"number":6,"original":"the Second Moment of Truth","noun_form":"the Second Moment of Truth","chinese":"第二真相时刻"},{"number":7,"original":"went home with the products they bought","noun_form":"going home with the products they bought","chinese":"把他们购买的产品带回家"},{"number":8,"original":"great quality","noun_form":"great quality","chinese":"高品质"},{"number":9,"original":"fundamental engineering contradictions","noun_form":"fundamental engineering contradictions","chinese":"根本性的工程矛盾"},{"number":10,"original":"strong and soft","noun_form":"strong and soft products","chinese":"既坚固又柔软的产品"},{"number":11,"original":"light and strong","noun_form":"light and strong products","chinese":"既轻便又坚固的产品"}]},{"source":"周预测","order":26,"title":"Misuse of Drugs 用药不当的危害","code":"111054","priority":"极高频 重回 今日预测 普通","category":"现象类","answer":"Keeping drugs at home can be dangerous because the drugs may be accidentally taken by children, or patients may take the drugs after the expiration date. Taking the leftover drugs for the wrong reasons by someone who has an allergy or for the wrong indications is also very dangerous. To prevent this, physicians should give appropriate prescriptions and must ensure patients complete the full course of the drug. (68 words)","logic":"","audio":"","keywords":[{"number":1,"original":"keeping drugs at home","noun_form":"keeping drugs at home","chinese":"把药物存放在家中"},{"number":2,"original":"dangerous","noun_form":"danger","chinese":"危险"},{"number":3,"original":"accidentally taken by children","noun_form":"being accidentally taken by children","chinese":"被儿童意外服用"},{"number":4,"original":"patients","noun_form":"patients","chinese":"患者"},{"number":5,"original":"the expiration date","noun_form":"the expiration date","chinese":"有效期"},{"number":6,"original":"take the drugs","noun_form":"taking the drugs","chinese":"服用药物"},{"number":7,"original":"the wrong reasons","noun_form":"the wrong reasons","chinese":"错误的原因"},{"number":8,"original":"taking the leftover drugs","noun_form":"taking the leftover drugs","chinese":"服用剩余药物"},{"number":9,"original":"an allergy","noun_form":"an allergy","chinese":"过敏"},{"number":10,"original":"the wrong indications","noun_form":"the wrong indications","chinese":"错误适应症"},{"number":11,"original":"prevent","noun_form":"prevention","chinese":"预防"},{"number":12,"original":"physicians","noun_form":"physicians","chinese":"医生"},{"number":13,"original":"give appropriate prescriptions","noun_form":"giving appropriate prescriptions","chinese":"开出适当处方"},{"number":14,"original":"complete the full course","noun_form":"completing the full course","chinese":"完成整个疗程"}]},{"source":"周预测","order":27,"title":"Newspaper Industry 新闻业下滑","code":"111096","priority":"极高频 重回 今日预测 困难","category":"现象类","answer":"The economic models of newspapers are crumbling. The newspaper industry has been shrinking dramatically in the second half of the 20th century. Some newspaper publishers’ cash flow was red or just maintained at the breakeven point due to the decreasing number of advertising and buyers. Some newspapers are no longer published daily, and some are online only. The staff in the newspaper industry has dropped by 30% to 40%. (69 words)","logic":"","audio":"","keywords":[{"number":1,"original":"the economic models of newspapers","noun_form":"the economic models of newspapers","chinese":"报纸的经济模式"},{"number":2,"original":"crumbling","noun_form":"crumbling","chinese":"崩塌"},{"number":3,"original":"the newspaper industry","noun_form":"the newspaper industry","chinese":"报业"},{"number":4,"original":"shrinking","noun_form":"shrinking","chinese":"萎缩"},{"number":5,"original":"newspaper publishers’ cash flow was red","noun_form":"newspaper publishers’ red cash flow","chinese":"报社现金流赤字"},{"number":6,"original":"the breakeven point","noun_form":"the breakeven point","chinese":"收支平衡点"},{"number":7,"original":"the decreasing number of advertising and buyers","noun_form":"the decreasing number of advertising and buyers","chinese":"广告和读者数量减少"},{"number":8,"original":"online only","noun_form":"being online only","chinese":"仅限线上发行"},{"number":9,"original":"staff","noun_form":"staff","chinese":"员工"},{"number":10,"original":"dropped","noun_form":"a drop","chinese":"下降"}]},{"source":"周预测","order":28,"title":"Automated Vehicles 自动化汽车","code":"111097","priority":"极高频 重回 今日预测 困难","category":"概念类","answer":"Automation technology in vehicles is a hot topic because it is safe and more fuel-efficient. According to the American Traffic Safety Regulations, there are different levels of automation. Level four is completely under the control of the vehicle, so people don't need to do anything. Level three is conditional automation, so drivers must intervene under some circumstances, which is more acceptable to most of the public. (66 words)","logic":"","audio":"","keywords":[{"number":1,"original":"automation technology in vehicles","noun_form":"automation technology in vehicles","chinese":"车辆自动化技术"},{"number":2,"original":"a hot topic","noun_form":"a hot topic","chinese":"热门话题"},{"number":3,"original":"safe","noun_form":"safety","chinese":"安全"},{"number":4,"original":"fuel-efficient","noun_form":"fuel-efficient technology","chinese":"节能技术"},{"number":5,"original":"the American Traffic Safety Regulations","noun_form":"the American Traffic Safety Regulations","chinese":"美国交通安全法规"},{"number":6,"original":"different levels of automation","noun_form":"different levels of automation","chinese":"不同的自动化等级"},{"number":7,"original":"level four","noun_form":"level four","chinese":"四级"},{"number":8,"original":"completely under vehicle control","noun_form":"being completely under vehicle control","chinese":"完全由车辆控制"},{"number":9,"original":"level three","noun_form":"level three","chinese":"三级"},{"number":10,"original":"conditional automation","noun_form":"conditional automation","chinese":"有条件自动化"},{"number":11,"original":"drivers","noun_form":"drivers","chinese":"驾驶员"},{"number":12,"original":"intervene under circumstances","noun_form":"intervening under circumstances","chinese":"在特定情境下介入"},{"number":13,"original":"more acceptable to most of the public","noun_form":"more acceptable technology to most of the public","chinese":"对大多数公众更可接受的技术"}]},{"source":"周预测","order":29,"title":"The History of Software软件发展史","code":"111116","priority":"极高频 重回 今日预测 困难","category":"现象类","answer":"The history of the software and IT industry is fairly new, but it has become a major new discipline in a short time. Thanks to the rapid expansion in computing and the rapid fall of computing costs and storage costs, IT has moved into all areas of life. Thus, there has been a stampede, according to Moore’s Law, which will continue to guide the development in the future. (70 words)","logic":"","audio":"","keywords":[{"number":1,"original":"the history of the software and IT industry","noun_form":"the history of the software and IT industry","chinese":"软件和 IT 行业的历史"},{"number":2,"original":"new a","noun_form":"new industry","chinese":"一个新的行业"},{"number":3,"original":"a short time","noun_form":"a short time","chinese":"很短的时间"},{"number":4,"original":"a major new discipline","noun_form":"a major new discipline","chinese":"最主流的行业"},{"number":5,"original":"computing","noun_form":"computing","chinese":"计算"},{"number":6,"original":"the rapid expansion","noun_form":"the rapid expansion","chinese":"迅速扩张"},{"number":7,"original":"computing costs","noun_form":"computing costs","chinese":"计算成本"},{"number":8,"original":"storage costs","noun_form":"storage costs","chinese":"存储成本"},{"number":9,"original":"the rapid fall","noun_form":"the rapid fall","chinese":"迅速下降"},{"number":10,"original":"all areas of life","noun_form":"all areas of life","chinese":"生活的各个领域"},{"number":11,"original":"Moore’s Law","noun_form":"Moore’s Law","chinese":"摩尔定律"},{"number":12,"original":"a stampede","noun_form":"a stampede","chinese":"热潮"},{"number":13,"original":"guide the development in the future","noun_form":"guiding the development in the future","chinese":"引领未来的发展"}]},{"source":"周预测","order":30,"title":"Roman City Planning 罗马城市规划","code":"111122","priority":"极高频 重回 今日预测 困难","category":"概念类","answer":"Rome grew in an ad hoc way, meaning it wasn’t planned all at once but grew over time since the 8th century B.C. However, Romans structured their cities in a very methodical way based on military strategy and planning. In this way, they built camps that were laid out in a geometric plan, usually square or rectangular. That’s why ideal Roman cities are called military camp designs. (67 words)","logic":"","audio":"","keywords":[{"number":1,"original":"Rome","noun_form":"Rome","chinese":"罗马"},{"number":2,"original":"an ad hoc way","noun_form":"an ad hoc way","chinese":"特殊方式"},{"number":3,"original":"it wasn’t planned all at once","noun_form":"planning that isn’t all at once","chinese":"不是一次规划出来的"},{"number":4,"original":"grew over time","noun_form":"growing over time","chinese":"慢慢发展的"},{"number":5,"original":"the 8th century B.C","noun_form":"the 8th century B.C","chinese":"公元前8世纪"},{"number":6,"original":"Romans","noun_form":"Romans","chinese":"罗马人"},{"number":7,"original":"structured their cities","noun_form":"their cities’ structure","chinese":"规划他们城市"},{"number":8,"original":"a very methodical way","noun_form":"a very methodical way","chinese":"有条理的方式"},{"number":9,"original":"military strategy and planning","noun_form":"military strategy and planning","chinese":"军事战略和规划"},{"number":10,"original":"camps","noun_form":"camps","chinese":"营地"},{"number":11,"original":"a geometric plan","noun_form":"a geometric plan","chinese":"几何图形式的平面布局"},{"number":12,"original":"square","noun_form":"square","chinese":"正方形"},{"number":13,"original":"rectangular","noun_form":"rectangle","chinese":"矩形"},{"number":14,"original":"ideal Roman cities","noun_form":"ideal Roman cities","chinese":"理想罗马城市"},{"number":15,"original":"military camp design","noun_form":"military camp design","chinese":"军营设计"}]},{"source":"周预测","order":31,"title":"Online Research 线上调研","code":"111126","priority":"极高频 重回 今日预测 简单","category":"概念类","answer":"The rapid growth of the Internet has changed our lives in terms of both quality and quantity. As for the advantages of online research, it is quick, less expensive, and can help us access hard-to-reach groups. However, online research has some drawbacks, as there is no face-to-face communication or body language, and the other side is not real people, so we don't know who they are. (66 words)","logic":"","audio":"","keywords":[{"number":1,"original":"the rapid growth of the Internet","noun_form":"the rapid growth of the Internet","chinese":"互联网的迅速发展"},{"number":2,"original":"changed our lives","noun_form":"changing our lives","chinese":"改变我们的生活"},{"number":3,"original":"quality and quantity","noun_form":"quality and quantity","chinese":"质量和数量"},{"number":4,"original":"advantages","noun_form":"advantages","chinese":"优点"},{"number":5,"original":"online research","noun_form":"online research","chinese":"线上调研"},{"number":6,"original":"quick","noun_form":"being quick","chinese":"快速"},{"number":7,"original":"less expensive","noun_form":"less expense","chinese":"更少成本"},{"number":8,"original":"access hard-to-reach groups","noun_form":"access to hard-to-reach groups","chinese":"接触难以接触到的群体"},{"number":9,"original":"drawbacks","noun_form":"drawbacks","chinese":"缺点"},{"number":10,"original":"no face-to-face communication or body language","noun_form":"no face-to-face communication or body language","chinese":"确实面对面交流或肢体语言"},{"number":11,"original":"real people","noun_form":"real people","chinese":"真人"},{"number":12,"original":"don’t know who they are","noun_form":"not knowing who they are","chinese":"不知道他们是谁"}]},{"source":"周预测","order":32,"title":"Negativity Bias 消极偏差","code":"111131","priority":"极高频 重回 今日预测 困难","category":"概念类","answer":"Negativity bias means humans usually pay more attention to negative emotions such as fears rather than positive emotions. We feel content and pleasant more frequently, but these positive emotions are lighter, which means they cannot be easily recalled or stay in our minds. However, negative emotions happen less frequently, but they are strong and intense. Negativity bias can help us evaluate the environment and survive when we face life-threatening issues. (70 words)","logic":"","audio":"","keywords":[{"number":1,"original":"negativity bias","noun_form":"negativity bias","chinese":"消极偏见"},{"number":2,"original":"pay more attention to negative emotions","noun_form":"paying more attention to negative emotions","chinese":"更关注负面情绪"},{"number":3,"original":"fears","noun_form":"fears","chinese":"恐惧"},{"number":4,"original":"positive emotions","noun_form":"positive emotions","chinese":"积极情绪"},{"number":5,"original":"content and pleasant","noun_form":"content and pleasant feelings","chinese":"满足与愉悦"},{"number":6,"original":"lighter","noun_form":"lighter emotions","chinese":"更浅"},{"number":7,"original":"cannot be easily recalled being","noun_form":"unable to be easily recalled","chinese":"不易被回忆起来"},{"number":8,"original":"stay in our minds","noun_form":"staying in our minds","chinese":"在脑海中留存"},{"number":9,"original":"happen less frequently","noun_form":"less frequent happening","chinese":"出现的频率更低"},{"number":10,"original":"strong and intense","noun_form":"strong and intense feelings","chinese":"强烈且浓烈"},{"number":11,"original":"evaluate the environment","noun_form":"evaluation of the environment","chinese":"评估所处环境"},{"number":12,"original":"survive when we face life- threatening issues","noun_form":"survival in the face of life- threatening issues","chinese":"在遭遇危及生命的状况时求得生存"}]},{"source":"周预测","order":33,"title":"Water Recycling 水的循环利用","code":"111134","priority":"极高频 重回 今日预测 困难","category":"问答类","answer":"Since we don’t generate much new water and the process of generating water is difficult, we need to recycle the water. Nowadays, water recycling for industrial use relies on lots of different technologies, but there is very little water recycling technology in the home. This is because in a modern home, people don’t think of recycling water when they use water at home. (67 words)","logic":"","audio":"","keywords":[{"number":1,"original":"don’t generate much new water","noun_form":"lack of generation of much new water","chinese":"无法大量生产新的水资源"},{"number":2,"original":"the process of generating water","noun_form":"the process of generating water","chinese":"制水流程"},{"number":3,"original":"difficult a","noun_form":"difficult process","chinese":"难度很高"},{"number":4,"original":"recycle the water","noun_form":"water recycling","chinese":"对水资源进行回收利用"},{"number":5,"original":"water recycling for industrial use","noun_form":"water recycling for industrial use","chinese":"工业用水的回收利用"},{"number":6,"original":"lots of different technologies","noun_form":"lots of different technologies","chinese":"多种不同技术"},{"number":7,"original":"little water recycling technology in the home","noun_form":"little water recycling technology in the home","chinese":"家用层面的水循环利用技术极为匮乏"},{"number":8,"original":"a modern home","noun_form":"a modern home","chinese":"现代家庭"},{"number":9,"original":"don’t think of recycling water a lack","noun_form":"of thought about recycling water","chinese":"不会想到要对水进行回收利用"}]},{"source":"周预测","order":34,"title":"Why Should We Read The Republic? 为什么要读《理想国》","code":"111139","priority":"极高频 重回 今日预测 困难","category":"概念类","answer":"We should read the Republic for many good reasons. First, it is readable because the genius Plato wrote it like a living conversation written in short answers, developing very important ideas. The second reason is the content of the book, as Plato is asking the fundamental question “why we should bother to be good” in a world where crime and injustice tread down good people. (67 words)","logic":"","audio":"","keywords":[{"number":1,"original":"the Republic","noun_form":"Republic 《","chinese":"理想国》"},{"number":2,"original":"reasons","noun_form":"reasons","chinese":"理由"},{"number":3,"original":"readable a","noun_form":"readable book","chinese":"易读的"},{"number":4,"original":"the genius Plato","noun_form":"the genius Plato","chinese":"天才柏拉图"},{"number":5,"original":"a living conversation","noun_form":"a living conversation","chinese":"生动活泼的对话"},{"number":6,"original":"short answers","noun_form":"short answers","chinese":"简短的答案"},{"number":7,"original":"important ideas","noun_form":"important ideas","chinese":"重要的想法"},{"number":8,"original":"the content","noun_form":"content (","chinese":"书的) 内容"},{"number":9,"original":"the fundamental question","noun_form":"the fundamental question","chinese":"核心问题"},{"number":10,"original":"“why we should bother to be good”","noun_form":"“why we should bother to be good”","chinese":"为什么我们应该努力成为一个好人"},{"number":11,"original":"a world where crime and injustice tread down good people","noun_form":"a world where crime and injustice tread down good people","chinese":"一个犯罪和不公正的行为会压倒好人的世界"}]},{"source":"周预测","order":35,"title":"Two Types of Motivation 两类动机","code":"111143","priority":"极高频 重回 今日预测 困难","category":"概念类","answer":"The lecture described two types of motivation, which are approach motivation and avoidance motivation. She first mentioned that approach motivation means moving to positive things, such as vocational plans or holidays. Secondly, avoidance motivation is driving away things that are negative, the purpose of which is to reduce anxiety. Finally, she emphasized that avoidance motivation is quite intense. (58 words)","logic":"","audio":"","keywords":[{"number":1,"original":"two types of motivation","noun_form":"two types of motivation","chinese":"两种动机"},{"number":2,"original":"approach motivation","noun_form":"approach motivation","chinese":"趋近动机"},{"number":3,"original":"avoidance motivation","noun_form":"avoidance motivation","chinese":"回避动机"},{"number":4,"original":"moving to positive things","noun_form":"moving to positive things","chinese":"主动靠近具有积极意义的事物"},{"number":5,"original":"vocational plans","noun_form":"vocational plans","chinese":"职业计划"},{"number":6,"original":"holidays","noun_form":"holidays","chinese":"假期"},{"number":7,"original":"driving away things that are negative","noun_form":"driving away things that are negative","chinese":"远离具有消极意义的事物"},{"number":8,"original":"the purpose","noun_form":"the purpose","chinese":"目的"},{"number":9,"original":"reduce anxiety","noun_form":"reduction of anxiety","chinese":"减少焦虑"},{"number":10,"original":"intense","noun_form":"intense motivation","chinese":"强烈的动机"}]},{"source":"周预测","order":36,"title":"A Luxury Brand 奢侈品","code":"111184","priority":"极高频 重回 今日预测 简单","category":"概念类","answer":"It’s hard to answer what makes a luxury brand and how we distinguish it. The standard business response is that luxury brands are exclusive and expensive, but they are not always like that in reality. In Australia, people once considered two televisions to be a luxury; and Starbucks is seen as a luxury brand in China. So, the real answer depends on whom you talk to. (68 words)","logic":"","audio":"","keywords":[{"number":1,"original":"what makes a luxury brand","noun_form":"what makes a luxury brand","chinese":"是什么造就了奢侈品牌"},{"number":2,"original":"how we distinguish it","noun_form":"how we distinguish it","chinese":"我们如何区分它"},{"number":3,"original":"the standard business response","noun_form":"the standard business response","chinese":"标准的商业定义"},{"number":4,"original":"exclusive","noun_form":"exclusivity","chinese":"具有稀缺性"},{"number":5,"original":"expensive","noun_form":"high cost","chinese":"价格高昂"},{"number":6,"original":"in reality","noun_form":"reality","chinese":"现实"},{"number":7,"original":"the real answer","noun_form":"the real answer","chinese":"真正的答案"},{"number":8,"original":"depends on whom you talk to","noun_form":"dependence on whom you talk to","chinese":"取决于你交流的对象是谁"}]},{"source":"周预测","order":37,"title":"Women Leadership 领导力","code":"111186","priority":"极高频 重回 今日预测 简单","category":"概念类","answer":"This lecture talks about leadership, especially women's leadership. Leadership can be seen as a spectrum and can be simply split into two forms: out in front and behind the scenes. In the past, men were out in front while women were behind the scenes. However, nowadays women are beginning to come out in front. (54 words)","logic":"","audio":"","keywords":[{"number":1,"original":"leadership","noun_form":"leadership","chinese":"领导力"},{"number":2,"original":"women's leadership","noun_form":"women's leadership","chinese":"女性领导力"},{"number":3,"original":"a spectrum","noun_form":"a spectrum","chinese":"有不同层次"},{"number":4,"original":"two forms","noun_form":"two forms","chinese":"两种形式"},{"number":5,"original":"out in front","noun_form":"being out in front","chinese":"台前"},{"number":6,"original":"behind the scenes","noun_form":"being behind the scenes","chinese":"幕后"},{"number":7,"original":"the past","noun_form":"the past","chinese":"过去"},{"number":8,"original":"men were out in front","noun_form":"men’s being out in front","chinese":"男性居于台前引领"},{"number":9,"original":"women were behind the scenes","noun_form":"women’s being behind the scenes","chinese":"女性专注幕后支撑"},{"number":10,"original":"nowadays the","noun_form":"present day","chinese":"现在"},{"number":11,"original":"women are beginning to come out in front","noun_form":"women’s beginning to come out in front","chinese":"女性逐渐走向台前"}]},{"source":"周预测","order":38,"title":"Dancing Bees 蜜蜂跳舞","code":"111188","priority":"极高频 重回 今日预测 困难","category":"现象类","answer":"A waggle dance is a method for honeybees to lead other bees to the nectar. But sometimes the dancing can be stopped by a head-butt from another bee. Researchers discovered that the head-butt is a form of warning signal. When foragers discovered the danger of nectar, they would return to the hive and stop other bees' dancing. Scientists think this behavior is to warn the other bees of dangerous nectar. (70 words)","logic":"","audio":"","keywords":[{"number":1,"original":"a waggle dance","noun_form":"a waggle dance","chinese":"摇摆舞"},{"number":2,"original":"a method for honeybees to lead other bees to the nectar","noun_form":"a method for honeybees to lead other bees to the nectar","chinese":"蜜蜂引导同伴前往蜜源的一种方式"},{"number":3,"original":"the dancing can be stopped","noun_form":"stopping of the dance","chinese":"舞蹈会被中断"},{"number":4,"original":"a head-butt from another bee","noun_form":"a head-butt from another bee","chinese":"另一只蜜蜂的头部撞击"},{"number":5,"original":"warning signal","noun_form":"a warning signal","chinese":"一个警告信号"},{"number":6,"original":"foragers","noun_form":"foragers","chinese":"觅食者"},{"number":7,"original":"the danger of nectar","noun_form":"the danger of nectar","chinese":"蜜源存在危险"},{"number":8,"original":"return to the hive","noun_form":"return to the hive","chinese":"返回蜂巢"},{"number":9,"original":"stop other bees' dancing","noun_form":"stopping of other bees' dancing","chinese":"阻止其他蜜蜂的舞蹈"},{"number":10,"original":"warn the other bees of dangerous nectar","noun_form":"warning to other bees of dangerous nectar","chinese":"提醒其他蜜蜂警惕危险蜜源"}]},{"source":"周预测","order":39,"title":"Social Difficulties in Children 儿童的社交困难","code":"111189","priority":"极高频 重回 今日预测 简单","category":"实验类","answer":"Children are facing social difficulties with particular risks. In an experiment in a high school, the students were told to be a movie director and to choose their story structure. The students worked with each other, which involved lots of different skills. The movies they had made were actually cool. Then, the researchers tested the intervention effect, and they found this can improve their self-regulation and critical thinking skills. (69 words)","logic":"","audio":"","keywords":[{"number":1,"original":"children","noun_form":"children","chinese":"儿童"},{"number":2,"original":"social difficulties","noun_form":"social difficulties","chinese":"社交困境"},{"number":3,"original":"particular risks","noun_form":"particular risks","chinese":"特定风险"},{"number":4,"original":"an experiment in a high school","noun_form":"an experiment in a high school","chinese":"一所高中开展的实验"},{"number":5,"original":"a movie director","noun_form":"a movie director","chinese":"电影导演"},{"number":6,"original":"choose their story structure","noun_form":"their choice of story structure","chinese":"选择自己的故事结构"},{"number":7,"original":"worked with each other","noun_form":"their work with each other","chinese":"相互合作"},{"number":8,"original":"involved lots of different skills","noun_form":"involvement of lots of different skills","chinese":"涉及到很多不同的技能"},{"number":9,"original":"the movies they had made were actually cool","noun_form":"cool movies they had made","chinese":"他们制作的电影实际上非常出色"},{"number":10,"original":"the intervention effect","noun_form":"the intervention effect","chinese":"干预措施的效果"},{"number":11,"original":"improve their self-regulation and critical thinking skills","noun_form":"improvement of their self- regulation and critical thinking skills","chinese":"提高学生们的自我调节能力和批判性思维技能"}]},{"source":"周预测","order":40,"title":"Paper Rejection 论文遭拒","code":"111194","priority":"极高频 重回 今日预测 简单","category":"现象类","answer":"The speaker is giving advice on paper rejection and publishing for young scientists. According to the speaker, the chance of getting a paper published is becoming smaller and smaller. However, rejections will lead to a better result and will be good for the career path. In the end, the speaker talked about how to attract and engage young researchers. (59 words)","logic":"","audio":"","keywords":[{"number":1,"original":"advice on paper rejection and publishing","noun_form":"advice on paper rejection and publishing","chinese":"退稿和出版方面的建议"},{"number":2,"original":"young scientists","noun_form":"young scientists","chinese":"青年科学家"},{"number":3,"original":"the chance of getting a paper published","noun_form":"the chance of getting a paper published","chinese":"论文发表的机会"},{"number":4,"original":"smaller and smaller a","noun_form":"smaller and smaller chance","chinese":"越来越小"},{"number":5,"original":"a better result","noun_form":"a better result","chinese":"更好的结果"},{"number":6,"original":"good for the career path","noun_form":"positive impact on the career path","chinese":"对职业道路有好处"},{"number":7,"original":"attract and engage young researchers","noun_form":"attracting and engaging young researchers","chinese":"吸引和让更多年轻的研究人员参与进来"}]},{"source":"周预测","order":41,"title":"Machines Increase Unemployment 机器增加失业率","code":"111196","priority":"极高频 重回 今日预测 简单","category":"现象类","answer":"The development of machines is a sign of the development of the country. Machines are getting more advanced, with examples of face recognition or language processing techniques. Now our life is highly dependent on machines from which people also make a profit. However, the use of machines will increase the unemployment rate, which means that we need to create more jobs, or we would have nowhere else to go. (69 words)","logic":"","audio":"","keywords":[{"number":1,"original":"the development of machines","noun_form":"the development of machines","chinese":"机器的发展"},{"number":2,"original":"a sign of the development of the country","noun_form":"a sign of the development of the country","chinese":"国家发展的标志"},{"number":3,"original":"getting more advanced","noun_form":"increasing advancement","chinese":"变得越来越先进"},{"number":4,"original":"face recognition","noun_form":"face recognition","chinese":"人脸识别"},{"number":5,"original":"language processing","noun_form":"language processing","chinese":"语言处理"},{"number":6,"original":"highly dependent on machines","noun_form":"high dependence on machines","chinese":"依赖机器"},{"number":7,"original":"make a profit","noun_form":"making a profit","chinese":"从中获利"},{"number":8,"original":"increase the unemployment rate","noun_form":"increase in the unemployment rate","chinese":"增加失业率"},{"number":9,"original":"create more jobs","noun_form":"creation of more jobs","chinese":"创造更多就业岗位"}]},{"source":"周预测","order":42,"title":"Symmetry in Mathematics 数学中的对称性","code":"111199","priority":"极高频 重回 今日预测 困难","category":"概念类","answer":"The historical objects in museums can have lots of mathematical significance. The stones discovered in Scotland 5000 years ago are the first examples of humans exploring the concept of symmetry. The speaker spends his life trying to understand what symmetry is in nature. But we don’t know what these stones are for. Maybe they were starting to be mathematicians, and mathematicians made mathematical objects for joy and beauty. (70 words)","logic":"","audio":"","keywords":[{"number":1,"original":"the historical objects in museums","noun_form":"the historical objects in museums","chinese":"博物馆里的历史物件"},{"number":2,"original":"mathematical significance","noun_form":"mathematical significance","chinese":"数学意义"},{"number":3,"original":"the stones discovered in Scotland 5000 years ago","noun_form":"the stones discovered in Scotland 5000 years ago","chinese":"5000年前在苏格兰发现的石块"},{"number":4,"original":"the first examples of humans exploring the concept of symmetry","noun_form":"the first examples of humans exploring the concept of symmetry","chinese":"人类探索对称概念的最早例证"},{"number":5,"original":"what symmetry is in nature","noun_form":"what symmetry is in nature","chinese":"自然界中对称的本质"},{"number":6,"original":"what these stones are for","noun_form":"what these stones are for","chinese":"这些石块的用途"},{"number":7,"original":"mathematicians","noun_form":"mathematicians","chinese":"数学家"},{"number":8,"original":"mathematical objects for joy and beauty","noun_form":"mathematical objects for joy and beauty","chinese":"源于对乐趣与美感的追求创造出来的数学相关物件"}]},{"source":"周预测","order":43,"title":"Multiculturalism in Society 多元文化社会","code":"111200","priority":"极高频 重回 今日预测 困难","category":"现象类","answer":"The speaker in this interview is talking about multiculturalism in society. According to the speaker, diversity is in society and multiculturalism is in a diverse society. Multiculturalism means that many cultures are interacting with each other in society. There are many factors for multiculturalism, but there is no point in counting how many cultures there are in society. (58 words)","logic":"","audio":"","keywords":[{"number":1,"original":"multiculturalism in society","noun_form":"multiculturalism in society","chinese":"社会中的多元文化主义"},{"number":2,"original":"diversity","noun_form":"diversity","chinese":"有多元性的"},{"number":3,"original":"society","noun_form":"society","chinese":"社会"},{"number":4,"original":"multiculturalism","noun_form":"multiculturalism","chinese":"多元文化"},{"number":5,"original":"a diverse society","noun_form":"a diverse society","chinese":"多元性社会"},{"number":6,"original":"many cultures are interacting with each","noun_form":"other the interaction of many cultures","chinese":"多种文化互相交融"},{"number":7,"original":"many factors","noun_form":"many factors","chinese":"许多因素"},{"number":8,"original":"no point in counting how many cultures there are in society","noun_form":"no point in counting how many cultures there are in society","chinese":"没有意义去数一个社区里到底存在多少种文化"}]},{"source":"周预测","order":44,"title":"Glass Ceiling for Women 女性就业限制","code":"111230","priority":"极高频 重回 今日预测 普通","category":"现象类","answer":"There are fewer women in companies than men, especially in senior positions, politics, and leadership, due to the glass ceiling. For the last 50 years, we have been researching the barriers that stop women from getting higher positions in the job market. Now, there has been a shift in this question to why women are choosing not to consider getting into top positions. (63 words)","logic":"","audio":"","keywords":[{"number":1,"original":"fewer women in companies than men","noun_form":"fewer women in companies than men","chinese":"企业中的女性人数少于男性"},{"number":2,"original":"senior positions","noun_form":"senior positions","chinese":"高层职位"},{"number":3,"original":"politics","noun_form":"politics","chinese":"政治领域"},{"number":4,"original":"leadership","noun_form":"leadership","chinese":"领导岗位"},{"number":5,"original":"the glass ceiling","noun_form":"the glass ceiling","chinese":"无形顶障"},{"number":6,"original":"the last 50 years","noun_form":"the last 50 years","chinese":"过去的50年"},{"number":7,"original":"the barriers that stop women from getting higher positions","noun_form":"the barriers that stop women from getting higher positions","chinese":"阻碍女性获得更高职位的各类障碍"},{"number":8,"original":"the job market","noun_form":"the job market","chinese":"职场"},{"number":9,"original":"now","noun_form":"present day","chinese":"现在"},{"number":10,"original":"a shift in this question","noun_form":"a shift in this question","chinese":"研究方向转变"},{"number":11,"original":"why women are choosing not to consider getting into top positions","noun_form":"reasons why women are choosing not to consider getting into top positions","chinese":"为什么女性本身不愿意获得更高的职位"}]},{"source":"周预测","order":45,"title":"Bees Waggle Dance (女生版) 蜜蜂摇摆舞","code":"111260","priority":"极高频 重回 今日预测 简单","category":"概念类","answer":"Bees do a waggle dance as their communication system. When bees find a good food source, they will do a waggle dance to tell other bees. The lecture has mentioned a behavior study regarding bees’ dancing behaviors. According to the lecture, bees can use their dance and the sounds to describe different flowers and the environment. (56 words)","logic":"","audio":"","keywords":[{"number":1,"original":"bees","noun_form":"bees","chinese":"蜜蜂"},{"number":2,"original":"a waggle dance","noun_form":"a waggle dance","chinese":"摇摆舞"},{"number":3,"original":"communication system","noun_form":"communication system","chinese":"交流系统"},{"number":4,"original":"a good food source","noun_form":"a good food source","chinese":"优质的食物来源"},{"number":5,"original":"tell other bees","noun_form":"telling other bees","chinese":"告知其他蜜蜂"},{"number":6,"original":"a behavior study","noun_form":"a behavior study","chinese":"一项行为研究"},{"number":7,"original":"bees’ dancing behaviors","noun_form":"bees’ dancing behaviors","chinese":"蜜蜂舞蹈行为"},{"number":8,"original":"their dance and the sounds","noun_form":"dance and the sounds","chinese":"舞蹈和声音"},{"number":9,"original":"different flowers and the environment","noun_form":"different flowers and the environment","chinese":"不同的花朵和环境"}]},{"source":"周预测","order":46,"title":"Modern Poetry 现代诗歌","code":"111266","priority":"极高频 重回 今日预测 简单","category":"概念类","answer":"This course is an introduction to the literature of a period and to modern poetry. Firstly, we will study several poets, which require a certain amount of close reading. Meanwhile, we need to develop a sense of modernism, which is one of the richest fields of English language writing. Finally, we will be introduced to poems and will try to enjoy them, be puzzled by them, and learn from them. (70 words)","logic":"","audio":"","keywords":[{"number":1,"original":"an introduction","noun_form":"an introduction","chinese":"一个入门介绍"},{"number":2,"original":"the literature of a period","noun_form":"the literature of a period","chinese":"一个文学时期"},{"number":3,"original":"modern poetry","noun_form":"modern poetry","chinese":"现代诗歌"},{"number":4,"original":"several poets","noun_form":"several poets","chinese":"几位诗人"},{"number":5,"original":"close reading","noun_form":"close reading","chinese":"细读"},{"number":6,"original":"a sense of modernism","noun_form":"a sense of modernism","chinese":"对现代主义的感知"},{"number":7,"original":"one of the richest fields","noun_form":"one of the richest fields","chinese":"最为丰富的领域之一"},{"number":8,"original":"English language writing","noun_form":"English language writing","chinese":"英语写作"},{"number":9,"original":"poems","noun_form":"poems","chinese":"诗歌"},{"number":10,"original":"enjoy them","noun_form":"enjoying poems","chinese":"欣赏诗歌"},{"number":11,"original":"be puzzled by","noun_form":"being puzzled by poems","chinese":"被诗歌困惑"},{"number":12,"original":"learn from them","noun_form":"learning from poems","chinese":"从诗歌中学习"}]},{"source":"周预测","order":47,"title":"Indian Peasants 印度农民债务","code":"111018","priority":"降频区 困难","category":"现象类","answer":"The debt now is so high for Indian peasants that they cannot pay it back. The debt comes from the seeds that used to be free and the pesticides whose usage has surged due to the free market and globalization. Peasants must borrow money from the same companies that sell expensive seeds and pesticides. (54 words)","logic":"","audio":"","keywords":[{"number":1,"original":"the debt now is","noun_form":"so high high debt","chinese":"高债务"},{"number":2,"original":"Indian peasants","noun_form":"Indian peasants","chinese":"农民"},{"number":3,"original":"cannot pay it back","noun_form":"paying back","chinese":"无法偿还"},{"number":4,"original":"the seeds that used","noun_form":"to be free free seeds","chinese":"免费的种子"},{"number":5,"original":"pesticides whose usage has surged","noun_form":"surged usage of pesticides","chinese":"大量使用的农药"},{"number":6,"original":"the free market","noun_form":"the free market","chinese":"自由市场"},{"number":7,"original":"globalization","noun_form":"globalization","chinese":"全球化"},{"number":
