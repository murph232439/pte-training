8,"original":"borrow money","noun_form":"borrowing money","chinese":"借钱"},{"number":9,"original":"the same companies that sell expensive seeds and pesticides","noun_form":"same companies that sell seeds and pesticides","chinese":"那些卖给农民们种子和农药的公司"}]},{"source":"周预测","order":48,"title":"Artificial Intelligence 人工智能","code":"111031","priority":"降频区 困难","category":"概念类","answer":"Humans used to tell a computer what to do and how to do it. When given the meaning of certain words, computers can operate as programmed and develop systems and symbols. In other words, computers turn messages into bytes. Computers function similarly to human brains since they are both symbol processors. Therefore, computers may have the potential to bring artificial intelligence. (61 words)","logic":"","audio":"","keywords":[{"number":1,"original":"humans","noun_form":"humans","chinese":"人们"},{"number":2,"original":"a computer","noun_form":"a computer","chinese":"计算机"},{"number":3,"original":"what to do","noun_form":"what to do","chinese":"做什么"},{"number":4,"original":"how to do it","noun_form":"how to do it","chinese":"如何做"},{"number":5,"original":"the meaning of certain words","noun_form":"the meaning of certain words","chinese":"特定文字的含义"},{"number":6,"original":"operate as programmed","noun_form":"operating as programmed","chinese":"按照程序运行"},{"number":7,"original":"develop systems and symbols","noun_form":"developing systems and symbols","chinese":"开发系统和符号"},{"number":8,"original":"turn messages into bytes","noun_form":"turning messages into bytes","chinese":"把信息转换为字节"},{"number":9,"original":"function similarly","noun_form":"similar functions","chinese":"相似的功能"},{"number":10,"original":"human brains","noun_form":"human brains","chinese":"人类大脑"},{"number":11,"original":"symbol processors","noun_form":"symbol processors","chinese":"符号处理器"},{"number":12,"original":"artificial intelligence","noun_form":"artificial intelligence","chinese":"人工智能"}]},{"source":"周预测","order":49,"title":"Kids' Museum 儿童博物馆","code":"111041","priority":"降频区 简单","category":"叙事类","answer":"A mother, a journalist with The Guardian newspaper, wrote an article in the newspaper complaining about her experience of being thrown out of a museum because of her kids shouting in the museum. Surprisingly, she received over 500 emails about the same experience. So, they set up the Kids in Museums campaign, advocating family-friendly museums. (55 words)","logic":"","audio":"","keywords":[{"number":1,"original":"a mother","noun_form":"a mother","chinese":"一位母亲"},{"number":2,"original":"The Guardian newspaper","noun_form":"Guardian newspaper 《","chinese":"卫报》"},{"number":3,"original":"a journalist","noun_form":"a journalist","chinese":"一名记者"},{"number":4,"original":"an article","noun_form":"an article","chinese":"一篇文章"},{"number":5,"original":"complaining about her experience","noun_form":"complaining about the experience","chinese":"抱怨她的经历"},{"number":6,"original":"a museum","noun_form":"a museum","chinese":"博物馆"},{"number":7,"original":"shouting","noun_form":"shouting","chinese":"喊叫"},{"number":8,"original":"thrown out","noun_form":"being thrown out","chinese":"被赶出去"},{"number":9,"original":"500 emails","noun_form":"500 emails","chinese":"500封邮件"},{"number":10,"original":"set up the Kids in Museums campaign","noun_form":"setting up the Kids in Museums campaign","chinese":"发起“儿童博物馆”运动"},{"number":11,"original":"advocating family-friendly museums","noun_form":"advocating family-friendly museums","chinese":"倡导适合家庭的博物馆"}]},{"source":"周预测","order":50,"title":"National wealth and Adam Smith 国家财富与亚当斯密","code":"111062","priority":"降频区 简单","category":"概念类","answer":"Before the Industrial Revolution, British economists previously believed a nation’s wealth was the money people could pile up, but Adam Smith in 1776 believed that a nation’s wealth included not only agriculture but also manufacturing, and the nation’s wealth was the ability to provide outputs. Overall, national wealth is equal to the nation’s income since national income measures and equals national output. (63 words)","logic":"","audio":"","keywords":[{"number":1,"original":"the Industrial Revolution","noun_form":"the Industrial Revolution","chinese":"工业革命"},{"number":2,"original":"British economists","noun_form":"British economists","chinese":"英国经济学家"},{"number":3,"original":"a nation’s wealth","noun_form":"a nation’s wealth","chinese":"一个国家的财富"},{"number":4,"original":"the money people could pile up","noun_form":"the money people could pile up","chinese":"人民积累起来的财富"},{"number":5,"original":"Adam Smith","noun_form":"Adam Smith","chinese":"亚当斯密"},{"number":6,"original":"agriculture","noun_form":"agriculture","chinese":"农业"},{"number":7,"original":"manufacturing","noun_form":"manufacturing","chinese":"制造业"},{"number":8,"original":"the ability to provide outputs","noun_form":"the ability to provide outputs","chinese":"提供产出的能力"},{"number":9,"original":"equal to the nation’s income","noun_form":"being equal to the nation’s income","chinese":"等于国家收入"},{"number":10,"original":"national output","noun_form":"national output","chinese":"国家产出"}]},{"source":"周预测","order":51,"title":"Therapeutic Environment 治疗环境","code":"111092","priority":"降频区 困难","category":"概念类","answer":"A long time ago, people began to study the therapeutic environment. They found that fresh air and daylight can have positive impacts on patients' recovery, and architecture has the same positive impacts, too. Viewing hospital yards can help people rest and sleep well, and can also help release their stress and pain easily. 90% of nurses in hospitals agreed that the designed hospital environment is linked to patients' recovery. (69 words)","logic":"","audio":"","keywords":[{"number":1,"original":"the therapeutic environment","noun_form":"the therapeutic environment","chinese":"治疗环境"},{"number":2,"original":"fresh air","noun_form":"fresh air","chinese":"新鲜空气"},{"number":3,"original":"daylight","noun_form":"daylight","chinese":"日光"},{"number":4,"original":"positive impacts on patients' recovery","noun_form":"positive impacts on patients' recovery","chinese":"对患者康复的积极影响"},{"number":5,"original":"the same positive impacts","noun_form":"the same positive impacts","chinese":"相同的积极影响"},{"number":6,"original":"architecture","noun_form":"architecture","chinese":"建筑"},{"number":7,"original":"viewing hospital yards","noun_form":"viewing hospital yards","chinese":"看医院的院子"},{"number":8,"original":"rest and sleep well","noun_form":"a good rest and sleep","chinese":"充分的休息和睡眠"},{"number":10,"original":"release their stress and pain","noun_form":"releasing stress and pain","chinese":"减少压力和疼痛"},{"number":10,"original":"nurses in hospitals","noun_form":"nurses in hospitals","chinese":"医院护士"},{"number":11,"original":"the designed hospital environment","noun_form":"the designed hospital environment","chinese":"设计好的医院环境"}]},{"source":"周预测","order":52,"title":"The Separation of Powers 三权分立","code":"111101","priority":"降频区 困难","category":"概念类","answer":"The lecture talks about the separation of powers, which is related to the checks and balances of the country. The Constitution is made up of the legislative branch that makes the law, the president, who is appointed by the Senate to carry out the law, and the judicial authorities who interpret the law. However, there is a blurry line between the legislative and executive roles in the past 100 years. (70 words)","logic":"","audio":"","keywords":[{"number":1,"original":"the separation of powers","noun_form":"the separation of powers","chinese":"三权分立"},{"number":2,"original":"the checks and balances","noun_form":"the checks and balances","chinese":"制衡制度"},{"number":3,"original":"the Constitution","noun_form":"the Constitution","chinese":"宪法"},{"number":4,"original":"the legislative branch","noun_form":"the legislative branch","chinese":"立法部门"},{"number":5,"original":"makes the law","noun_form":"making the law","chinese":"制定法律"},{"number":6,"original":"the president","noun_form":"the president","chinese":"总统"},{"number":7,"original":"the Senate","noun_form":"the Senate","chinese":"参议院"},{"number":8,"original":"carry out the law","noun_form":"carrying out the law","chinese":"执行法律"},{"number":9,"original":"the judicial authorities","noun_form":"the judicial authorities","chinese":"司法机关"},{"number":10,"original":"interpret the law","noun_form":"interpreting the law","chinese":"解释法律"},{"number":11,"original":"a blurry line between the legislative and executive roles","noun_form":"a blurry line between the legislative and executive roles","chinese":"立法与行政角色之间的界限模糊不清"}]},{"source":"周预测","order":53,"title":"Need 需要和需求","code":"111105","priority":"降频区 简单","category":"概念类","answer":"There are several ways to use and interpret the word ‘need’. When you say, 'I need a holiday', it is an expression of a strong desire but not a basic need. When you say, 'the plant needs water', it is an objective statement because it is essential, like sunlight and water to plants. Also, there is a psychological use of 'need' when someone lacks something. (65 words)","logic":"","audio":"","keywords":[{"number":1,"original":"use and interpret the word ‘need’","noun_form":"using and interpreting the word ‘need’","chinese":"使用和理解“需要”一词"},{"number":2,"original":"'I need a holiday'","noun_form":"expression 'I need a holiday'","chinese":"表达“我需要一个假期”"},{"number":3,"original":"an expression of a strong desire","noun_form":"an expression of a strong desire","chinese":"强烈愿望的表达"},{"number":4,"original":"a basic need","noun_form":"a basic need","chinese":"基本需求"},{"number":5,"original":"'the plant needs water'","noun_form":"expression 'the plant needs water'","chinese":"表达“植物需要水”"},{"number":6,"original":"an objective statement","noun_form":"an objective statement","chinese":"客观陈述"},{"number":7,"original":"essential an","noun_form":"essential need","chinese":"必不可少的需求"},{"number":8,"original":"sunlight","noun_form":"sunlight","chinese":"阳光"},{"number":9,"original":"water","noun_form":"water","chinese":"水"},{"number":10,"original":"plants","noun_form":"plants","chinese":"植物"},{"number":11,"original":"a psychological use","noun_form":"a psychological use","chinese":"心理上的用途"},{"number":12,"original":"lacks something","noun_form":"lack of something","chinese":"缺少某物"}]},{"source":"周预测","order":54,"title":"What happened to Journalism 网络影响传媒","code":"111110","priority":"降频区 简单","category":"现象类","answer":"The rise of the Internet has a great impact on journalism in terms of how it’s produced and how it’s consumed. However, it took steps for people to enthusiastically feel the change in journalism. The internet has not only improved the speed of news spreading but also helped people gain information in various ways. Nowadays, even a small piece of ordinary video can be a new type of journalism. (68 words)","logic":"","audio":"","keywords":[{"number":1,"original":"the rise of the Internet","noun_form":"the rise of the Internet","chinese":"网络的兴起"},{"number":2,"original":"a great impact on journalism","noun_form":"a great impact on journalism","chinese":"对新闻业的巨大影响"},{"number":3,"original":"how it’s produced","noun_form":"production","chinese":"产生方式"},{"number":4,"original":"how it’s consumed","noun_form":"consumption","chinese":"消费方式"},{"number":5,"original":"the change in journalism","noun_form":"the change in journalism","chinese":"传媒业的改变"},{"number":6,"original":"improved the speed of news spreading","noun_form":"improving the speed of news spreading","chinese":"提高新闻传播的速度"},{"number":7,"original":"gain information in various ways","noun_form":"gaining information in various ways","chinese":"通过不同的途径获取信息"},{"number":8,"original":"a small piece of ordinary video","noun_form":"a small piece of ordinary video","chinese":"一小段普通的视频"},{"number":9,"original":"a new type of journalism","noun_form":"a new type of journalism","chinese":"一种新的传媒形式"}]},{"source":"周预测","order":55,"title":"Cultural Diversity in Australia 澳大利亚多元文化","code":"111111","priority":"降频区 简单","category":"概念类","answer":"Being a multicultural country, Australia has immigrants from all over the world, which makes it the home to the world’s oldest continuous cultures. Cultural diversity is a significant feature of Australian society. Cultural diversity can benefit the productivity, economic performance and labor force of Australia. According to the statistics, nearly half of Australians were born overseas or have a foreign-born parent. (61 words)","logic":"","audio":"","keywords":[{"number":1,"original":"a multicultural country","noun_form":"a multicultural country","chinese":"多元文化国家"},{"number":2,"original":"Australia","noun_form":"Australia","chinese":"澳大利亚"},{"number":3,"original":"immigrants","noun_form":"immigrants","chinese":"移民"},{"number":4,"original":"the world’s oldest continuous cultures","noun_form":"the world’s oldest continuous cultures","chinese":"世界最古老的延续性文化"},{"number":5,"original":"cultural diversity","noun_form":"cultural diversity","chinese":"文化多样性"},{"number":6,"original":"a significant feature of Australian society","noun_form":"a significant feature of Australian society","chinese":"澳大利亚社会的一个显著特征"},{"number":7,"original":"the productivity","noun_form":"productivity","chinese":"生产力"},{"number":8,"original":"economic performance","noun_form":"economic performance","chinese":"经济表现"},{"number":9,"original":"labor force","noun_form":"labor force","chinese":"劳动力"},{"number":10,"original":"the statistics","noun_form":"statistics","chinese":"统计数据"},{"number":11,"original":"half of Australians","noun_form":"half of Australians","chinese":"一半的澳大利亚人"},{"number":12,"original":"born overseas","noun_form":"overseas birth","chinese":"海外出生"},{"number":13,"original":"a foreign-born parent","noun_form":"a foreign-born parent","chinese":"有海外出生的家长"}]},{"source":"周预测","order":56,"title":"Moral Objectivism and Moral Absolutism 道德客观主义与道德绝对主义","code":"111113","priority":"降频区 困难","category":"概念类","answer":"In moral objectivism, some universal moral principles are valid for all people in all social environments and situations. In moral absolutism, there is a firm and absolute boundary between right and wrong. Therefore, in moral absolutism, there are non-overridable principles that must be followed and never violated. The notion of right and wrong is not subject to different interpretations or situations. (66 words)","logic":"","audio":"","keywords":[{"number":1,"original":"moral objectivism","noun_form":"moral objectivism","chinese":"道德客观主义"},{"number":2,"original":"universal moral principles","noun_form":"universal moral principles","chinese":"普遍的道德准则"},{"number":3,"original":"valid for all people","noun_form":"being valid for all people","chinese":"适用于所有人"},{"number":4,"original":"all social environments and situations","noun_form":"all social environments and situations","chinese":"所有社会环境及情况"},{"number":5,"original":"moral absolutism","noun_form":"moral absolutism","chinese":"道德绝对主义"},{"number":6,"original":"a firm and absolute boundary between right and wrong","noun_form":"a firm and absolute boundary between right and wrong","chinese":"明确且绝对的正误之间的界限"},{"number":7,"original":"non-overridable principles","noun_form":"non-overridable principles","chinese":"不可逾越的准则"},{"number":8,"original":"be followed","noun_form":"following principles","chinese":"遵从准则"},{"number":9,"original":"never violated","noun_form":"never violating principles","chinese":"从不违反准则"},{"number":10,"original":"the notion of right and wrong","noun_form":"the notion of right and wrong","chinese":"是非观"},{"number":11,"original":"different interpretations or situations","noun_form":"different interpretations or situations","chinese":"不同的解读或情况"}]},{"source":"周预测","order":57,"title":"Mars and Earth 火星与地球","code":"111124","priority":"降频区 困难","category":"概念类","answer":"Mars is a neighboring planet to Earth with a similar geological surface and landscape, such as desert. Although there has not been evidence for the existence of water yet, traces of heavy gases have existed on Mars for billions of years. The low gravity on Mars means there may be a thin layer of atmosphere on Mars. Therefore, Mars might be the most ideal destination other than Earth. (68 words)","logic":"","audio":"","keywords":[{"number":1,"original":"Mars","noun_form":"Mars","chinese":"火星"},{"number":2,"original":"a neighboring planet","noun_form":"a neighboring planet","chinese":"一颗邻近的行星"},{"number":3,"original":"Earth","noun_form":"Earth","chinese":"地球"},{"number":4,"original":"a similar geological surface and landscape","noun_form":"a similar geological surface and landscape","chinese":"相似的地表和地貌特征"},{"number":5,"original":"desert","noun_form":"desert","chinese":"沙漠"},{"number":6,"original":"evidence for the existence of water","noun_form":"evidence for the existence of water","chinese":"水存在的证据"},{"number":7,"original":"traces of heavy gases","noun_form":"traces of heavy gases","chinese":"重气体的痕迹"},{"number":8,"original":"the low gravity on Mars","noun_form":"the low gravity on Mars","chinese":"火星的低重力"},{"number":9,"original":"a thin layer of atmosphere","noun_form":"a thin layer of atmosphere","chinese":"一层薄薄的大气层"},{"number":10,"original":"the ideal destination","noun_form":"the ideal destination","chinese":"最理想的目的地"}]},{"source":"周预测","order":58,"title":"The History of English 英语语言发展史","code":"111127","priority":"降频区 简单","category":"概念类","answer":"English is not a pure language and has borrowed words from 350 other languages over time, making it a variety of many languages. The history of the English language is closely connected to the history of the English people, so today we are learning about the history. However, different periods of people have different views. For example, during Shakespeare's period, people hated those borrowed words that were not original English. (69 words)","logic":"","audio":"","keywords":[{"number":1,"original":"English","noun_form":"English","chinese":"英语"},{"number":2,"original":"a pure language","noun_form":"a pure language","chinese":"一门单一的语言"},{"number":3,"original":"borrowed words from 350 other languages","noun_form":"borrowing words from 350 other languages","chinese":"借用其他350种语言的词汇"},{"number":4,"original":"a variety of many languages","noun_form":"a variety of many languages","chinese":"多钟语言的变体"},{"number":5,"original":"the history of the English language","noun_form":"the history of the English language","chinese":"英语的历史"},{"number":6,"original":"closely connected","noun_form":"close connection","chinese":"紧密的联系"},{"number":7,"original":"the history of the English people","noun_form":"the history of the English people","chinese":"英国人的历史"},{"number":8,"original":"different periods of people","noun_form":"different periods of people","chinese":"不同时期的人们"},{"number":9,"original":"different views","noun_form":"different views","chinese":"不同的观点"},{"number":10,"original":"Shakespeare's period","noun_form":"Shakespeare's period","chinese":"莎士比亚时期"},{"number":11,"original":"hated those borrowed words","noun_form":"hate of borrowed words","chinese":"不喜欢外来词汇"},{"number":12,"original":"original English","noun_form":"original English","chinese":"原版英语"}]},{"source":"周预测","order":59,"title":"Language and Basic Vocabulary 语言与基本词汇","code":"111132","priority":"降频区 困难","category":"概念类","answer":"According to the lecture, languages are compared by historical linguists at several levels by looking for a basic vocabulary. Some languages may have words that other languages don’t have. So, you should look for a basic vocabulary, referring to the most comparable words or the most universal notions. You may also look for words that sound similar. (57 words)","logic":"","audio":"","keywords":[{"number":1,"original":"languages are compared","noun_form":"comparison of languages","chinese":"语言的比较"},{"number":2,"original":"historical linguists","noun_form":"historical linguists","chinese":"历史语言学家"},{"number":3,"original":"several levels","noun_form":"several levels","chinese":"不同的层面"},{"number":4,"original":"a basic vocabulary","noun_form":"a basic vocabulary","chinese":"基本词汇"},{"number":5,"original":"words that other languages don’t have","noun_form":"words that other languages don’t have","chinese":"其他语言里没有的词"},{"number":6,"original":"the most comparable words","noun_form":"the most comparable words","chinese":"最具可比性的词汇"},{"number":7,"original":"the most universal notions","noun_form":"the most universal notions","chinese":"最普遍的概念"},{"number":8,"original":"words that sound similar","noun_form":"words with similar sounds","chinese":"发音相似的单词"}]},{"source":"周预测","order":60,"title":"Food waste in the USA 美国食物浪费","code":"111191","priority":"降频区 简单","category":"现象类","answer":"The United States is considered the biggest food waste country in the world, and 60% of food waste comes from general consumption. There are two main sources of food waste. The majority of food waste comes from supermarkets, especially in the use-by section. The other factor is what people purchase and how they eat, so purchasing all items is not a good idea. (63 words)","logic":"","audio":"","keywords":[{"number":1,"original":"the United States","noun_form":"the United States","chinese":"美国"},{"number":2,"original":"the biggest food waste country","noun_form":"the biggest food waste country","chinese":"最大的食物浪费国"},{"number":3,"original":"60% of food waste","noun_form":"60% of food waste","chinese":"60%的食物浪费"},{"number":4,"original":"general consumption","noun_form":"general consumption","chinese":"一般消费"},{"number":5,"original":"two main sources","noun_form":"two main sources","chinese":"两大来源"},{"number":6,"original":"supermarkets","noun_form":"supermarkets","chinese":"超市"},{"number":7,"original":"the use-by section","noun_form":"the use-by section","chinese":"临期区域"},{"number":8,"original":"what people purchase","noun_form":"what people purchase","chinese":"人们购买的东西"},{"number":9,"original":"how they eat","noun_form":"how they eat","chinese":"人们进食的方式"},{"number":10,"original":"purchasing all items","noun_form":"purchasing all items being a bad idea","chinese":"什么都买是不好的"},{"number":11,"original":"not a good idea","noun_form":"a bad idea","chinese":"不是好主意"}]},{"source":"Pearson后台","order":1,"title":"Insomnia 失眠问题","code":"PTEA_15-LW-SUMM_CM1_1_C1_Final_NW","priority":"官方题库","category":"概念类","answer":"The term ‘insomnia’ only came into common use in the 20th century, although sleep problems clearly existed before this. It is sometimes thought that this is the result of a more stressful lifestyle. However, the speaker attributes it to the tendency to define conditions such as the inability to sleep as single medical conditions, instead of part of a cluster of symptoms arising from a particular situation.","logic":"睡眠问题并非简单由现代压力造成。“失眠”一词到20世纪才开始普遍使用，但睡眠问题早已存在。演讲者认为，真正原因在于人们把睡眠问题看作单一医学病症，而它应当是特定情境引起的一组症状。","audio":"https://assets.learnosity.com/organisations/682/08dbba61-929f-4e73-bf7d-ecc362e42453.mp3","keywords":[{"number":1,"original":"the term ‘insomnia’","noun_form":"the term ‘insomnia’","chinese":"“失眠”这一术语"},{"number":2,"original":"came into common use","noun_form":"common use","chinese":"开始普遍使用"},{"number":3,"original":"the 20th century","noun_form":"the 20th century","chinese":"20世纪"},{"number":4,"original":"sleep problems clearly existed before this","noun_form":"pre-existing sleep problems","chinese":"睡眠问题在此之前已经存在"},{"number":5,"original":"a more stressful lifestyle","noun_form":"a more stressful lifestyle","chinese":"压力更大的生活方式"},{"number":6,"original":"the speaker attributes it to","noun_form":"the speaker’s attribution","chinese":"演讲者将其归因于"},{"number":7,"original":"define conditions such as the inability to sleep as single medical conditions","noun_form":"the definition of sleep problems as single medical conditions","chinese":"把无法入睡等状况定义为单一医学病症"},{"number":8,"original":"part of a cluster of symptoms","noun_form":"a cluster of symptoms","chinese":"一组症状的一部分"},{"number":9,"original":"arising from a particular situation","noun_form":"a particular situation","chinese":"由特定情境引起"}]},{"source":"Pearson后台","order":2,"title":"Product Choice 产品选择过多","code":"PTEA_15-LW-SUMM_CM1_2_B2_Final_NW","priority":"官方题库","category":"现象类","answer":"Offering too wide a choice of products to customers is not a good strategy. Although displaying a big selection of products may initially attract customers, fewer actually make a purchase because they find it too difficult to choose. It also suggests to customers that one of the products must be exactly right and so makes it more likely they will be disappointed.","logic":"给顾客提供过多产品选择不是好策略。大选择范围最初能吸引顾客，但顾客会因为难以选择而减少实际购买，还会误以为一定有一件产品完全正确，因此更容易失望。","audio":"https://assets.learnosity.com/organisations/682/9e7cc05c-47bb-411a-a2db-ae56e2cd0118.mp3","keywords":[{"number":1,"original":"offering too wide a choice of products","noun_form":"too wide a choice of products","chinese":"提供过多产品选择"},{"number":2,"original":"not a good strategy","noun_form":"a bad strategy","chinese":"不是好策略"},{"number":3,"original":"initially attract customers","noun_form":"initial customer attraction","chinese":"最初吸引顾客"},{"number":4,"original":"fewer actually make a purchase","noun_form":"fewer purchases","chinese":"实际购买人数减少"},{"number":5,"original":"too difficult to choose","noun_form":"difficulty in choosing","chinese":"难以做出选择"},{"number":6,"original":"suggests one product must be exactly right","noun_form":"the expectation of an exactly right product","chinese":"暗示一定有一件产品完全正确"},{"number":7,"original":"makes it more likely they will be disappointed","noun_form":"a higher likelihood of disappointment","chinese":"更容易让顾客失望"}]},{"source":"Pearson后台","order":3,"title":"Bioluminescent Fish 发光鱼类","code":"PTEA_15-LW-SUMM_CM1_3_C1_Final_PF","priority":"官方题库","category":"研究类","answer":"Scientists studying fish that emit light previously believed that the fish made their own enzymes and molecules to do so. However, new research shows that one species of fish actually takes the necessary components from its prey. Scientists are surprised that the components survive digestion, but there is a lot more still unknown.","logic":"发光鱼的研究更新了原有认识。过去科学家认为鱼类自己产生发光所需的酶和分子，但新研究发现，一种鱼实际上从猎物身上获取必要成分。这些成分竟能在消化后存活，令科学家意外，目前仍有很多未知。","audio":"https://assets.learnosity.com/organisations/682/87b6ebd8-e477-4276-a8a0-9a89643c0e1c.mp3","keywords":[{"number":1,"original":"fish that emit light","noun_form":"light-emitting fish","chinese":"会发光的鱼"},{"number":2,"original":"made their own enzymes and molecules","noun_form":"self-produced enzymes and molecules","chinese":"自己产生酶和分子"},{"number":3,"original":"new research shows","noun_form":"new research","chinese":"新研究显示"},{"number":4,"original":"one species of fish","noun_form":"one species of fish","chinese":"一种鱼"},{"number":5,"original":"takes the necessary components from its prey","noun_form":"taking components from prey","chinese":"从猎物身上获取必要成分"},{"number":6,"original":"surprised that the components survive digestion","noun_form":"the components surviving digestion","chinese":"成分能存活消化令人意外"},{"number":7,"original":"there is a lot more still unknown","noun_form":"remaining unknowns","chinese":"仍有许多未知"}]},{"source":"Pearson后台","order":4,"title":"Employee Well-being 员工幸福感","code":"PTEA_15-LW-SUMM_CM1_4_B2_Final_MG","priority":"官方题库","category":"管理类","answer":"Employee well-being is created through effective communication, good management and clear job design. Whilst communication is important, so too is job security, opportunities to use existing skills and develop others. Managers have a role to play and should look at ways to promote employee well-being that focus on the long rather than short term.","logic":"员工幸福感来自有效沟通、良好管理和清晰的岗位设计，也包括工作安全感、使用现有技能和发展其他技能的机会。管理者需要采取行动，并关注长期而非短期的员工幸福感。","audio":"https://assets.learnosity.com/organisations/682/af39e7a9-f663-412f-bf75-ff763bf1aad2.mp3","keywords":[{"number":1,"original":"employee well-being","noun_form":"employee well-being","chinese":"员工幸福感"},{"number":2,"original":"effective communication","noun_form":"effective communication","chinese":"有效沟通"},{"number":3,"original":"good management","noun_form":"good management","chinese":"良好管理"},{"number":4,"original":"clear job design","noun_form":"clear job design","chinese":"清晰的岗位设计"},{"number":5,"original":"job security","noun_form":"job security","chinese":"工作安全感"},{"number":6,"original":"opportunities to use existing skills and develop others","noun_form":"skill use and development opportunities","chinese":"使用现有技能和发展其他技能的机会"},{"number":7,"original":"managers have a role to play","noun_form":"the manager’s role","chinese":"管理者需要发挥作用"},{"number":8,"original":"focus on the long rather than short term","noun_form":"a long-term focus","chinese":"关注长期而非短期"}]},{"source":"Pearson后台","order":5,"title":"Business Plans 商业计划","code":"PTEA_15-LW-SUMM_CM1_6_B2_Final_BJ","priority":"官方题库","category":"现象类","answer":"Business plans remain crucial, despite a recent study showing that most millennial start-ups have never written one. Companies may write a plan for many different reasons, but the main purpose of a business plan is to attract an investor, or backer, and to prove that their money is safe and secure when investing in you. The company needs to show they have assessed any potential financial risks.","logic":"商业计划仍然至关重要。虽然有研究显示多数千禧一代创业公司从未写过商业计划，但公司写计划的原因很多。主要目的是吸引投资人，证明投资资金安全可靠，并展示公司已经评估了潜在财务风险。","audio":"https://assets.learnosity.com/organisations/682/7549de31-f9a4-4bca-8d2a-66735f4c8e47.mp3","keywords":[{"number":1,"original":"business plans remain crucial","noun_form":"the importance of business plans","chinese":"商业计划仍然至关重要"},{"number":2,"original":"most millennial start-ups have never written one","noun_form":"millennial start-ups without a business plan","chinese":"多数千禧一代创业公司从未写过商业计划"},{"number":3,"original":"many different reasons","noun_form":"multiple reasons","chinese":"多种原因"},{"number":4,"original":"the main purpose of a business plan","noun_form":"the main purpose of a business plan","chinese":"商业计划的主要目的"},{"number":5,"original":"attract an investor, or backer","noun_form":"attracting an investor or backer","chinese":"吸引投资人"},{"number":6,"original":"prove that their money is safe and secure","noun_form":"proof that the investment is safe and secure","chinese":"证明资金安全可靠"},{"number":7,"original":"assessed any potential financial risks","noun_form":"assessment of potential financial risks","chinese":"评估潜在财务风险"}]},{"source":"Pearson后台","order":6,"title":"Agriculture and Environment 农业与环境","code":"PTEA_15-LW-SUMM_CM1_8_C1_Final_CW","priority":"官方题库","category":"现象类","answer":"Agriculture is responsible for pollution and a number of environmental issues in the world. Traditionally, discussions around farming and the environment have been split between those who favour organic approaches and those who want a greater quantity of production, but a choice between these two things may not have to be made because small organic farms have actually been found to create higher yields.","logic":"农业造成污染和多种环境问题。传统讨论常把有机农业和追求产量对立起来，但二者未必需要二选一，因为研究发现小型有机农场实际上能够带来更高产量。","audio":"https://assets.learnosity.com/organisations/682/da36f697-f328-414f-82bc-516f745d74dd.mp3","keywords":[{"number":1,"original":"agriculture is responsible for pollution and environmental issues","noun_form":"agriculture’s responsibility for pollution and environmental issues","chinese":"农业造成污染和环境问题"},{"number":2,"original":"traditionally, discussions around farming and the environment","noun_form":"traditional discussions about farming and the environment","chinese":"传统上关于农业与环境的讨论"},{"number":3,"original":"favour organic approaches","noun_form":"support for organic approaches","chinese":"支持有机方式"},{"number":4,"original":"a greater quantity of production","noun_form":"a greater quantity of production","chinese":"更大的产量"},{"number":5,"original":"a choice between these two things may not have to be made","noun_form":"avoiding the choice between the two approaches","chinese":"不必在两种方式之间二选一"},{"number":6,"original":"small organic farms have actually been found to create higher yields","noun_form":"the higher yields of small organic farms","chinese":"小型有机农场被发现能带来更高产量"}]},{"source":"Pearson后台","order":7,"title":"Garden Birds and Food Learning 花园鸟类学习避食","code":"PTEA_15-LW-SUMM_CM6_1_B1_final","priority":"官方题库","category":"研究类","answer":"A study has found that one type of garden bird could be taught to avoid dangerous or disgusting foods by showing them videos of other birds eating. The birds in the study learned to avoid foods that other birds rejected. As a result, the birds saved time and energy and were less likely to eat harmful food.","logic":"研究发现，某类花园鸟可以通过观看其他鸟进食来学会避开危险或恶心食物。它们学会拒绝其他鸟拒绝的食物，从而节省时间和精力，也更不容易吃到有害食物。","audio":"https://assets.learnosity.com/organisations/682/90e39fcb-33da-4cd1-9da4-547420c338e6.mp3","keywords":[{"number":1,"original":"one type of garden bird","noun_form":"one type of garden bird","chinese":"一种花园鸟"},{"number":2,"original":"taught to avoid dangerous or disgusting foods","noun_form":"learning to avoid dangerous or disgusting foods","chinese":"学会避开危险或恶心食物"},{"number":3,"original":"showing them videos of other birds eating","noun_form":"videos of other birds eating","chinese":"观看其他鸟进食的视频"},{"number":4,"original":"foods that other birds rejected","noun_form":"foods rejected by other birds","chinese":"其他鸟拒绝的食物"},{"number":5,"original":"learned to avoid foods","noun_form":"learning to avoid foods","chinese":"学会避开食物"},{"number":6,"original":"saved time and energy","noun_form":"saving time and energy","chinese":"节省时间和精力"},{"number":7,"original":"less likely to eat harmful food","noun_form":"a lower likelihood of eating harmful food","chinese":"更不容易吃有害食物"}]},{"source":"Pearson后台","order":8,"title":"Arctic Warming and Plants 北极变暖与植物","code":"PTEA_15-LW-SUMM_CM6_2_B1_final","priority":"官方题库","category":"因果类","answer":"A new study shows that the temperature in the Arctic has increased by almost 0.8 degrees Celsius over the last decade and this has had a considerable effect on the landscape there. The temperature increase caused Arctic plants to grow taller. However, because they then covered less ground, more heat entered the ground causing an overall increase in temperatures in the region.","logic":"新研究显示，北极气温在十年内上升近0.8摄氏度，显著影响当地地貌。气温升高使植物长得更高，但植物覆盖地面减少，更多热量进入地面，最终导致该地区整体温度进一步上升。","audio":"https://assets.learnosity.com/organisations/682/f278aa56-ac4d-47b5-a6e9-1fdbff16450c.mp3","keywords":[{"number":1,"original":"the temperature in the Arctic has increased by almost 0.8 degrees Celsius","noun_form":"an almost 0.8 degree Celsius increase in Arctic temperature","chinese":"北极气温上升近0.8摄氏度"},{"number":2,"original":"over the last decade","noun_form":"the last decade","chinese":"过去十年"},{"number":3,"original":"a considerable effect on the landscape","noun_form":"a considerable effect on the landscape","chinese":"对地貌产生显著影响"},{"number":4,"original":"Arctic plants grow taller","noun_form":"the taller growth of Arctic plants","chinese":"北极植物长得更高"},{"number":5,"original":"covered less ground","noun_form":"less ground coverage","chinese":"覆盖地面减少"},{"number":6,"original":"more heat entered the ground","noun_form":"more heat entering the ground","chinese":"更多热量进入地面"},{"number":7,"original":"an overall increase in temperatures in the region","noun_form":"an overall regional temperature increase","chinese":"该地区整体升温"}]},{"source":"Pearson后台","order":9,"title":"Ancient and Modern Olympics 古今奥运会","code":"PTEA_15-LW-SUMM_CM6_10_B2_final","priority":"官方题库","category":"对比类","answer":"The ancient Olympics are virtually unrecognisable when compared to the modern version of the games. The modern Olympic movement is far more inclusive, both in terms of the format of the competition and also in terms of who could participate. More importantly, there is a fundamental distinction between the extremely competitive nature of the ancient games and the modern Olympic ideals of peace, friendship and fair play.","logic":"现代奥运会与古代奥运会几乎不可同日而语。现代奥运在比赛形式和参与人群上更包容，两者最根本的区别在于古代比赛极端强调竞争，而现代奥运强调和平、友谊和公平竞争。","audio":"https://assets.learnosity.com/organisations/682/caf096c0-47f6-4918-a567-395197676486.mp3","keywords":[{"number":1,"original":"the ancient Olympics are virtually unrecognisable","noun_form":"the unrecognisable ancient Olympics","chinese":"古代奥运几乎难以辨认"},{"number":2,"original":"compared to the modern version of the games","noun_form":"comparison with the modern games","chinese":"与现代奥运会相比"},{"number":3,"original":"the modern Olympic movement is far more inclusive","noun_form":"the inclusiveness of the modern Olympic movement","chinese":"现代奥运更包容"},{"number":4,"original":"the format of the competition","noun_form":"the format of the competition","chinese":"比赛形式"},{"number":5,"original":"who could participate","noun_form":"participation eligibility","chinese":"谁可以参加"},{"number":6,"original":"a fundamental distinction","noun_form":"a fundamental distinction","chinese":"根本区别"},{"number":7,"original":"the extremely competitive nature of the ancient games","noun_form":"the extremely competitive nature of the ancient games","chinese":"古代比赛极端强调竞争"},{"number":8,"original":"the modern Olympic ideals of peace, friendship and fair play","noun_form":"modern Olympic ideals","chinese":"现代奥运理想：和平、友谊、公平竞争"}]}];
var state={source:'all',q:''};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function flatRows(){
  var q=state.q.trim().toLowerCase(),out=[];
  DATA.forEach(function(item){
    if(state.source!=='all'&&item.source!==state.source)return;
    item.keywords.forEach(function(k,index){
      var hay=[item.title,item.code,item.category,k.original,k.noun_form,k.chinese].join(' ').toLowerCase();
      if(q&&hay.indexOf(q)<0)return;
      out.push({item:item,k:k,first:index===0,key:item.source+'-'+item.order});
    });
  });
  return out;
}
function render(){
  var rows=flatRows(),last='';
  document.getElementById('rows').innerHTML=rows.map(function(row){
    var i=row.item,k=row.k,start=row.key!==last;last=row.key;
    return '<tr class="'+(start?'group-start':'')+'">'+
      '<td>'+(start?'<span class="source '+(i.source==='周预测'?'prediction':'pearson')+'">'+esc(i.source)+'</span>':'')+'</td>'+
      '<td class="mini">'+(start?esc(i.code):'')+'</td>'+
      '<td class="title">'+(start?esc(i.title)+'<div class="code">'+esc(i.priority)+' · '+esc(i.category)+'</div>':'')+'</td>'+
      '<td class="mini">'+k.number+'</td><td class="kw">'+esc(k.original)+'</td><td class="noun">'+esc(k.noun_form)+'</td><td class="cn">'+esc(k.chinese)+'</td>'+
      '<td>'+(start?'<button class="detailBtn" data-key="'+row.key+'">详情</button>':'')+'</td></tr>';
  }).join('')||'<tr><td colspan="8" class="empty">没有找到匹配结果</td></tr>';
  var itemCount=new Set(rows.map(function(r){return r.key})).size;
  document.getElementById('count').textContent='显示 '+rows.length+' 条关键词 / '+itemCount+' 道题';
  document.getElementById('stats').textContent='总表 '+DATA.length+' 题，'+DATA.reduce(function(n,x){return n+x.keywords.length},0)+' 条关键词';
}
function findItem(key){return DATA.find(function(x){return x.source+'-'+x.order===key})}
function showDetail(key){
  var i=findItem(key);if(!i)return;
  document.getElementById('dTitle').textContent=i.order+'. '+i.title;
  document.getElementById('dMeta').textContent=i.source+' · '+i.code+' · '+i.priority+' · '+i.category;
  document.getElementById('dAnswer').textContent=i.answer||'暂无';
  document.getElementById('dLogic').textContent=i.logic||'暂无中文逻辑';
  document.getElementById('dLogicWrap').style.display=i.logic?'block':'none';
  document.getElementById('dAudioWrap').style.display=i.audio?'block':'none';
  var a=document.getElementById('dAudio');a.textContent=i.audio||'';a.href=i.audio||'#';
  document.getElementById('detail').showModal();
}
function csv(){
  var rows=flatRows();
  var header=['来源','题号','题目','类型','序号','关键词原词','名词形式','中文意思','Answer Key','中文逻辑','音频'];
  function q(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'}
  var lines=[header.map(q).join(',')];
  rows.forEach(function(r){var i=r.item,k=r.k;lines.push([i.source,i.code,i.title,i.category,k.number,k.original,k.noun_form,k.chinese,i.answer,i.logic,i.audio].map(q).join(','))});
  var blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='PTE_SST关键词筛选.csv';a.click();URL.revokeObjectURL(url);
}
document.getElementById('q').oninput=function(){state.q=this.value;render()};
document.querySelectorAll('.filter').forEach(function(b){b.onclick=function(){state.source=b.dataset.source;document.querySelectorAll('.filter').forEach(function(x){x.classList.toggle('on',x===b)});render()}});
document.getElementById('rows').onclick=function(e){var b=e.target.closest&&e.target.closest('.detailBtn');if(b)showDetail(b.dataset.key)};
document.getElementById('close').onclick=function(){document.getElementById('detail').close()};
document.getElementById('download').onclick=csv;
render();
</script>
</body>
</html>
