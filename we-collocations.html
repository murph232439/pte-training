"Robots","zh":"但它们可能减少某些行业的岗位，所以政府需要为工人提供再培训。","en":"However, they may reduce jobs in some industries, so governments need to retrain workers for new roles.","note":"让步 + 解决","source":"Robots · 完整理由句"},{"id":"ans-1799-3","kind":"sentence","group":"translation","question_id":"1799","name":"Robots","zh":"机器人可以降低生产成本，使日常商品和服务更可负担，因此即使低收入家庭也可能享受更高的物质生活水平。","en":"Robots can lower production costs and make everyday goods and services more affordable, so even low-income families may enjoy a higher material standard of living.","note":"可展开制造业、物流和农业自动化如何降低价格，提升普通家庭购买力，并与已有“效率提升”理由形成经济层面的补充。","source":"Robots · 完整理由句"},{"id":"ans-1799-4","kind":"sentence","group":"translation","question_id":"1799","name":"Robots","zh":"通过接管日常家务，机器人可以给人们更多自由时间用于家庭、休息和创造性追求，这直接提升他们的情绪健康。","en":"By taking over routine household chores, robots can give people more free time for family, rest and creative pursuits, which directly improves their emotional well-being.","note":"可举例扫地机器人、智能厨房和洗衣折叠设备，说明家务时间减少后，人们能更好平衡工作与生活，提升幸福感。","source":"Robots · 完整理由句"},{"id":"ans-1784-1","kind":"sentence","group":"translation","question_id":"1784","name":"Scientific subject","zh":"我会选生物学，因为它解释生物如何运作，直接关系到健康、食物和环境。","en":"I would choose biology, because it explains how living things work and connects directly to health, food and the environment.","note":"举例：疾病、基因、生态","source":"Scientific subject · 完整理由句"},{"id":"ans-1784-2","kind":"sentence","group":"translation","question_id":"1784","name":"Scientific subject","zh":"生物学也打开很多职业路径，从医学、研究到环境保护。","en":"Biology also opens up many career paths, from medicine and research to environmental protection.","note":"举例：医生、科研人员","source":"Scientific subject · 完整理由句"},{"id":"ans-1784-3","kind":"sentence","group":"translation","question_id":"1784","name":"Scientific subject","zh":"我选择生物学的另一个原因是它把实验室实验与实地考察结合，让学生在真实情境中检验关于生态系统和人类健康的想法。","en":"A further reason I choose biology is that it combines laboratory experiments with fieldwork, letting students test ideas about ecosystems and human health in real situations.","note":"可举水质检测、生态调查、公共卫生数据等例子，说明生物学不是死记硬背，而是能动手验证和解决现实问题。","source":"Scientific subject · 完整理由句"},{"id":"ans-1784-4","kind":"sentence","group":"translation","question_id":"1784","name":"Scientific subject","zh":"选择生物学还帮助我理解流行病和气候变化等紧迫社会议题，使我今天能做出明智的个人决定并有意义地参与公共讨论。","en":"Choosing biology also helps me understand urgent social issues like pandemics and climate change, enabling informed personal decisions and meaningful participation in public debates today.","note":"可举疫苗选择、环保政策、可持续消费等例子，说明学生物学能提升个人判断力和社会参与度。","source":"Scientific subject · 完整理由句"},{"id":"ans-1795-1","kind":"sentence","group":"translation","question_id":"1795","name":"Selecting specialist areas of study","zh":"一个好处是学生能专注自己喜欢的科目，在专业领域学得更深。","en":"One benefit is that students can focus on subjects they enjoy and develop deeper knowledge in their specialist area.","note":"举例：艺术、理科专长者","source":"Selecting specialist areas of study · 完整理由句"},{"id":"ans-1795-2","kind":"sentence","group":"translation","question_id":"1795","name":"Selecting specialist areas of study","zh":"但选得太早可能限制他们的选择，因为青少年常常不知道自己真正想做什么。","en":"However, choosing too early may limit their options, because teenagers often do not know what they really want to do.","note":"对比：早定 vs 晚定","source":"Selecting specialist areas of study · 完整理由句"},{"id":"ans-1795-3","kind":"sentence","group":"translation","question_id":"1795","name":"Selecting specialist areas of study","zh":"另一个好处是，提早选科能减少压力和厌倦感，让学校生活更有吸引力，因为青少年能把更多时间花在符合自己兴趣和优势的内容上。","en":"Another benefit is that early subject choice can reduce stress and boredom, making school more engaging because teenagers spend more time on materials that match their interests and strengths.","note":"可展开：不喜欢的科目容易导致厌学、走神和低参与度；允许选择能提升学习动力和课堂投入。可补一句平衡：核心基础课仍应保留，避免完全放任。","source":"Selecting specialist areas of study · 完整理由句"},{"id":"ans-1795-4","kind":"sentence","group":"translation","question_id":"1795","name":"Selecting specialist areas of study","zh":"一个主要缺点是，14岁就专业化可能缩窄学生的通识知识，使他们在写作、计算以及理解社会和科学等基本能力上更薄弱。","en":"A key disadvantage is that specialisation at fourteen may narrow students' general knowledge, leaving them weaker in essential skills such as writing, numeracy, and understanding of society and science.","note":"可展开：过早放弃数学、语言、历史等科目，会影响未来转专业、职业选择和公民素养。可建议保留必修核心课，并延后重大分流。","source":"Selecting specialist areas of study · 完整理由句"},{"id":"ans-3507-1","kind":"sentence","group":"translation","question_id":"3507","name":"Short working weeks","zh":"一个优势是缩短工作周能保住岗位，因为同样的工作量由更多员工分担。","en":"One advantage is that shorter weeks can preserve jobs, because the same amount of work is shared among more employees.","note":"举例：经济低迷期的企业","source":"Short working weeks · 完整理由句"},{"id":"ans-3507-2","kind":"sentence","group":"translation","question_id":"3507","name":"Short working weeks","zh":"但可能减少员工收入、增加公司成本，因为需要更多人完成同样的任务。","en":"However, it may reduce income for workers and increase costs for companies, since they need more staff to cover the same tasks.","note":"对比：员工收入 vs 企业成本","source":"Short working weeks · 完整理由句"},{"id":"ans-3507-3","kind":"sentence","group":"translation","question_id":"3507","name":"Short working weeks","zh":"另一个优势是，缩短工时可以改善员工健康与生产力，同时让年轻人有更多时间接受培训或教育，这可能提升他们的长期就业能力。","en":"Another advantage is that reduced working hours can improve employees' health and productivity, while giving young people more time to gain training or education, which may raise their long-term employability.","note":"可举年轻员工边工作边学习、实习或技能培训，减少长期失业导致的技能退化；也可说健康改善降低缺勤率、提高工作效率。","source":"Short working weeks · 完整理由句"},{"id":"ans-3507-4","kind":"sentence","group":"translation","question_id":"3507","name":"Short working weeks","zh":"然而，缩短工时只部分适用于成年人，因为许多人背负固定房贷和家庭开支，所以除非在灵活或高收入行业实施，否则减薪可能造成经济困难。","en":"However, shorter weeks are only partly suitable for adults, because many have fixed mortgages and family costs, so reduced pay may cause financial hardship unless implemented in flexible or high-income sectors.","note":"对比成年人与年轻人在财务责任上的差异；说明知识型、弹性行业较适用，制造业或低薪岗位难适用。可联系建议立场“部分适用成人”。","source":"Short working weeks · 完整理由句"},{"id":"ans-3501-1","kind":"sentence","group":"translation","question_id":"3501","name":"Studying plays","zh":"一个好处是经典戏剧能提升学生的语言、想象力，以及对历史和人性理解。","en":"One benefit is that classic plays develop students' language, imagination and understanding of history and human nature.","note":"举例：莎士比亚作品","source":"Studying plays · 完整理由句"},{"id":"ans-3501-2","kind":"sentence","group":"translation","question_id":"3501","name":"Studying plays","zh":"但过时的语言很难理解，可能让学生受挫、失去兴趣。","en":"However, the old-fashioned language can be hard to understand, which may discourage students and reduce their interest.","note":"举例：阅读困难","source":"Studying plays · 完整理由句"},{"id":"ans-3501-3","kind":"sentence","group":"translation","question_id":"3501","name":"Studying plays","zh":"另一个好处是表演或讨论这些戏剧能建立学生的自信和团队合作，因为他们必须一起诠释角色并在同学面前呈现观点。","en":"Another advantage is that performing or discussing these plays can build students' confidence and teamwork, because they must interpret roles together and present ideas in front of classmates.","note":"可举课堂小组表演《麦克白》片段，学生分工记台词、设计动作、互相纠错，最后展示。","source":"Studying plays · 完整理由句"},{"id":"ans-3501-4","kind":"sentence","group":"translation","question_id":"3501","name":"Studying plays","zh":"另一个问题是这些几百年前的作品常反映过时的社会价值观，因此一些学生可能感到疏离或不适，而不是投入课堂讨论。","en":"A further problem is that these centuries-old works often reflect outdated social values, so some students may feel alienated or uncomfortable rather than engaged in classroom discussion.","note":"比如《威尼斯商人》中性别或种族刻板印象，需要老师引导批判性讨论，避免学生排斥。","source":"Studying plays · 完整理由句"},{"id":"ans-4362-1","kind":"sentence","group":"translation","question_id":"4362","name":"Subject choosing","zh":"我部分同意学生应该选感兴趣的科目，因为兴趣能保持动力，也帮他们拿到更好的成绩。","en":"I partly agree that students should choose subjects they are interested in, because interest keeps them motivated and helps them get better results.","note":"举例：喜欢历史所以成绩好","source":"Subject choosing · 完整理由句"},{"id":"ans-4362-2","kind":"sentence","group":"translation","question_id":"4362","name":"Subject choosing","zh":"但就业前景也不应忽视，因为学生毕业后需要实用技能来养活自己。","en":"However, employment prospects should not be ignored, since students need practical skills to support themselves after graduation.","note":"举例：就业率高的专业","source":"Subject choosing · 完整理由句"},{"id":"ans-4362-3","kind":"sentence","group":"translation","question_id":"4362","name":"Subject choosing","zh":"另一个支持平衡选择的理由是，学生的兴趣常常会变，而劳动力市场需求也可能迅速变化，因此只依赖其中任何一方都可能在毕业后后悔。","en":"Another reason for a balanced choice is that a student's interests often change, while labour-market demands can shift quickly, so relying on either alone may lead to regret after graduation.","note":"可举例：入学时喜欢某专业，毕业时行业萎缩；或兴趣转向，导致转专业成本高。","source":"Subject choosing · 完整理由句"},{"id":"ans-4362-4","kind":"sentence","group":"translation","question_id":"4362","name":"Subject choosing","zh":"此外，把热情与就业能力结合起来，能让毕业生先进入稳定领域，再通过深造或职业转换追求兴趣，这更现实。","en":"Moreover, combining passion with employability allows graduates to enter a stable field first and then pursue their interests through further study or career changes, which is more realistic.","note":"可举例：先做稳定工作积累资金，再用业余时间学习或转行到真正热爱的领域。","source":"Subject choosing · 完整理由句"},{"id":"ans-4364-1","kind":"sentence","group":"translation","question_id":"4364","name":"Successful people","zh":"成长的地方会影响机会，因为教育、榜样和资源的可及性差异很大。","en":"The place where people grow up can shape their opportunities, because access to education, role models and resources varies greatly.","note":"举例：选择一个具体成功人物","source":"Successful people · 完整理由句"},{"id":"ans-4364-2","kind":"sentence","group":"translation","question_id":"4364","name":"Successful people","zh":"但个人努力和决心更重要，因为很多成功人士出身艰难。","en":"However, personal effort and determination matter more, since many successful people came from difficult backgrounds.","note":"举例：同一人物的早年经历","source":"Successful people · 完整理由句"},{"id":"ans-4364-3","kind":"sentence","group":"translation","question_id":"4364","name":"Successful people","zh":"埃隆·马斯克青年时期南非的社会与政治紧张，可能促使他形成独立思考与雄心，表明艰难环境即使限制机会，也能影响性格。","en":"South Africa’s social and political tensions during Elon Musk’s youth may have encouraged his independent thinking and ambition, showing that a difficult environment can influence character even when it limits opportunity.","note":"接在已有“地点影响机会”后，用同一人物说明地点还塑造性格与价值观，但这是间接影响，为下文个人选择做铺垫。","source":"Successful people · 完整理由句"},{"id":"ans-4364-4","kind":"sentence","group":"translation","question_id":"4364","name":"Successful people","zh":"然而，马斯克后来决定离开南非前往北美，尽管搬迁困难，这表明塑造他创业成功道路的是深思熟虑的个人选择，而非出生地。","en":"Yet Musk’s later decision to leave South Africa for North America, despite the difficulty of moving, shows that deliberate personal choices, not his birthplace, shaped his path to entrepreneurial success.","note":"接在已有“个人努力更重要”后，用移民和主动换环境说明地点只是起点，个人选择与行动才决定最终成就。","source":"Successful people · 完整理由句"},{"id":"ans-1790-1","kind":"sentence","group":"translation","question_id":"1790","name":"Taking part in sport","zh":"我同意，因为规律运动让成年人保持身体健康，降低心脏病和肥胖的风险。","en":"I agree, because regular exercise keeps adults physically healthy and reduces the risk of heart disease and obesity.","note":"举例：跑步、游泳","source":"Taking part in sport · 完整理由句"},{"id":"ans-1790-2","kind":"sentence","group":"translation","question_id":"1790","name":"Taking part in sport","zh":"运动也改善心理健康，因为它减压，让人更快乐、更自信。","en":"Sport also improves mental health, since it relieves stress and helps people feel happier and more confident.","note":"举例：团队运动、社交","source":"Taking part in sport · 完整理由句"},{"id":"ans-1790-3","kind":"sentence","group":"translation","question_id":"1790","name":"Taking part in sport","zh":"我也同意，因为参与运动给成年人带来宝贵的社交联系，团队活动和健身课减少孤独，并创造直接提升幸福感的归属感。","en":"I also agree because participating in sport gives adults valuable social connections, as team activities and fitness classes reduce loneliness and create a sense of belonging that directly boosts happiness.","note":"举例：业余足球、跑步俱乐部或社区健身课，让成年人结识朋友并减少孤独。","source":"Taking part in sport · 完整理由句"},{"id":"ans-1790-4","kind":"sentence","group":"translation","question_id":"1790","name":"Taking part in sport","zh":"此外，我同意，因为规律运动培养自律和目标感，帮助成年人保持规律作息并更有成就感，从而提升长期生活满意度和幸福感。","en":"Furthermore, I agree because regular sport builds discipline and a sense of purpose, helping adults maintain a structured routine and feel more accomplished, which raises long-term life satisfaction and happiness.","note":"举例：晨跑、每周固定训练或完成比赛目标，增强自律和成就感。","source":"Taking part in sport · 完整理由句"},{"id":"ans-4351-1","kind":"sentence","group":"translation","question_id":"4351","name":"Taking part in Sports","zh":"我同意，因为团队运动教合作、沟通，以及如何面对输赢。","en":"I agree, because team sports teach cooperation, communication and how to handle both winning and losing.","note":"举例：足球队、接力赛","source":"Taking part in Sports · 完整理由句"},{"id":"ans-4351-2","kind":"sentence","group":"translation","question_id":"4351","name":"Taking part in Sports","zh":"个人运动也培养自律和时间管理，因为运动员必须自己规律训练。","en":"Individual sports also build self-discipline and time management, since athletes must train regularly on their own.","note":"举例：游泳、长跑","source":"Taking part in Sports · 完整理由句"},{"id":"ans-4351-3","kind":"sentence","group":"translation","question_id":"4351","name":"Taking part in Sports","zh":"我也同意，因为体育无论个人还是团队都教人设定目标并坚持；运动员必须提升个人最好成绩或帮助团队实现共同目标，这培养了对学习和工作有用的韧性。","en":"I also agree because sports, whether solo or team-based, teach participants to set goals and persevere; athletes must improve personal bests or help a team reach a shared target, which builds resilience useful in study and work.","note":"可举例：个人跑者记录时间并逐步突破，团队为赛季目标一起训练；强调目标设定与抗压坚持。","source":"Taking part in Sports · 完整理由句"},{"id":"ans-4351-4","kind":"sentence","group":"translation","question_id":"4351","name":"Taking part in Sports","zh":"我同意的另一个理由是体育教人尊重规则和公平竞争，因为个人和团队都必须遵守规则、接受裁判判罚并礼貌对待对手，这些技能提升职场道德和社会责任感。","en":"Another reason I agree is that sports teach respect for rules and fair play, as individuals and teams must follow regulations, accept referees' decisions and treat opponents politely, skills that improve workplace ethics and social responsibility.","note":"可举例：足球比赛中服从判罚、网球中尊重界内界外、赛后与对手握手；说明规则意识可迁移到职场和社会生活。","source":"Taking part in Sports · 完整理由句"},{"id":"ans-1794-1","kind":"sentence","group":"translation","question_id":"1794","name":"Tax on high-sugar products","zh":"我部分同意，因为更高的价格能阻止人们购买含糖饮料，减少消费。","en":"I partly agree, because higher prices can discourage people from buying sugary drinks and reduce consumption.","note":"举例：其他国家的糖税效果","source":"Tax on high-sugar products · 完整理由句"},{"id":"ans-1794-2","kind":"sentence","group":"translation","question_id":"1794","name":"Tax on high-sugar products","zh":"但仅靠税收不够，因为健康饮食教育和清晰的食品标签同样重要。","en":"However, a tax alone is not enough, since education about healthy eating and clear food labels are also important.","note":"对比：单一措施 vs 综合措施","source":"Tax on high-sugar products · 完整理由句"},{"id":"ans-1794-3","kind":"sentence","group":"translation","question_id":"1794","name":"Tax on high-sugar products","zh":"我也部分不同意税收是唯一办法，因为糖税可能具有累退性，给低收入家庭带来负担，却无法改变成瘾消费者的习惯。","en":"I also partly disagree that taxation is the only solution, since a sugar tax may be regressive, burdening low-income households while failing to change addicted consumers’ habits.","note":"可举低收入家庭食品支出占比高、成瘾者价格不敏感，说明税不是唯一有效手段。","source":"Tax on high-sugar products · 完整理由句"},{"id":"ans-1794-4","kind":"sentence","group":"translation","question_id":"1794","name":"Tax on high-sugar products","zh":"因此我认为，政府应把税收与禁止向儿童投放含糖饮料广告、补贴更健康替代品等措施结合，因为行为改变需要支持性的食品环境。","en":"I would therefore argue that governments should combine taxation with measures such as banning sugary drink advertising to children and subsidising healthier alternatives, because behaviour change needs a supportive food environment.","note":"广告限制减少诱导、补贴降低健康食品价格，与已有教育标签形成互补。","source":"Tax on high-sugar products · 完整理由句"},{"id":"ans-1791-1","kind":"sentence","group":"translation","question_id":"1791","name":"Team sports","zh":"我部分同意团队运动更有益，因为球员要学会合作、沟通和互相支持，才能达成共同目标。","en":"I partly agree that team sports are more beneficial, because players learn to cooperate, communicate and support each other toward a common goal.","note":"举例：比赛中的配合","source":"Team sports · 完整理由句"},{"id":"ans-1791-2","kind":"sentence","group":"translation","question_id":"1791","name":"Team sports","zh":"但个人运动也有价值，因为它们能培养自律，教会人们依靠自己。","en":"However, individual sports also have value, since they build self-discipline and teach people to rely on themselves.","note":"举例：游泳、长跑","source":"Team sports · 完整理由句"},{"id":"ans-1791-3","kind":"sentence","group":"translation","question_id":"1791","name":"Team sports","zh":"此外，团队运动能营造强烈的归属感和社会支持，这可能比独自训练更能改善参与者的心理健康，并帮助他们更好地应对压力。","en":"In addition, team sports can create a strong sense of belonging and social support, which may improve participants' mental health and help them handle pressure better than training alone.","note":"举例：赛后队友互相鼓励、共同庆祝胜利，缓解焦虑和孤独感。","source":"Team sports · 完整理由句"},{"id":"ans-1791-4","kind":"sentence","group":"translation","question_id":"1791","name":"Team sports","zh":"相反，个人运动通常提供更大的灵活性，让人们按自己的节奏并围绕繁忙日程训练，因此对不喜欢群体环境的人来说可能更可持续。","en":"Conversely, individual sports often offer greater flexibility, allowing people to train at their own pace and around busy schedules, so they may be more sustainable for those who dislike group settings.","note":"举例：上班族可独自晨跑或游泳，不必迁就队伍时间，更容易长期坚持。","source":"Team sports · 完整理由句"},{"id":"ans-1798-1","kind":"sentence","group":"translation","question_id":"1798","name":"Technology and creativity","zh":"我认为担忧有一定道理，因为长时间被动看屏幕，留给想象和动手创作的时间就少了。","en":"I think there is some reason to worry, because spending hours passively watching screens leaves less time for imaginative play and hands-on creation.","note":"举例：刷短视频 vs 画画","source":"Technology and creativity · 完整理由句"},{"id":"ans-1798-2","kind":"sentence","group":"translation","question_id":"1798","name":"Technology and creativity","zh":"但科技也能促进创造力，因为人们可以用应用画画、作曲、剪视频，并与全世界分享想法。","en":"However, technology can also support creativity, since people can use apps to draw, compose music, edit videos and share ideas worldwide.","note":"举例：设计软件、编程","source":"Technology and creativity · 完整理由句"},{"id":"ans-1798-3","kind":"sentence","group":"translation","question_id":"1798","name":"Technology and creativity","zh":"过度使用屏幕可能通过不断通知和多任务切换使注意力碎片化；而创造力往往需要持续专注和深度反思，因此这种习惯确实可能削弱原创思考。","en":"Excessive screen time may fragment attention through constant notifications and multitasking, and since creativity often requires sustained concentration and deep reflection, this habit can genuinely weaken original thinking.","note":"可展开说明通知、短视频切换和多任务如何打断深度工作，降低发散思维和持续构思能力；与已有“被动看屏幕减少创作时间”形成递进，进一步解释担忧为何有道理。","source":"Technology and creativity · 完整理由句"},{"id":"ans-1798-4","kind":"sentence","group":"translation","question_id":"1798","name":"Technology and creativity","zh":"然而，当用户有意识地用设备学习、解决问题或开展协作项目时，屏幕可以成为创造工具而非干扰，因此结果取决于有目的的使用和引导。","en":"Yet when users deliberately employ devices for learning, problem-solving or collaborative projects, screens can function as creative tools rather than distractions, so the outcome depends on purposeful use and guidance.","note":"可举例编程、小组项目、在线课程和教师或家长引导下的数字创作，说明主动使用能培养问题解决和迭代思维；与已有“用应用创作分享”连用，但重点转向目的性与引导。","source":"Technology and creativity · 完整理由句"},{"id":"ans-3512-1","kind":"sentence","group":"translation","question_id":"3512","name":"Technology used for space travel","zh":"我部分同意政府应关注民生，因为医疗、教育和住房问题每天都影响数百万人。","en":"I partly agree that governments should focus on people's lives, because problems like healthcare, education and housing affect millions of people every day.","note":"举例：医院、学校","source":"Technology used for space travel · 完整理由句"},{"id":"ans-3512-2","kind":"sentence","group":"translation","question_id":"3512","name":"Technology used for space travel","zh":"但航天技术也带来长期好处，因为卫星改善通信、天气预报和导航。","en":"However, space technology also brings long-term benefits, since satellites improve communication, weather forecasting and navigation.","note":"举例：GPS、气象","source":"Technology used for space travel · 完整理由句"},{"id":"ans-3512-3","kind":"sentence","group":"translation","question_id":"3512","name":"Technology used for space travel","zh":"政府应优先考虑民众生活，因为公共福利是其核心职责；若没有稳定收入、清洁用水和基本安全，公民无法支持昂贵的航天项目。","en":"Governments should prioritise people's lives because public welfare is their core responsibility, and without stable incomes, clean water and basic safety, citizens cannot support expensive space programmes.","note":"举例：基础公共服务、公众信任、税收支持；说明民生不稳会削弱长期航天预算的政治基础。","source":"Technology used for space travel · 完整理由句"},{"id":"ans-3512-4","kind":"sentence","group":"translation","question_id":"3512","name":"Technology used for space travel","zh":"同时，目标明确的航天研究可以带来医疗、材料和机器人创新，这些创新之后会改善医院、农业和救灾，因此它应补充而非取代社会支出。","en":"At the same time, well-targeted space research can generate medical, material and robotic innovations that later improve hospitals, farming and disaster relief, so it should complement rather than replace social spending.","note":"举例：航天技术转化到医疗设备、农业监测、救灾机器人；强调预算分配而非二选一。","source":"Technology used for space travel · 完整理由句"},{"id":"ans-1793-1","kind":"sentence","group":"translation","question_id":"1793","name":"Tertiary education","zh":"大学教育应该为学生进入职场做准备，因为实用技能和实习能帮他们毕业后找到工作。","en":"Tertiary education should prepare students for the workplace, because practical skills and internships help them find jobs after graduation.","note":"举例：实习、职业课程","source":"Tertiary education · 完整理由句"},{"id":"ans-1793-2","kind":"sentence","group":"translation","question_id":"1793","name":"Tertiary education","zh":"但大学也应该为学生的人生做准备，因为批判性思维和广博知识帮他们做更好的决定。","en":"However, university should also prepare students for life, since critical thinking and broad knowledge help them make better decisions.","note":"举例：通识课程","source":"Tertiary education · 完整理由句"},{"id":"ans-1793-3","kind":"sentence","group":"translation","question_id":"1793","name":"Tertiary education","zh":"平衡的课程更好，因为只注重职场训练会让毕业生在行业变化时很脆弱，而只注重人生准备又可能让他们缺少雇主期望的具体技能。","en":"A balanced curriculum is better because focusing only on workplace training can make graduates vulnerable when industries change, while broad life preparation alone may leave them without the specific skills employers expect.","note":"可举例说明AI和自动化导致岗位快速变化，因此学生既需要可迁移能力，也需要一定专业技能。","source":"Tertiary education · 完整理由句"},{"id":"ans-1793-4","kind":"sentence","group":"translation","question_id":"1793","name":"Tertiary education","zh":"大学应把职业导向学习和人生导向学习结合，因为沟通、团队合作和伦理判断等可迁移能力既能提升职业成功，也能提升个人幸福。","en":"Universities should combine career-focused learning with life-focused learning, because transferable abilities such as communication, teamwork, and ethical judgment improve both professional success and personal wellbeing.","note":"可举例小组项目、课堂演讲和伦理案例分析，说明这些能力在工作和生活中都长期有用。","source":"Tertiary education · 完整理由句"},{"id":"ans-1752-1","kind":"sentence","group":"translation","question_id":"1752","name":"The Digital Age","zh":"我认为数字时代让我们更有知识，因为我们能在几秒内获取信息、课程和全球新闻。","en":"I think the digital age has made us more knowledgeable, because we can access information, courses and global news within seconds.","note":"举例：在线学习、搜索","source":"The Digital Age · 完整理由句"},{"id":"ans-1752-2","kind":"sentence","group":"translation","question_id":"1752","name":"The Digital Age","zh":"但它也可能让人变懒，因为人们依赖搜索引擎，不再记忆或深入思考。","en":"However, it can also make us lazier, since people rely on search engines instead of memorising or thinking deeply.","note":"对比：主动使用 vs 被动依赖","source":"The Digital Age · 完整理由句"},{"id":"ans-1752-3","kind":"sentence","group":"translation","question_id":"1752","name":"The Digital Age","zh":"根据我自己的经历，数字平台也能让我们更有知识，因为互动教程和在线社区让我们能练习新技能并获得反馈，比传统书籍快得多。","en":"From my own experience, digital platforms can also make us more knowledgeable, because interactive tutorials and online communities let us practise new skills and receive feedback far faster than traditional books.","note":"个人例子：通过 YouTube、B站或论坛学编程、修图、烹饪，边做边得到反馈；与只读书本对比。","source":"The Digital Age · 完整理由句"},{"id":"ans-1752-4","kind":"sentence","group":"translation","question_id":"1752","name":"The Digital Age","zh":"以我自己的经历，数字便利也会让我们更懒，因为应用自动处理导航和购物等任务，减少了我们自行计划、计算或记路的需要。","en":"In my own experience, digital convenience can make us lazier as well, since apps automatically handle tasks like navigation and shopping, reducing our need to plan, calculate or remember routes ourselves.","note":"个人例子：以前看纸质地图、心算找零、列购物清单；现在依赖 GPS、外卖和一键下单。","source":"The Digital Age · 完整理由句"},{"id":"ans-4347-1","kind":"sentence","group":"translation","question_id":"4347","name":"The purpose of education","zh":"我认为教育应该培养人贡献社会，因为国家需要熟练的工人和负责任的公民。","en":"I think education should prepare people to contribute to society, because a country needs skilled workers and responsible citizens.","note":"举例：职业培训、公民教育","source":"The purpose of education · 完整理由句"},{"id":"ans-4347-2","kind":"sentence","group":"translation","question_id":"4347","name":"The purpose of education","zh":"但它也应该帮个人实现人生，因为个人兴趣和幸福和经济贡献同样重要。","en":"However, it should also help individuals fulfil their lives, since personal interests and happiness matter as much as economic contribution.","note":"举例：艺术、志愿服务","source":"The purpose of education · 完整理由句"},{"id":"ans-4347-3","kind":"sentence","group":"translation","question_id":"4347","name":"The purpose of education","zh":"教育也应教学生合作、批判思考和解决社会问题，因为民主社区依赖能做出明智集体决策的公民，而不仅是填补工作岗位。","en":"Education should also teach students to cooperate, think critically, and resolve social problems, because democratic communities depend on citizens who can make informed collective decisions beyond simply filling jobs.","note":"可举例：社区服务项目、课堂辩论、公共议题研究；说明这些能力让国家和社会受益，而不只是培训岗位技能。","source":"The purpose of education · 完整理由句"},{"id":"ans-4347-4","kind":"sentence","group":"translation","question_id":"4347","name":"The purpose of education","zh":"同时，教育帮助个人发现自身才能、价值观和人生目标，从而设计自己认为有意义的生活，而非仅仅迎合外界期待。","en":"Meanwhile, education helps individuals discover their talents, values, and sense of purpose, so they can design lives they find meaningful rather than merely conforming to external expectations.","note":"可举例：生涯规划、心理咨询、选修课、志愿服务；说明个人意义不等于自私，仍可反哺社会。","source":"The purpose of education · 完整理由句"},{"id":"ans-3499-1","kind":"sentence","group":"translation","question_id":"3499","name":"The value of humanities","zh":"我认为人文学科仍然有价值，因为历史和文学等学科培养批判性思维，帮人理解不同观点。","en":"I think the humanities are still valuable, because subjects like history and literature develop critical thinking and help people understand different perspectives.","note":"举例：分析文本、讨论伦理","source":"The value of humanities · 完整理由句"},{"id":"ans-3499-2","kind":"sentence","group":"translation","question_id":"3499","name":"The value of humanities","zh":"它们对职业也有帮助，因为沟通、同理心和伦理判断在法律、商业和医学中都很重要。","en":"They also benefit careers, since communication, empathy and ethical judgment are important in law, business and medicine.","note":"举例：医生需要同理心","source":"The value of humanities · 完整理由句"},{"id":"ans-3499-3","kind":"sentence","group":"translation","question_id":"3499","name":"The value of humanities","zh":"在自动化和人工智能迅速发展的时代，人文学科依然至关重要，因为它们教我们质疑技术变革、想象替代性未来，并做出机器无法独自完成的伦理决策。","en":"In an era of rapid automation and AI, humanities remain vital because they teach us to question technological change, imagine alternative futures, and make ethical decisions that machines cannot make alone.","note":"可举例说明AI生成内容、基因编辑或平台算法带来的伦理争议，强调人文训练能提供价值判断和未来想象。","source":"The value of humanities · 完整理由句"},{"id":"ans-3499-4","kind":"sentence","group":"translation","question_id":"3499","name":"The value of humanities","zh":"此外，人文学科通过帮助公民解读媒体、识别宣传并欣赏文化差异来维系民主社会，这在全球互联且政治极化的世界中至关重要。","en":"Moreover, the humanities sustain democratic societies by helping citizens interpret media, recognize propaganda, and appreciate cultural differences, which is essential in a globally connected and politically polarized world.","note":"可联系假新闻、社交媒体回音室和跨文化冲突，说明历史、哲学与文学如何培养负责任的公民。","source":"The value of humanities · 完整理由句"},{"id":"ans-4345-1","kind":"sentence","group":"translation","question_id":"4345","name":"Tuition fee","zh":"我部分同意，因为学生毕业后获得更高薪水，个人受益，所以应该分担费用。","en":"I partly agree, because students benefit personally from higher salaries after graduation, so they should contribute to the cost.","note":"举例：毕业后的薪资差异","source":"Tuition fee · 完整理由句"},{"id":"ans-4345-2","kind":"sentence","group":"translation","question_id":"4345","name":"Tuition fee","zh":"但全额付费会把贫困学生排除在外，所以需要奖学金和贷款来保证教育公平。","en":"However, paying the full cost would exclude poor students, so scholarships and loans are necessary to keep education fair.","note":"对比：公平 vs 效率","source":"Tuition fee · 完整理由句"},{"id":"ans-4345-3","kind":"sentence","group":"translation","question_id":"4345","name":"Tuition fee","zh":"我不同意全额收费，因为大学产生广泛的公共收益，如更好的医疗、科研和公共服务，所以纳税人应分担成本，而学生支付合理份额。","en":"I disagree with full fees because universities generate broad public benefits, such as better healthcare, research and public services, so taxpayers should share the cost while students pay a fair portion.","note":"可举医学研究、公共服务人才、社会创新等例子，说明高等教育不只让个人受益，因此不应由学生独自承担全部成本。","source":"Tuition fee · 完整理由句"},{"id":"ans-4345-4","kind":"sentence","group":"translation","question_id":"4345","name":"Tuition fee","zh":"公平的资助模式应让毕业生按收入比例还款，这样学生仍分担成本，又不会因贫困家庭无法承担的前期费用而被挡在门外。","en":"A fair funding model should let graduates repay through income-contingent contributions, so students still share costs without being blocked by upfront fees that poor families cannot afford.","note":"可说明毕业后收入达到一定水平才还款，低收入时暂缓，兼顾个人责任与教育机会公平。","source":"Tuition fee · 完整理由句"},{"id":"ans-3515-1","kind":"sentence","group":"translation","question_id":"3515","name":"Unhealthy lifestyles","zh":"两种常见的不健康生活方式是长时间久坐和吃太多快餐，这两者都会导致肥胖和心脏病。","en":"Two common unhealthy lifestyles are sitting for long hours and eating too much fast food, both of which can lead to obesity and heart disease.","note":"举例：办公室工作、外卖","source":"Unhealthy lifestyles · 完整理由句"},{"id":"ans-3515-2","kind":"sentence","group":"translation","question_id":"3515","name":"Unhealthy lifestyles","zh":"政府可以通过资助公共运动设施、提供免费体检和对含糖饮料征税来帮助。","en":"Governments can help by funding public sports facilities, offering free health checks and taxing sugary drinks.","note":"举例：社区健身房、免费体检","source":"Unhealthy lifestyles · 完整理由句"},{"id":"ans-3515-3","kind":"sentence","group":"translation","question_id":"3515","name":"Unhealthy lifestyles","zh":"其他不健康生活方式包括吸烟、过度饮酒和长期睡眠不足，这些会削弱免疫力，并增加患癌症、肝病和心理健康问题的风险。","en":"Other unhealthy lifestyles include smoking, excessive alcohol consumption and chronic sleep deprivation, which weaken immunity and increase the risks of cancer, liver disease and mental health problems.","note":"可具体列举吸烟、酗酒、熬夜或睡眠不足，并说明它们分别对肺、肝和情绪状态的危害，作为对已有“久坐+快餐”问题的补充。","source":"Unhealthy lifestyles · 完整理由句"},{"id":"ans-3515-4","kind":"sentence","group":"translation","question_id":"3515","name":"Unhealthy lifestyles","zh":"政府还应提供易获得的心理咨询、戒烟服务和更严格的酒类广告限制，这样人们就能在专业支持下改变这些习惯，而不是只靠意志力。","en":"Governments should also provide accessible counseling, smoking cessation services and stricter limits on alcohol advertising, so people can change these habits with professional support rather than willpower alone.","note":"可举例社区心理咨询、戒烟门诊、限制酒类广告和销售时间，说明政府服务如何降低不健康习惯的发生率。","source":"Unhealthy lifestyles · 完整理由句"},{"id":"ans-3508-1","kind":"sentence","group":"translation","question_id":"3508","name":"Wearing uniforms","zh":"我认为学校应该有校服规定，因为它们减少衣着上的攀比，营造平等感。","en":"I think schools should have uniform rules, because they reduce peer pressure about clothes and create a sense of equality.","note":"举例：不同家庭背景的学生","source":"Wearing uniforms · 完整理由句"},{"id":"ans-3508-2","kind":"sentence","group":"translation","question_id":"3508","name":"Wearing uniforms","zh":"但规定不应该太严，因为学生应该在特殊日子有一些表达自我的自由。","en":"However, the rules should not be too strict, since students should have some freedom to express themselves on special days.","note":"让步：主题活动日","source":"Wearing uniforms · 完整理由句"},{"id":"ans-3508-3","kind":"sentence","group":"translation","question_id":"3508","name":"Wearing uniforms","zh":"严格的校服规定还能节省家庭开支、减少早晨压力，因为家长不必购买许多时尚服装，孩子也不用每天争论穿什么。","en":"Strict uniform rules can also save families money and reduce morning stress, because parents do not need to buy many fashionable outfits or children argue about what to wear each day.","note":"可举例：低收入家庭、早晨准备时间、校服循环使用；说明统一着装能降低经济负担并提高效率。","source":"Wearing uniforms · 完整理由句"},{"id":"ans-3508-4","kind":"sentence","group":"translation","question_id":"3508","name":"Wearing uniforms","zh":"此外，适度严格的校服规定有助于学校识别学生、维护安全，而允许一定灵活性可避免学生觉得个人身份被完全控制。","en":"Moreover, moderately strict uniform rules help schools identify students and maintain safety, while allowing some flexibility prevents students from feeling that their personal identity is completely controlled.","note":"可展开：校外活动身份识别、访客管理、安全演练；同时保留配饰、发型等有限选择，体现平衡。","source":"Wearing uniforms · 完整理由句"},{"id":"ans-3509-1","kind":"sentence","group":"translation","question_id":"3509","name":"Women raise a family","zh":"在个人层面，女性可以和伴侣分担家务和育儿，这样家庭责任不会只落在她们身上。","en":"On a personal level, women can share housework and childcare with their partners, so that family duties do not fall only on them.","note":"举例：家务分工、家人帮忙","source":"Women raise a family · 完整理由句"},{"id":"ans-3509-2","kind":"sentence","group":"translation","question_id":"3509","name":"Women raise a family","zh":"在国家层面，政府应该提供可负担的托儿服务和灵活的工作安排，让妈妈们能继续工作。","en":"At the national level, governments should provide affordable childcare and flexible working arrangements, so that mothers can stay in work.","note":"举例：托儿补贴、弹性工作","source":"Women raise a family · 完整理由句"},{"id":"ans-3509-3","kind":"sentence","group":"translation","question_id":"3509","name":"Women raise a family","zh":"在个人层面，女性应通过设定切合实际的每日优先级和寻求情感支持来保护身心健康，因为长期倦怠会让同时维持事业和家庭变得更难。","en":"On a personal level, women should protect their mental and physical health by setting realistic daily priorities and seeking emotional support, because long-term burnout can make it much harder to sustain both a career and a family.","note":"举例：设定每日优先级、规律运动、心理咨询、向伴侣或朋友倾诉，避免过度追求完美。","source":"Women raise a family · 完整理由句"},{"id":"ans-3509-4","kind":"sentence","group":"translation","question_id":"3509","name":"Women raise a family","zh":"在国家层面，政府应引入共享育儿假，并为提拔女性进入领导层的公司提供税收激励，从而减少职业惩罚，并让父亲承担更多家庭责任。","en":"At the national level, governments should introduce shared parental leave and tax incentives for firms that promote women into leadership, so that career penalties are reduced and fathers take on more family responsibility.","note":"举例：父亲强制育儿假、企业晋升女性可获税收减免、反职场歧视条款。","source":"Women raise a family · 完整理由句"},{"id":"ans-3505-1","kind":"sentence","group":"translation","question_id":"3505","name":"Working less time","zh":"我部分同意，因为自动化和 AI 能接手重复性工作，人们可能工作时间更少。","en":"I partly agree, because automation and AI can take over repetitive tasks, so people may need to work fewer hours.","note":"举例：工厂自动化、远程办公","source":"Working less time · 完整理由句"},{"id":"ans-3505-2","kind":"sentence","group":"translation","question_id":"3505","name":"Working less time","zh":"但有些行业仍需要长时间工作，不是所有工人都能平等受益，所以变化可能不均衡。","en":"However, some industries still need long hours, and not all workers can benefit equally, so the change may be uneven.","note":"对比：知识型 vs 服务型","source":"Working less time · 完整理由句"},{"id":"ans-3505-3","kind":"sentence","group":"translation","question_id":"3505","name":"Working less time","zh":"政府和工会可能推动缩短正式工作周，正如四天工作制试验所示，但临时工和自雇者常被排除，因此未来工时减少将在很大程度上取决于就业身份。","en":"Governments and unions may push for shorter official workweeks, as four-day-week trials have shown, yet temporary and self-employed workers are often excluded, so future reductions in working time will depend heavily on employment status.","note":"可举英国或冰岛四天工作制试验，并对比正式员工与零工、自雇者的覆盖差异；用来支撑‘部分同意但变化不均衡’。","source":"Working less time · 完整理由句"},{"id":"ans-3505-4","kind":"sentence","group":"translation","question_id":"3505","name":"Working less time","zh":"不断上涨的生活成本可能迫使许多人延长工时或做第二份工作以维持收入，因此即使技术提高了效率，所有人实际花在工作上的总时间也未必会下降。","en":"Rising living costs may force many people to work longer or take second jobs to maintain their income, so even if technology raises efficiency, the total time people actually spend working may not fall for everyone.","note":"可结合通胀、房租、副业和零工经济，说明经济压力会抵消技术带来的工时减少；与自动化理由形成让步对比。","source":"Working less time · 完整理由句"},{"id":"ans-4350-1","kind":"sentence","group":"translation","question_id":"4350","name":"Works of literature","zh":"我不同意，因为文学作品提升语言能力、想象力，以及从他人视角看世界的能力。","en":"I disagree, because literature develops language skills, imagination and the ability to see the world through other people's eyes.","note":"举例：阅读小说带来的改变","source":"Works of literature · 完整理由句"},{"id":"ans-4350-2","kind":"sentence","group":"translation","question_id":"4350","name":"Works of literature","zh":"它也保存文化和历史，因为经典作品反映那个时代的价值观和困境。","en":"It also preserves culture and history, since classic works reflect the values and struggles of their time.","note":"举例：经典作品","source":"Works of literature · 完整理由句"},{"id":"ans-4350-3","kind":"sentence","group":"translation","question_id":"4350","name":"Works of literature","zh":"此外，文学并非浪费时间，因为它培养批判性思维，教学生解读模糊证据、质疑假设并形成理性判断，这对学术和职业生活都有用。","en":"Moreover, literature is not a waste of time because it sharpens critical thinking, teaching students to interpret ambiguous evidence, question assumptions, and form reasoned judgments useful in academic and professional life.","note":"可举例说明分析小说中的不可靠叙述者、人物动机或伦理冲突，能迁移到法律、商业、医学等需要处理复杂信息的领域。","source":"Works of literature · 完整理由句"},{"id":"ans-4350-4","kind":"sentence","group":"translation","question_id":"4350","name":"Works of literature","zh":"此外，阅读文学能增强专注力和深度阅读能力，这在分心的数字时代很稀缺，能让学生处理长篇复杂文本，而不是略读碎片化信息。","en":"In addition, reading literature strengthens concentration and deep reading, which are rare in a distracted digital age, enabling students to process long, complex texts instead of skimming fragmented information.","note":"可对比刷短视频与读小说的注意力模式，说明深度阅读如何提升学习耐力、理解复杂论证和考试长文的能力。","source":"Works of literature · 完整理由句"},{"id":"ans-1800-1","kind":"sentence","group":"translation","question_id":"1800","name":"Zoos","zh":"我认为动物园能造福社会，因为它们保护濒危物种，支持繁育计划。","en":"I think zoos can benefit society, because they protect endangered species and support breeding programmes.","note":"举例：大熊猫繁育","source":"Zoos · 完整理由句"},{"id":"ans-1800-2","kind":"sentence","group":"translation","question_id":"1800","name":"Zoos","zh":"但动物园必须提供合适的生活条件，否则动物受罪，教育价值也有限。","en":"However, zoos must provide proper living conditions, otherwise animals suffer and the educational value is limited.","note":"让步 + 条件","source":"Zoos · 完整理由句"},{"id":"ans-1800-3","kind":"sentence","group":"translation","question_id":"1800","name":"Zoos","zh":"从受益角度看，管理良好的动物园能教育城市游客了解生物多样性和栖息地丧失，这可能鼓励人们做出减少对自然世界伤害的日常选择。","en":"On the benefit side, well-run zoos can educate urban visitors about biodiversity and habitat loss, which may encourage everyday choices that reduce harm to the natural world.","note":"可举学校团体、解说牌、互动展览等例子，说明教育如何转化为环保行为；同时强调只适用于管理规范的动物园。","source":"Zoos · 完整理由句"},{"id":"ans-1800-4","kind":"sentence","group":"translation","question_id":"1800","name":"Zoos","zh":"通过资助野外项目和参与再引入计划，声誉良好的动物园能帮助恢复野生种群，因此它们发挥着不仅仅是展示动物的有益保护作用。","en":"By funding field projects and joining reintroduction programmes, reputable zoos can help restore wild populations, so they play a useful conservation role beyond simply displaying animals.","note":"举例：动物园资助反盗猎、栖息地恢复或物种放归项目，并说明这种资金与专业支持对野外保护有实际贡献。","source":"Zoos · 完整理由句"}];

  if(startSentence)startSentence.onclick=function(){var select=document.getElementById("questionSelect");startSentences(select?select.value:"")};
  var saveApiKey=document.getElementById("saveApiKey");
  if(saveApiKey)saveApiKey.onclick=function(){var field=document.getElementById("apiKeyInput"),status=document.getElementById("apiKeyStatus"),value=field?field.value.trim():"";if(value){localStorage.setItem("ds_key",value);if(field)field.value="";if(status)status.textContent="API Key 已保存在本机。"}else{localStorage.removeItem("ds_key");if(status)status.textContent="已清除 API Key。"}};
  var input=document.getElementById("answerInput"),check=document.getElementById("checkAnswer"),show=document.getElementById("showAnswer");
  function checkAnswer(){
    if(!input||!QUEUE.length)return;
    var typed=normalizeAnswer(input.value),expected=normalizeAnswer(QUEUE[QI].en),msg=document.getElementById("checkMsg");
    if(!typed){input.className="answerInput wrong";msg.className="checkMsg bad";msg.textContent="先输入英文词伙。";return}
    if(typed===expected){
      input.className="answerInput right";msg.className="checkMsg ok";
      if(MODE==="quick"){QUICK.score++;if(QUICK.timed){var scoreEl=document.querySelector(".quickbar span:last-child");if(scoreEl)scoreEl.textContent=QUICK.score+" 分"}msg.textContent="正确，进入下一题。"}else{msg.textContent="正确。"}
      revealStudy();
    }else{
      input.className="answerInput wrong";msg.className="checkMsg bad";msg.textContent="还不对，再检查词序、介词或单复数。";input.focus()
    }
  }
  if(check)check.onclick=checkAnswer;
  if(input)input.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();checkAnswer()}});
  if(show)show.onclick=revealStudy;
  var aiRefine=document.getElementById("aiRefine");
  if(aiRefine)aiRefine.onclick=refineTranslation;
  document.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){mark(QUEUE[QI].id,b.dataset.r);QI++;if(QI>=QUEUE.length){MODE="review";QI=0;QUEUE=[]}render()}});
  var nextQuick=document.getElementById("nextQuick");
  if(nextQuick)nextQuick.onclick=quickNext;
  var quickAgain=document.getElementById("quickAgain");
  if(quickAgain)quickAgain.onclick=function(){if(QUICK.timed)startQuick(QUICK.group);else startSentences(QUICK.questionId)};
  var quickChoose=document.getElementById("quickChoose");
  if(quickChoose)quickChoose.onclick=function(){QUICK.active=false;QUICK.done=false;QUICK.left=300;render()};
}
document.getElementById("tabs").onclick=function(e){if(e.target.tagName!=="BUTTON")return;clearQuickTimer();QUICK.active=false;QUICK.done=false;QUICK.left=300;MODE=e.target.dataset.m;QI=0;QUEUE=[];document.querySelectorAll(".tabs button").forEach(function(b){b.className=b.dataset.m===MODE?"on":""});render()};
render();
</script></body></html>
