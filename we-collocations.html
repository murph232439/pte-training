<script>
var DATA=[{"id":"fn-01","kind":"function","group":"effect","en":"lead to","zh":"导致；带来","pattern":"lead to + noun / doing","example":"Excessive screen time can lead to poor concentration and sleep problems.","note":"强调自然结果，后面接名词或动名词。"},{"id":"fn-02","kind":"function","group":"effect","en":"result in","zh":"造成；导致","pattern":"result in + noun","example":"A lack of public funding may result in poorer public services.","note":"常用于正式写作，结果通常是客观后果。"},{"id":"fn-03","kind":"function","group":"effect","en":"give rise to","zh":"引发；引起","pattern":"give rise to + noun","example":"The rapid use of AI has given rise to concerns about privacy.","note":"多接问题、争论、担忧等抽象名词。"},{"id":"fn-04","kind":"function","group":"effect","en":"stem from","zh":"源于；来自","pattern":"stem from + noun","example":"Many health problems stem from unhealthy daily habits.","note":"说明问题的来源，常和健康、贫困、教育等话题搭配。"},{"id":"fn-05","kind":"function","group":"effect","en":"be attributed to","zh":"归因于","pattern":"be attributed to + noun","example":"The rise in obesity can be attributed to processed food and sedentary lifestyles.","note":"比 because of 更正式，常用于分析原因。"},{"id":"fn-06","kind":"function","group":"effect","en":"have a significant impact on","zh":"对……有重大影响","pattern":"have a significant impact on + noun","example":"Government policy can have a significant impact on public health.","note":"把 impact 换成 positive / negative 可以表达立场。"},{"id":"fn-07","kind":"function","group":"effect","en":"contribute to","zh":"促成；加剧","pattern":"contribute to + noun / doing","example":"Regular exercise contributes to both physical and mental well-being.","note":"既可用于积极结果，也可用于问题加剧。"},{"id":"fn-08","kind":"function","group":"effect","en":"come at the expense of","zh":"以牺牲……为代价","pattern":"come at the expense of + noun","example":"Economic growth should not come at the expense of the environment.","note":"常用于讨论利弊冲突和长期代价。"},{"id":"fn-09","kind":"function","group":"evaluate","en":"outweigh","zh":"超过；大于","pattern":"A outweigh B","example":"The benefits of public transport outweigh its short-term costs.","note":"比较利弊时直接接宾语，不用 more。"},{"id":"fn-10","kind":"function","group":"evaluate","en":"do more harm than good","zh":"弊大于利","pattern":"do more harm than good","example":"Strict rules can do more harm than good if they limit personal freedom.","note":"比只说 bad 更具体，立场也更清楚。"},{"id":"fn-11","kind":"function","group":"evaluate","en":"be beneficial to","zh":"对……有益","pattern":"be beneficial to + noun","example":"Access to public libraries is beneficial to low-income families.","note":"比 good for 更正式，适合 WE 主体段。"},{"id":"fn-12","kind":"function","group":"evaluate","en":"have more advantages than disadvantages","zh":"利大于弊","pattern":"have more advantages than disadvantages","example":"Working from home has more advantages than disadvantages for many employees.","note":"适合利弊题的直接表态。"},{"id":"fn-13","kind":"function","group":"evaluate","en":"strike a balance between","zh":"在……之间取得平衡","pattern":"strike a balance between A and B","example":"Schools should strike a balance between academic study and physical activity.","note":"适合给出折中立场。"},{"id":"fn-14","kind":"function","group":"evaluate","en":"be superior to","zh":"优于；比……更好","pattern":"be superior to + noun","example":"Online learning is not always superior to face-to-face teaching.","note":"后面用 to，不用 than。"},{"id":"fn-15","kind":"function","group":"evaluate","en":"pale in comparison with","zh":"与……相比显得逊色","pattern":"pale in comparison with + noun","example":"The convenience of digital art pales in comparison with seeing a painting in person.","note":"适合强烈比较，注意语气较强。"},{"id":"fn-16","kind":"function","group":"evaluate","en":"take a balanced approach to","zh":"对……采取平衡做法","pattern":"take a balanced approach to + noun / doing","example":"Governments should take a balanced approach to economic growth and environmental protection.","note":"适合结尾给出兼顾双方的方案。"},{"id":"fn-17","kind":"function","group":"solution","en":"take effective measures to","zh":"采取有效措施做……","pattern":"take effective measures to + verb","example":"Governments should take effective measures to reduce air pollution.","note":"措施类题目开头很好用。"},{"id":"fn-18","kind":"function","group":"solution","en":"play a vital role in","zh":"在……中发挥关键作用","pattern":"play a vital role in + noun / doing","example":"Public libraries play a vital role in equal access to knowledge.","note":"把 vital 换成 important 也可以调节强度。"},{"id":"fn-19","kind":"function","group":"solution","en":"be responsible for","zh":"对……负责","pattern":"be responsible for + noun / doing","example":"Both governments and individuals are responsible for protecting the environment.","note":"适合明确责任主体。"},{"id":"fn-20","kind":"function","group":"solution","en":"invest in","zh":"投资于；投入","pattern":"invest in + noun","example":"Countries need to invest in renewable energy and public transport.","note":"多用于政府、企业、教育投入。"},{"id":"fn-21","kind":"function","group":"solution","en":"provide access to","zh":"提供获得……的机会","pattern":"provide access to + noun","example":"Schools should provide access to free mental health support.","note":"比 help students get 更正式。"},{"id":"fn-22","kind":"function","group":"solution","en":"raise awareness of","zh":"提高对……的意识","pattern":"raise awareness of + noun","example":"Campaigns can raise awareness of the risks of unhealthy eating.","note":"常和 public / environmental / health 搭配。"},{"id":"fn-23","kind":"function","group":"solution","en":"impose restrictions on","zh":"对……施加限制","pattern":"impose restrictions on + noun","example":"Some cities have imposed restrictions on private car use.","note":"适合讨论政府监管和公共政策。"},{"id":"fn-24","kind":"function","group":"solution","en":"give priority to","zh":"优先考虑","pattern":"give priority to + noun","example":"Policymakers should give priority to public health and education.","note":"后面接名词或动名词。"},{"id":"fn-25","kind":"function","group":"growth","en":"develop skills in","zh":"培养……方面的技能","pattern":"develop skills in + noun / doing","example":"Students can develop skills in communication and problem-solving.","note":"把 skills 换成 ability 时，介词通常也要调整。"},{"id":"fn-26","kind":"function","group":"growth","en":"gain experience in","zh":"获得……方面的经验","pattern":"gain experience in + noun / doing","example":"Young people gain experience in teamwork through volunteer work.","note":"适合个人经历和职业发展题。"},{"id":"fn-27","kind":"function","group":"growth","en":"broaden one's horizons","zh":"开阔某人的视野","pattern":"broaden one's horizons","example":"Studying abroad can broaden one's horizons and increase cultural awareness.","note":"注意 one's 要随主语变化。"},{"id":"fn-28","kind":"function","group":"growth","en":"have the opportunity to","zh":"有机会做……","pattern":"have the opportunity to + verb","example":"Many workers now have the opportunity to work remotely.","note":"比 can 更正式，适合描述机会。"},{"id":"fn-29","kind":"function","group":"growth","en":"be equipped with","zh":"具备；配备有","pattern":"be equipped with + noun","example":"Graduates should be equipped with practical skills for the job market.","note":"常接 skills、knowledge、tools。"},{"id":"fn-30","kind":"function","group":"growth","en":"foster a sense of","zh":"培养……感","pattern":"foster a sense of + noun","example":"Team sports can foster a sense of belonging among teenagers.","note":"后面常接 belonging、responsibility、community。"},{"id":"fn-31","kind":"function","group":"growth","en":"build self-confidence","zh":"建立自信","pattern":"build self-confidence","example":"Public speaking helps students build self-confidence.","note":"可以换成 boost / develop self-confidence。"},{"id":"fn-32","kind":"function","group":"growth","en":"reach one's full potential","zh":"发挥全部潜力","pattern":"reach one's full potential","example":"Education should help every child reach their full potential.","note":"主语是人时比 achieve success 更具体。"},{"id":"fn-33","kind":"function","group":"relation","en":"rely on","zh":"依赖；依靠","pattern":"rely on + noun","example":"Modern societies rely on reliable public services.","note":"强调必要性，后接名词或代词的宾格。"},{"id":"fn-34","kind":"function","group":"relation","en":"depend on","zh":"取决于；依赖于","pattern":"depend on + noun","example":"The success of the policy depends on public cooperation.","note":"既可以表示依赖，也可以表示取决于。"},{"id":"fn-35","kind":"function","group":"relation","en":"benefit from","zh":"从……中受益","pattern":"benefit from + noun / doing","example":"Small businesses can benefit from lower taxes.","note":"主语通常是受益的一方。"},{"id":"fn-36","kind":"function","group":"relation","en":"be exposed to","zh":"接触到；暴露于","pattern":"be exposed to + noun","example":"Children are exposed to advertising from an early age.","note":"可接 media、risk、language、pressure。"},{"id":"fn-37","kind":"function","group":"relation","en":"be associated with","zh":"与……相关","pattern":"be associated with + noun","example":"A sedentary lifestyle is associated with heart disease.","note":"学术写作中比 related to 更正式。"},{"id":"fn-38","kind":"function","group":"relation","en":"have access to","zh":"能够获得；有机会使用","pattern":"have access to + noun","example":"Everyone should have access to clean water and basic healthcare.","note":"适合公共资源、教育、医疗等话题。"},{"id":"fn-39","kind":"function","group":"relation","en":"be vulnerable to","zh":"容易受到……影响","pattern":"be vulnerable to + noun","example":"Older people may be more vulnerable to online fraud.","note":"后面常接 disease、attack、pressure、exploitation。"},{"id":"fn-40","kind":"function","group":"relation","en":"be committed to","zh":"致力于；坚定投入","pattern":"be committed to + noun / doing","example":"The government should be committed to reducing social inequality.","note":"后面接动名词时用 doing。"},{"id":"fn-41","kind":"function","group":"trend","en":"a wide range of","zh":"广泛的；各种各样的","pattern":"a wide range of + plural noun","example":"Schools offer a wide range of after-class activities.","note":"后面接可数名词复数。"},{"id":"fn-42","kind":"function","group":"trend","en":"an increasing number of","zh":"越来越多的","pattern":"an increasing number of + plural noun","example":"An increasing number of people work from home.","note":"修饰可数名词复数。"},{"id":"fn-43","kind":"function","group":"trend","en":"to a large extent","zh":"在很大程度上","pattern":"to a large extent","example":"Public health depends to a large extent on daily habits.","note":"放在句首或句中都可以。"},{"id":"fn-44","kind":"function","group":"trend","en":"play an increasingly important role in","zh":"在……中发挥越来越重要的作用","pattern":"play an increasingly important role in + noun / doing","example":"Technology plays an increasingly important role in education.","note":"适合描述趋势和长期变化。"},{"id":"fn-45","kind":"function","group":"trend","en":"be more likely to","zh":"更可能做……","pattern":"be more likely to + verb","example":"Students who read regularly are more likely to write clearly.","note":"比较结构和概率表达都很自然。"},{"id":"fn-46","kind":"function","group":"trend","en":"have a tendency to","zh":"倾向于；往往会","pattern":"have a tendency to + verb","example":"People have a tendency to ignore long-term risks.","note":"比 often 更正式，适合分析行为趋势。"},{"id":"fn-47","kind":"function","group":"trend","en":"by no means","zh":"绝不；并不","pattern":"by no means","example":"Technology is by no means a replacement for teachers.","note":"放在 be 动词后或助动词前，语气较强。"},{"id":"fn-48","kind":"function","group":"trend","en":"on a large scale","zh":"大规模地","pattern":"on a large scale","example":"Recycling needs to be carried out on a large scale.","note":"常和 introduce、use、carry out 等动词搭配。"},{"id":"tp-01","kind":"topic","group":"education","en":"access to education","zh":"接受教育的机会","pattern":"have access to education","example":"Access to education should not depend on family income.","note":"可搭配 equal / free / universal access to education。"},{"id":"tp-02","kind":"topic","group":"education","en":"equal educational opportunities","zh":"平等的教育机会","pattern":"provide equal educational opportunities","example":"Governments should provide equal educational opportunities for all children.","note":"教育公平话题的高频搭配。"},{"id":"tp-03","kind":"topic","group":"education","en":"academic performance","zh":"学业表现","pattern":"improve academic performance","example":"Regular sleep can var SENTENCES=[{"id":"ans-4344-1","kind":"sentence","group":"translation","question_id":"4344","name":"After-class activities","zh":"参加课外活动能帮学生培养社交和团队能力，因为他们必须在社团和运动队里和同学合作。","en":"Taking part in after-class activities helps students develop social skills and teamwork, because they have to cooperate with classmates in clubs and sports teams.","note":"举例：社团、运动队、志愿活动","source":"After-class activities · 完整理由句"},{"id":"ans-4344-2","kind":"sentence","group":"translation","question_id":"4344","name":"After-class activities","zh":"这些活动也让学生从学业压力中解脱出来，保持心理健康，也能提高课堂专注度。","en":"These activities also give students a break from academic pressure, which keeps them mentally healthy and improves their concentration in class.","note":"对比：只学习 vs 有活动","source":"After-class activities · 完整理由句"},{"id":"ans-4344-3","kind":"sentence","group":"translation","question_id":"4344","name":"After-class activities","zh":"参加多样的课外活动让学生探索个人兴趣并发现潜在职业方向，同时培养领导力、时间管理和创造力等常规课堂常忽视的实用技能。","en":"Participating in diverse after-class activities allows students to explore personal interests and discover potential career paths, while developing practical skills like leadership, time management, and creativity that regular classes often neglect.","note":"可举例：机器人社团、辩论队、志愿者项目如何帮助学生发现未来专业或职业方向，并锻炼课堂外的软技能。","source":"After-class activities · 完整理由句"},{"id":"ans-4344-4","kind":"sentence","group":"translation","question_id":"4344","name":"After-class activities","zh":"然而，过多强制性的课外活动会占用学生的休息和学习时间，造成压力和疲劳；因此学校应提供可选项目，而不是强迫所有人参加。","en":"However, too many compulsory after-class activities can consume students' rest and study time, causing stress and fatigue; therefore, schools should offer optional programs rather than forcing everyone to join.","note":"可对比：自愿选择的活动能放松和提升能力；强制且过量的活动会挤占作业、睡眠和家庭时间，所以关键在适度与选择。","source":"After-class activities · 完整理由句"},{"id":"ans-1720-1","kind":"sentence","group":"translation","question_id":"1720","name":"Age restrictions","zh":"我认为开车的最低年龄应该是 18 岁，因为更小的青少年不够成熟，无法判断风险或在危险中快速反应。","en":"I believe the minimum age for driving should be 18, because younger teenagers are not mature enough to judge risks and react quickly in dangerous situations.","note":"举例：交通事故率、反应能力","source":"Age restrictions · 完整理由句"},{"id":"ans-1720-2","kind":"sentence","group":"translation","question_id":"1720","name":"Age restrictions","zh":"18 岁时人们通常更有责任感，能理解危险驾驶的法律后果。","en":"At 18, people are usually more responsible and can understand the legal consequences of dangerous driving.","note":"对比：未成年 vs 18 岁","source":"Age restrictions · 完整理由句"},{"id":"ans-1720-3","kind":"sentence","group":"translation","question_id":"1720","name":"Age restrictions","zh":"从我自己的经历看，等到18岁才开始学车让我完成了监督练习并通过正式考试，因此我比那些更早无正规训练开车的朋友安全得多。","en":"From my own experience, waiting until 18 to start driving let me complete supervised practice and pass a formal test, so I felt far safer than friends who began driving younger without proper training.","note":"可具体写第一次学车、教练监督、路考通过，再对比朋友过早开车或违规上路的经历，突出培训与考试的作用。","source":"Age restrictions · 完整理由句"},{"id":"ans-1720-4","kind":"sentence","group":"translation","question_id":"1720","name":"Age restrictions","zh":"驾驶最低年龄为18岁也建立了清晰统一的法律标准，使学校、保险公司和警方更容易提供培训、评估风险并执行安全驾驶规则。","en":"A minimum driving age of 18 also creates a clear, uniform legal standard, making it easier for schools, insurers, and police to provide training, assess risk, and enforce safe driving rules.","note":"可展开统一标准如何方便驾校课程、保险定价和交警执法，并说明18岁与法定成年身份一致。","source":"Age restrictions · 完整理由句"},{"id":"ans-4342-1","kind":"sentence","group":"translation","question_id":"4342","name":"AI translation","zh":"我仍然认为学外语是必要的，因为 AI 翻译无法捕捉真实对话中的语气、幽默和文化含义。","en":"I still think learning a foreign language is necessary, because AI translation cannot capture tone, humour or cultural meaning in a real conversation.","note":"举例：和外国人聊天、谈判","source":"AI translation · 完整理由句"},{"id":"ans-4342-2","kind":"sentence","group":"translation","question_id":"4342","name":"AI translation","zh":"自己会说一门语言能带来工作机会，也能帮你建立翻译软件无法建立的个人关系。","en":"Speaking a language yourself opens up job opportunities and helps you build personal relationships that a translation app never can.","note":"个人经历：工作中用外语","source":"AI translation · 完整理由句"},{"id":"ans-4342-3","kind":"sentence","group":"translation","question_id":"4342","name":"AI translation","zh":"学习外语还能增强记忆力、注意力和解决问题的能力，而仅仅接受即时翻译的AI工具无法为不愿付出脑力努力的学习者提供这种训练。","en":"Learning a foreign language also strengthens memory, attention and problem-solving skills, which AI tools cannot do for learners who simply accept instant translations without mental effort.","note":"可结合个人学习经历，比如背单词、语法练习如何提升长期记忆和逻辑思维，说明AI翻译只是工具，不能替代大脑训练。","source":"AI translation · 完整理由句"},{"id":"ans-4342-4","kind":"sentence","group":"translation","question_id":"4342","name":"AI translation","zh":"此外，只依赖AI翻译在紧急情况、医疗预约或法律场景中可能有风险，因此自己会说这门语言能确保准确性、隐私和及时沟通。","en":"Moreover, relying only on AI translation can be risky in emergencies, medical appointments or legal situations, so speaking the language yourself ensures accuracy, privacy and timely communication.","note":"举例：旅行中生病、签合同、报警或与医生沟通时，AI可能出错、没网或泄露隐私，自己会外语更安全可靠。","source":"AI translation · 完整理由句"},{"id":"ans-3503-1","kind":"sentence","group":"translation","question_id":"3503","name":"Air travel","zh":"我认为航空旅行利大于弊，因为它连接国家、促进旅游业，让人们能出国工作学习。","en":"I believe air travel brings more benefits, because it connects countries, boosts tourism and allows people to work and study abroad.","note":"举例：旅游、留学、国际贸易","source":"Air travel · 完整理由句"},{"id":"ans-3503-2","kind":"sentence","group":"translation","question_id":"3503","name":"Air travel","zh":"虽然它产生碳排放，但航空公司正在投资更清洁的燃料和更高效的飞机，负面影响可以减轻。","en":"Although it produces carbon emissions, airlines are now investing in cleaner fuels and more efficient planes, so the negative impact can be reduced.","note":"让步 + 反驳","source":"Air travel · 完整理由句"},{"id":"ans-3503-3","kind":"sentence","group":"translation","question_id":"3503","name":"Air travel","zh":"此外，航空旅行在紧急救援和人道主义行动中也至关重要，因为它能在数小时内将医疗队、器官和救援物资送到灾区，拯救无数较慢交通无法挽救的生命。","en":"Furthermore, air travel also plays a vital role in emergency and humanitarian operations, as it delivers medical teams, organs, and relief supplies to disaster zones within hours, saving countless lives that slower transport could not.","note":"可举例：地震救援、疫情期间医疗物资运输、跨国器官移植、战乱地区撤侨。","source":"Air travel · 完整理由句"},{"id":"ans-3503-4","kind":"sentence","group":"translation","question_id":"3503","name":"Air travel","zh":"此外，航空旅行加强文化交流和家庭纽带，因为它让人们能够探亲、参加国际活动、体验不同传统，从而在现代多元文化社会中拓宽理解并减少偏见。","en":"In addition, air travel strengthens cultural exchange and family ties, because it enables people to visit relatives, attend international events, and experience different traditions, which broadens understanding and reduces prejudice in modern multicultural societies.","note":"可举例：留学生回国探亲、移民家庭团聚、国际会议、体育赛事、艺术展览。","source":"Air travel · 完整理由句"},{"id":"ans-1792-1","kind":"sentence","group":"translation","question_id":"1792","name":"Art galleries ","zh":"我同意在画廊看艺术更好，因为你能看到画作的真实尺寸、质感和笔触，屏幕无法呈现。","en":"I agree that viewing art in a gallery is better, because you can see the real size, texture and brushwork of a painting, which a screen can never show.","note":"具体描述：尺寸、质感、光线","source":"Art galleries  · 完整理由句"},{"id":"ans-1792-2","kind":"sentence","group":"translation","question_id":"1792","name":"Art galleries ","zh":"画廊还营造安静专注的环境，让参观者慢下来思考作品，而数字化观看常常分心匆忙。","en":"Galleries also create a quiet, focused environment where visitors can slow down and think about the work, while digital viewing is often distracted and rushed.","note":"对比：专注 vs 分心","source":"Art galleries  · 完整理由句"},{"id":"ans-1792-3","kind":"sentence","group":"translation","question_id":"1792","name":"Art galleries ","zh":"画廊的另一个优势是，策展人会把作品放在经过思考的顺序和语境中，让观众理解艺术家的成长或某个艺术运动，而数字图像通常孤立出现，剥离了这种叙事。","en":"Another advantage of galleries is that curators place works in a thoughtful sequence and context, so viewers can understand an artist's development or a movement, whereas a digital image usually appears alone and stripped of this narrative.","note":"可展开策展顺序、主题展厅、说明牌、灯光如何帮助理解作品；对比数字平台中作品常被算法推荐或碎片化浏览，缺少上下文。","source":"Art galleries  · 完整理由句"},{"id":"ans-1792-4","kind":"sentence","group":"translation","question_id":"1792","name":"Art galleries ","zh":"此外，画廊把观艺术变成一种共享的社交体验，人们可以面对面讨论对作品的理解，而数字观看常常是孤独的、由屏幕中介的，这削弱了思想的公共交流。","en":"Furthermore, galleries turn art viewing into a shared social experience, where people can discuss interpretations face to face, while digital viewing is often solitary and mediated by screens, which weakens the communal exchange of ideas.","note":"可举与朋友、导览员或其他观众现场讨论的例子；对比独自刷数字图片、缺少即时互动和社区感。","source":"Art galleries  · 完整理由句"},{"id":"ans-3500-1","kind":"sentence","group":"translation","question_id":"3500","name":"Assessing own products","zh":"一个优势是员工评估自己的产品会对质量更负责，因为他们能及早发现问题并解决。","en":"One advantage is that workers who assess their own products take more responsibility for quality, because they can spot problems early and fix them.","note":"举例：生产线质检","source":"Assessing own products · 完整理由句"},{"id":"ans-3500-2","kind":"sentence","group":"translation","question_id":"3500","name":"Assessing own products","zh":"但缺点是员工可能对自己的工作太宽容，没有独立检查就可能漏掉错误。","en":"However, the disadvantage is that employees may be too lenient with their own work, so mistakes can be missed without an independent check.","note":"举例：客户投诉、返工","source":"Assessing own products · 完整理由句"},{"id":"ans-3500-3","kind":"sentence","group":"translation","question_id":"3500","name":"Assessing own products","zh":"另一个优势是让员工参与自我评估能提升他们的参与度和积极性，因为被信任评估自己的产出会让他们感到被重视，并鼓励持续改进。","en":"Another benefit is that involving workers in self-assessment can boost their engagement and motivation, since being trusted to evaluate their own output makes them feel valued and encourages continuous improvement.","note":"可举例：定期自评表、团队复盘会；机制上可把自评与培训、改进目标结合，避免流于形式。","source":"Assessing own products · 完整理由句"},{"id":"ans-3500-4","kind":"sentence","group":"translation","question_id":"3500","name":"Assessing own products","zh":"另一个缺点是自我评估可能耗时且需要培训，使员工偏离核心职责，并给公司带来行政负担。","en":"A further drawback is that self-assessment can be time-consuming and may require training, diverting workers from core duties and creating an administrative burden for the company.","note":"可举例：一线员工花大量时间填表；机制上可简化评估表、抽样检查或把自评纳入常规复盘。","source":"Assessing own products · 完整理由句"},{"id":"ans-4359-1","kind":"sentence","group":"translation","question_id":"4359","name":"Bid to host sports events","zh":"举办体育赛事能提振当地经济、提升城市国际形象，因为它吸引游客和投资。","en":"Hosting sports events can boost the local economy and improve a city's international image, because it attracts tourists and investment.","note":"举例：奥运会、世界杯","source":"Bid to host sports events · 完整理由句"},{"id":"ans-4359-2","kind":"sentence","group":"translation","question_id":"4359","name":"Bid to host sports events","zh":"但举办也可能是诅咒，因为建场馆和基础设施的花费可能远超赛事收入。","en":"However, hosting can also be a curse, because building stadiums and infrastructure may cost far more than the event earns.","note":"对比：收入 vs 成本","source":"Bid to host sports events · 完整理由句"},{"id":"ans-4359-3","kind":"sentence","group":"translation","question_id":"4359","name":"Bid to host sports events","zh":"举办大型体育赛事能激励当地居民，尤其是年轻人参与运动和志愿服务，创造持久社会效益，往往超过短期财政成本。","en":"Hosting major sports events can inspire local residents, especially young people, to take up sports and volunteer, creating lasting social benefits that often outweigh the short-term financial costs.","note":"可展开社区凝聚力、志愿者文化、青少年体育参与率和全民健康意识，说明这些软性收益能延续到赛后。","source":"Bid to host sports events · 完整理由句"},{"id":"ans-4359-4","kind":"sentence","group":"translation","question_id":"4359","name":"Bid to host sports events","zh":"诅咒也可能在赛事结束很久后显现：昂贵场馆沦为白象，公共资金从医院、学校和住房中被抽走。","en":"The curse can also appear long after the event, when expensive stadiums become white elephants and public funds are diverted from hospitals, schools, and housing.","note":"可展开赛后场馆闲置、维护费高昂、机会成本巨大，以及民生预算被挤压带来的公众不满。","source":"Bid to host sports events · 完整理由句"},{"id":"ans-3506-1","kind":"sentence","group":"translation","question_id":"3506","name":"Celebrities' privacy","zh":"我认为名人不应放弃所有隐私，因为他们仍是普通人，应该享有与家人在一起的私人生活。","en":"I do not think celebrities should give up all privacy, because they are still ordinary people who deserve a private life with their families.","note":"举例：狗仔跟拍、家人受影响","source":"Celebrities' privacy · 完整理由句"},{"id":"ans-3506-2","kind":"sentence","group":"translation","question_id":"3506","name":"Celebrities' privacy","zh":"但当他们的行为涉及公共利益时，一些信息应该被报道，所以界线取决于具体情况。","en":"However, when their behaviour affects public interest, some information should be reported, so the line depends on the situation.","note":"让步 + 界定标准","source":"Celebrities' privacy · 完整理由句"},{"id":"ans-3506-3","kind":"sentence","group":"translation","question_id":"3506","name":"Celebrities' privacy","zh":"名人不会仅因出名就失去法律隐私权，因此法律应保护他们免受隐藏摄像头、未经授权的医疗或财务披露等侵扰。","en":"Celebrities do not lose their legal right to privacy simply because they are famous, so the law should protect them from intrusive acts such as hidden cameras and unauthorized medical or financial disclosures.","note":"可展开法律底线：名气不等于放弃基本权利；举例住宅偷拍、医疗记录泄露、财务信息被曝光，说明这些与公共利益无关时应受保护。","source":"Celebrities' privacy · 完整理由句"},{"id":"ans-3506-4","kind":"sentence","group":"translation","question_id":"3506","name":"Celebrities' privacy","zh":"媒体应关注名人的专业工作和应问责行为，而非满足无聊的好奇心，因为无限制的八卦会损害心理健康，并让有才华的人不愿进入公众生活。","en":"The media should focus on celebrities’ professional work and accountable conduct rather than satisfying idle curiosity, because unlimited gossip can harm mental health and discourage talented people from entering public life.","note":"可展开媒体责任：报道应服务于知情与监督，而非猎奇；举例网络暴力、焦虑抑郁、艺人退圈，说明过度窥探有社会成本。","source":"Celebrities' privacy · 完整理由句"},{"id":"ans-1730-1","kind":"sentence","group":"translation","question_id":"1730","name":"Cheaper public transportation","zh":"更便宜的公共交通对普通人有好处，因为它降低通勤成本，鼓励更多人不开车。","en":"Cheaper public transport benefits ordinary people, because it reduces commuting costs and encourages more people to leave their cars at home.","note":"举例：月票降价、上班族受益","source":"Cheaper public transportation · 完整理由句"},{"id":"ans-1730-2","kind":"sentence","group":"translation","question_id":"1730","name":"Cheaper public transportation","zh":"但票价降低会导致拥挤，也给政府预算带来压力，服务可能变得不那么可靠。","en":"However, lower fares can lead to overcrowding and put pressure on government budgets, so the service may become less reliable.","note":"对比：收入减少 vs 需求增加","source":"Cheaper public transportation · 完整理由句"},{"id":"ans-1730-3","kind":"sentence","group":"translation","question_id":"1730","name":"Cheaper public transportation","zh":"依我自己的经验，更低票价让公共交通成为低收入学生和兼职工作者更现实的选择，让他们更容易在全城获得教育和就业机会。","en":"From my own experience, cheaper fares make public transport a more realistic option for low-income students and part-time workers, giving them wider access to education and job opportunities across the city.","note":"可结合个人或朋友因票价降低而愿意跨区上学、实习或兼职的例子，说明交通成本如何影响机会公平。","source":"Cheaper public transportation · 完整理由句"},{"id":"ans-1730-4","kind":"sentence","group":"translation","question_id":"1730","name":"Cheaper public transportation","zh":"在我所在的城市，低价票若没有额外资金支持，往往意味着老旧公交车和更少的深夜班次，因此乘客可能等更久，下班后出行也感到更不安全。","en":"In my city, cheap tickets without extra funding often mean older buses and fewer late-night services, so passengers may face longer waits and feel less safe when travelling after work.","note":"举例：夜间下班等车时间长、车辆老旧、照明或安保不足，说明低价若缺乏配套会损害服务质量与安全感。","source":"Cheaper public transportation · 完整理由句"},{"id":"ans-4346-1","kind":"sentence","group":"translation","question_id":"4346","name":"Children education","zh":"我同意父母和老师同样重要，因为孩子在上学前就在家里学到价值观、习惯和态度。","en":"I agree that parents are as important as teachers, because children learn values, habits and attitudes at home before they even start school.","note":"举例：礼貌、阅读习惯","source":"Children education · 完整理由句"},{"id":"ans-4346-2","kind":"sentence","group":"translation","question_id":"4346","name":"Children education","zh":"老师提供知识和结构，父母提供情感支持，两者结合效果更好。","en":"Teachers provide knowledge and structure, while parents give emotional support, and the two together produce better results.","note":"对比：知识 vs 情感","source":"Children education · 完整理由句"},{"id":"ans-4346-3","kind":"sentence","group":"translation","question_id":"4346","name":"Children education","zh":"父母还通过监督作业、检查进度和鼓励在家规律学习来强化老师所教的内容，这帮助孩子记住课程并长期保持动力。","en":"Parents also reinforce what teachers teach by supervising homework, checking progress, and encouraging regular study at home, which helps children remember lessons and stay motivated over time.","note":"举例：每天检查作业、设定固定学习时间、周末复习本周内容，说明父母把课堂知识延伸到家庭。","source":"Children education · 完整理由句"},{"id":"ans-4346-4","kind":"sentence","group":"translation","question_id":"4346","name":"Children education","zh":"因为父母了解孩子的性格和需求，他们能给予大班老师常常无法提供的个别关注，使教育更有效。","en":"Because parents know their child's personality and needs, they can give individual attention that teachers with large classes often cannot provide, making education more effective.","note":"举例：对害羞的孩子多鼓励表达，对注意力弱的孩子安排短时学习任务，体现因材施教。","source":"Children education · 完整理由句"},{"id":"ans-4361-1","kind":"sentence","group":"translation","question_id":"4361","name":"Choose university","zh":"在离家近的地方上学更便宜也更安全，因为学生可以省下房租和餐费，还能得到家人支持。","en":"Studying near home is cheaper and safer, because students can save on rent and meals and still receive family support.","note":"举例：房租、饮食开销","source":"Choose university · 完整理由句"},{"id":"ans-4361-2","kind":"sentence","group":"translation","question_id":"4361","name":"Choose university","zh":"但离家上学能培养独立性和社交能力，因为学生必须自己管理时间、金钱和日常生活。","en":"However, studying away from home develops independence and social skills, since students must manage their time, money and daily life on their own.","note":"举例：自己做饭、打理生活","source":"Choose university · 完整理由句"},{"id":"ans-4361-3","kind":"sentence","group":"translation","question_id":"4361","name":"Choose university","zh":"在离家近的地方上学可能限制个人成长，因为学生可能依赖父母做饭、洗衣和做决定，因此独立解决问题的机会更少。","en":"Staying near home can limit personal growth, because students may rely on their parents for meals, laundry and decisions, so they have fewer chances to solve problems independently.","note":"可举例说明家务依赖、日常决策依赖，以及毕业后适应独立生活较慢。","source":"Choose university · 完整理由句"},{"id":"ans-4361-4","kind":"sentence","group":"translation","question_id":"4361","name":"Choose university","zh":"离家上学可能既昂贵又孤独，因为学生要支付住宿、饮食和交通费用，同时还要在陌生环境中应对思乡情绪，无法及时得到家人支持。","en":"Studying away from family can be expensive and lonely, since students must pay for accommodation, food and travel while coping with homesickness and unfamiliar surroundings without immediate family support.","note":"可展开住宿交通开销、思乡情绪、陌生环境适应困难等具体问题。","source":"Choose university · 完整理由句"},{"id":"ans-3514-1","kind":"sentence","group":"translation","question_id":"3514","name":"City","zh":"我认为城市化整体是积极的，因为城市提供更多工作机会、更好的教育和更便利的医疗。","en":"I think urbanisation is largely positive, because cities offer more job opportunities, better education and easier access to healthcare.","note":"举例：就业、学校、医院","source":"City · 完整理由句"},{"id":"ans-3514-2","kind":"sentence","group":"translation","question_id":"3514","name":"City","zh":"但城市快速扩张也带来拥挤、污染和高房价，所以政府需要仔细规划。","en":"However, rapid urban growth also brings overcrowding, pollution and high housing prices, so governments need careful planning.","note":"让步 + 提条件","source":"City · 完整理由句"},{"id":"ans-3514-3","kind":"sentence","group":"translation","question_id":"3514","name":"City","zh":"另一个积极方面是，将人口集中在城市可让公共服务更高效，因为交通、医院和学校能以更低的人均成本服务更多人口。","en":"Another positive aspect is that concentrating people in cities can make public services more efficient, since transport, hospitals and schools can serve larger populations at a lower cost per person.","note":"可展开公共交通、医疗和教育的规模效应，说明政府预算和资源利用效率更高。","source":"City · 完整理由句"},{"id":"ans-3514-4","kind":"sentence","group":"translation","question_id":"3514","name":"City","zh":"然而，这一趋势可能抽走乡村的年轻劳动力，使农场和小城镇陷入困境，因此城市扩张的同时需要均衡的区域投资。","en":"Nevertheless, this trend can drain rural areas of young workers and leave farms and small towns struggling, so balanced regional investment is needed alongside urban expansion.","note":"可举例乡村老龄化、农业劳动力短缺、小城镇衰退，并提出区域投资、远程工作和农业补贴等方案。","source":"City · 完整理由句"},{"id":"ans-4340-1","kind":"sentence","group":"translation","question_id":"4340","name":"Compulsory learning","zh":"我同意外语应该是必修，因为它给每个学生未来学习和工作的基本技能。","en":"I agree that learning a foreign language should be compulsory, because it gives every student a basic skill for future study and work.","note":"举例：英语在工作中的用处","source":"Compulsory learning · 完整理由句"},{"id":"ans-4340-2","kind":"sentence","group":"translation","question_id":"4340","name":"Compulsory learning","zh":"但学校不应该要求每个学生达到同样水平，因为学生的兴趣和能力不同。","en":"However, schools should not force every student to reach the same level, because students have different interests and abilities.","note":"让步 + 建议","source":"Compulsory learning · 完整理由句"},{"id":"ans-4340-3","kind":"sentence","group":"translation","question_id":"4340","name":"Compulsory learning","zh":"外语必修可以减少社会不平等，因为它确保贫困家庭的学生也有机会学习富裕家庭常私下付费学习的语言。","en":"Compulsory foreign language education can reduce social inequality, because it ensures that students from poorer families also get the chance to learn languages that wealthy families often pay for privately.","note":"可举贫困学生通过学校免费外语课获得与私教学生竞争的机会，说明必修能促进教育公平。","source":"Compulsory learning · 完整理由句"},{"id":"ans-4340-4","kind":"sentence","group":"translation","question_id":"4340","name":"Compulsory learning","zh":"学校把语言学习设为必修也能培养跨文化意识，帮助学生尊重不同生活方式，并在日益全球化的社会中更自信地交流。","en":"Making language learning compulsory at school also builds cross-cultural awareness, helping students respect different ways of life and communicate more confidently in an increasingly globalised society.","note":"可举国际交流、留学或网络合作，说明外语必修培养尊重差异与全球沟通能力。","source":"Compulsory learning · 完整理由句"},{"id":"ans-4363-1","kind":"sentence","group":"translation","question_id":"4363","name":"Creativity","zh":"我认为创造力可以培养，因为训练、练习和支持性环境能帮人产生新想法。","en":"I believe creativity can be developed, because training, practice and a supportive environment help people generate new ideas.","note":"举例：艺术课、头脑风暴","source":"Creativity · 完整理由句"},{"id":"ans-4363-2","kind":"sentence","group":"translation","question_id":"4363","name":"Creativity","zh":"但天赋也有作用，因为有些人天生想象力或好奇心更强。","en":"However, natural talent also plays a role, since some people are born with stronger imagination or curiosity.","note":"让步","source":"Creativity · 完整理由句"},{"id":"ans-4363-3","kind":"sentence","group":"translation","question_id":"4363","name":"Creativity","zh":"此外，学校和工作场所可以教授实用的创造策略，如头脑风暴、思维导图和质疑假设，这使天生想象力较弱的人也能提出原创方案。","en":"Moreover, schools and workplaces can teach practical creative strategies, such as brainstorming, mind mapping and questioning assumptions, which enable even less naturally imaginative individuals to produce original solutions.","note":"可举课堂创意训练或公司创新工作坊为例，说明具体方法能弥补天赋差距。","source":"Creativity · 完整理由句"},{"id":"ans-4363-4","kind":"sentence","group":"translation","question_id":"4363","name":"Creativity","zh":"此外，创造力往往依赖积累的知识和多样经历，因此广泛阅读、旅行以及与不同的人合作，能逐渐增强一个人连接想法的能力。","en":"In addition, creativity often depends on accumulated knowledge and diverse experiences, so reading widely, travelling and collaborating with different people can gradually strengthen a person's ability to connect ideas.","note":"可展开为知识储备和跨领域经验为灵感提供素材，说明创造力像肌肉一样可被后天锻炼。","source":"Creativity · 完整理由句"},{"id":"ans-2555-1","kind":"sentence","group":"translation","question_id":"2555","name":"Dangerous activities","zh":"我在一定程度上支持危险活动，因为它们给人刺激、自信和成就感。","en":"I am in favour of dangerous activities to some extent, because they give people excitement, confidence and a sense of achievement.","note":"举例：跳伞、登山","source":"Dangerous activities · 完整理由句"},{"id":"ans-2555-2","kind":"sentence","group":"translation","question_id":"2555","name":"Dangerous activities","zh":"但参与者必须遵守严格的安全规则并接受适当训练，否则风险大于收益。","en":"However, participants must follow strict safety rules and receive proper training, otherwise the risks outweigh the benefits.","note":"让步 + 条件","source":"Dangerous activities · 完整理由句"},{"id":"ans-2555-3","kind":"sentence","group":"translation","question_id":"2555","name":"Dangerous activities","zh":"我支持这些活动的另一个原因是，它们能教会参与者管理恐惧，并在压力下快速决策；例如，跳伞者学会在紧急情况下保持冷静。","en":"Another reason I support these activities is that they can teach participants to manage fear and make quick decisions under pressure; for example, skydivers learn to stay calm during emergencies.","note":"可举跳伞者处理开伞异常、摩托车手应对复杂路况，说明抗压与决策能力可迁移到工作和生活。","source":"Dangerous activities · 完整理由句"},{"id":"ans-2555-4","kind":"sentence","group":"translation","question_id":"2555","name":"Dangerous activities","zh":"我也支持这些活动，因为如果管理得当，冒险运动可以通过旅游、装备销售和赛事组织为当地社区带来经济利益，创造就业和收入。","en":"I also favour these activities because, when managed responsibly, adventure sports can bring economic benefits to local communities through tourism, equipment sales and event organisation, creating jobs and income.","note":"可举跳伞基地、摩托车赛事带动住宿、餐饮、装备租赁和就业，说明其社会经济价值。","source":"Dangerous activities · 完整理由句"},{"id":"ans-3511-1","kind":"sentence","group":"translation","question_id":"3511","name":"Differential education","zh":"按能力分班的一个好处是老师能根据每组调整进度和材料，让强和弱的学生都进步更快。","en":"One advantage of splitting students by ability is that teachers can match the pace and materials to each group, so both strong and weak students improve faster.","note":"举例：快班拓展、慢班补基础","source":"Differential education · 完整理由句"},{"id":"ans-3511-2","kind":"sentence","group":"translation","question_id":"3511","name":"Differential education","zh":"但它也可能给学生贴标签，降低低分组学生的自信，可能拉大而不是缩小差距。","en":"However, it can also label students and lower the confidence of those in lower groups, which may widen the gap instead of closing it.","note":"举例：心理影响","source":"Differential education · 完整理由句"},{"id":"ans-3511-3","kind":"sentence","group":"translation","question_id":"3511","name":"Differential education","zh":"差异化教育能让有动力的学生与水平相近的同伴竞争，营造更具挑战性的课堂氛围，促使高成就学生更努力并取得更好成绩。","en":"Differential education can allow motivated students to compete with similar peers, creating a more challenging classroom atmosphere that pushes high achievers to work harder and achieve better academic results.","note":"可展开同伴竞争和榜样作用：快班中水平接近，学生更容易被激发，课堂节奏更紧凑，学习目标更明确。","source":"Differential education · 完整理由句"},{"id":"ans-3511-4","kind":"sentence","group":"translation","question_id":"3511","name":"Differential education","zh":"另一个缺点是，差异化教育可能减少不同背景学生之间的社会融合，限制他们学习多元观点的机会，并削弱学校团结和相互支持。","en":"Another drawback is that differential education may reduce social mixing among students from different backgrounds, limiting their opportunities to learn from diverse perspectives and weakening school unity and mutual support.","note":"可举例说明分层后学生只与同层同学相处，缺少跨能力合作，导致社交隔离、校园凝聚力下降，甚至加剧阶层差异。","source":"Differential education · 完整理由句"},{"id":"ans-1763-1","kind":"sentence","group":"translation","question_id":"1763","name":"Extreme sports","zh":"极限运动给参与者强烈的成就感，帮他们克服恐惧，这种自信会延续到日常生活中。","en":"Extreme sports give participants a strong sense of achievement and help them overcome fear, which builds confidence that carries over into daily life.","note":"举例：跳伞、攀岩后的变化","source":"Extreme sports · 完整理由句"},{"id":"ans-1763-2","kind":"sentence","group":"translation","question_id":"1763","name":"Extreme sports","zh":"但严重受伤的风险很高，医疗费用和漫长的恢复期会影响工作和家庭生活。","en":"However, the risk of serious injury is high, and medical costs and long recovery periods can affect a person's work and family life.","note":"举例：受伤案例、医疗费用","source":"Extreme sports · 完整理由句"},{"id":"ans-1763-3","kind":"sentence","group":"translation","question_id":"1763","name":"Extreme sports","zh":"此外，极限运动能促进社交联系和团队合作，因为参与者常常加入社群、分享训练技巧并共同庆祝成就，这能扩大他们的支持网络并减少孤独感。","en":"In addition, extreme sports can foster social bonds and teamwork, as participants often join communities, share training tips, and celebrate achievements together, which expands their support network and reduces isolation.","note":"可举例：登山队、跑酷社群、潜水俱乐部；强调团队协作、归属感和心理支持。","source":"Extreme sports · 完整理由句"},{"id":"ans-1763-4","kind":"sentence","group":"translation","question_id":"1763","name":"Extreme sports","zh":"此外，它们也可能昂贵且耗时，因为专业装备、前往偏远地点和频繁训练需要大量金钱和投入，可能给预算和时间安排带来压力。","en":"In addition, they can be expensive and time-consuming, since specialized equipment, travel to remote locations, and frequent training require substantial money and commitment, potentially straining budgets and schedules.","note":"可举例：滑雪装备、潜水课程、跳伞旅行费用；说明对普通家庭和经济压力的影响。","source":"Extreme sports · 完整理由句"},{"id":"ans-4339-1","kind":"sentence","group":"translation","question_id":"4339","name":"Financial learning","zh":"我同意学校应该教理财，因为年轻人开始工作时需要做预算、存钱和避免负债。","en":"I agree that financial management should be taught at school, because young people need to budget, save and avoid debt when they start working.","note":"举例：助学贷款、信用卡","source":"Financial learning · 完整理由句"},{"id":"ans-4339-2","kind":"sentence","group":"translation","question_id":"4339","name":"Financial learning","zh":"早点学理财也能避免以后的严重错误，因为童年形成的习惯很难改变。","en":"Learning about money early also prevents serious mistakes later, since habits formed in childhood are hard to change.","note":"对比：有/无理财教育","source":"Financial learning · 完整理由句"},{"id":"ans-4339-3","kind":"sentence","group":"translation","question_id":"4339","name":"Financial learning","zh":"此外，学校教授理财能确保所有孩子，包括父母缺乏理财知识的孩子，都能为成年生活获得平等准备，而不是把这项关键技能交给家庭背景决定。","en":"Furthermore, teaching financial management in school ensures that all children, including those whose parents lack money knowledge, receive equal preparation for adult life rather than leaving this vital skill to family background.","note":"可举低收入家庭、移民家庭或父母忙于生计无暇教理财的例子，说明学校统一课程能缩小机会差距。","source":"Financial learning · 完整理由句"},{"id":"ans-4339-4","kind":"sentence","group":"translation","question_id":"4339","name":"Financial learning","zh":"此外，学校可以通过预算项目、储蓄模拟等实践活动教授理财，让数学课更贴近现实，并帮助学生立即运用知识。","en":"In addition, schools can teach financial management through practical activities such as budgeting projects and savings simulations, making maths lessons more relevant and helping students apply knowledge immediately.","note":"可写班级银行、模拟购物、记账比赛或复利计算，说明实践教学能提升参与度和长期记忆。","source":"Financial learning · 完整理由句"},{"id":"ans-4360-1","kind":"sentence","group":"translation","question_id":"4360","name":"Good handwriting","zh":"我仍然认为手写重要，因为手写能帮人更好地记忆信息和组织思路。","en":"I still think handwriting is important, because writing by hand helps people remember information and organise their thoughts more effectively.","note":"举例：记笔记、考试","source":"Good handwriting · 完整理由句"},{"id":"ans-4360-2","kind":"sentence","group":"translation","question_id":"4360","name":"Good handwriting","zh":"但现在打字在工作和学习中更实用，手写正在变成个人技能而不是日常必需。","en":"However, typing is now more practical for work and study, so handwriting is becoming a personal skill rather than a daily necessity.","note":"让步 + 界定","source":"Good handwriting · 完整理由句"},{"id":"ans-4360-3","kind":"sentence","group":"translation","question_id":"4360","name":"Good handwriting","zh":"即使在打字为主的时代，好手写仍在早期教育中至关重要，因为用手写字母能加强儿童的阅读和拼写能力，而这一基础无法被键盘练习完全取代。","en":"Even in a typing-heavy era, good handwriting remains crucial in early education because forming letters by hand strengthens children's reading and spelling skills, and this foundation cannot be fully replaced by keyboard practice.","note":"可举小学识字、拼写测试，说明手写与读写能力关联，强调基础教育中的不可替代性。","source":"Good handwriting · 完整理由句"},{"id":"ans-4360-4","kind":"sentence","group":"translation","question_id":"4360","name":"Good handwriting","zh":"此外，工整的手写仍具有社会意义，因为清晰的便条、签名或考试答卷能体现用心、尊重和个人身份，尤其在打字文本显得冷漠或不被允许的场合。","en":"Moreover, neat handwriting still carries social meaning, as a clear handwritten note, signature or exam script can show care, respect and personal identity, especially in situations where typed text feels impersonal or is not allowed.","note":"可举签名、感谢卡、手写考试、法律文件，说明打字不能完全替代，强调正式和情感场景。","source":"Good handwriting · 完整理由句"},{"id":"ans-4343-1","kind":"sentence","group":"translation","question_id":"4343","name":"Government fund","zh":"我认为教育应该获得最多的政府资金，因为它提升人们的技能，长期看有利于经济。","en":"I think education deserves the largest share of government funding, because it improves people's skills and benefits the economy in the long term.","note":"举例：学校建设、奖学金","source":"Government fund · 完整理由句"},{"id":"ans-4343-2","kind":"sentence","group":"translation","question_id":"4343","name":"Government fund","zh":"公共健康同样重要，因为健康的人口能减轻医院负担，帮助国家发展。","en":"Public health is equally important, since a healthy population reduces the burden on hospitals and helps the country develop.","note":"举例：医保、疫苗","source":"Government fund · 完整理由句"},{"id":"ans-4343-3","kind":"sentence","group":"translation","question_id":"4343","name":"Government fund","zh":"此外，资助教育，尤其是低收入社区的教育，可以减少社会不平等和犯罪，因为平等的入学机会为弱势儿童提供通往更好工作和稳定生活的现实路径。","en":"In addition, funding education, especially in low-income communities, can reduce social inequality and crime, because equal access to schools gives disadvantaged children a realistic path to better jobs and stable lives.","note":"举例：农村学校建设、助学金、职业培训；对比只投入气候项目对弱势群体的即时帮助有限。","source":"Government fund · 完整理由句"},{"id":"ans-4343-4","kind":"sentence","group":"translation","question_id":"4343","name":"Government fund","zh":"此外，投资公共健康能增强长期生产力，因为预防保健、疫苗接种和清洁饮水让劳动者保持健康，并减少传染病高昂的传播代价。","en":"Moreover, investing in public health strengthens long-term productivity, since preventive care, vaccination, and clean water keep workers healthy and reduce the costly spread of infectious diseases.","note":"举例：全国疫苗计划、基层诊所、清洁饮水项目；说明健康劳动力比事后治疗更能推动经济。","source":"Government fund · 完整理由句"},{"id":"ans-1719-1","kind":"sentence","group":"translation","question_id":"1719","name":"Home to workplace","zh":"我认为这是积极的影响，因为住得近能省下通勤时间，减少日常压力。","en":"I think it has a positive impact, because living close to work saves commuting time and reduces daily stress.","note":"举例：早上多睡、准时到岗","source":"Home to workplace · 完整理由句"},{"id":"ans-1719-2","kind":"sentence","group":"translation","question_id":"1719","name":"Home to workplace","zh":"但也可能模糊工作与生活的界限，因为人们下班后很容易回办公室。","en":"However, it may also blur the line between work and personal life, since people can easily go back to the office after hours.","note":"让步","source":"Home to workplace · 完整理由句"},{"id":"ans-1719-3","kind":"sentence","group":"translation","question_id":"1719","name":"Home to workplace","zh":"买在工作地点附近的房子还能降低交通成本，让每月预算更可预测，因此我能存下或投资更多钱，获得长期财务保障。","en":"Buying a home near my workplace also lowers transport costs and makes my monthly budget more predictable, so I can save or invest more for long-term financial security.","note":"举例：少开车或坐车后，油费、停车费和公交月票下降；把省下的钱用于储蓄、进修或家庭应急。","source":"Home to workplace · 完整理由句"},{"id":"ans-1719-4","kind":"sentence","group":"translation","question_id":"1719","name":"Home to workplace","zh":"更短的通勤也让我可以步行或骑车上班，这能改善身体健康，并让我每天有更多精力处理工作与家庭事务。","en":"A shorter commute also lets me walk or cycle to work, which improves my physical health and gives me more daily energy for both job tasks and family time.","note":"举例：不用挤地铁，顺路买菜或接孩子；运动量增加，晚上不那么累，工作效率更高。","source":"Home to workplace · 完整理由句"},{"id":"ans-4354-1","kind":"sentence","group":"translation","question_id":"4354","name":"Human activities","zh":"我同意人类活动是主因，因为燃烧化石燃料和砍伐森林释放大量二氧化碳。","en":"I agree that human activities are the main cause, because burning fossil fuels and cutting down forests release huge amounts of carbon dioxide.","note":"举例：工厂、汽车、森林砍伐","source":"Human activities · 完整理由句"},{"id":"ans-4354-2","kind":"sentence","group":"translation","question_id":"4354","name":"Human activities","zh":"为了解决这个问题，政府应该投资可再生能源，鼓励人们使用公共交通和回收。","en":"To solve this, governments should invest in renewable energy and encourage people to use public transport and recycle.","note":"举例：太阳能、电动车","source":"Human activities · 完整理由句"},{"id":"ans-4354-3","kind":"sentence","group":"translation","question_id":"4354","name":"Human activities","zh":"我也同意，因为现代畜牧业和农业会排放大量甲烷和一氧化二氮，它们锁住热量的能力远高于二氧化碳，清楚表明人类活动对气候的影响。","en":"I also agree because modern agriculture and livestock farming produce large amounts of methane and nitrous oxide, which trap far more heat than carbon dioxide and clearly show human influence on the climate.","note":"可举例：牛等反刍动物排放甲烷，化肥使用释放一氧化二氮；可提减少肉类消费和改善农耕方式。","source":"Human activities · 完整理由句"},{"id":"ans-4354-4","kind":"sentence","group":"translation","question_id":"4354","name":"Human activities","zh":"另一个解决方案是政府征收碳税或实行碳排放交易体系，从而在经济上推动企业减排并投资更清洁的技术。","en":"Another solution is for governments to impose carbon taxes or cap-and-trade systems, so companies are financially pushed to cut emissions and invest in cleaner technologies.","note":"可解释碳税提高化石燃料成本，碳交易限制排放总量，收入可用于补贴绿色创新。","source":"Human activities · 完整理由句"},{"id":"ans-4348-1","kind":"sentence","group":"translation","question_id":"4348","name":"Immigration","zh":"在国外生活给人新机会，因为他们能上更好的大学、找到更高薪的工作、体验不同的文化。","en":"Living in a foreign country gives people new opportunities, because they can study at better universities, find higher-paying jobs and experience a different culture.","note":"举例：留学、海外工作","source":"Immigration · 完整理由句"},{"id":"ans-4348-2","kind":"sentence","group":"translation","question_id":"4348","name":"Immigration","zh":"但移民常面临语言障碍和思乡，适应新文化也可能很有压力。","en":"However, immigrants often face language barriers and homesickness, and adjusting to a new culture can be stressful.","note":"举例：语言、孤独感","source":"Immigration · 完整理由句"},{"id":"ans-4348-3","kind":"sentence","group":"translation","question_id":"4348","name":"Immigration","zh":"在国外生活能增强个人独立性和全球意识，因为人们必须独自解决日常问题并与多元社区互动，这会建立自信和跨文化沟通能力。","en":"Living abroad can strengthen personal independence and global awareness, as people must solve daily problems alone and interact with diverse communities, which builds confidence and cross-cultural communication skills.","note":"举例：独自租房、办银行卡或签证、与不同文化背景的人合作，说明这些经历如何提升适应力。","source":"Immigration · 完整理由句"},{"id":"ans-4348-4","kind":"sentence","group":"translation","question_id":"4348","name":"Immigration","zh":"另一个缺点是，技术移民可能遭遇职业挫折，因为国外学历有时不被认可，当地雇主也常偏好有本地经验的本土候选人。","en":"Another drawback is that skilled immigrants may suffer career setbacks, since foreign qualifications are sometimes unrecognised and local employers often prefer native-born candidates with local experience.","note":"举例：医生、律师、教师等资质认证难，求职要求本地经验，导致降级就业或转行。","source":"Immigration · 完整理由句"},{"id":"ans-1797-1","kind":"sentence","group":"translation","question_id":"1797","name":"International languages","zh":"我认为这很重要，因为每种语言都承载着独特的知识、故事和理解世界的方式。","en":"I believe this matters, because every language carries unique knowledge, stories and ways of understanding the world.","note":"举例：土著语言、传统知识","source":"International languages · 完整理由句"},{"id":"ans-1797-2","kind":"sentence","group":"translation","question_id":"1797","name":"International languages","zh":"一种语言消失也意味着人类文化多样性的一部分消失，一旦失去就无法挽回。","en":"Losing a language also means losing part of human cultural diversity, which cannot be recovered once it disappears.","note":"对比：消失前 vs 消失后","source":"International languages · 完整理由句"},{"id":"ans-1797-3","kind":"sentence","group":"translation","question_id":"1797","name":"International languages","zh":"此外，失去一种语言会削弱社区的身份认同和代际联系，因为年轻使用者可能无法再充分接触长辈的记忆、价值观和社会规范。","en":"Furthermore, losing a language can weaken a community's identity and intergenerational connection, because younger speakers may no longer fully access elders' memories, values and social norms.","note":"可举土著社区或移民家庭为例，说明祖辈故事、习俗、称呼和价值观若无法传给下一代，社区认同会逐渐松散。","source":"International languages · 完整理由句"},{"id":"ans-1797-4","kind":"sentence","group":"translation","question_id":"1797","name":"International languages","zh":"此外，当国际语言取代较小语言时，濒危语言使用者可能面临放弃自身传承的压力，从而加剧不平等并削弱对本地文化的信心。","en":"In addition, when international languages replace smaller ones, speakers of endangered languages may face pressure to abandon their heritage, entrenching inequality and weakening confidence in local cultures.","note":"可讨论教育、就业和媒体如何奖励国际语言，使母语使用者处于劣势，进而强化语言等级与社会不公平。","source":"International languages · 完整理由句"},{"id":"ans-4353-1","kind":"sentence","group":"translation","question_id":"4353","name":"Job satisfaction","zh":"我认为对每个人来说都不太现实，因为很多人根本找不到既符合兴趣又满足经济需求的工作。","en":"I do not think it is realistic for everyone, because many people simply cannot find work that matches both their interests and their financial needs.","note":"举例：毕业生、转行的人","source":"Job satisfaction · 完整理由句"},{"id":"ans-4353-2","kind":"sentence","group":"translation","question_id":"4353","name":"Job satisfaction","zh":"不过，人们可以通过提升技能、改变心态或从工作中找到意义来提升满意度。","en":"Still, people can improve their satisfaction by developing skills, changing their attitude, or finding meaning in the work they do.","note":"举例：培训、业余项目","source":"Job satisfaction · 完整理由句"},{"id":"ans-4353-3","kind":"sentence","group":"translation","question_id":"4353","name":"Job satisfaction","zh":"因为工作满意度在很大程度上取决于个人无法控制的因素，比如管理者、薪酬、工作时间和经济周期，所以它无法对每个劳动者都得到保证。","en":"Because job satisfaction depends heavily on factors outside an individual's control, such as managers, pay, working hours and economic cycles, it cannot be guaranteed for every worker.","note":"可举例：行业衰退裁员、糟糕上司、低薪岗位；说明不是个人努力不足。","source":"Job satisfaction · 完整理由句"},{"id":"ans-4353-4","kind":"sentence","group":"translation","question_id":"4353","name":"Job satisfaction","zh":"即便如此，政府和雇主可以通过提高工资、改善工作条件和提供培训机会，让满意度更容易实现，这能帮助更多人，尽管不是所有人。","en":"Even so, governments and employers can make satisfaction more attainable by improving wages, working conditions and training opportunities, which helps more people, though not all.","note":"可举例：最低工资、职场反霸凌、带薪培训；强调制度改善有限但有效。","source":"Job satisfaction · 完整理由句"},{"id":"ans-3513-1","kind":"sentence","group":"translation","question_id":"3513","name":"Life choices","zh":"专注学习或工作能建立专业技能和经济基础，这是年轻人探索世界之前需要的。","en":"Focusing on study or work builds professional skills and financial stability, which young people need before they can explore the world.","note":"举例：考证、职业起步","source":"Life choices · 完整理由句"},{"id":"ans-3513-2","kind":"sentence","group":"translation","question_id":"3513","name":"Life choices","zh":"但旅行和志愿活动能拓宽视野、培养软技能，所以不应该被忽视。","en":"However, travel and volunteering broaden people's horizons and develop soft skills, so they should not be ignored.","note":"举例：海外志愿、实习","source":"Life choices · 完整理由句"},{"id":"ans-3513-3","kind":"sentence","group":"translation","question_id":"3513","name":"Life choices","zh":"平衡学习或工作与体验型活动，能帮助年轻人把课堂知识应用到真实情境中，使他们更具就业竞争力，因为雇主重视实践技能、适应能力和主动性。","en":"Balancing study or work with experiential activities helps young people apply classroom knowledge to real situations, making them more employable because employers value practical skills, adaptability, and evidence of initiative.","note":"举例：学生利用假期参加国际志愿者项目，把语言、沟通和解决问题能力写进简历，从而在毕业后更快找到工作。","source":"Life choices · 完整理由句"},{"id":"ans-3513-4","kind":"sentence","group":"translation","question_id":"3513","name":"Life choices","zh":"过度偏向任何一方都可能有害：只学习或工作可能导致倦怠和视野狭窄，而无休止的旅行或志愿服务可能推迟经济独立和职业发展。","en":"Focusing too much on either path can be harmful: exclusive study or work may cause burnout and narrow perspectives, while endless travel or volunteering may delay financial independence and career progress.","note":"举例：毕业后连续多年工作却从不休假，或长期间隔年却没有规划，都说明应分阶段平衡，而不是走向极端。","source":"Life choices · 完整理由句"},{"id":"ans-4358-1","kind":"sentence","group":"translation","question_id":"4358","name":"Life experience or education","zh":"我部分同意经验是好老师，因为现实中的挑战能教出书本无法提供的实用技能和判断力。","en":"I partly agree that experience is a good teacher, because real-life challenges teach practical skills and judgment that books cannot provide.","note":"举例：工作中学会沟通","source":"Life experience or education · 完整理由句"},{"id":"ans-4358-2","kind":"sentence","group":"translation","question_id":"4358","name":"Life experience or education","zh":"但正规教育给人系统的知识和理论，帮人们理解事情背后的原因，而不只是怎么操作。","en":"However, formal education gives people systematic knowledge and theory, which helps them understand why things work, not just how.","note":"对比：理论 vs 实践","source":"Life experience or education · 完整理由句"},{"id":"ans-4358-3","kind":"sentence","group":"translation","question_id":"4358","name":"Life experience or education","zh":"经验还能培养韧性和情商，因为人们从错误、反馈和不可预测的情境中学习，而这是教科书很少能模拟的，从而增强他们应对现实压力的能力。","en":"Experience also builds resilience and emotional intelligence, since people learn from mistakes, feedback and unpredictable situations in ways that textbooks rarely simulate, strengthening their ability to cope with real-world pressure.","note":"可举实习、兼职或团队项目中的失败与反馈，说明软技能如何提升。","source":"Life experience or education · 完整理由句"},{"id":"ans-4358-4","kind":"sentence","group":"translation","question_id":"4358","name":"Life experience or education","zh":"此外，单靠经验可能狭隘或偏颇，因为它受个人环境限制，所以需要正规教育来提供更广阔的视角和可迁移的理解。","en":"In addition, experience alone can be narrow or biased because it is limited to personal circumstances, so formal education is needed to provide broader perspectives and transferable understanding.","note":"可举只靠个人行业经验会忽略跨领域理论，正规课程提供知识框架。","source":"Life experience or education · 完整理由句"},{"id":"ans-4356-1","kind":"sentence","group":"translation","question_id":"4356","name":"Looking for a job","zh":"薪水重要，因为高收入能带来经济保障，让人们养家并为未来做规划。","en":"Salary matters, because a higher income provides financial security and allows people to support their families and plan for the future.","note":"举例：房贷、家庭开销","source":"Looking for a job · 完整理由句"},{"id":"ans-4356-2","kind":"sentence","group":"translation","question_id":"4356","name":"Looking for a job","zh":"但长期来看工作条件更重要，因为支持性的环境和合理的工时影响每天的幸福和健康。","en":"However, working conditions matter more in the long run, since a supportive environment and reasonable hours affect daily happiness and health.","note":"对比：高薪高压 vs 平衡","source":"Looking for a job · 完整理由句"},{"id":"ans-4356-3","kind":"sentence","group":"translation","question_id":"4356","name":"Looking for a job","zh":"良好的工作条件通常包括灵活性、带薪休假和远程选择，这些节省时间和金钱，因此增加高薪可能无法提供的实际价值。","en":"Good working conditions often include flexibility, paid leave, and remote options, which save time and money and therefore add real value that a higher salary may not provide.","note":"可举例：远程办公节省通勤费和午餐费，带薪休假提升生活质量；对比高薪但无灵活性的工作，说明实际价值。","source":"Looking for a job · 完整理由句"},{"id":"ans-4356-4","kind":"sentence","group":"translation","question_id":"4356","name":"Looking for a job","zh":"工作条件也塑造职业成长，因为清晰的晋升路径和技能培训能比略高的起薪更有效地提高员工的长期收入。","en":"Working conditions also shape career growth, because clear promotion paths and skills training can raise a worker's long-term income more effectively than a slightly higher starting salary.","note":"可举例：有培训和晋升通道的公司，几年后薪资涨幅更大；起薪高但无成长会限制未来跳槽和加薪。","source":"Looking for a job · 完整理由句"},{"id":"ans-3502-1","kind":"sentence","group":"translation","question_id":"3502","name":"Maximum wage","zh":"我认为最高工资不是好主意，因为它可能打击优秀人才努力工作或承担高风险工作的积极性。","en":"I do not think a maximum wage is a good idea, because it may discourage talented people from working hard or taking risky jobs.","note":"举例：医生、创业者","source":"Maximum wage · 完整理由句"},{"id":"ans-3502-2","kind":"sentence","group":"translation","question_id":"3502","name":"Maximum wage","zh":"但极高的收入差距会造成社会不公，所以累进税比固定上限更合适。","en":"However, extremely high pay gaps can cause social unfairness, so progressive tax is a better solution than a fixed cap.","note":"对比：最高工资 vs 累进税","source":"Maximum wage · 完整理由句"},{"id":"ans-3502-3","kind":"sentence","group":"translation","question_id":"3502","name":"Maximum wage","zh":"严格的最高工资还可能促使高技能专业人才和创新企业迁往没有此类上限的国家，从而削弱本国经济并缩小税基。","en":"A strict maximum wage could also encourage highly skilled professionals and innovative companies to relocate to countries without such a cap, weakening the domestic economy and reducing the tax base.","note":"可举例金融、科技高管迁往新加坡或迪拜，说明人才与资本外流会减少投资、就业和税收。","source":"Maximum wage · 完整理由句"},{"id":"ans-3502-4","kind":"sentence","group":"translation","question_id":"3502","name":"Maximum wage","zh":"固定的最高工资可能只会促使雇主用奖金、股票或奢侈福利来奖励高管，使这一规定容易被规避，且比透明的税收制度更难执行。","en":"A fixed maximum wage may simply push employers to use bonuses, shares or luxury benefits to reward executives, making the rule easy to avoid and harder to enforce than a transparent tax system.","note":"可举例基本工资设上限但期权、津贴不受限；对比累进税按总收入征收更透明。","source":"Maximum wage · 完整理由句"},{"id":"ans-1718-1","kind":"sentence","group":"translation","question_id":"1718","name":"Media violence","zh":"我认为媒体暴力应该被认真对待，因为反复接触可能让年轻人对真实的暴力变得不敏感。","en":"I think media violence should be taken seriously, because repeated exposure may make young people less sensitive to real violence.","note":"举例：游戏、影视作品","source":"Media violence · 完整理由句"},{"id":"ans-1718-2","kind":"sentence","group":"translation","question_id":"1718","name":"Media violence","zh":"但完全禁止不现实，所以分级制度和家长指导是更好的办法。","en":"However, banning it completely is not practical, so age ratings and parental guidance are better solutions.","note":"建议：分级、家长陪同","source":"Media violence · 完整理由句"},{"id":"ans-1718-3","kind":"sentence","group":"translation","question_id":"1718","name":"Media violence","zh":"此外，媒体中的暴力有时能反映真实的社会冲突，或服务于艺术和新闻目的，因此全面禁止会不必要地限制表达自由和公众获取重要故事的渠道。","en":"Moreover, violence in media can sometimes reflect real social conflicts or serve artistic and journalistic purposes, so a total ban would unnecessarily restrict freedom of expression and public access to important stories.","note":"可举战地新闻、现实主义电影或历史剧，说明“一刀切”会损害公众知情权和创作空间。","source":"Media violence · 完整理由句"},{"id":"ans-1718-4","kind":"sentence","group":"translation","question_id":"1718","name":"Media violence","zh":"更有效的应对方式是推动媒体素养教育，帮助观众，尤其是青少年，批判性地分析暴力内容并质疑其背后的信息，而不是简单地审查它。","en":"A more effective response is to promote media literacy education, helping viewers, especially teenagers, analyze violent content critically and question the messages behind it instead of simply censoring it.","note":"可写学校开设媒体素养课程、家长与孩子讨论屏幕内容，培养辨别能力和理性判断。","source":"Media violence · 完整理由句"},{"id":"ans-4349-1","kind":"sentence","group":"translation","question_id":"4349","name":"National \nhappiness \nindex","zh":"我认为幸福指数有价值，因为经济增长并不总意味着人们生活得更好。","en":"I think the happiness index is valuable, because economic growth does not always mean people live better lives.","note":"举例：高 GDP 但压力大的国家","source":"National \nhappiness \nindex · 完整理由句"},{"id":"ans-4349-2","kind":"sentence","group":"translation","question_id":"4349","name":"National \nhappiness \nindex","zh":"但经济增长仍然重要，因为没它政府无法支撑医疗、教育或住房。","en":"However, economic growth still matters, since without it governments cannot fund healthcare, education or housing.","note":"举例：公共服务的资金来源","source":"National \nhappiness \nindex · 完整理由句"},{"id":"ans-4349-3","kind":"sentence","group":"translation","question_id":"4349","name":"National \nhappiness \nindex","zh":"因此，国家幸福指数应作为补充指标，因为它能反映GDP在衡量国家进步时常常忽视的社会信任、健康和环境质量。","en":"A national happiness index should therefore act as a complementary measure, because it captures social trust, health and environmental quality that GDP often overlooks when judging national progress.","note":"展开：说明幸福指数不能替代GDP，而是补充GDP；举例社会信任、预期寿命、空气质量、工作生活平衡等GDP不直接显示的内容。","source":"National \nhappiness \nindex · 完整理由句"},{"id":"ans-4349-4","kind":"sentence","group":"translation","question_id":"4349","name":"National \nhappiness \nindex","zh":"为了衡量国家幸福，政府可以把主观生活满意度调查与客观指标结合起来，例如健康预期寿命、社会支持和自由选择生活的程度。","en":"To measure national happiness, governments can combine subjective life-satisfaction surveys with objective indicators such as healthy life expectancy, social support and freedom to make life choices.","note":"展开：主观调查可参考Gallup世界民意调查中的生活满意度，客观指标可包括WHO健康预期寿命、社会支持网络、个人自由度等。","source":"National \nhappiness \nindex · 完整理由句"},{"id":"ans-4355-1","kind":"sentence","group":"translation","question_id":"4355","name":"Nature and Nurture","zh":"我认为后天影响更大，因为家庭、教育和文化塑造了人的思维和行为。","en":"I believe nurture has a greater influence, because family, education and culture shape how people think and behave.","note":"举例：不同环境长大的双胞胎","source":"Nature and Nurture · 完整理由句"},{"id":"ans-4355-2","kind":"sentence","group":"translation","question_id":"4355","name":"Nature and Nurture","zh":"但先天也有作用，因为基因影响性格、天赋甚至健康。","en":"However, nature also plays a role, since genes affect personality, talent and even health.","note":"让步","source":"Nature and Nurture · 完整理由句"},{"id":"ans-4355-3","kind":"sentence","group":"translation","question_id":"4355","name":"Nature and Nurture","zh":"社会环境和人生经历会随着时间逐渐改变行为，因此后天往往比固定的基因倾向产生更强烈、更持久的影响。","en":"Social environment and life experiences can gradually change behavior over time, so nurture often has a stronger and more lasting effect than fixed genetic tendencies.","note":"可举例说明移民适应新文化、工作环境改变沟通方式，或长期教育改变价值观，突出环境影响的持续性和可塑性。","source":"Nature and Nurture · 完整理由句"},{"id":"ans-4355-4","kind":"sentence","group":"translation","question_id":"4355","name":"Nature and Nurture","zh":"由于人通过日常互动学习大部分社交技能和价值观，后天最终决定先天潜能如何在日常性格和个人行为中表现出来。","en":"Because humans learn most social skills and values through daily interaction, nurture ultimately governs how innate potential is expressed in everyday personality and personal conduct.","note":"可举同卵双胞胎被不同家庭收养后性格差异，或儿童在不同文化中学会不同礼貌和情绪表达，说明基因潜能需靠环境表达。","source":"Nature and Nurture · 完整理由句"},{"id":"ans-1796-1","kind":"sentence","group":"translation","question_id":"1796","name":"Online teaching","zh":"我部分同意，因为线上教学灵活，让学生能接触到原本无法获得的课程和老师。","en":"I partly agree, because online teaching is flexible and gives students access to courses and teachers they could not reach otherwise.","note":"举例：偏远地区、录播课","source":"Online teaching · 完整理由句"},{"id":"ans-1796-2","kind":"sentence","group":"translation","question_id":"1796","name":"Online teaching","zh":"但它无法完全取代传统课堂，因为面对面的讨论和即时反馈在线上很难实现。","en":"However, it cannot fully replace traditional classrooms, because face-to-face discussion and immediate feedback are difficult to achieve online.","note":"对比：课堂互动 vs 屏幕","source":"Online teaching · 完整理由句"},{"id":"ans-1796-3","kind":"sentence","group":"translation","question_id":"1796","name":"Online teaching","zh":"另一个局限是线上教学对实践类科目效果较差，因为学生无法在实验室、车间或运动场使用专业设备或获得动手指导。","en":"Another limitation is that online teaching is less effective for practical subjects, since students cannot use specialised equipment or receive hands-on guidance in laboratories, workshops, or sports fields.","note":"举例：医学、化学实验、体育、艺术等需要现场操作和设备。","source":"Online teaching · 完整理由句"},{"id":"ans-1796-4","kind":"sentence","group":"translation","question_id":"1796","name":"Online teaching","zh":"此外，传统课堂培养社交技能和情感支持，因为学生通过每天与同学和老师面对面互动学会合作、解决冲突并建立自信。","en":"In addition, traditional classrooms foster social skills and emotional support, as students learn to cooperate, resolve conflicts, and build confidence through daily face-to-face interaction with peers and teachers.","note":"举例：小组项目、课堂辩论、课外活动。","source":"Online teaching · 完整理由句"},{"id":"ans-3504-1","kind":"sentence","group":"translation","question_id":"3504","name":"Over-competitive","zh":"一个优势是竞争推动人们更努力、提升技能，从而提高整体表现。","en":"One advantage is that competition pushes people to work harder and improve their skills, which raises overall performance.","note":"举例：职场、升学","source":"Over-competitive · 完整理由句"},{"id":"ans-3504-2","kind":"sentence","group":"translation","question_id":"3504","name":"Over-competitive","zh":"但过度竞争会造成压力、损害人际关系，还可能导致不道德行为。","en":"However, being over-competitive can cause stress, damage relationships and lead to unethical behaviour.","note":"举例：作弊、人际关系紧张","source":"Over-competitive · 完整理由句"},{"id":"ans-3504-3","kind":"sentence","group":"translation","question_id":"3504","name":"Over-competitive","zh":"在社会层面，过度竞争的环境可以加速创新和经济效率，因为企业和个人都努力超越对手，不过这种好处取决于是否有规则防止伤害。","en":"At the societal level, an over-competitive environment can accelerate innovation and economic efficiency, because firms and individuals strive to outperform rivals, though this benefit depends on rules that prevent harm.","note":"可展开企业研发投入、国家竞争力、技术进步和效率提升；同时强调需要监管防止恶性竞争。","source":"Over-competitive · 完整理由句"},{"id":"ans-3504-4","kind":"sentence","group":"translation","question_id":"3504","name":"Over-competitive","zh":"对社会而言，过度竞争可能加剧不平等并削弱合作，因为赢家积累资源而输家被甩在后面，这会降低信任和社会凝聚力。","en":"For society, excessive competitiveness can widen inequality and weaken cooperation, as winners accumulate resources while losers are left behind, which reduces trust and social cohesion.","note":"可举例财富差距、教育资源不均、社区关系冷漠；说明社会整体可能因零和思维而付出代价。","source":"Over-competitive · 完整理由句"},{"id":"ans-4352-1","kind":"sentence","group":"translation","question_id":"4352","name":"Overcrowding","zh":"最有效的办法是改善公共交通，因为当更多人坐地铁和公交，私家车数量会减少。","en":"The most effective solution is to improve public transport, because when more people take the subway and buses, the number of private cars drops.","note":"举例：地铁扩建、票价优惠","source":"Overcrowding · 完整理由句"},{"id":"ans-4352-2","kind":"sentence","group":"translation","question_id":"4352","name":"Overcrowding","zh":"政府还应该发展卫星城，让人们能在市中心以外生活和工作。","en":"Governments should also develop satellite towns, so that people can live and work outside the city centre.","note":"举例：新区、通勤铁路","source":"Overcrowding · 完整理由句"},{"id":"ans-4352-3","kind":"sentence","group":"translation","question_id":"4352","name":"Overcrowding","zh":"此外，城市管理部门应在高峰时段对进入市中心的司机收费，因为这会抑制不必要的汽车使用，并释放拥挤的道路和停车空间。","en":"In addition, city authorities should charge drivers to enter central areas during peak hours, because this discourages unnecessary car use and frees up crowded roads and parking spaces.","note":"举例：伦敦、新加坡的拥堵费或低排放区；说明收费如何减少车流并增加公共空间。","source":"Overcrowding · 完整理由句"},{"id":"ans-4352-4","kind":"sentence","group":"translation","question_id":"4352","name":"Overcrowding","zh":"此外，城市规划者应设计混合用途社区，让住宅、办公室和商店在步行距离内，这样居民日常出行更少依赖汽车。","en":"Moreover, urban planners should design mixed-use communities where homes, offices and shops are within walking distance, so residents rely less on cars for daily trips.","note":"举例：15分钟城市、社区商业与办公；说明减少通勤和停车需求。","source":"Overcrowding · 完整理由句"},{"id":"ans-1741-1","kind":"sentence","group":"translation","question_id":"1741","name":"Paying teachers for student achievements","zh":"我部分同意，因为把薪水与结果挂钩能激励老师更关注学生的进步。","en":"I partly agree, because linking pay to results can motivate teachers to focus more on student progress.","note":"举例：进步奖励","source":"Paying teachers for student achievements · 完整理由句"},{"id":"ans-1741-2","kind":"sentence","group":"translation","question_id":"1741","name":"Paying teachers for student achievements","zh":"但也可能让老师只盯着考试分数，忽略创造力和有困难的学生。","en":"However, it may also encourage teachers to focus only on test scores and ignore creativity or students with difficulties.","note":"对比：分数 vs 全面发展","source":"Paying teachers for student achievements · 完整理由句"},{"id":"ans-1741-3","kind":"sentence","group":"translation","question_id":"1741","name":"Paying teachers for student achievements","zh":"此外，我认为任何绩效工资制度都应采用多种指标，如课堂观察和学生进步，而非只依赖考试分数。","en":"In addition, I believe any performance-pay system should use multiple measures, such as classroom observations and student progress, rather than relying only on test scores.","note":"提出解决方案：用多指标评价替代单一分数，举例课堂观察、学生进步、同行评价，说明这样更全面公平。","source":"Paying teachers for student achievements · 完整理由句"},{"id":"ans-1741-4","kind":"sentence","group":"translation","question_id":"1741","name":"Paying teachers for student achievements","zh":"此外，仅因学生成绩奖励教师往往并不公平，因为家庭背景和学校资源等因素会强烈影响成绩，超出教师的控制范围。","en":"Moreover, rewarding teachers solely for student results is often unfair because factors like family background and school resources strongly affect achievement beyond a teacher's control.","note":"展开公平性：学生成绩受家庭、资源、基础等影响，教师无法完全控制，所以单看成绩可能误判教师努力。","source":"Paying teachers for student achievements · 完整理由句"},{"id":"ans-4357-1","kind":"sentence","group":"translation","question_id":"4357","name":"Public \ntransportation \nsystem","zh":"主要优势是便宜且环保，因为一辆满载的公交车能替代几十辆私家车。","en":"The main strength is that it is affordable and environmentally friendly, since one full bus can replace dozens of private cars.","note":"举例：票价、碳排放","source":"Public \ntransportation \nsystem · 完整理由句"},{"id":"ans-4357-2","kind":"sentence","group":"translation","question_id":"4357","name":"Public \ntransportation \nsystem","zh":"缺点是高峰时段公交和地铁拥挤，还经常晚点。","en":"The weakness is that in peak hours buses and trains are crowded and often delayed.","note":"举例：早高峰、晚点","source":"Public \ntransportation \nsystem · 完整理由句"},{"id":"ans-4357-3","kind":"sentence","group":"translation","question_id":"4357","name":"Public \ntransportation \nsystem","zh":"另一个优势是公交网络通常覆盖大多数城区和主要目的地，使没有汽车的居民也能方便地到达工作地点、学校和医院。","en":"Another strength is that the network usually covers most urban districts and key destinations, allowing residents without cars to reach work, schools, and hospitals conveniently.","note":"可举学生、老人、无车通勤者为例，说明线路覆盖主要生活场景，降低出行门槛。","source":"Public \ntransportation \nsystem · 完整理由句"},{"id":"ans-4357-4","kind":"sentence","group":"translation","question_id":"4357","name":"Public \ntransportation \nsystem","zh":"另一个不足是农村和偏远地区的公共交通服务往往有限，因此当地居民不得不依赖私家车或忍受漫长等待才能出行。","en":"A further weakness is that services in rural and remote areas are often limited, so residents there must rely on private cars or endure long waiting times to travel.","note":"可举例乡村班次少、周末停运、老人就医难，说明区域发展不均衡。","source":"Public \ntransportation \nsystem · 完整理由句"},{"id":"ans-3510-1","kind":"sentence","group":"translation","question_id":"3510","name":"Public open space","zh":"我同意，因为公共开放空间给人们运动、放松和远离城市噪音的地方。","en":"I agree, because public open spaces give people a place to exercise, relax and escape from the noise of the city.","note":"举例：公园、广场","source":"Public open space · 完整理由句"},{"id":"ans-3510-2","kind":"sentence","group":"translation","question_id":"3510","name":"Public open space","zh":"它们还把不同群体聚在一起，建立更强的社区感。","en":"They also bring different groups together, which builds a stronger sense of community.","note":"举例：社区活动","source":"Public open space · 完整理由句"},{"id":"ans-3510-3","kind":"sentence","group":"translation","question_id":"3510","name":"Public open space","zh":"我也同意，因为大型公共开放空间可以充当城市的绿肺，在混凝土密集的城市区域降低温度、吸收空气污染并支持野生动物。","en":"Another reason I agree is that a large public open space can act as the city's green lung, lowering temperatures, absorbing air pollution, and supporting wildlife in otherwise concrete-heavy urban areas.","note":"可举例夏季降温、空气质量改善、城市生物多样性。","source":"Public open space · 完整理由句"},{"id":"ans-3510-4","kind":"sentence","group":"translation","question_id":"3510","name":"Public open space","zh":"此外，我同意，因为设计良好的开放空间可以通过吸引游客、举办活动和增加附近商业活动来提振地方经济，这使各种规模的城镇都受益。","en":"A further reason I agree is that well-designed open spaces can boost local economies by attracting visitors, hosting events, and increasing nearby business activity, which benefits towns of all sizes.","note":"可举例周末市集、音乐节、咖啡馆和零售生意。","source":"Public open space · 完整理由句"},{"id":"ans-1789-1","kind":"sentence","group":"translation","question_id":"1789","name":"Purpose of education","zh":"我认为教育应该为工作做准备，因为实用技能帮他们养活自己并为社会做贡献。","en":"I think education should prepare people for work, because practical skills help them support themselves and contribute to society.","note":"举例：职业培训","source":"Purpose of education · 完整理由句"},{"id":"ans-1789-2","kind":"sentence","group":"translation","question_id":"1789","name":"Purpose of education","zh":"但教育也应该帮人实现潜能，因为只有一份工作无法给每个人有意义的人生。","en":"However, education should also help people fulfil their potential, since a job alone cannot give everyone a meaningful life.","note":"举例：艺术、人文课程","source":"Purpose of education · 完整理由句"},{"id":"ans-1789-3","kind":"sentence","group":"translation","question_id":"1789","name":"Purpose of education","zh":"均衡的教育更有效，因为自我实现培养好奇心和适应力，而这些正是帮助毕业生在快速变化的劳动力中取得成功的品质。","en":"A balanced education is more effective because self-fulfillment nurtures curiosity and adaptability, which are exactly the qualities that help graduates succeed in a rapidly changing workforce.","note":"举例：项目式学习、跨学科课程、终身学习；说明适应力既服务就业，也来自自我实现。","source":"Purpose of education · 完整理由句"},{"id":"ans-1789-4","kind":"sentence","group":"translation","question_id":"1789","name":"Purpose of education","zh":"此外，把职业准备与自我实现结合起来能减少社会不平等，因为实用培训提供经济流动机会，而个人成长给弱势学习者追求更高目标的信心。","en":"Moreover, combining workforce preparation with self-fulfillment can reduce social inequality, since practical training offers economic mobility while personal growth gives disadvantaged learners the confidence to aim higher.","note":"举例：奖学金、职业指导、导师制、社区项目；说明经济流动与自信如何同时造福个人和社会。","source":"Purpose of education · 完整理由句"},{"id":"ans-4341-1","kind":"sentence","group":"translation","question_id":"4341","name":"Restorations of buildings","zh":"我部分同意修复花费过多，因为历史建筑确实保存文化、吸引游客。","en":"I partly agree that too much is spent on restoration, because historical buildings do preserve culture and attract tourists.","note":"举例：古城、地标建筑","source":"Restorations of buildings · 完整理由句"},{"id":"ans-4341-2","kind":"sentence","group":"translation","question_id":"4341","name":"Restorations of buildings","zh":"但现代住房同样重要，因为很多人仍缺乏负担得起的住房。","en":"However, modern housing is also essential, since many people still lack affordable places to live.","note":"对比：旅游收益 vs 居住需求","source":"Restorations of buildings · 完整理由句"},{"id":"ans-4341-3","kind":"sentence","group":"translation","question_id":"4341","name":"Restorations of buildings","zh":"此外，过度修复会通过抬高房价和租金使社区绅士化，迫使长期居民搬离，并加深低收入家庭的住房短缺。","en":"Moreover, excessive restoration can gentrify neighbourhoods by raising property values and rents, which forces long-term residents out and deepens the housing shortage for low-income families.","note":"举例：历史城区改造后租金上涨，原住民和小商户迁出，旅游化社区反而减少本地可负担住房。","source":"Restorations of buildings · 完整理由句"},{"id":"ans-4341-4","kind":"sentence","group":"translation","question_id":"4341","name":"Restorations of buildings","zh":"因此，政府应通过旅游税或公私合作来资助修复，这样既能保护遗产，又不会耗尽现代保障性住房所需的预算。","en":"Therefore, governments should fund restoration through tourism taxes or public-private partnerships so that heritage is preserved without draining the budget needed for modern affordable housing.","note":"提出具体政策：征收专项旅游税、引入企业赞助、用修复后商业收益反哺住房建设。","source":"Restorations of buildings · 完整理由句"},{"id":"ans-1799-1","kind":"sentence","group":"translation","question_id":"1799","name":"Robots","zh":"我认为机器人会提高生活质量，因为它们能比人类更快更准地处理危险、重复或精密的任务。","en":"I think robots will increase our quality of life, because they can handle dangerous, repetitive or precise tasks faster and more accurately than humans.","note":"举例：工厂、手术、救援","source":"Robots · 完整理由句"},{"id":"ans-1799-2","kind":"sentence","group":"translation","question_id":"1799","name":
