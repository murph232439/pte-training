s well-rounded individuals who contribute positively to society. Such an approach instills values like empathy and social responsibility. For example, individuals who explore philosophical questions or engage in community service are more likely to become caring citizens. This fosters a sense of belonging and cooperation, ultimately benefiting society as a whole. An informed and compassionate society is more resilient to challenges, whether economic or social. Lastly, self-fulfillment leads to increased motivation and personal satisfaction. When students pursue subjects that resonate with their interests, they are more likely to remain engaged and committed to their learning journey. This intrinsic motivation can translate into passionate and driven professionals who are not only productive but also find joy and meaning in their work. In conclusion, while preparing for the workforce is vital, prioritizing self-fulfillment in education cultivates a generation of creative, compassionate, and motivated individuals. Balancing both purposes will ensure a thriving society equipped to face future challenges."}, {"id": 4341, "name": "Restorations of buildings", "topic": "More and more countries spend large amounts of money on the restoration of buildings instead of on modern housing. To what extent do you agree or disagree with this analysis? Support your writing with your experience and/or examples.", "ref": "The trend of allocating significant financial resources to the restoration of historical buildings instead of investing in modern housing raises several pertinent issues. While cultural preservation is crucial, I contend that this approach may not sufficiently address the pressing need for affordable housing in many urban areas. Firstly, investing in the restoration of historical buildings can enhance cultural heritage and tourism. Many cities around the world rely heavily on tourism, which can be stimulated by well-preserved historical architecture. For instance, countries like Italy and France attract millions of visitors annually, providing a substantial boost to their local economies. Nonetheless, while restoration contributes to cultural identity, it should not overshadow the existing housing crises faced by various populations. Secondly, the focus on restoring buildings sometimes overlooks the pressing need for modern housing developments. Urban areas are experiencing unprecedented population growth, leading to a surge in demand for affordable housing. A case in point is the rapid urbanization seen in cities like Mumbai and Jakarta, where inadequate housing can lead to the proliferation of slums. Allocating more resources toward modern housing would not only provide shelter but also enhance the quality of life for many individuals and families. Lastly, a balanced approach is crucial. While restoration is important for maintaining cultural heritage, it should be pursued in conjunction with efforts to address housing shortages. Governments can implement policies that support both the preservation of historical sites and the development of modern housing. By striking this balance, nations can protect their heritage while ensuring that citizens have access to adequate living conditions. In conclusion, while the restoration of historical buildings is essential for cultural preservation, it should not take priority over modern housing needs. A dual approach would ensure both heritage and contemporary living standards are valued and maintained."}, {"id": 1799, "name": "Robots", "topic": "An increasing number of robots are being used nowadays to perform a wide variety of tasks. Do you think robots are going to increase or decrease our quality of life?", "ref": "Robots have played a part in the human imagination for a long time. Many ancient civilisations have legends of human-like machines that exist to serve people. During the Renaissance, da Vinci sketched what looks like a knight's armour with an internal mechanism that would make it move automatically. People today tend to think of shiny, friendly machines popularized in science fiction of the 1950s, 60s and 70s. At that time, many felt certain that by today these types of robots would be commonplace. As in ancient times, the dream was for these robots to complete basic tasks and free up time for mankind to focus on more interesting or pleasant aspects of life. These types of robots have not taken off yet, however, and perhaps they never will. It turns out it is incredibly difficult to build a machine that can complete complex tasks such as walking over uneven ground. However, other kinds of useful robots do exist nowadays. They are typically machines that can complete one simple task effectively and independently, such as robotic vacuum cleaners or toilets. These types of robots certainly increase our quality of life. Robots as imagined by da Vinci exist in laboratories but are too expensive and complex to bring to market. It remains to be seen whether they will have a largely positive effect on society."}, {"id": 1784, "name": "Scientific subject", "topic": "Which subject will you choose for study of science? Explain it with examples.", "ref": "In the contemporary world, the selection of a specific subject for the study of science is critical due to the pressing issues we face. Among various scientific disciplines, Environmental Science stands out as an essential field. This essay will elaborate on the importance of Environmental Science, illustrated through its relevance to climate change, biodiversity conservation, and sustainable development. Firstly, the urgency of climate change necessitates in-depth exploration within Environmental Science. The rising global temperatures, erratic weather patterns, and increased frequency of extreme events demand scientific understanding and innovative solutions. For instance, research in this field can lead to advancements in renewable energy technologies, such as solar and wind power, which are vital for reducing carbon emissions. By studying Environmental Science, students can contribute to mitigating climate change and fostering a more sustainable future. Secondly, the preservation of biodiversity is another critical aspect of Environmental Science. The alarming rate of species extinction poses a significant threat to ecosystems and, consequently, human survival. Through comprehensive studies of ecosystems and their interdependencies, Environmental Scientists can devise conservation strategies. A pertinent example is the role of environmental impact assessments, which guide policy-makers in protecting endangered species and their habitats, demonstrating the practical implications of this field. Lastly, Environmental Science is pivotal in promoting sustainable development. As global populations continue to grow, the challenge of meeting human needs without depleting natural resources becomes increasingly pertinent. Understanding the principles of sustainable practices, such as waste management and resource conservation, not only equips students with knowledge but also empowers them to influence policies and promote environmentally responsible behavior in communities. In conclusion, studying Environmental Science is imperative in addressing climate change, conserving biodiversity, and ensuring sustainable development. This field offers valuable insights and practical solutions to some of the most pressing challenges of our time, making it a vital choice for future scientists."}, {"id": 1795, "name": "Selecting specialist areas of study", "topic": "In some countries, children can choose which subjects they study from the age of 14. This allows them to select a specialist area and to stop studying subjects they do not like. What do you think are the benefits and disadvantages of doing this?", "ref": "Education plays a major role in the public life of a country. lt is important to prepare young people for the life ahead of them, and schools can offer children from the poorest backgrounds a chance to get ahead in life. However, there is less agreement on what children should be doing with their time in school. Many jobs require specialist knowledge these days. That is true of highly academic jobs, such as a lawyer or a surgeon, but it's also true of manual jobs, such as building. There are many rules to be learnt, and in countries where children specialise early, they are able to take up meaningful employment at a younger age, too. Early specialisation also means that children are not wasting their time or becoming demotivated studying subjects that are not interesting to them, that they struggle with, or that they simply dislike. lt is better to have children spend their teenage years in tasks that truly motivate them, and that will be useful in their future. However, there is a risk that at the age of 13 or 14, children are too immature to be able to predict what will interest them in their future. They are more likely to take the same routes through work as the people around them at that age. Many girls, for example, are deterred from studying computer science at that age, but may see more value in it later in life. In conclusion, there are benefits to both systems. What is most important is that if a child makes a mistake in their choices at an early age, there are still opportunities for them later on to choose an alternative path."}, {"id": 3507, "name": "Short working weeks", "topic": "Unemployment among young people is a serious problem. Some people suggest shorter working weeks instead of laying off employees. What do you think are the advantages and disadvantages? Is it also applicable to adults?", "ref": "The proposal to implement shorter working weeks as an alternative to layoffs presents both significant benefits and notable challenges. This approach aims to distribute available work more evenly across the workforce, but requires careful consideration of its broader implications. The primary advantage is clear: shorter weeks help preserve jobs. By reducing everyone's hours instead of terminating some employees, companies can maintain their workforce while cutting costs. This provides income stability for employees and allows companies to retain trained staff, saving on future recruitment and training expenses. For young workers specifically, it offers continued employment experience and skill development that would be lost through outright dismissal. However, this approach carries substantial disadvantages. Reduced hours naturally mean lower pay, which may create financial hardship for employees relying on full-time wages. From the employer's perspective, coordinating more employees with shorter schedules can increase administrative complexity. There's also the risk that spreading work too thinly might decrease overall productivity if tasks lack continuity or require longer handover periods between staff. This strategy is certainly applicable to adult workers, though with different considerations. While adults often have greater financial commitments like mortgages and family responsibilities that make pay reduction challenging, they also typically possess valuable experience that makes job preservation worthwhile for employers. The approach may work best when combined with partial unemployment benefits or when implemented as a temporary measure during economic downturns. In conclusion, shorter work weeks offer a humane alternative to layoffs that can benefit both young and adult workers, but its success depends on careful implementation that balances the needs of employees with the operational requirements of businesses."}, {"id": 3501, "name": "Studying plays", "topic": "There are both problems and benefits for high school students studying plays and works of theatres written centuries ago. Discuss and use your own experience.", "ref": "The study of plays and theatrical works from centuries past presents students with a dual-edged sword of challenges and advantages. While these classic texts can sometimes feel irrelevant to today's youth, they also offer profound insights into human nature and societal values. Firstly, one significant benefit of studying classic plays is the exposure to timeless themes that resonate across generations. Works by authors such as Shakespeare and Molière delve into fundamental human experiences—love, betrayal, and ambition—that remain relevant today. Engaging with these themes fosters critical thinking and encourages students to reflect on their own lives and relationships, cultivating empathy and a deeper understanding of diverse perspectives. Conversely, there are notable challenges associated with this academic pursuit. The archaic language and historical contexts of many classic plays can pose obstacles for high school students, making comprehension difficult. For instance, Shakespeare’s intricate language might alienate some learners, leading to frustration instead of enlightenment. This barrier can hinder genuine appreciation for the text, which is essential for meaningful engagement. Despite these challenges, teachers can mitigate difficulties by employing modern adaptations or interactive performance techniques, turning potentially dry study into compelling experiences. By utilizing various creative approaches, educators can make the works accessible and relatable, enhancing students' appreciation for the richness of theatrical history. In conclusion, while the study of classic plays certainly comes with its set of challenges, the benefits—such as increased empathy, critical thinking, and enhanced cultural understanding—far outweigh them. Through thoughtful teaching methods, classic literature can remain an invaluable component of high school education."}, {"id": 4362, "name": "Subject choosing", "topic": "Rather than choose a subject that is suitable for future employment possibilities, you should choose a subject that you are interested in or could get good grades. Agree or disagree?", "ref": "When students select university subjects, they face a common choice: picking courses with good job prospects or choosing subjects they are interested in and can achieve good grades in. I partially disagree with the idea of only following personal interest or easy high grades, as future employment prospects should also be taken into serious consideration. Choosing a subject with genuine interest can bring many clear benefits. If students learn topics they like, they will stay motivated, enjoy the learning process and study more actively. They are more likely to gain high academic grades naturally, and this sense of achievement can build their confidence. Learning interesting subjects also allows young people to explore their hobbies and develop personal talents in a relaxed learning atmosphere. Passion always makes long-term academic study much less stressful. However, ignoring future job opportunities is not a wise decision. Some interesting subjects may have limited career paths and fierce job competition after graduation. Many students who only follow their interest may face unemployment or low-paid jobs in the future. It is more practical to balance personal interest, academic ability and employment demand, instead of focusing only on hobbies or easy grades. In conclusion, it is important to consider personal interest and academic performance when choosing a subject, as they support continuous learning and better grades. Even so, completely ignoring future employment possibilities is risky. The best choice is to balance personal interest, learning ability and career prospects, so that students can enjoy their studies and also secure a stable and promising future career."}, {"id": 4364, "name": "Successful people", "topic": "It is often said that people's lives are defined by the place where they grew up. Choose a successful person and discuss how that person's accomplishments were or were not influenced by the place where they lived when they were young.", "ref": "It is widely believed that the place where a person grows up plays a key role in shaping their future life and achievements. The local culture, educational environment and social atmosphere can deeply influence one’s thoughts, habits and life goals. To discuss this topic, I would like to take a famous writer as an example to explain how his early living place affected his later success and career development. The well-known writer spent his childhood in a quiet small town with rich traditional culture and natural scenery. The local folk stories, ancient buildings and peaceful countryside life provided him with endless writing materials. During his early years, he was deeply influenced by the simple lifestyle and kind local people around him. These early experiences inspired his interest in literature and laid a solid foundation for his writing style and creative ideas. However, the place of growth is not the only reason for his success. His personal effort, reading habit and strong determination also helped him overcome difficulties and keep improving his writing skills. Even though he later moved to a big city, he still kept the feelings and memories from his hometown, but his continuous self-study and hard work were the main driving force behind his literary achievements. In conclusion, the place where people grow up does have a clear influence on their life and success. The hometown environment offered valuable inspiration and life experience for this famous writer. At the same time, personal effort and self-discipline are also essential factors. A person’s accomplishments come from both the influence of their early living environment and their own lifelong hard work."}, {"id": 1790, "name": "Taking part in sport", "topic": "\"Taking part in sport as an adult is important for health and happiness.\" To what extent do you agree with this statement? Provide reasons and/or examples to support your ideas.", "ref": "While some people typically think of sport as something that mostly children and professional sportspeople take part in, there are a number of reasons why it's important that all able-bodied adults consider actively participating in sport, not just watching it. This essay will detail some of those reasons, including for the benefit of physical as well as mental health. Firstly, physical health is something that is important to all of us, not just children and professional sports people. While health can be maintained through diet and individual exercise routines, sport has the benefits of motivation and competition. Motivation is provided through the need to turn up whenever practice or competitions are held; to not do so would be to let others down. Competition means that people are likely to participate more vigorously than if exercising individually, meaning the health benefits are greater. Also important is the fun aspect, provided by the social nature of sport. Whether participating in an individual sport or a team sport, it's inevitable that other people will be involved. This clearly has mental health benefits as socialising is good for people's state of mind. Further mental health benefits can be obtained by the break that sport provides from the pressures and routines of life. Sporting activities force people to stop working and also to escape from the sometimes stifling chores of domestic life. In conclusion, participation in sport should not be considered something just for children and professionals.The physical and mental health benefits mean that everyone who is able to should think seriously about getting involved with a sport they enjoy."}, {"id": 4351, "name": "Taking part in Sports", "topic": "People should take part in sports either individually or in teams because people can learn many useful skills. How far do you agree? Explain and use examples or your own experience.", "ref": "Playing sports has always been a popular activity for people of all ages, either alone or as part of a team. Some people believe everyone should join in sports because they can gain many valuable life and personal skills. I fully agree with this opinion, as both individual and team sports teach people practical abilities that cannot be easily learned from daily study or work. Team sports such as football and basketball help people develop important social skills. Players must learn cooperation, communication and teamwork to reach a common goal. They also learn how to respect teammates, accept failure and support each other during difficult moments. From my own experience, joining a school sports team taught me how to listen to others’ ideas and work together to solve problems effectively. People also learn to handle pressure and celebrate achievements in a humble way. Meanwhile, individual sports like running and swimming also build valuable personal skills. People learn self-discipline, time management and strong self-motivation when they train alone. They have to set their own goals, keep practicing regularly and overcome laziness without others’ supervision. These habits improve willpower and independence, which are very useful for future study, career and daily life. Such inner strength can also help people face different challenges in their long life journey. In conclusion, taking part in individual or team sports is truly beneficial for everyone. It provides people with teamwork, communication, self-discipline and determination, all of which are essential useful skills in life. Therefore, people of all ages should be encouraged to engage in sports regularly to improve both physical health and personal ability."}, {"id": 1794, "name": "Tax on high-sugar products", "topic": "In many countries, people are consuming considerably larger amounts of sugar than is healthy. Some people think that a tax on products that contain high levels of sugar is the only way to change behaviour. How far do you agree with that idea?", "ref": "Sugar is not good for people's health. lt can lead to problems with diabetes and general poor health. The amount of sugar that we consume has increased considerably over the decades, and rather than being a treat, eating sweet things has become a daily habit. l do not, however, agree that the best solution is to tax products with sugar in them. Taxing products that contain high levels of sugar may not have the intended effect. lf the intention of introducing a sugar tax is to discourage people from buying products, it is unlikely to work. A tax of a few pennies will probably not be enough to change people's habits. Of course, if the intention is to raise income from the tax to combat health problems, then it may be more effective. To change people's habits, it seems necessary to take stronger action. Sugar is a highly addictive substance. lt may be more effective to introduce limits on the amount of sugar that companies can add to products, or ban them from advertising products that go over recommended limits. A ban on advertising may encourage companies to show restraint. An alternative might be to promote healthie ralternatives. In the long term, we need to train people to show more restraint in the choices they make. Having a bowl of fruit next to the cakes in a café may remind people that there are better options available. Although l agree with the sentiment of wanting to make sugary products less attractive, l do not believe that a tax goes far enough to change people's habits. A number of measures will be needed to tackle this problem."}, {"id": 1791, "name": "Team sports", "topic": "\"Team sports are invariably more beneficial for the people who take part in them than individual sports. \"How far do you agree with this statement? Support your point of view with reasons and/or examples from your own experience.", "ref": "There is perhaps a tendency to stereotype those who take part in individual sports, such as tennis, swimming or athletics, as somehow being reluctant to embrace teamwork and cooperation, while those who choose to participate in team sports, such as football and basketball, may be viewed as more willing to share success and possessing better interpersonal skills. In my opinion, these two ideas are, in fact, mere stereotypes and do not accurately reflect the nuances of individuals' personalities and motivation. Although team sports obviously promote a sense of camaraderie and encourage people to cooperate and collaborate with each other, it cannot be claimed that individual sports don't bring benefits of comparable value. There is no doubt that individual sports can also foster resilience and discipline in their participants. Furthermore, even if a sportsperson is on their own while they're doing their chosen sport, in my experience, this tends to be a small fraction of the overall amount of time that someone invests in a sport. These sportspeople will usually train or practise with other people and may become involved in training or mentoring other sportspeople. As a result, they will also be able to develop the collaborative skills and sense of team spirit that we associate with team sports. In conclusion, I would argue that individual sports can be as beneficial as team sports as they also allow their participants to develop valuable skills, including some of the skills that we might believe can only be fostered by team sports, for instance collaboration."}, {"id": 1798, "name": "Technology and creativity", "topic": "Nowadays, many people use devices, such as tablets or mobile phones, that are linked to the Internet and involve looking at screens for long periods of time. Should we be worried that this type of technology is limiting creativity?", "ref": "A common criticism of people, in particular children, using screen-based Internet technology is that it limits creativity. Medical experts, educators and psychologists have all joined in the debate on how much screen time is suitable for different ages, though overall there seems to be little consensus on how much time that is. It is easy to see why many are concerned. We can all conjure up the mental image of a child or teenager mindlessly staring at a tablet or phone for hours. This type of technology, one that demands no interaction and lets the person passively consume, is probably not stimulating or inspiring creativity. However, this is clearly just one aspect of this kind of technology. In the last decade, the way we interact with screen-based Internet-linked devices has changed dramatically. There are now many social platforms available which have led to a surge in creativity. Instructional videos and apps are enabling people around the world to learn and teach new skills. People are using technology of this kind to come up with creative solutions to local and global problems, such as managing food waste, organising transport or providing companionship to the elderly. Those designing and writing programs for Internet-linked devices are very creative people. Even children learning coding at school can quickly come up with original games, using nothing but a tablet and their imagination. It is probably most helpful to view Internet-linked technology as a tool or a means of expression. It depends on the user how much it limits their creativity."}, {"id": 3512, "name": "Technology used for space travel", "topic": "Governments should focus on people's lives or technologies used for space travel. To what extent do you agree with it? Use your examples.", "ref": "I strongly believe that governments should prioritize improving citizens' daily lives over investing in space travel technologies, though a balanced approach remains important for long-term progress. There are compelling reasons why public welfare deserves greater attention. First, basic human needs like healthcare, education, and housing continue to require significant improvement in many countries. For example, millions lack access to adequate medical care or quality education, and directing funds toward these areas would directly enhance living standards. Second, pressing environmental issues such as climate change and pollution demand immediate solutions that benefit current generations. The resources allocated to a single space mission could instead build multiple schools or hospitals, creating tangible benefits for communities. However, completely abandoning space technology would be shortsighted. Space research has yielded numerous practical applications that improve daily life. Satellite technology enables weather forecasting, GPS navigation, and global communications—all essential modern services. Medical advancements from space research, such as improved medical imaging and telemedicine, have saved countless lives. Furthermore, space exploration inspires scientific curiosity and drives technological innovation that eventually benefits various industries. The optimal approach involves striking a careful balance. Governments should ensure that citizens' fundamental needs are met before allocating substantial resources to space programs. Space research should focus on projects with clear earthly benefits, like climate monitoring or developing sustainable technologies. This balanced strategy addresses immediate human needs while pursuing technological progress that ultimately serves humanity. In conclusion, while space technology offers valuable benefits, governments must prioritize resolving earthly challenges that directly affect people's quality of life, maintaining only modest, purposeful investment in space exploration."}, {"id": 1793, "name": "Tertiary education", "topic": "Some people believe that tertiary education should focus mainly on preparation for the workplace. Others see it as a broader preparation for life. Explain where your opinion lies between these points of view, giving reasons and/or examples as justification.", "ref": "While debate continues between whether tertiary education should focus mainly on training for specific jobs or whether there is a higher purpose to education, my opinion is somewhere in the middle: while it makes sense for job preparation to be a significant part of tertiary education, work is not the be-all and end-all of everything and there are opportunities in tertiary education that would be lost if it was too work-focused. In fact, many skills are useful for both the workplace and for other aspects of life. On one side of the debate, it would be unfortunate if after investing several years of life in education, none of it helped in obtaining or in being successful at a job. Industry and government all require skilled people if they are to be effective, and if tertiary education doesn't provide society with such people then it's hard to know where they would come from. However, an education that focuses only on specific job skills would be very narrow and limited. There is far more to life than just work, and just as examples, an appreciation for the arts and a broad understanding of the world can only enrich society. Tertiary education clearly has a role here, too. Indeed, there are skills that are useful both for work as well as outside work. Critical thinking, for instance, not only helps people be more effective at work but also enables society to function properly- it's important to the democratic process, for holding companies and governments to account, and so on. In summary then, in an ideal world, tertiary education would provide a balance between practical work skills and knowledge, and skills and knowledge that enrich our lives and which enhance our ability to function in aspects of life outside work."}, {"id": 1752, "name": "The Digital Age", "topic": "Some people claim that the digital age has made us lazier, others claim it has made us more knowledgeable. Discuss both opinions and use your own experience to support them. ​​​​​​​", "ref": "The advent of the digital age has generated divergent opinions regarding its effects on human productivity and knowledge acquisition. While some argue that technology has rendered us lazier, others assert it has significantly enhanced our access to information and learning opportunities. This essay will explore both perspectives before drawing a conclusion. On one hand, critics contend that the convenience of digital technology fosters a sedentary lifestyle. With entertainment readily accessible at our fingertips, many individuals, including myself, find it easier to opt for binge-watching shows or scrolling through social media rather than engaging in physical activities or pursuing intellectual challenges. For instance, research shows that the average person spends over three hours daily on their mobile devices, often leading to procrastination and decreased motivation for tasks that require effort. Conversely, proponents of the digital age argue that it serves as a vast reservoir of knowledge, enabling unprecedented access to information. Online platforms such as MOOCs and educational websites allow learners from all backgrounds to acquire new skills and knowledge at their pace. Personally, I have leveraged digital resources to enhance my understanding of various subjects, from languages to programming, which I believe would have been considerably more challenging without the internet. In conclusion, while the digital age may encourage certain aspects of laziness through easy access to entertainment, it simultaneously provides tools for knowledge enhancement and personal growth. Ultimately, it is the individual's responsibility to strike a balance and utilize technological advancements to their advantage."}, {"id": 4347, "name": "The purpose of education", "topic": "The purpose of education is for workers and good members of society, or individuals to fulfill their lives. Which opinion do you agree with?", "ref": "Education plays a vital role in everyone’s growth and future life. People have different views on the main purpose of education. Some believe it only aims to train workers and responsible citizens, while others think it should help individuals achieve personal life fulfillment. I believe education should serve both social needs and personal life satisfaction at the same time. On one hand, education certainly helps prepare people to become skilled workers and good members of society. Schools teach professional knowledge, basic social rules and teamwork skills, which allow young people to find suitable jobs in the future. Well-educated individuals can follow social rules, respect others and contribute to economic development, making society more stable and orderly. Without proper education, it would be hard for a country to maintain a productive and harmonious community. On the other hand, education is also important for individuals to fulfill their own lives. It allows people to broaden their horizons, develop personal hobbies and shape their own personalities. Through learning, students can understand their strengths and interests, pursue their dreams and enjoy a meaningful life rather than just working for a living. This personal growth brings lifelong happiness and inner satisfaction to every person. It also enables people to face life challenges with confidence and independent thinking. In conclusion, education should not only focus on training workers and qualified citizens for society, but also help individuals realize self-value and live a fulfilling life. Combining these two goals makes education complete, and it can benefit both society as a whole and every individual in the long run."}, {"id": 3499, "name": "The value of humanities", "topic": "Some say that in today’s world, the value of humanities has been eclipsed by the necessity of preparing for specific wealth-producing careers, such as medicine. What is your opinion about the role in today’s changing world of the study of the humanities?", "ref": "In an increasingly competitive job market, the emphasis on vocational training has seemingly overshadowed the importance of the humanities. However, the study of the humanities remains essential in nurturing well-rounded individuals and fostering critical thinking, creativity, and cultural awareness. Firstly, the humanities cultivate critical thinking skills, which are invaluable in any profession. Through analyzing literature, philosophy, and history, students learn to interpret complex texts and question prevailing narratives. This analytical approach equips them to tackle real-life problems with greater insight. For instance, a medical professional who is well-versed in ethics can navigate moral dilemmas with a nuanced understanding, ultimately improving patient care. Secondly, the humanities contribute to creativity, a crucial trait in an era increasingly driven by innovation. Fields such as art, literature, and music inspire original thinking and encourage individuals to think outside the box. This creative mindset is not only beneficial in artistic careers but also in scientific and technological fields, where groundbreaking ideas often emerge from interdisciplinary perspectives. The ability to approach problems creatively can lead to significant advancements and entrepreneurship. Lastly, studying the humanities fosters cultural awareness and empathy, essential qualities in our globalized world. Understanding diverse cultures and histories enhances communication and collaboration among individuals from different backgrounds. In professions like healthcare and education, such empathy is critical for building trust and delivering effective services. In conclusion, while a focus on career-oriented education is important, the humanities play a crucial role in shaping intellectually and socially responsible individuals capable of thriving in a complex, interconnected world. Balancing vocational training with humanities education ensures a more holistic approach to personal and professional development."}, {"id": 4345, "name": "Tuition fee", "topic": "Because university degrees can get jobs with higher salaries, university students should pay the full cost of their education. Do you agree or not?", "ref": "In modern society, a university degree is widely regarded as a key to well-paid professional jobs. Some people argue that since graduates can earn higher salaries in the future, they should pay the full cost of their university studies. However, I strongly disagree with this opinion for several clear reasons. Firstly, requiring students to pay full tuition will create unfair pressure for families with low income. Many talented young people from poor backgrounds have the ability to complete higher education, but they cannot afford expensive university fees. If no financial support is provided, these students may give up studying at university, and society will lose many potential skilled workers and professionals. This will also widen the wealth gap between rich and poor groups in the long run. Secondly, university education benefits the whole society rather than only individuals. Well-educated graduates contribute to economic growth, technological development and social progress. It is reasonable for the government to share part of the education cost, as a knowledgeable workforce can bring long-term benefits to the whole country, not just personal high salaries. Finally, even though graduates may gain higher income after graduation, most young people have no stable income during their studies. Paying full education fees will leave them in heavy debt at a young age, which influences their life choices after leaving university. In conclusion, although a university degree helps people get higher salaries, students should not be forced to pay the full cost of education. Government support and affordable tuition are necessary to ensure equal educational opportunities and social development for everyone."}, {"id": 3515, "name": "Unhealthy lifestyles", "topic": "Poor lifestyles hurt people's health. List some unhealthy lifestyles and discuss what government services could help.", "ref": "Poor lifestyle choices significantly damage people's health, creating serious problems for both individuals and society. Several unhealthy habits are particularly concerning, and governments can implement various services to address them. One major issue is poor diet, especially the overconsumption of processed foods high in sugar, salt and unhealthy fats. This leads to obesity, diabetes and heart disease. Many people also suffer from physical inactivity, spending too much time sitting at desks or watching screens. Smoking and excessive alcohol consumption remain widespread problems that cause numerous health conditions. Additionally, chronic sleep deprivation affects growing numbers of people, weakening immune systems and mental health. Government services can play a crucial role in addressing these issues. Firstly, public education campaigns can raise awareness about healthy eating and the importance of exercise. Schools should incorporate nutrition education and daily physical activity into their curricula. Secondly, governments can regulate food manufacturers by requiring clear nutritional labeling and limiting unhealthy ingredients in processed foods. Creating more public recreational facilities would encourage physical activity. Parks, walking trails, and community sports centers provide free or low-cost opportunities for exercise. For tobacco and alcohol control, governments can maintain high taxes on these products and enforce strict age restrictions. Healthcare systems should offer free smoking cessation programs and counseling services for those struggling with addiction. Furthermore, workplace regulations could promote better work-life balance to reduce stress and improve sleep patterns. Public health services should regularly screen for lifestyle-related diseases and provide early intervention. In conclusion, while individuals must take responsibility for their lifestyle choices, governments have an essential role in creating environments that support healthy living through education, regulation, and accessible services."}, {"id": 3508, "name": "Wearing uniforms", "topic": "Should schools have strict rules on wearing uniforms?", "ref": "The question of whether schools should enforce strict uniform policies remains widely debated. I believe that while uniforms offer some benefits, excessively strict rules can create more problems than they solve. There are clear advantages to school uniforms. Firstly, they promote equality among students by reducing visible differences in family wealth. When everyone wears the same clothes, there is less pressure to wear expensive brands and less bullying based on clothing choices. Secondly, uniforms create a sense of belonging and school spirit, helping students feel connected to their school community. They also simplify morning routines for both parents and children, eliminating daily debates about what to wear. Furthermore, uniforms can improve safety by making it easier to identify outsiders on school grounds. However, strict uniform policies also have significant disadvantages. They limit students' ability to express their individuality through clothing, which is an important part of personal development. Many uniforms are also uncomfortable or impractical for all-day wear and various school activities. The cost of uniforms can be burdensome for families, particularly when they must be purchased from specific suppliers at high prices. Additionally, enforcing very strict rules often leads to unnecessary conflicts between students and teachers over minor details like sock color or hair accessories. In conclusion, while reasonable uniform requirements can benefit schools, extremely strict rules often cause more harm than good. A balanced approach that sets basic standards while allowing some personal expression would be most effective for both students and schools."}, {"id": 3509, "name": "Women raise a family", "topic": "More and more women are raising a family with a career. Please give your suggestions on a personal level and national level.", "ref": "The increasing number of women managing both careers and families represents significant social progress, yet it also creates unique challenges that require support at both personal and national levels. On a personal level, effective time management and family cooperation are crucial. Women should prioritize tasks and set clear boundaries between work and family time. Sharing household responsibilities with partners is essential - chores and childcare should not automatically fall on women. Families could create weekly plans that distribute tasks fairly. Additionally, building a strong support network of relatives, friends, or reliable childcare providers can help manage emergencies and reduce daily pressures. Learning to delegate and occasionally saying no to additional commitments can also prevent burnout. At the national level, governments should implement policies that actively support working mothers. Affordable, high-quality childcare services would significantly reduce family stress and financial burden. Extended paid parental leave for both parents would allow better family adjustment without career penalties. Tax benefits for families with young children could ease financial pressure. Furthermore, companies should be encouraged through incentives to offer flexible working arrangements and create more family-friendly workplaces. The government could also launch public education campaigns to promote shared family responsibilities and combat gender stereotypes in domestic work. By combining personal strategies with supportive national policies, we can create an environment where women don't have to choose between career and family, but can successfully manage both."}, {"id": 3505, "name": "Working less time", "topic": "In the future, people will work less time at their jobs. To what extent do you agree with it? Please support your opinion with your own experience.", "ref": "I partially agree that people will work less in the future, but I believe this will not be true for everyone. Technology will create this possibility for some, while the nature of other jobs and economic pressures will prevent it for many. On the one hand, technology is a key reason why some people may work less. Automation and computers are taking over many repetitive jobs in factories and offices. This means the same amount of work can be done faster. For example, a worker on an assembly line might be replaced by a robot, and an accountant might use software to do calculations in minutes instead of hours. This increased efficiency could allow companies to offer shorter work weeks without losing productivity. On the other hand, many jobs cannot be easily reduced. In fields like healthcare, teaching, or repair services, the work is based on human care and complex problem-solving. A nurse or a plumber cannot be replaced by a machine. Furthermore, in a competitive world, many people feel they must work long hours to keep their jobs or get a promotion. The idea of a four-day week remains a dream for them. In conclusion, while a future with less work is possible for people in certain automated jobs, it is unlikely to become a universal reality. The gap between those who can work less and those who cannot may even grow larger."}, {"id": 4350, "name": "Works of literature", "topic": "Works of literature are a waste of time for students today. Do you agree and or disagree? Explain your idea using examples or your own experience.", "ref": "In modern times, most students focus heavily on academic subjects and practical skills for their future careers. Some people claim that reading works of literature is useless and merely a waste of time for young learners. From my own study experience, I completely disagree with this opinion, because literary works bring valuable benefits to students’ personal growth and learning ability. Firstly, reading literature helps students improve their language skills and writing ability. Novels, poems and stories enrich learners’ vocabulary and teach them how to organise sentences in a logical way. When I read classic literary books in my spare time, I learned many useful expressions that greatly improved my school essays and reading comprehension. Such progress cannot be gained only from regular textbooks. It also trains students to understand deep meanings and hidden messages in complex texts. Secondly, literary works allow students to understand different cultures, life values and human emotions. They open students’ minds and encourage creative thinking, instead of only learning fixed knowledge for exams. Literature also helps young people reduce study pressure and relax their minds after long hours of hard work. It shapes their personality and teaches them how to view life and society in a more thoughtful way. Many life lessons from literary characters can guide students to make wise decisions. In conclusion, reading literary works is never a waste of time for today’s students. It improves language ability, broadens thinking and enriches inner world. Schools and students should value literary reading, as it plays an irreplaceable role in well-rounded education and lifelong personal development."}, {"id": 1800, "name": "Zoos", "topic": "Zoos have a long history and nowadays millions of people all over the world still enjoy visiting them every year. Do zoos benefit modern society and can they play a useful role in aiding wildlife conservation?", "ref": "Zoos were originally set up not to conserve wildlife, but for entertainment. Exotic animals, often from distant places, were kept and displayed in zoos for the amusement of royal families. These animals were used to show how rich and powerful these families were. Later, zoos started to become open to the public. Scientists used zoos to carry out research on the animals, and people visited zoos to educate themselves about animals from around the world. In more recent times, zoos have often played a role in rescuing animals and organizing breeding programmes to help increase the numbers of endangered animal species. This can have a positive effect on the populations of rare animals, but it does not make up for the fact that animals in zoos are not living in their natural environments. Nowadays, scientists and the general public can still learn about animals by visiting zoos. However, this is only acceptable if the animals are given conditions which are as similar as possible to their natural habitats. The welfare of the animals must take priority over any desire to educate or entertain people. While many modern zoos claim to aid wildlife conservation, their funds would be better spent on projects protecting wildlife in its natural habitats. Successful breeding programmes can be established in the areas where the animals are from. Many such programmes already exist and are able to increase the numbers of endangered wildlife."}];
var CUR=null,TIMER=null,LEFT=1200;
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function pm(){var m=Math.floor(LEFT/60),s=LEFT%60;var el=document.getElementById('timer');if(!el)return;el.textContent=('0'+m).slice(-2)+':'+('0'+s).slice(-2);el.className='timer'+(LEFT<=120?' warn':'')}
function stopT(){if(TIMER){clearInterval(TIMER);TIMER=null}}
function copyText(text,btn){var done=function(){var old=btn.textContent;btn.textContent='已复制';setTimeout(function(){btn.textContent=old},1200)};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(function(){done()});return}var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();done()}
function list(kw){
  kw=(kw||'').toLowerCase();
  var a=D.filter(x=>!kw||x.name.toLowerCase().includes(kw)||x.topic.toLowerCase().includes(kw));
  document.getElementById('list').innerHTML=a.map(x=>'<div class="card" data-id="'+x.id+'"><div><div class="cname">'+esc(x.name)+'</div><div class="cmeta">20 分钟 · 200-300 词 · 含参考范文</div></div><div class="go">开始 →</div></div>').join('')||'<div style="text-align:center;color:#98a0ae;padding:40px">没有找到</div>';
}
function practice(it){
  stopT(); LEFT=1200;
  var tpl='<b>第 1 段：引入与立场</b>\nNowadays, an increasing number of people are concerned about [主题词]. Some argue that [题目改写]. I generally agree / disagree with this view because [核心立场].\n\n<b>第 2 段：让步与反方观点</b>\nAdmittedly, proponents of the view that [反方观点] raise valid points. In fact, [反方论点]. For instance, [反方例子]. Thus, it is understandable why some argue that [反方结论].\n\n<b>第 3 段：我方论证</b>\nNevertheless, these drawbacks are largely outweighed by the benefits that ['+esc(it.name)+'] brings. To begin with, the positive impact of ['+esc(it.name)+'] is most evident in [领域 1]. For instance, [例子 1]. Furthermore, ['+esc(it.name)+'] also plays a crucial role in [领域 2], as it [进一步说明]. For example, [例子 2]. Therefore, it is clear that [本段总结].\n\n<b>第 4 段：结论</b>\nIn conclusion, while the view that [让步观点] may have some merits, I am convinced that [我方观点] is ultimately more justifiable, as it not only offers [A] but also provides [B].';
  var h='<span class="back" id="back">← 返回题库</span>'+
  '<div class="panel"><div class="topic">'+esc(it.topic||it.name)+'</div></div>'+
  '<div class="panel"><textarea id="ta" placeholder="在这里写 200-300 词的作文..."></textarea><div class="wc" id="wc">0 词</div></div>'+
  '<div class="panel"><button class="bigbtn ghost" id="showTpl" style="width:100%;border:0;border-radius:10px;padding:12px;font-size:15px;font-weight:600;background:#eef3fb;color:#2456a6">四段模板</button><div class="ans" id="tpl"><h3>WE 四段模板 · 让步 + 反驳</h3><div class="tpl" id="tplText">'+tpl+'</div><button class="bigbtn ghost" id="copyTpl" style="width:100%;margin-top:10px">复制模板</button><div style="font-size:12.5px;color:#98a0ae;margin-top:8px">槽位里的抽象表达，可以到 <a href="we-collocations.html" style="color:#2456a6">翻译精修</a> 里查询参考表达。</div></div></div>'+
  '<div class="panel"><button class="bigbtn ghost" id="showRef" style="width:100%;border:0;border-radius:10px;padding:12px;font-size:15px;font-weight:600;background:#eef3fb;color:#2456a6">看参考范文</button><div class="ans" id="ans"><h3>参考范文</h3><div class="ref">'+esc(it.ref)+'</div></div></div>'+
  '<div class="bar"><span class="timer" id="timer">20:00</span><button class="ghost" id="startBtn">开始</button><button id="nextBtn">下一题</button></div>';
  document.getElementById('list').innerHTML=h;
  document.getElementById('back').onclick=()=>{stopT();list(document.getElementById('q').value)};
  document.getElementById('showTpl').onclick=()=>document.getElementById('tpl').classList.toggle('on');
  document.getElementById('copyTpl').onclick=function(){copyText(document.getElementById('tplText').innerText,this)};
  document.getElementById('showRef').onclick=()=>document.getElementById('ans').classList.toggle('on');
  document.getElementById('startBtn').onclick=function(){
    if(TIMER){stopT();this.textContent='开始';return;}
    this.textContent='暂停';
    TIMER=setInterval(()=>{LEFT--;if(LEFT<=0){stopT();LEFT=0;document.getElementById('startBtn').textContent='开始';}pm();},1000);
    pm();
  };
  document.getElementById('nextBtn').onclick=()=>{
    var i=D.findIndex(x=>x.id===it.id); var nx=D[(i+1)%D.length]; practice(nx);
  };
  document.getElementById('ta').oninput=function(){
    var n=(this.value.trim().match(/[A-Za-z][A-Za-z'’-]*/g)||[]).length;
    var el=document.getElementById('wc'); el.textContent=n+' 词'; el.className='wc'+(n>=200&&n<=300?' ok':'');
  };
  pm();
}
document.getElementById('q').oninput=function(){list(this.value)};
document.getElementById('list').onclick=function(e){
  var c=e.target.closest?e.target.closest('.card'):null; if(!c)return;
  var it=D.find(x=>x.id===+c.dataset.id); if(it)practice(it);
};
list('');
</script></body></html>
