<main>
  <div class="intro"><h2>选择顺序</h2><p>先根据题型选择模板，再根据自己的分数段选择版本。WE7.0 的结构最直接，WE5.0 Plus 使用让步—反驳，WE6.0 Plus 适合按固定段落完成任务。</p></div>
  <div id="list"></div>
</main>

var D=[{"name":"WE5.0 Plus · 高分段","note":"让步—反驳型，先承认反方合理性，再集中展开我方优势。","templates":[{"title":"一边倒模板","body":"首段\nNowadays, an increasing number of people are concerned about + [主题词/whether + 句子]. Some argue that + 题目改写. I generally agree/disagree with this view.\n\n第二段\nAdmittedly, proponents of the view that [你反对的观点] raise valid points. In fact, 论点. For instance, 例子. Thus, it is understandable why some argue that [重申你反对的观点].\n\n第三段\nNevertheless, these drawbacks are largely outweighed by the benefits that [主题词] brings. To begin with, the positive impact of [主题词] is most evident in [领域]. This is because [解释]. For instance, [具体例证]. Furthermore, [主题词] also plays a crucial role in [另一个方面], as it [进一步说明]. For example, [例子]. Therefore, it is clear that [总结句].\n\n第四段\nIn conclusion, while [让步观点] may have some merits, I am convinced that [重申我方观点] is ultimately more beneficial/justifiable, as it not only offers ... but also provides ...."}],"samples":[{"title":"#184 Foreign Languages","url":"we-5plus.html?q=Foreign%20Languages"}]},{"name":"WE7.0 · 高分段","note":"绝对一边倒：只写支持的观点，主体段分别展开两个正面论点。","templates":[{"title":"一边倒模板","body":"适用：是否同意类 / A or B 类 / 优点大于缺点类\n\n第一段：开篇引入\n背景句：Nowadays, an increasing number of people are concerned about ...\n辩题句：Some argue that + 句子1, whereas other people assert that + 句子2.\n个人立场句：I firmly side with the former/latter view for the following reasons.\n\n第二段：我方第一个正面论点\nFirst and foremost, ... / Firstly, ...\nThis is because ... / To be more specific, ... / In other words, ...\nFor example, ... / For instance, ... / One example is that ...\nAs a result, ... / Therefore, ... / Consequently, ... / Thus, ...\n\n第三段：我方第二个正面论点\nIn addition, ... / Additionally, ... / Moreover, ... / Furthermore, ...\nThis is because ... / To be more specific, ... / In other words, ...\nFor example, ... / For instance, ... / One example is that ...\nAs a result, ... / Therefore, ... / Consequently, ... / Thus, ...\n\n第四段：全文总结立场\nIn conclusion, I am convinced that although ..., ......"},{"title":"利弊分析类平衡写法","body":"第一段：开篇引入\nThe practice of ... has become increasingly widespread across the globe.\nThis essay will examine both the advantages and disadvantages associated with ...\n\n第二段：优点\nOn the positive side, ...\nThis is because ... / To be more specific, ... / In other words, ...\nFor example, ... / For instance, ... / One example is that ...\nAnother benefit is that ...\n\n第三段：缺点\nOn the negative side, ... / However, one of the major drawbacks is that ...\nThis is because ... / More specifically, ...\nFor example, ... / One example is that ...\nFurthermore, ... / Another disadvantage is that ...\n\n第四段：总结\nTo sum up, while doing sth brings clear benefits such as ..., it also entails certain downsides like ...."},{"title":"双提问类型模板","body":"可以直接参考 WE6.0 Plus 的双提问模板：每一段回答题目中的一个问题，避免两个问题混在同一主体段里。"}],"samples":[{"title":"#106 Effective Study","url":"we-5plus.html?q=Effective%20Study"},{"title":"#46 Worker Decision-Making","url":"we-5plus.html?q=Worker%20Decision-Making"}]},{"name":"WE6.0 Plus · 中分段","note":"结构固定、连接词清楚，适合用一段回答一个任务。","templates":[{"title":"是否同意类（一边倒）","body":"首段\nNowadays, an increasing number of people are concerned about [词组或者 whether + 句子]. Some claim that 改写题目. I largely agree/disagree with the view for the following reasons.\n\n主体段 1\nTo begin with, the advantages of [主题词] are most noticeable when it comes to [sth/doing sth]. For example, [例子]. Moreover, [主题词] also significantly influence(s)/improve(s)/broaden(s)/facilitate(s)/reduce(s)/promote(s)/benefits/contribute to [sth]. To be specific, [拓展]. Additionally, [主题词] can bring long-term benefits for [sth], particularly in terms of [sth]. Therefore, it is clear that [主题词] play(s) a vital role in [sth].\n\n主体段 2\nHowever, despite these advantages, some critics point out that over-reliance on [主题词] can result in issues such as [问题A] and [问题B]. Nevertheless, these negative effects are often overshadowed by the fact that [我方核心优势/解决方案]. In most cases, the drawbacks are manageable and do not undermine the overall positive impact.\n\n结尾\nIn conclusion, I am convinced that [重申首段观点], although it/they has/have limitations in certain areas."},{"title":"A or B 类（你的观点）","body":"与是否同意类基本相同，只在首段多一句 opposite view。\n\n首段\nNowadays, an increasing number of people are concerned about [词组或者 whether + 句子]. Some claim that + 题目一方观点, while others hold the view that + 题目另一方观点. I generally agree with the former/latter view for the following reasons.\n\n主体段 1\nTo begin with, the advantages of [主题词] are most apparent in [sth/doing sth]. For example, [例子]. Moreover, [主题词] also significantly improves [sth]. To be specific, [拓展]. Besides, [主题词] can bring long-term benefits for [sth]. Therefore, it is clear that [主题词] play(s) a vital role in [sth].\n\n主体段 2\nHowever, despite these advantages, some critics point out that over-reliance on [主题词] can result in issues such as [问题A] and [问题B]. Nevertheless, these negative effects are often overshadowed by the fact that [我方核心优势/解决方案].\n\n结尾\nIn conclusion, I am convinced that [重申首段观点], although it/they has/have limitations in certain areas."},{"title":"优缺点类（双边写法）","body":"首段\nThe practice of [主题词] has become increasingly widespread across the globe. This essay will examine both the advantages and disadvantages associated with ....\n\n主体段 1\nTo begin with, the advantages of [主题词] are most noticeable in [sth/doing sth]. For example, [例子]. Moreover, [主题词] also significantly contributes to/improves/broadens/facilitates/reduces/promotes [sth]. To be specific, [拓展]. Therefore, it is clear that [主题词] play(s) a vital role in [sth].\n\n主体段 2\nHowever, despite its advantages, [主题词] is not without limitations. Firstly, overemphasising the importance of [主题词]/over-reliance on [主题词] can result in [问题]. For instance, [例子]. Secondly, [主题词] can also decrease/affect [sth], as [解释原因]. Thus, it is understandable why some argue that the negative impacts cannot be neglected.\n\n结尾\nIn conclusion, the evidence supports the view that [主题词] brings both pros and cons to individuals and society."},{"title":"双提问型（一段回答一个问题）","body":"使用规则：题目若有两个问题，每一段明确回答一个，不要两个问题混写。\n\n第一段\n回答题目中的第一个问题，写背景、直接答案和一个核心原因。\n\n第二段\n回答题目中的第二个问题，写明确判断和具体做法或建议。\n\n第三段\n分别回扣两个问题，避免只总结其中一个。\n\n结尾\nIn conclusion, I am convinced that although ...., ...."}],"samples":[{"title":"#24 Information Revolution","url":"we-5plus.html?q=Information%20Revolution"},{"title":"#56 Experiential Learning","url":"we-5plus.html?q=experiential%20learning"},{"title":"#72 The Design of Buildings","url":"we-5plus.html?q=design%20of%20Buildings"},{"title":"#39 Right Balance","url":"we-5plus.html?q=Right%20Balance"}]}];
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function render(){
  document.getElementById("list").innerHTML=D.map(function(g){
    var tpl=g.templates.map(function(x){return '<details><summary><div class="title">'+esc(x.title)+'</div><div class="meta">点击展开模板</div></summary><div class="body">'+esc(x.body)+'</div></details>'}).join("");
    var samples=g.samples.length?'<div class="samples">'+g.samples.map(function(x){return '<a href="'+esc(x.url)+'">'+esc(x.title)+' →</a>'}).join("")+'</div>':"";
    return '<div class="groupTitle">'+esc(g.name)+'</div><div class="groupNote">'+esc(g.note)+'</div>'+tpl+samples;
  }).join("");
}
render();
</script>
