is piece of research was done by an advertising company because advertisers are so interested in how we, how we interact with each other and the environment. And we see that the majority of people use sight obviously to interact with the environment, but in the second place, we see the smell is also very, very important.","ref":"We’ve all been to a historic library. Most historic libraries have such an intensive smell of old books. People are asked to perceive the library. Indeed, the smell is an important way of how we communicate with the environment. The majority of people use sight to interact with the environment, but on the second place, the smell is also very, very important. 我们都去过历史悠久的图书馆。在大多数历史悠久的图书馆里，都有一种强烈的旧书味。人们通过感官体验来认识图书馆。事实上，气味是我们与环境交流的重要方式之一。大多数人通过视觉与环境互动，但其次，气味也非常非常重要。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693307/49ac17c87b4e4e93b9785d5217f679de.mp3","phrases2":[{"en":"but → it And what does it mean","zh":"但它是什么？又意味着什么？"},{"en":"when → we’ve recently when at UCL Center for Sustainable Heritage","zh":"当我们最近在伦敦大学学院可持续遗产中心时"},{"en":"when → at UCL Center for Sustainable Heritage","zh":"在伦敦大学学院可持续遗产中心时"},{"en":"so → important to our audience","zh":"对我们的受众如此重要；人们如何……非常重要"},{"en":"so → important how people perceive the library","zh":"人们如何看待图书馆非常重要"},{"en":"so → quite an important message in our","zh":"所以，那在我们……中曾是一个相当重要的信息"},{"en":"because → so interested in how","zh":"因为广告商非常关心如何……"},{"en":"so → interested in how we how we interact with each other","zh":"如此关注我们如何彼此互动"}]},{"id":3360,"name":"Soot emission","phrases":["when → burn dung coal diesel fuel and wood","so → even a little soot on snow makes it melt faster","when → snow melts global sea levels rise","while → been its main cause","but → there's good news reducing black carbon may be the fastest","so → than changing a light bulb","since → black carbon only stays in the atmosphere for a couple","but → solving our soot problem now will help buy time"],"eng":"Sometimes it's the little things that can make big things happen. Fleas and the plague, atoms and nuclear bombs. Diminutive leaders in world history. Soot is one of these little things. Soot also known as black carbon is released when you burn dung, coal, diesel fuel and wood. From Los Angeles to Mumbai, soot causes respiratory illnesses like lung cancer and asthma and contributes to one point six million premature deaths every year. 160 Mostly among the poor. And it gets worse. Atmospheric currents carry soot thousands of miles from where it is produced, to the Himalayas and the Arctic. Black carbon being black, absorbs sunlight, so even a little soot on snow makes it melt faster. And when snow melts global sea levels rise, threatening our freshwater indigenous communities and polar bears who hunt on the Arctic ice. Climate Change has been a big thing for a while and carbon dioxide has been its main cause. Scientists estimate that soot causes twenty five percent of human-caused global warming. 25% It's the second leading cause of Arctic warming after carbon dioxide. Let's not underestimate the impact of this tiny particle. But there's good news, reducing black carbon may be the fastest way to slow global warming. Buy time for the Arctic. Yes even more so than changing a light bulb. Since black carbon only stays in the atmosphere for a couple of weeks, reducing it will produce results immediately. Of course, reducing soot alone won't solve global warming, but solving our soot problem now will help buy time for the Arctic and allow us to deal with the bigger problem of carbon dioxide. We have the cleaner industries,cook stoves,and diesel now we have to use them. In developed nations, we've significantly reduced our black carbon, but we still have much more to do. We need to tighten our standards at home and invest in cleaner technologies in developing nations. But if you urge the US government and the European Union to take the lead on black carbon reduction, you can make a big difference. Go to www. stopsoot. org www.stopsoot.org And help stop these little things from causing big trouble.","ref":"The lecture discusses the major impact of soot, or black carbon, on health and climate. Soot comes from burning materials like coal and wood, causing respiratory diseases and millions of deaths yearly. It also contributes significantly to global warming. The speaker highlights that reducing soot is a fast solution because it leaves the atmosphere quickly. While not a complete fix, cutting soot emissions can buy time to address CO2. The talk ends by urging public action and policy changes to tackle this problem. 本次讲座重点探讨了煤烟（又称黑碳）对健康与气候的重大影响。煤烟产生于煤炭、木料等物质的燃烧过程，不仅会引发呼吸系统疾病，更导致全球每年数百万人死亡，同时还显著加剧全球变暖。讲者特别强调，减少煤烟排放是一项收效迅速的气候对策，因其能快速脱离大气层。尽管这并非根本解决方案，但控制煤烟排放能为应对二氧化碳问题争取宝贵时间。讲座最后呼吁公众行动与政策改革共同应对这一环境挑战。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690250/05ba74a3fd0647f4991b061ba46b44d2.mp3","phrases2":[{"en":"when → burn dung coal diesel fuel and wood","zh":"当你燃烧粪便、煤炭、柴油和木材时"},{"en":"so → even a little soot on snow makes it melt faster","zh":"所以，雪上哪怕有一点煤烟，也会让它融化得更快"},{"en":"when → snow melts global sea levels rise","zh":"当雪融化时，全球海平面会上升"},{"en":"while → been its main cause","zh":"而二氧化碳一直是其主要原因"},{"en":"but → there's good news reducing black carbon may be the fastest","zh":"但好消息是，减少黑碳可能是最快的办法"},{"en":"so → than changing a light bulb","zh":"所以，比换灯泡还快"},{"en":"since → black carbon only stays in the atmosphere for a couple","zh":"因为黑碳只在大气中停留几周"},{"en":"but → solving our soot problem now will help buy time","zh":"但现在解决我们的煤烟问题将有助于争取时间"}]},{"id":1595,"name":"Start in university","phrases":["if → miss a lecture though","though → or didn't quite understand the topic","however → very busy and you won't have much","so → it's better to concentrate and take good notes","when → do attend a lecture","if → make notes it helps you to think about the","but → making your own notes is much more valuable"],"eng":"As a new student, there are many things that you can do to get a good start at university. Attending lectures is something that we expect all students to do. If you miss a lecture though, or didn't quite understand the topic, or simply want to hear it again, you can watch a video recording of the lecture online. However, university life is very busy and you won't have much time, so it's better to concentrate and take good notes when you do attend a lecture. If you make notes, it helps you to think about the important facts and ideas in the lecture, and writing these things down can help you to remember them again. There may be lecture notes available online, but making your own notes is much more valuable.","ref":"The lecture tells new students at university what they should do. The speaker says that students should go to lectures, but if they can't go to one, they can see a video of it online. It's better to go to lectures and take notes, though, because taking notes can help students remember important things from the lectures. 讲座告诉大学新生他们应该做什么。演讲者说学生应该去听课，但如果他们不能去听课，他们可以在网上看到讲座的视频。最好去听课并记笔记，因为记笔记可以帮助学生记住讲座中重要的事情。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658436/87636b245c2a44cd8f7ee27a931e3f31.mp3","phrases2":[{"en":"if → miss a lecture though","zh":"不过，如果你缺了一节课"},{"en":"though → or didn't quite understand the topic","zh":"或者没太理解这个主题"},{"en":"however → very busy and you won't have much","zh":"然而大学生活非常忙碌，你不会有太多时间"},{"en":"so → it's better to concentrate and take good notes","zh":"所以最好专心听讲，好好记笔记"},{"en":"when → do attend a lecture","zh":"当你真的去听课时"},{"en":"if → make notes it helps you to think about the","zh":"如果你记笔记，有助于你思考所学内容"},{"en":"but → making your own notes is much more valuable","zh":"但自己记笔记要有价值得多"}]},{"id":4280,"name":"Stem cells","phrases":["while → skin cells protect your body","when → die For example you completely replace the lining","for example → completely replace the lining of your intestines every four","for example → scientists currently use stem cells to treat patients with blood"],"eng":"Stem cells are cells that are undifferentiated, meaning they do not have a specific job or function. While skin cells protect your body, muscle cells contract and nerve cells send signals, stem cells do not have any specific structures or functions. Stem cells do have the potential to become all other kinds of cells in your body. Your body uses stem cells to replace worn-out cells when they die. For example, you completely replace the lining of your intestines every four days. Stem cells beneath the lining of your intestines replace these cells as they wear out. Scientists hope that stem cells could be used to create a very special kind of personalized medicine, in which we could replace your own body parts with, well, your own body parts. Stem cell researchers are working hard to find ways in which to use stem cells to create new tissue to replace the parts of organs that are damaged by injury or disease. Using stem cells to replace damaged bodily tissue is called regenerative medicine. For example, scientists currently use stem cells to treat patients with blood diseases such as leukemia. Leukemia is a form of cancer that affects your bone marrow. Bone marrow is the spongy tissue inside your bones where your blood cells are created. In leukemia, some of the cells inside your bone marrow grow uncontrollably, crowding out the healthy stem cells that form your blood cells. Some leukemia patients can receive a stem cell transplant. These new stem cells will create the blood cells needed by the patient's body. There are actually multiple kinds of stem cells that scientists can use for medical treatments and research. Adult stem cells or tissue-specific stem cells are found in small numbers in most of your body's tissues.","ref":"The lecture talks about stem cells. They are undifferentiated cells without specific functions. However, they have the potential to become all other kinds of cells to replace worn-out cells. Scientists hope to use them for regenerative medicine to replace damaged tissue or organs. For example, stem cell transplants can treat patients with blood diseases like leukemia. There are multiple kinds of stem cells used for medical treatments and research. 这场讲座讲的是干细胞。它们是未分化的细胞，没有特定的功能。然而，它们有潜力变成所有其他种类的细胞，以替换衰老的细胞。科学家希望将它们用于再生医学，以替换受损的组织或器官。例如，干细胞移植可以治疗像白血病这样的血液疾病患者。目前有多种干细胞被用于医疗治疗和科学研究中。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693312/07e57124a8b949c98d1a6f9b25d0f6d4.mp3","phrases2":[{"en":"while → skin cells protect your body","zh":"虽然皮肤细胞保护你的身体"},{"en":"when → die For example you completely replace the lining","zh":"当它们死亡时，例如，你会完全替换内壁"},{"en":"for example → completely replace the lining of your intestines every four","zh":"例如，你每四天就会完全替换一次肠道内壁"},{"en":"for example → scientists currently use stem cells to treat patients with blood","zh":"例如，科学家目前使用干细胞治疗血液病患者"}]},{"id":3350,"name":"Sugar","phrases":["but → other places where you see","so → as an example: peanut butter","so → may know from the reading food labels","so → sugar comes right after peanuts","but → it’s there Now it’s down the list of ingredients","but → look at the marketing of this and food","if → look at the marketing of this and food","but → actually there’s more sugar in this than there is carrots"],"eng":"There’s sugar in a lot of foods where you don’t expect it. Of course there’s lots of sugar in donuts, ice cream, pastries, or other things that are sweet; candy of course, but there are other places where you see it and you don’t necessarily expect it. So as an example: peanut butter. Here’s a list of ingredients from Skippy Peanut Butter and you see that sugar is the second most common ingredient. Skippy So that you may know from the reading food labels that these ingredients in any food labels that are listed in order of how much there is in the food itself, so sugar comes right after peanuts. Here’s another example, Beef stew, you wouldn’t necessarily expect to find sugar in beef stew but it’s there. Now it’s down the list of ingredients, it’s actually toward the end, but if you look at the marketing of this and food at the can, it says, there’s fresh potatoes and carrots, but actually there’s more sugar in this than there is carrots. And so you wouldn’t eat something like beef stew and expect to find this to be the case.","ref":"The lecture is about sugar. There is sugar in a lot of foods where you don’t expect it. Besides, there are also other places where you see sugar and you don’t necessarily expect it. For example, sugar is the ingredient of peanut and beef stew, and you will not know this after you have read the food labels. Other food like fresh potatoes and carrots contain sugar, and you wouldn’t eat something like beef stew and expect to find this to be the case. 这堂讲座讲述的是糖。许多食物中都有糖，很多时候你并不预料到。例如，糖是花生酱和牛肉炖菜的成分之一，读了食品标签你才会知道这一点。像新鲜土豆和胡萝卜这类食物也含有糖，而你不会想到在牛肉炖菜中会发现糖的存在。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690238/6b75263b858b4b0eabd4b9f4e3686e51.mp3","phrases2":[{"en":"but → other places where you see","zh":"但还有其他地方你会看到"},{"en":"so → as an example: peanut butter","zh":"所以举个例子：花生酱"},{"en":"so → may know from the reading food labels","zh":"所以你可以通过看食品标签知道"},{"en":"so → sugar comes right after peanuts","zh":"所以糖紧跟在花生之后"},{"en":"but → it’s there Now it’s down the list of ingredients","zh":"但它就在那儿，只是现在排在配料表靠后的位置"},{"en":"but → look at the marketing of this and food","zh":"但如果你看看这个和食品的营销"},{"en":"if → look at the marketing of this and food","zh":"如果你看看这个和食品的营销"},{"en":"but → actually there’s more sugar in this than there is carrots","zh":"但实际上，这里面的糖比胡萝卜还多"}]},{"id":3367,"name":"Superhuman","phrases":["when → in the face of disaster","but → we're going to take a fact-based look at whether or"],"eng":"Today we're going to recount heroic tales of superhuman feats of strength, when in the face of disaster, some people are said to have summoned up incredible physical power to lift a car off of an accident victim, move giant rocks, or like Big John of song, single-handedly hold up a collapsing beam to let the other miners escape. Are such stories true? There are many anecdotes supporting the idea, but we're going to take a fact-based look at whether or not it truly is possible for an adrenalin-charged person to temporarily gain massive strength. In proper terminology, such a temporary boost of physical power would be called hysterical strength. The majority of them are anecdotal, and interestingly not repeatable; in many cases, the person who summoned the superstrength later tried it again only to find that they couldn't do it. Basically, what we have is a respectably large body of anecdotal evidence that suggests that in times of crisis, danger, or fear, some people have the ability to temporarily exercise superhuman strength.","ref":"The lecture mainly talks about superhuman strength. It is said that some people have incredible power to lift a car or move giant rocks when facing disaster. There is a heated debate on whether these stories are true. According to a large body of anecdotal evidence, in a time of crisis or fear, it is possible for a person to temporarily gain massive strength, but late they couldn’t do it again. 这个讲座主要讲超人的力量。据说，有些人在面对灾难时，有不可思议的力量举起汽车或移动巨大的岩石。关于这些故事是否真实存在着激烈的争论。根据大量的轶事证据，在危机或恐惧的时候，一个人有可能暂时获得巨大的力量，但后来他们就不能再这样做了。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690258/2a7f252f738c42ba9331e470146dad42.mp3","phrases2":[{"en":"when → in the face of disaster","zh":"当面对灾难时"},{"en":"but → we're going to take a fact-based look at whether or","zh":"但我们要基于事实来看是……还是……"}]},{"id":3351,"name":"Taxonomy","phrases":["so → for instance a good way to think about taxonomy is","for instance → a good way to think about taxonomy is the US","if → want to send a letter to someone","but → to be a treat in England or","so → for instance South","for instance → be the same as a phylum","finally → their first name to the specific person you want"],"eng":"Welcome to today's lesson. We're continuing with our study of taxonomy. Taxonomy is how scientists classify organisms into different groups based on the characteristics that they share. So, for instance, a good way to think about taxonomy is the US Postal Service. If we want to send a letter to someone, we first start off by addressing it to the nation they are in. By default, we usually assume that's America but it doesn't have to be a treat in England or Costa Rica or Spain. You put their nation or their kingdom. Then within that kingdom, you address it to a slightly more specific level, their states. So, for instance, South Carolina would be the same as a phylum. “ ” And within that state, you would address it to their city and then to their street number, the street they live on. Then you would address it to say their apartment complex and within that complex, you'd address it by their last name to their family and then finally their first name to the specific person you want to get it to. And in that way we're able to weed out all the 400 million people we don't want to send our letter to in America and pinpoint the exact person we want the letter to reach. And in the same way, scientists use a taxonomy chart to pinpoint a living creature and organism and how it relates to everything else in the world.","ref":"The lecture is about taxonomy. Taxonomy is how scientists classify organisms into different groups based on the characteristics that they share. An example is the US Postal Service. In this service, people can address it to a specific level, to their city and then to their street number. And in the same way, scientists use a taxonomy chart to pinpoint a living creature and organism and how it relates to everything else in the world. 这堂讲座讲述的是分类学。分类学是科学家根据有共同特征的生物将它们分入不同的组别。例如，美国邮政服务就是一个例子。在这个服务中，人们可以按照一定的层级来寄信，先是地址到所在的城市，然后到具体的街道号码。同样，科学家使用分类学图表来精确定位生物和有机体，并了解它们与世界上其他事物的关系。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690239/dad3f696ada3470399597876bb175165.mp3","phrases2":[{"en":"so → for instance a good way to think about taxonomy is","zh":"所以，例如，思考分类学的一个好方法是"},{"en":"for instance → a good way to think about taxonomy is the US","zh":"例如，思考分类学的一个好方法是美国"},{"en":"if → want to send a letter to someone","zh":"如果我们想给某人寄一封信"},{"en":"but → to be a treat in England or","zh":"但在英格兰，它不一定是一种款待，或者"},{"en":"so → for instance South","zh":"所以，例如，南卡罗来纳州就相当于一个"},{"en":"for instance → be the same as a phylum","zh":"例如，南卡罗来纳州就相当于一个门"},{"en":"finally → their first name to the specific person you want","zh":"最后，是你要找的那个特定人的名"}]},{"id":3372,"name":"Teaching","phrases":["so → can teach 60 Of course","but → I've always considered the end the result","when → one really succeeded in unifying theory that can help us"],"eng":"All of my research and that I conducted was my 60 plus graduate students, was motivated by their need to learn, so that we can teach. 60 Of course, in some inventions happened along the way but I've always considered the end the result. And I always consider that this invention to be byproduct, byproducts of the learning process. The end product for me was always better understanding or when one really succeeded in unifying theory that can help us in teaching the subject. I've also looked at teaching as a vehicle to try new ideas, of new ways to doing things on an intelligent group of learners. That is as the vehicle for the teaching-research results. And in my experience, this kind of teaching is the most stimulated and motivating to students. I am also uncovered many interesting research problems is the cause of teaching subject. It is this unity of research and teaching their close connection and the benefits gathered by exercising and the interplay that to be characterised the successful professor.","ref":"This lecture is about teaching and learning. Firstly, teaching is motivated by students' needs of learning. Secondly, it is important to consider the result and byproducts of the learning process. Thirdly, new ideas can stimulate and motivate students. Finally, the unity of research and teaching close connection, exercising as well as interplay help speaker become a successful professor. 这个讲座是关于教与学的。首先，教学的动机是学生的学习需要。其次，重要的是要考虑学习过程的结果和副产品。第三，新的想法可以刺激和激励学生。最后，科研与教学的结合、紧密的联系、锻炼与互动有助于演讲者成为一名成功的教授。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690263/fdb1c52d74b84380a86a3cad88265de4.mp3","phrases2":[{"en":"so → can teach 60 Of course","zh":"这样我们就能教60了，当然"},{"en":"but → I've always considered the end the result","zh":"但我一直认为目的就是结果"},{"en":"when → one really succeeded in unifying theory that can help us","zh":"当一个人真正成功统一了能帮助我们（的）理论时"}]},{"id":1578,"name":"Technology erode privacy","phrases":["so → creates tensions and that's what I want to talk","because → I think it’s important we are as a society able","but → not too much how much security is enough but not","but → not too much","for example → This process isn’t going to slow down and the new","so → some of the new quantum technologies are able already"],"eng":"So that creates tensions and that's what I want to talk about. Because I think it’s important we are as a society able to have an informed debate about how much privacy is enough but not too much, how much security is enough but not too much. Privacy is a human right that simply quoting the Universal Declaration. In the physical world, we’ve got all kinds of protections. There is evidence that we care about our privacy: we’ve got doors, we’ve got obscured glass, we’ve got locks, we wear clothes, we put up shutters. And technology continues to erode the privacy that exists in the real world in the three spatial dimensions. Security cameras, automatic number plate recognition take away anonymity. Long lenses paparazzi take away distance and the privacy that used to create. And body scanners are increasingly being used to see through clothes, for example. This process isn’t going to slow down and the new quantum technologies are actually being able to do gravitational sensing and that’s advancing at a remarkable rate and you can’t shield gravity. So some of the new quantum technologies are able already to see through walls and will, and there are technologies also for seeing round corners now using scattered light from lasers. Technology continues to erode privacy.","ref":"This lecture is about tensions between technology and privacy and as a society we need to argue about the amount of privacy and security we have. Firstly, privacy is a human right, which we care about, and we have many protections. Secondly, however, technology continues to erode privacy in three spatial dimensions, including security cameras, long lenses and body scanners. Thirdly, this process won’t slow down because of the quantum technologies. In conclusion, technology continues to erode our privacy. 这一讲座讨论了技术与隐私之间的紧张关系，作为一个社会，我们需要讨论我们拥有的隐私和安全的程度。首先，隐私是我们关心的人权，我们拥有许多保护措施。其次，然而，技术在三个空间维度上持续侵蚀隐私，包括监控摄像头、长焦镜头和身体扫描仪。第三，这一进程不会因量子技术而放缓。总结来说，技术继续侵蚀我们的隐私。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678151/41d4181bbe9246e8a6de1ab07b59d315.mp3","phrases2":[{"en":"so → creates tensions and that's what I want to talk","zh":"所以这会产生紧张关系，而这正是我想谈的"},{"en":"because → I think it’s important we are as a society able","zh":"因为我认为，作为一个社会，我们能够……这一点很重要"},{"en":"but → not too much how much security is enough but not","zh":"但不能太多——多少安全才算足够，而又不过多"},{"en":"but → not too much","zh":"但不能太多——隐私是一项人权，它只是……"},{"en":"for example → This process isn’t going to slow down and the new","zh":"例如，这一进程不会放缓，而新的……"},{"en":"so → some of the new quantum technologies are able already","zh":"所以一些新的量子技术已经能够……"}]},{"id":3359,"name":"The politics of happiness","phrases":["but → are now beginning to get other countries interested enough","if → used it more for public policy","so → is beginning to become a subject of greater interest"],"eng":"As Joanne pointed out, only one country, tiny little Bhutan, wedged between China and India,has adopted the Gross National Happiness as the central index of government policy, and actually has a good deal of success in education and in health and in economic growth and in environmental preservation. They have a rather sophisticated way of measuring the effects of different policies on people's happiness. They are the only country to go that far. But you are now beginning to get other countries interested enough to do kind of white paper policy analyses of happiness research what effects would it have if we used it more for public policy? You are beginning to get countries like Australia, France, Great Britain, that are considering publishing regular statistics on happiness. So it is beginning to become a subject of greater interest for policymakers and legislators in different advanced countries.","ref":"More countries are becoming interested in happiness research for policy making. Governments are exploring how public policies might change if they used happiness as an important measurement. Several developed nations including Australia, France and Britain are taking concrete actions by planning to regularly publish official happiness statistics. This development indicates that happiness is gradually becoming a significant consideration for policymakers in advanced economies, potentially shaping future governance approaches. 当前越来越多的国家开始将幸福研究纳入政策制定考量。各国政府正在探索，若将幸福感作为重要衡量指标，公共政策应如何相应调整。澳大利亚、法国和英国等发达国家已付诸实际行动，计划定期发布国民幸福指数官方统计。这一发展趋势表明，在发达经济体的政策制定过程中，幸福度正逐渐成为关键考量要素，未来可能深刻影响治理模式的变革。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690249/bd16521835364c6f93661e5460d6f0e1.mp3","phrases2":[{"en":"but → are now beginning to get other countries interested enough","zh":"但你现在开始让其他国家产生足够的兴趣"},{"en":"if → used it more for public policy","zh":"如果我们把它更多地用于公共政策"},{"en":"so → is beginning to become a subject of greater interest","zh":"因此，它正开始成为一个更受关注的话题"}]},{"id":4283,"name":"Thermodynamics and kinetic theory","phrases":["so → quickly some of these ideas","so → forth","if → matter consists of atoms in random motion and that's what","but → can be violated during unusual times"],"eng":"Coming out of the 19th century with all that happened and so quickly, some of these ideas, some of these theories like thermodynamics and kinetic theory, they didn't blend the way they should have. 19 Thermodynamics has its roots in matter how material things respond to heat and temperature and so forth. The laws of thermodynamics were thought to be absolute. Now take kinetic theory: if matter consists of atoms in random motion and that's what matter is, then you open up the possibility that there will be fluctuations in samples of matter such that the laws of thermodynamics can momentarily be violated. Are the laws of thermodynamics valid absolute? Are they obeyed statistically? On average they're obeyed but they can be violated during unusual times, all right?","ref":"After the 19th century, thermodynamics and kinetic theory didn’t blend properly. Thermodynamics has its roots in how material things respond to heat and temperature, whose laws were thought to be absolute. But kinetic theory states matter consists of atoms in random motion, creating fluctuations where thermodynamics laws can be violated. This raises questions. The lecture concludes thermodynamics laws are obeyed on average but can be violated during unusual fluctuations. 19世纪以后，热力学与动力学理论未能很好地融合。热力学源于物质对热量和温度的响应，其定律曾被认为是绝对的。但动力学理论认为，物质由处于随机运动中的原子组成，这种运动会产生涨落，使得热力学定律在某些情况下可能被打破。这引发了一系列问题。讲座最后指出，热力学定律总体上是成立的，但在异常涨落期间可能被暂时违反。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693313/0986b6b1b368425f9689bf06e03fe3ae.mp3","phrases2":[{"en":"so → quickly some of these ideas","zh":"很快，其中一些想法就……"},{"en":"so → forth","zh":"诸如此类。热力学定律曾被认为是绝对的"},{"en":"if → matter consists of atoms in random motion and that's what","zh":"如果物质由随机运动的原子构成，而这就是……"},{"en":"but → can be violated during unusual times","zh":"但在特殊时期，它们可能会被违背"}]},{"id":1587,"name":"Three principles","phrases":["so → to become equal to everybody","but → in fact make those who are most","while → make our city more competitive because sometime","but → equity means that you do not in fact take advantage"],"eng":"From reading philosophy, I came up with three principles as the guiding principles for a just city, of the principles of equity, democracy, and diversity. Of these were derived from the works of a number of philosophers, most preeminently I supposed on Ross. Ross My choice of word equity rather than equality is in fact based on Ross's argument that a policy ought to distribute benefits to people where the worst off become better off. “ ” equity “ ” equality So the worst off don't have to become equal to everybody else but no policy should in fact make those who are most disadvantaged, more disadvantaged. And it means that we have to talk about the policy at the time it's being enacted. To say, while we have to make our city more competitive because sometime and by and by, the benefits will trickle down to those people who were worst off doesn't justify making them worst off at that time. “ ” We have a lot of examples in the world of people whose homes were destroyed in the name of the greater good and say eventually they will benefit. “ ” But equity means that you do not in fact take advantage of those people who are weakest. “ ”","ref":"The lecture talks about equity. That is one of the guiding principles for a just city. According to the lecture, his choice of word equity is in fact based on Ross's argument that a policy ought to distribute benefits to people where the worst off become better off. In addition, we have to talk about the policy at the time it's being enacted, and equity means that you do not in fact take advantage of those people who are weakest. 这一讲座讲述了公平，这是一个公正城市的指导原则之一。根据讲座，演讲者选择使用“公平”这个词实际上是基于罗斯的论点，即政策应当分配利益，使得最处于困境的人变得更好。此外，我们还需要讨论政策实施时的情况，而公平意味着你不能利用那些最弱势的人群。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678137/e8700bf2ff264ab190f0d27487a7e279.mp3","phrases2":[{"en":"so → to become equal to everybody","zh":"所以，处境最差的人不必变得与所有人平等"},{"en":"but → in fact make those who are most","zh":"但事实上，任何政策都不应让那些最……的人"},{"en":"while → make our city more competitive because sometime","zh":"尽管我们必须让城市更具竞争力，因为有时……"},{"en":"but → equity means that you do not in fact take advantage","zh":"但公平意味着你实际上并不占便宜"}]},{"id":1577,"name":"Three stages of brain development V2","phrases":["so → have parts of the brain that are involved more","so → emotionally kind of well put together","if → emotionally kind of well put together","if → preoccupied with fears or anxiety or is"],"eng":"The brain is basically built from the bottom up. 大脑的构建过程基本上是自下而上的。 First, the brain builds basic circuits that are responsible for basic skills. 首先，大脑构建出负责基本技能的基本神经回路。 And then more complex circuits are built on top of those basic circuits as we develop more complex skills. 随着我们掌握更复杂的技能，更高级的神经回路会在这些基础回路之上逐步形成。 Biologically, the brain is prepared to be shaped by experience. 从生物学角度来看，大脑天生具备被经验塑造的特质。 It's expecting the experiences that a young child has to literally influence the formation of its circuitry, it's built into our biology. 幼儿期的经历直接影响神经回路的形成，这种机制已深植于我们的生物属性之中。 The interaction between genetics and experience that shapes brain architecture is embedded in the reciprocal relationship, the relationships that children have with the adults in their lives. 基因与经验之间的相互作用塑造了大脑的结构，这种关系嵌入在儿童与其生活中的成人之间的互惠关系中。 And by that, we mean what we refer to as the serve-and-return nature of children's interaction with their adults development and the impact of experience on development is not a one-way street, it's a back-and-forth interaction. 我们指的就是“服务与回应”这一概念，即儿童与成人的互动发展，经验对发展的影响不是单向的，而是相互作用的过程。 The brain is a highly integrated organ which has multiple sections that specialized in different kinds of processes. 大脑是一个高度集成的器官，具有多个专门化处理不同类型过程的区域。 So we have parts of the brain that are involved more in cognitive function and other parts that are involved in processing emotion and parts involved in seeing and hearing. 因此，大脑有一些部分主要负责认知功能，其他部分则负责情感处理，还有一些部分与视觉和听觉相关。 So, if a child is emotionally kind of well put together and socially competent, that will affect more positive and productive learning. 所以，如果一个孩子情感上很稳定，且具备社交能力，那么这将促进更加积极和富有成效的学习。 And if a child is preoccupied with fears or anxiety or is dealing with considerable stress, no matter how intellectually gifted that child might be, his or her learning is going to be impaired by that kind of emotional interference. 如果一个孩子充满恐惧、焦虑或正在经历巨大的压力，那么不论这个孩子有多么聪明，他或她的学习都会因为情感上的干扰而受到影响。","ref":"The lecture is about brain. The brain builds basic circuits that are responsible for basic skills and it is prepared to be shaped by experience. The interaction between genetics and experience that shapes brain architecture is embedded in the reciprocal relationship, the relationships that children have with the adults in their lives. In addition, the brain has multiple sections and the sections relate to cognitive function, the process of emotion and involve in scene and hearing. 这一讲座讲述了大脑。大脑构建了负责基本技能的基础神经回路，并且为经验的塑造做好准备。遗传和经验之间的互动塑造大脑结构，这一过程嵌入在儿童与生活中成人之间的相互关系中。此外，大脑有多个区域，这些区域与认知功能、情感处理以及视觉和听觉等过程相关联。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678150/69d7d884c9c8453685a45e932c27196c.mp3","phrases2":[{"en":"so → have parts of the brain that are involved more","zh":"所以，大脑中有些部分参与得更多"},{"en":"so → emotionally kind of well put together","zh":"所以，如果一个孩子在情绪上还算稳定"},{"en":"if → emotionally kind of well put together","zh":"如果一个孩子在情绪上还算稳定"},{"en":"if → preoccupied with fears or anxiety or is","zh":"如果一个孩子满脑子恐惧或焦虑，或者"}]},{"id":1573,"name":"Three types of questionnaires","phrases":["when → analyzing my own questionnaires However","however → before I begin it would be useful to remind","when → talking about questionnaires","when → participants select from a list of categories for their response","but → instead of the categories being independent","instead → of the categories being independent","if → ask people to indicate their age in categories"],"eng":"What I've decided to provide is the steps that I take when analyzing my own questionnaires. However, before I begin, it would be useful to remind you of a few terms we use when talking about questionnaires. Questions can be divided into three types. This is sometimes called level measurement. Firstly, we have category-type questions, which are also known as nominal questions. These are when participants select from a list of categories for their response, such as male or female or they may include ethnic origin. Secondly, we have ordinal-type questions. These are similar to category questions. But instead of the categories being independent, there is some sort of order between them. If we ask people to indicate their age in categories, this is an ordinal type question. Thirdly, we have continuous questions. These are any questions that can be answered by a number. It could be an open-ended question asking participants to tell you how many times they attended lectures or how often they used a VLE. VLE Or it could involve asking them to rate the importance or intensity of some experience.","ref":"In the questionnaires, questions can be divided into three types, called level measurement. Firstly, we have category type questions. It means participants select from a list of categories for their response. Secondly, we have ordinal type questions. These are similar to category questions, but there is some sort of order between them. Thirdly, we have continuous questions. These are any questions that can be answered by a number. 在问卷调查中，问题可以分为三种类型，称为测量等级。首先，我们有类别型问题。这意味着参与者从一系列类别中选择他们的回答。其次，我们有顺序型问题。这些问题与类别型问题相似，但选项之间存在某种顺序关系。第三，我们有连续型问题。这些问题是任何可以通过数字回答的问题。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678147/c33aa756f07348dc84850d29451ee2d3.mp3","phrases2":[{"en":"when → analyzing my own questionnaires However","zh":"然而，在分析我自己的问卷时"},{"en":"however → before I begin it would be useful to remind","zh":"不过，在开始之前，有必要提醒"},{"en":"when → talking about questionnaires","zh":"谈到问卷时，问题可分为三类"},{"en":"when → participants select from a list of categories for their response","zh":"当参与者从一系列类别中选择作答时"},{"en":"but → instead of the categories being independent","zh":"但类别并非相互独立"},{"en":"instead → of the categories being independent","zh":"而非类别相互独立"},{"en":"if → ask people to indicate their age in categories","zh":"如果我们让人们按年龄段来表明年龄"}]},{"id":2554,"name":"Tobacco","phrases":["however → is against this and they in particular argue that the","since → the 1950s and just analyze the images and looked","however → as you move through the decades and get closer","so → a smoker takes a box out of their pocket","when → a smoker takes a box out of their pocket","so → come out of this is"],"eng":"Over the past few months, the government has been pushing to remove all advertising outlets for the tobacco industry, and in particular pushing for plain packaging. The tobacco industry, however, is against this and they in particular argue that the cigarette box is not a form of advertising. Michaela has been doing her Ph.D. looking at cigarette advertising and how it's changed over the last 50 years. 50 Basically, I've accessed advertising from the tobacco industry since the 1950s and just analyze the images and looked at the use of the cigarette box within the adverts. 20 50 In the very early adverts, the cigarette box is a very small part of the adverts and they focus much more on the social aspects of smoking. However, as you move through the decades and get closer to the present day, the cigarette box became more and more of a focal point in the adverts. My argument is that the cigarette box has actually become iconic to each brand. So when a smoker takes a box out of their pocket, they are actually advertising that brand. So what we hope will come out of this is that the government will introduce plain packaging. And like Australia which has already introduced its policy and Ireland which is again beginning to introduce its policy, we hope that the UK will stop cigarette companies from using their box as a form of advertising.","ref":"The lecture talks about cigarette advertising. According to the lecture, over the past few months, the government has been pushing to remove all advertising outlets for the tobacco industry, and in particular pushing for plain packaging. The tobacco industry argues that the cigarette box is not a form of advertising, while the speaker believes that the cigarette box has actually become iconic to each brand. So she hopes that the government will introduce plain packaging, and the UK will stop cigarette companies from using their box as a form of advertising. 讲座讨论了香烟广告问题。根据讲座内容，过去几个月来，政府一直在推动取消烟草行业的所有广告渠道，特别是推行统一包装（plain packaging）。烟草行业认为香烟盒本身并不是一种广告形式，但主讲人则认为，香烟盒实际上已经成为各个品牌的重要标志。因此，她希望政府能推行统一包装政策，从而在英国阻止烟草公司利用烟盒作为广告手段。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678140/c9f68c45e69046d2a1a9e01404e04e61.mp3","phrases2":[{"en":"however → is against this and they in particular argue that the","zh":"然而有人反对这一点，他们尤其认为"},{"en":"since → the 1950s and just analyze the images and looked","zh":"自20世纪50年代以来，仅分析图像并进行观察"},{"en":"however → as you move through the decades and get closer","zh":"然而，随着年代推移并越来越接近"},{"en":"so → a smoker takes a box out of their pocket","zh":"所以，当吸烟者从口袋里掏出一盒烟时"},{"en":"when → a smoker takes a box out of their pocket","zh":"当吸烟者从口袋里掏出一盒烟时"},{"en":"so → come out of this is","zh":"所以，我们希望由此得出的是"}]},{"id":3375,"name":"Trade-offs triangle","phrases":["in order to → cut poverty without damaging the biodiversity","if → want to protect the biodiversity","but → do that you run the risk of hurting","if → do that you run the risk of hurting the"],"eng":"Well, it's about whether you can achieve a win-win solution, whether you can achieve economic growth which brings wealth in order to cut poverty without damaging the biodiversity. And the argument is that if you want to protect the biodiversity, you have to focus on that as a goal, but if you do that, you run the risk of hurting the poor and you also run the risk of inconvenience and reducing the economic growth. We use the developed and industrialized countries to see this argument this axis argues about.. We let us say, a government wishing to start drilling for oil in place X, which is for the wildlife under wildlife conservation society, urging them not to on the grounds that it's a wilderness. X","ref":"Poor people should not pay the price for the biodiversity protection. There is a debate about whether you can keep economic growth which can solve the poverty issues without damaging biodiversity. The answer is that it is impossible to reach a win-win solution among conservation, development and poverty. If you set bio-diversity as your goal, you run the risk of hurting the poor and the economy. 穷人不应该为保护生物多样性付出代价。人们争论的焦点是，能否在不破坏生物多样性的情况下保持经济增长，从而解决贫困问题。答案是不可能在保护、发展和贫困之间达成双赢的解决方案。如果把生物多样性作为目标，就有可能伤害穷人和经济。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690266/ba1310fd58114f1cb9d3901e2515f846.mp3","phrases2":[{"en":"in order to → cut poverty without damaging the biodiversity","zh":"为了在不破坏生物多样性的情况下减少贫困"},{"en":"if → want to protect the biodiversity","zh":"如果你想保护生物多样性"},{"en":"but → do that you run the risk of hurting","zh":"但如果你那样做，就有可能伤害"},{"en":"if → do that you run the risk of hurting the","zh":"如果你那样做，就有可能伤害到"}]},{"id":1579,"name":"Tutorial","phrases":["when → come into the tutorial we are put into small","so → can ask questions at any time","if → need help before the tutorial","whereas → about 5 to 15 students"],"eng":"My name is Evie Carroll. Evie Carroll I’m a second year studying international business. My degree subject is made up of tutorials, lectures and independent learning. And today I’m going to speak about tutorials. Before each tutorial, we’re asked to prepare in advance. We’re usually given a reading list, which we have to complete before each tutorial. We are given websites to look at, each annals to look at and we have to prepare by writing our notes down. In every tutorial, there is about 5 to 15 students and these are led by the tutors which are usually masters or PhD students. 5 15 And then when we come into the tutorial we are put into small groups. I’m asked to discuss our ideas, generate new ideas and then feedback to the class. During our tutorials, there’s lots of support given. Our tutors are there so that we can ask questions at any time. We also have our peers there, to which we can also ask questions. If we need help before the tutorial, we can email any of the tutors and they’ll provide you with help. The difference between lectures and tutorials is that in lectures you usually have about 200 to 300 students whereas in tutorials are about 5 to 15 students, 200 300 5 15 which allows you to discuss matters, put your hands up and talk to your tutors about any difficulties you may have with a subject.","ref":"The general topic of this lecture is about tutorials. Firstly, the speaker mentioned that students were asked to prepare tutorials in advance by giving them a reading list. Then the speaker said that students are led by tutors, who are usually master or PhD students. Finally, the speaker mentioned that the difference between lectures and tutorials is that the size of tutorial is relatively small, which is usually about 5 to 15 students. 这一讲座的主题关于辅导课。首先，讲者提到学生们被要求提前准备辅导课，通过提供阅读清单来进行准备。接着，讲者表示，辅导课是由导师带领的，通常导师是硕士或博士生。最后，讲者提到，讲座和辅导课的区别在于辅导课的规模相对较小，通常有5到15个学生。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678152/36c7598f05c344acab1231ff490628c4.mp3","phrases2":[{"en":"when → come into the tutorial we are put into small","zh":"进入辅导课时，我们会被分成小组"},{"en":"so → can ask questions at any time","zh":"这样我们就能随时提问"},{"en":"if → need help before the tutorial","zh":"如果我们在辅导课前需要帮助"},{"en":"whereas → about 5 to 15 students","zh":"而辅导课上大约有5到15名学生"}]},{"id":1602,"name":"Typography","phrases":["so → read it easily and it looks attractive","so → want to read","when → first see a document","but → couldn't read any of the text because it contained words","because → contained words which don't actually exist","despite → still make important decisions based on how","if → in lots of different colors"],"eng":"Typography is the art and technique of arranging letters and text on a page so that readers can read it easily and it looks attractive. So people want to read it. Why does typography matter? Well, we live in a visual world, we're used to figuring out the aim of a document by looking at its style and appearance even before we start reading it. Whenever we see a document, we form an immediate judgment. We're experts at doing this. Recent research into readers' responses to different types of print designs has revealed some common assumptions readers make when they first see a document. Subjects were presented with carefully designed pages, but couldn't read any of the text because it contained words which don't actually exist. Despite this, they could still make important decisions based on how the information was presented. They quickly decided how accurate the content was and a possible use of the document. They also looked at the boxes of texts and images to decide how serious the text might be. If the text boxes were in lots of different colors, shapes and sizes, then these were related to negative qualities. These results confirm that readers respond to how something is designed as soon as they see it.","ref":"Typography is about how you organize letters and text on a page. The aim is to do this so that it's easy to read and looks nice. A typography is important because we're very good at looking at the style and appearance of a document and making judgments about its purpose. This a research has provided proof of this. People were given pages written using invented words. Although they couldn't understand the content, they were still able to make judgments about the quality of the information from how it was presented in the document. 排版是关于如何在页面上组织字母和文本。目的是这样做，以便它易于阅读并且看起来漂亮。排版很重要，因为我们非常擅长查看文档的风格和外观，并对其目的做出判断。这项研究为此提供了证据。人们被给予用虚构的词语书写的页面。尽管他们无法理解内容，但他们仍然能够根据信息在文档中的呈现方式来判断信息的质量。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658429/7d2172a86cfa4e2c88753003c6141f5c.mp3","phrases2":[{"en":"so → read it easily and it looks attractive","zh":"让读者读起来轻松，而且看起来吸引人"},{"en":"so → want to read","zh":"让人们愿意读"},{"en":"when → first see a document","zh":"当他们第一次看到文档时"},{"en":"but → couldn't read any of the text because it contained words","zh":"但因为里面有文字，读不了任何文本"},{"en":"because → contained words which don't actually exist","zh":"因为它包含实际并不存在的单词"},{"en":"despite → still make important decisions based on how","zh":"尽管如此，他们仍能根据其如何……做出重要决定"},{"en":"if → in lots of different colors","zh":"如果文本框有多种不同颜色"}]},{"id":1585,"name":"Universal philosophy","phrases":["so → the big benefit of a universal philosophy","because → are humans “ ” Now","because → specified at a very thin level","but → lots of things about football that aren't rules","so → different from Italian football","but → these universal general rules to apply"],"eng":"Okay. So this is the big benefit of a universal philosophy. It says it applies to everybody. Well, looks that doesn't, you know, 205 or 206 countries in the world. And you've got something that applies to everybody. That's a bit strange, isn't it? 205 206 No, says liberal theory. There are some value structures that apply to all of us. “ ” “ ” You couldn't have the United Nations without it. It couldn't tell you that the Universal Declaration of Human Rights without this idea of values that apply to all of us just because we are humans. “ ” Now, the idea is to test that as well. Why is sport universal? Why does everybody play football? It's because the values are specified at a very thin level at the top. There are these rules and we all have to abide by just these rules. But there are lots of things about football that aren't rules specified. So Brazilian football is different from Italian football, from British football, from German football, from Spanish football. It's culturally specific, but acknowledges that there are these universal general rules to apply to everybody.","ref":"The lecture talks about a universal philosophy. According to the lecture, there are some value structures that apply to all of us. Now, the idea is to test that as well. Sport is universal because the values are specified at a very thin level at the top. There are these rules and we all have to abide by just these rules. But there are lots of things about football that aren't rules specified. In conclusion, there are these universal rules to apply to everybody. 这一讲座讲述了关于普遍哲学的内容。根据讲座，有一些价值结构适用于我们所有人。现在，研究的目标是验证这一点。体育是普遍的，因为其价值观在顶层有非常明确的规定。有这些规则，我们所有人都必须遵守这些规则。但是，足球中有很多方面并没有明确的规则。总之，存在一些普遍适用于每个人的基本规则。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658439/4841ef77930c4700bc7bcd5e99ecfac6.mp3","phrases2":[{"en":"so → the big benefit of a universal philosophy","zh":"所以这就是普世哲学的一大好处"},{"en":"because → are humans “ ” Now","zh":"因为我们是人类“ ”现在"},{"en":"because → specified at a very thin level","zh":"因为这些价值是在非常细微的层面被规定的"},{"en":"but → lots of things about football that aren't rules","zh":"但足球有很多方面并不是规则"},{"en":"so → different from Italian football","zh":"所以巴西足球不同于意大利足球"},{"en":"but → these universal general rules to apply","zh":"但也承认有这些普遍通用规则可以适用"}]},{"id":3363,"name":"Venus","phrases":["so → looking at the planet Venus","but → wasn't completely disproved 56 this idea of a really","when → done at Venus","so → Mariner four and Mariner five confirmed the feeling from an","but → extremely hot and and also that the clouds were made","so → there wasn't a nice water cycle like is going","so → wait for these in situ measurements","so → Venus turned out not to be quite as Earth like"],"eng":"There is a picture, sort of artist's impression, before the space age of what Venus might be like on its surface and so this was looking at the planet Venus, it was science fiction and science fact all the way up to 56 before the start of the space age but it wasn't completely disproved, 56 this idea of a really sort of lush environment on Venus until 1967, which is when the first measurements in detail were done at Venus. 1967 So Mariner four and Mariner five confirmed the feeling from an earlier space mission that in fact the surface of Venus was not like this at all, but extremely hot and, and also that the clouds were made of sulfuric acid so there wasn't a nice water cycle like is going on in this picture and so, that it had to wait for these in situ measurements by space craft to actually do that and so Venus turned out not to be quite as Earth like as we thought and I'll sort of tell you about some of the latest results from Venus Express, which, which they actually there are some Earth like features, but to a large extent, it's not like the Earth. “ ” Okay, so a brief comparison between.","ref":"The lecture discusses how our understanding of Venus evolved from science fiction to scientific reality. Before the space age, people imagined Venus as a lush, Earth-like planet. However, in 1967, NASA’s Mariner 4 and 5 missions revealed its true nature: extreme heat and sulfuric acid clouds, making it uninhabitable. These findings disproved earlier assumptions. Recent data from the Venus Express mission shows some Earth-like features, but Venus remains vastly different from our planet. 讲座讨论了我们对金星的理解是如何从科幻小说演变成科学现实的。在太空时代之前，人们把金星想象成一个郁郁葱葱的类地行星。然而，在1967年，美国宇航局的水手4号和5号任务揭示了它的真实性质：极端的高温和硫酸云，使它不适合居住。这些发现推翻了早先的假设。来自金星快车任务的最新数据显示了一些类似地球的特征，但金星与我们的星球仍然有很大的不同。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690254/bbd432fe383e455b81bc64a8023dd8d1.mp3","phrases2":[{"en":"so → looking at the planet Venus","zh":"所以这是在观测金星"},{"en":"but → wasn't completely disproved 56 this idea of a really","zh":"但这并没有完全推翻这个……的想法"},{"en":"when → done at Venus","zh":"当首次在金星进行详细测量时"},{"en":"so → Mariner four and Mariner five confirmed the feeling from an","zh":"所以水手4号和水手5号证实了来自……的印象"},{"en":"but → extremely hot and and also that the clouds were made","zh":"但（它）极其炽热，而且云层是由……构成的"},{"en":"so → there wasn't a nice water cycle like is going","zh":"所以没有像……那样良好的水循环"},{"en":"so → wait for these in situ measurements","zh":"所以它只能等待这些原位测量"},{"en":"so → Venus turned out not to be quite as Earth like","zh":"所以事实证明，金星并不那么像地球"}]},{"id":3373,"name":"Wilson","phrases":["but → a world before the division between the brows"],"eng":"Wilson came from a different world. And he became the focal point of a board mainstream. American culture that thought that modern literature and wanted modern literature to be able to be read and appreciated by ordinary people. They were not modernists in an abstract sense. And certainly, some of them like TS Eliot and Faulkner were too difficult for some of their writings to be read by ordinary people. ・ But this was a world before the division between the brows or between a lead or whatever had established itself as a part of our consciousness. “ ” “ ” Wilson was a major player in the successful effort of his generation to establish at the heart of American life and innovative literature that would equal the great cultures of Europe. And he knew that the great cultures of Europe were there. He was not a product of a narrow American Studies kind of training at all. He joined a high artistic standard with an openness to all experience and a belief that literature was as much of a part of life for everyone as conversation. He thought the Proust and Joyce and Yeats and Eliot could and should be read by ordinary Americans and helped that to happen. Wilson was a very various man. Over a period of almost 50 years, he was a dedicated, a literary journalist, and an investigative reporter, a brilliant memoirist, and dedicated journal keeper. 50","ref":"Wilson is a famous writer in the US, who have a profound impact on American culture. He thought modern literature should be read and appreciated by ordinary people. Although some writers’ work is difficult to read. Wilson made effort to establish American life and innovative literature, which is as equally great as Europe. He thought literature is a part of life for everyone, and encourage people to read more. 威尔逊是美国著名的作家，对美国文化产生了深远的影响。他认为现代文学应该被普通人阅读和欣赏。虽然有些作家的作品很难读。威尔逊努力建立起与欧洲同等伟大的美国生活和创新文学。他认为文学是每个人生活的一部分，并鼓励人们多读书。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690264/d0b2c20b9332455f90d3c0df2eccd2e9.mp3","phrases2":[{"en":"but → a world before the division between the brows","zh":"但这是一个尚无眉间之分的世界"}]}]},"errors":[{"part":"SST","name":"Transportation network in Paris","bad":"Paris has an extensive public transoprtation system with the metro and RER trains. The metro has 16 lines distinguished by different colors, while the RER has five lines labeled ABCDE. Trains operate from 6:00 a.m. to half past midnight. Tickets for a single journey are 1. 90 euros, or you can purchase a book of 10 tickets for 14. 50 euros. Weekly or monthly passes are offered but require a passport photo.","good":"Paris has an extensive public transportation system with the metro and RER trains. The metro has 16 lines distinguished by different colors, while the RER has five lines labeled ABCDE. Trains operate from 6:00 a.m. to half past midnight. Tickets for a single journey are 1. 90 euros, or you can purchase a book of 10 tickets for 14. 50 euros. Weekly or monthly passes are offered but require a passport photo.","type":"拼写","hint":"找出拼错的单词","diff":"Paris has an extensive public <del>transoprtation<\/del> <ins>transportation<\/ins> system with the metro and RER trains. The metro has 16 lines distinguished by different colors, while the RER has five lines labeled ABCDE. Trains operate from 6:00 a.m. to half past midnight. Tickets for a single journey are 1. 90 euros, or you can purchase a book of 10 tickets for 14. 50 euros. Weekly or monthly passes are offer ks about the relationship between innovation and invention. Firstly, the speaker mentions that people think innovation equals invention but it’s not correct. Secondly, the speaker mentions that innovation geneaates value for the world and gives people satisfaction, but the invention is an idea that does not generate value. Thirdly, the speaker mentions that innovation equals invention times commercialization. In conclusion, innovation equals to commercializing a new idea to make value. 这一讲座讨论了创新与发明之间的关系。首先，讲者提到人们认为创新等同于发明，但这是不正确的。其次，讲者提到创新为世界创造了价值并带给人们满足感，而发明本身只是一个没有产生价值的想法。第三，讲者提到创新等于发明乘以商业化。总的来说，创新是发明与商业化的结合，从而创造价值。","good":"This lecture talks about the relationship between innovation and invention. Firstly, the speaker mentions that people think innovation equals invention but it’s not correct. Secondly, the speaker mentions that innovation generates value for the world and gives people satisfaction, but the invention is an idea that does not generate value. Thirdly, the speaker mentions that innovation equals invention times commercialization. In conclusion, innovation equals to commercializing a new idea to make value. 这一讲座讨论了创新与发明之间的关系。首先，讲者提到人们认为创新等同于发明，但这是不正确的。其次，讲者提到创新为世界创造了价值并带给人们满足感，而发明本身只是一个没有产生价值的想法。第三，讲者提到创新等于发明乘以商业化。总的来说，创新是发明与商业化的结合，从而创造价值。","type":"拼写","hint":"找出拼错的单词","diff":"This lecture talks about the relationship between innovation and invention. Firstly, the speaker mentions that people think innovation equals invention but it’s not correct. Secondly, the speaker mentions that innovation <del>geneaates<\/del> <ins>generates<\/ins> value for the world and gives people satisfaction, but the invention is an idea that does not generate value. Thirdly, the speaker mentions that innovation equals invention times commercialization. In conclusion, innovation equals to commercializing a new idea to make value. 这一讲座讨论了创新与发明之间的关系。首先，讲者提到人们认为创新等同于发明，但这是不正确的。其次，讲者提到创新为世界创造了价值并带给人们满足感，而发明本身只是一个没有产生价值的想法。第三，讲者提到创新等于发明乘以商业化。总的来说，创新是发明与商业化的结合，从而创造价值。"},{"part" ","bad":"The lecture is about taxonomy. Taxonomy is how scienitsts classify organisms into different groups based on the characteristics that they share. An example is the US Postal Service. In this service, people can address it to a specific level, to their city and then to their street number. And in the same way, scientists use a taxonomy chart to pinpoint a living creature and organism and how it relates to everything else in the world. 这堂讲座讲述的是分类学。分类学是科学家根据有共同特征的生物将它们分入不同的组别。例如，美国邮政服务就是一个例子。在这个服务中，人们可以按照一定的层级来寄信，先是地址到所在的城市，然后到具体的街道号码。同样，科学家使用分类学图表来精确定位生物和有机体，并了解它们与世界上其他事物的关系。","good":"The lecture is about taxonomy. Taxonomy is how scientists classify organisms into different groups based on the characteristics that they share. An example is the US Postal Service. In this service, people can address it to a specific level, to their city and then to their street number. And in the same way, scientists use a taxonomy chart to pinpoint a living creature and organism and how it relates to everything else in the world. 这堂讲座讲述的是分类学。分类学是科学家根据有共同特征的生物将它们分入不同的组别。例如，美国邮政服务就是一个例子。在这个服务中，人们可以按照一定的层级来寄信，先是地址到所在的城市，然后到具体的街道号码。同样，科学家使用分类学图表来精确定位生物和有机体，并了解它们与世界上其他事物的关系。","type":"拼写","hint":"找出拼错的单词","diff":"The lecture is about taxonomy. Taxonomy is how <del>scienitsts<\/del> <ins>scientists<\/ins> classify organisms into different groups based on the characteristics that they share. An example is the US Postal Service. In this service, people can address it to a specific level, to their city and then to their street number. And in the same way, scientists use a taxonomy chart to pinpoint a living creature and organism and how it relates to everything else in the world. 这堂讲座讲述的是分类学。分类学是科学家根据有共同特征的生物将它们分入不同的组别。例如，美国邮政服务就是一个例子。在这个服务中，人们可以按照一定的层级来寄信，先是地址到所在的城市，然后到具体的街道号码。同样，科学家使用分类学图表来精确定位生物和有机体，并了解它们与世界上其他事物的关系。"},{"part":"RL","name":"Immigration control","bad":"The economists calculated that removing all immigration controls would double the size of the world economy or would l ps yearly, doubling yields. By 1990, IR72 improved further with advanced genetic techniques. From 1960 to 2000, these modified crops dramatically increased global food production, reducing hunger worldwide. 本次讲座解析了始于1943年的\"绿色革命\"。当时墨西哥面临粮食危机，为应对此问题，科研机构在亚洲建立了实验基地。到1962年，科学家成功培育出IR8高产水稻品种——在不使用化肥的情况下产量达到传统水稻的五倍，施用氮肥后更可增产十倍。随后问世的IR36品种兼具抗虫特性并能实现一年两熟，使产量再度翻番。至1990年，通过先进遗传技术培育的IR72品种进一步提升了作物性能。在1960至2000年间，这些改良作物推动全球粮食产量大幅增长，有效缓解了世界范围的饥荒问题。","good":"The lecture explains the Green Revolution, starting in 1943 when Mexico faced food shortages. To solve this, Research institutes were built in Asia. By 1962, they developed IR8, a highyield rice variety that produced five times more rice than traditional types without fertilizer, and ten times more with nitrogen. Later, IR36 resisted pests and allowed two crops yearly, doubling yields. By 1990, IR72 improved further with advanced genetic techniques. From 1960 to 2000, these modified crops dramatically increased global food production, reducing hunger worldwide. 本次讲座解析了始于1943年的\"绿色革命\"。当时墨西哥面临粮食危机，为应对此问题，科研机构在亚洲建立了实验基地。到1962年，科学家成功培育出IR8高产水稻品种——在不使用化肥的情况下产量达到传统水稻的五倍，施用氮肥后更可增产十倍。随后问世的IR36品种兼具抗虫特性并能实现一年两熟，使产量再度翻番。至1990年，通过先进遗传技术培育的IR72品种进一步提升了作物性能。在1960至2000年间，这些改良作物推动全球粮食产量大幅增长，有效缓解了世界范围的饥荒问题。","type":"拼写","hint":"找出拼错的单词","diff":"The lecture explains the Green Revolution, starting in 1943 when Mexico faced food shortages. To solve this, <del>Resoarch<\/del> <ins>Research<\/ins> institutes were built in Asia. By 1962, they developed IR8, a highyield rice variety that produced five times more rice than traditional types without fertilizer, and ten times more with nitrogen. Later, IR36 resisted pests and allowed two crops yearly, doubling yields. By 1990, IR72 improved further with advanced genetic techniques. From 1960 to 2000, these modified crops dramatically increased global food production, reducing hunger worldwide. 本次讲座解析了始于1943年的&quot;绿色革命&quot;。当时墨西哥面临粮食危机，为应对此问题，科研机构在亚洲建立了实验基地。到1962年，科学家成功培育出IR8高产水稻品种——在不使用化肥的情况下产量达到传   '<div style="font-size:13px;color:#98a0ae">先听音频，看着下面的词组回忆原文；再听一遍，试着用这些词组把整段说出来。</div></div>'+
  '<div class="panel"><div class="lbl" style="font-size:12.5px;color:#98a0ae;margin-bottom:6px">听力原文关键词组（按出现顺序）</div><ol class="phlist">'+item.phrases2.map(p=>'<li>'+esc(p.en)+(p.zh?'<span class=zhph>'+esc(p.zh)+'</span>':'')+'</li>').join('')+'</ol>'+
  '<div class="row" style="margin-top:6px"><button class="bigbtn ghost" id="showRef">看听力原文</button><button class="bigbtn ghost" id="showTpl">复述模板</button></div><div class="ans" id="tpl"><div class="lbl">RL 复述模板</div><div class="ref">The lecture is mainly about ______.<br><br>First, the speaker mentions that ______.<br>Second, ______.<br>Third, ______.<br><br>So, in conclusion, ______.</div><div class="lbl" style="margin-top:10px">使用顺序</div><div class="ref">1. 先听音频，不看文字<br>2. 看着关键词组记笔记<br>3. 用模板把笔记串成话<br>4. 最后再点「看听力原文」核对</div></div>'+
  '<div class="ans" id="ans"><div class="lbl">听力原文</div><div class="ref">'+esc(item.eng)+'</div></div></div>';
  document.getElementById('list').innerHTML=h;
  document.getElementById('back').onclick=()=>{if(CUR){CUR.pause()}renderList(document.getElementById('q').value)};
  document.getElementById('playBtn').onclick=function(){playAudio(item.audio,this)};
  document.getElementById('showRef').onclick=()=>document.getElementById('ans').classList.toggle('on');
document.getElementById('showTpl').onclick=()=>document.getElementById('tpl').classList.toggle('on');
}
function buildMode(item){
  var h='<span class="back" id="back">← 返回</span><div class="panel"><div class="ptitle">'+esc(item.name)+'</div>'+
  '<div class="row"><button class="bigbtn" id="playBtn">▶ 播放原文音频</button></div>'+
  '<div style="font-size:13px;color:#98a0ae">用下面全部词组，写一段完整的话（SST 写摘要 / RL 讲出来），写完点看范文对照。</div></div>'+
  '<div class="panel"><ol class="phlist">'+item.phrases2.map(p=>'<li>'+esc(p.en)+(p.zh?'<span class=zhph>'+esc(p.zh)+'</span>':'')+'</li>').join('')+'</ol></div>'+
  '<div class="panel"><textarea id="ta" placeholder="用上面的词组写成一段话..."></textarea>'+
  '<div class="row" style="margin-top:10px"><button class="bigbtn ghost" id="showRef">看参考范文</button></div>'+
  '<div class="ans" id="ans"><div class="lbl">参考范文</div><div class="ref">'+esc(item.ref)+'</div></div></div>';
  document.getElementById('list').innerHTML=h;
  document.getElementById('back').onclick=()=>{if(CUR){CUR.pause()}renderList(document.getElementById('q').value)};
  document.getElementById('playBtn').onclick=function(){playAudio(item.audio,this)};
  document.getElementById('showRef').onclick=()=>document.getElementById('ans').classList.toggle('on');
document.getElementById('showTpl').onclick=()=>document.getElementById('tpl').classList.toggle('on');
}
function fixMode(){
  if(!FIXORDER.length){FIXORDER=shuffle(D.errors.map((_,i)=>i));FIXIDX=0;}
  var e=D.errors[FIXORDER[FIXIDX]];
  var angles=[...new Set(D.errors.filter(x=>x.name===e.name).map(x=>x.type))];
  var h='<div class="counter">第 '+(FIXIDX+1)+' / '+FIXORDER.length+' 段　'+e.part+' · '+esc(e.name)+'</div>'+
  '<div class="panel"><div class="errbad">'+esc(e.bad)+'</div>'+
  '<div style="font-size:13px;color:#98a0ae;margin-bottom:8px">下面是参考范文里的一段，请把错误改过来，改完点看答案。</div>'+
  '<textarea id="ta" placeholder="写出改正后的段落..."></textarea>'+
  '<div class="row" style="margin-top:10px"><button class="bigbtn ghost" id="showAns">看答案</button><button class="bigbtn" id="next">下一段 →</button></div>'+
  '<div class="ans" id="ans"><div class="lbl">改错角度</div><div class="angle">'+angles.map(a=>'<span>'+esc(a)+'</span>').join('')+'</div>'+
  '<div class="lbl">正确段落（绿色是改动处）</div><div class="diff">'+e.diff+'</div></div></div>';
  document.getElementById('list').innerHTML=h;
  document.getElementById('showAns').onclick=()=>document.getElementById('ans').classList.add('on');
  document.getElementById('next').onclick=()=>{FIXIDX=(FIXIDX+1)%FIXORDER.length;fixMode();};
}
document.getElementById('tabs').onclick=function(e){
  if(e.target.tagName!=='BUTTON')return;
  MODE=e.target.dataset.m;
  document.getElementById('tabs').querySelectorAll('button').forEach(b=>b.className=(b.dataset.m===MODE?'on':''));
  hdr();
  if(MODE==='fix'){FIXORDER=[];fixMode();}else renderList(document.getElementById('q').value);
};
document.getElementById('subtabs').onclick=function(e){
  if(e.target.tagName!=='BUTTON')return;
  PART=e.target.dataset.p;
  document.getElementById('subtabs').querySelectorAll('button').forEach(b=>b.className=(b.dataset.p===PART?'on':''));
  renderList(document.getElementById('q').value);
};
document.getElementById('q').oninput=function(){if(MODE!=='fix')renderList(this.value)};
document.getElementById('list').onclick=function(e){
  var c=e.target.closest?e.target.closest('.card'):null; if(!c)return;
  var it=D.cards[PART].find(x=>x.id===+c.dataset.id); if(!it)return;
  if(MODE==='card')cardMode(it);else buildMode(it);
};
hdr();renderList('');
