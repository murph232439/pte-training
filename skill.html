<script>
var D={"cards":{"sst":[{"id":4451,"name":"A female novelist","phrases":["but → secretly wanting to be a novelist","when → I first started writing at the age of 30","but → I took a little detour for 10 or 12 years","but → there's this dream tucked away inside of me","finally → in the early 90s I took my deep breath"],"eng":"I have been writing non-fiction for years actually, but secretly wanting to be a novelist. When I first started writing at the age of 30, it was with the intention of writing fiction, but I took a little detour for 10 or 12 years, and write non-fiction which I absolutely have no regret about at all. 30 I think it's exactly the right thing for me to do. But there's this dream tucked away inside of me to do this. Now I was remembering reading something that wrote, who is a great novelist from Mississippi who had a big influence on me actually. She said, \"no art ever came out of not risking your neck.\" “ ” And I think she's absolutely right about that. It felt that way to me at the time; it actually feels that way every time I sit down to write something. Finally, in the early 90s, I took my deep breath and started writing fiction. 90 It felt risky to me at the time to do that. And one of the very first things that I wrote was, what I thought was going to be the first chapter of a novel, called \"The Secret Life of Bees.\" I wrote it in 1992, and it is actually essentially the first chapter of the novel as it is now. 1992","ref":"The speaker shares her personal journey from writing non-fiction to fulfilling her dream of becoming a novelist. Inspired by the belief that true art requires taking risks, she finally began writing fiction in the early 1990s. As a result, she drafted the first chapter of her acclaimed novel, \"The Secret Life of Bees,\" in 1992, which remains largely unchanged in the final published version.","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693679/72316ba707434484812af152cc66af73.mp3","phrases2":[{"en":"but → secretly wanting to be a novelist","zh":"但暗地里想当小说家"},{"en":"when → I first started writing at the age of 30","zh":"我30岁刚开始写作时"},{"en":"but → I took a little detour for 10 or 12 years","zh":"但我绕了10到12年的弯路"},{"en":"but → there's this dream tucked away inside of me","zh":"但我内心深处藏着一个想实现的梦"},{"en":"finally → in the early 90s I took my deep breath","zh":"终于在90年代初，我深吸了一口气"}]},{"id":4467,"name":"A good engineer","phrases":["because → from the engineering course","especially → design build debug and develop something new","when → design build debug and develop something new","that means → not able to see","which means → virtualize","in order to → develop and produce a reliable system"],"eng":"Today, this course you are going to take is about what engineering is and how to work with a complicated system. “ ” “ ” You guys should know the answers, because all of you guys are from the engineering course. Especially, when you design, build, debug and develop something new, during these process, you are working with the complicated system. How to program complicated systems and how would you know it actually works before producing it. Inspirations are from your daily life, you probably need to consider your personal life experience. And from the common everyday life to the tiny things that you cannot see virtually, and the inspirations normally exist in the tiny levels. A complicated system such as your laptops running Microsoft systems. That means the system is not able to see, which means you guys have to virtualize it. Engineering is here to help virtualize by using systems. Nowadays, the complicated systems are relatively reliable, and you guys work upon these and need to deliver the new outcomes which are reliable as well. This is what we do now and we are good at. Engineering is to help virtualize by using systems. In order to develop and produce a reliable system, you need to consider more on the risks, potential, predictability and accuracy.","ref":"Engineers should know how to work with a complicated system, and sometimes, the inspirations are from their personal life experience. A complicated system cannot see, so engineering is to help virtualize it by using systems. As complicated systems are becoming reliable, engineers should deliver reliable outcomes as well. To develop a reliable system, engineers need to consider the risks, potential, predictability and accuracy.","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693065/28e1c1f7fe244e7ea3561558d7a2b50c.mp3","phrases2":[{"en":"because → from the engineering course","zh":"因为你们都是工程专业的"},{"en":"especially → design build debug and develop something new","zh":"尤其是在你设计、构建、调试和开发新东西时"},{"en":"when → design build debug and develop something new","zh":"当你设计、构建、调试和开发新东西时"},{"en":"that means → not able to see","zh":"这意味着系统无法看到"},{"en":"which means → virtualize","zh":"这意味着你们必须进行虚拟化"},{"en":"in order to → develop and produce a reliable system","zh":"为了开发并生产出可靠的系统"}]},{"id":4453,"name":"A mother’s loan","phrases":["but → with one loan coming from here","so → without my college degree I would not have been able","but → at what cost","because → of our mounting credit card debt and monthly payments"],"eng":"I'm 43 years old, and I owe tens of thousands of dollars in student loans. 43 Oh sure, I knew the loans were piling up as I went through school. But with one loan coming from here, another from there, I had no idea of the rock slide that was building. “ ” Fifteen years later, I still experience moments of sheer horror regarding my family’s financial situation. My monthly student loan payment is more than triple my car payment. OK, so without my college degree, I would not have been able to get my current job. For that I'm grateful but at what cost? My loans have been accruing at a rate of 10 percent, and now they have burgeoned to well. 10% I'm an English major; you do the math. I don't think they'll ever get paid off. We’re in debt way past our eyeballs, and there's no hope in sight. I'm being kept in class a financial class of graduates whose only hope for attending college meant borrowing money from the government. “ ” Because of our mounting credit card debt and monthly payments that far exceed our family’s income, my kids will also join the class of citizens who can’t rely on their parents for college support. Do I wish I'd chosen another educational route? You bet.","ref":"The speaker shares her severe financial struggle caused by massive student loans. Although her college degree helps her secure a job, high interest rates make the debt unpayable, and monthly payments exceed her family income. Consequently, she deeply regrets her educational choice. Furthermore, this heavy financial burden forces her children to rely on government loans for their future college education.","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693686/2ea949fda7234e748923c149349cddc7.mp3","phrases2":[{"en":"but → with one loan coming from here","zh":"但有一笔贷款来自这里"},{"en":"so → without my college degree I would not have been able","zh":"所以没有大学学位，我本不可能……"},{"en":"but → at what cost","zh":"但代价是什么？我的贷款一直在以……的速度累积"},{"en":"because → of our mounting credit card debt and monthly payments","zh":"由于我们不断增加的信用卡债务和每月还款"}]},{"id":2140,"name":"AI","phrases":["in order to → learn about the world ， 。 If those texts are","if → biased towards 1 section of society","therefore → paramount that that organizations put in place procedures to analyze","when → operating in order to ensure that the","in order to → ensure that the systems have a fair and unbiased view"],"eng":"The proclamation that artificial intelligence, or AI, will improve decision making by taking the human element out of the process, hence removing bias for or against certain sections of society, is not entirely accurate. 声称人工智能（AI）将通过消除决策过程中的人为因素来改进决策，从而消除对社会某些群体的偏见，这种说法并不完全准确。 AI is likely to be as biased as the designers who create it or the material it considers. 人工智能很可能与创造它的设计者或它所考虑的材料一样带有偏见。 An AI system may trawl through countless newspaper and magazine articles in order to learn about the world. 一个人工智能系统可能会搜寻无数的报纸和杂志文章，以便了解世界。 If those texts are biased towards 1 section of society, the AI system will learn from this and go on to perpetuate this attitude. 如果这些文本对社会某个群体带有偏见，人工智能系统将从中学习并继续强化这种态度。 It is therefore paramount that that organizations put in place procedures to analyze AI systems, both at the design stage and when the system is operating, in order to ensure that the systems have a fair and unbiased view of the world. 因此，至关重要的是，各组织应制定相应的程序，在人工智能系统的设计阶段和运行过程中对其进行分析，以确保这些系统对世界持有公平和公正的看法。","ref":"Al is not automatically fair to all sections of society; it is as biased as the people who create it or the texts it considers. It learns from the content of these texts, so may learn biased attitudes. Procedures are therefore needed to ensure that what Al learns is fair to all sections of society.","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658777/1c53a71bbf0046149463586f7fd49270.mp3","phrases2":[{"en":"in order to → learn about the world ， 。 If those texts are","zh":"为了了解世界，如果那些文本是"},{"en":"if → biased towards 1 section of society","zh":"如果那些文本偏向社会的某一部分"},{"en":"therefore → paramount that that organizations put in place procedures to analyze","zh":"因此至关重要的是，组织要建立程序来分析"},{"en":"when → operating in order to ensure that the","zh":"当系统运行时，为了确保"},{"en":"in order to → ensure that the systems have a fair and unbiased view","zh":"为了确保这些系统具有公平且无偏见的视角"}]},{"id":4444,"name":"Amory Lovins","phrases":["so → has written his pieces called Mr"],"eng":"Who knows who Amory Lovins is? · Amory Lovins Nobody. Amory Lovins is an unusual character. · He is something of polymath. Just to say, he is sort of him of knowledge across a wide range of fields. He’s not an academic. He has a consulting company which he runs off until huge recently out of his home in Colorado. He is outside Snowmass in a house built into the side of the mountain that has no furnace. For that 30 years, he has been kind of iconic plastic oddball genius, thinking of ways to save energy, thinking of ways to solve problems using technology that already exists. 30 And he has demonstrated several of them. He also offers he is something that he is such of oddballs that people tend to think he is kind of crazy. Anyway, Elizabeth Kolbert, went to spend some time with Amory Lovins. · Elizabeth Kolbert · And so he has written his pieces called Mr. Green. Mr. Green","ref":"The lecture introduces Amory Lovins, a polymath and consultant regarded as an eccentric genius. He dedicates himself to energy conservation and solving problems using existing technology. He demonstrates his ideas practically by living in a mountain house without a furnace. His remarkable dedication and unconventional approach attract public attention, inspiring journalist Elizabeth Kolbert to write a profile about him titled \"Mr. Green.\"","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693663/18d72b305df8407fbaf00ef56d462ec1.mp3","phrases2":[{"en":"so → has written his pieces called Mr","zh":"因此他写了他那些名为Mr的作品"}]},{"id":4461,"name":"Andrew Carnegie","phrases":["when → was 13 and settled in Pittsburgh","while → working for the telegraph office","but → was more interested in philanthropy than spending his money","so → built many libraries"],"eng":"Andrew Carnegie was born in Scotland in 1835. · 1835 His family moved to America when he was 13 and settled in Pittsburgh. 13 He found jobs working in a fabric mill and telegraph office. Carnegie always did well at whatever he set his mind to. He was known to make improvements to any job he held. While working for the telegraph office, he began studying the railroad system, and he soon became the superintendent. He took the money he had saved and invested in an oil company. His investment return was good and then he went to England to learn how to make steel. He wanted to make steel that was cheaper and more durable than American steel. He came back with his knowledge and built a huge steel factory. Carnegie's factory was very successful and he sold it for 480 million dollars. 4.8 Carnegie was a very wealthy man but he was more interested in philanthropy than spending his money on himself. He spent the rest of his life giving his money away to worthy causes. Reading and learning were very important to him, so he built many libraries. He also established universities and research institutes. Carnegie built hospitals, museums, and theaters. One of the most recognizable buildings he built was Carnegie Hall in New York City. Carnegie Hall hosts many concerts and symphonies each year and is an important part of New York City culture. Andrew Carnegie passed away at the age of 83. · 83 In his lifetime he gave away 90% of his fortune. 90% He is known as a man who was selfless and wanted to do good for others.","ref":"Scotland-born Andrew Carnegie and his family moved to America when he was 13. He found jobs working in a fabric mill and telegraph office. Carnegie always did well at whatever he set his mind to. Later he built the most successful steel factory and made great fortunes in the steel company, but he gave 90 percent of money away to worthy causes.","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693059/428cef8ba0674fa784fee768a4dc47a1.mp3","phrases2":[{"en":"when → was 13 and settled in Pittsburgh","zh":"他13岁定居匹兹堡时"},{"en":"while → working for the telegraph office","zh":"在电报局工作期间"},{"en":"but → was more interested in philanthropy than spending his money","zh":"但他更热衷于慈善，而不是花钱"},{"en":"so → built many libraries","zh":"因此他建了许多图书馆，还创办了大学和科研机构"}]},{"id":3792,"name":"Australian immigration","phrases":["while → the upper range supported by others is 60","when → typically much lower than they are today","therefore → extended much further out into the Timor Sea","thus → long established and continued to develop","however → the newly formed 150 km wide Torres Strait"],"eng":"The first inhabitants in Australia were the ancestors of the present indigenous people. Whether these first migrations involved one or several successive waves and distinct peoples is still subject to academic debate, as is its timing. The minimum widely accepted time frame places presence of humans in Australia at 40,000 to 43,000 years Before Present, while the upper range supported by others is 60,000 to 70,000 years BP. 4 4 3 6 7 In any event, this migration was achieved during the closing stages of the Pleistocene epoch, when sea levels were typically much lower than they are today. Repeated episodes of extended glaciation resulted in decreases of sea levels by some 100–150 m. 100 150 The continental coastline therefore extended much further out into the Timor Sea than it does today, and Australia and New Guinea formed a single landmass (known as Sahul), connected by an extensive land bridge across the Arafura Sea, Gulf of Carpentaria and Torres Strait. “ ” The ancestral Australian Aboriginal peoples were thus long established and continued to develop, diversify and settle through much of the continent. As the sea levels again rose at the terminus of the most recent glacial period some 10,000 years ago, the Australian continent once more became a separated landmass. However, the newly formed 150 km wide Torres Strait with its chain of islands still provided the means for cultural contact and trade between New Guinea and the northern Cape York Peninsula. 150 During the 1970s and 1980s around 120,000 southern Asian refugees migrated to Australia. 20 70 80 12 During that twenty years, Australia first began to adopt a policy of what Minister of Immigration Al Grassby termed \"multiculturalism\". · “ ” In 2004–05, Australia accepted 123,000 new settlers, a 40% increase over the past 10 years. 2004 2005 12.3 40% The largest number of immigrants (40,000 in 2004–05) moved to Sydney. 2004–05 4 The majority of immigrants came from Asia, led by China and India.","ref":"The first inhabitants of Australia were the ancestors of the indigenous people. Their migration occurred during the Pleistocene epoch when sea levels were lower. Australia and New Guinea were connected by a land bridge known as Sahul. As sea levels rose 10,000 years ago, Australia became a separate landmass. In recent years, Australia has experienced significant immigration, with the majority coming from Asia, particularly China and India.","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691689/5d47bce3664d4b28a389d76a23a1b8d7.mp3","phrases2":[{"en":"while → the upper range supported by others is 60","zh":"而其他研究支持的上限是60"},{"en":"when → typically much lower than they are today","zh":"当海平面通常远低于如今时"},{"en":"therefore → extended much further out into the Timor Sea","zh":"因此向帝汶海延伸得远得多"},{"en":"thus → long established and continued to develop","zh":"因此早已确立并持续发展"},{"en":"however → the newly formed 150 km wide Torres Strait","zh":"然而，新形成的150公里宽的托雷斯海峡"}]},{"id":3802,"name":"Basic social values","phrases":["but → I think just to put it in a nutshell","for example → supportive and safe or challenging","so → on Whilst probably the majority of you who've actually made","but → probably more tried and tested kind of projects"],"eng":"But I think just to put it in a nutshell, that many basic social values are passed on unconsciously, already in babyhood. Adults convey a great deal to babies about the kind of society they're living in. And, you know, the most basic level, for example, whether the world is supportive and safe or challenging and dangerous. And all of us in different ways are working with the unloving side of society in a way and trying to find ways to offer a more caring response. And particularly those people who are working in Africa are often doing really cutting-edge work in dealing with traumatic social problems such as the AIDS epidemic, the aftermath of war, homelessness and so on. Whilst probably the majority of you who've actually made it here today are putting your creative energy into, I'm sure, wonderful, but probably more tried and tested kind of projects.","ref":"The lecture is mainly about basic social values. According to the speaker, many basic social values are passed on unconsciously, already in babyhood. And most people in different ways are working with the unloving side of society in a way and trying to find ways to provide a more caring response, especially those working in Africa who often deal with traumatic social problems.","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691718/3c2e77f6064d4fa58337cd83a5480abe.mp3","phrases2":[{"en":"but → I think just to put it in a nutshell","zh":"但我想，简而言之"},{"en":"for example → supportive and safe or challenging","zh":"例如，世界是支持性的、安全的，还是充满挑战的"},{"en":"so → on Whilst probably the majority of you who've actually made","zh":"等等。尽管你们中大多数人可能确实做过"},{"en":"but → probably more tried and tested kind of projects","zh":"但可能是更经实践检验的项目"}]},{"id":2124,"name":"Bees waggle dance","phrases":["when → a bee finds a good source of nectar","however → be interrupted by a headbutt from another","when → the foragers returned to the hive"],"eng":"Honeybees have a unique way of communicating with each other—the waggle dance. —— When a bee finds a good source of nectar, it will perform a waggle dance to inform other bees about it. However, this dance can be interrupted by a headbutt from another bee, which researchers have discovered is actually a warning signal. To study this behavior, scientists set up a feeding station in the lab to mimic a source of nectar. They then introduced foraging bees to potential dangers at the station, such as competition from rival colonies. When the foragers returned to the hive, they were observed stopping the dancing bees. This led the researchers to believe that the headbutt serves as a warning to the dancers about the dangerous source of nectar. The lecture also mentioned that bees can use their dance and sounds to describe different flowers and the environment. This study sheds light on the complex communication system of honeybees and the way they work together to ensure the safety of the colony and the success of their foraging efforts.","ref":"Honeybees communicate using a waggle dance to share nectar sources. Researchers found that the dance can be interrupted by a headbutt, which serves as a warning. Scientists mimicked a nectar source in a lab and observed foraging bees returning to the hive to stop dancing bees when potential dangers were present. This behavior study sheds light on the intricate communication system and collaborative efforts of honeybees.","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678216/884ce7b0e60b48f8b9e21953869a972c.mp3","phrases2":[{"en":"when → a bee finds a good source of nectar","zh":"当一只蜜蜂找到优质花蜜源时"},{"en":"however → be interrupted by a headbutt from another","zh":"然而，这种舞蹈可能会被另一只蜜蜂用头撞打断"},{"en":"when → the foragers returned to the hive","zh":"当采集蜂返回蜂巢时"}]},{"id":3787,"name":"Bees' genes and Darwin","phrases":["but → constantly replenished with new generations of bees"],"eng":"A healthy hive of honeybees functions like a perfect and fluid organism; at the center of all activity is the queen, the egg-laying machine. —— The queen is actually a slave to her duties, laying up to 2500 eggs a day, as many as two million in her lifetime. 2500 200 The worker bees are all female and make up the bulk of the colony. In a typical hive of 30000 bees, only about 100 are males called drones, with oversized eyes and bulky bodies. 100 Drones are not equipped to gather pollen or nectar and must rely on the workers to feed them. The invaluable work bees do takes its toll in the summer. Workers only live around 30 days, literally work to death. 30 “ ” But the hive is constantly replenished with new generations of bees ready to go to work from the moment they hatch.","ref":"A healthy honeybee hive revolves around the queen’s egg-laying capacity of up to 2500 eggs a day. The majority of the colony comprises female workers, while a small number of male drones rely on the workers for sustenance. The worker bees’ tireless efforts in gathering resources take a toll, as they live for approximately 30 days, but the hive is continually replenished by new generations.","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691666/f00e8f53ad104a42923abaf13654a0c4.mp3","phrases2":[{"en":"but → constantly replenished with new generations of bees","zh":"但蜂巢不断补充新一代蜜蜂"}]},{"id":3795,"name":"Biggish city","phrases":["so → on In another lecture I'm going to deal with what","however → first I want to go back in history","when → be numbered in the thousands","because → be harder to control","because → in practical terms fewer inhabitants are easier to feed"],"eng":"We have briefly looked at some of the problems involved in running a biggish city like, say, Melbourne, keeping the road and rail systems running, policing, providing food and housing, and so on. In another lecture, I'm going to deal with what we must now call megalopolis-cities with populations of ten million or more. “ ” —— However, first I want to go back in history to when the population of cities could be numbered in the thousands rather than millions. One of the earliest theorists of the city was, of course, Plato, who created an ideal city in his text, The Republic. The population of this city would be around twenty-five to thirty thousand at most. Oddly enough, the same figures were chosen by Leonardo da Vinci for his ideal cities. · · Now, of these twenty-five to thirty thousand inhabitants, only about five thousand would be citizens. A reason for this might be that it is the largest number that could be addressed publicly at one time and by one person, and makes a voting system much easier to manage. Also, perhaps the numbers are kept deliberately low because a large population would be harder to control, or because, in practical terms, fewer inhabitants are easier to feed from local supplies without having to depend on outside sources.","ref":"The lecture talks about the population of cities in the past. According to the speaker, the population of cities in history could be numbered in thousands rather than millions. Interestingly enough, both Plato and Leonardo chose the same figures, twenty-five to thirty thousand inhabitants, for their ideal cities. Now, the number of citizens is kept deliberately low because a small population would be easier to manage.","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691694/829404ecaf9e4b748ec0d14937d3ff28.mp3","phrases2":[{"en":"so → on In another lecture I'm going to deal with what","zh":"那么，在另一讲中我将讨论什么"},{"en":"however → first I want to go back in history","zh":"不过，首先我想回顾历史"},{"en":"when → be numbered in the thousands","zh":"当城市人口只能以千计时"},{"en":"because → be harder to control","zh":"因为人口众多会更难控制"},{"en":"because → in practical terms fewer inhabitants are easier to feed","zh":"因为从实际来看，居民越少越容易养活"}]},{"id":4463,"name":"Boys and girls","phrases":["because → different in learning styles","according to → the content analysis results concerning this finding","when → the passive social role of females and the general social"],"eng":"The research shows that girls have a higher level of English results than boys in the same class, because boys and girls are different in learning styles, and their brain functions are different in mechanisms. Male students were detected to be significantly more aware of the developments in the field of physics than female students. According to the content analysis results concerning this finding, unlike female students male students were more interested in technological developments. This finding is not surprising when the passive social role of females and the general social structure in which they tend to more sociable fields are considered. This finding may have occurred due to the fact that males are generally more interested in technology than females. Previous studies support this finding. Boys are more simplified, and teachers' teaching style normally suits girls better than boys. Teachers should find different teaching approaches respectively for boys and girls.","ref":"Research shows that girls tend to outperform boys in English results due to differences in learning styles and brain mechanisms. Boys demonstrate a greater awareness of developments in physics and technology, whereas girls tend to be more interested in sociable fields. This finding suggests the need for teachers to adopt different teaching approaches for boys and girls to enhance their learning experiences.","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693061/18deb212f44a4680b6c42a0a77b1e05a.mp3","phrases2":[{"en":"because → different in learning styles","zh":"因为男孩和女孩的学习风格不同"},{"en":"according to → the content analysis results concerning this finding","zh":"根据与该发现有关的内容分析结果"},{"en":"when → the passive social role of females and the general social","zh":"当女性的被动社会角色与一般社会"}]},{"id":2139,"name":"Child-rearing","phrases":["but → a recent research study in the us suggests","if → build relationships with the workers who look","if → looked after by one person or","if → they're part of a group of children in a place"],"eng":"Many people believe that it's always better for the development of very young children under the age of three to be cared for within the home. But a recent research study in the us suggests that this is not always the case. Being cared for outside the home can actually bring benefits if the children can build relationships with the workers who look after them and they have the opportunity to develop skills. The research also suggests that it makes no difference if one child is looked after by one person or if they're part of a group of children in a place that's similar to a sure. And we can say for sure that a situation where each member of staff looks after a small number of children is often very positive for the children involved.","ref":"Although many people think that small children should be cared for at home, being looked after outside the home can also have positive effects if the children can build relationships and learn skills. There's no evidence that it's better if one child is looked after by one person or if they are cared for in a group, but children benefit if each staff member is only responsible for a small number of them.","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658776/654b306f1a8c43b19887f90dc1ce0a66.mp3","phrases2":[{"en":"but → a recent research study in the us suggests","zh":"但美国最近的一项研究表明"},{"en":"if → build relationships with the workers who look","zh":"如果孩子们能与照看他们的工作人员建立关系"},{"en":"if → looked after by one person or","zh":"如果一个孩子由一个人照看，或者"},{"en":"if → they're part of a group of children in a place","zh":"如果他们是某个地方一群孩子中的一员"}]},{"id":2123,"name":"Children directors","phrases":["when → difficulties in interactions arise"],"eng":"Social skills are vital in enabling an individual to have and maintain positive interactions with others. Many of these skills are crucial in making and sustaining friendships. Social interactions do not always run smoothly and an individual needs to be able to implement appropriate strategies, such as conflict resolution when difficulties in interactions arise. It is also important for individuals to have 'empathy' as it allows them to respond in an understanding and caring way to how others are feeling. Children are facing social difficulties with particular risks. Young people who do not have strong relationships with the adults in their family are even more at risk. In an experiment in a high school, which lasted for 8 to 12 weeks, the students were told to be a movie director and to choose their own story structure. 8 12 The students worked with each other, which involved lots of different skills, and social interactivity. The movies they had made were actually cool. Then, the researchers tested the intervention effect, finding this can improve their self-regulation, and they found this can improve their self-regulation and critical thinking skills.","ref":"Children are facing social difficulties with particular risks. In an experiment in a high school, the students were told to be a movie director and to choose their story structure. The students worked with each other, which involved lots of different skills. The movies they had made were actually cool. Then, the researchers tested the intervention effect, and they found this can improve their self-regulation and critical thinking skills.","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678653/496d77f31adf4eb9ac1de87a37790035.mp3","phrases2":[{"en":"when → difficulties in interactions arise","zh":"当互动中出现困难时，这对个人来说也很重要"}]},{"id":4443,"name":"Citizenship curriculum","phrases":["yet → the progress made to date by the more committed schools","while → not claiming too much citizenship can address core skills"],"eng":"Last month I published alongside my annual report a subject report on the development of citizenship in schools. The report celebrates the success of some schools in implementing the citizenship curriculum. It praises those schools where there have been substantial developments in the subject, and which now go a long way towards fulfilling national curriculum requirements. In the report, we are critical of schools which have not taken citizenship seriously, either through reluctance or lack of capacity to make appropriate provision in the curriculum. Citizenship is marginalized in the curriculum in one-fifth of schools. It is less well established in the curriculum than other subjects, and less well taught, and some critics have seized on this as a reason for wanting to step back from supporting it. Yet, the progress made to date by the more committed schools suggests that the reasons for introducing citizenship are both worthwhile and can be fulfilled, given the time and resources. Indeed, those reasons are given added weight by national and global events of the past few months. While not claiming too much, citizenship can address core skills, attitudes, and values that young people need to consider as they come to terms with a changing world. The main problems standing in the way of implementation of citizenship continue to be: the lack of commitment on the part of many school leaders; and insufficient amount of initial and in-service training provision to ensure that every school can call upon teachers with subject expertise; and its uncertain place in the curriculum.","ref":"The lecture discusses a report on the development of citizenship education in schools. While it praises schools that successfully implement the curriculum, it criticizes those where the subject is marginalized. Despite some challenges, citizenship education remains valuable for developing students' core skills and values. However, its implementation faces major obstacles, including a lack of leadership commitment, insufficient teacher training, and an uncertain position in the curriculum.","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693662/79481a8bee0f464592ed1dc62a56b48a.mp3","phrases2":[{"en":"yet → the progress made to date by the more committed schools","zh":"然而，更投入的学校迄今取得的进展"},{"en":"while → not claiming too much citizenship can address core skills","zh":"尽管不宜夸大，公民教育仍可涉及核心技能"}]},{"id":3799,"name":"Climate change in Australia","phrases":["but → I think for me the biggest issue","that means → much of the world's population will eventually have to deal","according to → this geologist's work Sea levels could ultimately go up"],"eng":"Sea levels are rising and the consequences could be huge. By the end of this century, areas that only flood once every hundred years could start to flood several times every year. The rising sea is the sleeping giant of climate change. “ ” Climates may change, you might have more drought, and you might have more rain. But I think for me, the biggest issue, the biggest concern is what we'll do in the coming centuries. Unfortunately, many of the megacities in the world, and that also applies to the larger cities in Australia, have been built in low-lying areas. That means much of the world's population will eventually have to deal with sea-level rise. The question is, how high will the waters get? Well, we go to the remote northwest of Australia and make a disturbing discovery. According to this geologist's work. Sea levels could ultimately go up by a staggering nine meters.","ref":"This lecture mainly talks about the sea levels of Australia. When the sea level is rising, the consequences may well be huge. This is because there will be more floods. Also, climate change will mean more rain and droughts. Many mega cities are likely to be affected by the sea level rising, and this means more people have to deal with it.","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691712/0c9d23d1985a4ec5abe19da7d8a491f2.mp3","phrases2":[{"en":"but → I think for me the biggest issue","zh":"但我觉得对我来说最大的问题是"},{"en":"that means → much of the world's population will eventually have to deal","zh":"这意味着世界大部分人口最终将不得不面对"},{"en":"according to → this geologist's work Sea levels could ultimately go up","zh":"根据这位地质学家的研究，海平面最终可能上升"}]},{"id":2132,"name":"Coffee","phrases":["but → may not realize that it's not native","so → came from there","if → came from there how did it cross the Pacific","because → all comes from the one plant","so → what it looks like is that the price of coffee","so → in short there's a good chance that your morning coffee"],"eng":"As you probably know, coffee is the second largest commodity by traded value in the world after oil. You probably also know that it's grown in Brazil, but you may not realize that it's not native to that country. It originated in East Africa. So if it came from there, how did it cross the Pacific? Well, the Dutch took coffee to a number of different places around the world, including South America, where it thrived. Nowadays, all the coffee cultivated in Brazil comes from that one seedling, which was of a variety called Robusta. Robusta Now, because it all comes from the one plant, genetically, Robusta isn't particularly varied, Robusta which unfortunately means its resistance to disease is, well, rather on the low side. And well, this is exactly what has happened recently. A pathogen called coffee rust is ravaging coffee crops across South America. So what it looks like is that the price of coffee is, well, going to skyrocket on the wholesale market, unless production is increased dramatically in a short space of time in other countries such as, you know, Vietnam, which seems rather unlikely. So in short, there's a good chance that your morning coffee is going to become, well, quite pricey and pretty soon at that.","ref":"Although coffee originated in east Africa, much of it is now grown in Brazil. The crops there all stem from one individual plant, which means that they are vulnerable to contagion. As a result, the current outbreak of a disease called coffee rust is wiping out South American crops. This will probably lead to raised prices unless production elsewhere, such as in Vietnam, can be increased rapidly.","audio":"https://ti.koolearn.com/upload/ti/sardine/2656000-2657000/2656875/cca7644f97e043108c257f4fa094be96.mp3","phrases2":[{"en":"but → may not realize that it's not native","zh":"但你可能没意识到，它并非原产于当地"},{"en":"so → came from there","zh":"所以，如果它来自那里"},{"en":"if → came from there how did it cross the Pacific","zh":"如果它来自那里，它又是怎么跨越太平洋的呢？"},{"en":"because → all comes from the one plant","zh":"因为它全都来自同一种植物"},{"en":"so → what it looks like is that the price of coffee","zh":"所以看起来，咖啡的价格"},{"en":"so → in short there's a good chance that your morning coffee","zh":"所以简而言之，你早上的咖啡很可能"}]},{"id":2125,"name":"Cosmology and maths","phrases":["while → actively engaging in the field of cosmology","according to → the speaker this quest for mathematical understanding led them","but → a fundamental aspect of the cosmos itself"],"eng":"The speaker is discussing the intricate relationship between mathematics and cosmology. Back in the 1970s, the lecturer pursued a career in physics while actively engaging in the field of cosmology. 20 70 Throughout this period, scientists passionately sought to harness the power of mathematics as a means to unravel the mysteries of the universe. According to the speaker, this quest for mathematical understanding led them to a fascinating realization: mathematics is an omnipresent force in the natural world. In the speaker's perspective, mathematics is not just a tool used by scientists to explain the universe; rather, it is an inherent and fundamental aspect of nature itself. Nature, cosmology, and mathematics are all interconnected, forming a complex web of relationships that shape our understanding of the cosmos. As the speaker delves into the heart of their argument, they emphasize that mathematics can be found virtually everywhere in nature. From the graceful spiral of a seashell to the precise orbits of celestial bodies, mathematical patterns and principles underpin the very fabric of our world. These mathematical foundations allow us to comprehend and interpret the workings of the universe, making it an indispensable language for cosmologists. In conclusion, the speaker asserts that mathematics is the underlying system that enables us to explain the universe and nature. It is not merely a tool but a fundamental aspect of the cosmos itself. This profound connection between mathematics, nature, and cosmology has guided scientists in their pursuit of knowledge and continues to shape our understanding of the universe's grand design.","ref":"In this lecture, the speaker explores the profound connection between mathematics and cosmology, arguing that mathematics is an inherent part of nature itself, not just a tool for explanation. They emphasize the omnipresence of mathematical patterns in the natural world, linking them to the workings of the universe. The speaker concludes that mathematics is a fundamental aspect of the cosmos, shaping our understanding and enabling us to interpret the universe.","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678217/2e0843e5401d4966b5e07fb41a80158c.mp3","phrases2":[{"en":"while → actively engaging in the field of cosmology","zh":"在积极投身宇宙学领域时"},{"en":"according to → the speaker this quest for mathematical understanding led them","zh":"据演讲者称，这种对数学理解的追求引领了他们"},{"en":"but → a fundamental aspect of the cosmos itself","zh":"但宇宙本身的一个基本方面"}]},{"id":3788,"name":"Credit card experiment","phrases":["while → the other group received a communication implying a penalty"],"eng":"A recent study on customer behavior investigated the impact of different messaging strategies on inactive credit card users. One group was presented with a message emphasizing the benefits they could enjoy by using their cards, while the other group received a communication implying a penalty for non-use. Surprisingly, the results revealed that customers were more influenced by the potential loss of not using the card than the potential benefits of using it. “ ” “ ” This suggests that the fear of missing out or facing a penalty may be a stronger motivator for customer action than the promise of rewards. These findings have important implications for businesses and marketers seeking to engage inactive customers, indicating that messaging focusing on potential losses or penalties may be more effective in encouraging customer activity. Further research in this area could lead to a better understanding of consumer decision-making and the psychological factors driving behavior.","ref":"In an experiment on customers’ behaviors, one group of inactive credit card users received a message offering benefits that they could gain by using the cards, while the other group received a message implying a penalty if it’s not used. The result shows that customers are more motivated by a potential loss when not using this card than the benefit they could gain by using the card.","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691680/c5b7e21242ed45fbb17babb92050becd.mp3","phrases2":[{"en":"while → the other group received a communication implying a penalty","zh":"而另一组收到了一则暗示惩罚的通知"}]},{"id":4469,"name":"Curator","phrases":["but → I want to draw some generalities from that in terms","because → is not necessarily very well understood is that I","but → is certainly my view of museums","therefore → in terms of how we interrogate the past","although → is changing a little bit","if → go through university history primarily you are encouraged","but → curators attend to objects"],"eng":"I am going to talk today mostly about what I do as a curator here at the National Museum of Australia but I want to draw some generalities from that in terms of a series of curatorial practices, tools, techniques and methods that I think could be of interest to your students and to you in developing extension history courses. I want to talk about what I do as a curator and then from that also talk a bit about the kinds of history that I think museums are particularly good at creating and communicating. I think this is something I would really like to discuss because it is not necessarily very well understood is that I think museums, as Dave insisted by putting up my quote in his slide, create a very particular kind of history. Dave It’s not the kind of history that gets created in books or in dating films or in compositions, it’s a very particular kind of history that grows out of the fact that museums are centrally interested and defined by their collections. I should say that is not an uncontested view of museums but it is certainly my view of museums. Curators try to understand material culture as evidence of other people’s lives as a means to try to understand other people - what they look like, what they did, how they made a living, what they hoped for in their lives, how they tried to construct their world and why they made particular choices. —— One way in which curators differ from other historians is therefore in terms of how we interrogate the past, what elements we use to communicate the past. Most academic historians are trained very much in the discipline of words and they concentrate on words still today, although it is changing a little bit. If you go through university history primarily you are encouraged to draw on things like archival accounts, manuscripts and now oral histories, and most of that work is actually promulgated in the form of books. There are also other kinds of historians. Obviously, filmmakers and photographers concentrate on creating images of the world and arranging them in meaningful sequences, but curators attend to objects. We look at objects as evidence of the past and try to arrange objects in meaningful ways called exhibitions.","ref":"This topic is about practices, techniques and methods of curators. Museums are good at creating and communicating history where museums are defined by their collections. Curators understand material culture as evidence of people's life to understand people. Curators are different from other historians. Academic historians concentrated on words and photographers concentrate on images, while curators deal with objects that are evidence of the past. They arrange objects into exhibitions.","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693067/a6f38701ceaa4203ace15d85bcaab75e.mp3","phrases2":[{"en":"but → I want to draw some generalities from that in terms","zh":"但我想从中归纳出一些一般性结论"},{"en":"because → is not necessarily very well understood is that I","zh":"因为有一点未必得到充分理解，那就是我"},{"en":"but → is certainly my view of museums","zh":"但这确实是我对博物馆的看法"},{"en":"therefore → in terms of how we interrogate the past","zh":"因此，就我们如何追问过去而言"},{"en":"although → is changing a little bit","zh":"尽管情况正在略有改变"},{"en":"if → go through university history primarily you are encouraged","zh":"如果你在大学里主要学历史，你会受到鼓励"},{"en":"but → curators attend to objects","zh":"但策展人关注物件。我们把物件视为证据。"}]},{"id":4447,"name":"Development of genes","phrases":["so → frighteningly rapid that the evolution of cognitive function and perception","if → one needed to adapt a dozen of genes changes","in order to → acquire the penetrating minds that we now","so → quickly And for that reason alone","so → large Therefore a rather small number of genes","therefore → a rather small number of genes"],"eng":"The pace, the pace of which that the human minds have evolved over the last half million years and more recently the last 200,000 years has been so frighteningly rapid that the evolution of cognitive function and perception in different ways, can only happen to the actions of a small number of genes. If one needed to adapt a dozen of genes changes and concert, in order to acquire the penetrating minds that we now have, which our ancestors 500,000 years ago didn't have, the evolution could not have taken, could not have occurred so quickly. And for that reason alone, one begins to suspect that the genetic differences between people who lived 500,000 years ago sever that cognitive functions than ours are not so large. Therefore, a rather small number of genes, maybe responsible for comforting us that powerful minds which we now, which the most of us now processed.","ref":"The lecture discusses the rapid evolution of human cognitive function over the past 500,000 years. This fast development only occurs through changes in a small number of genes, because requiring multiple gene changes makes such rapid evolution impossible. Consequently, the genetic differences between ancient humans and modern people remain relatively small. Ultimately, a limited number of genes are responsible for endowing humans with powerful cognitive abilities.","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693670/a937d5e8c5b74337ac2aaa610ab4d062.mp3","phrases2":[{"en":"so → frighteningly rapid that the evolution of cognitive function and perception","zh":"认知功能与感知的进化快得如此惊人，以至于……"},{"en":"if → one needed to adapt a dozen of genes changes","zh":"如果只需适应十几处基因变化"},{"en":"in order to → acquire the penetrating minds that we now","zh":"为了获得我们如今拥有的敏锐头脑"},{"en":"so → quickly And for that reason alone","zh":"如此迅速，且仅凭这一原因"},{"en":"so → large Therefore a rather small number of genes","zh":"如此之大，因此只需相当少的基因"},{"en":"therefore → a rather small number of genes","zh":"因此，基因数量相当少"}]},{"id":4450,"name":"Devolution of power","phrases":["for example → an op-ed a couple of weeks ago","because → they’re kind of populist types","so → just moving it away from the people"],"eng":"Well, that’s one aspect of what’s called, reducing government - modifying government, to be more precise. “ ” —— Another aspect of it is what’s called “devolution” - reducing - moving governmental power from the Federal to the State level. “ ”—— And that has a kind of a rationale which you hear all over the time - place. For example, there was an op-ed a couple of weeks ago in the New York Times by John Cogan - Hoover Institute at Stanford, who has pointed out what he called a philosophical issue that divides the Democrats from the Republicans. · The philosophical issue is that the Democrats believe in big government and entitlements, and the Republicans believe in getting power down closer to the people, to the States, because they’re kind of populist types. Well, it takes about maybe three seconds’ thought to realize that moving power down to the States, in funding and so on, is just moving it away from the people, for a perfectly elementary reason: there’s a hidden part of the system - of the power system that you’re not supposed to know about, or think about, and that’s private power. —— —— ——","ref":"The lecture discusses the concept of devolution, which involves moving governmental power from the federal to the state level. While Republicans support this approach to bring power closer to the people, the speaker argues that it actually moves power away from citizens. This is because a hidden part of the power system, specifically private power, remains unknown to the public.","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693678/e503c508e4d445bbb26798aec4cbcb1e.mp3","phrases2":[{"en":"for example → an op-ed a couple of weeks ago","zh":"例如，几周前有一篇评论文章"},{"en":"because → they’re kind of populist types","zh":"因为他们算是那种民粹派"},{"en":"so → just moving it away from the people","zh":"所以，这只是在把它从民众身边移开"}]},{"id":2130,"name":"Dialects","phrases":[],"eng":"The lecture delivers a detailed exploration of the distinctions between dialects and accents. It underscores the shaping of dialects by diverse influences such as geography, society, family, and education. It is particularly notable that even speakers of Received Pronunciation may integrate words from other dialects, highlighting the dynamic nature of language. This underscores the adaptability and interconnectedness of dialects within our linguistic landscape. Overall, the lecture presents a comprehensive analysis of the nuanced differences between dialects and accents, bringing to light their influential role in shaping communication and preserving cultural identities. It shines a spotlight on the diverse and evolving nature of language, and how it intricately reflects our individual and collective experiences.","ref":"The lecture discusses the differences between dialects and accents, emphasizing the influence of geography, society, family, and education in shaping dialects. It highlights the dynamic nature of language by noting that speakers of Received Pronunciation may integrate words from other dialects. The lecture provides a comprehensive analysis of the influential role of dialects and accents in communication and cultural preservation, showcasing the diverse and evolving nature of language.","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678651/197d3bf048df412eb723f576aea84447.mp3","phrases2":[]},{"id":4448,"name":"Drug ads","phrases":["especially → around the news Researchers analyzed 38 ads aimed at people","but → researchers found that though the information was technically accurate","though → technically accurate","for example → portrayed as being incapacitated for days","when → then shown taking the drug","but → in this case Frosch says"],"eng":"The amount of money drug companies spend on TV ads has doubled in recent years. And it's no wonder: studies show the commercials' work: consumers go to their doctors with a suggestion for a prescription drug they saw advertised on TV. —— Now a study in the Annals of Family Medicine raises questions about the message these ads promote, NPR's Patty Neighmond reports. NPR · You're most likely to see drug ads during prime time, especially around the news. Researchers analyzed 38 ads aimed at people with conditions like hypertension, herpes, high cholesterol, depression, arthritis, and allergies. 38 The drug industry says the ads arm consumers with information. But researchers found that though the information was technically accurate, the tone was misleading. UCLA psychologist Dominick Frosch headed the study. · \"What we would see in these ads is that before taking the prescription drug, the character's life was out of control and the loss of control really extended beyond just the impact of the health condition,\" “ ” For example, herpes patients were portrayed as being incapacitated for days, insomniacs utterly out of synch on the job and depressed patients friendless and boring at parties. \"When the character is then shown taking the drug, he then magically regains complete control of his life.\" “ ” None of the ads, of course, mentioned lifestyle changes that could also help treat the condition. After all, it's mass marketing. But in this case, Frosch says, prescription medications are not like soap.","ref":"The lecture discusses the increase in pharmaceutical TV advertising and its impact on consumers. Although the information is technically accurate, researchers find the ads misleading. They exaggerate the negative impact of health conditions and suggest that medication magically restores life control. Furthermore, these advertisements ignore lifestyle changes that help treat conditions, highlighting that prescription drug marketing differs significantly from ordinary product promotion.","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693671/cc9481aecafb4e9c860d593bbf98d849.mp3","phrases2":[{"en":"especially → around the news Researchers analyzed 38 ads aimed at people","zh":"尤其是在新闻方面，研究人员分析了38则面向大众的广告"},{"en":"but → researchers found that though the information was technically accurate","zh":"但研究人员发现，尽管这些信息在技术上是准确的"},{"en":"though → technically accurate","zh":"尽管这些信息在技术上是准确的"},{"en":"for example → portrayed as being incapacitated for days","zh":"例如，疱疹患者被描绘成会连续数日无法正常活动"},{"en":"when → then shown taking the drug","zh":"当随后画面显示该角色服用这种药物时"},{"en":"but → in this case Frosch says","zh":"但弗罗施说，在这种情况下"}]},{"id":4445,"name":"Einstein","phrases":["so → the stars the comets and the planets","but → in some sense on the larger scale in the universe","but → was the astronomer Edwin Hubble who is the owner"],"eng":"For thousands of years, philosophers and astronomers and thinkers of all sorts have imagined that the universe, the space around us, was rather like this floor in front of us. —— —— It was fixed and unchangeable, and things happen on it, just as people walk around. So the stars, the comets, and the planets, and the other heavenly bodies moved around and traced down their parts on this completely unchanging stage of space. In the 20th century, as the result of Einstein’s work, that view of the universe was completely transformed. 20 We began to understand that there was no absolutely fixed stage of space at all on which all celestial notions were played out. But in some sense, on the larger scale in the universe, the space itself was in this state of a continuous dynamic change. That was a prediction made by Einstein. But it was the astronomer Edwin Hubble who is the owner of the honor of making the discovery that our universe was really like that. · Edwin Hubble","ref":"The lecture explains the evolution of the universe concept. Traditionally, people view space as a completely fixed and unchangeable stage for celestial bodies. However, Einstein transforms this perspective by predicting that space itself undergoes continuous dynamic change. Furthermore, the astronomer Edwin Hubble makes the crucial discovery that confirms his prediction, proving that the universe is truly dynamic rather than static.","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693664/b44c4c30aa5340068ffe6941389057a0.mp3","phrases2":[{"en":"so → the stars the comets and the planets","zh":"所以，恒星、彗星和行星"},{"en":"but → in some sense on the larger scale in the universe","zh":"但在某种意义上，在宇宙的更大尺度上"},{"en":"but → was the astronomer Edwin Hubble who is the owner","zh":"但天文学家埃德温·哈勃才是其拥有者"}]},{"id":2138,"name":"Enough sleep","phrases":["so → less than 7 hours a night","if → too little sleep","if → aren't sleeping enough you basically need to take care","because → could easily make mistakes which put you in danger"],"eng":"Several recent studies from researchers around the world all suggest that not getting enough sleep causes people more serious problems than they might think. 来自世界各地研究人员最近的几项研究都表明，睡眠不足给人们带来的问题比他们想象的要严重得多。 One interesting study carried out last year has shown that not getting enough sleep, so less than 7 hours a night, makes it twice as difficult to complete a task which requires you to do several different things in a specific order. 去年进行的一项有趣的研究表明，睡眠不足，即每晚睡眠少于 7 小时，会使完成需要按特定顺序执行多项任务的工作难度增加一倍。 Even more interesting is the result that you'll find it three times as difficult to concentrate on a simple task if you've had too little sleep. 更令人惊讶的是，如果你睡眠不足，你会发现专注于一项简单的任务的难度会增加两倍。 Those are amazing results, and they mean that if you aren't sleeping enough, you basically need to take care all of the time because you could easily make mistakes which put you in danger or cost you a lot of money. 这些结果令人震惊，这意味着如果你睡眠不足，基本上需要时刻小心，因为你很容易犯下可能让你身处险境或损失大量金钱的错误。 For the first time, we're seeing very clearly that not getting enough sleep has very negative effects on people's ability to perform, both at work and in the home. 我们首次非常清楚地看到，睡眠不足对人们在工作和家庭中的表现能力都有非常负面的影响。","ref":"Several studies have found that not getting enough sleep can cause serious problems. One particular study showed that lack of sleep makes it more difficult to complete tasks and more difficult to concentrate on simple tasks. This means that getting too little sleep can be dangerous and expensive. lt's become clear that not getting enough sleep has negative effects on how people do things at work and at home.","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658775/771665f267b047f28b286914ef60770b.mp3","phrases2":[{"en":"so → less than 7 hours a night","zh":"所以每晚少于7小时"},{"en":"if → too little sleep","zh":"如果你睡眠太少"},{"en":"if → aren't sleeping enough you basically need to take care","zh":"如果你睡眠不足，基本上就得当心"},{"en":"because → could easily make mistakes which put you in danger","zh":"因为你很容易犯错，从而让自己陷入危险"}]},{"id":3803,"name":"Experiment on climate change","phrases":["when → first noticed climate change","but → difficult from area","although → much remains to be learned about global warming"],"eng":"Humans are faced with many challenges, one of which is climate change. An experiment was conducted on the environment and climate in the 1930s when people first noticed climate change. 20 30 Humans have been trying to change their lifestyles to deal with it, but the observation of climate change is difficult from area to area. A method is introduced to help understand the mechanism of the climate system. Researchers predict that temperatures will increase about two to 10 degrees Fahrenheit by the end of the century. 2 10 What's less certain is what rising temperatures mean for the planet. Some climate models predict subtle changes. Others forecast rising sea levels, which could flood coastal areas around the world. Weather patterns could change, making hurricanes more frequent. Severe droughts could become more common in warm areas, and species unable to adapt to the changing conditions would face extinction, although much remains to be learned about global warming. Many organizations advocate cutting greenhouse gas emissions to reduce the impact of global warming. Consumers can help by saving energy around the house, switching to compact fluorescent light bulbs, and driving fewer miles in the car each week. These simple changes may help keep the earth cooler in the future.","ref":"Climate change is one of the challenges facing our world today. In the 1930s, when people first noticed climate change, they have been trying to deal with it, but it is difficult to observe changes in climate from area to area. Although scientists have different views on climate change, cutting greenhouse gas emissions, saving energy, and driving fewer miles may help keep the earth cooler in the future.","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691719/b572ab058a1f4494b40d0926ab105f57.mp3","phrases2":[{"en":"when → first noticed climate change","zh":"当人们最初注意到气候变化时"},{"en":"but → difficult from area","zh":"但从区域角度观测气候变化很困难"},{"en":"although → much remains to be learned about global warming","zh":"尽管关于全球变暖仍有很多需要了解"}]},{"id":4462,"name":"Free sugars","phrases":["therefore → apply to fruits Unhealthy sugar is normally found in desserts","but → in this case they have been removed from their naturally","but → better","because → process it easily","because → is the same as drinking soft drinks"],"eng":"Both fruits and milk contain sugar, and this sugar is healthy sugar. Many people have heard that sugar is bad, and think that this must also therefore apply to fruits. Unhealthy sugar is normally found in desserts, ice cream etc. It's much easier to consume excess sugar from foods and drinks that contain \"free sugars\". “ ” Free sugars include these same sugars, but in this case they have been removed from their naturally occurring source, rather than being eaten as natural parts of fruits, dairy products, and some vegetables and grains. This includes sugar that is added to food and drinks by food companies, cooks or consumers. Many people drink juices, and this is a healthy approach. But directly eating fruits is better, because the human body can process it easily. It is better to eat a small piece of fruit, which our bodies can digest better rather than drink smoothies or more than half a cup of fruit juice because it is the same as drinking soft drinks.","ref":"Both fruits and milk contain sugar, and this sugar is a healthy sugar. Unhealthy sugar is normally found in desserts and ice cream. It's much easier to consume excess sugar from foods and drinks that contain \"free sugars\". Free sugars in this case have been removed from their naturally occurring source. In addition, directly eating fruits is better because the human body can process them easily.","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693060/1301c3b555204c7e8abeb2c5c62cb4a6.mp3","phrases2":[{"en":"therefore → apply to fruits Unhealthy sugar is normally found in desserts","zh":"因此，这也适用于水果；不健康的糖通常存在于甜点中"},{"en":"but → in this case they have been removed from their naturally","zh":"但在这种情况下，它们已从天然形态中被去除"},{"en":"but → better","zh":"但直接吃水果更好"},{"en":"because → process it easily","zh":"因为人体能轻松处理它"},{"en":"because → is the same as drinking soft drinks","zh":"因为这与喝汽水一样"}]},{"id":4452,"name":"Globalization","phrases":["so → one way of thinking about globalization is a way","so → the source of growth in travel and communication and corporate","when → the Europeans went to the Orient","though → is an economic system"],"eng":"Globalization, what is globalization? I think that it takes on a few different definitions in one sense of the word. Globalization means proliferation of transactions across country. So, one way of thinking about globalization is a way to describe, increase international communications, more trade happening between countries and be less self-sufficient in providing goods and services to their people and more companies that have offices in multiple countries, which we call multinationals. So, the source of growth in travel and communication and corporate trade across borders. And this way of thinking about globalization is the continuation of thinking that has been around for a long time, such as when the Europeans went to the Orient, to find spices, which was also an example of global trade and communication. Another way to think of globalization though, is an economic system. It is a system in which countries become integrated in a way that never had been before. In this system, we see a global split in the process between consuming and producing goods. Some countries produce goods, some countries consume goods, and then these countries in different areas of the globe depend on each other in a kind of organic solidarity rather than having an economic system being just inside your country. The system is the way economy in your country functions depends on economy of another country. And in fact this way of thinking about globalization represents a new area of economic progression. The past industrialist economy has been a global issue.","ref":"The lecture defines globalization from two perspectives. First, it refers to the proliferation of cross-border transactions, including increased international trade, communication, and multinational companies. Second, it functions as an integrated economic system characterized by a global division between producing and consuming goods. Ultimately, this mutual dependence among countries represents a new stage of economic progression compared to past industrial economies.","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693684/01ad1f4ca2904cca99fccb1b969b60ed.mp3","phrases2":[{"en":"so → one way of thinking about globalization is a way","zh":"因此，思考全球化的一种方式就是……"},{"en":"so → the source of growth in travel and communication and corporate","zh":"因此，旅行、通信和企业增长的动力来源"},{"en":"when → the Europeans went to the Orient","zh":"当欧洲人前往东方时"},{"en":"though → is an economic system","zh":"尽管是一种经济体系，它也是一种体系"}]},{"id":4454,"name":"Governments use tricks","phrases":["but → be plenty of societies","especially → the unelected ones but also some elected ones","but → also some elected ones have denied the events"],"eng":"I suppose it's the truism to point out that citizens need to be well-informed. Maybe it's something we take for granted in our liberal western democracies. But there will be plenty of societies, well, that is run counter to explicit government policy. Many areas of the world still suffer from the reverie of the deliberate missing information. “ ” Governments, especially the unelected ones, but also some elected ones, have denied the events that have ever taken place. They pretend that other events did take place. They would help spin what they cannot deny. Ensure they've used every trick of the book, to pull the eyes of the world, and in an attempt to cover up their mistakes.","ref":"The lecture highlights the fundamental importance of well-informed citizens and strongly criticizes governments that deliberately withhold information. Instead of providing the truth, these regimes use various deceptive tricks to cover up their mistakes. Specifically, they deny actual events, fabricate false ones, and spin undeniable facts. Ultimately, these strategies aim to mislead the public and distract the world from their wrongdoings.","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693687/c66ab146085f49b2883c4c45fd647efc.mp3","phrases2":[{"en":"but → be plenty of societies","zh":"但会有很多社会"},{"en":"especially → the unelected ones but also some elected ones","zh":"尤其是非选举产生的，但也有一些选举产生的"},{"en":"but → also some elected ones have denied the events","zh":"但也有一些当选者否认了已经发生的事件"}]},{"id":4464,"name":"Hook sentence","phrases":["if → searching for a book or article to read","if → want to wow your teacher","especially → the first couple of sentences"],"eng":"An essay is a chance to identify your read and learned. As a writer, you first need to collect many materials, then write an essay in four or five paragraphs, structures and quotes. If someone is searching for a book or article to read, he or she will decide from the very beginning whether this work is worth attention. If you want to wow your teacher, polish the introduction, especially the first couple of sentences. Add an essay hook — something interesting, funny, shocking, or intriguing to win the reader's attention. —— Build an emotional connection with your reader right from the start. A hook in the essay is a catchy sentence or paragraph in the impressive introduction which serves as an attention element and an important part. “ ” An excellent hook sentence is engaging and interesting; it is a perfect method to start an argumentative or persuasive essay. The hook for your essay often appears in the first sentence. The opening paragraph includes a thesis sentence. Some popular hook choices can include using an interesting quote, a little-known fact, famous last words, or a statistic.","ref":"An essay is a chance to identify your read and learned. If you want to wow your teacher and attract readers’ attention, polish the introduction by adding an essay hook. A hook is a catchy sentence or paragraph in the introduction, which is engaging and interesting. Some popular hook choices include using an interesting quote or a statistic.","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693062/3e1641c96107478eabd7d410b519ad6f.mp3","phrases2":[{"en":"if → searching for a book or article to read","zh":"如果有人想找本书或文章来读"},{"en":"if → want to wow your teacher","zh":"如果你想惊艳你的老师"},{"en":"especially → the first couple of sentences","zh":"尤其是开头的几句话"}]},{"id":2142,"name":"Iconoclast","phrases":["so → moving on with our studies on innovative thinkers","but → in a business context an iconoclast can be indispensable","if → are increasingly exposed"],"eng":"So moving on with our studies on innovative thinkers, let's now consider the iconoclast. “ ” An iconoclast can be defined someone who challenges established ideas and beliefs. Put simply, it's someone who hasn't stopped asking that vital question, why the term iconoclast is often used negatively. “ ” “ ” But in a business context, an iconoclast can be indispensable. The fact that they ask this question of established procedures and methods means that they may be able to uncover chinks in a company's armor and find efficiencies that their colleagues are oblivious to. It has long been known that your average person tends to stop questioning something if they are increasingly exposed to it. Iconoclasts may see through this with searing clarity and are unlikely to tolerate continued exposure. Rather than force them to conform, businesses do well to listen to them.","ref":"An iconoclast is someone who challenges established ideas and beliefs. This can be seen as a negative but in business it should be valued. lconoclasts ask the simple question “Why?” and they will not accept things like other people do. In fact, they spot changes that can be made to make a business more efficient. Businesses should listen to them and not try to change them.","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658781/a3676c7b1f8a4acc82ef108e322ad851.mp3","phrases2":[{"en":"so → moving on with our studies on innovative thinkers","zh":"那么继续我们对创新思想者的研究"},{"en":"but → in a business context an iconoclast can be indispensable","zh":"但在商业环境中，反传统者可能不可或缺"},{"en":"if → are increasingly exposed","zh":"如果他们接触得越来越多"}]},{"id":3794,"name":"Implicit and explicit memory","phrases":["so → I'm going to talk a little bit briefly about different","so → kind of understanding how you're supposed to behave in a","when → walk into a restaurant","but → it's not necessarily something that we think about","but → now they just come very easily and automatically to us","if → actually try to describe to somebody how you drive","so → in a lot of cases","when → we're talking about our memory"],"eng":"So I'm going to talk a little bit briefly about different systems of memory. And in fact, much of the memory that influences and guides our everyday life actually kind of hides in the background. You actually don't know that you're using the bulk of your memory. And this is called implicit or procedural memory. This includes things like cultural and social norms. So kind of understanding how you're supposed to behave in a classroom or expecting a certain thing to happen when you walk into a restaurant. These are all things that we've learned and acquired over our years, but it's not necessarily something that we think about. Language also, in many aspects, is something that is fairly automatic and that we've acquired and use very naturally, and other learned skills such as reading or driving. These are things that might have been effortful at one time, but now they just come very easily and automatically to us. And in fact, if you actually try to describe to somebody how you drive or how to drive, you actually kind of mix you up. So these are in a lot of cases, consciousness kind of gets in the way of a lot of these aspects of implicit memory. Now, when we're talking about our memory, so for instance, people tell me a lot that their memories are bad. “ ” When people are saying when they talk about their memory, they're usually talking about explicit or episodic memory. And these are very different from implicit memories. These are memories that have a very specific tag of space and time. These are highly personal memories, usually. So this could be everything from remembering what you ate for breakfast to what you did on your last vacation, or remembering a significant birthday that you had several years ago, or... Or just an answer to a multiple choice question on a test. ……","ref":"Implicit memory and explicit memory are the two main types of memory. Implicit memory is also called procedural memory and cannot be consciously recalled. Implicit memory is about cultural and social background, such as using language naturally or driving automatically. Explicit memory is also known as episodic memory, related to personal life experiences. It is about time and space, such as remembering birthdays or answering questions in a test.","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691690/82afaea0935c441ba323b7e59285e036.mp3","phrases2":[{"en":"so → I'm going to talk a little bit briefly about different","zh":"所以我要稍微简短地谈一谈不同的……"},{"en":"so → kind of understanding how you're supposed to behave in a","zh":"所以要大致理解在……中你该如何表现"},{"en":"when → walk into a restaurant","zh":"当你走进一家餐厅时"},{"en":"but → it's not necessarily something that we think about","zh":"但这未必是我们会去思考的事"},{"en":"but → now they just come very easily and automatically to us","zh":"但现在它们对我们来说来得轻而易举、自然而然"},{"en":"if → actually try to describe to somebody how you drive","zh":"如果你真的试着向别人描述你是怎么开车的"},{"en":"so → in a lot of cases","zh":"所以这些在很多情况下……"},{"en":"when → we're talking about our memory","zh":"当我们谈到自己的记忆时"}]},{"id":4455,"name":"Indian peasants' debt","phrases":["so → high it’s two hundred thousand rupees","when → accumulate that kind of debt","since → are talking about peasants"],"eng":"The debt today is so high, it’s two hundred thousand rupees, three hundred thousand rupees of peasant who have no capital. 如今农民的债务高得惊人，往往是二十万、三十万卢比，而他们根本没有资本。 They who know within a year or two, when they accumulate that kind of debt. 他们自己也清楚，在一两年内就会积累起如此巨额的债务。 Where is the debt coming from? 这些债务从何而来？ It's coming from a seed that is costing a hundred thousand to two hundred thousand rupees per kilogram, depending on what you got. 它源于高价种子——每公斤要价十万到二十万卢比，具体价格取决于种类。 Seeds that used to be free, used to be theirs. 这些种子过去是免费的，原本属于他们自己。 Pesticides each time, the more they use, the more they have to use, 12 sprays, 15 sprays, 20 sprays. 而农药也是如此，用得越多，就必须用得更多，从十二次喷洒到十五次，再到二十次。 Pesticides used in just the last five years in the land areas of India has shown up by 2000 percent. 在过去五年间，印度耕地上的农药使用量暴涨了2000%。 That’s why the free market and globalization have brought and since we are talking about peasants, who have no money, who have no capital, they can only buy expensive seeds and expensive pesticides by borrowing. 这就是所谓自由市场和全球化带来的结果，而我们说的是农民——他们既无资金又无资本，只能靠借债购买昂贵的种子和农药。 And who lend that money? 那么，这笔钱是谁借给他们的呢？ The seed companies that sell the pesticides, which are the same companies that sell the seeds, as you know, are now also the major creditors. 正是那些销售农药和种子的种子公司，而你知道，这些公司如今也是主要的债权人。","ref":"The lecture explains the severe debt crisis among Indian peasants caused by the high costs of commercial seeds and pesticides. Driven by globalization, farmers lack capital and must borrow money to buy these expensive agricultural materials. Consequently, the seed and pesticide companies act as both sellers and major creditors, trapping the peasants in a continuous cycle of debt.","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693693/2a44a164f977496aba3ab39a54d72e93.mp3","phrases2":[{"en":"so → high it’s two hundred thousand rupees","zh":"高达二十万卢比"},{"en":"when → accumulate that kind of debt","zh":"当他们累积那种债务时"},{"en":"since → are talking about peasants","zh":"既然我们说的是农民"}]},{"id":4446,"name":"International environmental law","phrases":["although → governed by 'self-regulation' in the form of guilds","however → mostl
