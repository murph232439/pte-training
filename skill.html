 Skoog uses software and sensors, so the computer makes the sound. Therefore, it is designed to be touched and played with. It was developed with feedback from kids in schools. This helps them create their own music instead of just listening. 这场讲座讲的是Skoog，一种全新的通用无障碍乐器。它柔软、易于演奏，并且可以为任何人定制，特别是有特殊需要的儿童。与传统乐器不同，Skoog使用软件和传感器，所以由电脑来发出声音。因此，它被专门设计成用于触摸和弹奏。它是在学校孩子们的反馈下开发出来的。这帮助他们创作自己的音乐，而不仅仅是聆听。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693310/601c3a3d0ba241029ae8b342aff1b3c7.mp3","phrases2":[{"en":"because → of the sound that they need to make","zh":"因为他们需要发出的声音"},{"en":"if → want to make a sound like a plucked string","zh":"如果你想发出像拨弦一样的声音"},{"en":"whereas → with a Skoog because it's a mixture of software","zh":"而使用Skoog时，因为它融合了软件"},{"en":"because → it's a mixture of software and a sensor","zh":"因为它融合了软件和传感器"},{"en":"thus → handle making the sound","zh":"因此计算机可以负责发声"},{"en":"so → can design an object that's designed to be touched","zh":"所以我们可以设计一个专为触摸而设计的物体"},{"en":"so → enriching and it's really inspiring to actually work","zh":"如此充实，真正去做也真的很鼓舞人心"},{"en":"when → can provide them with an ability to start","zh":"当你能让他们有能力开始时"}]},{"id":3370,"name":"A ship","phrases":["but → by reading her compass bearing and headway","because → too many shipwrecks behind us","since → depend on the wisdom of our","so → far by trial and error","so → a luxury we can no longer"],"eng":"\"Our civilization, which subsumes most of its predecessors, is a great ship steaming at speed into the future. “ It travels faster, further, and more laden than any before. We may not be able to foresee every reef and hazard, but by reading her compass bearing and headway, by understanding her design, her safety record, and the abilities of her crew, we can, I think, plot a wise course between the narrows and bergs looming ahead. And I believe we must do this without delay, because there are too many shipwrecks behind us. The vessel we are now aboard is not merely the biggest of all time; it is also the only one left. The future of everything we have accomplished since our intelligence evolved will depend on the wisdom of our actions over the next few years. Like all creatures, humans have made their way in the world so far by trial and error; unlike other creatures, we have a presence so colossal that error is a luxury we can no longer afford. The world has grown too small to forgive us any big mistakes.\" \"","ref":"This lecture talks about human’s civilization, which is a ship driving into the future. Firstly, by understanding the features of the ship, including compass and crew, people should find a wise course without delay. Secondly, the civilization ship is the biggest and the only one in our time. Human’s future depends on the wisdom of our actions. Thirdly, humans make achievements through trial and error like other creatures, but unlike creatures, humans cannot afford errors now. In conclusion, the world is small and humans cannot afford big mistakes. 这个讲座讲的是人类的文明，这是一艘驶向未来的船。首先，通过了解船的特点，包括指南针和船员，人们应该找到一个明智的路线，而不是拖延。第二，这艘文明船是我们这个时代最大的也是唯一的一艘。人类的未来取决于我们行动的智慧。第三，人类像其他生物一样通过试错来取得成就，但与其他生物不同的是，人类现在不能承受错误。总之，世界很小，人类不能犯大错误。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690261/591d4fa40876480ab950000b3d3f2ec1.mp3","phrases2":[{"en":"but → by reading her compass bearing and headway","zh":"但通过读取她的罗盘方位与航速"},{"en":"because → too many shipwrecks behind us","zh":"因为我们身后有太多沉船"},{"en":"since → depend on the wisdom of our","zh":"既然我们智力的进化将取决于我们……的智慧"},{"en":"so → far by trial and error","zh":"迄今为止靠试错"},{"en":"so → a luxury we can no longer","zh":"如此巨大，以致错误是我们再也无法承受的奢侈"}]},{"id":2551,"name":"A successful entrepreneur","phrases":["but → the definition of a good idea varies depending on whom","which means → thought about","but → this doesn't mean they can't be unique","thus → adds on to the basic idea","when → transcends its predecessor and serves its purpose in a"],"eng":"To be a successful entrepreneur, you should have good ideas, but the definition of a good idea varies depending on whom you ask. “ ” A great idea should have several features. Firstly, the great idea should be various and novel. Secondly, the great idea should be unique, which means no one has thought about it. Thirdly, it is essential for great ideas to be transformative and productive. All ideas are essentially a combination of other smaller ideas, but this doesn't mean they can't be unique. Merely copying doesn't make anything idiosyncratic, it's the individuality that one puts in which makes a concept stand out. Constant innovation leaves no room for stagnation and thus, adds on to the basic idea, effectively making it unique. Unique ideas are inspired by basic things, they are simply extensions of pre-existing notions. And, an idea or a concept is unique only when it transcends its predecessor and serves its purpose in a better and more precise way.","ref":"The lecture mainly talks about good ideas. According to the lecture, a great idea should have several features. Firstly, the great idea should be various and novel. Secondly, the great idea should be unique, which means no one has thought about it. Thirdly, great ideas need to be transformative and productive. Finally, unique ideas are inspired by basic things. 这一讲座主要讲述了伟大创意。根据讲座，一个伟大的创意应该具备几个特点。首先，它应该是多样的和新颖的。其次，它应该是独特的，这意味着没有人曾想到过它。第三，伟大的创意需要兼具变革力量和生产潜力。最后，独特的创意往往受到基本事物的启发。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678141/0dd508cd6ab24ab1b7a08544d3286531.mp3","phrases2":[{"en":"but → the definition of a good idea varies depending on whom","zh":"但好点子的定义取决于对谁而言"},{"en":"which means → thought about","zh":"这意味着没人考虑过"},{"en":"but → this doesn't mean they can't be unique","zh":"但这并不意味着它们不能独一无二"},{"en":"thus → adds on to the basic idea","zh":"因此是对基本想法的补充"},{"en":"when → transcends its predecessor and serves its purpose in a","zh":"当它超越前身并在某种……中发挥其作用时"}]},{"id":4277,"name":"A survey","phrases":["if → I'm asking which source do you often use to get","but → what if I tell you this survey is conducted","if → I tell you this survey is conducted on the website","because → this survey on this website must","so → pay attention to how a survey is"],"eng":"Let's say if I'm asking which source do you often use to get your information—newspaper? Radio? TV? —— The survey shows 62 of the people chose the Internet. 62% You might be thinking I’m going to say, how important the Internet is or how quickly it has changed the world for a few years. But what if I tell you this survey is conducted on the website globalandmail.com? globalandmail.com Our answer will be different. Because the people who did this survey on this website must be frequent users of Internet. This sample is a biased sample. So we have to pay attention to how a survey is conducted.","ref":"The lecture uses a hypothetical survey to illustrate sampling bias. While 62% of respondents in an online poll chose “Internet” as their primary news source, the survey’s design (conducted on globalandmail.com) means results only reflect heavy Internet users, not the general population. This highlights the critical role of methodology in ensuring valid conclusions. 讲座通过一个假设性调查案例阐释样本偏差问题。尽管在线调查显示62%的受访者将“互联网”作为主要新闻来源，但由于调查仅在globalandmail.com网站进行，结果仅反映重度互联网用户的行为，无法代表整体人群。这凸显了研究方法对结论可靠性的关键影响。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693309/b5696af004094ded8773570f49f357dc.mp3","phrases2":[{"en":"if → I'm asking which source do you often use to get","zh":"如果我问你经常使用哪个来源来获取"},{"en":"but → what if I tell you this survey is conducted","zh":"但如果我告诉你这项调查是在……进行的"},{"en":"if → I tell you this survey is conducted on the website","zh":"如果我告诉你这项调查是在网站上进行的"},{"en":"because → this survey on this website must","zh":"因为在这个网站上做这项调查的人一定……"},{"en":"so → pay attention to how a survey is","zh":"所以我们必须注意一项调查是如何……"}]},{"id":3380,"name":"A survey with 100 CEO","phrases":["according to → 58 of those we surveyed"],"eng":"In our survey, over a hundred CEOs who had recently been through an acquisition or merger were asked which areas of their activities needed the most effort. As you can see, the most frequent response to this question was that information technology requires the most integration effort. According to 58 of those we surveyed, IT was the most time-consuming and needed the most work. 58 IT This is understandable as many of the IT issues are extremely complex and the consequences of any change in IT can have a significant impact. IT IT The key is how quickly and effectively IT integration can be achieved. IT And there has to be a clear understanding of the consequences there may be of not getting it right. The two other areas requiring significant attention: sales, marketing and business development on the one hand, and financial management on the other both were selected by 49 of the respondents. —— / / 49 49 ——","ref":"The lecture mainly talks about a survey with 100 CEO. In the beginning of the lecture, the speaker mentioned that the survey is about which area of activity should contribute most effort. He further discussed that the result from the survey is IT, because IT make a huge influence on our society. And it is time consuming and complex. At the end of the lectures, he concluded that other two are marketing of sales and financial management and they are equally important. 讲座主要讲述了一项针对 100 名 CEO 的调查。讲座一开始，主讲人就提到，这项调查是关于哪个领域的活动应做出最大努力。他进一步谈到，调查的结果是信息技术，因为信息技术对我们的社会影响巨大。而这是一项耗时且复杂的工作。讲座结束时，他总结说，其他两个领域是销售市场和财务管理，它们同样重要。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690271/a820745fa5fe4298881ec0ead310ca81.mp3","phrases2":[{"en":"according to → 58 of those we surveyed","zh":"据58名受访者称"}]},{"id":2553,"name":"Alaska","phrases":["since → suffering from mental illnesses and alcohol abuse","so → being taken care of by others or","therefore → can conclude that Alaskan natives are losing hold","so → can see how serious the issue is"],"eng":"One of the social issues faced by the state of Alaska is the lack of mental and emotional well-being of the native Alaskans. It is very unfortunate that many of the Native Americans are living under poor conditions throughout the country. In the cases of native Alaskans, even virtually entire villages are suffering from a lack of mental and emotional well-being, which includes continuing poor physical and mental health. Alcohol abuse, domestic violence, homicides, and suicides are frequent among them, which of course, lead to families falling apart. It is tragic to see that many children are abused and not educated properly. As a matter of fact, the children themselves are abusing alcohol and other chemicals, and the rate is increasing over time. Since parents are suffering from mental illnesses and alcohol abuse, they can't take care of their children. So many children are being taken care of by others or simply neglected. Therefore, we can conclude that Alaskan natives are losing hold of their communities, cultural identities, and most importantly, their childhoods. So you can see how serious the issue is. Plus, rather than making a living for themselves, they are depending on public services and subsidies. They have lost control of and responsibility for their economy and governing institutions.","ref":"The lecture talks about social issues. According to the lecture, native Alaskans are suffering from a lack of mental and emotional well-being. This is because many of the Native Americans are living under poor conditions, and alcohol abuse, domestic violence, homicides, and suicides are frequent among them, which of course, lead to families falling apart. In conclusion, Alaskan natives are losing hold of their communities, cultural identities, and most importantly, their childhoods. 这一讲座讲述了社会问题。根据讲座，阿拉斯加土著人正遭受心理和情感健康的困扰。这是因为许多土著美国人在恶劣生存条件下挣扎，酗酒、家庭暴力、凶杀和自杀在他们当中频繁发生，这当然导致家庭破裂。总之，阿拉斯加土著人正在失去他们的社区、文化身份，以及最重要的童年。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678139/187d73a6c491475792b6d7fcd6fd0283.mp3","phrases2":[{"en":"since → suffering from mental illnesses and alcohol abuse","zh":"由于父母深受精神疾病和酗酒之苦"},{"en":"so → being taken care of by others or","zh":"所以许多孩子正由他人照看，或者"},{"en":"therefore → can conclude that Alaskan natives are losing hold","zh":"因此我们可以得出结论：阿拉斯加原住民正逐渐失去掌控"},{"en":"so → can see how serious the issue is","zh":"所以你能看出这个问题有多严重"}]},{"id":3355,"name":"Animal behavior","phrases":[],"eng":"We can ask two fundamental questions about animal behavior, they referred to as proximate and ultimate. Proximate questions are those concerned with the mechanisms that bring about behavior, ultimate questions are those concerned with the evolution of behavior. We can divide the proximate and ultimate questions into two sub-questions. For proximate, how does the behavior develop, and secondly what causes the behavior. For ultimate, you can ask how did the behavior evolve, and secondly what is the adaptive significance of the behavior, what’s the purpose. Together these comprise what are called Tinbergen's four questions about animal behavior. Niko Tinbergen was one of the founding fathers of the study of animal behavior. · These questions represent the different ways of studying animal behavior and understanding the difference between those four questions are fundamental to understanding behavior and indeed the whole of biology. How do we study animal behavior well that depends on the type of question we’re hoping to answer.","ref":"Two fundamental questions about animal behavior are referred to as proximate and ultimate. Proximate questions are those concerned with the mechanisms that bring about behavior. The ultimate questions are those concerned with the evolution of behavior. Two sub-questions are how does the behavior develop, and secondly what causes the behavior. For ultimate, you can ask how did the behavior evolve, and what is the adaptive significance of the behavior. Together these comprise four questions about animal behavior. 关于动物行为有两个基本问题，分别被称为近因问题和远因问题。近因问题关注的是导致行为发生的机制，而远因问题则关注行为的演化。近因问题的两个子问题是：行为是如何发展的？其次，是什么导致了这种行为？对于远因问题，可以问：这种行为是如何演化来的？以及这种行为的适应意义是什么？这四个问题合起来构成了关于动物行为的四个基本问题。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690244/31209e7b2b0d403b9a04d7ac80861df5.mp3","phrases2":[]},{"id":3348,"name":"Animal behavior V2","phrases":["because → are interested in understanding why animals do what","if → they’re going to save them","yet → his research eventually led to a complete overhaul of the","yet → utterly monumental effect And this is the course textbook"],"eng":"Why should we bother studying animal behavior? Well, first and foremost, because we are interested in understanding why animals do what they do. There are lots of other reasons for studying animal behavior. Conservation biologists need to know what animals do if they’re going to save them. Are those animals social or solitary? How much space do they need and how many mates do they have? Sometimes you can’t predict the outcome of the research. Fernando Nottebohm started out being interested in how birds know what to sing. · Yet his research eventually led to a complete overhaul of the entire field of neurobiology, a totally unanticipated yet utterly monumental effect. And this is the course textbook by John Alcock the fact that this is in its ninth edition tells you how fast an afield animal behavior is. · John Alcock There are lots of new developments.","ref":"The reason why we study animal behavior is because we are interested in understanding why animals do what they do. Conservation biologists need to know what animals do if they’re going to save them. Fernando started out a research and it led to a complete overhaul of the entire field of neurobiology. And John tells you how fast an afield animal behavior is in his book. There are lots of new developments. 我们研究动物行为的原因是因为我们有兴趣理解动物为何会做出某种行为。保护生物学家如果要拯救动物，就需要知道它们的行为。费尔南多开始了他的研究，并促使了整个神经生物学领域的彻底改革。约翰在他的书中讲述了动物行为领域发展有多么迅速，事实上，这个领域有许多新的进展。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690235/5e1b588016bb4a6792d1a71d6366e8f7.mp3","phrases2":[{"en":"because → are interested in understanding why animals do what","zh":"因为我们想了解动物为何会这样做"},{"en":"if → they’re going to save them","zh":"如果他们想要拯救它们"},{"en":"yet → his research eventually led to a complete overhaul of the","zh":"然而他的研究最终促成了对……的彻底改革"},{"en":"yet → utterly monumental effect And this is the course textbook","zh":"然而影响极其重大，而这就是课程教材"}]},{"id":4282,"name":"Architecture","phrases":["because → what he began doing was bulldozing Old Paris"],"eng":"The most visible manifestation of this wealth was a series of grand projects begun by Napoleon III, mainly in Paris. Soon after he came to power in the 1850s, he said, “I want to be a second Augustus,” making reference to the Emperor Augustus's claim that he'd found Rome a city of brick and left it one of marble. 19 50 “ ” In the case of Napoleon III, he found Paris in 1851 a city of cobblestones and twisting medieval streets, and he left it one of asphalt and macadam. 1851 Because what he began doing was bulldozing Old Paris—the ancient, medieval part of Paris—and replacing it with wide new boulevards: 85 miles of them, which he lit with some 20,000 gas lamps (which took out all the old 18th-century oil lamps, replacing them with gas, which gave a much cleaner, brighter, regular light). —— —— 85 2 18 Also, 50,000 trees are planted alongside them—many of them the chestnut trees that we now think of as synonymous with Paris. 5 —— And he drained the streets with 200 miles of sewers: these new, famous Parisian sewers beneath the streets, thereby making the city a much safer, more pleasant place to wander, to stroll, to people-watch, to have coffee or absinthe in the cafés. 200 ——","ref":"The lecture discusses Napoleon III's grand projects to transform Paris in the 1850s. He wanted to be like Emperor Augustus, turning a city of cobblestones into one of asphalt. He replaced old medieval streets with 85 miles of wide new boulevards. These were lit by 20,000 gas lamps and lined with 50,000 trees. He also built 200 miles of sewers. As a result, Paris became a much safer and more pleasant place for people to stroll and enjoy café life. 这场讲座讨论了拿破仑三世在19世纪50年代改造巴黎的宏伟工程。他想效仿奥古斯都皇帝，将一座鹅卵石城市变成沥青城市。他用85英里宽阔的新大道取代了古老的中世纪街道。这些大道由2万盏煤气灯照明，并种植了5万棵树。他还修建了200英里的下水道。因此，巴黎变成了一个更安全、更宜人的地方，供人们漫步和享受咖啡馆生活。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693314/c2d49812f36444ef99f493891523c914.mp3","phrases2":[{"en":"because → what he began doing was bulldozing Old Paris","zh":"因为他开始做的就是铲平旧巴黎"}]},{"id":3349,"name":"Arctic and Antarctic","phrases":["so → talk about the polar regions","when → talk about the polar regions","so → named after the Greek word for bear","so → look at the Arctic first of all","if → look at the Arctic first of all","so → can see here this is the UK down here","so → a bit of land cover in our ice"],"eng":"So, when we talk about the polar regions, just to clarify exactly what we mean. And we have first of all the Arctic at the top of the earth and the Antarctic at the bottom, and so the Arctic was named after the Greek word for bear. “ ” Now surprisingly it’s not after the polar bears that live in the Antarctic or live in the Arctic and based on it’s after the little and great bear constellations that can be seen in the sky. Now the Greeks also hypothesize that there would be the Anti-arctic, which is how we get the name Antarctica and of course it wasn’t discovered until much later on. “ ” “ ” Now these regions are opposite in many ways other than just their names and their location on the globe, and so if we look at the Arctic first of all, and the Arctic is actually ocean surrounded by land, and so you can see here this is the UK down here and this kind of Russia and then American Canada around here, and so there is a bit of land cover in our ice on the top in the Arctic, which is Greenland here and Macie all this area here. Surprisingly a lot of people don’t realize that this isn’t actually land. The north pole isn’t on land. It’s just one big ocean.","ref":"The lecture mainly talks about the polar regions, including Arctic and Antarctic. Moreover, they located at the top and bottom of the earth, and so the Arctic was named after the Greek word for bear. The lecture also mentions that now the Greek hypothesize that there would be the Anti-arctic, and these regions are opposite in many ways other than just their names and their location. Finally, the speaker mentions that the north pole isn’t on land, but it is one big ocean. 本讲座主要探讨了位于地球两端的极地地区——北极与南极。这两片区域分别坐落于地球的顶端与底端，其中\"北极\"的名称源于希腊语中的\"熊\"一词。讲座还提到，根据古希腊人的推测，应当存在一个与北极相对的区域，即\"南极\"。这两个地区除了名称和地理位置相对之外，在许多其他方面也呈现出对立特征。最后，讲者特别指出北极点并非位于陆地上，而是一片广阔的海洋。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690237/2e62defb91714f708f773dc24b6a5fd3.mp3","phrases2":[{"en":"so → talk about the polar regions","zh":"那么，当我们谈到极地地区时"},{"en":"when → talk about the polar regions","zh":"当我们谈到极地地区时"},{"en":"so → named after the Greek word for bear","zh":"那么，北极是以希腊语中表示“熊”的词命名的"},{"en":"so → look at the Arctic first of all","zh":"那么，如果我们先来看北极"},{"en":"if → look at the Arctic first of all","zh":"如果我们先来看北极"},{"en":"so → can see here this is the UK down here","zh":"那么，你可以看到，这下面就是英国"},{"en":"so → a bit of land cover in our ice","zh":"那么，我们的冰层中有一点陆地覆盖"}]},{"id":3365,"name":"Aristotle","phrases":["but → Aristotle says the reason we need rhetoric is we","if → wanna get somebody to the truth","because → not sound and can't see the truth","if → wanna get the general mass there","so → rhetoric"],"eng":"But Aristotle says the reason we need rhetoric is we have to be able to use it. We have to be able to use rhetoric influence, basically, the rebel, and the morons. We try to get them to understand truth. Truth is suggested, is different than rhetoric. Rhetoric is the dressing, is the body, right? Truth is the spirit, is the soul, is abstract. It doesn't have a body. It's not particular. If you wanna get somebody to the truth, you might have to use some kind of tricks. Right? Because most people are not sound and can't see the truth. That's what we think. Most people are ramble. Really. Only the educated be erudite are actually capable of seeing the truth. If you wanna get the general mass there, you may have to do fable a little bit. So Aristotle that is rhetoric. Rhetoric is something that is used to influence people. Right? And it's a kind of mentally promised a logic.","ref":"The lecture explains Aristotle’s view on rhetoric. He argues that rhetoric is necessary because most people can’t grasp abstract truth directly. Truth is like a soul—intangible and universal—while rhetoric acts as the body or tool to present it. According to Aristotle, only educated individuals can understand truth independently. For the general public, who are irrational or easily confused, persuasion techniques like stories or simplified ideas are needed to guide them toward truth. 讲座解释了亚里士多德的修辞学观点。他认为修辞是必要的，因为大多数人不能直接掌握抽象的真理。真理就像灵魂，无形而普遍，而修辞则是呈现它的身体或工具。亚里士多德认为，只有受过教育的人才能独立地理解真理。对于不理性或容易迷惑的普通大众来说，需要故事或简化想法等说服技巧来引导他们走向真理。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690256/f1c59e5851b7491da9ac0f485d6c5265.mp3","phrases2":[{"en":"but → Aristotle says the reason we need rhetoric is we","zh":"但亚里士多德说，我们需要修辞学，是因为我们拥有"},{"en":"if → wanna get somebody to the truth","zh":"如果你想让某人认识真理"},{"en":"because → not sound and can't see the truth","zh":"因为大多数人并不健全，看不清真理"},{"en":"if → wanna get the general mass there","zh":"如果你想让普通大众也到达那里"},{"en":"so → rhetoric","zh":"所以亚里士多德说，那就是修辞学；修辞学是一种被使用的东西"}]},{"id":3376,"name":"Australian city","phrases":["since → a broad territory","so → on","however → not affect its status to be the largest"],"eng":"Australia's location is important for the world's export, and its international trade is also very important. Since Australia has a broad territory, all towns are scattered around. There is a huge expense for transportation for trains and ferries. The government also pays large amount for its telecommunication to build up the connection among regions. The Australian people are mainly living in five cities, and they are Melbourne, Sydney, Perth, Brisbane and so on. The most special one is Perth, which is one of the most isolated cities in the world. —— However, this does not affect its status to be the largest city in Australia. Most large companies, like the two leading companies, Telstra and Qantas, are all based in Perth. Telstra Qantas","ref":"This lecture talks about Australia. According to the speaker, he has mentioned some points of view. Australia’s location is important for the world’s export. Its international trade is also important. Since Australia has a broad territory. The Australian people are mainly living in 5 cities which are Melbourne, Sydney, Brisbane, Perth and so on. Perth is one of the most isolated city in the world and there are two leading companies such as Telstra and Qantas which are based in Perth. 本讲座的主题是澳大利亚。演讲者提到了一些观点。澳大利亚的地理位置对世界出口非常重要。其国际贸易也很重要。澳大利亚幅员辽阔。澳大利亚人主要居住在墨尔本、悉尼、布里斯班、珀斯等五个城市。珀斯是世界上最偏僻的城市之一，有两家领先的公司，如 Telstra 和 Qantas 都设在珀斯。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690267/3549e9fd5cc44347879277505f8a533a.mp3","phrases2":[{"en":"since → a broad territory","zh":"由于澳大利亚幅员辽阔"},{"en":"so → on","zh":"所以，其中最特别的是珀斯"},{"en":"however → not affect its status to be the largest","zh":"然而，这并不影响其最大地位"}]},{"id":1593,"name":"Baby brain","phrases":["when → born its brain is already a quarter","but → does a baby start to learn","when → does a baby start to learn","when → is born though it will start learning very quickly","though → will start learning very quickly","but → to watch and listen","when → baby takes its first step","when → about 9 months old"],"eng":"When a baby is born, its brain is already a quarter of its final size. But when does a baby start to learn? Well, experts believe that a baby is learning even before it is born. When it is born, though, it will start learning very quickly, much more quickly than an adult. At the beginning, the baby listens and watches all the skills being performed that it needs to learn, such as speaking, walking, playing, eating, and singing. Some parents think that their baby isn't learning, but it is. The baby has to watch and listen to something many times before it can do that thing. For parents, an exciting moment is their baby's first smile. This happens at around 6 weeks old. 6 Another important moment is when baby takes its first step. The earliest this can happen is when the baby is about 9 months old. 9","ref":"The lecture is about babies and how they learn. When a baby is born, its brain is already relatively large and the baby immediately starts learning. It has to learn many skills, such as talking, walking, and playing. It can't do these things until it has watched and listened to someone doing them many times. There are important moments for parents of young babies like the first smile at about six weeks and starting to walk after about 9 months. 讲座是关于婴儿以及他们如何学习的。当婴儿出生时，它的大脑已经相对较大，婴儿立即开始学习。它必须学习许多技能，如说话、走路和玩耍。它不能做这些事情，直到它多次观察和听取别人做这些事情。对于年幼婴儿的父母来说，有一些重要的时刻，比如大约六周时的第一次微笑，大约九个月后开始走路。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658434/ad4d1cf9de4949dfa7f2015a04d8c323.mp3","phrases2":[{"en":"when → born its brain is already a quarter","zh":"婴儿出生时，大脑已有成人的四分之一"},{"en":"but → does a baby start to learn","zh":"但婴儿什么时候开始学习？"},{"en":"when → does a baby start to learn","zh":"婴儿什么时候开始学习？"},{"en":"when → is born though it will start learning very quickly","zh":"不过，婴儿一出生就会很快开始学习"},{"en":"though → will start learning very quickly","zh":"不过它会很快开始学习"},{"en":"but → to watch and listen","zh":"但事实是，婴儿必须观察和倾听"},{"en":"when → baby takes its first step","zh":"当婴儿迈出第一步时"},{"en":"when → about 9 months old","zh":"当婴儿大约9个月大时"}]},{"id":3368,"name":"Bees talks","phrases":["when → foragers returned to the hive they stopped bees dancing"],"eng":"Honey bees do a waggle dance to direct other bees to the sources of nectar. The dancing bees like this one can be halted by a headbutt from another bee. Now research has found that this headbutt is actually a warning signal. A feeding station was set up in the lab to mimic a source of nectar, then foraging bees were introduced to the dangers at the station, such as competition from rival colonies. When foragers returned to the hive they stopped bees dancing. Scientists think the behaviour warns dancers of a dangerous source of nectar.","ref":"Bees perform this strange ritual when they encounter aggressive rival bees, for example, or predatory spiders hanging out at favored foraging spots. When they return to the hive, they headbutt hive mates performing the famous “waggle dance” that directs would-be foragers to rich sources of nectar. By halting their hive mates mid-dance, the scouting bees save them from perilous excursions. 例如，当蜜蜂遇到有攻击性的对手蜜蜂或在自己喜欢的觅食地点闲逛的掠食性蜘蛛时，它们就会进行这种奇怪的仪式。当它们回到蜂巢时，它们会用头撞着蜂巢同伴，表演著名的“摇摆舞”，引导潜在的觅食者找到丰富的花蜜来源。通过阻止正在跳舞的同伴，侦察的蜜蜂将他们从危险的短途旅行中解救出来。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690259/8630016574f74b9b8f3e6747724e45a6.mp3","phrases2":[{"en":"when → foragers returned to the hive they stopped bees dancing","zh":"当觅食蜂返回蜂巢时，它们让蜜蜂停止了跳舞"}]},{"id":4279,"name":"Bilingual kids","phrases":["especially → based on the conceptualization that the","because → ask me if they use two","if → use two languages at home will their child","because → hearing two languages And parents often ask my advice","because → were able to associate each language with the separate","especially → use both languages interchangeable within the same conversation within"],"eng":"The arising concern that a lot of people have about raising children bilingually, especially the preschool year is based on the conceptualization that the human brain at birth is essentially monolingual. And the reason why come to this occasion. Because often the parents will ask me if they use two languages at home will their child be confused, because they hearing two languages. And parents often ask my advice about whether they should use one language on parent role which is widely known that parents who are raising children bilingually. And the reason why most people think this is a good idea is that it will help to reduce the risks of the children being confused. Because they were able to associate each language with the separate speaker. The fear is that both parents use both languages, especially they use both languages interchangeable within the same conversation within the same sentences. The child will not be able to separate the languages.","ref":"The lecture discusses concerns about raising children bilingually, especially during preschool years. Many believe infants’ brains are inherently monolingual, leading parents to worry that hearing two languages at home might confuse their child. To reduce confusion, each parent can consistently uses one language. This helps children associate each language with a specific speaker. 讲座讨论了双语抚养孩子的问题，特别是在学龄前时期。许多人认为婴儿的大脑天生是单语的，这导致父母担心在家里听到两种语言可能会让他们的孩子感到困惑。为了减少混淆，每个家长可以始终使用一种语言。这有助于孩子们将每种语言与特定的说话者联系起来。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693311/8b26cdc9a4e449cab876248cbb81c953.mp3","phrases2":[{"en":"especially → based on the conceptualization that the","zh":"尤其是学前阶段基于这样一种概念："},{"en":"because → ask me if they use two","zh":"因为父母常常会问我，如果他们使用两种……"},{"en":"if → use two languages at home will their child","zh":"如果他们在家里使用两种语言，他们的孩子会……"},{"en":"because → hearing two languages And parents often ask my advice","zh":"因为他们听到两种语言，而且家长常征求我的建议"},{"en":"because → were able to associate each language with the separate","zh":"因为他们能将每种语言与各自独立的……联系起来"},{"en":"especially → use both languages interchangeable within the same conversation within","zh":"尤其是他们在同一段对话中互换使用两种语言"}]},{"id":1580,"name":"Biology","phrases":["for example → I want to talk to you guys about DNA","but → the very first video","since → the very first video","so → let's go ahead and answer that question","because → heard of organisms before","but → the scientific definition of an organism is a living thing","but → whenever we talk about living things","because → to ask yourself 'what is life'"],"eng":"Welcome to your very first tutorial in biology. Now, in this video series what I want to do is I want to talk to you guys about many different topics concerning biology. For example, I want to talk to you guys about DNA and genetics in cells, in bacteria, in life and a whole bunch of interesting stuff. DNA But since this is the very first video, I think what we should do in this video is just stick with the very basics. And the first thing I want to do is talk to you guys about what is biology. So, let's go ahead and answer that question. And the definition of biology is this: the study of life in living organisms. All right, that makes sense up to a certain point up until organisms because you may have heard of organisms before. “ ” And you may have your own definition but the scientific definition of an organism is a living thing. Well, that's easy. We know what living things are. I'm a living thing, plants, grass is a living thing. My puppy named Old Dan, cutest puppy ever, by the way, is a living thing but whenever we talk about living things. Old Dan Believe it or not, things get rid of complicated because then you have to ask yourself 'what is life'. “ ” Well, of course, if you ask your grandma or your best friend or even if you ask a philosopher 'what is life', everyone is going to give you kind of a different definition of their outlook on life. “ ” However, whenever scientists and biologists were first deciding, you know what, what is life? That's the problem that they had everyone had their own separate definition of life itself. So, what they need to do before biology was even invented, which is of course the study of life, is scientists needed to agree on the definition of life.","ref":"The lecture is about biology. Firstly, the speaker talks about DNA and genetics in cells, in bacteria, and in other stuff. The speaker also talks about the definition of biology. That is the study of life in living organisms. Everyone has different ideas about what is life, for example, your grandma or your best friend or even a philosopher will have different answers. Therefore, in the study of life, scientists needed to agree on the definition of life. 这一讲座是关于生物学的。首先，讲者讨论了细胞中的DNA和遗传学，包括细菌以及其他生物体中的遗传物质。讲者还谈到了生物学的定义——即研究生命和生物体。每个人对什么是生命有不同的看法，例如你的奶奶、最好的朋友，甚至一个哲学家都会给出不同的答案。因此，在研究生命时，科学家们需要就生命的定义达成共识。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678153/37052472409644a6a7e84b6b6affebbb.mp3","phrases2":[{"en":"for example → I want to talk to you guys about DNA","zh":"比如，我想和大家聊聊DNA"},{"en":"but → the very first video","zh":"但既然这是第一个视频"},{"en":"since → the very first video","zh":"既然这是第一个视频"},{"en":"so → let's go ahead and answer that question","zh":"那我们就来回答那个问题吧"},{"en":"because → heard of organisms before","zh":"因为你以前可能听说过生物体"},{"en":"but → the scientific definition of an organism is a living thing","zh":"但生物体的科学定义是有生命的东西"},{"en":"but → whenever we talk about living things","zh":"但每当我们谈到生物时"},{"en":"because → to ask yourself 'what is life'","zh":"因为那样你就得问自己“生命是什么”"}]},{"id":1591,"name":"Bystander effect","phrases":["when → there's an emergency situation in public","but → a tendency","so → that ？ Well","instead → of them ， 。 And obviously that can lead","so → brings me to ways that this problem can","but → doesn't address the bystander effect","so → will be more likely to step"],"eng":"In today's session, we're going to look at an important concept in psychology, which is called the bystander effect. 在今天的会议中，我们将探讨心理学中一个重要的概念，即旁观者效应。 When there's an emergency situation in public, you'd hope that a person nearby would intervene and help. 当公共场合出现紧急情况时，你希望附近的人能够介入并提供帮助。 But actually, most people have a tendency to, well, do nothing. 但实际上，大多数人都有一种倾向，嗯，什么都不做。 That's the bystander effect, essentially. 这基本上就是旁观者效应。 And here's the interesting thing. 这就是有趣的事情。 The more people there are in an emergency situation, the less likely it is that anyone will actually intervene. 紧急情况下的人越多，任何人实际干预的可能性就越小。 There's an inverse relationship between the number of bystanders and the amount of help offered. 旁观者的数量与提供的帮助数量之间存在反比关系。 So why is that? 为什么呢？ Well, researchers have identified something called diffusion of responsibility. 研究人员已经确定了一种叫做责任分散的现象。 Basically, everyone just assumes that someone else will take charge of the situation instead of them. 基本上，每个人都假设别人会代替他们负责局势。 And obviously that can lead to potentially serious consequences. 显然这可能会导致潜在的严重后果。 So that brings me to ways that this problem can be tackled. 这就引出了解决这个问题的方法。 Of course, we should be educating people in school and workplaces about basic first aid and what to do in an emergency that will give people more confidence, but that doesn't address the bystander effect. 当然，我们应该在学校和工作场所教育人们关于基本的急救以及在紧急情况下该怎么做，这将给人们更多的信心，但这并没有解决旁观者效应。 Basically, we have to minimize the diffusion of responsibility. 基本上，我们必须尽量减少责任的分散。 And the best way of doing this is by getting people to imagine that they are the only person available to intervene. 最好的方法是让人们想象自己是唯一可以干预的人。 This gives them the responsibility, so they will be more likely to step in. 这赋予了他们责任，因此他们将更有可能介入。","ref":"The bystander effect is when people who witness something that they could and should prevent end up taking no action at all. Research suggests that the higher the number of witnesses, the lower the probability that someone will try to intervene. Psychologists attribute this to diffusion of responsibility because in such situations, everyone is waiting for another person to take action. There are ways that we can reduce the influence of the bystander effect. The key principle is to encourage people to imagine that they are the only person who can take action in a situation. 旁观者效应是指那些目睹了他们可以而且应该阻止的事情的人最终没有采取任何行动。研究表明，证人数量越多，有人试图干预的可能性就越低。心理学家将此归因于责任的分散，因为在这种情况下，每个人都在等待另一个人采取行动。有一些方法可以减少旁观者效应的影响。关键原则是鼓励人们想象自己是唯一能够在某种情况下采取行动的人。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658432/ed3f4a85d45c4d41a28554c008880408.mp3","phrases2":[{"en":"when → there's an emergency situation in public","zh":"当公共场合发生紧急情况时"},{"en":"but → a tendency","zh":"但实际上大多数人都有一种倾向"},{"en":"so → that ？ Well","zh":"那为什么会这样呢？嗯"},{"en":"instead → of them ， 。 And obviously that can lead","zh":"而不是他们。显然，这会导致"},{"en":"so → brings me to ways that this problem can","zh":"所以这就让我想到解决这个问题的办法"},{"en":"but → doesn't address the bystander effect","zh":"但这并没有解决旁观者效应"},{"en":"so → will be more likely to step","zh":"所以他们更有可能介入"}]},{"id":1592,"name":"Canned laughter","phrases":["so → the finished product sounds as if the studio audience is","if → laughing along as the action unfolds","for instance → laugh too loudly or in what producers","when → scenes take place outside a studio","however → also believed to enhance the program itself","when → can hear other people laughing","so → great news for television executives that crave"],"eng":"Today's session is about a feature of TV production called Canned Laughter. A recording of a studio audience laughing inserted into a program so the finished product sounds as if the studio audience is laughing along as the action unfolds. There are several reasons for the use of canned laughter, which we can divide into technical reasons and creative ones. In terms of technical aspects, canned laughter compensates for the unpredictability of live studio audiences. For instance, some individuals might laugh too loudly or in what producers consider to be the wrong places, or they might even clap and cheer, all of which can interfere with the scene. And of course, canned laughter is also needed when scenes take place outside a studio. However, canned laughter is also believed to enhance the program itself. Research has shown that the inclusion of canned laughter can actually change people's perceptions of what they're watching. It's been demonstrated that viewers are more likely to laugh or have a favorable impression of a scene when they can hear other people laughing. So canned laughter is great news for television executives that crave high ratings. Of course, as viewers' tastes in comedy have changed, many shows have moved away from the use of canned laughter. Nevertheless, it remains an effective and familiar aspect of TV comedy.","ref":"Canned laughter is a sound recording of people's laughter, which is added to make it appear as if a live audience is responding directly to the scene, As studio audiences can behave in unexpected ways, canned laughter is a way of getting laughter in the right places and is also used when a scene is shot away from a studio. Research has shown that canned laughter can also make a program seem funnier to viewers. People are more likely to laugh when they hear canned laughter during a program, Use of canned laughter is becoming less common, but it's still an important element of TV comedy in many countries. 罐装笑声是人们笑声的录音，它被添加以使其看起来像是现场观众直接对现场做出反应，因为工作室观众可以以意想不到的方式表现。罐头笑声是一种在正确的地方获得笑声的方式，也可以在场景从工作室拍摄出来时使用。研究表明，罐装笑声还可以使节目对观众来说更有趣。当人们在节目中听到罐装的笑声时，他们更有可能发笑，罐装的笑声正在变得越来越少，但在许多国家，它仍然是电视喜剧的重要组成部分。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658433/c8d040019331450284e2b12df458a18b.mp3","phrases2":[{"en":"so → the finished product sounds as if the studio audience is","zh":"所以最终成品听起来就像现场观众正……"},{"en":"if → laughing along as the action unfolds","zh":"如果随着情节展开，现场观众也跟着笑"},{"en":"for instance → laugh too loudly or in what producers","zh":"例如，有些人可能笑得太大声，或者以制片人……的方式笑"},{"en":"when → scenes take place outside a studio","zh":"当场景发生在演播室外时"},{"en":"however → also believed to enhance the program itself","zh":"然而，罐头笑声也被认为能提升节目本身"},{"en":"when → can hear other people laughing","zh":"当他们听到别人在笑时"},{"en":"so → great news for television executives that crave","zh":"所以，对渴望……的电视高管来说，罐头笑声是个好消息"}]},{"id":1603,"name":"Cave paintings","phrases":["but → they paint And who exactly were these early","instead → painted animals on the walls of their caves","because → very important to them","however → research done on paintings in a cave","because → smaller than men's hands"],"eng":"The world's first artists were ancient people who lived 40000 years ago or more and did cave paintings. 40000 But what did they paint? And who exactly were these early artists? Well, they didn't paint human beings. Instead, they painted animals on the walls of their caves. That's because animals were very important to them. After all, the animals provided them with food and clothing, as well as animals. They put their hands against the cave walls and painted around them. And it's these handprints which may help us to answer the second question, who did the paintings? For a long time, it was believed that it was mostly men. However, research done on paintings in a cave in France has shown that the artists were often women and not just men. We know this because the size of women's hands is smaller than men's hands. In fact, the majority of the hand prints in the French cave were smaller ones. This has made us think again about who the world's first artists really were.","ref":"The world's first artists did cave paintings. They lived maybe as long as 40000 years ago. Instead of people, they painted animals. Animals were important because they used them for food and clothes. They also made hand prints on cave walls by painting around their hands. Research on paintings in a French cave showed that both men and women did them. People used to think the artists were usually men, but women have smaller hands than men, and most handprints in that cave were smaller ones. This is important because we now have to think again about who those early artists were. 世界上最早的艺术家创作了洞穴壁画。他们大概生活在40000年前。他们画的不是人，而是动物。动物很重要，因为它们用它们做食物和衣服。他们还通过在洞穴墙壁上画上手印。对法国一个洞穴中绘画的研究表明，男人和女人都进行过绘画。人们过去认为艺术家通常是男性，但女性的手比男性小，并且那个洞穴中的大多数手印都是较小的。这很重要，因为我们现在必须重新思考那些早期艺术家是谁。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658430/dd33a669d39b4a04b9c74769a6f5b5e6.mp3","phrases2":[{"en":"but → they paint And who exactly were these early","zh":"但他们画了什么呢？这些早期的人究竟是谁？"},{"en":"instead → painted animals on the walls of their caves","zh":"相反，他们在洞穴墙壁上画动物。"},{"en":"because → very important to them","zh":"因为动物对他们非常重要。"},{"en":"however → research done on paintings in a cave","zh":"然而，对法国一处洞穴中绘画的研究已经……"},{"en":"because → smaller than men's hands","zh":"因为女性的手比男性的手小。"}]},{"id":3374,"name":"Chest X-Ray","phrases":["when → see it","for example → or a radiologist's office X And it is a good","so → to look inside and see things that you couldn't see","if → have good eyesight from the distance"],"eng":"This is one picture that you probably you all know what it is when you see it. It's a familiar looking image. It's something that probably we all have some personal experience with,right? This is a chest x-ray that would be taken in your doctor's office, for example, or a radiologist's office. X And it is a good example of Biomedical Engineering and that it takes a physical principle, that is how do x-rays interact with the tissues of your body, and it uses that physics, that physical principle to develop a picture of what's inside your body, so to look inside and see things that you couldn't see without this device. X And you'll recognize some parts of the image, you can see the ribcage here, the bones you can see the heart is the large bright object down here. If you, have good eyesight from the distance,you can seethe vessels leading out of the heart and into the lungs, and the lungs are darker spaces within the ribcage.","ref":"The picture of the x-ray is a good example using the biomedical technology. The x-ray can go through our body, and doctor can look into our bodies, which they cannot do it without the help of x-ray. We can see bones, organs in the x-ray. The doctor can diagnose it, and know what’s wrong with our body. It shows the integration of biomedical technology. x射线的图片是使用生物医学技术的一个很好的例子。x光可以穿过我们的身体，医生可以检查我们的身体，没有x光的帮助他们无法做到这一点。我们可以在x光片中看到骨头和器官。医生可以诊断，知道我们的身体出了什么问题。它展示了生物医学技术的融合。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690265/a5a2692e5bf94f8d8b40aa37cd16d15a.mp3","phrases2":[{"en":"when → see it","zh":"当你看到它时，它是一张看起来很熟悉的图像"},{"en":"for example → or a radiologist's office X And it is a good","zh":"例如，或者放射科医生的办公室 X，而且这很不错"},{"en":"so → to look inside and see things that you couldn't see","zh":"从而观察内部，看到你原本看不到的东西"},{"en":"if → have good eyesight from the distance","zh":"如果你从远处看视力很好"}]},{"id":3353,"name":"Civilization and art","phrases":["when → think about the great civilizations historically","because → built to observe itself and the sophistication","when → were learning to see in a completely different way","so → radical at that time"],"eng":"I have said before that you can’t have a civilization that doesn’t have art when we think about the great civilizations historically. All of them had a great production of culture and art because a society has built to observe itself and the sophistication of the great civilizations was their ability to look at themselves. And what allows a society to do that are the producers of art and culture with mirror back to the core of the society exactly. What is being produced at that moment? How people are thinking of themselves and how individuals are relating to the social structure at that time. Art is the vehicle through which we understand that. Were you to take away art, what would be that mirror? How would we see what we were about? How would we understand what was going on in Paris at the time of the Impressionists when people were learning to see in a completely different way? Pre-cinematography Pierre all of these things are just emerging and here are people looking at the world in a very different way, which was considered so radical at that time.","ref":"This lecture talks about civilization and art. It is impossible to have a civilization without art. Civilization reflects the production of culture and the producers of art and culture should mirror back to the core of the society. People themselves and individuals are relating to the social structure at that time. Art is the vehicle through which we understand that were you to take away art, and it also reflects that how people look at the world in different ways. 这节课讲述了文明与艺术的关系。没有艺术就不可能有文明。文明反映了文化的生产，而艺术和文化的生产者应该将社会的核心反映出来。人们自身以及个体与当时的社会结构之间的关系也在其中体现。艺术是我们理解这一切的媒介。如果没有艺术，我们将无法看到人们如何以不同的方式看待世界。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690242/df80ca77fd2247cda72fbf8724adcdd6.mp3","phrases2":[{"en":"when → think about the great civilizations historically","zh":"当我们从历史角度思考伟大文明时"},{"en":"because → built to observe itself and the sophistication","zh":"因为一个社会已构建出观察自身及其精妙复杂之处"},{"en":"when → were learning to see in a completely different way","zh":"当人们学会以完全不同的方式观看时"},{"en":"so → radical at that time","zh":"在当时如此激进"}]},{"id":3378,"name":"Climate change","phrases":["especially → in Africa","as a result → leads to a continuous decline in food supply annually"],"eng":"Some adverse effects of climate changes to agricultural productions. Some lands are unsuitable for growing crops. There will be millions of people facing hunger in Africa in the near future. Climate change will result in less production and less food. It is difficult for developing countries to deal with climate change due to their financial status and other issues. There are many people living in hunger especially in Africa. The climate change has devastating effects on world economy. The tropical areas on earth are dry and hot, and are originally not suitable for food production. The change of climate leads to extreme weather conditions such as floods and hurricanes, which exacerbates the food production. As a result, it leads to a continuous decline in food supply annually around 10 to 17%. 10%-17% And this trend is perceived to be continuing in the future by 2070. 2070 The regions suffering the most will be some African countries.","ref":"This lecture talks about the influence of climate change. According to the speaker, he has mentioned some points of view. Climate change will make less production and less food. It is difficult for developing countries to deal with climate change due to their financial status and other issues. There are many people living in hungry, especially in Africa. The climate change will also have negative effects on the world economy. 本讲座讲述了气候变化的影响。演讲者提到了一些观点。气候变化将导致减产和粮食减少。由于发展中国家的财政状况和其他问题，它们很难应对气候变化。许多人生活在饥饿之中，尤其是在非洲。气候变化还会对世界经济产生负面影响。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690269/4a34ee05632f44a18a5c11ccd26b2b02.mp3","phrases2":[{"en":"especially → in Africa","zh":"尤其在非洲，气候变化对世界造成毁灭性影响"},{"en":"as a result → leads to a continuous decline in food supply annually","zh":"因此，这导致粮食供应每年持续下降"}]},{"id":3366,"name":"Clouds","phrases":["so → for once you're looking out at over the ocean","so → it's a really good chance that those are loaded","but → go inland you start to have pollution come","if → go inland you start to have pollution come","so → different sources form clouds more effectively than others","so → they're keeping things much much cooler than they would","if → weren't there","so → in actual we're starting to see shifts where having more"],"eng":"There is a lot of interesting. What forms these clouds, why are these clouds there, why do they sort of stick around? At the center, every cloud drop has a particle. You can't grow a cloud drop without having a particle there for the water to condense on. The key question that people not directly address until very recently is what actually forms these clouds. So for once you're looking out at over the ocean, turns out sea spray, sea salt is a very effective nucleus for forming clouds. So it's a really good chance that those are loaded with sea salt. But if you go inland, you start to have pollution come from all kinds of places, and so different sources form clouds more effectively than others, and we're trying to unravel which sources are actually contributing to the clouds. The clouds are incredibly important players in climate change, and that they reflective the white, they reflect the light back into space and so they're keeping things much, much cooler than they would be if they weren't there. They also play huge role in regional weather, so in actual we're starting to see shifts where having more pollution input into the clouds is affecting weather patterns, in particular, is actually reducing the precipitation so we're starting to see drought in areas with super high levels of air pollution.","ref":"The lecture is about clouds.There are a lot of interesting things about clouds.The key question that people not directly address until very recently is what actually forms these clouds.The clouds are incredibly important players in climate change, and that they reflective the white, they reflect the light back into space and so they’re keeping things much, much cooler than they would be if they weren’t there.They also play a huge role in regional weather. 这个讲座是关于云的。关于云有很多有趣的事情。人们直到最近才直接提出的关键问题是，这些云究竟是什么形成的。云在气候变化中扮演着非常重要的角色，它们反射白光，它们将光反射回太空，所以它们使温度比没有它们时低得多。它们在地区天气中也起着巨大的作用。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690257/71d5f54d9b334282be62307c4b7292c7.mp3","phrases2":[{"en":"so → for once you're looking out at over the ocean","zh":"所以这一次，你正眺望着海洋"},{"en":"so → it's a really good chance that those are loaded","zh":"所以那些很可能已满载"},{"en":"but → go inland you start to have pollution come","zh":"但如果你深入内陆，污染就开始出现"},{"en":"if → go inland you start to have pollution come","zh":"如果你深入内陆，污染就开始出现"},{"en":"so → different sources form clouds more effectively than others","zh":"所以不同来源形成云比另一些更有效"},{"en":"so → they're keeping things much much cooler than they would","zh":"所以它们让温度比原本低得多"},{"en":"if → weren't there","zh":"如果它们不在那里，它们也在区域层面发挥巨大作用"},{"en":"so → in actual we're starting to see shifts where having more","zh":"所以实际上，我们开始看到拥有更多……的转变"}]},{"id":1583,"name":"Cosmic Civilization","phrases":["however → most of the planets orbiting these stars are either too","despite → these favorable conditions the chances of life actually appearing are","while → not provide concrete proof of the existence","but → also raises fundamental questions about the origins of life"],"eng":"It begins by stating that every year, seven new stars are formed. However, most of the planets orbiting these stars are either too hot or too cold to sustain life. Only around 20% of all planets meet the necessary criteria to have the possibility of hosting life. 20% Despite these favorable conditions, the chances of life actually appearing are incredibly small, almost close to zero. This has made the search for other cosmic civilizations extremely difficult. Scientists have been tirelessly exploring the vast expanse of the universe, using various methods such as radio signals and telescope observations, in the hope of finding evidence of extraterrestrial life. While the lecture does not provide concrete proof of the existence of other civilizations, it emphasizes the importance of continuing the search. The quest to discover other cosmic civilizations not only helps us understand the universe better but also raises fundamental questions about the origins of life and our place in the cosmos.","ref":"The lecture talks about the possibility of existence of other cosmic civilizations. Every year, 7 stars are formed, but most planets around them are either too hot or too cold to appear life. Only 20% of all planets meet all necessary criteria that have chance to have life. However, the chance of appearance of life is very small, which is close to zero. Even though it is important to continue the search, it is very hard to find other cosmic civilizations. 讲座讨论了其他宇宙文明存在的可能性。每年有7颗新恒星形成，但围绕它们的大多数行星要么太热，要么太冷，无法孕育生命。只有20%的行星满足所有必要条件，才有机会存在生命。然而，生命出现的可能性非常小，几乎接近于零。尽管继续探索其他宇宙文明非常重要，但要找到它们却非常困难。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658438/573e79e98df548d9956c33e945291b0d.mp3","phrases2":[{"en":"however → most of the planets orbiting these stars are either too","zh":"然而，围绕这些恒星运行的大多数行星要么太"},{"en":"despite → these favorable conditions the chances of life actually appearing are","zh":"尽管有这些有利条件，生命实际出现的几率仍然"},{"en":"while → not provide concrete proof of the existence","zh":"虽然讲座没有提供关于存在的确凿证据"},{"en":"but → also raises fundamental questions about the origins of life","zh":"而且还提出了关于生命起源的根本性问题"}]},{"id":1589,"name":"Dietary guidance","phrases":["so → we're putting out public guidance about what we should","when → we're putting out public guidance about what we should","instead → of converting those nutrients into foods like fish","so → on But I think talking about foods rather than nutrients","but → I think talking about foods rather than nutrients is an","but → should help give people a wider view of the"],"eng":"I think there are a lot of confusing messages about health and food out there that don't really help the cause. Look at the most recent debate, fat versus sugar, two things that we know scientifically are of concern. And I think a big problem is that in the field of nutrition science, we look at individual nutrients like fat, carbohydrate, protein, etc., to figure out the metabolic consequences of food. And so when we're putting out public guidance about what we should be eating, we talk in terms of nutrients instead of converting those nutrients into foods like fish, fruit, cookies, and so on. But I think talking about foods rather than nutrients is an important step we need to take. At the same time, we don't have to say to people, you can eat this or you can't eat that, but we should help give people a wider view of the relative proportions of various food groups and dietary patterns on the whole.","ref":"The speaker said that some health messages about food are confusing. For example, there are debates about whether fat or sugar is bad for you, when in fact both are problematic. She said that dietary guidance to the public should shift away from a focus on individual nutrients, such as protein and carbohydrate towards guidelines relating to actual food, for example, meat, vegetables or biscuits. Moreover, the issue isn't about deciding which foods to eat or to abstain from. Instead, it's about eating patterns as a whole and the proportions of the different foods in relation to each other. 演讲者提到，一些关于食物的健康信息令人困惑。例如，人们争论脂肪或糖哪一种有害，而实际上两者皆有问题。她认为，向公众提供的饮食指导应该从关注蛋白质、碳水化合物等单一营养素，转变为关于实际食物的指导，比如肉类、蔬菜或饼干。此外，问题的关键不在于决定哪些食物该吃还是该戒掉，而是在于整体的饮食模式以及不同食物之间的比例关系。","audio":"https://ti.koolearn.com/upload/ti/sardine/2657000-2658000/2657057/20e292dbf7cc4fde8985497458b43330.mp3","phrases2":[{"en":"so → we're putting out public guidance about what we should","zh":"所以，当我们发布关于我们应该怎样做的公众指南时"},{"en":"when → we're putting out public guidance about what we should","zh":"当我们发布关于我们应该如何的公众指南时"},{"en":"instead → of converting those nutrients into foods like fish","zh":"而不是把那些营养素转化成鱼之类的食物"},{"en":"so → on But I think talking about foods rather than nutrients","zh":"所以，但我认为，谈论食物而不是营养素"},{"en":"but → I think talking about foods rather than nutrients is an","zh":"但我认为，谈论食物而不是营养素是一个"},{"en":"but → should help give people a wider view of the","zh":"但我们应该帮助人们更广泛地看待……"}]},{"id":4281,"name":"Dimension","phrases":["so → let me begin with the notion of a dimension","so → think about the surface of the earth","if → think about the surface of the earth","if → I want to tell you the location of a hang","but → mathematically there’s no reason to stop at three dimensions","so → let's define an event: just to be an occurrence","if → I want to specify an event","when → happens in time"],"eng":"So, let me begin with the notion of a dimension. “ ” A dimension is simply how many numbers you need to specify a location. So, if we think about the surface of the earth, the equator is one-dimensional: you need to specify only one number to specify a location on the equator, namely the longitude. —— The surface of the earth, altogether, is of course two-dimensional: you need to specify two numbers—latitude and longitude—to specify a location on the earth. —— The space above the earth is three-dimensional: if I want to tell you the location of a hang glider, I need to give you the latitude, longitude, and altitude. —— But mathematically, there’s no reason to stop at three dimensions. A four-dimensional space is simply a space in which you need to specify four numbers to specify a location in that space. A five-dimensional space would be one in which you need to specify five numbers, etc. In fact, I claim you already know an example of a four-dimensional space. So let's define an event: just to be an occurrence that happens in a small region of space at a definite time. “ ” In other words, an event is like a snap of your fingers or a clap of your hands. And now, the collection of all events—if I want to specify an event, I need to give you four numbers: I need to tell you where it happens in space and when it happens in time. ——","ref":"A dimension is defined by the number of numbers needed to specify a location. For example, the Earth’s equator is one-dimensional because only longitude is required to pinpoint a location there. The Earth’s surface and the space above the Earth is two and three-dimensional respectively. Mathematically, dimensions aren’t limited to three—four-dimensional space needs four numbers, five-dimensional space needs five, and so on. An event, like a finger snap, requires four numbers to specify—three for its spatial location and one for the time it occurs. 维度由确定一个位置所需的数字数量来定义。例如，地球的赤道是一维的，因为只需经度就能确定那里的一个位置。地球表面和地球上方的空间分别是二维和三维的。从数学角度而言，维度并不局限于三维 —— 四维空间需要四个数字，五维空间需要五个数字，依此类推。像打响指这样的事件，确定它需要四个数字 —— 三个用于表示其空间位置，一个用于表示其发生时间。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693315/61acafb6d55a4482a8d44ec2acead956.mp3","phrases2":[{"en":"so → let me begin with the notion of a dimension","zh":"那么，我先从维度的概念讲起"},{"en":"so → think about the surface of the earth","zh":"那么，如果我们想想地球表面"},{"en":"if → think about the surface of the earth","zh":"如果我们考虑地球表面"},{"en":"if → I want to tell you the location of a hang","zh":"如果我想告诉你一个东西的位置"},{"en":"but → mathematically there’s no reason to stop at three dimensions","zh":"但从数学上讲，没有理由止步于三维"},{"en":"so → let's define an event: just to be an occurrence","zh":"那么，让我们定义一个事件：它只是一次发生"},{"en":"if → I want to specify an event","zh":"如果我想指定一个事件"},{"en":"when → happens in time","zh":"当它在时间中发生时"}]},{"id":1574,"name":"Discovering the port of Roman London","phrases":["but → going to discuss today is how the","if → look at the historical records of Roman London","so → are a historian trying to write the history","if → are a historian trying to write the history","so → what we're looking at here is how did we discover","so → going to do today","so → move on to the next slide","if → move on to the next slide"],"eng":"But what we are going to discuss today is how the port of London was discovered and what we discovered about it. Now if you look at the historical records of Roman London, there is only about 14 actual references to London in antiquity and contemporary references. 14 And all those only one is in the first century, there are none at all at the second or third century. There is only one in the late third century and there are four in the fourth century. So if you are a historian trying to write the history of Roman London, it's really difficult. You don't have much data, you're going to depend on the archaeological evidence, the material evidence of the port and indeed the town to have any understanding of what happened then. And so, what we're looking at here is how did we discover about the port of London, there is no historical documentation, no customs books, no tariffs, no idea of the taxes. We have to understand the port entirely from the archaeological evidence. So that's what we are going to do today. So, if we move on to the next slide, I love live streaming. Thank you very much.","ref":"This lecture is about the historical records of Roman London. There are few records of its history in both antiquity and contemporary references. If the historian try to write the history of Roman London, it's really difficult because of the lack of data. And so, the port of London was discovered with no historical documentation, like custom books. We have to understand the port entirely from archaeological evidence. 这节讲座讲的是罗马时期伦敦的历史记录。无论是古代还是当时的文献资料，关于这段历史的记载都非常少。如果历史学家试图撰写罗马伦敦的历史，会非常困难，因为缺乏相关数据。因此，伦敦港口的发现就没有历史文献的记载，比如海关书籍。我们只能完全依靠考古证据来了解这个港口。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678148/b0873f2b92844c50b8b276a2e60bdbf2.mp3","phrases2":[{"en":"but → going to discuss today is how the","zh":"但今天我们要讨论的是，……是如何"},{"en":"if → look at the historical records of Roman London","zh":"如果你查看罗马时期伦敦的历史记录"},{"en":"so → are a historian trying to write the history","zh":"所以，如果你是一位试图撰写这段历史的历史学家"},{"en":"if → are a historian trying to write the history","zh":"如果你是一位试图撰写这段历史的历史学家"},{"en":"so → what we're looking at here is how did we discover","zh":"所以，我们这里要看的是：我们是如何发现……的"},{"en":"so → going to do today","zh":"所以，这就是我们今天要做的事情"},{"en":"so → move on to the next slide","zh":"那么，如果我们继续看下一张幻灯片"},{"en":"if → move on to the next slide","zh":"如果我们继续看下一张幻灯片"}]},{"id":1568,"name":"Double pendulum","phrases":[],"eng":"The chaos physics equation for a double pendulum is a fascinating topic that explores the intricate dynamics of this system. The equation involves a set of coupled differential equations that describe the motion of the two linked pendulums. Factors such as the length of each arm, the mass of the pendulum bob, and the initial angles of displacement all contribute to the complexity of the equation. What makes the double pendulum intriguing is its sensitivity to initial conditions. Even the smallest deviation in the starting position or velocity can lead to drastically different outcomes. This phenomenon, commonly known as the butterfly effect, highlights the chaotic nature of the double pendulum's motion. The chaos physics equation for the double pendulum has practical relevance in various fields, such as robotics and physics education. Researchers use computer simulations and physical models to experiment with this system, gaining insights into its nonlinear behavior. In conclusion, the chaos physics equation for the double pendulum showcases the complexity and unpredictability of its motion. This system serves as an intriguing example of chaos theory, reminding us of the intricate dynamics hidden within seemingly simple physical systems.","ref":"The chaos physics equation for a double pendulum explores the unpredictability and complexity of its motion. Even minor differences in initial conditions can lead to significant variations in behavior, known as the butterfly effect. Researchers use computer simulations and physical models to study this system, gaining insights into its nonlinear dynamics. The double pendulum serves as an intriguing example of chaos theory and highlights the intricate dynamics of seemingly simple physical systems. 双摆的混沌物理方程探讨了其运动的不可预测性和复杂性。即使初始条件存在微小差异，也会导致行为上的显著变化，这种现象被称为“蝴蝶效应”。研究人员通过计算机模拟和物理模型来研究这一系统，从而深入了解其非线性动力学特性。双摆是混沌理论的一个引人入胜的例子，它揭示了看似简单的物理系统所具有的复杂动力学行为。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658427/5d8f2912274c4f4b8d02d506016825e9.mp3","phrases2":[]},{"id":1584,"name":"Early Robot","phrases":["when → had the term robot","but → I’m gonna show you the very","but → actually created and imagined in a","so → were kind and people are kind of reflecting","so → human","though → assembled and these robots are"],"eng":"This is a kind of object that you’re probably all familiar with when you had the term robot, but I’m gonna show you the very, very first robots. These were the very first robots. They were characters in a play in the 1920s called Rossum’s Universal Robots, and the play was written by Czech writer called Karel Capek. 1920 · And basically, these robots, you know, people tend to think of robots as kind of cute cuddly toys or, you know, Hollywood depictions kind of devoid of politics. But the first robots were actually created and imagined in a time of absolute political turmoil. You just had the First World War, you know, it finished had a devastating impact across Europe and so people were kind and people are kind of reflecting on what does it mean to be human, what makes us human, those kinds of question. And this kind of context is what inspired Capek to kind of write this play. And interestingly, these robots being human, they are actually in the play assembled on a production line, a bit like the Ford manufacturing production line. “ ” So even though they are human, they are assembled and these robots are designed to labor, and that is their primary purpose in society. “ ”","ref":"The first robots were characters in a play in the 1920s called Rossum’s Universal Robots, and the writer was Karel Capek. People tend to thinks of robots as cute cuddly toys. But the first robots were actually created and imagined in a time of absolute political turmoil, which was the First World War. The robots are actually in the play assembled on a production line. Even even though they are human, they are assembled and these robots are designed to labour, and that is their primary purpose in society. 第一次机器人出现在1920年代的一部名为《罗萨姆的万能机器人》（Rossum's Universal Robots）的戏剧中，作者是卡雷尔·恰佩克。人们通常把机器人看作是可爱、温顺的玩具。但实际上，最初的机器人是在第一次世界大战这一极端政治动荡的时期被创造和构思出来的。戏剧中的机器人实际上是通过生产线组装的。尽管它们是人类外形，但它们是被组装出来的，设计的主要目的是劳动，这也是它们在社会中的首要角色。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678157/8b84bcb1405349f499bac35f651dbd42.mp3","phrases2":[{"en":"when → had the term robot","zh":"当你用到“机器人”这个词时"},{"en":"but → I’m gonna show you the very","zh":"但我要向你们展示的正是……"},{"en":"but → actually created and imagined in a","zh":"但最早的机器人实际上是在一个……中被创造和想象出来的"},{"en":"so → were kind and people are kind of reflecting","zh":"所以人们很善良，而人们也在某种程度上反思着"},{"en":"so → human","zh":"所以，即使他们是人类"},{"en":"though → assembled and these robots are","zh":"尽管他们是人类，他们却是被组装起来的，而这些机器人是……"}]},{"id":3356,"name":"Early spring","phrases":["but → rising temperatures aren't the only factor","so → really contributing to a double whammy","because → the caterpillars want to feed on the juiciest and least","but → on nesting birds","so → ultimately affect the survival of birds","but → smarter lighting like LEDs that dial down certain wavelengths could","if → understand more about how light affects this bud burst","therefore → less early bud burst \" “ ” Thus keeping springtime"],"eng":"The Earth's temperature is rising. And as it does, springtime phenomena—like the first bloom of flowers—are getting earlier and earlier. But rising temperatures aren't the only factor. Urban light pollution is also quickening the coming of spring. \"So temperature and light are really contributing to a double whammy of making everything earlier.\" “ ” Richard Ffrench-Constant, an entomologist at the University of Exeter. · - He and his colleagues compiled 13 years of data from citizen scientists in the U.K., who tracked the first bud burst of four common trees. 13 Turns out, light pollution from streetlights in cities, and along roads pushed bud burst a full week earlier. Way beyond what rising temperatures could achieve. This disruptive timing can ripple through the ecosystem. \"The caterpillars that feed on trees are trying to match the hatching of their eggs to the timing of bud burst.\" “ ” \"Because the caterpillars want to feed on the juiciest and least chemically protected leaves.\" “ ” \"And it's not just the caterpillars, of course, that are important.\" “ ” \"But the knock-on effect is on nesting birds, which are also trying to hatch their chicks at the same time that there's the maximum number of caterpillars.\" “ ” So earlier buds could ultimately affect the survival of birds, and beyond. The findings are in the Proceedings of the Royal Society B. B The world's becoming increasingly urbanized, and light pollution is growing which Ffrench-Constant says could trick trees into budding earlier and earlier. - But smarter lighting like LEDs that dial down certain wavelengths could help. LED \"Perhaps the exciting thing is, if we understand more about how light affects this bud burst, we might be able to devise smarter sort of streetlighting that has less red components, and therefore less early bud burst.\" “ ” Thus keeping springtime an actual springtime phenomenon.","ref":"The lecture mainly talks about the spring time phenomena, which means that first blooms of flowers are getting earlier. The first cause if the rising temperature and another reason is urban light pollution, which pushed bud burst earlier, and way beyond what rising temperatures could achieve. The lecture also mentions that this disruptive timing can ripple through the ecosystem such as caterpillars and birds. However, smarter lighting could help with reducing early bud burst. 本次讲座重点探讨了春季物候提前现象，即植物开花期普遍提早的趋势。该现象主要由两大因素驱动：其一是持续上升的气温，其二是城市光污染——后者对花芽提前萌发的促进作用甚至远超温度变化的影响。讲座进一步指出，这种物候时序的紊乱会在生态系统中产生连锁反应，波及毛毛虫与鸟类等生物。不过研究也表明，通过优化城市照明方案能够有效缓解花芽过早萌发的问题。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690246/66d213bd36de4fceb12a4e8bb30cd346.mp3","phrases2":[{"en":"but → rising temperatures aren't the only factor","zh":"但气温上升并非唯一因素。"},{"en":"so → really contributing to a double whammy","zh":"所以温度和光照确实在共同造成双重打击。"},{"en":"because → the caterpillars want to feed on the juiciest and least","zh":"因为毛毛虫想取食最多汁、最不……"},{"en":"but → on nesting birds","zh":"但连锁反应会影响到筑巢的鸟类。"},{"en":"so → ultimately affect the survival of birds","zh":"所以更早发芽最终可能影响鸟类的生存。"},{"en":"but → smarter lighting like LEDs that dial down certain wavelengths could","zh":"但像LED这样可调低某些波长的更智能照明可能……"},{"en":"if → understand more about how light affects this bud burst","zh":"如果我们更了解光如何影响这种发芽"},{"en":"therefore → less early bud burst \" “ ” Thus keeping springtime","zh":"因此提前发芽更少，\" “ ” 从而保持春季"}]},{"id":2552,"name":"File a patent","phrases":["if → to go to the patent office and say","while → been around for a","while → be a 0% chance","so → be a 0% chance that you would actually","if → were to somehow convince the patent office","however → be incredibly valuable Every single clicker that was made after","when → infringes maybe we take one or two dollars each","but → be close to zero"],"eng":"We’re thinking about this and we’re trying to say, alright, well, let’s file on a patent on this clicker. If I were to go to the patent office and say, alright, I want a patent on a clicker, period. The patent officer would just laugh. You know, the clicker has been around for a while. Presentation clickers have been around for a while. And so there would be a 0% chance that you would actually get that. If we were to somehow convince the patent office that we should be able to get on a patent on clicker, period. It would, however, be incredibly valuable. Every single clicker that was made after this point would infringe. And when it infringes, maybe we take one or two dollars each. That would be added up to be a decent amount of money. On the other end of the spectrum, let’s go to the million-word version. I go to the patent office and I say, I want a patent on this exact thing. And those million words describe every single radius, every single material, every single thing about this. And the patent officer says, yeah, we've never seen that before. Go ahead and take it. Almost 100% of chance of getting that patent, but the value of that patent would be close to zero. 100%","ref":"This lecture is mainly about patent. It would be impossible to get a patent on presentation clickers, since they have been used for a while. However, if we are able to get a patent on them, it would be incredibly valuable. Every single clicker that was made after that point would infringe, and we could collect $1-2 each. That would be added up to be a decent amount of money. If we choose the million-word version, we have almost 100% chance of getting that patent, but the value of that patent would be close to zero. 这一讲座主要讲述专利。如果我们能够为点击器获得专利，那将是非常有价值的。从那时起，每一个制造的点击器都会侵权，而制造每个点击器可能都需支付一两美元。最终，累积起来会成为一笔相当可观的金额。如果我们要申请的专利是极尽详细的百万字版本，我们几乎有100%的机会获得专利，但这个专利的价值几乎为零。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678145/a1b32a79179b4522ad5cbdc92889bfbb.mp3","phrases2":[{"en":"if → to go to the patent office and say","zh":"如果我去专利局说"},{"en":"while → been around for a","zh":"虽然演示翻页笔已经存在了一段时间"},{"en":"while → be a 0% chance","zh":"而这样一来，几率为0%"},{"en":"so → be a 0% chance that you would actually","zh":"所以你实际上……的可能性为0%"},{"en":"if → were to somehow convince the patent office","zh":"如果我们能以某种方式说服专利局"},{"en":"however → be incredibly valuable Every single clicker that was made after","zh":"然而会极其有价值；此后制造的每一支翻页笔"},{"en":"when → infringes maybe we take one or two dollars each","zh":"当它侵权时，也许我们每支收取一两美元"},{"en":"but → be close to zero","zh":"但那个专利的价值将接近于零"}]},{"id":3357,"name":"Fire safety","phrases":[],"eng":"With over 40 years unrivaled experience and a worldwide reputation, BSI leads the way in testing and certification of fire safety products. 40 BSI Based on our dedicated labs in Hemel Hempstead, our team provides BSI Kitemark and CE testing and certification for a broad range of products, including fire extinguishers, hoses, alarm panels, and heat and smoke detectors. BSI CE We help clients to gain access into the European market by ensuring that products meet all the CE mark requirements. CE And we are familiar with the market access regulations of most countries across the world, enabling customers to enter markets globally. The BSI Kitemark is categorized as a British superbrand and acknowledged the world over as a symbol of trust, integrity, and quality. BSI It provides the reassurance that vital product safety and performance requirements have been met. Our team subjects each product to a rigorous set of tests along with robust production control audits designed specifically to ensure that they conform to required standards of safety and quality. We test for compatibility of fire detection and fire alarm system components to ensure that they're compatible and connectable. This service meets the growing requirement of European regulatory authorities to meet national installation guidelines. We also perform tests on individual detection components. Fire suppression products such as fire extinguishers are subjected to rigorous tests designed to ensure that they're effective, safe and capable of performing in environments and conditions in which they're stored and used. The symbols for BSI Kitemark and CE certification represent quality, safety, and trust. BSI CE For specifiers, they demonstrate a commitment to best practice procurement. And for the public, they provide the reassurance that fire safety products are effective and reliable.","ref":"BSI leads the way in testing and certification of fire safety products, including fire extinguishers, hoses, and alarm panels. They help clients to gain access into the European market. They test for compatibility of fire detection and fire alarm system components.They also perform tests on individual detection components. For the public, they provide the reassurance that fire safety products are effective and reliable. BSI在消防安全产品的测试和认证方面处于领先地位，包括灭火器、消防水带和报警面板。他们帮助客户进入欧洲市场，并测试火灾探测和报警系统组件的兼容性。他们还对单独的探测组件进行测试。对于公众来说，他们提供了消防安全产品有效性和可靠性的保证。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690247/b22ff7495a7a4db488f1acd452996075.mp3","phrases2":[]},{"id":1588,"name":"Four fundamental forces","phrases":["so → all know about gravity","though → are somewhat less familiar","because → it's responsible for radioactivity and radioactive decay","so → those four forces strong nuclear force"],"eng":"There a
