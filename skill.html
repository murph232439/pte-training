re four fundamental forces at work in the universe. Some of them are very familiar from everyday life. Some of them are not. So we all know about gravity. That's one of the four forces. It's what keeps our ankles to the surface of the earth, and keeps the Earth in orbit around the Sun. There is another force that we're very familiar with, which is the electromagnetic force. That is the force that is responsible for the electricity, electric currents for light, for the sun's light, that's electromagnetic radiation coming from the Sun to the Earth. —— There are two other forces though that are somewhat less familiar. They are the nuclear forces. They are forces that are at work within the nuclear atoms. One of those forces is called the strong nuclear force. That really is the force that bides protons to protons, bides the quarks inside of the protons and neutrons keeping them from flying out. The other nuclear force is called the weak nuclear force. And that's a force that predominantly we know of because it's responsible for radioactivity and radioactive decay. So those four forces—strong nuclear force, weak nuclear force, electromagnetic force and gravitational force—those are the forces that work in the universe. —— ——","ref":"The lecture talks about four fundamental forces that work in the universe. According to the lecture, gravity is one of the four forces. It's what keeps our ankles to the surface of the earth, and keeps the Earth in orbit around the Sun. Another force is the electromagnetic force. That is the force that is responsible for the electricity, electric currents for light. There are two other forces that we're less familiar with, one of those forces is called the strong nuclear force. The other nuclear force is called the weak nuclear force. 这一讲座讲述了宇宙中四种基本力。根据讲座，引力是其中一种力。它使我们的双脚稳稳站在地球表面，并能使地球围绕太阳转。另一种力是电磁力。这种力与电流、光以及电力的作用息息相关。还有两种我们不太熟悉的力，其中一种叫做强核力。另一种核力叫做弱核力。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678138/5ec50bc10090411e92a2a7499f5ccb1d.mp3","phrases2":[{"en":"so → all know about gravity","zh":"所以我们都了解引力"},{"en":"though → are somewhat less familiar","zh":"不过这些就没那么熟悉了"},{"en":"because → it's responsible for radioactivity and radioactive decay","zh":"因为它导致放射性和放射性衰变"},{"en":"so → those four forces strong nuclear force","zh":"那么这四种力中的强核力"}]},{"id":1586,"name":"Gas giants","phrases":["so → two theories for how the gas giants formed","so → it's unclear exactly how they formed but you're right","but → you're right what we're trying","because → are trying to understand more about the pressure inside","but → maybe a metallic core is not made of iron","for example → becomes metallic at a certain pressure","so → it's very possible that the insides of these planets could","but → get in the lab"],"eng":"So there are two theories for how the gas giants formed. One is the same theory I showed you just now — core accretion, right? And the other is called disk instability, and one of our colleagues at DTM has done a lot of work on that. DTM And so it's unclear exactly how they formed but you're right — what we're trying to do, the reason we're trying to get the higher and higher pressure in the lab is because we are trying to understand more about the pressure inside the gas giants. —— It's thought that the gas giants also have a metallic core, but maybe a metallic core is not made of iron. Hydrogen, for example, becomes metallic at a certain pressure, ok? So it's very possible that the insides of these planets could have metallic cores, could have hydrogen cores, could have rocky portions. We're not sure. But the higher pressure we can get in the lab, the closer we can get to understanding the interiors of the gas giants and the exoplanets that are so big.","ref":"The lecture talks about two theories for how the gas giants formed. According to the lecture, one theory is called core accretion, and the other is called disk instability. It's unclear exactly how they formed but you're right what we're trying to do. So it's very possible that the insides of these planets could have metallic cores, hydrogen cores, and rocky portions. But the higher pressure we can get in the lab, the closer we can get to understanding the interiors of the gas giants and exoplanets that are so big. 这一讲座讲述了关于气态巨行星形成的两种理论。根据讲座，一种理论叫做核吸积理论，另一种叫做星盘不稳定理论。目前还不完全清楚它们到底是如何形成的，但我们正在努力探索。气态巨行星的内部很可能具有金属核心、氢核心和岩石部分。不过，我们在实验室中能获得的更高压力，能够帮助我们更接近理解气态巨行星和如此庞大的系外行星的内部结构。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658440/8c03da842ca047eba622a00c59ccba20.mp3","phrases2":[{"en":"so → two theories for how the gas giants formed","zh":"所以关于气态巨行星如何形成，有两种理论"},{"en":"so → it's unclear exactly how they formed but you're right","zh":"所以它们究竟如何形成尚不清楚，但你说得对"},{"en":"but → you're right what we're trying","zh":"但你说得对，我们正在尝试做的事情"},{"en":"because → are trying to understand more about the pressure inside","zh":"因为我们正试图更多地了解内部的压力"},{"en":"but → maybe a metallic core is not made of iron","zh":"但也许金属核心不是由铁构成的"},{"en":"for example → becomes metallic at a certain pressure","zh":"例如，在特定压力下会变成金属态"},{"en":"so → it's very possible that the insides of these planets could","zh":"所以这些行星的内部很可能可以"},{"en":"but → get in the lab","zh":"但我们在实验室里能获得的压力越高"}]},{"id":1570,"name":"Globalization","phrases":["if → a chicken caught a cold and sneezed and died","but → I don't think there was much possibility of us fearing","if → a bank in North America lent too much money","but → bring the global economic system","but → it's also brought a lot of good stuff","if → really acts together and it really tries hard"],"eng":"I've been thinking a lot about the world recently and how it's changed over the last 20, 30, 40 years. 20 30 40 Twenty or thirty years ago, if a chicken caught a cold and sneezed and died in a remote village in East Asia, it would have been a tragedy for the chicken and its closest relatives, but I don't think there was much possibility of us fearing a global pandemic and the deaths of millions. Twenty or thirty years ago, if a bank in North America lent too much money to some people who couldn't afford to pay it back and the bank went bust, that was bad for the lender and bad for the borrower, but we didn't imagine it would bring the global economic system to its knees for nearly a decade. This is globalization. This is the miracle that has enabled us to transship our bodies and our minds and our words and our pictures and our ideas and our teaching and our learning around the planet ever faster and ever cheaper. It's brought a lot of bad stuff, like the stuff that I just described, but it's also brought a lot of good stuff. A lot of us are not aware of the extraordinary successes of the Millennium Development Goals, several of which have achieved their targets long before the due date. That proves that this species of humanity is capable of achieving extraordinary progress if it really acts together and it really tries hard.","ref":"This is globalization about the example of chicken died and bank bust. This is the miracle enabled us to transship our bodies and our minds around the planet ever faster and ever cheaper. There is a lot of bad stuff and good stuff. A lot of extraordinary successes of the Millennium Development Goals. Humanity is capable of achieving extraordinary progress if acts together and tries hard. 这一讲座讲述了全球化的例子，包括鸡的死亡和银行的破产。全球化是一个奇迹，使我们能够以更快、更经济的方式将我们的身体和思想传递到地球的各个角落。全球化既带来了许多坏事，也伴随着许多好事。千年发展目标取得了许多非凡的成就。人类如果共同努力、全力以赴，完全有能力取得非凡的进展。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678143/1640b3caebe340d3a589b857864c3bf5.mp3","phrases2":[{"en":"if → a chicken caught a cold and sneezed and died","zh":"如果一只鸡感冒了，打个喷嚏就死了"},{"en":"but → I don't think there was much possibility of us fearing","zh":"但我觉得我们不太可能会害怕"},{"en":"if → a bank in North America lent too much money","zh":"如果北美一家银行放贷过多"},{"en":"but → bring the global economic system","zh":"但我们没想到它会给全球经济体系带来……"},{"en":"but → it's also brought a lot of good stuff","zh":"但它也带来了很多好东西"},{"en":"if → really acts together and it really tries hard","zh":"如果它真的齐心协力，真的尽力而为"}]},{"id":3361,"name":"Government Blogging","phrases":["but → be much difficult when it comes","when → comes to government such as the White House","because → will become more coarse and rude online","especially → in the comment area Hence the governor blog may go","so → to administrate the comment"],"eng":"We normally see blogging as a two-way interaction, in which the blogger creates the content and the readers interact or challenge the author. But the case will be much difficult when it comes to government, such as the White House. Because people will become more coarse and rude online, especially in the comment area. Hence the governor blog may go wild and chaotic. So the government will have to administrate the comment. Once the government starts administrating the comment, citizens may find the government manipulating what should be said and what should be shown, which contradicts the original intention.","ref":"The lecture discusses challenges of government blogging compared to regular blogs. Normally, blogs allow two-way interaction where readers comment or challenge the author. However, when government bodies like the White House blog, online comments often turn hostile or disrespectful, leading to chaos. To manage this, governments may need to moderate comments. But citizens might feel the government is controlling free speech. This creates a conflict: maintaining order or preserving open dialogue, which undermines the original purpose of blog interaction. 讲座讨论了政府博客与普通博客相比所面临的挑战。通常，博客允许双向互动，读者可以评论或挑战作者。然而，在政府机构，例如白宫博客下，网上评论往往变得充满敌意或不尊重，导致混乱。为了解决这个问题，政府可能需要缓和言论。但公民可能会觉得政府在控制言论自由。这就产生了一种冲突：维持秩序还是保留公开对话，而后者破坏了博客互动的初衷。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690252/a128c98b3b574fe7848b448f8395a8c5.mp3","phrases2":[{"en":"but → be much difficult when it comes","zh":"但这种情况一旦出现，将会困难得多"},{"en":"when → comes to government such as the White House","zh":"当涉及白宫这样的政府时"},{"en":"because → will become more coarse and rude online","zh":"因为人们在网上会变得更粗俗无礼"},{"en":"especially → in the comment area Hence the governor blog may go","zh":"尤其在评论区，因此州长博客可能会关闭"},{"en":"so → to administrate the comment","zh":"所以政府将不得不管理评论"}]},{"id":1594,"name":"Health problem","phrases":["so → now I want to look at two big problems","so → a solution","but → what about problem two Well","if → could solve the pollution and health problems at the","so → how about an exercise bike that can create electricity"],"eng":"So now I want to look at two big problems in the world today and something that someone has invented to solve these problems. The first problem is that people don't get enough exercise, which is obviously bad for people's health. The second is that people are using too much electricity. The process of making electricity causes pollution, which is also bad for our health as well as being bad for the environment. So here we might have a solution, an exercise bike perhaps. You were thinking, well, that solves problem number one, the exercise problem, but what about problem two? Well, this is where the idea for the invention comes from. What if you could solve the pollution and health problems at the same time? So how about an exercise bike that can create electricity? You can then use that electricity for power in your home.","ref":"There are two big problems in the world. These are that people don't get enough exercise and that they use too much electricity. There is a way to solve both these problems with a special kind of exercise bike which someone has invented. If you use the bike, you can get fit and you can also create electricity and use it in your home. 世界上有两大问题。这些是人们没有得到足够的锻炼，并且他们使用太多的电。有一种方法可以用某人发明的一种特殊的健身车来解决这两个问题。如果你使用自行车，你可以变得健康，也可以发电并在家里使用。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658435/ebd57d6fd97e4b4e97e6963d4a51e936.mp3","phrases2":[{"en":"so → now I want to look at two big problems","zh":"那么现在，我想谈谈两个大问题。"},{"en":"so → a solution","zh":"那么这里我们也许有解决办法。"},{"en":"but → what about problem two Well","zh":"但第二个问题呢？嗯。"},{"en":"if → could solve the pollution and health problems at the","zh":"如果你能解决污染和健康问题，在……"},{"en":"so → how about an exercise bike that can create electricity","zh":"那么，能发电的健身自行车怎么样？"}]},{"id":1600,"name":"Higher education and further education","phrases":["so → eager to hire graduates","however → remember that degree courses are long and costly","however → as the skills learnt on further education courses tend"],"eng":"Today, we're looking at the study options available to students after completing school, and the two main choices are higher education and further education. Higher education basically means studying for a university degree. This involves detailed study and is usually theoretical in nature. That said, the skills students learn can be used in many different careers, so companies are eager to hire graduates. However, remember that degree courses are long and costly. Conversely, further education focuses more on practical skills rather than theoretical knowledge. These courses prepare students for a specific job, such as training to be a chef and offer great practical work experience opportunities. However, as the skills learnt on further education courses tend to be more specialized, they can not be transferred to other types of career very easily. As you can see, it's important to compare the pros and cons of higher and further education carefully before making a decision.","ref":"Students who wish to continue their education after finishing school have two main options, namely higher or further education. Higher education involves studying for an academic degree. Students develop various skills that can be applied to many different professional contexts, so degrees are valued by employers. However, they are time consuming and expensive. By contrast, further education train students for a specific vocation. Students get practical work experience and learn the skills they need for a specific job. Although they might not be able to transfer these skills into other professions later. 希望在完成学业后继续接受教育的学生有两种主要选择，即高等教育或继续教育。高等教育包括攻读学位。学生培养各种技能，可以应用于许多不同的职业环境，因此学位受到雇主的重视。然而，它们既耗时又昂贵。相比之下，继续教育可以基于特定的职业需求对学生进行培养。学生获得实际工作经验，学习特定工作所需的技能。虽然他们以后可能无法将这些技能转移到其他职业中。","audio":"https://ti.koolearn.com/upload/ti/sardine/2657000-2658000/2657206/b7c9b04bddc64340bfe39090d33bcaf6.mp3","phrases2":[{"en":"so → eager to hire graduates","zh":"因此公司急于招聘毕业生"},{"en":"however → remember that degree courses are long and costly","zh":"但请记住，学位课程既漫长又昂贵"},{"en":"however → as the skills learnt on further education courses tend","zh":"然而，由于继续教育课程中所学的技能往往……"}]},{"id":3352,"name":"Immigration control","phrases":["so → much to help people that are much poorer than ourselves"],"eng":"Now the economists calculated, it’s a back of the envelope calculation, that removing all immigration controls would double the size of the world economy, and even a small relaxation of immigration controls would lead to disproportionately big gains. Now for an ethical point of view, it’s hard to argue against a policy that will do so much to help people that are much poorer than ourselves. The famous Rand Study reckons that a typical immigrant who arrives in the US ends up with $20,000 a year, that’s rough. 2 It’s not just the migrants themselves who gain, it’s the countries they come from. Already, the migrants working for poor countries working in rich countries send home around 200 billion dollars a year, through formal channels, and about twice as that through informal channels. 2000 And that compares to the neat a hundred million dollars that Western governments give in aid. 1 These remittances are not wasted on weapons or siphoned off into Swiss bank accounts; they go straight into the pockets of local people. They pay for food, clean water, and medicines, they help kids in school, they help start up new businesses.","ref":"The economists calculated that removing all immigration controls would double the size of the world economy or would lead to disproportionately big gains. A study found that a typical immigrant who arrives in US ends up with $20,000 a year. The countries they come from gain money as well. People send money back to their countries in formal and informal channels. The money is directly paid for food, clean water, and medicines. 经济学家计算出，取消所有移民控制将使全球经济规模翻倍，或者至少会带来不成比例的大幅增长。一项研究发现，典型的移民到达美国后每年收入为20,000美元。移民原籍的国家也会从中获益。移民通过正式和非正式渠道将钱汇回家乡。这些资金直接用于民生需求，如食品、净水和药品。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690241/963b665def424a9ba85eb60884d10666.mp3","phrases2":[{"en":"so → much to help people that are much poorer than ourselves","zh":"有太多可以帮助那些远比我们贫穷的人的事情"}]},{"id":1572,"name":"Innovation and invention","phrases":["so → not the same thing","so → innovation equals invention times commercialization","so → and when we look at this equation of innovation something","when → look at this equation of innovation something of value"],"eng":"He says innovation equals invention. Let me just stop here. Innovation equals invention often people mistake these two things for the same thing. Innovation equals invention, they are not. Innovation is something that generates value for the world. It makes something faster, better, cheaper. It gives someone some great satisfaction. An invention is an idea, a technology, a patent. In and of itself, it does not generate value. So these two are not the same thing. And sometimes you see them interchange. And that's not correct. So innovation equals invention times commercialization. So and when we look at this equation of innovation something of value, it requires a new idea and then it requires someone or some organization that is going to commercialize that idea and to make it a value to the world. ——","ref":"This lecture talks about the relationship between innovation and invention. Firstly, the speaker mentions that people think innovation equals invention but it’s not correct. Secondly, the speaker mentions that innovation generates value for the world and gives people satisfaction, but the invention is an idea that does not generate value. Thirdly, the speaker mentions that innovation equals invention times commercialization. In conclusion, innovation equals to commercializing a new idea to make value. 这一讲座讨论了创新与发明之间的关系。首先，讲者提到人们认为创新等同于发明，但这是不正确的。其次，讲者提到创新为世界创造了价值并带给人们满足感，而发明本身只是一个没有产生价值的想法。第三，讲者提到创新等于发明乘以商业化。总的来说，创新是发明与商业化的结合，从而创造价值。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678146/d41dbd6cbbff49289eae21b09d395a4e.mp3","phrases2":[{"en":"so → not the same thing","zh":"所以这两者不是一回事"},{"en":"so → innovation equals invention times commercialization","zh":"所以创新等于发明乘以商业化"},{"en":"so → and when we look at this equation of innovation something","zh":"所以，当我们看这个创新等式时，某个东西"},{"en":"when → look at this equation of innovation something of value","zh":"当我们看这个创新等式时，某种有价值的东西"}]},{"id":4273,"name":"King","phrases":["so → easy to govern especially during the Middle Ages","especially → during the Middle Ages And the king might owe many","especially → who help the king come to power","so → in exchange for that and to help govern","so → a kingdom","because → just doesn't sound as serious","so → grant a duchy","if → threatened the duke will fight alongside"],"eng":"At the top, you would have a king. Now the king would rule over a kingdom. Now, this is not so easy to govern especially during the Middle Ages. And the king might owe many people, things especially people who help the king come to power, helped him dispose the previous king or to conquer this land. And so in exchange for that and to help govern, he might grant land or fiefs to other people. And the key currency in the Middle Ages under the feudal system is land. And land in exchange for loyalty and service. So this whole thing is a kingdom. Now right over here, this is a duchy. And a duchy will be controlled by a duke. I guess I didn't call it duckie because that just doesn't sound as serious. “duckie” So the king might grant a duchy, a duchy to a duke and in exchange, the duke would provide loyalty pledged their fealty. If the kingdom is threatened, the duke will fight alongside. The duke would provide their own troops if the king wants to go conquer other territories, same thing, and also provide the king with taxes which might be in the form of coinage depending on what time and region we are in the Middle Ages or it might be in the form of a percentage of the agricultural production from this duchy.","ref":"In the Middle Ages, a king ruled over a kingdom. To govern, he granted land or fiefs to others in exchange for loyalty and service. Land was the key currency. For example, a duchy was controlled by a duke. The duke provided loyalty, pledged fealty, supplied troops, and paid taxes, either in coinage or as a percentage of agricultural production. 在中世纪，国王统治着一个王国。为了治理国家，他会把土地或封地赐予他人，以换取忠诚和服务。土地是关键货币。例如，一个公国由公爵控制。公爵提供忠诚、宣誓效忠、提供军队并缴纳税款，税款可能是铸币形式，也可能是公国农业产出的百分比。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693304/9c3cc58aab304ef9b069bc3a5e8541e7.mp3","phrases2":[{"en":"so → easy to govern especially during the Middle Ages","zh":"所以很容易统治，尤其在中世纪"},{"en":"especially → during the Middle Ages And the king might owe many","zh":"尤其在中世纪，国王可能欠下许多人情"},{"en":"especially → who help the king come to power","zh":"尤其是那些帮助国王掌权的人"},{"en":"so → in exchange for that and to help govern","zh":"所以作为交换，也为了帮助治理"},{"en":"so → a kingdom","zh":"所以这整个就是一个王国"},{"en":"because → just doesn't sound as serious","zh":"因为那听起来就是没那么严肃"},{"en":"so → grant a duchy","zh":"所以国王可能会授予一个公国"},{"en":"if → threatened the duke will fight alongside","zh":"如果王国受到威胁，公爵会并肩作战"}]},{"id":4274,"name":"Knee","phrases":["but → gets worse when you listen up close","when → listen up close \"It does for most people","but → for me it actually just makes me excited","if → a really hard workout","but → I'd also sometimes feel that I would feel this basically","so → got to Georgia Tech and heard the Defense","when → got to Georgia Tech and heard the Defense Advanced","when → can perform particular activities"],"eng":"The sound of a cracking knee isn't particularly pleasant. But it gets worse when you listen up close. \"It does for most people. But for me, it actually just makes me excited.\" “ ” Omer Inan, an electrical engineer at Georgia Tech. Omer Inan \"I actually feel like there's some real information in them that can be exploited for the purposes of helping people with rehab.\" “ ” Inan's experience with cracking knees goes back to his days as an undergrad at Stanford, where he threw discus. Inan \"If I had a really hard workout, then the next day, of course, I'd be sore, but I'd also sometimes feel that I would feel this basically catching or popping or creaking every now and then in my knee.\" “ ” A few years later, he found himself building tiny microphones at a high-end audio company. So when he got to Georgia Tech and heard the Defense Advanced Research Projects Agency, DARPA, wanted better tech for knee injuries, he thought: Why not strap tiny microphones to people's knees, to eavesdrop as their legs bend? DARPA \"What we think it is, is the cartilage and bone rubbing against each other, the surfaces inside the knee rubbing against each other, during those movements.\" “ ” He and a team of physiologists and engineers built a prototype with stretchy athletic tape and a few tiny mics and skin sensors. And preliminary tests on athletes suggest the squishy sounds the device picks up are more erratic, and more irregular, in an injured knee than in a healthy one. Which Inan says might allow patients and doctors to track healing after surgery. Inan Details appear in the IEEE Transactions on Biomedical Engineering. IEEE \"The primary application we're targeting at first is to give people a decision aid during rehabilitation, following an acute knee injury, to help them understand when they can perform particular activities, and when they can move to different intensities of particular activities.\" “ ” A useful thing to take a crack at.","ref":"The sound of a cracking knee isn't particularly pleasant. An electrical engineer was building tiny microphones at a high-end audio company to listen up to the knee cracking sound. He and his team built a prototype with stretchy athletic tape and a few tiny mics and skin sensors. The primary application they are targeting at first is to give people a decision aid during rehabilitation. 膝盖咔嚓作响的声音听起来并不悦耳。一位电气工程师在一家高端音响公司研发微型麦克风，专门捕捉这种膝盖发出的声响。他和团队用弹性运动胶带、几枚微型麦克风和皮肤传感器制作出原型设备。该设备的首要应用目标是为康复治疗中的患者提供决策辅助。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693306/eac184f172c542d4a517bc61ea5ab68a.mp3","phrases2":[{"en":"but → gets worse when you listen up close","zh":"但凑近一听，情况会更糟"},{"en":"when → listen up close \"It does for most people","zh":"当你凑近听时，“对大多数人来说确实如此”"},{"en":"but → for me it actually just makes me excited","zh":"但对我来说，这反而只会让我兴奋"},{"en":"if → a really hard workout","zh":"如果我进行了一场非常艰苦的训练"},{"en":"but → I'd also sometimes feel that I would feel this basically","zh":"但有时我也会觉得，我基本上就是这种感觉"},{"en":"so → got to Georgia Tech and heard the Defense","zh":"所以当他到了佐治亚理工学院，听说国防时"},{"en":"when → got to Georgia Tech and heard the Defense Advanced","zh":"当他到了佐治亚理工学院，听说国防高级时"},{"en":"when → can perform particular activities","zh":"当他们能够进行特定活动时"}]},{"id":1569,"name":"Leadership","phrases":["however → been quite visible in their exercise","but → been changing"],"eng":"A leader can define or clarify goals by issuing a memo or an executive order, an edict or a fatwa or a tweet, by passing a law, barking a command, or presenting an interesting idea in a meeting of colleagues. Leaders can mobilize people's energies in ways that range from subtle, quiet persuasion to the coercive threat or the use of deadly force. Sometimes a charismatic leader such as Martin Luther King Jr. can define goals and mobilize energies through rhetoric and the power of example. · · We can think of leadership as a spectrum, in terms of both visibility and the power the leader wields. On one end of the spectrum, we have the most visible: authoritative leaders like the president of the United States or the prime minister of the United Kingdom, or a dictator such as Hitler or Qaddafi. At the opposite end of the spectrum is casual, low-key leadership found in countless situations every day around the world, leadership that can make a significant difference to the individuals whose lives are touched by it. Over the centuries, the first kind, the out-in-front, authoritative leadership, has generally been exhibited by men. Some men in positions of great authority, including Nelson Mandela, have chosen a strategy of \"leading from behind\"; more often, however, top leaders have been quite visible in their exercise of power. · “ ” Women (as well as some men) have provided casual, low-key leadership behind the scenes. But this pattern has been changing, as more women have taken up opportunities for visible, authoritative leadership.","ref":"The lecture mainly talks about leaders. Firstly, a leader can define goals and mobilize people's energies. Secondly, we can think of leadership as a spectrum, in terms of both visibility and the power the leader wields. Thirdly, authoritative leadership has generally been exhibited by men. Finally, women have provided casual, low-key leadership behind the scenes, but this pattern has been changing. 这一讲座主要讲述了领导者。首先，领导者可以定义目标并调动人们的精力。其次，我们可以将领导力视为一个谱系，既包括领导者的可见性，也包括领导者所拥有的权力。第三，权威型领导角色长期由男性担任。最后，女性一直在幕后提供非正式、低调的领导力，但这种传统格局正在发生转变。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678142/53e49702dca24eee846ba436449246b6.mp3","phrases2":[{"en":"however → been quite visible in their exercise","zh":"不过，高层领导人在锻炼方面一直颇为显眼"},{"en":"but → been changing","zh":"但这种模式一直在改变"}]},{"id":3369,"name":"Library","phrases":[],"eng":"You'll see the service desk after entering the library and you can have these services at the service desk. There are computers on each floor. You can use computers to access the internet, check emails and library catalogues. Follow the orange signs to find printers. Follow the instructions to use the printers. Remember to bring student cards. You can charge the card to use printers.","ref":"This lecture is an introduction of a library. It talks about functional areas and services in the library. Every level of the library has computers, and students can use it to process the problems and send and receive emails. It also talks about the location of the printers in the library. Students can use their student cards and when they need help, they can ask the staff at the front desk. 这个讲座是关于图书馆的介绍。它讨论了图书馆的功能区域和服务。图书馆的每一层都有电脑，学生可以用它来处理问题和收发电子邮件。它还谈到了图书馆中打印机的位置。学生可以使用他们的学生卡，当他们需要帮助时，他们可以问前台的工作人员","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690260/b794ce656c3a456dacb91eb84627d942.mp3","phrases2":[]},{"id":1575,"name":"Licking and grooming","phrases":[],"eng":"The study explores the impact of maternal licking and grooming (LG) on the stress reactivity of adult rats. LG LG refers to the level of attention and care provided by mother rats to their offspring through licking and grooming behaviors. LG The experiment examined the effects of high and low levels of LG on the stress reactivity of the rats as they grow into adulthood. LG The findings reveal that high LG leads to a more moderate stress reactivity in the rats. LG This has significant implications as it suggests that a nurturing and attentive environment during infancy can potentially reduce the risk of poor development and diseases later in life. On the other hand, low LG results in an increased stress reactivity in the rats. LG This, in turn, elevates the risk for various health conditions such as heart disease, type II diabetes, alcoholism, affective disorders, and brain aging. Ⅱ These findings highlight the crucial role of maternal care and attention in shaping the stress response system in offspring. It demonstrates that early experiences and maternal care can have long-lasting effects on an individual's stress reactivity and overall health. This study underscores the importance of providing nurturing and supportive environments for infants to promote optimal development and reduce the risk of various health issues in adulthood.","ref":"Differences in stress reactivity of adult rats are determined by maternal licking and grooming (LG) during infancy. L means licking and G means grooming.The experiment tested on high and low level of licking and grooming that mother rats give to their children, to test out its effect on the children’s stress reactivity. High LG will bring modest stress reactivity, which can reduce the risk for poor development and diseases. Low LG will increase the stress reactivity, which can increase the risk for heart disease, type II diabetes, alcoholism, affective disorders and brain aging, etc. 这项实验探讨了母鼠在婴儿期舔舐和梳理（LG）对成年大鼠应激反应的影响。L代表舔舐，G代表梳理。实验测试了母鼠对幼鼠舔舐和梳理的高低水平，来检验这些行为对幼鼠应激反应的影响。高水平的舔舐和梳理（高LG）会导致温和的应激反应，这有助于降低发育不良和疾病的风险。低水平的舔舐和梳理（低LG）则会增加应激反应，从而增加罹患心脏病、Ⅱ型糖尿病、酗酒、情感障碍和大脑衰老等的风险。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658437/9d4e88b3ff544def9c2191c9eb1ed2b0.mp3","phrases2":[]},{"id":3362,"name":"Linguists","phrases":["but → move into working with communities","when → move into working with communities","although → was talking about something else","because → of our training we do have expertise in certain very","but → the authority over what","because → of the dominance of one people over another","but → then what that means is if in working with language","that means → is if in working with language revival we continue"],"eng":"But when we move into working with communities, we have to recognize that the communities have to be the authority in their language. Actually a woman in the class I'm teaching at Sydney at the moment, a career woman, expressed this very nicely, although she was talking about something else, she was distinguishing expertise from authority. And certainly linguists because of our training we do have expertise in certain very narrow areas of language, but we don't have the authority over what to do with that knowledge or what to do with other knowledge that the community produces. I guess for me the bottom line is languages are lost because of the dominance of one people over another. That's not rocket science, it's not hard to work that out. But then what that means is if in working with language revival we continue to hold the authority, we actually haven't done anything towards undoing how languages are lost in the first place, so in a sense the languages are still lost if the authority is still lost.","ref":"The lecture emphasizes that communities, not linguists, should hold authority over their languages. While linguists have expertise in narrow language areas, they lack the right to control how communities use or develop their knowledge. The speaker explains that languages disappear due to cultural dominance. Even if the language is technically revived, it remains \"lost\" if communities don’t regain control. A Sydney student’s example highlights this: expertise unequal to authority. True revival requires returning decision-making power to the community. 该讲座强调，应该对自己的语言拥有权威的是社区，而不是语言学家。虽然语言学家在狭窄的语言领域拥有专业知识，但他们缺乏控制社区如何使用或发展他们的知识的权利。演讲者解释说，语言的消失是由于文化的支配。即使这种语言在技术上得到了复兴，如果社区不重新获得控制权，它仍然是“失落的”。一位悉尼学生的例子凸显了这一点：专业知识不等于权威。真正的复兴需要将决策权归还给社区。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690253/461d5971326240d586101cebb39cf969.mp3","phrases2":[{"en":"but → move into working with communities","zh":"但当我们开始与社区合作时"},{"en":"when → move into working with communities","zh":"当我们开始与社区合作时"},{"en":"although → was talking about something else","zh":"尽管她谈的是另一件事"},{"en":"because → of our training we do have expertise in certain very","zh":"由于我们的训练，我们确实在某些非常……方面有专长"},{"en":"but → the authority over what","zh":"但我们无权决定该做什么"},{"en":"because → of the dominance of one people over another","zh":"由于一个民族对另一个民族的支配"},{"en":"but → then what that means is if in working with language","zh":"但这样一来，这意味着如果在语言工作中"},{"en":"that means → is if in working with language revival we continue","zh":"这意味着如果在语言复兴工作中我们继续"}]},{"id":1582,"name":"London fog","phrases":["but → it’s barely visible as you can see","but → also the dirt and pollution associated with the fumes all"],"eng":"Turner, not surprisingly, painted one of the earliest pictures of London’s fog, in the 1835 painting of The Thames above Waterloo Bridge. 1835 Turner is a trueborn Londoner, is advertising his familiarity with London’s air problem by putting smoke, an atmospheric pollution at its center. —— —— And as you can see, in here, the bridge is the central element, which is a theme that’s later taken up by Monet. And it’s partly obscured by the steam and smoke, which rises from both sides of the river. Here, we see a shot-tower. I think you can just about to see, which was constructed in 1826. 1826 Do you know what shot-towers are? They produce shot for guns, ammunition. And they were very smoky, one of the most smoking industries. But it’s barely visible, as you can see, as are the various industries on the Lambeth side of the river. There’s, on this side, there’s a steamship about to dock or preparing to leave. Its black smoke thrusting up to join the kind of swirling arc of smoke there. William Rodner sees this painting as a potent essay on the energy and complexity of modern polluted urbanism. · Smoke, I think, here represents a flourishing economy, which brings employment and food on tables, but also the dirt and pollution associated with the fumes all seems to be tainted by sulfurous yellow.","ref":"Turner painted one of the earliest pictures of London’s fog in the 1835. Turner is familiar with London’s air problem by putting smoke at its center. The bridge is the central elements, and it is a theme that’s later taken up by Monet. We see a shot-tower and a steamship. They were very smoky and barely visible. The speaker thinks they represent for a flourishing economy, but also the dirt and pollution. Turner在1835年画了伦敦雾霾的最早画作之一。通过将烟雾作为画面的中心，透纳展现了伦敦的空气问题。桥梁是画作的核心元素，这一主题后来被莫奈所延续。画面中我们可以看到烟塔和蒸汽船，它们都被浓烟笼罩，几乎无法看清。讲者认为这些元素代表了一个繁荣的经济，但同时也象征着脏乱和污染。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678155/9100f34b3814419f92226fc349fa7c91.mp3","phrases2":[{"en":"but → it’s barely visible as you can see","zh":"但如你所见，它几乎看不见"},{"en":"but → also the dirt and pollution associated with the fumes all","zh":"还有与废气相关的所有灰尘和污染"}]},{"id":1581,"name":"London taxi drivers","phrases":["but → can really thank the Great Exhibition of 1851","because → the cabbies of the day and their horse-drawn carts were","so → a great public outcry the London Authority sets up Public"],"eng":"But we can really thank the Great Exhibition of 1851 for giving us the world’s premier taxi service, 1851 for it was going to this exhibition, and this fabulous exhibition inventions from all around the four corners of the Empire that the visitors were appalled, dismayed and vexed by their journeys to this exhibition because the cabbies of the day and their horse-drawn carts were absolutely terrible and could not find their way to this exhibition. And, so, a great public outcry, the London Authority sets up Public Carriage Office, which is an organization that still exists. And you can take a short walk to Penton Street up the road. Penton And this Public Carriage office took on the responsibility of licensing all major taxi drivers in London. All taxi drivers from 1851 onwards had to pass what is now known as the London knowledge, 1851 “ ” which is phenomenal knowledge of London. What is the London knowledge? It’s the ability to remember the 25,000 streets, have it all interconnected and all the main arterial roads in and out of London. 25,000 Cabbies need to know all this plus a thousand points of specific interest cafes, bars, public offices. They need to know them all as part of their training.","ref":"The Great Exhibition of 1851 gives us the world’s premier taxi service. The London Authority sets up Public Carriage Office and it still exists. London Knowledge is the ability to remember 25,000 streets and have them all interconnected within London. Cabbies also need to know things like cafes or bars that as they are parts of their training. 1851年的大博览会为我们带来了世界上最著名的出租车服务。伦敦当局设立了公共运输办公室，它至今仍然存在。伦敦知识是指能够记住伦敦25000条街道，并将它们互相连接起来的能力。出租车司机还需要了解像咖啡馆或酒吧这样的地点，这些也都是他们培训的一部分。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678154/fd98b116e0ae4412907f935f5bf14581.mp3","phrases2":[{"en":"but → can really thank the Great Exhibition of 1851","zh":"但我们真得感谢1851年的万国工业博览会"},{"en":"because → the cabbies of the day and their horse-drawn carts were","zh":"因为当时的出租马车车夫和他们的马车……"},{"en":"so → a great public outcry the London Authority sets up Public","zh":"于是舆论大哗，伦敦当局设立了公共……"}]},{"id":1571,"name":"Measuring food","phrases":["for example → you're trying to watch your weight and you're out","if → you're trying to watch your weight and you're out","so → wanted to find a more objective way for people","when → they're out and about I came up with a more","so → I order some watermelon for dessert","so → I know it's seven by five","so → put your finger it's in along with your height"],"eng":"I'm a dietitian and I work in clinical weight-loss recently. Accurately estimating portion size is critical in research or real-world settings. For example, if you're trying to watch your weight and you're out to dinner and you're presented with a bowl of food, there's no really good way to actually estimate how much you're eating unless you're gonna whip some scales out of your bag. So we wanted to find a more objective way for people to quantify what they're eating when they're out and about. I came up with a more hands-on approach. We got people to measure the dimensions of the food using the width of their fingers and remembering back to primary school maths. We use the geometric volume formulas to estimate the weight of the food. To show you how this works, I've ordered a piece of lasagna. And that's my box, a glass of wine and that's my cylinder. —— And I'm feeling pretty healthy, so I order some watermelon for dessert. And that's my wedge. So this was I know it's seven by five, by four fingers. In the future, I see this method be incorporated into smartphone applications. So you put your finger, it's in along with your height and your weight. And the app will do all of the calculations for you. And then you've got a more accurate way to estimate the portion size.","ref":"This lecture talks about accurately estimating portion size. Firstly, the speaker works in clinical weight-loss as a dietitian and thinks accurately estimating portion size is critical because there’s no good way to measure food when dinning out. Secondly, the speaker mentions a more objective way to quantify food: using the width of fingers to measure the dimensions of food. Thirdly, the speaker mentions smartphone applications that will do all the calculations to make a more accurate estimation. In conclusion, fingers and apps can help estimate the portion size in the future. 这一讲座讨论了如何准确估算食物份量。首先，讲者作为一名临床减肥的营养师，认为准确估算食物份量至关重要，因为外出就餐时没有一个好的方法来衡量食物的量。其次，讲者提到了一种更客观的量化食物的方法：利用手指宽度作为测量单位来测量食物的尺寸。第三，讲者还提到了智能手机应用程序，这些应用程序在未来能够配合手指做出所有计算，从而提供更准确的估算。总之，在未来，人们可以利用手指和应用程序估算食物份量。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678144/1163c8dfa5fb4e829bee66d3a99b7666.mp3","phrases2":[{"en":"for example → you're trying to watch your weight and you're out","zh":"例如，如果你想控制体重，又正好在外面"},{"en":"if → you're trying to watch your weight and you're out","zh":"如果你想控制体重，又正好在外面"},{"en":"so → wanted to find a more objective way for people","zh":"所以我们想为人们找到一种更客观的方法"},{"en":"when → they're out and about I came up with a more","zh":"当他们外出走动时，我想出了一个更……"},{"en":"so → I order some watermelon for dessert","zh":"所以我点了些西瓜当甜点"},{"en":"so → I know it's seven by five","zh":"所以这个是——我知道——是 7×5"},{"en":"so → put your finger it's in along with your height","zh":"所以你把手指放进去，再加上你的身高"}]},{"id":4276,"name":"Melatonin","phrases":["so → of course in humans we sleep","but → animals like rodents they are awake"],"eng":"I'm just going to take on the stuff where left off. The hormone I want to now talk about it's called melatonin. The synthesis is in the Pineal Gland, which is very small. It is the size of a pea in your brain. The corpus is the site of the soul, and it is where melatonin is made. “ ” And it has a rhythm as well. And in this sense, it is the opposite of the cortisol. It peaks at night. We call it the darkness hormone. “ ” In every species that we studied, melatonin occurs at night. And it's a hormone that prepares you for the things, that your species, does at night. So, of course, in humans we sleep, but animals, like rodents, they are awake. It's a hormone that is related to darkness behavior.","ref":"The lecture talks about melatonin. This hormone is synthesized in the Pineal Gland. It is very small, the size of a pea in your brain. This is where melatonin is made. It has a rhythm and it is the opposite of cortisol. It peaks at night, so we call it the darkness hormone. In every species studied, melatonin occurs at night. It prepares you for what your species does at night. Humans sleep, but animals like rodents are awake. It is a hormone related to darkness behavior. 这场讲座讲的是褪黑素。这种激素在松果体中合成。它非常小，在你大脑中只有豌豆大小。这里是制造褪黑素的地方。它有节律性，并且与皮质醇相反。它在夜间达到峰值，所以我们称它为黑暗激素。在每一个被研究的物种中，褪黑素都在夜间出现。它为你在夜间要做的事情做准备。人类在夜间睡觉，但像啮齿动物这样的动物在夜间是清醒的。它是一种与黑暗行为相关的激素。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693308/0b2271b1ee83493dbbab0bc7e215cc36.mp3","phrases2":[{"en":"so → of course in humans we sleep","zh":"当然，人类会睡觉"},{"en":"but → animals like rodents they are awake","zh":"但像啮齿动物这样的动物却醒着"}]},{"id":1597,"name":"Moon launch base","phrases":["since → before the first Moon landings of 1969","but → several reasons why the","however → be immense"],"eng":"Since before the first Moon landings of 1969, there has been interest in space travel to the Moon. 1969 Lunar programs are expensive and difficult, but there are several reasons why the Moon might be a good place to launch further space exploration. Firstly, a Moon launch base would eliminate the most difficult aspect of space travel, namely getting a rocket through the Earth's gravity. The journey time between, say, going to Mars from Earth rather than from the Moon is not significant. However, the cost difference would be immense, as it would take 20 times less fuel to launch a spacecraft from the Moon than from the Earth due to there being less gravity on the Moon. 20 There would not need to be a drain on the Earth's resources, as the Moon is rich in all the necessary minerals such as aluminum and silicon, which would mean that the entire infrastructure needed to enable spacecraft launch from the Moon could be done robotically using the materials already present.","ref":"The Moon could be a good base to launch spacecraft that would explore the Solar System further. Although some of the same issues would apply as when launching a spacecraft from Earth, it would be easier from the Moon because of less gravity. It would be cheaper because less fuel would be needed, and all the materials required to build the necessary infrastructure are already on the Moon naturally. 月球可能是发射进一步探索太阳系的航天器的良好基地。尽管可能会遇到一些与从地球发射航天器时相同的问题，但由于重力较小，从月球发射航天器会更容易。这会更便宜，因为需要的燃料更少，而且建造必要基础设施所需的所有材料已经在月球上天然存在了。","audio":"https://ti.koolearn.com/upload/ti/sardine/2656000-2657000/2656714/3566326442774c0fad172af1a307e52b.mp3","phrases2":[{"en":"since → before the first Moon landings of 1969","zh":"早在1969年首次登月之前"},{"en":"but → several reasons why the","zh":"但月球之所以可能是一个……，有几个原因"},{"en":"however → be immense","zh":"然而，成本差异将极其巨大"}]},{"id":3347,"name":"Music and well-being","phrases":["so → we mean by well-being","so → often forms an intuitive part of our well-being management","so → many levels whether it’s soothing and teaching our infants","but → no reason to stop here"],"eng":"So what do we mean by well-being? Health, happiness, a sense of achievement and contentment, a state of mind and body where people can thrive. Well-being is not something that is purely limited to people who are facing extraordinary challenges in their lifestyle, health or personal circumstances, everybody here has a level of well-being. Music so often forms an intuitive part of our well-being management, music to pick us up, music to calm us down, music to heal our sorrows. Our aim through research is to move from this level of intuitive application of music through to informed use in our communities to take the next step in the understanding of the power of music in human life. Music already works for us on so many levels whether it’s soothing and teaching our infants, bringing people and communities together, adding spirit to our work and personal endeavours, but there is no reason to stop here.","ref":"The lecture mainly focuses on well-being, which includes health, happiness, a sense of achievement and contentment, a state of mind and body where people can thrive. In addition, everybody has a level of well-being. The speaker also emphasizes that music so often forms an intuitive part of our well-being management, and the research takes the next step in the understanding of the power of music in human life. In conclusion, the music already works for us on so many levels, but there is no reason to stop here. 这次讲座主要关注幸福感，包括健康、幸福、成就感和满足感，以及人们能够茁壮成长的身心状态。此外，每个人都有自己的幸福感水平。讲者还强调，音乐天然融入人类对幸福感的追求，研究也在理解音乐在人类生活中力量的基础上迈出了下一步。总之，音乐已经在许多层面上为我们发挥作用，但没有理由止步于此。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690232/16d473f22cd9449ebacf84efb9aaaef3.mp3","phrases2":[{"en":"so → we mean by well-being","zh":"那么，我们所说的福祉是什么意思？"},{"en":"so → often forms an intuitive part of our well-being management","zh":"因此，这常常直观地构成我们福祉管理的一部分"},{"en":"so → many levels whether it’s soothing and teaching our infants","zh":"涉及许多层面，无论是安抚还是教导我们的婴儿"},{"en":"but → no reason to stop here","zh":"但没有理由就此止步"}]},{"id":3377,"name":"Narratives","phrases":["when → do not witness the scenario","for example → I asked my mother about the war","when → I asked my mother about the war","when → talked to me\" \"","when → asked her about the shelter","when → did you go to the shelter\""],"eng":"The comics I show you with lots of people chatting around in a room is a form of description. —— —— We use different kinds of methods to describe a situation. Sometimes we have to use visual description, particularly when we do not witness the scenario. I was born during the Second World War and my hometown is X... X... For example when I asked my mother about the war, I always ask her \"you have mentioned this or that when you talked to me\"... \"...\" When you asked her about the shelter, I asked her \"what the shelter looks like\" and \"when did you go to the shelter\". \" \" \" \" From her response I could get more visual evidence as I can to write my book.","ref":"This lecture is about visual description. Firstly, the speaker mentions about the comics with many people chatting in a room and it is a form of description. Secondly, the speaker mentions that people use different kinds of methods to describe a situation. Thirdly the speaker mentions that people have to use visual description when they don’t see the scene. He used own experience as an example describing the second war, his home town and the shelter his mother went to. In conclusion, in such way the speaker gets visual evidence to write his book. 本讲座的主题是视觉描述。首先，主讲人提到了许多人在一个房间里聊天的漫画，这是一种描述形式。其次，演讲者提到人们使用不同的方法来描述情境。第三，他提到人们在没有看到场景时必须使用视觉描述。他以自己的经历为例，描述了第二次世界大战、他的家乡和他母亲去的避难所。总之，作者通过这种方式获得了写作本书的视觉证据。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690268/415198dd01fb44d3a3b0f962c71c4b21.mp3","phrases2":[{"en":"when → do not witness the scenario","zh":"当我们没有目睹这一场景时"},{"en":"for example → I asked my mother about the war","zh":"例如，当我问母亲关于战争的事时"},{"en":"when → I asked my mother about the war","zh":"当我问母亲关于战争的事时"},{"en":"when → talked to me\" \"","zh":"当你和我说话时"},{"en":"when → asked her about the shelter","zh":"当你问她关于避难所的事时"},{"en":"when → did you go to the shelter\"","zh":"你什么时候去的避难所？"}]},{"id":1601,"name":"Paper marbling","phrases":["in order to → create unique and detailed designs","although → begun in China or Japan","especially → in England 17","however → attempts to encourage a new generation to discover","so → hope for this art"],"eng":"Today I am going to talk about the art of paper marbling, which, as the name suggests, is about adding beautiful, colorful designs onto paper. It involves putting a piece of paper onto a tray of special water and paint in order to create unique and detailed designs. As for the history of this art, the origins are not entirely known, although it is believed to have begun in China or Japan. Paper marbling subsequently became very popular in Turkey. Indeed, Turkish paper marbling developed its own particular styles, characterized by brighter colors. This type of marbling gained a lot of popularity in Europe in the 17th century and was used extensively in the publishing industry for book covers, especially in England. 17 It was an attractive and effective way of hiding any minor damage to a book. Nowadays, the art of paper marbling is in decline for various reasons. However, there are attempts to encourage a new generation to discover paper marbling and social media is a great way to promote it to a new audience. Paper marbling classes are also starting to appear, so perhaps there is hope for this art.","ref":"Paper marbling is a form of art which is thought to have originated in China and Japan. It later spread to Turkey, where unique Turkish styles of paper marbling became popular. Turkish marbling designs became very popular across Europe in the 17th century and especially in England where they were used extensively in the publishing industry. Marbled paper was used in books to cover up any slight damage to a book. Nowadays, this traditional art is far less common, but there are attempts to revive it by encouraging people to take special classes and by promoting it via social media. 石纹纸染是一种被认为起源于中国和日本的艺术形式。它后来传播到土耳其，在那里独特的土耳其风格的石纹纸染变得流行起来。土耳其石纹设计在17世纪在整个欧洲变得非常流行，特别是在英国，它们被广泛用于出版业。石纹纸染被用来掩盖书本上的任何轻微损坏。如今，这种传统艺术已经不那么常见了，但有人试图通过鼓励人们参加特殊课程并通过社交媒体推广来复兴它。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658428/fb74543142da4d19ab6bdd72d8fb7260.mp3","phrases2":[{"en":"in order to → create unique and detailed designs","zh":"为了创作独特而细致的设计"},{"en":"although → begun in China or Japan","zh":"尽管人们认为它起源于中国或日本"},{"en":"especially → in England 17","zh":"尤其是在英国17，这是一种有吸引力且有效的方式"},{"en":"however → attempts to encourage a new generation to discover","zh":"然而，有人尝试鼓励新一代去发现"},{"en":"so → hope for this art","zh":"所以，也许这门艺术还有希望"}]},{"id":1576,"name":"Politics and international relations","phrases":["in addition → to acquiring specialist knowledge and competencies in Politics and International"],"eng":"This course provides students with an in-depth understanding of the exciting disciplines of politics and international relations. Students will learn about the workings of political institutions in countries around the world and explore the complex field of relations between nations. Topics in governance, public policy, public administration, national security and border control ensure that students receive a broad and current education in the range of issues which are covered under the label of politics and international relations. Students will undertake four compulsory units and two majors, one in politics and international relations and the other in governance and policy. They will also choose an elective major from a wide choice of options including political communication, international studies, international business and national security studies. In addition to acquiring specialist knowledge and competencies in Politics and International Relations and Commerce, students will graduate with a range of generic skills such as critical thinking, enhanced communication abilities, problem-solving and strong capacities to work with others. They will also develop ethically based and socially responsible attitudes and behaviors.","ref":"The lecture is about the course. Students can have an understanding of the exciting disciplines of politics and international relations. The topics are covered under the label of politics and international relations. Students will undertake four compulsory units and two majors. They will also choose an elective major from a wide choice of options. Students will graduate with a range of generic skills. They will also develop ethically based and socially responsible attitudes and behaviors. 这一讲座讲述了课程内容。学生可以深入了解政治学和国际关系这一令人兴奋的学科。课程涵盖了政治学和国际关系的各个主题。学生将修读四门必修课程和两个主修课程，并从广泛的选项中选择一门选修主修课程。学生毕业时将具备一系列通用技能，并且培养以伦理为基础的社会责任感和行为。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678149/ea90fda305dc4116aabe237d49d1dd21.mp3","phrases2":[{"en":"in addition → to acquiring specialist knowledge and competencies in Politics and International","zh":"除了获得政治与国际领域的专业知识和能力外"}]},{"id":3371,"name":"Psychologist","phrases":["if → to ask you to name a famous psychologist","but → died in London and he escaped to London soon","but → he's not known for any single discovery","instead → he's known for the development of and encompassing theory"],"eng":"For better or worse, we live in a world profoundly affected by Sigmund Freud. ・ If I had to ask you to name a famous psychologist, the answer of most of you would be Freud. He's the most famous psychologist ever and he's had a profound influence on the 20th and 21st century. 20 21 Some biographical information: he was born in the 1850s. 19 50 He spent most of his life in Vienna, Austria, but he died in London and he escaped to London soon after retreating there at the beginning of World War Two as the Nazis began to occupy where he lived. He's one of the most famous scholars ever but he's not known for any single discovery. Instead, he's known for the development of and encompassing theory of mind, one that he developed over the span of many decades.","ref":"The lecture is about psychologist Sigmund Freud. He is the most famous psychologist that has a profound influence on the 20th and 21st century. He spent most of his life in Vienna and died in London. At the beginning of world war two, the Nazis occupied where he lived. He is known for the development of and encompassing theory of mind. 这堂课是关于心理学家西格蒙德·弗洛伊德的。他是20世纪和21世纪最著名的影响深远的心理学家。他在维也纳度过了大半生，在伦敦去世。第二次世界大战开始时，纳粹占领了他住的地方。他以发展和包罗万象的心智理论而闻名。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690262/4e05feda69d1476cbe7cc23415824332.mp3","phrases2":[{"en":"if → to ask you to name a famous psychologist","zh":"如果非要让你说出一位著名心理学家的名字"},{"en":"but → died in London and he escaped to London soon","zh":"但他在伦敦去世了，而且他很快就逃到了伦敦"},{"en":"but → he's not known for any single discovery","zh":"但他并非因任何单一发现而闻名"},{"en":"instead → he's known for the development of and encompassing theory","zh":"相反，他因发展出一套涵盖广泛的理论而闻名"}]},{"id":3364,"name":"Rice","phrases":["when → Mexico unable to feed its growing population","yet → exist to directly manipulate the genes of plants","so → IR8 was created by carefully crossing existing varieties: selecting the","finally → finding the best 1962 IR8","instead → of just one doubling the yield"],"eng":"In 1943, what became known as the Green Revolution began when Mexico, unable to feed its growing population, shouted for help. 1943 “ ” Within a few years, the Ford and Rockefeller Foundations founded the International Rice Research Institute in Asia, and by 1962, a new strain of rice called IR8 was feeding people all over the world. 1962 IR8 IR8 was the first really big modified crop to make a real impact on world hunger. IR8 In 1962 the technology did not yet exist to directly manipulate the genes of plants, and so IR8 was created by carefully crossing existing varieties: selecting the best from each generation, further modifying them, and finally finding the best. 1962 IR8 Here is the power of modified crops: IR8, with no fertilizer, straight out of the box, produced five times the yield of traditional rice varieties. IR8 In optimal conditions with nitrogen, it produced ten times the yield of traditional varieties. By 1980, IR36 resisted pests and grew fast enough to allow two crops a year instead of just one, doubling the yield. 1980 IR36 And by 1990, using more advanced genetic manipulation techniques, IR72 was outperforming even IR36. The Green Revolution saw worldwide crop yields explode from 1960 through 2000. 1990 IR72 IR36 1960 2000","ref":"The lecture explains the Green Revolution, starting in 1943 when Mexico faced food shortages. To solve this, Research institutes were built in Asia. By 1962, they developed IR8, a highyield rice variety that produced five times more rice than traditional types without fertilizer, and ten times more with nitrogen. Later, IR36 resisted pests and allowed two crops yearly, doubling yields. By 1990, IR72 improved further with advanced genetic techniques. From 1960 to 2000, these modified crops dramatically increased global food production, reducing hunger worldwide. 本次讲座解析了始于1943年的\"绿色革命\"。当时墨西哥面临粮食危机，为应对此问题，科研机构在亚洲建立了实验基地。到1962年，科学家成功培育出IR8高产水稻品种——在不使用化肥的情况下产量达到传统水稻的五倍，施用氮肥后更可增产十倍。随后问世的IR36品种兼具抗虫特性并能实现一年两熟，使产量再度翻番。至1990年，通过先进遗传技术培育的IR72品种进一步提升了作物性能。在1960至2000年间，这些改良作物推动全球粮食产量大幅增长，有效缓解了世界范围的饥荒问题。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690255/d384c0d225f04b2da3e123a5651a577c.mp3","phrases2":[{"en":"when → Mexico unable to feed its growing population","zh":"当墨西哥无法养活其不断增长的人口时"},{"en":"yet → exist to directly manipulate the genes of plants","zh":"但已能直接操控植物基因"},{"en":"so → IR8 was created by carefully crossing existing varieties: selecting the","zh":"因此，通过精心杂交现有品种培育出了IR8：选择"},{"en":"finally → finding the best 1962 IR8","zh":"最终找到了1962年最佳的IR8，这就是其威力所在"},{"en":"instead → of just one doubling the yield","zh":"而不是仅仅让产量翻一番"}]},{"id":1598,"name":"Roman London","phrases":["because → writing in a society that where literacy rates would"],"eng":"The other thing that this tablet tells us a little about, about, as I've mentioned, is the fact that writing is hugely important in Roman London. And it's something which really marks it out within the context of Roman Britain. Here we have in excess of 500 examples of wooden writing tablet surviving, many, many other inscriptions. 500 An awful lot of them are tool with this whole kind of idea of commerce, of business transaction, an awful lot of it. Written texts are tool of the Roman army, and that's precisely because writing in a society that where literacy rates would have been significantly lower than they were today was really a tool of power. And things like these rather fancy metal inkwells, which have been found in a number of sites in London, I think really reflect that. And in fact, they're within Britain. They're quite heavily concentrated here.","ref":"Writing was very important in Roman London, despite the fact that literacy rates then would have been much lower than they are today. Over 500 wooden writing tablets have survived with a lot of different inscriptions. These are related to business and commerce, with many written to the Roman army. Writing at that time was a tool of power. 在罗马时期的伦敦，尽管当时的识字率远低于今天，书写仍然非常重要。现存有500多块木质书写板，上面刻有各种不同的铭文。这些铭文与商业和贸易有关，其中许多是写给罗马军队的。在当时，书写是一种权力的工具。","audio":"https://ti.koolearn.com/upload/ti/sardine/2657000-2658000/2657205/1ff8b6bea72b47529fff9cef6f5cb66a.mp3","phrases2":[{"en":"because → writing in a society that where literacy rates would","zh":"因为在一个识字率会……的社会中写作"}]},{"id":1590,"name":"Salience","phrases":["so → when consumers attention is attracted to certain characteristics","when → attracted to certain characteristics","because → to work efficiently our brains try to take shortcuts","for example → the inviting smell of freshly baked bread in a grocery","when → they're presented in a way that is somehow cognitively unusual","because → evolved"],"eng":"How do consumers process the vast amount of information and multitude of possibilities presented to them? Well, from the perspective of behavioral economics, a concept called salience plays a key role in this. So salience is when consumers attention is attracted to certain characteristics. That's because to work efficiently, our brains try to take shortcuts by prioritizing some characteristics. In other words, items with high levels of salience stand out, meaning we'll be more likely to choose them. The salience of a product can be increased in a number of ways. Firstly, items can become more salient by appealing to one of our physical senses, for example, the inviting smell of freshly baked bread in a grocery store. Alternatively, products can also have higher salience when they're presented in a way that is somehow cognitively unusual. Advertisements which include shocking humor, usually attract consumers attention, and of course, sometimes a particular characteristic becomes more salient simply because our individual needs have evolved. A person who has recently become a parent may well start considering whether the items that they used to purchase without any hesitation are in fact child friendly.","ref":"Consumers are faced with a wide range of options, so the brain needs to find efficient ways to filter out much of this information by prioritizing certain things, items, or characteristics which attract our attention said to be salient or have higher levels of salience and as a result, are more likely to be purchased because they stand out. Products tend to have more salient when they appeal to one of our physical senses or do not conform to our expectations. Finally, the salience of a product may change over time as our individual needs or interests change. 消费者面临着广泛的选择，因此大脑需要找到有效的方法，通过优先考虑某些吸引我们注意力的被认为是突出的或具有更高显著性的事物、物品或特征来过滤掉大部分信息，因此，更有可能被购买，因为它们很突出。当产品吸引我们的身体感官或不符合我们的期望时，它们往往更具显著性。最后，产品的突出性可能会随着我们个人需求或兴趣的变化而改变。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658431/eaf54f2a95d244f2b6bfd81ff25ec730.mp3","phrases2":[{"en":"so → when consumers attention is attracted to certain characteristics","zh":"所以，显著性是指消费者的注意力被某些特征吸引。"},{"en":"when → attracted to certain characteristics","zh":"当消费者的注意力被某些特征吸引时"},{"en":"because → to work efficiently our brains try to take shortcuts","zh":"因为为了高效运作，我们的大脑会尝试走捷径。"},{"en":"for example → the inviting smell of freshly baked bread in a grocery","zh":"例如，杂货店里刚出炉面包的诱人香气。"},{"en":"when → they're presented in a way that is somehow cognitively unusual","zh":"当它们以某种认知上不寻常的方式呈现时"},{"en":"because → evolved","zh":"因为我们的个体需求已经演变。"}]},{"id":1599,"name":"Salt mining","phrases":["so → starting with probably the earliest method","when → it's exposed to sun and wind","when → this happens a layer of salt is left behind","finally → similar to other types of mineral"],"eng":"The salt trade has existed for thousands of years and arguably has played an even greater role in shaping the world's economic and social history than products like silk, cotton, or spices. Salt mining is still hugely important today, and there are three basic ways that salt can be extracted from oceans or underground sources. So starting with probably the earliest method, which is solar evaporation. —— This method is used to extract salt from seawater. Basically, seawater is collected in shallow pools. The sea water dries out when it's exposed to sun and wind. When this happens, a layer of salt is left behind, which can be cleaned and harvested. A newer technique is solution mining. This method uses a water solution to extract salt from underground rock sources. Water is injected into the rock and absorbs the salt. The salty liquid is then pumped back to the surface where the salt can be extracted at a processing plant. Finally, deep shaft mining is similar to other types of mineral mining. Here, pieces of rock containing the salt are drilled away from the mine shaft. These pieces are then crushed into smaller chunks and transported to the top for processing.","ref":"Salt has always been important throughout history. There are three main ways to extract salt. Solar evaporation is a traditional method. In this method, sun and wind dry out seawater, which has been collected in pools. The salt that remains can then be collected and processed. Solution mining uses liquid to extract and transport salt from underground rocks. Similarly, deep shaft mining collects salt from rocks, but by drilling and removing pieces of rock, which can then be processed. 盐在历史上一直很重要。提取盐主要有三种方法。太阳蒸发是一种传统的方法。在这种方法中，阳光和风使收集在池中的海水变干。剩下的盐可以被收集和处理。溶液采矿使用液体从地下岩石中提取和运输盐。类似地，深井采矿从岩石中收集盐，但是通过钻孔和移除岩石块，然后可以对其进行加工。","audio":"https://ti.koolearn.com/upload/ti/sardine/2657000-2658000/2657568/54bddc08978f409192c6d980c59b4881.mp3","phrases2":[{"en":"so → starting with probably the earliest method","zh":"那么，先从大概最早的方法说起"},{"en":"when → it's exposed to sun and wind","zh":"当它受到风吹日晒时"},{"en":"when → this happens a layer of salt is left behind","zh":"发生这种情况时，会留下一层盐"},{"en":"finally → similar to other types of mineral","zh":"最后，深井开采与其他矿物开采类型类似"}]},{"id":1596,"name":"Savings","phrases":["because → the middle classes usually earn more than they need","thus → can save money","thus → understand the savings habits of the new","therefore → aimed to investigate patterns of savings and reasons for savings","especially → business owners who tended to save more"],"eng":"The enormous rise of the middle class in certain developing countries is one of the greatest economic successes of the late 20th and early 21st centuries. 20 21 This is excellent for the economies of those countries because the middle classes usually earn more than they need to live on, and thus they can save money. It's important that economists understand how these processes work, and thus they need to understand the savings habits of the new middle class. Our research therefore aimed to investigate patterns of savings and reasons for savings decisions. The country we chose to focus on was India. We found that, not surprisingly, it was the richer people, especially business owners, who tended to save more. As for the reasons for saving, the number one reason was to provide an income after retirement. Having an income after becoming too old to work was important for savers who wanted to be able to enjoy their older years. And the second most important reason was for family purposes, such as the education and weddings of their children.","ref":"The middle classes in some developing countries have grown considerably from the last part of the previous century. This has benefited those economies greatly, but economists need to further investigate some of the details, such as p atterns of savings and the reasons for saving. The researchers mentioned here carried out their studies in India. Their conclusions included the fact that, unsurprisingly, richer people and business owners tended to save more. T he most important reason for saving was to provide for retirement, and the second was to provide their children with things like education and marriage ceremonies, which presumably are expensive in India. 中产阶级在一些发展中国家自上个世纪后期以来有了显著的增长。这对这些国家的经济带来了极大的益处，但经济学家需要进一步研究一些细节，如储蓄模式和储蓄的原因。这里提到的研究者们在印度进行了他们的研究。他们的结论包括一个毫不意外的事实，即较富有的人和企业主倾向于储蓄更多。储蓄的最重要原因是为退休后的生活提供保障，其次是为了给子女提供诸如教育和婚礼等事宜，这些在印度通常是昂贵的。","audio":"https://ti.koolearn.com/upload/ti/sardine/2656000-2657000/2656693/607e43cb7cd64dada7c11eebff59c904.mp3","phrases2":[{"en":"because → the middle classes usually earn more than they need","zh":"因为中产阶级通常收入高于所需"},{"en":"thus → can save money","zh":"因此他们能存钱，经济学家必须了解他们是如何做到的"},{"en":"thus → understand the savings habits of the new","zh":"因此他们需要了解新群体的储蓄习惯"},{"en":"therefore → aimed to investigate patterns of savings and reasons for savings","zh":"因此旨在研究储蓄模式及储蓄原因"},{"en":"especially → business owners who tended to save more","zh":"尤其是往往储蓄更多的企业主"}]},{"id":3379,"name":"Shuttle","phrases":[],"eng":"The shuttle was designed to be a space truck — it's a multi-purpose vehicle. \" \"—— We've done a tremendous number of different things with it. It's the most versatile space vehicle that has ever been built. We've used it to launch satellites. We've used it to repair satellites in orbit and put them back into orbit. We've used it to capture satellites and bring them back to Earth for repair. We've outfitted it with the space lab built by our European partners and used it before the era of the space station to do scientific research. We used it as part of our partnership with the Russians, which is still continuing, first as part of the Mir space station, \" \" —— where we actually prolonged the useful life of Mir by several years through logistical supply visits with the shuttle. And now, of course, we're using it to build the new international space station, which is a huge international partnership.","ref":"The shuttle was a space truck. It's a multi-purpose vehicle. The shuttle is the most versatile space vehicle that has ever been built. People used it to launch and repair satellites and outfitted it with the space lab and used it to do scientific research. People used it as part of the partnership with the Russians, which is still continuing. People will use it to build the new international space station, which is a huge international partnership. 航天飞机是一辆太空卡车，它是一种多功能飞行器。航天飞机是有史以来用途最广的太空交通工具。人们用它来发射和维修卫星，用它来装备太空实验室，用它来进行科学研究。人们用它作为与俄罗斯人合作的一部分，这种合作仍在继续。人们将用它来建造新的国际空间站，这是一个巨大的国际伙伴关系。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690270/d65fc72778f14fdea1ca164873aaeb7a.mp3","phrases2":[]},{"id":3354,"name":"Shy fish","phrases":["when → think of a leader","but → a new study of fish called sticklebacks shows that shy","while → another shy fish followed And in other groups","when → an equally wary fellow was already out there","because → the bold fish initiated more trips","when → offered a choice of leaders","but → nevertheless be able to impose their leadership","if → such tendencies also hold true in humans"],"eng":"When you think of a leader, you may think of an individual who is above all bold. But a new study of fish called sticklebacks shows that shy individuals actually prefer to follow fish that are similarly timid. Researchers had trios of sticklebacks with known personalities play follow the leader. “ ” The fish were placed in a tank that had some plastic plants at one end and some food hidden at the other. In some of the groups, a bold fish and a shy fish acted as leaders, while another shy fish followed. And in other groups, it was a bold fish that did the following. The researchers recorded whether the follower sallied forth more frequently with the fish that was behaviorally similar or the one that was different. What they found is that shy fish were more likely to emerge from undercover when an equally wary fellow was already out there. Bold follower fish did not seem to care which leader they followed. Of course, no matter which fish a stickleback chose to stick with, the bold fish did lead more expeditions over the course of the experiment than their more retiring friends. That’s because the bold fish initiated more trips, regardless of who might be tailing them. The findings are in the journal Biology Letters. The researchers write that “when offered a choice of leaders, sticklebacks prefer to follow individuals whose personality matches their own, but bolder individuals may, nevertheless, be able to impose their leadership, even among shy followers, simply through greater effort.” “ ” We may soon see if such tendencies also hold true in humans, when Americans decide who they’ll follow in November. 11 Unless, of course, something fishy happens. —— “ ”","ref":"A new study shows that shy individuals actually prefer to follow fish that are similarly timid. The scientists separated the fish into two groups, found that shy individuals actually prefer to follow fish that are similarly timid. That’s because the bold fish initiated more trips, regardless of who might be tailing them. If such tendencies also hold true in humans, when Americans decide who they’ll follow in November. 一项新的研究表明，胆小的个体实际上更喜欢跟随性格相似的胆小鱼。科学家将鱼分为两组，发现胆小的个体确实更喜欢跟随性格相似的胆小鱼。这是因为大胆的鱼发起了更多的出行，无论是谁在尾随它们。如果这种趋势在人类中也成立，那么当美国人在11月决定跟随谁时，可能会有类似的现象。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690243/be4603e3ccb7403ba3626950d583b9e0.mp3","phrases2":[{"en":"when → think of a leader","zh":"当你想到领导者时"},{"en":"but → a new study of fish called sticklebacks shows that shy","zh":"但一项关于名为刺鱼的鱼类的新研究表明，害羞的"},{"en":"while → another shy fish followed And in other groups","zh":"而另一条害羞的鱼跟随了；而在其他群体中"},{"en":"when → an equally wary fellow was already out there","zh":"当一条同样警惕的同类已经先出去时"},{"en":"because → the bold fish initiated more trips","zh":"因为胆大的鱼发起了更多次出行"},{"en":"when → offered a choice of leaders","zh":"当可以选择领导者时"},{"en":"but → nevertheless be able to impose their leadership","zh":"但更大胆的个体或许仍能强加自己的领导地位"},{"en":"if → such tendencies also hold true in humans","zh":"如果这种倾向在人类身上也成立"}]},{"id":3358,"name":"Smartphone apps","phrases":["so → we take this noise and make","if → you’re anemic your bloods maybe a little less red","while → no idea necessarily what jaundice might","but → their applications and their implications for our health and well-being"],"eng":"Computer scientist Shwetak Patel and his team are developing new sensing systems. Shwetak Patel The initial focus was really around energy and water monitoring. They built a new generation of smart sensors that monitor electronic interference on a home’s power line or water pressure changes in the plumbing. Most of this technology has already found industrial applications, and Patel and his team turned their attention to adapting the technology for personal health monitoring. Patel ‘So how do we take this noise and make it into a signal interest was hard to us, hard to us in the core of what we did for many years and we’re taking that work and applying it to other domains.’ “ ‘ ’ ” They’re looking to take advantage of all the functionality built in our smartphones. With the users’ permission, this app can use the microphone built into most smartphones to listen to background noises, such as coughing searching for patterns that suggest a trip to the doctor might be an order. ‘We've constructed these models that try and understand how sound works, how it, what its patterns are and we give it a whole bunch of examples of different kinds of audio, things like people talking, things like people laughing, sneezing and of course coughing.’ “ ” This app uses a phone’s camera to check hemoglobin levels in blood by analyzing the color of capillary fluid through the skin. Generally, what happens is if you’re anemic, your bloods maybe a little less red and we take advantage of that by putting your finger over a camera of a phone, the camera of the phone can actually see the coloration of the blood. and this test uses the camera to tell parents worried about jaundice in newborn infants. ‘Now, jaundice is something that doctors who have seen tons of babies. He just can figure out on a very basic level of it. Is this baby, do they need to get treatment or are they in a good condition, while the first-time parent has no idea necessarily what jaundice might look like.’ “ ” The researchers say the built-in sensors found in smartphones are already commonplace, but their applications and their implications for our health and well-being may be more far-reaching than we ever imagined.","ref":"Computer scientist and his team are developing new sensing systems. The initial focus was on energy and water monitoring. They paid attention to adapting the technology for personal health monitoring. They took advantage of all the functions built in our smartphones. The applications and their implications for our health and well-being may be more far-reaching than we ever imagined. 计算机科学家和他的团队正在开发新的传感系统。最初的重点是能源和用水监测。后来他们将注意力转向将这项技术应用于个人健康监测。他们充分利用了智能手机中内置的各种功能。这些应用及其对我们健康与福祉的影响，可能比我们曾经想象的更加深远。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690248/70c26b7708eb426092b253dbbe79c29f.mp3","phrases2":[{"en":"so → we take this noise and make","zh":"那么我们如何利用这些噪声，使其"},{"en":"if → you’re anemic your bloods maybe a little less red","zh":"如果你贫血，你的血液可能没那么红"},{"en":"while → no idea necessarily what jaundice might","zh":"而初为人父母者未必知道黄疸可能是什么"},{"en":"but → their applications and their implications for our health and well-being","zh":"但它们的应用及其对我们健康与福祉的影响"}]},{"id":4275,"name":"Smell of books","phrases":["but → it And what does it mean","when → we’ve recently when at UCL Center for Sustainable Heritage","when → at UCL Center for Sustainable Heritage","so → important to our audience","so → important how people perceive the library","so → quite an important message in our","because → so interested in how","so → interested in how we how we interact with each other"],"eng":"Indeed, the library. We’ve all been to a historic library. We’ve all enjoyed the smell of a historic library. But what is it? And what does it mean? When we’ve recently, when at UCL Center for Sustainable Heritage, we’ve recently been asked to access the environment at another historical library at Saint Paul’s Cathedral, the Wren library, an incredible place. UCL —— And it has such an intensive smell of old books, and we were also asked for the first time really I was actually taken aback by the brief, and we were asked why we should preserve the smell. It is so important to our audience. It is so important how people perceive the library. So, that is, that was quite an important message in our research. And indeed smell is an important way of how we communicate with the environment. Th
