y ineffective","because → then as now the specifying of legal duties and standards","but → were of little practical effect","but → to the detriment of the local environment"],"eng":"Before we consider international environmental law and climate change we need to consider domestic legislation, as it is within the sovereign states that international law is put into practice. This reflects the environmentalists' maxim, 'think globally act locally.' “ ” United Kingdom legislative control over the impacts of man's activity on the environment is not new. As long ago as the reign of Charles II the main concern was the production of smoke from the burning of sea coal. Almost all areas of trade and industry were subject to very detailed legislative controls at that time, although some were governed by 'self-regulation' in the form of guilds, which regulated both supply and methods of production. “ ” However, the measures implemented were mostly ineffective because then, as now, the specifying of legal duties and standards without providing any appropriate enforcement merely indicated good intentions but were of little practical effect. The next stage was prompted by the Industrial Revolution with the urbanization of society and its profound effects on the environment. Local industrialists used the Adam Smith model to maximize their economic benefit, but this was to the detriment of the local environment with the operation of 'Gresham's Law' that is, the bad drives out the good. · “ ” Those industrialists who were concerned for either the health of their employees or the local environment faced higher costs than their competitors. The result was the need for increasingly comprehensive statutory controls on the discharge of pollutants into various receiving media.","ref":"The lecture highlights the crucial role of domestic legislation in implementing international environmental law. It traces the history of UK environmental controls and explains that early regulations lack proper enforcement, which makes them ineffective. Additionally, the Industrial Revolution worsens environmental damage because industrialists prioritize economic profit. Therefore, comprehensive statutory controls on pollutant discharge become essential for effective environmental protection.","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693669/c30f61d5f398497abcf3cc4e7b004942.mp3","phrases2":[{"en":"although → governed by 'self-regulation' in the form of guilds","zh":"尽管有些受行会形式的“自我监管”约束"},{"en":"however → mostly ineffective","zh":"然而，已实施的措施大多无效"},{"en":"because → then as now the specifying of legal duties and standards","zh":"因为当时和现在一样，需要明确法律义务和标准"},{"en":"but → were of little practical effect","zh":"但实际作用甚微"},{"en":"but → to the detriment of the local environment","zh":"但这损害了当地环境"}]},{"id":2131,"name":"International law","phrases":[],"eng":"This lecture provides a historical perspective on the establishment of international law, emphasizing the pivotal role it played in ending protracted conflicts. It begins by highlighting the painful lesson learned from prolonged periods of war, prompting the creation of a new set of rules governing the behavior between states. The lecture underscores the significance of this development, particularly in the context of prolonged conflicts with no peace for 30 or even 100 years. Additionally, the roles of powerful nations such as the United States and Australia in shaping international law are discussed. It is noted that international law was formally established in 1648 as a means to end incessant wars between states and alleviate the strains of military force. 1648 Overall, the lecture emphasizes the implication function and power dynamics of international law, shedding light on its historical significance and its role in curbing conflicts and promoting stability among nations.","ref":"The lecture discusses the historical significance of international law, particularly its role in ending prolonged conflicts. It emphasizes the impact of prolonged periods of war, leading to the creation of new rules governing the behavior between states. Additionally, it highlights the establishment of international law in 1648 and underscores its implications function and power dynamics in promoting stability among nations.","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678652/2f80cb191ad24163b9a0d4cbc53a3a07.mp3","phrases2":[]},{"id":2127,"name":"International trading system","phrases":["since → the inception of the World Trade Organization (WTO)","as a result → consumers around the world now enjoy a broader range","but → as a force that enriches societies by exposing them"],"eng":"In our exploration of the international trading system, we acknowledge the significant changes since the inception of the World Trade Organization (WTO). WTO As countries opened up, an era of increased international trade commenced. Globalization has been the keystone, prompting nations to welcome foreign trade by opening their ports, fostering a globally connected economy. The ramifications of this shift touch every facet of commerce. As a result, consumers around the world now enjoy a broader range of products, competitive pricing, and improved quality. This trend has ushered in an era of unprecedented consumer benefits and widespread economic growth. To conclude from my perspective, the decision to engage in open trade has been immensely positive. Trading across borders should not just be seen as a strategic economic move, but as a force that enriches societies by exposing them to new ideas, technologies, and opportunities for development. It's a conviction of mine that trade openness is indeed a boon to global prosperity.","ref":"The international trading system has evolved significantly since the WTO's establishment, with globalization driving open trade policies and expanded commerce. Countries opening ports enabled consumers worldwide to access diverse, high-quality products at competitive prices. This interconnected system fosters economic growth by facilitating cross-border exchange of ideas, technologies, and opportunities for development. The speaker believes that open trade is a boon to global prosperity.","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678648/c48c1a5d574643fcbdda540cb0b32080.mp3","phrases2":[{"en":"since → the inception of the World Trade Organization (WTO)","zh":"自世界贸易组织（WTO）成立以来"},{"en":"as a result → consumers around the world now enjoy a broader range","zh":"因此，世界各地的消费者如今享有更广泛的选择"},{"en":"but → as a force that enriches societies by exposing them","zh":"但作为一种通过让社会接触外界来丰富社会的力量"}]},{"id":3789,"name":"Journalism and internet","phrases":["so → new: it's been around quite some time now","but → it's maturing as among other things","so → it's not like you're in a vacuum","however → a columnist for the Albuquerque Journal","so → it's really good"],"eng":"David Olivia Garcia is a co-host of New Mexico in Focus and is also the managing editor for the New Mexico Independent, which is an online news site. · · New Mexico in Focus “ ” New Mexico Independent He says that the Internet has some great benefits for journalism. The Internet is this new, amazing medium. Not so new: it's been around quite some time now. But it's maturing as, among other things, a place for journalism. In a sense, the Internet allows you to tell stories better than in a newspaper or on television. For this reason, you can do it all online: you can have the written word, you can have still photographs, you can have video. You can link and kind of connect to the other journalism that has been done on a given topic. So it's not like you're in a vacuum. The Internet has had a negative impact on these papers. However, John Fleck, who is a columnist for the Albuquerque Journal and also has his own blog, says that he doesn't think that's entirely the case. Albuquerque Journal · It really makes me more efficient as a journalist in terms of information gathering, confirmation, helping me get the background necessary to write a story. So it's really good for that.","ref":"David Olivia Garcia, co-host of New Mexico in Focus and managing editor for the New Mexico Independent, believes that the Internet has great benefits for journalism, offering various mediums to tell stories and connect with other journalistic work. However, John Fleck, a columnist for the Albuquerque Journal, argues that the Internet actually makes journalists more efficient in terms of gathering information and confirming facts.","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691682/67f174d0fbc64dd0aaac9c49ad92d8fb.mp3","phrases2":[{"en":"so → new: it's been around quite some time now","zh":"说它新？它其实已经存在很久了"},{"en":"but → it's maturing as among other things","zh":"但它正在逐渐成熟，这也是其中一方面"},{"en":"so → it's not like you're in a vacuum","zh":"所以并不是说你身处真空"},{"en":"however → a columnist for the Albuquerque Journal","zh":"然而，约翰·弗莱克是《阿尔伯克基日报》的专栏作家"},{"en":"so → it's really good","zh":"所以这真的很好"}]},{"id":3797,"name":"Leadership","phrases":["however → been quite visible in their exercise","but → been changing"],"eng":"A leader can define or clarify goals by issuing a memo or an executive order, an edict or a fatwa or a tweet, by passing a law, barking a command, or presenting an interesting idea in a meeting of colleagues. Leaders can mobilize people's energies in ways that range from subtle, quiet persuasion to the coercive threat or the use of deadly force. Sometimes a charismatic leader such as Martin Luther King Jr. can define goals and mobilize energies through rhetoric and the power of example. · · We can think of leadership as a spectrum, in terms of both visibility and the power the leader wields. On one end of the spectrum, we have the most visible: authoritative leaders like the president of the United States or the prime minister of the United Kingdom, or a dictator such as Hitler or Qaddafi. At the opposite end of the spectrum is casual, low-key leadership found in countless situations every day around the world, leadership that can make a significant difference to the individuals whose lives are touched by it. Over the centuries, the first kind, the out-in-front, authoritative leadership, has generally been exhibited by men. Some men in positions of great authority, including Nelson Mandela, have chosen a strategy of \"leading from behind\" more often, however, top leaders have been quite visible in their exercise of power. · “ ” Women (as well as some men) have provided casual, low-key leadership behind the scenes. But this pattern has been changing, as more women have taken up opportunities for visible, authoritative leadership.","ref":"The lecture talks about leadership. Leaders can define or clarify goals through various means such as issuing memos, executive orders, or laws, as well as using charisma, rhetoric, and example. Leadership can range from highly visible and authoritative to casual and low-key. Historically, authoritative leadership has been predominantly exhibited by men, but this pattern is changing as more women take up visible leadership roles.","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691706/4f9828223de242e4801b4278efe062e8.mp3","phrases2":[{"en":"however → been quite visible in their exercise","zh":"不过，高层领导人在锻炼方面一直颇为显眼"},{"en":"but → been changing","zh":"但这种模式一直在变化"}]},{"id":4457,"name":"Los Angeles","phrases":["in order to → avoid tragedy a new water source has to be found","but → simultaneously led to the tragedies of St"],"eng":"In 1781 Los Angeles is established and named Pablo de la Renta de Los Angeles by forty-four families from Mexico as a fort for soldiers. 1781 “ · · · ” More than sixty-five years later, the discovery of gold and silver medal draws settlers from across the country to northern California. After the rush for gold dies down, Americans had flocked to Northern California for a fortune begin to disperse and settle parts of Southern California. By 1870, the small town of Los Angeles has gained more than five thousand six hundred residents, which multiplies nearly 20 times by the turn of the century. 1870 20 The rapidly increasing population puts additional strain on the Los Angeles River, the city's main source of water, which has not been helped by a recent two years of drought. —— —— In order to avoid tragedy, a new water source has to be found. The city of Los Angeles is a development as an urban center and a growing thirst for water facilitated the triumph of the creation of the Los Angeles Aqueduct, but simultaneously led to the tragedies of St. Francis Dam and the draining of important landmarks like Mono Lake and Owen Zone. In the year 1900, the city of Los Angeles is growing faster than its water resources, a need for the city is as clear as the water they need. 1900 In 1902, Irish American civil engineer William Holland was named superintendent of the Los Angeles Water Department. 1902 · Soon after the department began considering options to quench the city of Los Angeles's growing thirst, they eventually settled on a lake.","ref":"Since Los Angeles was established in 1781, the rapidly increasing population puts strain on the Los Angeles River. A new water source has to be found for the city’s development as an urban center. The creation of the Los Angeles Aqueduct led to tragedies and draining of important landmarks. The Water Department eventually settled on Owens Lake as the perfect candidate to supply Los Angeles with water for expansion.","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693055/72ca6701588d44ae88732b21f6a27a51.mp3","phrases2":[{"en":"in order to → avoid tragedy a new water source has to be found","zh":"为了避免悲剧，必须找到新的水源"},{"en":"but → simultaneously led to the tragedies of St","zh":"但同时也导致了 St 的悲剧"}]},{"id":2134,"name":"Loss leader strategy","phrases":["however → that's not always the case","so → today we're going to look at a strategy called the","though → will lead to a financial loss","for instance → often sold at a special promotional","so → in essence it serves as a form of marketing","if → be enough loyal customers","so → that the short-term loss is worth the","however → should be noted that this strategy is of course"],"eng":"Now, as we all know, companies usually set out to make a profit on the goods and services they sell. However, that's not always the case. So today we're going to look at a strategy called the loss leader and why companies may decide to use it. “ ” Basically, a loss leader is a product or service that the company is willing to sell at a very low price, even though it will lead to a financial loss. “ ” For instance, brand new products are often sold at a special promotional or introductory price. introductory price The idea is that this low price will help spread the word about the product, so in essence, it serves as a form of marketing. The low price will tempt people to at least try it once, and then if the products are hit, there will be enough loyal customers that will continue to purchase it even once the company has increased the price. So the rationale is that the short-term loss is worth the potential long term gain. However, it should be noted that this strategy is of course highly risky. After all, there's nothing stopping customers from switching to other brands once the introductory price disappears. And obviously any decision which involves a financial loss has to be carefully calculated. Large companies may have the financial power to take this sort of risk, but for a new or small company, the financial implications are huge.","ref":"A loss leader is when companies intentionally sell their products at an unprofitable price in order to attract new customers. The aim of the loss leader strategy is usually for companies to build a loyal customer base so that when they eventually increase their prices, they will make a profit. However, the loss leader strategy is a potential risk especially for small companies.","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658783/73539a3ce85d46bf922c3b1b795c50f5.mp3","phrases2":[{"en":"however → that's not always the case","zh":"然而，情况并不总是如此"},{"en":"so → today we're going to look at a strategy called the","zh":"所以今天我们要探讨一种叫做……的策略"},{"en":"though → will lead to a financial loss","zh":"尽管这会造成经济损失"},{"en":"for instance → often sold at a special promotional","zh":"例如，全新产品常以特别促销价出售"},{"en":"so → in essence it serves as a form of marketing","zh":"所以本质上，它是一种营销手段"},{"en":"if → be enough loyal customers","zh":"如果产品大受欢迎，就会有足够多的忠实顾客"},{"en":"so → that the short-term loss is worth the","zh":"所以其逻辑是，短期损失是值得的"},{"en":"however → should be noted that this strategy is of course","zh":"然而，需要注意的是，这种策略当然……"}]},{"id":4468,"name":"Luxury brand","phrases":["however → that they are sold","for example → Starbucks in China right now","because → of its cost because of how frequently it is purchased","because → of how frequently it is purchased by many people","so → I think the long answer is a complicated one","but → it depends who you talk"],"eng":"The question today is, what makes a luxury brand a luxury brand and how do we distinguish it is very hard to answer. “ ” “ ” The standard business response is to say, 'they are more exclusive'. “ ” And we get exclusivity by having high price and relatively small amounts of the product available. The reality, however, of luxury brands is that they are sold in their millions, and in some cases, are not priced that much higher than the standard output. The only way I can really answer your question is to say, it is all relative. As you said in your introduction, it wasn’t that long ago in Australia that we would have considered two televisions to be a luxury, or even further back, one color television. And you can make a strong argument, for example, that Starbucks in China, right now, is a luxury purchase – because of its cost, because of how frequently it is purchased by many people. —— So, I think the long answer is a complicated one, but the answer is, it depends who you talk to. I think in the business community what we would say, is that there is a small cluster of 'more expensive brands' which have a distinct strategy that we would identify as being 'luxury brands' and they start with the Rolls Royces and the Tiffanys and the Louis Vuittons of the world. “ ” “ ” And, I think that tends to be how we see them.","ref":"How a luxury brand forms is hard to explain. For standard business, a luxury brand is about the exclusivity through high prices and low stock. However, some luxury brands are characterized by huge quantity in sales and low prices. The speaker thinks both cases are relative. Therefore, the reason to explain the formation of a luxury brand is complicated. In business community, it refers to the more expensive brands.","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693066/561a9a9de48a40a3ac25945f303d10ec.mp3","phrases2":[{"en":"however → that they are sold","zh":"然而，奢侈品牌的特点在于它们会被出售"},{"en":"for example → Starbucks in China right now","zh":"例如，现在中国的星巴克"},{"en":"because → of its cost because of how frequently it is purchased","zh":"因为它的成本，也因为它被购买的频率"},{"en":"because → of how frequently it is purchased by many people","zh":"因为很多人经常购买它"},{"en":"so → I think the long answer is a complicated one","zh":"所以我认为，详细答案很复杂"},{"en":"but → it depends who you talk","zh":"但答案是，这取决于你跟谁聊"}]},{"id":2129,"name":"Multiculturalism & cultural diversity","phrases":["but → also celebrate and learn from the differences in our society"],"eng":"Multiculturalism is an important aspect of our society, as it encourages us to embrace and appreciate the diverse cultures that make up our world. This concept promotes the idea that we should not only tolerate, but also celebrate and learn from the differences in our society. Rather than expecting everyone to conform to one dominant culture, multiculturalism encourages respect for individual traditions and beliefs. By recognizing and valuing cultural diversity, we can create a more inclusive and harmonious society. This is in contrast to the idea of a melting pot, where diversity is expected to disappear as everyone assimilates into one homogeneous culture. “ ” Embracing multiculturalism allows us to broaden our understanding of the world and fosters a sense of unity and acceptance amongst different groups. Ultimately, it is through respecting and celebrating our differences that we can create a more vibrant and enriching society for all.","ref":"Multiculturalism promotes acceptance of diverse cultures, fostering inclusivity and harmony by celebrating differences rather than enforcing assimilation. It contrasts with the \"melting pot\" model, preserving cultural identities to enrich societal coexistence. By embracing multiculturalism, societies can broaden understanding of the world and fosters a sense of unity and acceptance. In this way, we can create a more vibrant and enriching society for all.","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678650/8cc1069e3a2349dda333a7b33ea0d798.mp3","phrases2":[{"en":"but → also celebrate and learn from the differences in our society","zh":"但也要欣赏并学习我们社会中的差异"}]},{"id":4456,"name":"Negative bias","phrases":["so → I'm looking at these emotions","if → I'm looking at these emotions","so → let's take for instance anger and fear","for instance → anger and fear So if I'm feeling angry","so → I'm feeling angry what happens is all the blood","if → I'm feeling angry what happens is all the blood","as a result → makes it easier for me to grasp a weapon","if → I'm feeling happy if I'm feeling calm"],"eng":"Next, let's look at a positive and negative emotions and positive and negative expression of these emotions. No one can see positive and negative. “ ” “ ” I mentioned earlier that there is a range of feelings that we there's a range of expressions that we feel ranging from anger, sadness, shame, frustration or depression, disgust, love, calm or happiness or sadness. So if I'm looking at these emotions, I can broadly categorize all of them in either being positive or negative. So let's take, for instance, anger and fear. So if I'm feeling angry, what happens is all the blood, the blood flow is increased towards my hands. As a result, it makes it easier for me to grasp a weapon or to make a strike. And that is a lot of adrenaline that is released, which increases energy necessary for the action. On the other hand, if I'm feeling happy, if I'm feeling calm. The major center is the brain for a lot of activity, and this inhibits negative emotions as feeling negative or negative emotions from entering our mind. So this is what happens. It has a lot to do with hormones. It has a lot to do with. This is a reason why they see that it was in an impulse. “ ” I happened to slap the person, but I didn't mean it. When I'm angry, I don't realize that I end up hitting the person. So this has a lot to do with your hormones. Once you have once you know what you're feeling, once you are aware, you have labeled your feelings really well. This is exactly what happens when there's blood flow rushing through your own hands. And then it makes it easier for you to make a strike, to grasp something or to defend yourself. This is exactly what happens when we're talking about positive and negative expression of our feelings. This is positive and negative. Next, we look at the healthy and the unhealthy ways of expressing ourselves.","ref":"The passage explains that emotions can be categorized as positive or negative, and provides examples of the physical expressions associated with anger and happiness. It discusses how anger increases blood flow to the hands and releases adrenaline, while happiness and calmness inhibit negative emotions. It acknowledges the influence of hormones on our actions. The passage also mentions a forthcoming discussion on healthy and unhealthy expressions of emotions.","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693054/db5a01603f974e3980613bebb950f1b1.mp3","phrases2":[{"en":"so → I'm looking at these emotions","zh":"那么，如果我观察这些情绪"},{"en":"if → I'm looking at these emotions","zh":"如果我观察这些情绪"},{"en":"so → let's take for instance anger and fear","zh":"那么，以愤怒和恐惧为例"},{"en":"for instance → anger and fear So if I'm feeling angry","zh":"比如愤怒和恐惧，那么如果我感到愤怒"},{"en":"so → I'm feeling angry what happens is all the blood","zh":"那么，如果我感到愤怒，发生的是所有血液"},{"en":"if → I'm feeling angry what happens is all the blood","zh":"如果我感到愤怒，发生的是所有血液"},{"en":"as a result → makes it easier for me to grasp a weapon","zh":"结果，这让我更容易抓起武器"},{"en":"if → I'm feeling happy if I'm feeling calm","zh":"如果我感到快乐，如果我感到平静"}]},{"id":4458,"name":"Neolithic stones","phrases":["but → actually the objects that I've been drawn","but → don't really think there is any game associated","when → hold them Or maybe they were symbols of power","because → don't really know what they are","if → a theory about why they were doing","but → mathematicians we create our mathematical objects for the joy","so → will be lovely to think that these didn't actually"],"eng":"I suppose you wouldn't expect perhaps to find a mathematician in a museum of historical objects, but actually, the objects that I've been drawn to in this museum have quite a lot of mathematical significance. These Neolithic stones, discovered in Scotland, dating back 5,000 years, are probably the first examples of humans exploring the concept of symmetry. And that's what I do as a practicing mathematician. I spend my life trying to understand what symmetries are possible, in nature and in mathematics and abstractly. And here I've got a connection, going back 5,000 years, to people who are already trying to understand–how can I arrange patches on the side of these stone balls in a symmetrical manner? —— One of the intriguing things about these stones is that we don't actually know what they're for. They might have been for divination—trying to predict the future. —— They might have been part of a game. They look very much like dice, but we don't really think there is any game associated with them. Maybe they were just for chucking around, they're very nice in the hand when you hold them. Or maybe they were symbols of power in the clan. I suppose that's why I like them because we don't really know what they are. —— If I had a theory about why they were doing this it would be that actually, they were starting to be mathematicians, and that here we see the first example of abstract thought at work. That these weren't for a purpose. Mathematics is a great subject, created a lot of the technology around us, but mathematicians we create our mathematical objects for the joy and the beauty, so it will be lovely to think that these didn't actually have a use, that they were just really a celebration of what's possible. “ ”","ref":"Historical objects have quite a lot of mathematical significance. These Neolithic stones are probably the first examples of humans exploring the concept of symmetry. One of the intriguing things about these stones is that we don't actually know what they're for, and that's why the speaker likes them. Mathematics is a great subject, created the technology around us, but mathematicians create our mathematical objects for the joy and the beauty.","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693056/3403a847be504bb4a643d219020342c7.mp3","phrases2":[{"en":"but → actually the objects that I've been drawn","zh":"但事实上，我一直被吸引的那些物件"},{"en":"but → don't really think there is any game associated","zh":"但我们并不真的认为有什么与之相关的游戏"},{"en":"when → hold them Or maybe they were symbols of power","zh":"当你握住它们时，又或许它们是权力的象征"},{"en":"because → don't really know what they are","zh":"因为我们并不真正知道它们是什么"},{"en":"if → a theory about why they were doing","zh":"如果我有一个理论来解释他们为什么这样做"},{"en":"but → mathematicians we create our mathematical objects for the joy","zh":"但作为数学家，我们创造数学对象是为了快乐"},{"en":"so → will be lovely to think that these didn't actually","zh":"所以，想到这些实际上并没有……会很美好"}]},{"id":3796,"name":"Organizational study","phrases":["if → you're not planning to become a management specialist","so → I think org (organisation) studies give people a place","but → over and over alumni come back to me and say","because → the skills that really help me move up","so → the competencies or political skills for understanding myself"],"eng":"It's really recommended that everybody take some organization studies courses even if you're not planning to become a management specialist. These courses will provide leadership skills that we've got courses such as Rosens' Leadership Development. They're going to give you the interpersonal competencies and skills to advance in your career. So I think org (organisation) studies give people a place to go into a number of different careers, be it in the public sector, the private sector or a nonprofit. I think everyone needs to understand how organizations are structured, how they function and how people interact. And then to get to your strategic goal. It's really important to take organization studies courses. And I know it's a bit of a hard sell for a lot of students who are appearing in it. But over and over, alumni come back to me and say, you know what, the most important course I've ever taken was organization studies. “ ” And I really wish I took it more because those are the skills that really help me move up in my career. So those are the competencies or political skills for understanding myself for knowing how to work with difficult people, for knowing how to manage my boss, knowing how to structure the organization, knowing how to create sustainable competitive advantage. And those are the skills that really differentiate people who are going to have long term successful careers.","ref":"This lecture is mainly about organisation courses. Firstly, organisation courses are very important. Organisation courses will help us to get leadership skills in our careers. Those skills that are supplied by organisation courses will be helpful to our careers. People can learn how to satisfy the boss. People had better learn organisation courses if they want to get long terms of successful careers.","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691704/ea2895ae34c941a68ee5f446fa1ec559.mp3","phrases2":[{"en":"if → you're not planning to become a management specialist","zh":"如果你不打算成为管理专家"},{"en":"so → I think org (organisation) studies give people a place","zh":"所以我认为组织研究能给人一席之地"},{"en":"but → over and over alumni come back to me and say","zh":"但校友们一再回来对我说"},{"en":"because → the skills that really help me move up","zh":"因为正是这些技能真正帮我晋升"},{"en":"so → the competencies or political skills for understanding myself","zh":"所以这些就是理解自我所需的能力或政治技能"}]},{"id":4465,"name":"Paper rejection","phrases":["although → easy to take","but → lead to a better result and will"],"eng":"Rejection happens to all of us, and it can be a disappointing experience. I will now give some advice for young researchers. Many things have changed today, which can be a troubling issue. The chance of getting a paper published is becoming smaller and smaller. Although it never is easy to take, rejection is particularly hard at the beginning of your career. But rejections will lead to a better result and will be good for the career path. Use this feedback to improve your paper for submission to another journal as well as your next, more robust study of the topic. Usually, several individuals with expertise in the topic have donated substantial time to provide detailed advice to advance your paper and future work. Also, remember that publication does not mean funding. Investors will learn how to attract and engage young researchers at the same time.","ref":"Rejection can be a disappointing experience. The chance of getting a paper published is becoming smaller and smaller, but rejections will lead to better results and will be good for the career path. Use this feedback to improve your paper for submission to another journal. Also, publication does not mean funding. Investors will learn how to attract and engage young researchers at the same time.","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693063/ae72bdecb2c448bca190034b63971eda.mp3","phrases2":[{"en":"although → easy to take","zh":"尽管这从来都不容易接受"},{"en":"but → lead to a better result and will","zh":"但拒绝会带来更好的结果，并且会"}]},{"id":4459,"name":"Poetry","phrases":["because → poems use literary expressions","according to → fairly strict rules of meter and rhyme"],"eng":"Today, poetry means an important part of art and culture. We often talk about the knowledge about the literature in poems. Poetry is from the oldest form of literature, probably predates the origin of writing itself. The oldest written manuscripts we have are poems. Mostly epic poems tell the stories of ancient mythology. The English language in poems and poetry is difficult to understand, often giving readers a feeling of frustration, making it hard for readers to enjoy poetry. This is because poems use literary expressions. Poetry was once written according to fairly strict rules of meter and rhyme, and each culture has its own rule. Some poems incorporate rhyme schemes with two or more lines that end in like-sounding words. You should learn to simply enjoy it to know more about literature knowledge.","ref":"Poetry is an important part of art and culture. Poetry is from the oldest form of literature. The English language in poems and poetry is difficult to understand, making it hard for readers to enjoy poetry, because poems use literary expressions. However, you should learn to simply enjoy it to know more about literature knowledge.","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693057/3cdfec5af93147168d993979edc59b95.mp3","phrases2":[{"en":"because → poems use literary expressions","zh":"因为诗歌使用文学表达，诗歌曾按照"},{"en":"according to → fairly strict rules of meter and rhyme","zh":"根据相当严格的格律和押韵规则"}]},{"id":3798,"name":"Population growth","phrases":["when → thinking about the population its challenges","when → now reached 7 billion and is","but → nonetheless it's still quite a challenge","when → almost certain to add another 3 billion","but → also food and other aspects of resources","because → not be equally distributed between different parts","therefore → will correspondingly change for demographic reasons"],"eng":"I hereby do not even need to elaborate too much why I think it is that population matters in the world. These are the kind of topics which are normally cited when thinking about the population, its challenges, its problems, its opportunities, and its own problems. After all, pressure on resources is a very obvious point. When the world population has now reached 7 billion and is increasing by 7 to 8 million people per year, a diminishing number of course. 70 700 800 But nonetheless it's still quite a challenge, particularly when global population is almost certain to add another 3 billion to that 6 billion with all kinds of questions as to the adequacy of resources, water, particularly in global climate change, but also food and other aspects of resources. 60 30 These are all problems of security because this growth will not be equally distributed between different parts of the world. Some parts of the world will grow. Other parts of the world will shrink. The balance of power, therefore, will correspondingly change for demographic reasons, as we will see. Urban growth is remarkable. We already have megacities of 20 million people. These are going to grow even further in due course. 2000 One wonders just how far they can grow before certain aspects of the infrastructure start breaking down.","ref":"The speech talks about the population. The growing population is a challenge. It brings pressure on resources. Now we have 7 billion people, and they all need water, food, and other resources. These are all problems of security because the growth will not be equally distributed. This population growth will impact the balance of power. Urban growth is remarkable.","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691707/710547712b92434399f9d43e15b77389.mp3","phrases2":[{"en":"when → thinking about the population its challenges","zh":"在思考人口问题及其挑战时"},{"en":"when → now reached 7 billion and is","zh":"当世界人口现已达到70亿，并且正在……"},{"en":"but → nonetheless it's still quite a challenge","zh":"但尽管如此，这仍是个不小的挑战"},{"en":"when → almost certain to add another 3 billion","zh":"当全球人口几乎肯定会再增加30亿时"},{"en":"but → also food and other aspects of resources","zh":"但也涉及粮食和其他资源方面"},{"en":"because → not be equally distributed between different parts","zh":"因为这种增长在不同地区之间不会均衡分布"},{"en":"therefore → will correspondingly change for demographic reasons","zh":"因此会因人口原因而相应变化"}]},{"id":2136,"name":"Question Bank","phrases":["because → evaluate the direct outcome their proposals can","while → an open plan office is seen to promote interaction","finally → seems clear that the interior of a building directly","therefore → should not underestimate how work culture is affected"],"eng":"We need to consider more closely the relationship between the interior of a building and its influence on an individual, because interior designers should evaluate the direct outcome their proposals can have on an employee. Design can affect them in several ways. Firstly, setting aside spaces for plants in an office is linked to worker well-being and performance. Research has shown that the simplicity of having plants in a working environment positively affects air quality. Air that is more filtered than has knock-on effects such as increased productivity, greater concentration and a reduction in stress. This clearly shows that at minimum cost to companies, working performance can be improved. The second one is not as cost effectively, it concerns office space. While an open plan office is seen to promote interaction and boost communication and productivity, this isn't always true. I think it has now been proven that it can go the opposite way. Open plan offices lead to a lack of face-to-face communication and an over-reliance on electronic interactions as staff feel vulnerable and exposed and less inclined to share ideas. Finally, it seems clear that the interior of a building directly affects performance at work. Therefore, we should not underestimate how work culture is affected by office design.","ref":"Employees' work performance is directly affected by the interior design of their workplace. One inexpensive method for improving performance is placing plants around the office, because they can affect employee productivity and well-being, as well as reducing stress. Another is redesigning office space as open-plan offices can reduce communication by making staff feel reluctant to share ideas openly. Office design therefore has important effects on work culture.","audio":"https://ti.koolearn.com/upload/ti/sardine/2657000-2658000/2657239/a6d707af7a0e41d397907c8d3c5521ac.mp3","phrases2":[{"en":"because → evaluate the direct outcome their proposals can","zh":"因为室内设计师应评估其方案能带来的直接结果"},{"en":"while → an open plan office is seen to promote interaction","zh":"虽然开放式办公室被认为能促进互动"},{"en":"finally → seems clear that the interior of a building directly","zh":"最后，似乎很明显，建筑的室内会直接……"},{"en":"therefore → should not underestimate how work culture is affected","zh":"因此，我们不应低估工作文化所受的影响"}]},{"id":2126,"name":"Singapore","phrases":["yet → powerful island nation I also referenced insights from a University"],"eng":"In today's lecture, I explored Singapore's unique relationship with globalization. We started by examining its diverse population and the successful blend of cultures thriving within this small yet powerful island nation. I also referenced insights from a University of Chicago professor who has studied Singapore's economic strategies extensively. Later, we delved into potential future city models and how they might manifest in places like Singapore, which continues to be at the forefront of urban development and planning. The lecture concluded by citing various academic perspectives to offer a well-rounded discussion; names of notable professors were mentioned to credit their contributions to our understanding of globalization and its impact on Singapore. As we scrutinize the examples set by Singapore, it becomes clear that this nation exemplifies the complex dynamics of globalization, standing as a beacon of multiculturalism and forward-thinking urban planning.","ref":"In the lecture, we analyzed Singapore’s dynamic approach to globalization, noting its multicultural population and economic prowess. Citing a University of Chicago professor’s work, we discussed Singapore’s global strategy before exploring its pioneering role in future urban development. By highlighting academic opinions, the talk concluded that Singapore is a model of multiculturalism and innovative urban planning within the global context.","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678647/b6e3f591e0124fe2a33d11ca619fb5fa.mp3","phrases2":[{"en":"yet → powerful island nation I also referenced insights from a University","zh":"然而，这个强大的岛国，我还参考了一所大学的见解"}]},{"id":2137,"name":"Skill-based curriculum","phrases":["yet → be the case","but → one of the biggest challenges with delivering cross-disciplinary skills","if → are to change the skills that children leave school"],"eng":"There's a broad agreement that the skills that children will need in the future are different from those that their parents needed in the past. And many people now believe that cross-disciplinary skills, things like critical thinking or collaboration or problem-solving are going to be necessary to survive in the future. We can already see that information and knowledge are increasing at an incredible rate, such a rate, in fact, that no one individual can ever hope to learn everything they need to know about every subject and stay truly up to date. What they need are the skills to locate knowledge, and then use that knowledge in jobs. Bear in mind that those jobs may not even exist yet. Now, this may be the case, but one of the biggest challenges with delivering cross-disciplinary skills in the school syllabus is that many teachers were trained to teach knowledge, facts rather than skills. Most assessments work with knowledge content. If we are to change the skills that children leave school with, we need to go through a phase of transition that some of those in the education profession feel deeply uncomfortable with.","ref":"Although knowledge will be less valued in future job markets, people are still not keen on introducing a curriculum based on skills. This is because the education system is not ready to teach or assess critical thinking collaboration or the other cross-disciplinary skills that businesses value.","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658773/fb4440efe7034cc18c7d22c1b0818793.mp3","phrases2":[{"en":"yet → be the case","zh":"然而现在情况可能确实如此"},{"en":"but → one of the biggest challenges with delivering cross-disciplinary skills","zh":"但传授跨学科技能的最大挑战之一"},{"en":"if → are to change the skills that children leave school","zh":"如果我们要改变孩子离校时掌握的技能"}]},{"id":3790,"name":"Sleep","phrases":["if → not People need to sleep before learning","when → are asleep the memory can consolidate all the information","when → get sleep but the alarmingly bad things that happen","but → the alarmingly bad things that happen when you don't get","when → don't get enough both for your brain and your","because → what we've discovered over the past 10 or so years","so → that you need sleep after learning to essentially","so → don't forget “ ” But recently"],"eng":"This is a new discovery about learning and memory. It is a good thing for you to get enough sleep, and a bad thing for you if not. People need to sleep before learning, and people also need to sleep after learning. When you are asleep, the memory can consolidate all the information into your brain. From this point, it may only get worse. Not only will I tell you about the wonderfully good things that happen when you get sleep, but the alarmingly bad things that happen when you don't get enough both for your brain and your body. Let me start with the brain and the functions of learning and memory, because what we've discovered over the past 10 or so years is that you need sleep after learning to essentially hit the save button on those new memories so that you don't forget. “ ” But recently, we discovered that you also need sleep before learning and now to actually prepare your brain almost like a dry sponge, ready to initially soak up new information. And without sleep, the memory circuits of the brain essentially become waterlogged, as it were. And you can't absorb new memories.","ref":"Sleep is essential for learning and memory. Getting enough sleep before and after learning helps consolidate information in the brain. Lack of sleep impairs memory and learning processes. Sleep prepares the brain to absorb new information, acting like a dry sponge. Without sleep, memory circuits become overwhelmed, hindering the absorption of new memories.","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691683/fff7d4700ed84c6b9b5b52ba52ce04f6.mp3","phrases2":[{"en":"if → not People need to sleep before learning","zh":"否则，人们需要在学习前睡觉"},{"en":"when → are asleep the memory can consolidate all the information","zh":"当你睡着时，记忆能巩固所有信息"},{"en":"when → get sleep but the alarmingly bad things that happen","zh":"当你睡够时，却会发生令人震惊的坏事"},{"en":"but → the alarmingly bad things that happen when you don't get","zh":"但当你没睡够时发生的令人震惊的坏事"},{"en":"when → don't get enough both for your brain and your","zh":"当你没得到足够睡眠，对你的大脑和你的……都不够"},{"en":"because → what we've discovered over the past 10 or so years","zh":"因为过去大约10年里我们所发现的"},{"en":"so → that you need sleep after learning to essentially","zh":"所以这些年表明，学习后你需要睡眠，本质上是为了……"},{"en":"so → don't forget “ ” But recently","zh":"这样你就不会忘记“ ” 但最近"}]},{"id":2141,"name":"Smart skin","phrases":["so → the development of stretchable electronics or smart skin has long","but → it's now become a reality","in order to → monitor various bodily processes","so → it's very important to maintain their levels","if → low then athletes need to take care","so → make decisions before there's an adverse","but → a lot more portable and comfortable","but → already starting to explore the myriad uses"],"eng":"So the development of stretchable electronics or smart skin has long been dreamed of, but it's now become a reality. It is basically an electronic skin that can be worn in order to monitor various bodily processes. It's proving particularly popular with elite athletes during training as it allows clear real time monitoring. One thing that athletes particularly like to monitor is their electrolyte levels. Electrolytes are minerals in the body that have multiple functions in keeping our bodies running healthily. So it's very important to maintain their levels. The smart skin is able to analyze these from a person's sweat. If levels are low, then athletes need to take care and slow down. This instant analysis means that a person has the information at their fingertips, so to speak, and can make decisions before there's an adverse effect on their health. Another way the smart skin is being used is to monitor a person's heartbeat by showing a visual wave, rather like having a heart monitor strapped to your arm, but a lot more portable and comfortable. These are just two applications, but scientists are already starting to explore the myriad uses for this technology.","ref":"There is now an electronic skin called a smart skin that can be worn to monitor bodily processes. Athletes like it because it gives them real-time information about their bodies as they are training. lt can monitor various things by analysing their sweat. The skin can also show a person's heartbeat. The smart skin is very portable and scientists are exploring the numerous different uses it could have.","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658779/a0035877a5fa4c3ca287baa6b28e7077.mp3","phrases2":[{"en":"so → the development of stretchable electronics or smart skin has long","zh":"所以，可拉伸电子器件或智能皮肤的研发由来已久"},{"en":"but → it's now become a reality","zh":"但现在它已成为现实"},{"en":"in order to → monitor various bodily processes","zh":"为了监测各种身体机能，它尤其受精英群体欢迎"},{"en":"so → it's very important to maintain their levels","zh":"所以，维持他们的水平非常重要"},{"en":"if → low then athletes need to take care","zh":"如果水平偏低，运动员就需要多加注意"},{"en":"so → make decisions before there's an adverse","zh":"可以说，并能在出现不良后果之前做出决定"},{"en":"but → a lot more portable and comfortable","zh":"但便携得多，也舒适得多"},{"en":"but → already starting to explore the myriad uses","zh":"但科学家已经开始探索其无数用途"}]},{"id":2128,"name":"Sound of words","phrases":["according to → the speaker the sound of words plays a crucial role"],"eng":"The lecture emphasizes the importance of words and the impact of their sound. According to the speaker, the sound of words plays a crucial role in cognitive processes, aiding in the representation of the world and self-perception. Furthermore, the lecture highlights the broad capacity of words to express a multitude of concepts, underscoring their significance in communication and cognitive development. The speaker also uses the example of high school graduates to illustrate the importance of words in conveying complex ideas and information. Additionally, the mention of phone numbers suggests that words and their sounds are integral to memory and recall processes. Overall, the lecture underscores the profound influence of words and their sound on cognitive functions and communication, informing how individuals perceive and interact with the world.","ref":"The lecture explains the significance of words and their sound. It discusses how the sound of words is crucial for cognitive processes, representing the world and self-perception. It also emphasizes the broad capacity of words to express concepts, using high school graduates as an example. The mention of phone numbers suggests words are vital for memory. Overall, it underscores the influence of words and sound on cognitive functions and communication","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678649/f9cd6cf04e2f4bb0b551299463faa250.mp3","phrases2":[{"en":"according to → the speaker the sound of words plays a crucial role","zh":"据演讲者称，词语的声音起着关键作用"}]},{"id":2135,"name":"Sources of protein","phrases":[],"eng":"Our current way of eating is not sustainable, neither for our health nor the environment. Our food system, which relies on the production of meat, eggs and dairy products as sources of protein, generates 15% of total greenhouse gas emissions globally. 15% It also requires 70% of the agricultural land on Earth. 70% We need to change how we produce, transport and cook food. Studies show that taking a more flexible approach to the way we obtain protein can allow our diets to have a significantly less damaging effect on the environment. Specifically, it can bring the greenhouse gas emissions down by more than 50%, 50% and we can do this easily by having more plant-based foods and less meat. This should be viable as more and more alternatives to traditional sources of protein are becoming more widely available. Beans, wheat, nuts, and even insects all have a lower impact on the environment and along with the promising development of meat grown in labs, they give us the opportunity to dramatically reduce greenhouse gas emissions compared with those produced by meat production, as long as they are both readily available and affordable for the public, we should be able to flexibly switch between traditional and alternative sources of protein.","ref":"Our current food system is unsustainable, especially our ways of sourcing protein. This contributes to global greenhouse gas emissions and takes up a large proportion of land for agricultural purposes. We can, however, reduce these negative effects by getting more of our protein from plant-based foods and lab-grown meat, provided that the public can easily access and afford them.","audio":"https://ti.koolearn.com/upload/ti/sardine/2657000-2658000/2657019/8c9699300ea44b499ca43f0a0b0ec423.mp3","phrases2":[]},{"id":4442,"name":"Stock market and business","phrases":["when → need groceries you go to the supermarket","when → you're ready to buy stocks or mutual funds","however → some different uses of the stock market before","while → modern companies used stocks to output money","however → modern companies such as Apple"],"eng":"The stock market is where investors connect to buy and sell investments - most commonly, stocks, which are shares of ownership in a public company. When you need groceries, you go to the supermarket. When you're ready to buy stocks or mutual funds, you'll usually buy them online through the stock market, which anyone can access with a brokerage account or employee retirement plan. The term 'stock market' often refers to one of the major stock market indexes. “ ” However, there are some different uses of the stock market before and after. In the 18th century, manufacturing companies came into the market. Traditional companies used stocks to raise money, and input money into companies, while modern companies used stocks to output money. 18 From 19th to 20th century, however, modern companies, such as Apple, Google and Microsoft are big enough to earn money, and use stocks differently. 19 20 The stock market also inclined to put money into big companies.","ref":"The stock market is where investors buy and sell stocks, which represent shares of ownership in public companies. It can be accessed online through a brokerage account or retirement plan. In the past, companies used stocks to raise money, but now modern companies like Apple and Google earn money and use stocks differently. The stock market also tends to invest in large companies.From 19th to 20th century, however, modern companies, such as Apple, Google and Microsoft are big enough to earn money, and use stocks differently.","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693053/2aa766ab77a5453fb30c5b4831898e08.mp3","phrases2":[{"en":"when → need groceries you go to the supermarket","zh":"当需要买食品杂货时，你会去超市"},{"en":"when → you're ready to buy stocks or mutual funds","zh":"当你准备买股票或共同基金时"},{"en":"however → some different uses of the stock market before","zh":"然而，以前的股票市场还有一些不同的用途"},{"en":"while → modern companies used stocks to output money","zh":"而现代公司用股票来赚钱"},{"en":"however → modern companies such as Apple","zh":"然而，像苹果这样的现代公司"}]},{"id":2133,"name":"Street art","phrases":["but → rather as an expression of social frustration","however → over the decades street art has developed artistically","however → some designs still appear on the sides of buildings without"],"eng":"Streetheart developed from an underground art form into something which has achieved mainstream recognition and acceptance. It has its origins in the graffiti trend, which became popular in cities in the 1960s. 20 60 At that time, adding graffiti to public spaces was most definitely considered to be an act of vandalism. Indeed, it was hardly viewed as art at all, but rather as an expression of social frustration. However, over the decades, street art has developed artistically. Street artists have taken their inspiration from a wide variety of cultural influences, including hip hop music and graphic design trends. Nowadays, many urban centers have colorful, large scale wall paintings displaying uplifting or socially responsible messages. For this reason, street art is now viewed as part of the urban landscape and in some cases is a source of local pride. The street art projects I've just mentioned are, of course, officially approved schemes. However, some designs still appear on the sides of buildings without legal permission, and that's why street art is still a controversial art form. Nevertheless, it is now broadly accepted to the extent that some street artists have even achieved the same level of fame as celebrated artists in other creative fields.","ref":"Street art has developed as a form of expression ever since its graffiti origins and has many different influences. lt's now a common feature in many cities and sometimes conveys quite positive messages. However, street art still remains somewhat controversial and can actually be illegal. Nevertheless, public perceptions of it have gradually become more accepting. Indeed, now some of the most famous street artists areas respected as their counterparts working inconventional creative fields.","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658782/5d110e64bb194d0096a1fb931bd44cc4.mp3","phrases2":[{"en":"but → rather as an expression of social frustration","zh":"而是作为社会挫败感的一种表达"},{"en":"however → over the decades street art has developed artistically","zh":"然而，几十年来，街头艺术在艺术上已有所发展"},{"en":"however → some designs still appear on the sides of buildings without","zh":"然而，一些图案仍会出现在建筑物侧面，未经……"}]},{"id":3791,"name":"Telescope","phrases":["so → let's just talk a little bit about a telescope","but → make telescopes bigger","if → make telescopes bigger we get a couple of good","so → can see things that are fainter","but → turns out they greatly improve detail","because → of the nature that light is a wave","when → use a little telescope to look at waves","so → extremely useful to improve detail"],"eng":"So let's just talk a little bit about a telescope. Our eye is the telescope we all are used to. It's a little tiny five millimeter telescope, and it serves us very well. But if we make telescopes bigger, we get a couple of good things. We have larger telescopes and they collect a lot more light so we can see things that are fainter. But it turns out they greatly improve detail. And that's because of the nature that light is a wave, and wave effects are what we call quantum mechanical effects, meaning that when you use a little telescope to look at waves, it becomes blurry through what we call diffraction. “ ” And so larger telescopes are extremely useful to improve detail. The other thing that telescopes allow us to do is to put modern digital detectors behind them. Our eye is about the same sensitivity as a photographic plate. A photographic plate can be sat there and it can look at the sky for an hour so it can see fainter. But modern digital detectors are almost 100 times more efficient than our eyes at collecting light. 100 And so you can improve things by a factor of 100. 100 That's like building a telescope ten times bigger. 10 And so that improvement has been one of the things that's allowed astronomy to do so much in the optical regime in the last 30 years. 30","ref":"Our eye is a tiny five-millimeter telescope. When we have larger telescopes that collect more light, we can see things fainter but it greatly improves detail. This is because the nature of light is a wave which has quantum mechanical effects. Telescopes also allow us to put modern digital detectors behind them, which are 100 times more efficient. Such improvement allowed astronomy to do so much in the optical regime.","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691687/aa4905fb2e8c4da485dafb8801dfb653.mp3","phrases2":[{"en":"so → let's just talk a little bit about a telescope","zh":"那我们稍微聊聊望远镜吧。"},{"en":"but → make telescopes bigger","zh":"但如果把望远镜造得更大"},{"en":"if → make telescopes bigger we get a couple of good","zh":"如果把望远镜造得更大，我们就能获得几个好处"},{"en":"so → can see things that are fainter","zh":"这样我们就能看到更暗弱的物体"},{"en":"but → turns out they greatly improve detail","zh":"但事实证明，它们能大幅提升细节"},{"en":"because → of the nature that light is a wave","zh":"因为光本质上是一种波"},{"en":"when → use a little telescope to look at waves","zh":"当你用小望远镜观察波时"},{"en":"so → extremely useful to improve detail","zh":"所以更大的望远镜对提升细节极为有用"}]},{"id":4460,"name":"The internet requires energy","phrases":["but → getting this video and all the other bits of the","so → many devices Today there are more than 30 billion things","but → also every credit card reader","but → powering billions of Internet-connected devices adds up","because → changing too fast","but → in total Internet-connected devices probably use in the neighborhood","but → compared to all the other things that produce greenhouse","when → compared to all the other things that produce greenhouse gases"],"eng":"The Internet is pretty great, this wouldn't be a thing without it, but getting this video and all the other bits of the Internet to you uses a lot of energy. What we call the Internet is made up of a lot of things, wires traversing the ocean, satellites and cell phone towers, massive data centers sending packets of information all over, and devices — so many devices! —— Today, there are more than 30 billion things connected to the Internet. 300 That's every cell phone, laptop, and tablet, but also every credit card reader, creepy, all-hearing speaker, newfangled fridge with a TV on the front end, and more things coming online every day. Every single one of these devices requires electricity. Charging a single phone or a laptop doesn't use that much energy, but powering billions of Internet-connected devices adds up. It's hard to estimate exactly how much because things are changing too fast, even count. But in total, Internet-connected devices probably use in the neighborhood of five percent of the world's electricity. Once you've got your Internet portal charged and ready to go, streaming a video or posting a pic on Instagram, draws on power from data centers distributed around the world. Instagram After devices, data centers are the Internet's next biggest energy hog, using around one or two percent of the world's total electricity. 1% 2% And most of this electricity comes from burning fossil fuels, which release greenhouse gases into the atmosphere. But when compared to all the other things that produce greenhouse gases like transportation, which causes almost a quarter of global emissions, the unit is doing all right. —— —— In total, it contributes only around two percent of global emissions. 2%","ref":"This lecture mainly talks about the Internet. The Internet comprises devices, data centers, and communication lines. It consumes about five percent of global electricity, with data centers using one or two percent. Most of the electricity comes from burning fossil fuels, resulting in greenhouse gas emissions. Compared to other sectors, the Internet's contribution to global emissions is around two percent.","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693058/6f123563eaa84765bca0c39220f16fa8.mp3","phrases2":[{"en":"but → getting this video and all the other bits of the","zh":"但获取这段视频以及所有其他零碎内容"},{"en":"so → many devices Today there are more than 30 billion things","zh":"设备如此之多：如今有超过300亿个物品"},{"en":"but → also every credit card reader","zh":"但也包括每个信用卡读卡器"},{"en":"but → powering billions of Internet-connected devices adds up","zh":"但为数十亿台联网设备供电，累加起来不容小觑"},{"en":"because → changing too fast","zh":"因为情况变化太快"},{"en":"but → in total Internet-connected devices probably use in the neighborhood","zh":"但总体而言，联网设备可能大约用掉……"},{"en":"but → compared to all the other things that produce greenhouse","zh":"但与所有其他产生温室（气体）的东西相比"},{"en":"when → compared to all the other things that produce greenhouse gases","zh":"与所有其他产生温室气体的东西相比"}]},{"id":4466,"name":"The stability of mood","phrases":["while → others present a consistently composed and relaxed demeanor","while → also allowing for the natural ebb and flow of emotions","therefore → understanding and achieving this delicate equilibrium is essential for emotional"],"eng":"Emotional stability is a unique trait that differs from person to person. For some individuals, their moods fluctuate dramatically, resembling a roller coaster ride, while others present a consistently composed and relaxed demeanor. Studies have suggested that the key to achieving happiness lies in maintaining a certain level of emotional containment. It is a delicate balance between maintaining a sense of control while also allowing for the natural ebb and flow of emotions. The optimal emotional state appears to be characterized by a point of equilibrium, wherein there is a moderate level of emotional containment and resilience. Essentially, the secret to emotional well-being involves finding this balance. It means navigating between intense and loose emotions, striving for a state of gentle containment coupled with a poised resilience. This harmonious emotional state ultimately grants an individual a sense of contentment and well-being. Therefore, understanding and achieving this delicate equilibrium is essential for emotional health and happiness.","ref":"Emotional stability varies between individuals. Research indicates that the key to happinessis maintaining a delicate balance of emotional containment and resilience, allowing for a natural ebb and flow of emotions. Finding this equilibrium is essential for emotional well-being and health, ultimately granting individuals a sense of contentment, and happiness.","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693064/27ea476b5d51424ba6f5f1fe72bafdcf.mp3","phrases2":[{"en":"while → others present a consistently composed and relaxed demeanor","zh":"而另一些人始终表现得沉着放松"},{"en":"while → also allowing for the natural ebb and flow of emotions","zh":"同时也要允许情绪自然起伏"},{"en":"therefore → understanding and achieving this delicate equilibrium is essential for emotional","zh":"因此，理解并实现这种微妙的平衡对情绪至关重要"}]},{"id":2122,"name":"Transportation network in Paris","phrases":["if → you're strapped for time there are great public transport links","so → can treat it as one big underground network","but → in my opinion they're just a farce"],"eng":"As with most cities, we recommend getting about on foot. Besides being eco-friendly, it's a great way to get a feel for the city. Just bear in mind that Paris is big, like really big. A walk from the Eiffel Tower to Notre Dame would take a good hour. Fortunately, if you're strapped for time, there are great public transport links. The subway system is split into the metro and RER lines. RER Tickets will work across both, so you can treat it as one big underground network. In our experience, it served a purpose, which was to get us around quickly. It's just not the cleanest. The Metro has 16 lines, each with a different color. 16 The five RER lines are labeled with the letters A B C D E. 5 RER A B C D E RER and metro trains run every day from 6:00 a.m. until half past midnight. RER 6 As for tickets, a single journey is 1.90 euro. 1.90 We bought a book of 10 for 14.50 euro. 10 14.50 Now there are weekly or monthly passes available. But in my opinion, they're just a farce. We need a passport photo and everything else.","ref":"Paris has an extensive public transportation system with the metro and RER trains. The metro has 16 lines distinguished by different colors, while the RER has five lines labeled ABCDE. Trains operate from 6:00 a.m. to half past midnight. Tickets for a single journey are 1. 90 euros, or you can purchase a book of 10 tickets for 14. 50 euros. Weekly or monthly passes are offered but require a passport photo.","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678215/dab162e55f594de7b18dc6000cd83ebb.mp3","phrases2":[{"en":"if → you're strapped for time there are great public transport links","zh":"如果你赶时间，公共交通非常便利"},{"en":"so → can treat it as one big underground network","zh":"所以你可以把它当成一个大型地铁网络"},{"en":"but → in my opinion they're just a farce","zh":"但在我看来，它们不过是场闹剧"}]},{"id":3800,"name":"Trust levels","phrases":["but → in parallel we've developed a heightened level of trust","so → someone who we interact with who comes accompanied by online","so → I'm looking forward to seeing"],"eng":"I'm fascinated by the extent to which sharing economy platforms like Uber and Airbnb are getting Americans to trust each other again. Uber Airbnb Over the last 40 years, the level of trust in society has fallen quite dramatically. 40 Less than 1 in 5 Americans under the age of 35 today feel that people are trustworthy in general. 35 But in parallel, we've developed a heightened level of trust in strangers who we meet through a digital interface. There's a generation that has grown up reading Yelp reviews, reading Amazon reviews, making their consumption choices based on what strangers on a digital platform say. Yelp And so someone who we interact with who comes accompanied by online reviews, a Facebook and LinkedIn profile, and other digital cues seems to be someone we'll trust at the level of friends and family. Facebook LinkedIn What excites me about this transition is that through history every time society has created a new basis for trust, it has expanded the economy dramatically. So I'm looking forward to seeing, as we trust our Uber drivers more, how this expands the world's economic activities and the possibilities for trade. Uber","ref":"Sharing economy platforms are getting Americans to trust each other again. Over the last 40 years, the level of trust in society has fallen quite dramatically but we've developed a heightened level of trust in strangers on digital interface. Every time society has created a new basis for trust, it has expanded the economy dramatically, so this will expand economic activities and possibilities for trade.","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691714/41cb136a16d5432bb3f9f07c63944920.mp3","phrases2":[{"en":"but → in parallel we've developed a heightened level of trust","zh":"但与此同时，我们建立了更高程度的信任"},{"en":"so → someone who we interact with who comes accompanied by online","zh":"所以，与我们互动的人往往也伴随着线上信息"},{"en":"so → I'm looking forward to seeing","zh":"所以我很期待看到"}]},{"id":3793,"name":"Tutorial","phrases":["if → need help before the tutorial","whereas → in tutorials it's about five to 15 students","so → consist of having to present to the rest","so → better discussions in class"],"eng":"If we need help before the tutorial, we can email any of the tutors and they will provide us with help. The difference between lectures and tutorials is that in lectures you usually have about 200 to 300 students, whereas in tutorials it's about five to 15 students, 200 300 5 15 which allows you to discuss matters, put your hand up and talk to your tutors about any difficulties you may have with the subject. The skills that I have developed through participating in these tutorials include time management, critical thinking, being able to work better in a group and improving my confidence to speak up in a group. At the end of a tutorial, each group will have to give feedback on what they've been discussing throughout the tutorial. So this may consist of having to present to the rest of the students in the class and it allows me to improve my group working skills and also working in a group allows us to generate more ideas and discuss the topic in more depth. The advice I have for potential University of Edinburgh students to make the most out of your tutorial sessions is to complete the reading that you're given by your tutors beforehand. This will enable you to discuss more in groups and generate more ideas. It's also beneficial to raise your hand and develop your confidence so that you can have better discussions in class.","ref":"Before tutorials, students need to read articles and write notes. In tutorials, students discuss ideas and give feedback in small groups. It’s easier to get support from the tutors in tutorials because there are fewer students than lectures. Students can improve their skills, teamwork, and confidence in tutorials. In the end, the speaker’s advice is that do the readings before tutorials and be active in tutorials.","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691721/0dd9b2056b08481093188a6a3dba899c.mp3","phrases2":[{"en":"if → need help before the tutorial","zh":"如果我们在辅导课前需要帮助"},{"en":"whereas → in tutorials it's about five to 15 students","zh":"而在辅导课上，大约有五到十五名学生"},{"en":"so → consist of having to present to the rest","zh":"所以这可能意味着必须向其他人做展示"},{"en":"so → better discussions in class","zh":"这样你们就能在课堂上更好地讨论"}]},{"id":3801,"name":"Underestimated women","phrases":["if → test men and women and you ask them questions","if → ask men why they did a good job","if → you even asking","if → ask women why they did a good job","because → no one gets to the corner office by sitting","if → don't think they deserve their success"],"eng":"Women systematically underestimate their own abilities. If you test men and women and you ask them questions on totally objective criteria, like GPAs, men get it wrong slightly high, and women get it wrong slightly low. Women do not negotiate for themselves in the workforce. A study in the last two years of people entering the workforce out of college showed that 57 percent of boys entering or men, I guess, are negotiating for salary, and only 7 percent of women. 57% 7% And most importantly, men attribute their success to themselves and women attribute it to other external factors. If you ask men why they did a good job, they'll say, I'm awesome. If you ask, obviously. Why are you even asking? “ ” If you ask women why they did a good job? What they'll say is someone helped them they got lucky, they worked really hard. “ ” “ ” “ ” Why does this matter? Boy, it matters a lot. Because no one gets to the corner office by sitting on the side, not at the table, and no one gets the promotion if they don't think they deserve their success, or they don't even understand their own success.","ref":"Women tend to underestimate their own abilities, and they do not negotiate for themselves in the workforce. And most importantly, men attribute their success to themselves and women attribute it to other external factors. In conclusion, it is important for women to understand their own success, and they deserve their success.","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691715/7f4a0d79a23c4b87a2a0654184ba1fc2.mp3","phrases2":[{"en":"if → test men and women and you ask them questions","zh":"如果你测试男性和女性并向他们提问"},{"en":"if → ask men why they did a good job","zh":"如果你问男性为什么他们工作做得好"},{"en":"if → you even asking","zh":"如果你问，显然，你何必还要问"},{"en":"if → ask women why they did a good job","zh":"如果你问女性为什么她们工作做得好"},{"en":"because → no one gets to the corner office by sitting","zh":"因为没人能靠坐着不动进入高管办公室"},{"en":"if → don't think they deserve their success","zh":"如果她们不认为自己的成功是应得的"}]},{"id":4449,"name":"Vitamin D","phrases":["so → today we're going to finish talking about the fat-soluble vitamins","because → there's absolutely no dietary need for vitamin D","if → get adequate sunshine D And the real important word","because → turns out that in climates which aren't near the","because → not naturally abundant in vitamin D","but → not be enough","so → again just exposure to sunlight is adequate","so → Vitamin D really isn't the Vitamin"],"eng":"So today we're going to finish talking about the fat-soluble vitamins. I'm going to start with Vitamin D. D And I think probably most of you know that Vitamin D is called the “sunshine vitamin”. D “ ” And it's called that because there's absolutely no dietary need for vitamin D if you get adequate sunshine. D And the real important word there is “it” because it turns out that in climates which aren't near the equator there's a big question as to whether or not using these you get adequate sunshine. “ ” And that's important because foods are not naturally abundant in vitamin D. D And that's why milk is fortified but the fortification may not be enough. D So again just exposure to sunlight is adequate, no need for vitamin D. D So Vitamin D really isn't the Vitamin, it's a prohormone when human beings evolve, we evolved in tropical climates and ran around naked. D There was plenty of skin exposure to sunlight and so there was no dietary need for Vitamin D. D As humans migrated away from that tropical regions, they actually created a need for Vitamin D in food because sunlight was inadequate, particularly during the winter. D","ref":"The lecture introduces Vitamin D, known as the \"sunshine vitamin,\" because adequate sunlight eliminates the dietary need for it. Since foods lack natural abundance of Vitamin D, milk is fortified, which may remain insufficient in non-tropical climates. Furthermore, human evolution in tropical regions provides enough sun exposure, but migration to other areas creates a dietary need for Vitamin D due to inadequate sunlight.","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693677/d0285a69386540b5a6ef320bc5dd6f7f.mp3","phrases2":[{"en":"so → today we're going to finish talking about the fat-soluble vitamins","zh":"所以今天我们要讲完脂溶性维生素。"},{"en":"because → there's absolutely no dietary need for vitamin D","zh":"因为膳食中完全不需要维生素D。"},{"en":"if → get adequate sunshine D And the real important word","zh":"如果你有充足的日照，维生素D；而真正重要的词是"},{"en":"because → turns out that in climates which aren't near the","zh":"因为事实证明，在不靠近……的气候中"},{"en":"because → not naturally abundant in vitamin D","zh":"因为食物天然并不富含维生素D。"},{"en":"but → not be enough","zh":"但食品强化可能不够。"},{"en":"so → again just exposure to sunlight is adequate","zh":"所以再说一遍，仅靠晒太阳就足够了。"},{"en":"so → Vitamin D really isn't the Vitamin","zh":"所以维生素D其实并不是那种维生素。"}]}],"rl":[{"id":4278,"name":"A new instrument","phrases":["because → of the sound that they need to make","if → want to make a sound like a plucked string","whereas → with a Skoog because it's a mixture of software","because → it's a mixture of software and a sensor","thus → handle making the sound","so → can design an object that's designed to be touched","so → enriching and it's really inspiring to actually work","when → can provide them with an ability to start"],"eng":"The Skoog is a new universally accessible musical instrument. It is designed to use by children or adults with special needs or in fact be used by anyone. It's soft, it's easy to play, it's robust and it can be customized to suit anyone's abilities. The Skoog helps students with special needs by allowing them to get involved in making music themselves. Skoog It's an instrument that they can play it and they can take ownership of and start creating their own sounds and music. Traditional instruments are the shape and size and made of the materials they are because of the sound that they need to make. If you want to make a sound like a plucked string, you need a string and it needs to be under tension, whereas with a Skoog, because it's a mixture of software and a sensor, then thus the computer can handle making the sound. Skoog And so we can design an object that's designed to be touched and designed to be played with. In developing the screen and working with kids in the schools and in the classrooms, it's really helped us make the Skoog something that's usable by the children themselves. Skoog They've informed us massively on how it needs to work and they've given their opinions on colours and designs. And just the feedback they've given to us has been just marvellous. It's just so enriching and it's really inspiring to actually work with these kids, particularly when you can provide them with an ability to start to playing their own music as opposed to just taking part through listening and listening to other musicians and really learning from them.","ref":"The lecture talks about the Skoog, a new universally accessible musical instrument. It is soft, easy to play, and customizable for anyone, especially children with special needs. Unlike traditional instruments, the
