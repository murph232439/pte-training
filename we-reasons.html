function render(){
 if(MODE==='lib'){
   var h='<div class="scenes">'+scenes.map(s=>'<button data-s="'+esc(s)+'" class="'+(s===SC?'on':'')+'">'+esc(s)+'</button>').join('')+'</div>';
   h+=R[SC].map(p=>'<div class="rc"><div class="zh">'+esc(p[1])+'</div><div class="en">'+esc(p[0])+'</div><div class="tip">点一下看英文</div></div>').join('');
   document.getElementById('main').innerHTML=h;
   document.querySelectorAll('.scenes button').forEach(b=>b.onclick=()=>{SC=b.dataset.s;render()});
 } else {
   var p=QI||(QI=DR[Math.floor(Math.random()*DR.length)]);
