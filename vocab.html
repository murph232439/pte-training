function play(rate){
  if(!CUR)return;var t=TIMINGS[CUR.word];if(!t){speakWord(CUR.word,rate);return}var a=prepareAudio();
  function go(){if(PLAYING){a.pause();return}a.currentTime=t.start;a.playbackRate=rate||.9;a.ontimeupdate=function(){if(a.currentTime>=t.end){a.pause();a.ontimeupdate=null}};a.play().catch(function(){})}
  if(a.readyState>=1)go();else a.addEventListener('loadedmetadata',go,{once:true}),a.load()
}
function start(word){
  CUR=groupWords().find(function(x){return x.word===word});ITEMS=groupWords();IDX=ITEMS.indexOf(CUR);render();
}
function render(){
  document.getElementById('app').innerHTML='<span class="back" id="back" style="color:#2456a6;font-size:14px;font-weight:650">← 返回词汇表</span>'+
  '<div class="panel"><div class="steps"><span class="step on">1 听音打词</span><span class="step">2 词义记忆</span><span class="step">3 跟读复习</span></div>'+
  '<div class="title" id="title">听音，写出单词</div><div class="counter" id="counter">'+(IDX+1)+' / '+ITEMS.length+'</div>'+
  '<div class="row"><button class="play" id="play">▶ 播放发音</button><button class="play ghost" id="slow">慢速</button></div>'+
  '<div class="label">拼写</div><input class="answer" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="听到什么，就写什么">'+
  '<div class="row"><button class="play" id="check">检查</button><button class="play ghost" id="next">下一个 →</button></div><div class="fb" id="fb"></div></div>'+
  '<div class="panel hidden" id="meaning"><div class="word" id="word"></div><div class="pos" id="pos"></div><div class="zh" id="zh"></div><div class="example" id="example"></div><div class="row"><button class="play" id="play2">再听一遍</button><button class="play ghost" id="readDone">跟读完成</button></div></div>';
  document.getElementById('back').onclick=list;document.getElementById('play').onclick=function(){play(.9)};document.getElementById('slow').onclick=function(){play(.75)};document.getElementById('check').onclick=check;document.getElementById('next').onclick=next;
  document.getElementById('answer').addEventListener('keydown',function(e){if(e.key==='Enter')check()});
  document.getElementById('play2').onclick=function(){play(.9)};document.getElementById('readDone').onclick=next;
  document.getElementById('answer').focus();
}
function check(){
  var a=document.getElementById('answer').value,ok=norm(a)===norm(CUR.word),fb=document.getElementById('fb');
  fb.className='fb on '+(ok?'good':'bad');
  if(ok){fb.textContent='拼写正确。继续看词义和例句。';reveal()}
  else{fb.textContent='再看一遍：正确拼写是 '+CUR.word+'。';reveal()}
}
function reveal(){
  document.getElementById('title').textContent=CUR.word;
  document.getElementById('word').textContent=CUR.word;document.getElementById('pos').textContent=CUR.pos;document.getElementById('zh').textContent=CUR.zh;document.getElementById('example').textContent=CUR.example;
  document.getElementById('meaning').classList.remove('hidden');
}
function next(){IDX=(IDX+1)%ITEMS.length;CUR=ITEMS[IDX];render()}
if(window.speechSynthesis){chooseVoice();window.speechSynthesis.onvoiceschanged=chooseVoice}
list();
