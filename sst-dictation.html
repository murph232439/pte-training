:"the importance of business plans","zh":"商业计划仍然至关重要"},{"en":"most millennial start-ups have never written one","noun":"millennial start-ups without a business plan","zh":"多数千禧一代创业公司从未写过商业计划"},{"en":"many different reasons","noun":"multiple reasons","zh":"多种原因"},{"en":"the main purpose of a business plan","noun":"the main purpose of a business plan","zh":"商业计划的主要目的"},{"en":"attract an investor, or backer","noun":"attracting an investor or backer","zh":"吸引投资人"},{"en":"prove that their money is safe and secure","noun":"proof that the investment is safe and secure","zh":"证明资金安全可靠"},{"en":"assessed any potential financial risks","noun":"assessment of potential financial risks","zh":"评估潜在财务风险"}]},{"id":"Pearson后台::PTEA_15-LW-SUMM_CM1_8_C1_Final_CW","source":"Pearson后台","code":"PTEA_15-LW-SUMM_CM1_8_C1_Final_CW","title":"Agriculture and Environment 农业与环境","category":"现象类","keywords":[{"en":"agriculture is responsible for pollution and environmental issues","noun":"agriculture’s responsibility for pollution and environmental issues","zh":"农业造成污染和环境问题"},{"en":"traditionally, discussions around farming and the environment","noun":"traditional discussions about farming and the environment","zh":"传统上关于农业与环境的讨论"},{"en":"favour organic approaches","noun":"support for organic approaches","zh":"支持有机方式"},{"en":"a greater quantity of production","noun":"a greater quantity of production","zh":"更大的产量"},{"en":"a choice between these two things may not have to be made","noun":"avoiding the choice between the two approaches","zh":"不必在两种方式之间二选一"},{"en":"small organic farms have actually been found to create higher yields","noun":"the higher yields of small organic farms","zh":"小型有机农场被发现能带来更高产量"}]},{"id":"Pearson后台::PTEA_15-LW-SUMM_CM6_10_B2_final","source":"Pearson后台","code":"PTEA_15-LW-SUMM_CM6_10_B2_final","title":"Ancient and Modern Olympics 古今奥运会","category":"对比类","keywords":[{"en":"the ancient Olympics are virtually unrecognisable","noun":"the unrecognisable ancient Olympics","zh":"古 摄氏度"},{"en":"over the last decade","noun":"the last decade","zh":"过去十年"},{"en":"a considerable effect on the landscape","noun":"a considerable effect on the landscape","zh":"对地貌产生显著影响"},{"en":"Arctic plants grow taller","noun":"the taller growth of Arctic plants","zh":"北极植物长得更高"},{"en":"covered less ground","noun":"less ground coverage","zh":"覆盖地面减少"},{"en":"more heat entered the ground","noun":"more heat entering the ground","zh":"更多热量进入地面"},{"en":"an overall increase in temperatures in the region","noun":"an overall regional temperature increase","zh":"该地区整体升温"}]}];
var CUR=null,ORDER=[],IDX=0,SCORE=0,ANSWERED=false,VOICE=null,SPEAK_ID=0,AUTO_TIMER=null;
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function normalize(s){return String(s||'').replace(/[’‘]/g,"'").toLowerCase().replace(/[^a-z0-9']+/g,' ').replace(/\s+/g,' ').trim()}
function tokens(s){return normalize(s).split(' ').filter(Boolean)}
function lcs(a,b){var row=new Array(b.length+1).fill(0);for(var i=1;i<=a.length;i++){var prev=0;for(var j=1;j<=b.length;j++){var old=row[j];row[j]=a[i-1]===b[j-1]?prev+1:Math.max(row[j],row[j-1]);prev=old}}return row[b.length]}
function chooseVoice(){if(!window.speechSynthesis)return null;var voices=window.speechSynthesis.getVoices()||[];VOICE=voices.find(function(v){return /^en-GB/i.test(v.lang)})||voices.find(function(v){return /^en/i.test(v.lang)})||null;return VOICE}
function list(filter){
  filter=(filter||'').toLowerCase();
  var rows=DATA.filter(function(x){return !filter||(x.title+' '+x.source+' '+x.keywords.map(function(k){return k.en+' '+k.zh}).join(' ')).toLowerCase().indexOf(filter)>=0});
  document.getElementById('list').innerHTML=rows.map(function(x){
    return '<div class="card" data-id="'+esc(x.id)+'"><div><div class="cname">'+esc(x.title)+'</div><div class="cmeta">'+esc(x.source)+' · '+x.keywords.length+' 个关键词</div></div><div class="go">开始 →</div></div>';
  }).join('')||'<div class="empty">没有找到题目</div>';
}
function cancelAutoSpeech(){if(AUTO_TIMER){clearTimeout(AUTO_TIMER);AUTO_TIMER=null}}
function stopSpeech(){cancelAutoSpeech();SPEAK_ID++;if(window.speechSynthesis)window.speechSynthesis.cancel()}
function speak(rate){
  if(!window.speechSynthesis){alert('当前浏览器不支持语音朗读');return}
  var p=ORDER[IDX];if(!p)return;
  stopSpeech();
  var token=SPEAK_ID;
  var targetRate=Math.max(.3,Math.min(1.2,Number(rate)||.9));
  setTimeout(function(){
    if(token!==SPEAK_ID)return;
    var u=new SpeechSynthesisUtterance(p.en);
    u.lang='en-GB';u.rate=targetRate;u.pitch=1;u.volume=1;
    if(VOICE)u.voice=VOICE;
    window.speechSynthesis.speak(u);
  },targetRate<.7?220:80);
}
function openItem(id){
  stopSpeech();CUR=DATA.find(function(x){return x.id===id});if(!CUR)return;
  ORDER=CUR.keywords.slice().sort(function(){return Math.random()-.5});
  IDX=0;SCORE=0;renderQuestion();
}
function renderQuestion(){
  var p=ORDER[IDX];
  if(!p){renderSummary();return}
  ANSWERED=false;
  document.getElementById('list').innerHTML='<span class="back" id="back">← 返回题目</span>'+
  '<div class="panel"><div class="ptitle">'+esc(CUR.title)+'</div><div class="counter">第 '+(IDX+1)+' / '+ORDER.length+' 个关键词 · 已答对 '+SCORE+' 个</div>'+
  '<div class="playRow"><button class="btn" id="play">▶ 正常速度</button><button class="btn ghost" id="slow">0.75 倍速</button><button class="btn ghost" id="hint">中文提示</button></div>'+
  '<div class="hint" id="hintBox">'+esc(p.zh)+'</div>'+
  '<input class="answer" id="answer" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="听到什么，就输入什么">'+
  '<div class="actions"><button class="btn" id="check">检查</button><button class="btn ghost" id="next" disabled>下一个</button></div>'+
  '<div class="fb" id="fb"></div></div>';
  document.getElementById('back').onclick=function(){stopSpeech();list(document.getElementById('q').value)};
  document.getElementById('play').onclick=function(){speak(.9)};
  document.getElementById('slow').onclick=function(){speak(.75)};
  document.getElementById('hint').onclick=function(){document.getElementById('hintBox').classList.toggle('on')};
  document.getElementById('check').onclick=check;
  document.getElementById('next').onclick=next;
  document.getElementById('answer').addEventListener('keydown',function(e){if(e.key==='Enter'){if(ANSWERED)next();else check()}});
  AUTO_TIMER=setTimeout(function(){AUTO_TIMER=null;speak(.9);document.getElementById('answer').focus()},180);
}
function check(){
  if(ANSWERED)return;
  var user=document.getElementById('answer').value;
  if(!normalize(user)){document.getElementById('answer').focus();return}
  ANSWERED=true;
  var p=ORDER[IDX],a=tokens(user),b=tokens(p.en);
  var same=normalize(user)===normalize(p.en);
  var common=lcs(a,b),ratio=(a.length+b.length)?(2*common/(a.length+b.length)):0;
  var fb=document.getElementById('fb');
  var cls=same?'good':ratio>=.72?'warn':'bad';
  if(same||ratio>=.9)SCORE++;
  fb.className='fb on '+cls;
  fb.innerHTML='<div class="label">'+(same?'完全正确':ratio>=.72?'很接近，再核对细项':'先看正确关键词')+'</div><div class="correct">'+esc(p.en)+'</div><div class="noun">名词形式：'+esc(p.noun||p.en)+'</div><div class="zh">'+esc(p.zh)+'</div>';
  document.getElementById('next').disabled=false;
  document.getElementById('next').focus();
}
function next(){
  if(!ANSWERED)return;
  stopSpeech();IDX++;
  if(IDX>=ORDER.length)renderSummary();else renderQuestion();
}
function renderSummary(){
  var pct=Math.round(SCORE/ORDER.length*100);
  document.getElementById('list').innerHTML='<span class="back" id="back">← 返回题目</span><div class="panel summary"><div class="counter">'+esc(CUR.title)+'</div><div class="score">'+SCORE+' / '+ORDER.length+'</div><div class="counter">正确率 '+pct+'%</div><div class="actions" style="justify-content:center"><button class="btn" id="again">再练一遍</button><button class="btn ghost" id="back2">返回题目</button></div></div>';
  document.getElementById('again').onclick=function(){openItem(CUR.id)};
  document.getElementById('back2').onclick=function(){stopSpeech();list(document.getElementById('q').value)};
}
document.getElementById('q').oninput=function(){list(this.value)};
document.getElementById('list').onclick=function(e){var c=e.target.closest?e.target.closest('.card'):null;if(c)openItem(c.dataset.id)};
if(window.speechSynthesis){chooseVoice();window.speechSynthesis.onvoiceschanged=chooseVoice}
list('');
</script>
