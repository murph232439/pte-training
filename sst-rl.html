the same thing. 因此，这两者并不相同。 And sometimes you see them interchange. 有时你会看到它们被混为一谈。 And that's not correct. 这并不正确。 So innovation equals invention times commercialization. 因此，创新等于发明乘以商业化。 So and when we look at this equation of innovation something of value, it requires a new idea and then it requires someone or some organization that is going to commercialize that idea and to make it a value to the world. 所以，当我们看到这个创新的公式——创造价值的东西时，它需要一个新的想法，然后需要某个人或某个组织将这个想法商业化并使其对世界产生价值。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678146/d41dbd6cbbff49289eae21b09d395a4e.mp3","phrases":[{"en":"innovation equals invention","zh":"创新等于发明"},{"en":"people mistake these two things","zh":"人们混淆这两者"},{"en":"that generates value for the world","zh":"创新为世界创造价值"},{"en":"makes something faster, better, cheaper","zh":"让事物更快、更好、更便宜"},{"en":"an invention is an idea or a patent","zh":"发明是一个想法或专利"},{"en":"does not generate value. So","zh":"发明本身不产生价值"},{"en":"innovation equals invention times commercialization","zh":"创新等于发明乘商业化"},{"en":"going to commercialize that idea","zh":"有人把想法商业化"}],"logicPhrases":[{"en":"so → not the same thing","zh":"所以这两者不是一回事"},{"en":"so → innovation equals invention times commercialization","zh":"所以创新等于发明乘以商业化"},{"en":"so → and when we look at this equation of innovation something","zh":"所以，当我们看这个创新等式时，某个东西"},{"en":"when → look at this equation of innovation something of value","zh":"当我们看这个创新等式时，某种有价值的东西"}]},{"id":4273,"name":"King","ref":"In the Middle Ages, a king ruled over a kingdom. To govern, he granted land or fiefs to others in exchange for loyalty and service. Land was the key currency. For example, a duchy was controlled by a duke. The duke provided loyalty, pledged fealty, supplied troops, and paid taxes, either in coinage or as a percentage of agricultural production. 在中世纪，国王统治着一个王国。为了治理国家，他会把土地或封地赐予他人，以换取忠诚和服务。土地是关键货币。例如，一个公国由公爵控制。公爵提供忠诚、宣誓效忠、提供军队并缴纳税款，税款可能是铸币形式，也可能是公国农业产出的百分比。","ana":"At the top, you would have a king. 权力的顶端是国王。 Now the king would rule over a kingdom. 国王会统治一个王国。 Now, this is not so easy to govern especially during the Middle Ages. 一个王国可不是那么容易治理，尤其是在中世纪时期。 And the king might owe many people, things especially people who help the king come to power, helped him dispose the previous king or to conquer this land. 国王可能欠很多人很多东西，尤其是那些帮助他登上王位、帮助他处置前任国王或帮助他征服这片土地的人。 And so in exchange for that and to help govern, he might grant land or fiefs to other people. 作为交换，同时也有助于治理，国王可能会赏赐其他人土地或者盛宴。 And the key currency in the Middle Ages under the feudal system is land. 在中世纪的封建制度下，土地是主要的货币。 And land in exchange for loyalty and service. 土地可以用来交换忠诚和服务。 So this whole thing is a kingdom. 所以这一切组成了一个王国。 Now right over here, this is a duchy. 现在看这里，这是一个公国。 And a duchy will be controlled by a duke. 公国将由一位公爵控制。 I guess I didn't call it duckie because that just doesn't sound as serious. 我猜我没有叫它“duckie”，因为那听起来不够严肃。 So the king might grant a duchy, a duchy to a duke and in exchange, the duke would provide loyalty pledged their fealty. 因此，国王可能会将公国授予公爵，作为交换，公爵需宣誓效忠并提供军事支持。 If the kingdom is threatened, the duke will fight alongside. 如果王国受到威胁，公爵会与国王并肩作战。 The duke would provide their own troops if the king wants to go conquer other territories, same thing, and also provide the king with taxes which might be in the form of coinage depending on what time and region we are in the Middle Ages or it might be in the form of a percentage of the agricultural production from this duchy. 如果国王想要征服其他领土，公爵将提供自己的军队，同样地，还会向国王提供税收，税收可能以货币形式缴纳，具体取决于其所处的时代和地区，或者可能是来自该公国的农业生产的百分比。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693304/9c3cc58aab304ef9b069bc3a5e8541e7.mp3","phrases":[{"en":"you would have a king","zh":"你会有一位国王"},{"en":"rule over a kingdom","zh":"统治一个王国"},{"en":"not so easy to govern","zh":"并不容易统治"},{"en":"during the Middle Ages","zh":"在中世纪"},{"en":"grant land or fiefs","zh":"授予土地或封地"},{"en":"key currency in the Middle Ages","zh":"中世纪的关键货币"},{"en":"controlled by a duke","zh":"由公爵控制的公爵领"},{"en":"provide the king with taxes","zh":"向国王提供税收"}],"logicPhrases":[{"en":"so → easy to govern especially during the Middle Ages","zh":"所以很容易统治，尤其在中世纪"},{"en":"especially → during the Middle Ages And the king might owe many","zh":"尤其在中世纪，国王可能欠下许多人情"},{"en":"especially → who help the king come to power","zh":"尤其是那些帮助国王掌权的人"},{"en":"so → in exchange for that and to help govern","zh":"所以作为交换，也为了帮助治理"},{"en":"so → a kingdom","zh":"所以这整个就是一个王国"},{"en":"because → just doesn't sound as serious","zh":"因为那听起来就是没那么严肃"},{"en":"so → grant a duchy","zh":"所以国王可能会授予一个公国"},{"en":"if → threatened the duke will fight alongside","zh":"如果王国受到威胁，公爵会并肩作战"}]},{"id":4274,"name":"Knee","ref":"The sound of a cracking knee isn't particularly pleasant. An electrical engineer was building tiny microphones at a high-end audio company to listen up to the knee cracking sound. He and his team built a prototype with stretchy athletic tape and a few tiny mics and skin sensors. The primary application they are targeting at first is to give people a decision aid during rehabilitation. 膝盖咔嚓作响的声音听起来并不悦耳。一位电气工程师在一家高端音响公司研发微型麦克风，专门捕捉这种膝盖发出的声响。他和团队用弹性运动胶带、几枚微型麦克风和皮肤传感器制作出原型设备。该设备的首要应用目标是为康复治疗中的患者提供决策辅助。","ana":"The sound of a cracking knee isn't particularly pleasant. 膝盖发出的咔嚓声并不特别令人愉快。 But it gets worse when you listen up close. 但当你靠近听时，情况就更糟了。 \"It does for most people. But for me, it actually just makes me excited.\" “大多数人听到会觉得不舒服，但对我来说，实际上它让我感到兴奋。” Omer Inan, an electrical engineer at Georgia Tech. 这位是乔治亚理工学院的电气工程师Omer Inan。 \"I actually feel like there's some real information in them that can be exploited for the purposes of helping people with rehab.\" “我实际上觉得其中有一些可以利用的真正信息，可以帮助人们进行康复。” Inan's experience with cracking knees goes back to his days as an undergrad at Stanford, where he threw discus. Inan对膝盖咔嚓声的体验可以追溯到他在斯坦福大学当本科生时，那时他在参加铁饼投掷比赛。 \"If I had a really hard workout, then the next day, of course, I'd be sore, but I'd also sometimes feel that I would feel this basically catching or popping or creaking every now and then in my knee.\" “如果我做了非常剧烈的锻炼，第二天当然会很酸痛，但有时我还会感觉到膝盖时不时会有卡住、爆裂或嘎吱声。” A few years later, he found himself building tiny microphones at a high-end audio company. 几年后，他发现自己在一家高端音响公司制作微型麦克风。 So when he got to Georgia Tech and heard the Defense Advanced Research Projects Agency, DARPA, wanted better tech for knee injuries, he thought: Why not strap tiny microphones to people's knees, to eavesdrop as their legs bend? 所以，当他来到乔治亚理工学院并听说国防高级研究计划局（DARPA）希望为膝盖伤害开发更好的技术时，他想：为什么不把微型麦克风绑在人的膝盖上，听听他们的腿弯曲时发出的声音呢？ \"What we think it is, is the cartilage and bone rubbing against each other, the surfaces inside the knee rubbing against each other, during those movements.\" “我们认为这其实是软骨和骨头在摩擦，膝盖内部的表面在这些动作中相互摩擦。” He and a team of physiologists and engineers built a prototype with stretchy athletic tape and a few tiny mics and skin sensors. 他和一组生理学家以及工程师们用弹性运动胶带、几个微型麦克风和皮肤传感器制作了一个原型。 And preliminary tests on athletes suggest the squishy sounds the device picks up are more erratic, and more irregular, in an injured knee than in a healthy one. 初步对运动员的测试表明，设备接收的软响声在受伤膝盖上比健康膝盖上更加不规则、更加变化无常。 Which Inan says might allow patients and doctors to track healing after surgery. Inan表示，这可能使病人和医生能够在手术后追踪康复进程。 Details appear in the IEEE Transactions on Biomedical Engineering. 相关细节已发表在《IEEE生物医学工程学报》上。 \"The primary application we're targeting at first is to give people a decision aid during rehabilitation, following an acute knee injury, to help them understand when they can perform particular activities, and when they can move to different intensities of particular activities.\" “我们首先针对的主要应用是，在急性膝伤后的康复过程中，为人们提供决策支持，帮助他们了解何时可以进行特定活动，何时可以调整活动的强度。” A useful thing to take a crack at. 这是一个值得尝试的有用事物。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693306/eac184f172c542d4a517bc61ea5ab68a.mp3","phrases":[{"en":"The sound of a cracking knee","zh":"膝盖嘎吱作响的声音"},{"en":"Omer Inan, an electrical engineer","zh":"Omer Inan，一名电气工程师"},{"en":"tiny microphones at a high-end audio company","zh":"高端音频公司的微型麦克风"},{"en":"DARPA wanted better tech for knee injuries","zh":"DARPA想要更好的膝盖损伤技术"},{"en":"strap tiny microphones to people's knees","zh":"把微型麦克风绑在人们膝盖上"},{"en":"cartilage and bone rubbing against each other","zh":"软骨和骨骼相互摩擦"},{"en":"preliminary tests on athletes suggest","zh":"对运动员的初步测试表明"},{"en":"decision aid during rehabilitation","zh":"康复期间的决策辅助"}],"logicPhrases":[{"en":"but → gets worse when you listen up close","zh":"但凑近一听，情况会更糟"},{"en":"when → listen up close \"It does for most people","zh":"当你凑近听时，“对大多数人来说确实如此”"},{"en":"but → for me it actually just makes me excited","zh":"但对我来说，这反而只会让我兴奋"},{"en":"if → a really hard workout","zh":"如果我进行了一场非常艰苦的训练"},{"en":"but → I'd also sometimes feel that I would feel this basically","zh":"但有时我也会觉得，我基本上就是这种感觉"},{"en":"so → got to Georgia Tech and heard the Defense","zh":"所以当他到了佐治亚理工学院，听说国防时"},{"en":"when → got to Georgia Tech and heard the Defense Advanced","zh":"当他到了佐治亚理工学院，听说国防高级时"},{"en":"when → can perform particular activities","zh":"当他们能够进行特定活动时"}]},{"id":1569,"name":"Leadership","ref":"The lecture mainly talks about leaders. Firstly, a leader can define goals and mobilize people's energies. Secondly, we can think of leadership as a spectrum, in terms of both visibility and the power the leader wields. Thirdly, authoritative leadership has generally been exhibited by men. Finally, women have provided casual, low-key leadership behind the scenes, but this pattern has been changing. 这一讲座主要讲述了领导者。首先，领导者可以定义目标并调动人们的精力。其次，我们可以将领导力视为一个谱系，既包括领导者的可见性，也包括领导者所拥有的权力。第三，权威型领导角色长期由男性担任。最后，女性一直在幕后提供非正式、低调的领导力，但这种传统格局正在发生转变。","ana":"A leader can define or clarify goals by issuing a memo or an executive order, an edict or a fatwa or a tweet, by passing a law, barking a command, or presenting an interesting idea in a meeting of colleagues. 领导者可以通过发布备忘录、行政命令、法令、宗教法令或推文，通过立法、下达命令，或在同事会议中提出有趣的想法来设定或澄清目标。 Leaders can mobilize people's energies in ways that range from subtle, quiet persuasion to the coercive threat or the use of deadly force. 领导者可以通过多种方式调动人们的积极性，从微妙、安静的劝说，到胁迫性威胁或致命武力的使用。 Sometimes a charismatic leader such as Martin Luther King Jr. can define goals and mobilize energies through rhetoric and the power of example. 有时，像马丁·路德·金这样具有魅力的领导者可以通过雄辩的语言和榜样的力量来设定目标并激发人心。 We can think of leadership as a spectrum, in terms of both visibility and the power the leader wields. 我们可以把领导力看作一个光谱，既包含可见性，也包括领导者掌握的权力。 On one end of the spectrum, we have the most visible: authoritative leaders like the president of the United States or the prime minister of the United Kingdom, or a dictator such as Hitler or Qaddafi. 在光谱的一端，是最具可见性的权威型领导者，比如美国总统、英国首相，或者像希特勒、卡扎菲这样的独裁者。 At the opposite end of the spectrum is casual, low-key leadership found in countless situations every day around the world, leadership that can make a significant difference to the individuals whose lives are touched by it. 在光谱的另一端，则是日常生活中无数场合中体现出的随意、低调的领导力，这种领导力对被其影响的个体而言同样意义重大。 Over the centuries, the first kind, the out-in-front, authoritative leadership, has generally been exhibited by men. 几个世纪以来，那种显眼、居前的权威型领导通常是由男性担任的。 Some men in positions of great authority, including Nelson Mandela, have chosen a strategy of \"leading from behind\"; more often, however, top leaders have been quite visible in their exercise of power. 一些拥有巨大权力的男性，比如纳尔逊·曼德拉，选择了“从后方领导”的策略；然而，大多数高级领导者在行使权力时通常非常显眼。 Women (as well as some men) have provided casual, low-key leadership behind the scenes. 女性（以及一些男性）则更多地在幕后提供随和而低调的领导。 But this pattern has been changing, as more women have taken up opportunities for visible, authoritative leadership. 但这一模式正在发生变化，越来越多的女性开始担任可见且具权威的领导职务。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678142/53e49702dca24eee846ba436449246b6.mp3","phrases":[{"en":"define or clarify goals","zh":"定义或明确目标"},{"en":"issuing a memo or an executive order","zh":"发布备忘录或行政命令"},{"en":"mobilize people's energies","zh":"调动人们的能量"},{"en":"subtle, quiet persuasion","zh":"微妙安静的劝说"},{"en":"a charismatic leader such as Martin Luther King Jr","zh":"像马丁·路德·金这样的魅力领袖"},{"en":"leadership as a spectrum","zh":"领导力是一个谱系"},{"en":"casual, low-key leadership","zh":"随意低调的领导"},{"en":"women have taken up visible leadership","zh":"女性开始担任显性领导"}],"logicPhrases":[{"en":"however → been quite visible in their exercise","zh":"不过，高层领导人在锻炼方面一直颇为显眼"},{"en":"but → been changing","zh":"但这种模式一直在改变"}]},{"id":3369,"name":"Library","ref":"This lecture is an introduction of a library. It talks about functional areas and services in the library. Every level of the library has computers, and students can use it to process the problems and send and receive emails. It also talks about the location of the printers in the library. Students can use their student cards and when they need help, they can ask the staff at the front desk. 这个讲座是关于图书馆的介绍。它讨论了图书馆的功能区域和服务。图书馆的每一层都有电脑，学生可以用它来处理问题和收发电子邮件。它还谈到了图书馆中打印机的位置。学生可以使用他们的学生卡，当他们需要帮助时，他们可以问前台的工作人员","ana":"You'll see the service desk after entering the library and you can have these services at the service desk. 进入图书馆后你会看到服务台，你可以在服务台得到这些服务。 There are computers on each floor. You can use computers to access the internet, check emails and library catalogues. 每层楼都有电脑。你可以用电脑上网，查看电子邮件和图书馆目录。 Follow the orange signs to find printers. Follow the instructions to use the printers. 按照橙色标志找到打印机。按照说明使用打印机。 Remember to bring student cards. You can charge the card to use printers. 记得带学生证。您可以刷卡使用打印机。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690260/b794ce656c3a456dacb91eb84627d942.mp3","phrases":[{"en":"service desk after entering the library","zh":"进入图书馆后的服务台"},{"en":"services at the service desk","zh":"服务台提供的服务"},{"en":"computers on each floor","zh":"每层楼的电脑"},{"en":"access the internet, check emails","zh":"上网、查看电子邮件"},{"en":"library catalogues","zh":"图书馆目录"},{"en":"orange signs to find printers","zh":"橙色标志指引找打印机"},{"en":"instructions to use the printers","zh":"使用打印机的说明"},{"en":"bring student cards. You can charge the card","zh":"携带学生证，给卡充值"}],"logicPhrases":[]},{"id":1575,"name":"Licking and grooming","ref":"Differences in stress reactivity of adult rats are determined by maternal licking and grooming (LG) during infancy. L means licking and G means grooming.The experiment tested on high and low level of licking and grooming that mother rats give to their children, to test out its effect on the children’s stress reactivity. High LG will bring modest stress reactivity, which can reduce the risk for poor development and diseases. Low LG will increase the stress reactivity, which can increase the risk for heart disease, type II diabetes, alcoholism, affective disorders and brain aging, etc. 这项实验探讨了母鼠在婴儿期舔舐和梳理（LG）对成年大鼠应激反应的影响。L代表舔舐，G代表梳理。实验测试了母鼠对幼鼠舔舐和梳理的高低水平，来检验这些行为对幼鼠应激反应的影响。高水平的舔舐和梳理（高LG）会导致温和的应激反应，这有助于降低发育不良和疾病的风险。低水平的舔舐和梳理（低LG）则会增加应激反应，从而增加罹患心脏病、Ⅱ型糖尿病、酗酒、情感障碍和大脑衰老等的风险。","ana":"The study explores the impact of maternal licking and grooming (LG) on the stress reactivity of adult rats. 本研究探讨了母鼠的舔舐与梳理（LG）行为对成年大鼠应激反应能力的影响。 LG refers to the level of attention and care provided by mother rats to their offspring through licking and grooming behaviors. LG 指的是母鼠通过舔舐和梳理行为对其幼崽提供的关注和照料程度。 The experiment examined the effects of high and low levels of LG on the stress reactivity of the rats as they grow into adulthood. 实验研究了高水平和低水平的 LG 行为对大鼠成长为成年后应激反应的影响。 The findings reveal that high LG leads to a more moderate stress reactivity in the rats. 研究结果表明，高水平的 LG 会使大鼠表现出更为温和的应激反应。 This has significant implications as it suggests that a nurturing and attentive environment during infancy can potentially reduce the risk of poor development and diseases later in life. 这具有重要意义，因为它表明在幼年时期提供有爱且细致照顾的环境，可能有助于降低日后发育不良和患病的风险。 On the other hand, low LG results in an increased stress reactivity in the rats. 另一方面，低水平的 LG 会导致大鼠表现出更高的应激反应。 This, in turn, elevates the risk for various health conditions such as heart disease, type II diabetes, alcoholism, affective disorders, and brain aging. 这进一步增加了患上多种健康问题的风险，例如心脏病、Ⅱ型糖尿病、酗酒、情绪障碍以及大脑老化。 These findings highlight the crucial role of maternal care and attention in shaping the stress response system in offspring. 这些发现强调了母爱与照料在塑造后代应激反应系统方面所起的关键作用。 It demonstrates that early experiences and maternal care can have long-lasting effects on an individual's stress reactivity and overall health. 这表明，早期经历和母体照顾会对个体的应激反应能力及整体健康产生长期影响。 This study underscores the importance of providing nurturing and supportive environments for infants to promote optimal development and reduce the risk of various health issues in adulthood. 本研究强调，为婴幼儿提供有爱且支持性的环境，对于促进其良好发育并降低成年后罹患各种健康问题的风险至关重要。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658437/9d4e88b3ff544def9c2191c9eb1ed2b0.mp3","phrases":[{"en":"maternal licking and grooming (LG) on the","zh":"母鼠的舔舐和理毛"},{"en":"the stress reactivity of adult rats","zh":"成年鼠的压力反应"},{"en":"the level of attention and care","zh":"关注和照顾的程度"},{"en":"high LG leads to a more moderate stress reactivity","zh":"高 LG 导致适度的压力反应"},{"en":"a nurturing environment during infancy","zh":"婴儿期的养育环境"},{"en":"reduce the risk of poor development","zh":"降低发育不良的风险"},{"en":"low LG increases stress reactivity","zh":"低 LG 增加压力反应"},{"en":"heart disease, diabetes and alcoholism","zh":"心脏病、糖尿病和酗酒"}],"logicPhrases":[]},{"id":3362,"name":"Linguists","ref":"The lecture emphasizes that communities, not linguists, should hold authority over their languages. While linguists have expertise in narrow language areas, they lack the right to control how communities use or develop their knowledge. The speaker explains that languages disappear due to cultural dominance. Even if the language is technically revived, it remains \"lost\" if communities don’t regain control. A Sydney student’s example highlights this: expertise unequal to authority. True revival requires returning decision-making power to the community. 该讲座强调，应该对自己的语言拥有权威的是社区，而不是语言学家。虽然语言学家在狭窄的语言领域拥有专业知识，但他们缺乏控制社区如何使用或发展他们的知识的权利。演讲者解释说，语言的消失是由于文化的支配。即使这种语言在技术上得到了复兴，如果社区不重新获得控制权，它仍然是“失落的”。一位悉尼学生的例子凸显了这一点：专业知识不等于权威。真正的复兴需要将决策权归还给社区。","ana":"But when we move into working with communities, we have to recognize that the communities have to be the authority in their language. 但在我们开始与社区合作时，我们必须认识到，这些社区必须是其语言的权威所在。 Actually a woman in the class I'm teaching at Sydney at the moment, a career woman, expressed this very nicely, although she was talking about something else, she was distinguishing expertise from authority. 目前我在悉尼授课的一个班级里有一位女性学员，她是一位职业女性，她很好地阐述了这一点，尽管她当时所谈的是另一些内容，但她区分了专业知识与权威。 And certainly linguists because of our training we do have expertise in certain very narrow areas of language, but we don't have the authority over what to do with that knowledge or what to do with other knowledge that the community produces. 当然，语言学家由于我们的专业训练，确实在某些特定的语言领域具备专业知识，但我们并不拥有对所掌握知识的运用权，也不拥有对社区所创造的其他知识的运用权。 I guess for me the bottom line is languages are lost because of the dominance of one people over another. 我想对我来说，关键在于语言之所以会消失，是因为一种人群对另一种人群的主导地位所致。 That's not rocket science, it's not hard to work that out. 这并非高深莫测之事，也不是很难理解的。 But then what that means is if in working with language revival we continue to hold the authority, we actually haven't done anything towards undoing how languages are lost in the first place, so in a sense the languages are still lost if the authority is still lost. 但这意味着，如果在语言复兴的工作中我们仍然占据权威地位，那么实际上我们并没有采取任何行动来改变语言最初消失的局面，所以从某种意义上说，如果权威地位依然丧失，那么语言仍然是消失的。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690253/461d5971326240d586101cebb39cf969.mp3","phrases":[{"en":"working with communities","zh":"与社区合作"},{"en":"communities have to be the authority","zh":"社区必须是权威"},{"en":"distinguishing expertise from authority","zh":"区分专业能力与权威"},{"en":"expertise in certain very narrow areas","zh":"在某些非常狭窄领域的专业知识"},{"en":"languages are lost","zh":"语言会消失"},{"en":"dominance of one people over another","zh":"一个民族对另一个民族的支配"},{"en":"continue to hold the authority","zh":"继续掌握权威"},{"en":"languages are still lost","zh":"语言仍然会消失"}],"logicPhrases":[{"en":"but → move into working with communities","zh":"但当我们开始与社区合作时"},{"en":"when → move into working with communities","zh":"当我们开始与社区合作时"},{"en":"although → was talking about something else","zh":"尽管她谈的是另一件事"},{"en":"because → of our training we do have expertise in certain very","zh":"由于我们的训练，我们确实在某些非常……方面有专长"},{"en":"but → the authority over what","zh":"但我们无权决定该做什么"},{"en":"because → of the dominance of one people over another","zh":"由于一个民族对另一个民族的支配"},{"en":"but → then what that means is if in working with language","zh":"但这样一来，这意味着如果在语言工作中"},{"en":"that means → is if in working with language revival we continue","zh":"这意味着如果在语言复兴工作中我们继续"}]},{"id":1582,"name":"London fog","ref":"Turner painted one of the earliest pictures of London’s fog in the 1835. Turner is familiar with London’s air problem by putting smoke at its center. The bridge is the central elements, and it is a theme that’s later taken up by Monet. We see a shot-tower and a steamship. They were very smoky and barely visible. The speaker thinks they represent for a flourishing economy, but also the dirt and pollution. Turner在1835年画了伦敦雾霾的最早画作之一。通过将烟雾作为画面的中心，透纳展现了伦敦的空气问题。桥梁是画作的核心元素，这一主题后来被莫奈所延续。画面中我们可以看到烟塔和蒸汽船，它们都被浓烟笼罩，几乎无法看清。讲者认为这些元素代表了一个繁荣的经济，但同时也象征着脏乱和污染。","ana":"Turner, not surprisingly, painted one of the earliest pictures of London’s fog, in the 1835 painting of The Thames above Waterloo Bridge. 正如预期的那样，透纳在1835年画的《滑铁卢桥上方的泰晤士河》中画了伦敦雾霾的最早画作之一。 Turner is a trueborn Londoner, is advertising his familiarity with London’s air problem by putting smoke, an atmospheric pollution at its center. 透纳是土生土长的伦敦人，他通过将烟雾——一种大气污染——置于画作的中心，展示了他对伦敦空气问题的熟悉。 And as you can see, in here, the bridge is the central element, which is a theme that’s later taken up by Monet. 正如你所看到的，这座桥是画作的核心元素，这一主题后来被莫奈所继承。 And it’s partly obscured by the steam and smoke, which rises from both sides of the river. 它被蒸汽和烟雾部分遮挡，这些烟雾从河的两岸升起。 Here, we see a shot-tower. I think you can just about to see, which was constructed in 1826. 这里，我们看到一个铅丸塔。我想你们差不多能看到，它建于1826年。 Do you know what shot-towers are? They produce shot for guns, ammunition. 你知道铅丸塔是什么吗？它们是生产枪弹、弹药的地方。 And they were very smoky, one of the most smoking industries. 而且它们非常烟雾弥漫，是最具烟雾的行业之一。 But it’s barely visible, as you can see, as are the various industries on the Lambeth side of the river. 但正如你所看到的，它几乎不可见，河流一侧的兰贝斯区的各种工业也是如此。 There’s, on this side, there’s a steamship about to dock or preparing to leave. 在这边，有一艘即将停靠或准备离开的蒸汽船。 Its black smoke thrusting up to join the kind of swirling arc of smoke there. 它的黑色烟雾冲天而起，与那里的旋转烟雾弧线交汇。 William Rodner sees this painting as a potent essay on the energy and complexity of modern polluted urbanism. 威廉·罗德纳将这幅画视为对现代污染城市生活的能量和复杂性的有力论述。 Smoke, I think, here represents a flourishing economy, which brings employment and food on tables, but also the dirt and pollution associated with the fumes all seems to be tainted by sulfurous yellow. 我认为，这里的烟雾代表着一个繁荣的经济，它带来了就业和餐桌上的食物，但也带来了与烟雾相关的污垢和污染，所有这些似乎都被硫磺黄色污染。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678155/9100f34b3814419f92226fc349fa7c91.mp3","phrases":[{"en":"painted one of the earliest pictures","zh":"特纳画了最早一批伦敦雾画作之一"},{"en":"1835 painting of The Thames above Waterloo Bridge","zh":"1835年画作《滑铁卢桥上的泰晤士河》"},{"en":"bridge is the central element","zh":"桥是画面中心元素"},{"en":"later taken up by Monet","zh":"后来被莫奈继承"},{"en":"shot-tower constructed in 1826","zh":"1826年建造的制弹塔"},{"en":"produce shot for guns ammunition","zh":"为枪支弹药生产弹丸"},{"en":"energy and complexity of modern polluted urbanism","zh":"现代污染城市化的活力与复杂"},{"en":"represents a flourishing economy","zh":"烟雾代表繁荣的经济"}],"logicPhrases":[{"en":"but → it’s barely visible as you can see","zh":"但如你所见，它几乎看不见"},{"en":"but → also the dirt and pollution associated with the fumes all","zh":"还有与废气相关的所有灰尘和污染"}]},{"id":1581,"name":"London taxi drivers","ref":"The Great Exhibition of 1851 gives us the world’s premier taxi service. The London Authority sets up Public Carriage Office and it still exists. London Knowledge is the ability to remember 25,000 streets and have them all interconnected within London. Cabbies also need to know things like cafes or bars that as they are parts of their training. 1851年的大博览会为我们带来了世界上最著名的出租车服务。伦敦当局设立了公共运输办公室，它至今仍然存在。伦敦知识是指能够记住伦敦25000条街道，并将它们互相连接起来的能力。出租车司机还需要了解像咖啡馆或酒吧这样的地点，这些也都是他们培训的一部分。","ana":"But we can really thank the Great Exhibition of 1851 for giving us the world’s premier taxi service, 但我们真应该感谢1851年的大博览会，它为我们提供了世界一流的出租车服务， for it was going to this exhibition, and this fabulous exhibition inventions from all around the four corners of the Empire that the visitors were appalled, dismayed and vexed by their journeys to this exhibition 这个博览会展示了来自帝国各地的新奇发明，而参观者们在前往博览会的旅程中感到震惊、沮丧和烦恼。 because the cabbies of the day and their horse-drawn carts were absolutely terrible and could not find their way to this exhibition. 当时的出租车司机和他们的马车服务非常糟糕，根本找不到去博览会的路。 And, so, a great public outcry, the London Authority sets up Public Carriage Office, 于是，发生了强烈的公众抗议，伦敦当局设立了公共运输办公室， which is an organization that still exists. 这是一个至今仍然存在的组织。 And you can take a short walk to Penton Street up the road. 你可以沿着这条路走一小段，去到Penton街。 And this Public Carriage office took on the responsibility of licensing all major taxi drivers in London. 这个公共运输办公室承担了对所有伦敦主要出租车司机进行许可的责任。 All taxi drivers from 1851 onwards had to pass what is now known as the London knowledge, 从1851年起，所有出租车司机必须通过现在被称为“伦敦知识”的考试， which is phenomenal knowledge of London. 这是一种对伦敦的非凡了解。 What is the London knowledge? 什么是伦敦知识？ It’s the ability to remember the 25,000 streets, have it all interconnected and all the main arterial roads in and out of London. 它是指记住伦敦的25,000条街道，并且能够将它们相互连接起来，以及伦敦进出所有主要的干道。 Cabbies need to know all this plus a thousand points of specific interest cafes, bars, public offices. 出租车司机需要知道这些，还包括一千个特定的兴趣点，比如咖啡馆、酒吧和公共办公室。 They need to know them all as part of their training. 作为他们培训的一部分，司机必须掌握这些信息。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678154/fd98b116e0ae4412907f935f5bf14581.mp3","phrases":[{"en":"Great Exhibition of 1851","zh":"1851年万国工业博览会"},{"en":"horse-drawn carts were absolutely terrible","zh":"马车非常糟糕"},{"en":"a great public outcry","zh":"巨大的公众抗议"},{"en":"Public Carriage Office","zh":"公共马车管理局"},{"en":"licensing all major taxi drivers","zh":"给所有主要出租车司机发牌照"},{"en":"London knowledge","zh":"伦敦道路知识"},{"en":"remember the 25,000 streets","zh":"记住25,000条街道"},{"en":"a thousand points of specific interest","zh":"一千个特定兴趣点"}],"logicPhrases":[{"en":"but → can really thank the Great Exhibition of 1851","zh":"但我们真得感谢1851年的万国工业博览会"},{"en":"because → the cabbies of the day and their horse-drawn carts were","zh":"因为当时的出租马车车夫和他们的马车……"},{"en":"so → a great public outcry the London Authority sets up Public","zh":"于是舆论大哗，伦敦当局设立了公共……"}]},{"id":1571,"name":"Measuring food","ref":"This lecture talks about accurately estimating portion size. Firstly, the speaker works in clinical weight-loss as a dietitian and thinks accurately estimating portion size is critical because there’s no good way to measure food when dinning out. Secondly, the speaker mentions a more objective way to quantify food: using the width of fingers to measure the dimensions of food. Thirdly, the speaker mentions smartphone applications that will do all the calculations to make a more accurate estimation. In conclusion, fingers and apps can help estimate the portion size in the future. 这一讲座讨论了如何准确估算食物份量。首先，讲者作为一名临床减肥的营养师，认为准确估算食物份量至关重要，因为外出就餐时没有一个好的方法来衡量食物的量。其次，讲者提到了一种更客观的量化食物的方法：利用手指宽度作为测量单位来测量食物的尺寸。第三，讲者还提到了智能手机应用程序，这些应用程序在未来能够配合手指做出所有计算，从而提供更准确的估算。总之，在未来，人们可以利用手指和应用程序估算食物份量。","ana":"I'm a dietitian and I work in clinical weight-loss recently. 我是一名营养师，最近从事临床减重工作。 Accurately estimating portion size is critical in research or real-world settings. 准确估算食物的份量在研究或实际环境中至关重要。 For example, if you're trying to watch your weight and you're out to dinner and you're presented with a bowl of food, there's no really good way to actually estimate how much you're eating unless you're gonna whip some scales out of your bag. 例如，如果你正在控制体重，外出就餐时如果面前有一碗食物，除非你从包里拿出秤，否则真的没有一个好方法来准确估算自己吃了多少。 So we wanted to find a more objective way for people to quantify what they're eating when they're out and about. 所以我们希望找到一种更客观的方法，让人们在外面时能够量化自己吃的食物。 I came up with a more hands-on approach. 我想出了一个更实际的方法。 We got people to measure the dimensions of the food using the width of their fingers and remembering back to primary school maths. 我们让人们使用手指的宽度来测量食物的尺寸，并回忆起小学数学知识。 We use the geometric volume formulas to estimate the weight of the food. 我们使用几何体积公式来估算食物的重量。 To show you how this works, I've ordered a piece of lasagna. 为了展示这个方法是如何运作的，我点了一份千层面。 And that's my box, a glass of wine and that's my cylinder. 这份千层面就是我的盒形，而这杯酒——是我的圆柱体。 And I'm feeling pretty healthy, so I order some watermelon for dessert. 我感觉很健康，所以我点了一些西瓜作为甜点。 And that's my wedge. 那就是我的楔形。 So this was I know it's seven by five, by four fingers. 所以我知道这是七指宽、五指长、四指高。 In the future, I see this method be incorporated into smartphone applications. 在未来，我预见这种方法将被纳入智能手机应用程序中。 So you put your finger, it's in along with your height and your weight. 所以你把手指放进去，同时输入你的身高和体重。 And the app will do all of the calculations for you. 然后应用程序会为你做所有的计算。 And then you've got a more accurate way to estimate the portion size. 这样你就能更准确地估算份量了。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678144/1163c8dfa5fb4e829bee66d3a99b7666.mp3","phrases":[{"en":"a dietitian and I work in clinical weight-loss","zh":"从事临床减重的营养师"},{"en":"accurately estimating portion size","zh":"准确估计份量"},{"en":"a more objective way to quantify","zh":"更客观的量化方式"},{"en":"a more hands-on approach","zh":"更实用的方法"},{"en":"measure dimensions using the width of fingers","zh":"用手指宽度测量尺寸"},{"en":"geometric volume formulas","zh":"几何体积公式"},{"en":"lasagna as a box, wine as a cylinder","zh":"千层面像盒子、酒像圆柱"},{"en":"incorporated into smartphone applications","zh":"融入手机应用"}],"logicPhrases":[{"en":"for example → you're trying to watch your weight and you're out","zh":"例如，如果你想控制体重，又正好在外面"},{"en":"if → you're trying to watch your weight and you're out","zh":"如果你想控制体重，又正好在外面"},{"en":"so → wanted to find a more objective way for people","zh":"所以我们想为人们找到一种更客观的方法"},{"en":"when → they're out and about I came up with a more","zh":"当他们外出走动时，我想出了一个更……"},{"en":"so → I order some watermelon for dessert","zh":"所以我点了些西瓜当甜点"},{"en":"so → I know it's seven by five","zh":"所以这个是——我知道——是 7×5"},{"en":"so → put your finger it's in along with your height","zh":"所以你把手指放进去，再加上你的身高"}]},{"id":4276,"name":"Melatonin","ref":"The lecture talks about melatonin. This hormone is synthesized in the Pineal Gland. It is very small, the size of a pea in your brain. This is where melatonin is made. It has a rhythm and it is the opposite of cortisol. It peaks at night, so we call it the darkness hormone. In every species studied, melatonin occurs at night. It prepares you for what your species does at night. Humans sleep, but animals like rodents are awake. It is a hormone related to darkness behavior. 这场讲座讲的是褪黑素。这种激素在松果体中合成。它非常小，在你大脑中只有豌豆大小。这里是制造褪黑素的地方。它有节律性，并且与皮质醇相反。它在夜间达到峰值，所以我们称它为黑暗激素。在每一个被研究的物种中，褪黑素都在夜间出现。它为你在夜间要做的事情做准备。人类在夜间睡觉，但像啮齿动物这样的动物在夜间是清醒的。它是一种与黑暗行为相关的激素。","ana":"I'm just going to take on the stuff where left off. 我将从我们上次停下的地方继续讲。 The hormone I want to now talk about it's called melatonin. 我现在要讲的一种激素叫做褪黑素。 The synthesis is in the Pineal Gland, which is very small. 它是在松果体中合成的，松果体非常小。 It is the size of a pea in your brain. 它在你大脑中的大小就像一颗豌豆。 The corpus is the site of the soul, and it is where melatonin is made. 这部分（松果体）被称为“灵魂之所”，也正是褪黑素的生成地。 And it has a rhythm as well. 它同样具有节律性。 And in this sense, it is the opposite of the cortisol. 在这个意义上，它与皮质醇正好相反。 It peaks at night. 它在夜间达到高峰。 We call it the darkness hormone. 我们称它为“黑暗激素”。 In every species that we studied, melatonin occurs at night. 在我们研究过的每一个物种中，褪黑素都在夜间分泌。 And it's a hormone that prepares you for the things, that your species, does at night. 这是一种让你为夜间活动做好准备的激素，具体取决于你的物种在夜间的行为。 So, of course, in humans we sleep, but animals, like rodents, they are awake. 所以对人类来说，它帮助我们入睡；但对老鼠等动物来说，它则是在它们清醒时起作用。 It's a hormone that is related to darkness behavior. 这是一种与黑暗相关行为有关的激素。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693308/0b2271b1ee83493dbbab0bc7e215cc36.mp3","phrases":[{"en":"called melatonin","zh":"称为褪黑素"},{"en":"synthesis is in the Pineal Gland","zh":"合成发生在松果体"},{"en":"where melatonin is made","zh":"褪黑素生成的地方"},{"en":"opposite of the cortisol","zh":"与皮质醇相反"},{"en":"peaks at night","zh":"夜间达到峰值"},{"en":"darkness hormone","zh":"黑暗激素"},{"en":"melatonin occurs at night","zh":"褪黑素在夜间产生"},{"en":"related to darkness behavior","zh":"与黑暗行为有关"}],"logicPhrases":[{"en":"so → of course in humans we sleep","zh":"当然，人类会睡觉"},{"en":"but → animals like rodents they are awake","zh":"但像啮齿动物这样的动物却醒着"}]},{"id":1597,"name":"Moon launch base","ref":"The Moon could be a good base to launch spacecraft that would explore the Solar System further. Although some of the same issues would apply as when launching a spacecraft from Earth, it would be easier from the Moon because of less gravity. It would be cheaper because less fuel would be needed, and all the materials required to build the necessary infrastructure are already on the Moon naturally. 月球可能是发射进一步探索太阳系的航天器的良好基地。尽管可能会遇到一些与从地球发射航天器时相同的问题，但由于重力较小，从月球发射航天器会更容易。这会更便宜，因为需要的燃料更少，而且建造必要基础设施所需的所有材料已经在月球上天然存在了。","ana":"Since before the first Moon landings of 1969, there has been interest in space travel to the Moon. 自1969年第一次登月之前，人们就有了对月球太空旅行的兴趣。 Lunar programs are expensive and difficult, but there are several reasons why the Moon might be a good place to launch further space exploration. 月球计划既昂贵又困难，但有几个原因可以解释为什么月球可能是进一步太空探索的理想起点。 Firstly, a Moon launch base would eliminate the most difficult aspect of space travel, namely getting a rocket through the Earth's gravity. 首先，月球上的发射基地将消除太空旅行中最困难的部分，也就是让火箭克服地球引力的问题。 The journey time between, say, going to Mars from Earth rather than from the Moon is not significant. 例如，从地球去火星与从月球出发的时间差异并不显著。 However, the cost difference would be immense, as it would take 20 times less fuel to launch a spacecraft from the Moon than from the Earth due to there being less gravity on the Moon. 然而，成本差异将是巨大的，因为从月球发射航天器所需的燃料比从地球发射所需的燃料少20倍，这归因于月球上的重力较小。 There would not need to be a drain on the Earth's resources, as the Moon is rich in all the necessary minerals such as aluminum and silicon, 由于月球富含如铝和硅等所有必要的矿物质，不需要消耗地球上的资源。 which would mean that the entire infrastructure needed to enable spacecraft launch from the Moon could be done robotically using the materials already present. 这就意味着，整个支持从月球发射航天器所需的基础设施可以使用已经存在的材料、用机器人完成。","audio":"https://ti.koolearn.com/upload/ti/sardine/2656000-2657000/2656714/3566326442774c0fad172af1a307e52b.mp3","phrases":[{"en":"first Moon landings of 1969","zh":"1969年首次登月"},{"en":"Lunar programs are expensive and difficult","zh":"月球项目昂贵且困难"},{"en":"Moon might be a good place","zh":"月球可能是个好地方"},{"en":"Moon launch base would eliminate","zh":"月球发射基地将消除"},{"en":"getting a rocket through the Earth's gravity","zh":"让火箭穿过地球引力"},{"en":"cost difference would be immense","zh":"成本差异将非常巨大"},{"en":"20 times less fuel","zh":"少20倍的燃料"},{"en":"rich in all the necessary minerals","zh":"富含所有必需矿物"}],"logicPhrases":[{"en":"since → before the first Moon landings of 1969","zh":"早在1969年首次登月之前"},{"en":"but → several reasons why the","zh":"但月球之所以可能是一个……，有几个原因"},{"en":"however → be immense","zh":"然而，成本差异将极其巨大"}]},{"id":3347,"name":"Music and well-being","ref":"The lecture mainly focuses on well-being, which includes health, happiness, a sense of achievement and contentment, a state of mind and body where people can thrive. In addition, everybody has a level of well-being. The speaker also emphasizes that music so often forms an intuitive part of our well-being management, and the research takes the next step in the understanding of the power of music in human life. In conclusion, the music already works for us on so many levels, but there is no reason to stop here. 这次讲座主要关注幸福感，包括健康、幸福、成就感和满足感，以及人们能够茁壮成长的身心状态。此外，每个人都有自己的幸福感水平。讲者还强调，音乐天然融入人类对幸福感的追求，研究也在理解音乐在人类生活中力量的基础上迈出了下一步。总之，音乐已经在许多层面上为我们发挥作用，但没有理由止步于此。","ana":"So what do we mean by well-being? Health, happiness, a sense of achievement and contentment, a state of mind and body where people can thrive. 那么，我们所说的幸福感是什么意思？健康、快乐、成就感和满足感，是一种身心健康的状态，在这种状态下，人们可以茁壮成长。 Well-being is not something that is purely limited to people who are facing extraordinary challenges in their lifestyle, health or personal circumstances, everybody here has a level of well-being. 幸福感并非仅仅限于那些面临生活方式、健康或个人状况中非凡挑战的人，每个人在这里都有一定的幸福感。 Music so often forms an intuitive part of our well-being management, music to pick us up, music to calm us down, music to heal our sorrows. 音乐常常是我们幸福感管理中的直觉组成部分，音乐能激励人心、平复情绪、疗愈伤痛。 Our aim through research is to move from this level of intuitive application of music through to informed use in our communities to take the next step in the understanding of the power of music in human life. 通过研究，我们的目标是从音乐直觉应用的层面，向社区中更有意识的使用转变，以便在理解音乐在人类生活中的力量方面迈出下一步。 Music already works for us on so many levels whether it’s soothing and teaching our infants, bringing people and communities together, adding spirit to our work and personal endeavours, but there is no reason to stop here. 音乐已经在许多层面上为我们发挥作用，无论是安抚和教育我们的婴儿，促进人们和社区的团结，为我们的工作和个人努力注入活力，但没有理由止步于此。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690232/16d473f22cd9449ebacf84efb9aaaef3.mp3","phrases":[{"en":"what do we mean by well-being","zh":"我们所说的幸福是什么"},{"en":"Health, happiness, a sense of achievement","zh":"健康、快乐、成就感"},{"en":"everybody here has a level of well-being","zh":"在座每个人都有一定程度的幸福感"},{"en":"Music so often forms an intuitive part","zh":"音乐常常形成直觉的一部分"},{"en":"move from this level of intuitive application","zh":"从这种直觉应用层面出发"},{"en":"informed use in our communities","zh":"在社区中进行有依据的使用"},{"en":"power of music in human life","zh":"音乐在人类生活中的力量"},{"en":"no reason to stop here","zh":"没有理由止步于此"}],"logicPhrases":[{"en":"so → we mean by well-being","zh":"那么，我们所说的福祉是什么意思？"},{"en":"so → often forms an intuitive part of our well-being management","zh":"因此，这常常直观地构成我们福祉管理的一部分"},{"en":"so → many levels whether it’s soothing and teaching our infants","zh":"涉及许多层面，无论是安抚还是教导我们的婴儿"},{"en":"but → no reason to stop here","zh":"但没有理由就此止步"}]},{"id":3377,"name":"Narratives","ref":"This lecture is about visual description. Firstly, the speaker mentions about the comics with many people chatting in a room and it is a form of description. Secondly, the speaker mentions that people use different kinds of methods to describe a situation. Thirdly the speaker mentions that people have to use visual description when they don’t see the scene. He used own experience as an example describing the second war, his home town and the shelter his mother went to. In conclusion, in such way the speaker gets visual evidence to write his book. 本讲座的主题是视觉描述。首先，主讲人提到了许多人在一个房间里聊天的漫画，这是一种描述形式。其次，演讲者提到人们使用不同的方法来描述情境。第三，他提到人们在没有看到场景时必须使用视觉描述。他以自己的经历为例，描述了第二次世界大战、他的家乡和他母亲去的避难所。总之，作者通过这种方式获得了写作本书的视觉证据。","ana":"The comics I show you with lots of people chatting around in a room is a form of description. 我展示的这幅漫画——呈现满屋子人交谈的场景——正是一种描述形式。 We use different kinds of methods to describe a situation. 我们运用多种方式来描述情境。 Sometimes we have to use visual description, particularly when we do not witness the scenario. 有时必须借助视觉描述，尤其是未曾亲历的场景。 I was born during the Second World War and my hometown is X... 我生于二战时期，家乡在X城... For example when I asked my mother about the war, I always ask her \"you have mentioned this or that when you talked to me\"... 比如询问母亲战争经历时，我总会追问\"您之前提过的某件事...\" When you asked her about the shelter, I asked her \"what the shelter looks like\" and \"when did you go to the shelter\". 问及防空洞时，我会追问\"洞内是什么样子\"、\"您何时去避难\"等细节。 From her response I could get more visual evidence as I can to write my book. 这些回答为我的写作提供了最直观的素材。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690268/415198dd01fb44d3a3b0f962c71c4b21.mp3","phrases":[{"en":"The comics I show you","zh":"我展示的漫画"},{"en":"a form of description","zh":"一种描述形式"},{"en":"different kinds of methods","zh":"不同种类的方法"},{"en":"visual description","zh":"视觉描述"},{"en":"do not witness the scenario","zh":"没有亲眼目睹场景"},{"en":"asked my mother about the war","zh":"问母亲关于战争的事"},{"en":"what the shelter looks like","zh":"防空洞长什么样"},{"en":"write my book","zh":"写我的书"}],"logicPhrases":[{"en":"when → do not witness the scenario","zh":"当我们没有目睹这一场景时"},{"en":"for example → I asked my mother about the war","zh":"例如，当我问母亲关于战争的事时"},{"en":"when → I asked my mother about the war","zh":"当我问母亲关于战争的事时"},{"en":"when → talked to me\" \"","zh":"当你和我说话时"},{"en":"when → asked her about the shelter","zh":"当你问她关于避难所的事时"},{"en":"when → did you go to the shelter\"","zh":"你什么时候去的避难所？"}]},{"id":1601,"name":"Paper marbling","ref":"Paper marbling is a form of art which is thought to have originated in China and Japan. It later spread to Turkey, where unique Turkish styles of paper marbling became popular. Turkish marbling designs became very popular across Europe in the 17th century and especially in England where they were used extensively in the publishing industry. Marbled paper was used in books to cover up any slight damage to a book. Nowadays, this traditional art is far less common, but there are attempts to revive it by encouraging people to take special classes and by promoting it via social media. 石纹纸染是一种被认为起源于中国和日本的艺术形式。它后来传播到土耳其，在那里独特的土耳其风格的石纹纸染变得流行起来。土耳其石纹设计在17世纪在整个欧洲变得非常流行，特别是在英国，它们被广泛用于出版业。石纹纸染被用来掩盖书本上的任何轻微损坏。如今，这种传统艺术已经不那么常见了，但有人试图通过鼓励人们参加特殊课程并通过社交媒体推广来复兴它。","ana":"Today I am going to talk about the art of paper marbling, which, as the name suggests, is about adding beautiful, colorful designs onto paper. 今天我要讲的是纸张大理石纹艺术，顾名思义，这是一种在纸上添加美丽多彩设计的艺术。 It involves putting a piece of paper onto a tray of special water and paint in order to create unique and detailed designs. 它涉及到将一张纸放到装有特殊水和颜料的托盘上，以创造出独特而细致的设计。 As for the history of this art, the origins are not entirely known, although it is believed to have begun in China or Japan. 关于这项艺术的历史，其确切起源尚不完全清楚，但普遍认为它起源于中国或日本。 Paper marbling subsequently became very popular in Turkey. 纸张大理石纹艺术后来在土耳其变得非常流行。 Indeed, Turkish paper marbling developed its own particular styles, characterized by brighter colors. 土耳其的大理石纹艺术发展出了自己独特的风格，以其更加鲜艳的颜色为特点。 This type of marbling gained a lot of popularity in Europe in the 17th century and was used extensively in the publishing industry for book covers, especially in England. 这种类型的大理石纹艺术在17世纪的欧洲，尤其是在英格兰的出版业中用于书籍封面装饰时，获得了极大的欢迎。 It was an attractive and effective way of hiding any minor damage to a book. 它是一种吸引人且有效的方式，可以掩盖书籍上的任何小损伤。 Nowadays, the art of paper marbling is in decline for various reasons. 如今，由于各种原因，纸张大理石纹艺术正在逐渐衰退。 However, there are attempts to encourage a new generation to discover paper marbling and social media is a great way to promote it to a new audience. 然而，现在有一些尝试鼓励新一代去发现纸张大理石纹艺术，社交媒体是一个向新观众推广它的绝佳方式。 Paper marbling classes are also starting to appear, so perhaps there is hope for this art. 此外，也开始出现一些纸张大理石纹课程，所以也许这项艺术还有希望继续传承下去。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658428/fb74543142da4d19ab6bdd72d8fb7260.mp3","phrases":[{"en":"art of paper marbling","zh":"纸张大理石纹艺术"},{"en":"adding beautiful, colorful designs onto paper","zh":"在纸上添加美丽多彩的图案"},{"en":"origins are not entirely known","zh":"起源并不完全为人所知"},{"en":"begun in China or Japan","zh":"起源于中国或日本"},{"en":"became very popular in Turkey","zh":"在土耳其变得非常流行"},{"en":"popularity in Europe in the 17th century","zh":"在17世纪欧洲的流行"},{"en":"paper marbling is in decline","zh":"纸张大理石纹艺术正在衰落"},{"en":"hope for this art","zh":"这门艺术仍有希望"}],"logicPhrases":[{"en":"in order to → create unique and detailed designs","zh":"为了创作独特而细致的设计"},{"en":"although → begun in China or Japan","zh":"尽管人们认为它起源于中国或日本"},{"en":"especially → in England 17","zh":"尤其是在英国17，这是一种有吸引力且有效的方式"},{"en":"however → attempts to encourage a new generation to discover","zh":"然而，有人尝试鼓励新一代去发现"},{"en":"so → hope for this art","zh":"所以，也许这门艺术还有希望"}]},{"id":1576,"name":"Politics and international relations","ref":"The lecture is about the course. Students can have an understanding of the exciting disciplines of politics and international relations. The topics are covered under the label of politics and international relations. Students will undertake four compulsory units and two majors. They will also choose an elective major from a wide choice of options. Students will graduate with a range of generic skills. They will also develop ethically based and socially responsible attitudes and behaviors. 这一讲座讲述了课程内容。学生可以深入了解政治学和国际关系这一令人兴奋的学科。课程涵盖了政治学和国际关系的各个主题。学生将修读四门必修课程和两个主修课程，并从广泛的选项中选择一门选修主修课程。学生毕业时将具备一系列通用技能，并且培养以伦理为基础的社会责任感和行为。","ana":"This course provides students with an in-depth understanding of the exciting disciplines of politics and international relations. 这门课程为学生提供了深入理解政治学和国际关系这一令人兴奋的学科的机会。 Students will learn about the workings of political institutions in countries around the world and explore the complex field of relations between nations. 学生将学习世界各国政治机构的运作，并探索国家之间复杂的关系领域。 Topics in governance, public policy, public administration, national security and border control ensure that students receive a broad and current education in the range of issues which are covered under the label of politics and international relations. 治理、公共政策、公共行政、国家安全和边境控制等主题确保学生在政治和国际关系的广泛议题中获得全面且及时的教育。 Students will undertake four compulsory units and two majors, one in politics and international relations and the other in governance and policy. 学生将完成四个必修单元，并选择两个专业，一个是政治学和国际关系，另一个是治理和政策。 They will also choose an elective major from a wide choice of options including political communication, international studies, international business and national security studies. 学生还可以从包括政治传播、国际研究、国际商务和国家安全研究在内的广泛选项中选择一个选修专业。 In addition to acquiring specialist knowledge and competencies in Politics and International Relations and Commerce, students will graduate with a range of generic skills such as critical thinking, enhanced communication abilities, problem-solving and strong capacities to work with others. 除了在政治学和国际关系以及商业领域获得专业知识和能力外，学生还将毕业时掌握批判性思维、提升的沟通能力、解决问题的能力以及强大的团队合作能力等一系列通用技能。 They will also develop ethically based and socially responsible attitudes and behaviors. 学生还将培养基于伦理的社会责任感和行为方式。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678149/ea90fda305dc4116aabe237d49d1dd21.mp3","phrases":[{"en":"provides students with an in-depth understanding","zh":"为学生提供深入理解"},{"en":"workings of political institutions","zh":"政治机构的运作"},{"en":"relations between nations","zh":"国家间的关系"},{"en":"governance, public policy, public administration","zh":"治理、公共政策、公共行政"},{"en":"national security and border control","zh":"国家安全与边境管制"},{"en":"four compulsory units and two majors","zh":"四个必修单元和两个专业"},{"en":"choose an elective major","zh":"选择一门选修专业"},{"en":"critical thinking, enhanced communication abilities","zh":"批判性思维、增强的沟通能力"}],"logicPhrases":[{"en":"in addition → to acquiring specialist knowledge and competencies in Politics and International","zh":"除了获得政治与国际领域的专业知识和能力外"}]},{"id":3371,"name":"Psychologist","ref":"The lecture is about psychologist Sigmund Freud. He is the most famous psychologist that has a profound influence on the 20th and 21st century. He spent most of his life in Vienna and died in London. At the beginning of world war two, the Nazis occupied where he lived. He is known for the development of and encompassing theory of mind. 这堂课是关于心理学家西格蒙德·弗洛伊德的。他是20世纪和21世纪最著名的影响深远的心理学家。他在维也纳度过了大半生，在伦敦去世。第二次世界大战开始时，纳粹占领了他住的地方。他以发展和包罗万象的心智理论而闻名。","ana":"For better or worse, we live in a world profoundly affected by Sigmund Freud. 无论好坏，我们生活在一个深受西格蒙德・弗洛伊德影响的世界。 If I had to ask you to name a famous psychologist, the answer of most of you would be Freud. 如果我让你说出一个著名的心理学家，你们大多数人的答案会是弗洛伊德。 He's the most famous psychologist ever and he's had a profound influence on the 20th and 21st century. 他是有史以来最著名的心理学家，对 20 世纪和 21 世纪产生了深远的影响。 Some biographical information: he was born in the 1850s. 些个人资料：他生于 19 世纪 50 年代。 He spent most of his life in Vienna, Austria, but he died in London and he escaped to London soon after retreating there at the beginning of World War Two as the Nazis began to occupy where he lived. 他一生的大部分时间都在奥地利的维也纳度过，但他在伦敦去世，二战开始时纳粹开始占领他居住的地方，他撤退到伦敦后不久就逃到了伦敦。 He's one of the most famous scholars ever but he's not known for any single discovery. 他是有史以来最著名的学者之一，但他并不因为任何一项发现而出名。 Instead, he's known for the development of and encompassing theory of mind, one that he developed over the span of many decades. 相反，他以发展和全面的心智理论而闻名，这是他在几十年的时间里发展起来的。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690262/4e05feda69d1476cbe7cc23415824332.mp3","phrases":[{"en":"world profoundly affected by Sigmund Freud","zh":"深受西格蒙德·弗洛伊德影响的世界"},{"en":"most famous psychologist ever","zh":"有史以来最著名的心理学家"},{"en":"profound influence on the 20th and 21st","zh":"对20和21世纪产生深远影响"},{"en":"born in the 1850s","zh":"出生于19世纪50年代"},{"en":"spent most of his life in Vienna","zh":"一生大部分时间在维也纳度过"},{"en":"escaped to London","zh":"逃往伦敦"},{"en":"not known for any single discovery","zh":"并非以某项单一发现闻名"},{"en":"encompassing theory of mind","zh":"包罗万象的心智理论"}],"logicPhrases":[{"en":"if → to ask you to name a famous psychologist","zh":"如果非要让你说出一位著名心理学家的名字"},{"en":"but → died in London and he escaped to London soon","zh":"但他在伦敦去世了，而且他很快就逃到了伦敦"},{"en":"but → he's not known for any single discovery","zh":"但他并非因任何单一发现而闻名"},{"en":"instead → he's known for the development of and encompassing theory","zh":"相反，他因发展出一套涵盖广泛的理论而闻名"}]},{"id":3364,"name":"Rice","ref":"The lecture explains the Green Revolution, starting in 1943 when Mexico faced food shortages. To solve this, Research institutes were built in Asia. By 1962, they developed IR8, a highyield rice variety that produced five times more rice than traditional types without fertilizer, and ten times more with nitrogen. Later, IR36 resisted pests and allowed two crops yearly, doubling yields. By 1990, IR72 improved further with advanced genetic techniques. From 1960 to 2000, these modified crops dramatically increased global food production, reducing hunger worldwide. 本次讲座解析了始于1943年的\"绿色革命\"。当时墨西哥面临粮食危机，为应对此问题，科研机构在亚洲建立了实验基地。到1962年，科学家成功培育出IR8高产水稻品种——在不使用化肥的情况下产量达到传统水稻的五倍，施用氮肥后更可增产十倍。随后问世的IR36品种兼具抗虫特性并能实现一年两熟，使产量再度翻番。至1990年，通过先进遗传技术培育的IR72品种进一步提升了作物性能。在1960至2000年间，这些改良作物推动全球粮食产量大幅增长，有效缓解了世界范围的饥荒问题。","ana":"In 1943, what became known as the Green Revolution began when Mexico, unable to feed its growing population, shouted for help. 1943 年，当墨西哥无法养活不断增长的人口大声呼救时，被称为 “绿色革命” 的革命开始了。 Within a few years, the Ford and Rockefeller Foundations founded the International Rice Research Institute in Asia, and by 1962, a new strain of rice called IR8 was feeding people all over the world. 几年内，福特和洛克菲勒基金会在亚洲成立了国际水稻研究所，到 1962 年，一种名为 IR8 的新型水稻养活了世界各地的人们。 IR8 was the first really big modified crop to make a real impact on world hunger. IR8 是第一个真正对世界饥饿产生影响的大型转基因作物。 In 1962 the technology did not yet exist to directly manipulate the genes of plants, and so IR8 was created by carefully crossing existing varieties: selecting the best from each generation, further modifying them, and finally finding the best. 1962 年，直接操纵植物基因的技术还不存在，所以 IR8 是通过仔细杂交现有品种创造出来的：从每一代中选择最好的，进一步修改它们，最后找到最好的。 Here is the power of modified crops: IR8, with no fertilizer, straight out of the box, produced five times the yield of traditional rice varieties. 这是转基因作物的力量：IR8，不施肥，直接使用，产量是传统水稻品种的五倍。 In optimal conditions with nitrogen, it produced ten times the yield of traditional varieties. 在氮的最佳条件下，它的产量是传统品种的十倍。 By 1980, IR36 resisted pests and grew fast enough to allow two crops a year instead of just one, doubling the yield. 到 1980 年，IR36 抗虫害，生长速度足够快，每年可以收获两次，产量翻了一番。 And by 1990, using more advanced genetic manipulation techniques, IR72 was outperforming even IR36. The Green Revolution saw worldwide crop yields explode from 1960 through 2000. 到 1990 年，通过使用更先进的基因操作技术，IR72 的表现甚至超过了 IR36。从 1960 年到 2000 年，绿色革命见证了全球农作物产量的爆炸式增长。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690255/d384c0d225f04b2da3e123a5651a577c.mp3","phrases":[{"en":"the Green Revolution began","zh":"绿色革命开始"},{"en":"Ford and Rockefeller Foundations","zh":"福特和洛克菲勒基金会"},{"en":"International Rice Research Institute in Asia","zh":"亚洲国际水稻研究所"},{"en":"new strain of rice called IR8","zh":"名为IR8的水稻新品种"},{"en":"first really big modified crop","zh":"第一个真正重大的改良作物"},{"en":"produced five times the yield","zh":"产量达到五倍"},{"en":"By 1980, IR36 resisted pests","zh":"到1980年，IR36抗虫害"},{"en":"worldwide crop yields explode","zh":"全球作物产量激增"}],"logicPhrases":[{"en":"when → Mexico unable to feed its growing population","zh":"当墨西哥无法养活其不断增长的人口时"},{"en":"yet → exist to directly manipulate the genes of plants","zh":"但已能直接操控植物基因"},{"en":"so → IR8 was created by carefully crossing existing varieties: selecting the","zh":"因此，通过精心杂交现有品种培育出了IR8：选择"},{"en":"finally → finding the best 1962 IR8","zh":"最终找到了1962年最佳的IR8，这就是其威力所在"},{"en":"instead → of just one doubling the yield","zh":"而不是仅仅让产量翻一番"}]},{"id":1598,"name":"Roman London","ref":"Writing was very important in Roman London, despite the fact that literacy rates then would have been much lower than they are today. Over 500 wooden writing tablets have survived with a lot of different inscriptions. These are related to business and commerce, with many written to the Roman army. Writing at that time was a tool of power. 在罗马时期的伦敦，尽管当时的识字率远低于今天，书写仍然非常重要。现存有500多块木质书写板，上面刻有各种不同的铭文。这些铭文与商业和贸易有关，其中许多是写给罗马军队的。在当时，书写是一种权力的工具。","ana":"The other thing that this tablet tells us a little about, about, as I've mentioned, is the fact that writing is hugely important in Roman London. 这块木板还略微向我们揭示了另一个事实，正如我之前提到的，书写在罗马时期的伦敦极为重要。 And it's something which really marks it out within the context of Roman Britain. 这一点使伦敦在罗马不列颠的背景下显得尤为突出。 Here we have in excess of 500 examples of wooden writing tablet surviving, many, many other inscriptions. 在这里，我们发现了超过500件保存完好的木质书写板，还有许多其他铭文。 An awful lot of them are tool with this whole kind of idea of commerce, of business transaction, an awful lot of it. 其中大量内容都与商业、交易活动有关，非常非常多。 Written texts are tool of the Roman army, and that's precisely because writing in a society that where literacy rates would have been significantly lower than they were today was really a tool of power. 书面文字也是罗马军队的工具，这正是因为在一个识字率远低于今天的社会中，书写实际上是一种权力的工具。 And things like these rather fancy metal inkwells, which have been found in a number of sites in London, I think really reflect that. 像这些发现于伦敦多个遗址的精美金属墨水瓶，我认为正反映了这一点。 And in fact, they're within Britain. They're quite heavily concentrated here. 事实上，在整个不列颠境内，这类物品的分布在这里（伦敦地区）相当集中。","audio":"https://ti.koolearn.com/upload/ti/sardine/2657000-2658000/2657205/1ff8b6bea72b47529fff9cef6f5cb66a.mp3","phrases":[{"en":"writing is hugely important in Roman London","zh":"书写在罗马伦敦极其重要"},{"en":"in excess of 500 examples","zh":"超过500个例子"},{"en":"wooden writing tablet surviving","zh":"幸存的木制书写板"},{"en":"idea of commerce, of business transaction","zh":"商业与交易的理念"},{"en":"tool of the Roman army","zh":"罗马军队的工具"},{"en":"literacy rates would have been significantly lower","zh":"识字率会显著更低"},{"en":"really a tool of power","zh":"确实是权力的工具"},{"en":"heavily concentrated here","zh":"在这里高度集中"}],"logicPhrases":[{"en":"because → writing in a society that where literacy rates would","zh":"因为在一个识字率会……的社会中写作"}]},{"id":1590,"name":"Salience","ref":"Consumers are faced with a wide range of options, so the brain needs to find efficient ways to filter out much of this information by prioritizing certain things, items, or characteristics which attract our attention said to be salient or have higher levels of salience and as a result, are more likely to be purchased because they stand out. Products tend to have more salient when they appeal to one of our physical senses or do not conform to our expectations. Finally, the salience of a product may change over time as our individual needs or interests change. 消费者面临着广泛的选择，因此大脑需要找到有效的方法，通过优先考虑某些吸引我们注意力的被认为是突出的或具有更高显著性的事物、物品或特征来过滤掉大部分信息，因此，更有可能被购买，因为它们很突出。当产品吸引我们的身体感官或不符合我们的期望时，它们往往更具显著性。最后，产品的突出性可能会随着我们个人需求或兴趣的变化而改变。","ana":"How do consumers process the vast amount of information and multitude of possibilities presented to them? 消费者如何处理呈现给他们的大量信息和大量可能性？ Well, from the perspective of behavioral economics, a concept called salience plays a key role in this. 从行为经济学的角度来看，一个叫做显著性的概念在其中起着关键作用。 So salience is when consumers attention is attracted to certain characteristics. 显著性是指消费者的注意力被某些特征所吸引。 That's because to work efficiently, our brains try to take shortcuts by prioritizing some characteristics. 这是因为为了有效地工作，我们的大脑试图通过优先考虑某些特征来走捷径。 In other words, items with high levels of salience stand out, meaning we'll be more likely to choose them. 换句话说，具有高度显著性的物品会脱颖而出，这意味着我们更有可能选择它们。 The salience of a product can be increased in a number of ways. 可以通过多种方式增加产品的显著性。 Firstly, items can become more salient by appealing to one of our physical senses, for example, the inviting smell of freshly baked bread in a grocery store. 首先，通过吸引我们身体的感官，例如在杂货店里新鲜出炉的面包的诱人气味，物品可以变得更加突出。 Alternatively, products can also have higher salience when they're presented in a way that is somehow cognitively unusual. 或者，当产品以某种认知上不寻常的方式呈现时，它们也可以具有更高的显著性。 Advertisements which include shocking humor, usually attract consumers attention, and of course, sometimes a particular characteristic becomes more salient simply because our individual needs have evolved. 包含令人震惊的幽默的广告通常会吸引消费者的注意力。当然，有时一个特定的特征变得更加突出，因为我们的个人需求已经进化了。 A person who has recently become a parent may well start considering whether the items that they used to purchase without any hesitation are in fact child friendly. 最近成为父母的人可能会开始考虑他们过去毫不犹豫购买的物品是否真的对儿童友好。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658431/eaf54f2a95d244f2b6bfd81ff25ec730.mp3","phrases":[{"en":"from the perspective of behavioral economics","zh":"从行为经济学的角度"},{"en":"a concept called salience","zh":"一个叫显著性的概念"},{"en":"consumers attention is attracted","zh":"消费者注意力被吸引"},{"en":"brains try to take shortcuts","zh":"大脑试图走捷径"},{"en":"items with high levels of salience","zh":"具有高显著性的物品"},{"en":"appealing to one of our physical senses","zh":"吸引我们的某一种身体感官"},{"en":"cognitively unusual","zh":"认知上不寻常"},{"en":"individual needs have evolved","zh":"个人需求已经发生变化"}],"logicPhrases":[{"en":"so → when consumers attention is attracted to certain characteristics","zh":"所以，显著性是指消费者的注意力被某些特征吸引。"},{"en":"when → attracted to certain characteristics","zh":"当消费者的注意力被某些特征吸引时"},{"en":"because → to work efficiently our brains try to take shortcuts","zh":"因为为了高效运作，我们的大脑会尝试走捷径。"},{"en":"for example → the inviting smell of freshly baked bread in a grocery","zh":"例如，杂货店里刚出炉面包的诱人香气。"},{"en":"when → they're presented in a way that is somehow cognitively unusual","zh":"当它们以某种认知上不寻常的方式呈现时"},{"en":"because → evolved","zh":"因为我们的个体需求已经演变。"}]},{"id":1599,"name":"Salt mining","ref":"Salt has always been important throughout history. There are three main ways to extract salt. Solar evaporation is a traditional method. In this method, sun and wind dry out seawater, which has been collected in pools. The salt that remains can then be collected and processed. Solution mining uses liquid to extract and transport salt from underground rocks. Similarly, deep shaft mining collects salt from rocks, but by drilling and removing pieces of rock, which can then be processed. 盐在历史上一直很重要。提取盐主要有三种方法。太阳蒸发是一种传统的方法。在这种方法中，阳光和风使收集在池中的海水变干。剩下的盐可以被收集和处理。溶液采矿使用液体从地下岩石中提取和运输盐。类似地，深井采矿从岩石中收集盐，但是通过钻孔和移除岩石块，然后可以对其进行加工。","ana":"The salt trade has existed for thousands of years and arguably has played an even greater role in shaping the world's economic and social history than products like silk, cotton, or spices. 盐的贸易已经存在了数千年，可以说它在塑造世界经济和社会历史方面发挥了比丝绸、棉花或香料等产品更为重要的作用。 Salt mining is still hugely important today, and there are three basic ways that salt can be extracted from oceans or underground sources. 如今，采盐业依然非常重要，而从海洋或地下资源中提取盐主要有三种基本方法。 So starting with probably the earliest method, which is solar evaporation. 首先是最古老的方法——太阳蒸发法。 This method is used to extract salt from seawater. 这种方法用于从海水中提取盐。 Basically, seawater is collected in shallow pools. 简单来说，海水被引入浅池中。 The sea water dries out when it's exposed to sun and wind. 当海水暴露于阳光和风便会干涸。 When this happens, a layer of salt is left behind, which can be cleaned and harvested. 这样时，一层盐会被留下，就可以被清理并收集起来。 A newer technique is solution mining. 一种较新的技术是溶液开采法。 This method uses a water solution to extract salt from underground rock sources. 这种方法利用水溶液从地下岩层中提取盐分。 Water is injected into the rock and absorbs the salt. 水被注入岩石中并溶解盐分。 The salty liquid is then pumped back to the surface where the salt can be extracted at a processing plant. 然后，这种盐水被抽回地表，在加工厂中被提取盐分。 Finally, deep shaft mining is similar to other types of mineral mining. 最后一种方法是深井采矿法，与其他矿物开采类似。 Here, pieces of rock containing the salt are drilled away from the mine shaft. 在这种方法中，含有盐分的岩石从矿井中被钻取下来。 These pieces are then crushed into smaller chunks and transported to the top for processing. 随后被粉碎成小块，并运送到地面进行加工处理。","audio":"https://ti.koolearn.com/upload/ti/sardine/2657000-2658000/2657568/54bddc08978f409192c6d980c59b4881.mp3","phrases":[{"en":"salt trade has existed for thousands of years","zh":"盐贸易已存在数千年"},{"en":"economic and social history","zh":"经济和社会历史"},{"en":"Salt mining is still hugely important today","zh":"盐矿开采今天仍极其重要"},{"en":"three basic ways salt extracted","zh":"提取盐的三种基本方式"},{"en":"earliest method, which is solar evaporation","zh":"最早的方法是太阳能蒸发"},{"en":"seawater is collected in shallow pools","zh":"海水收集在浅池中"},{"en":"solution mining and deep shaft mining","zh":"溶解开采和深井开采"},{"en":"transported to the top for processing","zh":"运输到地面进行加工"}],"logicPhrases":[{"en":"so → starting with probably the earliest method","zh":"那么，先从大概最早的方法说起"},{"en":"when → it's exposed to sun and wind","zh":"当它受到风吹日晒时"},{"en":"when → this happens a layer of salt is left behind","zh":"发生这种情况时，会留下一层盐"},{"en":"finally → similar to other types of mineral","zh":"最后，深井开采与其他矿物开采类型类似"}]},{"id":1596,"name":"Savings","ref":"The middle classes in some developing countries have grown considerably from the last part of the previous century. This has benefited those economies greatly, but economists need to further investigate some of the details, such as p atterns of savings and the reasons for saving. The researchers mentioned here carried out their studies in India. Their conclusions included the fact that, unsurprisingly, richer people and business owners tended to save more. T he most important reason for saving was to provide for retirement, and the second was to provide their children with things like education and marriage ceremonies, which presumably are expensive in India. 中产阶级在一些发展中国家自上个世纪后期以来有了显著的增长。这对这些国家的经济带来了极大的益处，但经济学家需要进一步研究一些细节，如储蓄模式和储蓄的原因。这里提到的研究者们在印度进行了他们的研究。他们的结论包括一个毫不意外的事实，即较富有的人和企业主倾向于储蓄更多。储蓄的最重要原因是为退休后的生活提供保障，其次是为了给子女提供诸如教育和婚礼等事宜，这些在印度通常是昂贵的。","ana":"The enormous rise of the middle class in certain developing countries is one of the greatest economic successes of the late 20th and early 21st centuries. 某些发展中国家的中产阶级大幅崛起是20世纪末和21世纪初最伟大的经济成就之一。 This is excellent for the economies of those countries because the middle classes usually earn more than they need to live on, and thus they can save money. 这对这些国家的经济来说非常有利，因为中产阶级通常赚得比生活所需更多，因此他们可以存钱。 It's important that economists understand how these processes work, and thus they need to understand the savings habits of the new middle class. 经济学家理解这些过程如何运作非常重要，因此他们需要了解新兴中产阶级的储蓄习惯。 Our research therefore aimed to investigate patterns of savings and reasons for savings decisions. 我们的研究因此旨在调查储蓄模式以及储蓄决策背后的原因。 The country we chose to focus on was India. 我们选择重点关注的国家是印度。 We found that, not surprisingly, it was the richer people, especially business owners, who tended to save more. 我们发现，毫不意外，较富有的人，特别是企业主，往往储蓄更多。 As for the reasons for saving, the number one reason was to provide an income after retirement. 至于储蓄的原因，首要原因是为退休后提供收入。 Having an income after becoming too old to work was important for savers who wanted to be able to enjoy their older years. 对那些希望能够享受晚年生活的储户来说，在年老无法工作后拥有收入非常重要。 And the second most important reason was for family purposes, such as the education and weddings of their children. 第二重要的原因则是出于家庭用途，比如子女的教育和婚礼。","audio":"https://ti.koolearn.com/upload/ti/sardine/2656000-2657000/2656693/607e43cb7cd64dada7c11eebff59c904.mp3","phrases":[{"en":"enormous rise of the middle class","zh":"中产阶级的巨量崛起"},{"en":"middle classes usually earn more","zh":"中产阶级通常收入更高"},{"en":"they can save money","zh":"他们能存钱"},{"en":"patterns of savings and reasons","zh":"储蓄模式与原因"},{"en":"focus on was India","zh":"重点关注的是印度"},{"en":"richer people especially business owners","zh":"更富裕的人尤其是企业主"},{"en":"income after retirement","zh":"退休后的收入"},{"en":"education and weddings of their children","zh":"子女的教育和婚礼"}],"logicPhrases":[{"en":"because → the middle classes usually earn more than they need","zh":"因为中产阶级通常收入高于所需"},{"en":"thus → can save money","zh":"因此他们能存钱，经济学家必须了解他们是如何做到的"},{"en":"thus → understand the savings habits of the new","zh":"因此他们需要了解新群体的储蓄习惯"},{"en":"therefore → aimed to investigate patterns of savings and reasons for savings","zh":"因此旨在研究储蓄模式及储蓄原因"},{"en":"especially → business owners who tended to save more","zh":"尤其是往往储蓄更多的企业主"}]},{"id":3379,"name":"Shuttle","ref":"The shuttle was a space truck. It's a multi-purpose vehicle. The shuttle is the most versatile space vehicle that has ever been built. People used it to launch and repair satellites and outfitted it with the space lab and used it to do scientific research. People used it as part of the partnership with the Russians, which is still continuing. People will use it to build the new international space station, which is a huge international partnership. 航天飞机是一辆太空卡车，它是一种多功能飞行器。航天飞机是有史以来用途最广的太空交通工具。人们用它来发射和维修卫星，用它来装备太空实验室，用它来进行科学研究。人们用它作为与俄罗斯人合作的一部分，这种合作仍在继续。人们将用它来建造新的国际空间站，这是一个巨大的国际伙伴关系。","ana":"The shuttle was designed to be a space truck — it's a multi-purpose vehicle. 航天飞机被设计成\"太空卡车\"——一种多功能飞行器。 We've done a tremendous number of different things with it. 我们用它完成了极其多样化的任务。 It's the most versatile space vehicle that has ever been built. 这是人类建造过用途最广的航天器。 We've used it to launch satellites. 我们用它发射卫星， We've used it to repair satellites in orbit and put them back into orbit. 在轨维修卫星并重新部署， We've used it to capture satellites and bring them back to Earth for repair. 捕捉卫星返回地球维修， We've outfitted it with the space lab built by our European partners 搭载欧洲合作伙伴建造的太空实验室， and used it before the era of the space station to do scientific research. 在空间站时代前开展科研工作。 We used it as part of our partnership with the Russians, which is still continuing, 作为持续至今的美俄合作项目， first as part of the Mir space station, 先是为\"和平号\"空间站服务—— where we actually prolonged the useful life of Mir by several years through logistical supply visits with the shuttle. 通过航天飞机的物资补给，我们将和平号寿命延长了数年。 And now, of course, we're using it to build the new international space station, 如今它正用于建造新的国际空间站， which is a huge international partnership. 这项规模空前的国际合作工程。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690270/d65fc72778f14fdea1ca164873aaeb7a.mp3","phrases":[{"en":"designed to be a space truck","zh":"被设计成太空卡车"},{"en":"most versatile space vehicle","zh":"最多功能的航天器"},{"en":"launch satellites","zh":"发射卫星"},{"en":"repair satellites in orbit","zh":"在轨修复卫星"},{"en":"capture satellites and bring them back","zh":"捕获卫星并带回地球"},{"en":"space lab built by our European partners","zh":"欧洲伙伴建造的太空实验室"},{"en":"partnership with the Russians","zh":"与俄罗斯的合作"},{"en":"build the new international space station","zh":"建造新的国际空间站"}],"logicPhrases":[]},{"id":3354,"name":"Shy fish","ref":"A new study shows that shy individuals actually prefer to follow fish that are similarly timid. The scientists separated the fish into two groups, found that shy individuals actually prefer to follow fish that are similarly timid. That’s because the bold fish initiated more trips, regardless of who might be tailing them. If such tendencies also hold true in humans, when Americans decide who they’ll follow in November. 一项新的研究表明，胆小的个体实际上更喜欢跟随性格相似的胆小鱼。科学家将鱼分为两组，发现胆小的个体确实更喜欢跟随性格相似的胆小鱼。这是因为大胆的鱼发起了更多的出行，无论是谁在尾随它们。如果这种趋势在人类中也成立，那么当美国人在11月决定跟随谁时，可能会有类似的现象。","ana":"When you think of a leader, you may think of an individual who is above all bold. 当你想到领导者时，你可能会想到一个最重要的特质是勇敢的人。 But a new study of fish called sticklebacks shows that shy individuals actually prefer to follow fish that are similarly timid. 但一项关于名为刺鱼的鱼类的新研究表明，害羞的个体实际上更喜欢跟随性格相似的胆小鱼。 Researchers had trios of sticklebacks with known personalities play follow the leader. 研究人员让三只性格已知的刺鱼一起玩“跟随领导者”游戏。 The fish were placed in a tank that had some plastic plants at one end and some food hidden at the other. 这些鱼被放入一个水槽中，一端有一些塑料植物，另一端则藏有食物。 In some of the groups, a bold fish and a shy fish acted as leaders, while another shy fish followed. 在一些小组中，一只大胆的鱼和一只胆小的鱼充当领导者，另一只胆小的鱼跟随。 And in other groups, it was a bold fish that did the following. 而在其他小组中，是大胆的鱼作为跟随者。 The researchers recorded whether the follower sallied forth more frequently with the fish that was behaviorally similar or the one that was different. 研究人员记录了跟随者是否更频繁地与性格相似的鱼一起行动，还是与性格不同的鱼一起行动。 What they found is that shy fish were more likely to emerge from undercover when an equally wary fellow was already out there. 他们发现，当一只同样胆小的鱼已经在外面时，胆小的鱼更有可能从藏身处出来。 Bold follower fish did not seem to care which leader they followed. 大胆的跟随者鱼似乎不在乎跟随哪只领导者。 Of course, no matter which fish a stickleback chose to stick with, the bold fish did lead more expeditions over the course of the experiment than their more retiring friends. 当然，无论刺鱼选择跟随哪只鱼，大胆的鱼在整个实验过程中领导了更多的探险活动，而不是那些更加内向的朋友。 That’s because the bold fish initiated more trips, regardless of who might be tailing them. 这是因为大胆的鱼发起了更多的旅行，无论是谁在后面跟随它们。 The findings are in the journal Biology Letters. 这些发现发表在《生物学信件》期刊上。 The researchers write that “when offered a choice of leaders, sticklebacks prefer to follow individuals whose personality matches their own, but bolder individuals may, nevertheless, be able to impose their leadership, even among shy followers, simply through greater effort.” 研究人员写道：“当提供领导者选择时，刺鱼更喜欢跟随与自己性格相符的个体，但大胆的个体仍然可能通过更大的努力强加自己的领导地位，即使在胆小的跟随者中也是如此。” We may soon see if such tendencies also hold true in humans, when Americans decide who they’ll follow in November. 我们可能很快会看到，在美国人决定在11月选择追随谁时，这种倾向是否也适用于人类。 Unless, of course, something fishy happens. ——当然，除非出现“可疑情况”。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690243/be4603e3ccb7403ba3626950d583b9e0.mp3","phrases":[{"en":"new study of fish called sticklebacks","zh":"一项关于刺鱼的新研究"},{"en":"shy individuals actually prefer to follow","zh":"害羞个体其实更喜欢跟随"},{"en":"trios of sticklebacks with known personalities","zh":"三条已知个性的刺鱼组成小组"},{"en":"play follow the leader","zh":"玩跟随领袖游戏"},{"en":"shy fish were more likely to emerge","zh":"害羞的鱼更可能现身"},{"en":"bold fish initiated more trips","zh":"胆大的鱼发起了更多行程"},{"en":"findings are in the journal Biology Letters","zh":"研究结果发表在《生物学快报》"},{"en":"bolder individuals may impose their leadership","zh":"更胆大的个体可能强加其领导地位"}],"logicPhrases":[{"en":"when → think of a leader","zh":"当你想到领导者时"},{"en":"but → a new study of fish called sticklebacks shows that shy","zh":"但一项关于名为刺鱼的鱼类的新研究表明，害羞的"},{"en":"while → another shy fish followed And in other groups","zh":"而另一条害羞的鱼跟随了；而在其他群体中"},{"en":"when → an equally wary fellow was already out there","zh":"当一条同样警惕的同类已经先出去时"},{"en":"because → the bold fish initiated more trips","zh":"因为胆大的鱼发起了更多次出行"},{"en":"when → offered a choice of leaders","zh":"当可以选择领导者时"},{"en":"but → nevertheless be able to impose their leadership","zh":"但更大胆的个体或许仍能强加自己的领导地位"},{"en":"if → such tendencies also hold true in humans","zh":"如果这种倾向在人类身上也成立"}]},{"id":3358,"name":"Smartphone apps","ref":"Computer scientist and his team are developing new sensing systems. The initial focus was on energy and water monitoring. They paid attention to adapting the technology for personal health monitoring. They took advantage of all the functions built in our smartphones. The applications and their implications for our health and well-being may be more far-reaching than we ever imagined. 计算机科学家和他的团队正在开发新的传感系统。最初的重点是能源和用水监测。后来他们将注意力转向将这项技术应用于个人健康监测。他们充分利用了智能手机中内置的各种功能。这些应用及其对我们健康与福祉的影响，可能比我们曾经想象的更加深远。","ana":"Computer scientist Shwetak Patel and his team are developing new sensing systems. 计算机科学家Shwetak Patel和他的团队正在开发新的传感系统。 The initial focus was really around energy and water monitoring. 最初的重点实际上是能源和用水监测。 They built a new generation of smart sensors that monitor electronic interference on a home’s power line or water pressure changes in the plumbing. 他们构建了新一代智能传感器，用于监测家庭电力线路上的电子干扰或管道中水压的变化。 Most of this technology has already found industrial applications, and Patel and his team turned their attention to adapting the technology for personal health monitoring. 这些技术中的大多数已经被用于工业领域，而Patel和他的团队开始将注意力转向将这些技术应用于个人健康监测。 ‘So how do we take this noise and make it into a signal interest was hard to us, hard to us in the core of what we did for many years and we’re taking that work and applying it to other domains.’ “所以我们多年来的核心工作是如何把这些‘噪音’转化为有意义的信号，这是对我们一直以来的挑战，而现在我们正将这些成果应用到其他领域。” They’re looking to take advantage of all the functionality built in our smartphones. 他们正在尝试利用智能手机中内置的各种功能。 With the users’ permission, this app can use the microphone built into most smartphones to listen to background noises, such as coughing searching for patterns that suggest a trip to the doctor might be an order. 在用户授权的前提下，这款应用可以使用大多数智能手机内置的麦克风来监听背景噪音，例如咳嗽声，寻找可能需要就医的模式。 ‘We've constructed these models that try and understand how sound works, how it, what its patterns are and we give it a whole bunch of examples of different kinds of audio, things like people talking, things like people laughing, sneezing and of course coughing.’ “我们构建了模型来理解声音是如何运作的，它的模式是什么。我们给模型大量不同类型的音频样本，比如说话、笑声、打喷嚏，当然还有咳嗽声。” This app uses a phone’s camera to check hemoglobin levels in blood by analyzing the color of capillary fluid through the skin. 这个应用还可以通过分析皮肤下毛细血管液体的颜色，利用手机摄像头检测血红蛋白的水平。 Generally, what happens is if you’re anemic, your bloods maybe a little less red and we take advantage of that by putting your finger over a camera of a phone, the camera of the phone can actually see the coloration of the blood. 一般来说，如果你患有贫血，你的血液颜色可能会稍微偏淡。我们就是利用这一点，把手指放在手机摄像头上，摄像头就能观察到血液的颜色。 and this test uses the camera to tell parents worried about jaundice in newborn infants. 这个检测还可以帮助担心新生儿黄疸的父母，通过摄像头进行识别。 ‘Now, jaundice is something that doctors who have seen tons of babies. He just can figure out on a very basic level of it. Is this baby, do they need to get treatment or are they in a good condition, while the first-time parent has no idea necessarily what jaundice might look like.’ “黄疸是那些看过很多婴儿的医生一眼就能判断的东西。他们可以非常直观地判断这个婴儿是否需要治疗或身体是否健康，而初为人父母的家长却常常不知道黄疸到底长什么样。” The researchers say the built-in sensors found in smartphones are already commonplace, but their applications and their implications for our health and well-being may be more far-reaching than we ever imagined. 研究人员表示，智能手机中内置的传感器已经非常普遍，但它们在健康和福祉方面的应用与影响，可能远比我们想象的更加深远。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690248/70c26b7708eb426092b253dbbe79c29f.mp3","phrases":[{"en":"Computer scientist Shwetak Patel","zh":"计算机科学家 Shwetak Patel"},{"en":"energy and water monitoring","zh":"能源与用水监测"},{"en":"personal health monitoring","zh":"个人健康监测"},{"en":"functionality built in our smartphones","zh":"智能手机内置功能"},{"en":"microphone built into most smartphones","zh":"多数智能手机内置麦克风"},{"en":"hemoglobin levels in blood","zh":"血液中的血红蛋白水平"},{"en":"jaundice in newborn infants","zh":"新生儿黄疸"},{"en":"built-in sensors found in smartphones","zh":"智能手机中的内置传感器"}],"logicPhrases":[{"en":"so → we take this noise and make","zh":"那么我们如何利用这些噪声，使其"},{"en":"if → you’re anemic your bloods maybe a little less red","zh":"如果你贫血，你的血液可能没那么红"},{"en":"while → no idea necessarily what jaundice might","zh":"而初为人父母者未必知道黄疸可能是什么"},{"en":"but → their applications and their implications for our health and well-being","zh":"但它们的应用及其对我们健康与福祉的影响"}]},{"id":4275,"name":"Smell of books","ref":"We’ve all been to a historic library. Most historic libraries have such an intensive smell of old books. People are asked to perceive the library. Indeed, the smell is an important way of how we communicate with the environment. The majority of people use sight to interact with the environment, but on the second place, the smell is also very, very important. 我们都去过历史悠久的图书馆。在大多数历史悠久的图书馆里，都有一种强烈的旧书味。人们通过感官体验来认识图书馆。事实上，气味是我们与环境交流的重要方式之一。大多数人通过视觉与环境互动，但其次，气味也非常非常重要。","ana":"Indeed, the library. We’ve all been to a historic library. We’ve all enjoyed the smell of a historic library. 确实，图书馆。我们都去过历史悠久的图书馆，我们都喜欢历史图书馆的气味。 But what is it? And what does it mean? 但它到底是什么？它意味着什么？ When we’ve recently, when at UCL Center for Sustainable Heritage, we’ve recently been asked to access the environment at another historical library at Saint Paul’s Cathedral, the Wren library, an incredible place. 最近，在UCL可持续遗产中心，我们被要求评估圣保罗大教堂另一座历史图书馆的环境——雷恩图书馆，这是一个令人难以置信的地方。 And it has such an intensive smell of old books, and we were also asked for the first time really I was actually taken aback by the brief, and we were asked why we should preserve the smell. 这里弥漫着浓烈的古书气味，我们第一次被问，实际上我当时感到有些惊讶，问我们为什么要保留这种气味。 It is so important to our audience. It is so important how people perceive the library. 这对我们的受众非常重要。它对人们如何感知图书馆非常重要。 So, that is, that was quite an important message in our research. 因此，这在我们的研究中是一个非常重要的信息。 And indeed smell is an important way of how we communicate with the environment. 的确，气味是我们与环境沟通的一种重要方式。 This piece of research was done by an advertising company because advertisers are so interested in how we, how we interact with each other and the environment. 这项研究是由一家广告公司进行的，因为广告商对我们如何与彼此以及环境互动非常感兴趣。 And we see that the majority of people use sight obviously to interact with the environment, but in the second place, we see the smell is also very, very important. 我们看到，大多数人显然通过视觉与环境互动，但第二位，气味也非常非常重要。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693307/49ac17c87b4e4e93b9785d5217f679de.mp3","phrases":[{"en":"smell of a historic library","zh":"历史图书馆的气味"},{"en":"UCL Center for Sustainable Heritage","zh":"UCL可持续遗产中心"},{"en":"Saint Paul’s Cathedral, the Wren library","zh":"圣保罗大教堂的雷恩图书馆"},{"en":"intensive smell of old books","zh":"旧书的浓烈气味"},{"en":"why we should preserve the smell","zh":"为何要保存这种气味"},{"en":"how people perceive the library","zh":"人们如何感知图书馆"},{"en":"how we communicate with the environment","zh":"我们如何与环境交流"},{"en":"majority of people use sight","zh":"大多数人使用视觉"}],"logicPhrases":[{"en":"but → it And what does it mean","zh":"但它是什么？又意味着什么？"},{"en":"when → we’ve recently when at UCL Center for Sustainable Heritage","zh":"当我们最近在伦敦大学学院可持续遗产中心时"},{"en":"when → at UCL Center for Sustainable Heritage","zh":"在伦敦大学学院可持续遗产中心时"},{"en":"so → important to our audience","zh":"对我们的受众如此重要；人们如何……非常重要"},{"en":"so → important how people perceive the library","zh":"人们如何看待图书馆非常重要"},{"en":"so → quite an important message in our","zh":"所以，那在我们……中曾是一个相当重要的信息"},{"en":"because → so interested in how","zh":"因为广告商非常关心如何……"},{"en":"so → interested in how we how we interact with each other","zh":"如此关注我们如何彼此互动"}]},{"id":3360,"name":"Soot emission","ref":"The lecture discusses the major impact of soot, or black carbon, on health and climate. Soot comes from burning materials like coal and wood, causing respiratory diseases and millions of deaths yearly. It also contributes significantly to global warming. The speaker highlights that reducing soot is a fast solution because it leaves the atmosphere quickly. While not a complete fix, cutting soot emissions can buy time to address CO2. The talk ends by urging public action and policy changes to tackle this problem. 本次讲座重点探讨了煤烟（又称黑碳）对健康与气候的重大影响。煤烟产生于煤炭、木料等物质的燃烧过程，不仅会引发呼吸系统疾病，更导致全球每年数百万人死亡，同时还显著加剧全球变暖。讲者特别强调，减少煤烟排放是一项收效迅速的气候对策，因其能快速脱离大气层。尽管这并非根本解决方案，但控制煤烟排放能为应对二氧化碳问题争取宝贵时间。讲座最后呼吁公众行动与政策改革共同应对这一环境挑战。","ana":"Sometimes it's the little things that can make big things happen. 有时候，微小的事物却能引发巨大的变化。 Fleas and the plague, atoms and nuclear bom
