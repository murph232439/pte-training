s it allows clear real time monitoring. 它在精英运动员的训练中尤其受欢迎，因为它能够进行清晰的实时监测。 One thing that athletes particularly like to monitor is their electrolyte levels. 运动员特别喜欢监测的一件事是他们的电解质水平。 Electrolytes are minerals in the body that have multiple functions in keeping our bodies running healthily. 电解质是体内具有多种功能的矿物质，有助于我们身体健康运转。 So it's very important to maintain their levels. 因此，维持它们的水平非常重要。 The smart skin is able to analyze these from a person's sweat. 智能皮肤能够通过分析人的汗液来监测这些电解质水平。 If levels are low, then athletes need to take care and slow down. 如果水平偏低，运动员就需要注意并减速。 This instant analysis means that a person has the information at their fingertips, so to speak, and can make decisions before there's an adverse effect on their health. 这种即时分析意味着人们可以随时掌握信息，并在健康受到不利影响之前做出决定。 Another way the smart skin is being used is to monitor a person's heartbeat by showing a visual wave, rather like having a heart monitor strapped to your arm, but a lot more portable and comfortable. 智能皮肤的另一种用途是通过显示可视化的波形来监测人的心跳，就像手臂上绑着一个心脏监护仪一样，但它更便携、更舒适。 These are just two applications, but scientists are already starting to explore the myriad uses for this technology. 这仅仅是两个应用，但科学家们已经开始探索这项技术的无数用途。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658779/a0035877a5fa4c3ca287baa6b28e7077.mp3","phrases":[{"en":"the development of stretchable electronics","zh":"可拉伸电子设备的发展"},{"en":"an electronic skin that can be worn","zh":"可以穿戴的电子皮肤"},{"en":"monitor various bodily processes","zh":"监测各种身体过程"},{"en":"popular with elite athletes","zh":"受精英运动员欢迎"},{"en":"real time monitoring","zh":"实时监测"},{"en":"monitor electrolyte levels from sweat","zh":"从汗液监测电解质水平"},{"en":"monitor a person's heartbeat","zh":"监测心跳"},{"en":"the myriad uses for this technology","zh":"这项技术的多种用途"}],"logicPhrases":[{"en":"so → the development of stretchable electronics or smart skin has long","zh":"所以，可拉伸电子器件或智能皮肤的研发由来已久"},{"en":"but → it's now become a reality","zh":"但现在它已成为现实"},{"en":"in order to → monitor various bodily processes","zh":"为了监测各种身体机能，它尤其受精英群体欢迎"},{"en":"so → it's very important to maintain their levels","zh":"所以，维持他们的水平非常重要"},{"en":"if → low then athletes need to take care","zh":"如果水平偏低，运动员就需要多加注意"},{"en":"so → make decisions before there's an adverse","zh":"可以说，并能在出现不良后果之前做出决定"},{"en":"but → a lot more portable and comfortable","zh":"但便携得多，也舒适得多"},{"en":"but → already starting to explore the myriad uses","zh":"但科学家已经开始探索其无数用途"}]},{"id":2128,"name":"Sound of words","ref":"The lecture explains the significance of words and their sound. It discusses how the sound of words is crucial for cognitive processes, representing the world and self-perception. It also emphasizes the broad capacity of words to express concepts, using high school graduates as an example. The mention of phone numbers suggests words are vital for memory. Overall, it underscores the influence of words and sound on cognitive functions and communication","ana":"The lecture emphasizes the importance of words and the impact of their sound. 讲座强调了词语的重要性以及其发音所产生的影响。 According to the speaker, the sound of words plays a crucial role in cognitive processes, aiding in the representation of the world and self-perception. 讲者指出，词语的发音在认知过程中起着关键作用，有助于我们对世界的理解和自我认知。 Furthermore, the lecture highlights the broad capacity of words to express a multitude of concepts, underscoring their significance in communication and cognitive development. 此外，讲座还强调了词语表达多种概念的广泛能力，突显了它们在交流和认知发展中的重要性。 The speaker also uses the example of high school graduates to illustrate the importance of words in conveying complex ideas and information. 演讲者还以高中毕业生为例，说明词语在传达复杂思想和信息方面的重要性。 Additionally, the mention of phone numbers suggests that words and their sounds are integral to memory and recall processes. 此外，提到电话号码也表明词语及其发音在记忆和回忆过程中具有重要作用。 Overall, the lecture underscores the profound influence of words and their sound on cognitive functions and communication, informing how individuals perceive and interact with the world. 总体而言，讲座强调了词语及其发音对认知功能和交流方式所产生的深远影响，这决定了人们如何感知并与世界互动。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678649/f9cd6cf04e2f4bb0b551299463faa250.mp3","phrases":[{"en":"the importance of words and their sound","zh":"词汇及其发音的重要性"},{"en":"the sound of words in cognitive processes","zh":"发音在认知过程中的作用"},{"en":"the representation of the world","zh":"对世界的表征"},{"en":"self-perception","zh":"自我认知"},{"en":"express a multitude of concepts","zh":"表达大量概念"},{"en":"the example of high school graduates","zh":"高中毕业生的例子"},{"en":"integral to memory and recall","zh":"对记忆和回忆很重要"},{"en":"the profound influence on cognitive functions","zh":"对认知功能的深远影响"}],"logicPhrases":[{"en":"according to → the speaker the sound of words plays a crucial role","zh":"据演讲者称，词语的声音起着关键作用"}]},{"id":2135,"name":"Sources of protein","ref":"Our current food system is unsustainable, especially our ways of sourcing protein. This contributes to global greenhouse gas emissions and takes up a large proportion of land for agricultural purposes. We can, however, reduce these negative effects by getting more of our protein from plant-based foods and lab-grown meat, provided that the public can easily access and afford them.","ana":"Our current way of eating is not sustainable, neither for our health nor the environment. 我们目前的饮食方式不可持续，对我们的健康和环境都不利。 Our food system, which relies on the production of meat, eggs and dairy products as sources of protein, generates 15% of total greenhouse gas emissions globally. 我们的食品系统依赖于肉类、蛋类和乳制品的生产作为蛋白质的来源，产生全球温室气体排放总量的15%。 It also requires 70% of the agricultural land on Earth. 它还需要地球上70% 的农业土地。 We need to change how we produce, transport and cook food. 我们需要改变我们生产、运输和烹饪食物的方式。 Studies show that taking a more flexible approach to the way we obtain protein can allow our diets to have a significantly less damaging effect on the environment. 研究表明，采用更灵活的方法获取蛋白质可以使我们的饮食对环境的破坏性影响大大减少。 Specifically, it can bring the greenhouse gas emissions down by more than 50%, 具体来说，它可以将温室气体排放量降低50% 以上， and we can do this easily by having more plant-based foods and less meat. 我们可以通过增加植物性食品和减少肉类来轻松实现这一目标。 This should be viable as more and more alternatives to traditional sources of protein are becoming more widely available. 这应该是可行的，因为越来越多的传统蛋白质来源的替代品正在变得越来越广泛。 Beans, wheat, nuts, and even insects all have a lower impact on the environment 豆类、小麦、坚果，甚至昆虫对环境的影响都比较小， and along with the promising development of meat grown in labs, 实验室肉类的发展前景也不错， they give us the opportunity to dramatically reduce greenhouse gas emissions compared with those produced by meat production, 它们为我们提供了与肉类生产产生的温室气体相比大幅减少温室气体排放的机会， as long as they are both readily available and affordable for the public, 只要它们既容易获得又能为公众负担得起， we should be able to flexibly switch between traditional and alternative sources of protein. 我们应该能够灵活地在传统和替代蛋白质来源之间切换。","audio":"https://ti.koolearn.com/upload/ti/sardine/2657000-2658000/2657019/8c9699300ea44b499ca43f0a0b0ec423.mp3","phrases":[{"en":"our current way of eating is not sustainable","zh":"当前的饮食方式不可持续"},{"en":"relies on meat, eggs and dairy","zh":"依赖肉、蛋、奶"},{"en":"generates 15% of total greenhouse gas emissions","zh":"产生 15% 的温室气体"},{"en":"requires 70% of the agricultural land","zh":"占用 70% 的农业用地"},{"en":"a more flexible approach to the","zh":"更灵活的蛋白质获取方式"},{"en":"reduce emissions by more than 50%","zh":"减少 50% 以上排放"},{"en":"more plant-based foods and less meat","zh":"更多植物性食物、更少肉"},{"en":"alternatives like beans, nuts and insects","zh":"豆类、坚果、昆虫等替代品"}],"logicPhrases":[]},{"id":4442,"name":"Stock market and business","ref":"The stock market is where investors buy and sell stocks, which represent shares of ownership in public companies. It can be accessed online through a brokerage account or retirement plan. In the past, companies used stocks to raise money, but now modern companies like Apple and Google earn money and use stocks differently. The stock market also tends to invest in large companies.From 19th to 20th century, however, modern companies, such as Apple, Google and Microsoft are big enough to earn money, and use stocks differently.","ana":"The stock market is where investors connect to buy and sell investments - most commonly, stocks, which are shares of ownership in a public company. 股票市场是投资者进行买卖投资的场所，最常见的投资对象是股票，也就是公众公司所有权的份额。 When you need groceries, you go to the supermarket. When you're ready to buy stocks or mutual funds, you'll usually buy them online through the stock market, which anyone can access with a brokerage account or employee retirement plan. 当你需要购买日用品时，你会去超市；而当你准备购买股票或共同基金时，通常会通过股票市场在线购买。只要有证券账户或员工退休计划，任何人都可以进入这个市场。 The term 'stock market' often refers to one of the major stock market indexes. “股票市场”一词通常也用来指代主要的股票市场指数之一。 However, there are some different uses of the stock market before and after. 然而，在不同时期，股票市场的用途存在一些差异。 In the 18th century, manufacturing companies came into the market. Traditional companies used stocks to raise money, and input money into companies, while modern companies used stocks to output money. 在18世纪，制造类公司开始进入市场。传统公司通过发行股票筹集资金，将资金投入企业，而现代公司则通过股票实现资金的输出。 From 19th to 20th century, however, modern companies, such as Apple, Google and Microsoft are big enough to earn money, and use stocks differently. 然而从19世纪到20世纪，现代公司如苹果、谷歌和微软已经足够强大，能够自行盈利，因此它们使用股票的方式也有所不同。 The stock market also inclined to put money into big companies. 股票市场也更倾向于将资金投入到大型公司中。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693053/2aa766ab77a5453fb30c5b4831898e08.mp3","phrases":[{"en":"The stock market is where investors connect to buy and sell","zh":"股票市场是投资者买卖的地方"},{"en":"stocks, which are shares of ownership","zh":"股票是所有权份额"},{"en":"buy them online through the stock market","zh":"通过股票市场在线购买"},{"en":"a brokerage account or employee retirement plan","zh":"经纪账户或退休计划"},{"en":"major stock market indexes","zh":"主要股票市场指数"},{"en":"in the 18th century, manufacturing companies","zh":"18 世纪的制造公司"},{"en":"traditional companies used stocks to raise money","zh":"传统公司用股票筹资"},{"en":"modern companies, such as Apple, Google and Microsoft","zh":"苹果、谷歌、微软等现代公司"}],"logicPhrases":[{"en":"when → need groceries you go to the supermarket","zh":"当需要买食品杂货时，你会去超市"},{"en":"when → you're ready to buy stocks or mutual funds","zh":"当你准备买股票或共同基金时"},{"en":"however → some different uses of the stock market before","zh":"然而，以前的股票市场还有一些不同的用途"},{"en":"while → modern companies used stocks to output money","zh":"而现代公司用股票来赚钱"},{"en":"however → modern companies such as Apple","zh":"然而，像苹果这样的现代公司"}]},{"id":2133,"name":"Street art","ref":"Street art has developed as a form of expression ever since its graffiti origins and has many different influences. lt's now a common feature in many cities and sometimes conveys quite positive messages. However, street art still remains somewhat controversial and can actually be illegal. Nevertheless, public perceptions of it have gradually become more accepting. Indeed, now some of the most famous street artists areas respected as their counterparts working inconventional creative fields.","ana":"Streetheart developed from an underground art form into something which has achieved mainstream recognition and acceptance. 街头艺术从一种地下艺术形式发展成为获得主流认可和接受的事物。 It has its origins in the graffiti trend, which became popular in cities in the 1960s. 它起源于 20 世纪 60 年代在城市中流行的涂鸦潮流。 At that time, adding graffiti to public spaces was most definitely considered to be an act of vandalism. 当时，在公共场所涂鸦绝对被认为是破坏行为。 Indeed, it was hardly viewed as art at all, but rather as an expression of social frustration. 事实上，它几乎不被视为艺术，而更多地被看作是社会挫败感的表达。 However, over the decades, street art has developed artistically. 然而，几十年过去了，街头艺术在艺术上得到了发展。 Street artists have taken their inspiration from a wide variety of cultural influences, including hip hop music and graphic design trends. 街头艺术家从各种文化影响中汲取灵感，包括嘻哈音乐和平面设计潮流。 Nowadays, many urban centers have colorful, large scale wall paintings displaying uplifting or socially responsible messages. 如今，许多城市中心都有色彩鲜艳的大型壁画，展示着令人振奋或具有社会责任感的信息。 For this reason, street art is now viewed as part of the urban landscape and in some cases is a source of local pride. 因此，街头艺术现在被视为城市景观的一部分，在某些情况下还是当地自豪感的来源。 The street art projects I've just mentioned are, of course, officially approved schemes. 我刚才提到的街头艺术项目当然是官方批准的计划。 However, some designs still appear on the sides of buildings without legal permission, and that's why street art is still a controversial art form. 然而，一些设计仍然未经许可出现在建筑物的外墙上，这就是为什么街头艺术仍然是一种有争议的艺术形式。 Nevertheless, it is now broadly accepted to the extent that some street artists have even achieved the same level of fame as celebrated artists in other creative fields. 尽管如此，它现在已被广泛接受，以至于一些街头艺术家甚至达到了其他创意领域著名艺术家一样的名声。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658782/5d110e64bb194d0096a1fb931bd44cc4.mp3","phrases":[{"en":"developed from an underground art form","zh":"从地下艺术发展而来"},{"en":"achieved mainstream recognition","zh":"获得主流认可"},{"en":"its origins in the graffiti trend","zh":"起源于涂鸦潮流"},{"en":"considered to be an act of vandalism","zh":"被视为破坏行为"},{"en":"an expression of social frustration","zh":"社会不满的表达"},{"en":"inspired by hip hop and graphic design","zh":"受嘻哈和平面设计启发"},{"en":"large scale wall paintings","zh":"大型墙面绘画"},{"en":"still a controversial art form","zh":"仍是有争议的艺术形式"}],"logicPhrases":[{"en":"but → rather as an expression of social frustration","zh":"而是作为社会挫败感的一种表达"},{"en":"however → over the decades street art has developed artistically","zh":"然而，几十年来，街头艺术在艺术上已有所发展"},{"en":"however → some designs still appear on the sides of buildings without","zh":"然而，一些图案仍会出现在建筑物侧面，未经……"}]},{"id":3791,"name":"Telescope","ref":"Our eye is a tiny five-millimeter telescope. When we have larger telescopes that collect more light, we can see things fainter but it greatly improves detail. This is because the nature of light is a wave which has quantum mechanical effects. Telescopes also allow us to put modern digital detectors behind them, which are 100 times more efficient. Such improvement allowed astronomy to do so much in the optical regime.","ana":"So let's just talk a little bit about a telescope. 那么，我们来稍微谈谈望远镜。 Our eye is the telescope we all are used to. 我们的眼睛就是我们最熟悉的望远镜。 It's a little tiny five millimeter telescope, and it serves us very well. 它是一个小小的、只有五毫米的望远镜，但它为我们服务得很好。 But if we make telescopes bigger, we get a couple of good things. 但如果我们制造更大的望远镜，我们就能获得一些更好的效果。 We have larger telescopes and they collect a lot more light so we can see things that are fainter. 更大的望远镜可以收集更多的光线，使我们能看到更暗弱的天体。 But it turns out they greatly improve detail. 此外，它们还能显著提升图像的细节。 And that's because of the nature that light is a wave, and wave effects are what we call quantum mechanical effects, 这是因为光具有波动性，而波动效应就是我们所说的量子力学效应， meaning that when you use a little telescope to look at waves, it becomes blurry through what we call diffraction. 也就是说，当你用一个小望远镜观察光波时，由于我们称之为“衍射”的现象，图像会变得模糊。 And so larger telescopes are extremely useful to improve detail. 因此，更大的望远镜在提升细节方面非常有用。 The other thing that telescopes allow us to do is to put modern digital detectors behind them. 望远镜还让我们能够在其后方安装现代的数字探测器。 Our eye is about the same sensitivity as a photographic plate. 我们的眼睛对光的敏感度大致与摄影底片相当。 A photographic plate can be sat there and it can look at the sky for an hour so it can see fainter. 摄影底片可以持续曝光一小时，从而看到比肉眼更暗的天体。 But modern digital detectors are almost 100 times more efficient than our eyes at collecting light. 但现代的数字探测器在收集光线方面的效率几乎是我们眼睛的100倍。 And so you can improve things by a factor of 100. 因此，你可以将观测能力提升100倍。 That's like building a telescope ten times bigger. 这相当于建造一个口径大10倍的望远镜。 And so that improvement has been one of the things that's allowed astronomy to do so much in the optical regime in the last 30 years. 这种技术进步正是过去30年里光学天文领域取得巨大成就的关键因素之一。","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691687/aa4905fb2e8c4da485dafb8801dfb653.mp3","phrases":[{"en":"our eye is a tiny telescope","zh":"我们的眼睛是个小望远镜"},{"en":"larger telescopes collect more light","zh":"更大的望远镜收集更多光"},{"en":"see things that are fainter","zh":"看到更暗的物体"},{"en":"greatly improve detail","zh":"大幅提升细节"},{"en":"light is a wave","zh":"光是波"},{"en":"blurry through diffraction","zh":"因衍射而模糊"},{"en":"modern digital detectors","zh":"现代数字探测器"},{"en":"100 times more efficient than our eyes","zh":"比眼睛高效 100 倍"}],"logicPhrases":[{"en":"so → let's just talk a little bit about a telescope","zh":"那我们稍微聊聊望远镜吧。"},{"en":"but → make telescopes bigger","zh":"但如果把望远镜造得更大"},{"en":"if → make telescopes bigger we get a couple of good","zh":"如果把望远镜造得更大，我们就能获得几个好处"},{"en":"so → can see things that are fainter","zh":"这样我们就能看到更暗弱的物体"},{"en":"but → turns out they greatly improve detail","zh":"但事实证明，它们能大幅提升细节"},{"en":"because → of the nature that light is a wave","zh":"因为光本质上是一种波"},{"en":"when → use a little telescope to look at waves","zh":"当你用小望远镜观察波时"},{"en":"so → extremely useful to improve detail","zh":"所以更大的望远镜对提升细节极为有用"}]},{"id":4460,"name":"The internet requires energy","ref":"This lecture mainly talks about the Internet. The Internet comprises devices, data centers, and communication lines. It consumes about five percent of global electricity, with data centers using one or two percent. Most of the electricity comes from burning fossil fuels, resulting in greenhouse gas emissions. Compared to other sectors, the Internet's contribution to global emissions is around two percent.","ana":"The Internet is pretty great, this wouldn't be a thing without it, but getting this video and all the other bits of the Internet to you uses a lot of energy. 互联网非常了不起，没有它，这段视频根本不可能存在。但将这段视频以及互联网上的其他内容传送到你手中，需要消耗大量能源。 What we call the Internet is made up of a lot of things, wires traversing the ocean, satellites and cell phone towers, massive data centers sending packets of information all over, and devices — so many devices! 我们所说的互联网由许多部分组成：横跨海洋的电缆、卫星和手机信号塔、庞大的数据中心向世界各地发送信息包，还有各种设备——数不胜数！ Today, there are more than 30 billion things connected to the Internet. 今天，已有超过300亿台设备连接到互联网。 That's every cell phone, laptop, and tablet, but also every credit card reader, creepy, all-hearing speaker, newfangled fridge with a TV on the front end, and more things coming online every day. 这包括每一部手机、笔记本电脑和平板电脑，还包括每一台刷卡机、令人不安的智能音箱、带有屏幕的新型冰箱，以及其他每天都在接入网络的新设备。 Every single one of these devices requires electricity. 每一台这样的设备都需要电力支持。 Charging a single phone or a laptop doesn't use that much energy, but powering billions of Internet-connected devices adds up. 为一部手机或笔记本电脑充电所消耗的能源并不多，但数十亿台联网设备加在一起就非常可观了。 It's hard to estimate exactly how much because things are changing too fast, even count. 要准确估算具体的能耗非常困难，因为一切都变化得太快，甚至连统计都变得困难。 But in total, Internet-connected devices probably use in the neighborhood of five percent of the world's electricity. 但总体而言，互联网连接设备可能消耗了全球大约百分之五的电力。 Once you've got your Internet portal charged and ready to go, streaming a video or posting a pic on Instagram, draws on power from data centers distributed around the world. 一旦你的互联网终端充满电并准备使用，无论是在线观看视频还是在Instagram上发布照片，都会调用全球各地数据中心的电力资源。 After devices, data centers are the Internet's next biggest energy hog, using around one or two percent of the world's total electricity. 除了终端设备之外，数据中心是互联网第二大耗能部分，约占全球总用电量的1%至2%。 And most of this electricity comes from burning fossil fuels, which release greenhouse gases into the atmosphere. 而其中大部分电力来自燃烧化石燃料，这会向大气中排放温室气体。 But when compared to all the other things that produce greenhouse gases like transportation, which causes almost a quarter of global emissions, the unit is doing all right. 不过与交通运输等其他温室气体来源相比——交通运输几乎占全球排放量的四分之一——互联网的碳排放表现还算不错。 In total, it contributes only around two percent of global emissions. 总的来说，互联网仅贡献了全球温室气体排放量的大约2%。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693058/6f123563eaa84765bca0c39220f16fa8.mp3","phrases":[{"en":"the Internet to you uses a lot of energy","zh":"互联网耗电很多"},{"en":"wires traversing the ocean","zh":"横跨海洋的电缆"},{"en":"satellites and cell phone towers","zh":"卫星和手机基站"},{"en":"massive data centers","zh":"大型数据中心"},{"en":"more than 30 billion things connected","zh":"超过 300 亿台设备联网"},{"en":"devices use five percent of world's electricity","zh":"设备用掉全球 5% 的电"},{"en":"data centers use one or two percent","zh":"数据中心用 1 到 2%"},{"en":"the internet contributes two percent of emissions","zh":"互联网产生 2% 的排放"}],"logicPhrases":[{"en":"but → getting this video and all the other bits of the","zh":"但获取这段视频以及所有其他零碎内容"},{"en":"so → many devices Today there are more than 30 billion things","zh":"设备如此之多：如今有超过300亿个物品"},{"en":"but → also every credit card reader","zh":"但也包括每个信用卡读卡器"},{"en":"but → powering billions of Internet-connected devices adds up","zh":"但为数十亿台联网设备供电，累加起来不容小觑"},{"en":"because → changing too fast","zh":"因为情况变化太快"},{"en":"but → in total Internet-connected devices probably use in the neighborhood","zh":"但总体而言，联网设备可能大约用掉……"},{"en":"but → compared to all the other things that produce greenhouse","zh":"但与所有其他产生温室（气体）的东西相比"},{"en":"when → compared to all the other things that produce greenhouse gases","zh":"与所有其他产生温室气体的东西相比"}]},{"id":4466,"name":"The stability of mood","ref":"Emotional stability varies between individuals. Research indicates that the key to happinessis maintaining a delicate balance of emotional containment and resilience, allowing for a natural ebb and flow of emotions. Finding this equilibrium is essential for emotional well-being and health, ultimately granting individuals a sense of contentment, and happiness.","ana":"Emotional stability is a unique trait that differs from person to person. 情绪稳定性是一种因人而异的独特特质。 For some individuals, their moods fluctuate dramatically, resembling a roller coaster ride, while others present a consistently composed and relaxed demeanor. 对一些人来说，情绪起伏剧烈，就像坐过山车一样；而另一些人则表现出一贯的沉着与放松。 Studies have suggested that the key to achieving happiness lies in maintaining a certain level of emotional containment. 研究表明，获得幸福的关键在于保持一定程度的情绪控制。 It is a delicate balance between maintaining a sense of control while also allowing for the natural ebb and flow of emotions. 这是一种在掌控感与情绪自然起伏之间取得微妙平衡的状态。 The optimal emotional state appears to be characterized by a point of equilibrium, wherein there is a moderate level of emotional containment and resilience. 最佳的情绪状态似乎是一种平衡点，表现为适度的情绪控制力和心理韧性。 Essentially, the secret to emotional well-being involves finding this balance. 本质上，实现情绪健康的关键就在于找到这种平衡。 It means navigating between intense and loose emotions, striving for a state of gentle containment coupled with a poised resilience. 这意味着要在激烈与松散的情绪之间游走，努力达到一种温和节制并伴有从容坚韧的状态。 This harmonious emotional state ultimately grants an individual a sense of contentment and well-being. 这种和谐的情绪状态最终会赋予个体满足感和幸福感。 Therefore, understanding and achieving this delicate equilibrium is essential for emotional health and happiness. 因此，理解和实现这种微妙的平衡，对于情绪健康和幸福感至关重要。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693064/27ea476b5d51424ba6f5f1fe72bafdcf.mp3","phrases":[{"en":"emotional stability differs from person to person","zh":"情绪稳定性因人而异"},{"en":"moods fluctuate like a roller coaster","zh":"情绪像过山车一样波动"},{"en":"composed and relaxed demeanor","zh":"沉着放松的举止"},{"en":"the key to happiness is emotional containment","zh":"幸福的关键是情绪克制"},{"en":"a delicate balance","zh":"微妙的平衡"},{"en":"a point of equilibrium","zh":"一个平衡点"},{"en":"a state of gentle containment","zh":"温和克制的状态"},{"en":"a sense of contentment and well-being","zh":"满足和幸福的感觉"}],"logicPhrases":[{"en":"while → others present a consistently composed and relaxed demeanor","zh":"而另一些人始终表现得沉着放松"},{"en":"while → also allowing for the natural ebb and flow of emotions","zh":"同时也要允许情绪自然起伏"},{"en":"therefore → understanding and achieving this delicate equilibrium is essential for emotional","zh":"因此，理解并实现这种微妙的平衡对情绪至关重要"}]},{"id":2122,"name":"Transportation network in Paris","ref":"Paris has an extensive public transportation system with the metro and RER trains. The metro has 16 lines distinguished by different colors, while the RER has five lines labeled ABCDE. Trains operate from 6:00 a.m. to half past midnight. Tickets for a single journey are 1. 90 euros, or you can purchase a book of 10 tickets for 14. 50 euros. Weekly or monthly passes are offered but require a passport photo.","ana":"As with most cities, we recommend getting about on foot. 和大多数城市一样，我们建议步行出行。 Besides being eco-friendly, it's a great way to get a feel for the city. 除了环保之外，这也是了解这座城市的好方式。 Just bear in mind that Paris is big, like really big. 但请记住，巴黎很大，是非常大。 A walk from the Eiffel Tower to Notre Dame would take a good hour. 从埃菲尔铁塔走到圣母院大约需要整整一个小时。 Fortunately, if you're strapped for time, there are great public transport links. 幸运的是，如果你时间紧张，也有非常便捷的公共交通。 The subway system is split into the metro and RER lines. 地铁系统分为地铁线和RER线。 Tickets will work across both, so you can treat it as one big underground network. 车票两者通用，因此你可以将它们视为一个庞大的地下交通网络。 In our experience, it served a purpose, which was to get us around quickly. 根据我们的经验，它确实达到了目的，那就是让我们快速通行。 It's just not the cleanest. 只是环境并不算最干净。 The Metro has 16 lines, each with a different color. 地铁有16条线路，每条都有不同的颜色。 The five RER lines are labeled with the letters A B C D E. 5条RER线路分别用字母A、B、C、D、E标注。 RER and metro trains run every day from 6:00 a.m. until half past midnight. RER和地铁列车每天从早上6点运行到午夜半点。 As for tickets, a single journey is 1.90 euro. 至于车票，单程票价是1.90欧元。 We bought a book of 10 for 14.50 euro. 我们买了一本10张的套票，价格是14.50欧元。 Now there are weekly or monthly passes available. 现在也有周卡或月卡可供选择。 But in my opinion, they're just a farce. 但在我看来，这些卡简直是一场闹剧。 We need a passport photo and everything else. 你需要提供护照照片以及其他材料。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678215/dab162e55f594de7b18dc6000cd83ebb.mp3","phrases":[{"en":"getting about on foot","zh":"步行出行"},{"en":"a walk from the Eiffel Tower to Notre Dame","zh":"从埃菲尔铁塔走到圣母院"},{"en":"great public transport links","zh":"便捷的公共交通"},{"en":"split into the metro and RER lines","zh":"分为 metro 和 RER 两条线"},{"en":"Tickets will work across both","zh":"车票两者通用"},{"en":"the Metro has 16 lines","zh":"地铁有 16 条线"},{"en":"day from 6:00 a.m. until half past midnight","zh":"早上 6 点运营到午夜"},{"en":"a single journey is 1.90 euro","zh":"单程票价 1.90 欧"}],"logicPhrases":[{"en":"if → you're strapped for time there are great public transport links","zh":"如果你赶时间，公共交通非常便利"},{"en":"so → can treat it as one big underground network","zh":"所以你可以把它当成一个大型地铁网络"},{"en":"but → in my opinion they're just a farce","zh":"但在我看来，它们不过是场闹剧"}]},{"id":3800,"name":"Trust levels","ref":"Sharing economy platforms are getting Americans to trust each other again. Over the last 40 years, the level of trust in society has fallen quite dramatically but we've developed a heightened level of trust in strangers on digital interface. Every time society has created a new basis for trust, it has expanded the economy dramatically, so this will expand economic activities and possibilities for trade.","ana":"I'm fascinated by the extent to which sharing economy platforms like Uber and Airbnb are getting Americans to trust each other again. 我着迷于像Uber和Airbnb这样的共享经济平台在多大程度上让美国人重新开始彼此信任。 Over the last 40 years, the level of trust in society has fallen quite dramatically. 在过去40年里，社会中的信任水平急剧下降。 Less than 1 in 5 Americans under the age of 35 today feel that people are trustworthy in general. 如今，不到五分之一的35岁以下美国人认为总体上人们是值得信赖的。 But in parallel, we've developed a heightened level of trust in strangers who we meet through a digital interface. 但与此同时，我们对通过数字界面认识的陌生人建立了更高水平的信任。 There's a generation that has grown up reading Yelp reviews, reading Amazon reviews, making their consumption choices based on what strangers on a digital platform say. 有一代人是在阅读Yelp评论、阅读亚马逊评论的环境中成长起来的，他们根据数字平台上陌生人的评价做出消费选择。 And so someone who we interact with who comes accompanied by online reviews, a Facebook and LinkedIn profile, and other digital cues seems to be someone we'll trust at the level of friends and family. 因此，当我们与某人互动时，如果这个人附有在线评论、Facebook和LinkedIn资料以及其他数字线索，我们会倾向于像信任朋友和家人一样信任他们。 What excites me about this transition is that through history every time society has created a new basis for trust, it has expanded the economy dramatically. 让我感到兴奋的是，在历史上，每当社会创造出一种新的信任基础时，它都极大地推动了经济的发展。 So I'm looking forward to seeing, as we trust our Uber drivers more, how this expands the world's economic activities and the possibilities for trade. 因此，我期待看到，随着我们越来越信任Uber司机，这将如何扩大世界经济活动以及贸易的可能性。","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691714/41cb136a16d5432bb3f9f07c63944920.mp3","phrases":[{"en":"sharing economy platforms like Uber and Airbnb","zh":"Uber 和 Airbnb 等共享经济平台"},{"en":"the level of trust has fallen dramatically","zh":"信任水平大幅下降"},{"en":"Less than 1 in 5 Americans under","zh":"35 岁以下不到五分之一"},{"en":"trust in strangers through a digital interface","zh":"通过数字界面信任陌生人"},{"en":"reading Yelp and Amazon reviews","zh":"看 Yelp 和亚马逊评论"},{"en":"online reviews and digital cues","zh":"在线评论和数字线索"},{"en":"trust at the level of friends and family","zh":"像朋友家人一样的信任"},{"en":"a new basis for trust, it has expanded the economy","zh":"新的信任基础扩大经济"}],"logicPhrases":[{"en":"but → in parallel we've developed a heightened level of trust","zh":"但与此同时，我们建立了更高程度的信任"},{"en":"so → someone who we interact with who comes accompanied by online","zh":"所以，与我们互动的人往往也伴随着线上信息"},{"en":"so → I'm looking forward to seeing","zh":"所以我很期待看到"}]},{"id":3793,"name":"Tutorial","ref":"Before tutorials, students need to read articles and write notes. In tutorials, students discuss ideas and give feedback in small groups. It’s easier to get support from the tutors in tutorials because there are fewer students than lectures. Students can improve their skills, teamwork, and confidence in tutorials. In the end, the speaker’s advice is that do the readings before tutorials and be active in tutorials.","ana":"If we need help before the tutorial, we can email any of the tutors and they will provide us with help. 如果我们在课前遇到问题，可以给任何一位导师发邮件寻求帮助，他们会为我们提供支持。 The difference between lectures and tutorials is that in lectures you usually have about 200 to 300 students, whereas in tutorials it's about five to 15 students, 讲座和辅导课的主要区别在于人数：讲座通常有大约200到300名学生参加，而辅导课一般只有5到15人， which allows you to discuss matters, put your hand up and talk to your tutors about any difficulties you may have with the subject. 这种小班教学使你能够讨论问题、举手发言，并向导师请教你在学习中遇到的困难。 The skills that I have developed through participating in these tutorials include time management, critical thinking, being able to work better in a group and improving my confidence to speak up in a group. 通过参与这些辅导课，我培养了时间管理能力、批判性思维能力，提升了小组合作能力和在群体中发言的信心。 At the end of a tutorial, each group will have to give feedback on what they've been discussing throughout the tutorial. 在每节辅导课结束时，每个小组都要对课堂上讨论的内容进行反馈总结， So this may consist of having to present to the rest of the students in the class and it allows me to improve my group working skills 这意味着你需要向全班同学做展示，这有助于提高我的小组协作能力， and also working in a group allows us to generate more ideas and discuss the topic in more depth. 同时小组合作也能激发更多创意，并对主题进行更深入的探讨。 The advice I have for potential University of Edinburgh students to make the most out of your tutorial sessions is to complete the reading that you're given by your tutors beforehand. 我想给未来爱丁堡大学学生的建议是：要想充分利用辅导课的时间，最好提前完成导师布置的阅读任务。 This will enable you to discuss more in groups and generate more ideas. 这样你可以更好地参与小组讨论，提出更多观点。 It's also beneficial to raise your hand and develop your confidence so that you can have better discussions in class. 此外，积极举手发言也有助于增强自信，让你在课堂上拥有更深入的交流体验。","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691721/0dd9b2056b08481093188a6a3dba899c.mp3","phrases":[{"en":"email the tutors for help","zh":"邮件联系导师求助"},{"en":"lectures have 200 to 300 students","zh":"讲座有 200 到 300 名学生"},{"en":"tutorials have five to 15 students","zh":"辅导课有 5 到 15 名学生"},{"en":"skills like time management and critical thinking","zh":"时间管理和批判性思维等技能"},{"en":"work better in a group","zh":"更好的团队合作"},{"en":"improving my confidence to speak up","zh":"提升发言自信"},{"en":"give feedback on the discussion","zh":"对讨论给出反馈"},{"en":"complete the reading beforehand","zh":"提前完成阅读"}],"logicPhrases":[{"en":"if → need help before the tutorial","zh":"如果我们在辅导课前需要帮助"},{"en":"whereas → in tutorials it's about five to 15 students","zh":"而在辅导课上，大约有五到十五名学生"},{"en":"so → consist of having to present to the rest","zh":"所以这可能意味着必须向其他人做展示"},{"en":"so → better discussions in class","zh":"这样你们就能在课堂上更好地讨论"}]},{"id":3801,"name":"Underestimated women","ref":"Women tend to underestimate their own abilities, and they do not negotiate for themselves in the workforce. And most importantly, men attribute their success to themselves and women attribute it to other external factors. In conclusion, it is important for women to understand their own success, and they deserve their success.","ana":"Women systematically underestimate their own abilities. 女性普遍低估了自己的能力。 If you test men and women and you ask them questions on totally objective criteria, like GPAs, men get it wrong slightly high, and women get it wrong slightly low. 如果你对男性和女性进行测试，并请他们根据完全客观的标准（比如平均绩点）来评估自己，男性往往会略微高估自己，而女性则往往会略微低估自己。 Women do not negotiate for themselves in the workforce. 女性在职场中不会为自己争取利益。 A study in the last two years of people entering the workforce out of college showed that 57 percent of boys entering or men, I guess, are negotiating for salary, and only 7 percent of women. 最近两年有一项关于大学毕业生进入职场的研究显示，大约57%的男生或者说男性会在求职时谈判薪资，而只有7%的女性会这么做。 And most importantly, men attribute their success to themselves and women attribute it to other external factors. 最重要的是，男性倾向于将成功归因于自己，而女性则更倾向于将其归因于外部因素。 If you ask men why they did a good job, they'll say, I'm awesome. If you ask, obviously. Why are you even asking? 如果你问男性为什么工作表现很好，他们会说：“我太厉害了。”显然，你问这个问题本身就很奇怪。 If you ask women why they did a good job? What they'll say is someone helped them they got lucky, they worked really hard. 但如果你问女性为什么工作表现好，她们会说：“有人帮了我”、“我只是运气好”或者“我很努力”。 Why does this matter? Boy, it matters a lot. 这有多重要呢？非常重要。 Because no one gets to the corner office by sitting on the side, not at the table, and no one gets the promotion if they don't think they deserve their success, or they don't even understand their own success. 因为没有人能坐在角落里、远离会议桌就坐上高管办公室；如果一个人不认为自己配得上成功，甚至都不理解自己的成功，那也不可能获得晋升。","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691715/7f4a0d79a23c4b87a2a0654184ba1fc2.mp3","phrases":[{"en":"underestimate their own abilities","zh":"女性低估自己的能力"},{"en":"questions on totally objective criteria, like GPAs","zh":"基于 GPA 等客观标准"},{"en":"men get it slightly high, women slightly low","zh":"男性偏高、女性偏低"},{"en":"women do not negotiate for themselves","zh":"女性不为自己谈判"},{"en":"57 percent of men negotiating for salary","zh":"57% 的男性为薪资谈判"},{"en":"only 7 percent of women","zh":"女性只有 7%"},{"en":"men attribute their success to themselves","zh":"男性把成功归因于自己"},{"en":"women attribute it to other external factors","zh":"女性归因于外部因素"}],"logicPhrases":[{"en":"if → test men and women and you ask them questions","zh":"如果你测试男性和女性并向他们提问"},{"en":"if → ask men why they did a good job","zh":"如果你问男性为什么他们工作做得好"},{"en":"if → you even asking","zh":"如果你问，显然，你何必还要问"},{"en":"if → ask women why they did a good job","zh":"如果你问女性为什么她们工作做得好"},{"en":"because → no one gets to the corner office by sitting","zh":"因为没人能靠坐着不动进入高管办公室"},{"en":"if → don't think they deserve their success","zh":"如果她们不认为自己的成功是应得的"}]},{"id":4449,"name":"Vitamin D","ref":"The lecture introduces Vitamin D, known as the \"sunshine vitamin,\" because adequate sunlight eliminates the dietary need for it. Since foods lack natural abundance of Vitamin D, milk is fortified, which may remain insufficient in non-tropical climates. Furthermore, human evolution in tropical regions provides enough sun exposure, but migration to other areas creates a dietary need for Vitamin D due to inadequate sunlight.","ana":"So today we're going to finish talking about the fat-soluble vitamins. 今天我们将结束对脂溶性维生素的讲解。 I'm going to start with Vitamin D. 我将从维生素D开始。 And I think probably most of you know that Vitamin D is called the “sunshine vitamin”. 我想大多数人都知道，维生素D被称为“阳光维生素”。 And it's called that because there's absolutely no dietary need for vitamin D if you get adequate sunshine. 之所以这么称呼，是因为如果你有足够的阳光照射，实际上不需要从饮食中获取维生素D。 And the real important word there is “it” because it turns out that in climates which aren't near the equator there's a big question as to whether or not using these you get adequate sunshine. 这里真正重要的词是“有足够阳光”，因为事实证明，在非赤道地区的气候中，人们是否能获得足够阳光是一个大问题。 And that's important because foods are not naturally abundant in vitamin D. 这很重要，因为食物中天然含有维生素D的量并不多。 And that's why milk is fortified but the fortification may not be enough. 这也是为什么牛奶会被强化维生素D，但这种强化可能仍不足够。 So again just exposure to sunlight is adequate, no need for vitamin D. 因此，仅仅晒太阳就足够了，不需要额外摄入维生素D。 So Vitamin D really isn't the Vitamin, it's a prohormone when human beings evolve, we evolved in tropical climates and ran around naked. 所以维生素D实际上并不是维生素，它是一种前激素。在人类进化过程中，我们生活在热带气候中，赤身裸体地活动。 There was plenty of skin exposure to sunlight and so there was no dietary need for Vitamin D. 皮肤有大量阳光照射，因此不需要从饮食中获取维生素D。 As humans migrated away from that tropical regions, they actually created a need for Vitamin D in food because sunlight was inadequate, particularly during the winter. 当人类从热带地区迁移开时，由于阳光不足，尤其是冬季，饮食中维生素D的需求才真正产生。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693677/d0285a69386540b5a6ef320bc5dd6f7f.mp3","phrases":[{"en":"fat-soluble vitamins","zh":"脂溶性维生素"},{"en":"Vitamin D is called the sunshine vitamin","zh":"维生素 D 被称为阳光维生素"},{"en":"no dietary need if you get adequate sunshine","zh":"阳光充足就无需从饮食摄取"},{"en":"in climates not near the equator","zh":"在远离赤道的气候中"},{"en":"milk is fortified","zh":"牛奶被强化"},{"en":"Vitamin D is a prohormone","zh":"维生素 D 是一种激素原"},{"en":"migration away from tropical regions created a need","zh":"离开热带地区产生了需求"},{"en":"particularly during the winter","zh":"尤其在冬天"}],"logicPhrases":[{"en":"so → today we're going to finish talking about the fat-soluble vitamins","zh":"所以今天我们要讲完脂溶性维生素。"},{"en":"because → there's absolutely no dietary need for vitamin D","zh":"因为膳食中完全不需要维生素D。"},{"en":"if → get adequate sunshine D And the real important word","zh":"如果你有充足的日照，维生素D；而真正重要的词是"},{"en":"because → turns out that in climates which aren't near the","zh":"因为事实证明，在不靠近……的气候中"},{"en":"because → not naturally abundant in vitamin D","zh":"因为食物天然并不富含维生素D。"},{"en":"but → not be enough","zh":"但食品强化可能不够。"},{"en":"so → again just exposure to sunlight is adequate","zh":"所以再说一遍，仅靠晒太阳就足够了。"},{"en":"so → Vitamin D really isn't the Vitamin","zh":"所以维生素D其实并不是那种维生素。"}]}],"rl":[{"id":4278,"name":"A new instrument","ref":"The lecture talks about the Skoog, a new universally accessible musical instrument. It is soft, easy to play, and customizable for anyone, especially children with special needs. Unlike traditional instruments, the Skoog uses software and sensors, so the computer makes the sound. Therefore, it is designed to be touched and played with. It was developed with feedback from kids in schools. This helps them create their own music instead of just listening. 这场讲座讲的是Skoog，一种全新的通用无障碍乐器。它柔软、易于演奏，并且可以为任何人定制，特别是有特殊需要的儿童。与传统乐器不同，Skoog使用软件和传感器，所以由电脑来发出声音。因此，它被专门设计成用于触摸和弹奏。它是在学校孩子们的反馈下开发出来的。这帮助他们创作自己的音乐，而不仅仅是聆听。","ana":"The Skoog is a new universally accessible musical instrument. 斯库格琴是一种新的普遍使用的乐器。 It is designed to use by children or adults with special needs or in fact be used by anyone. 它是为有特殊需要的儿童或成人设计的，实际上任何人都可以使用。 It's soft, it's easy to play, it's robust and it can be customized to suit anyone's abilities. 它柔软，易于演奏，坚固耐用，可以根据任何人的能力进行定制。 The Skoog helps students with special needs by allowing them to get involved in making music themselves. Skoog 帮助有特殊需要的学生，让他们自己参与音乐创作。 It's an instrument that they can play it and they can take ownership of and start creating their own sounds and music. 这是一种他们可以演奏的乐器，他们可以拥有它，开始创造自己的声音和音乐。 Traditional instruments are the shape and size and made of the materials they are because of the sound that they need to make. 传统乐器的形状、大小和材料都是由它们需要发出的声音决定的。 If you want to make a sound like a plucked string, you need a string and it needs to be under tension, whereas with a Skoog, because it's a mixture of software and a sensor, then thus the computer can handle making the sound. 如果你想发出像拨弦一样的声音，你需要一根弦，它需要处于张力之下，而用 Skoog，因为它是软件和传感器的混合体，所以电脑可以处理发出的声音。 And so we can design an object that's designed to be touched and designed to be played with. 所以我们可以设计一个可以触摸和玩耍的物体。 In developing the screen and working with kids in the schools and in the classrooms, it's really helped us make the Skoog something that's usable by the children themselves. 在开发屏幕的过程中，在学校和教室里与孩子们一起工作，这真的帮助我们使 Skoog 成为孩子们自己可以使用的东西。 They've informed us massively on how it needs to work and they've given their opinions on colours and designs. 他们告诉了我们很多关于如何工作的信息，他们对颜色和设计也给出了自己的意见。 And just the feedback they've given to us has been just marvellous. 他们给我们的反馈非常棒。 It's just so enriching and it's really inspiring to actually work with these kids, particularly when you can provide them with an ability to start to playing their own music as opposed to just taking part through listening and listening to other musicians and really learning from them. 和这些孩子一起工作真的很充实，也很鼓舞人心，尤其是当你能让他们有能力开始演奏自己的音乐而不是仅仅通过听其他音乐家的音乐来参与并真正向他们学习时。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693310/601c3a3d0ba241029ae8b342aff1b3c7.mp3","phrases":[{"en":"Skoog is a new universally accessible","zh":"Skoog 是一种新型的、人人可用的乐器"},{"en":"designed to use by children or adults","zh":"设计供儿童或成人使用"},{"en":"customized to suit anyone's abilities","zh":"可根据任何人的能力定制"},{"en":"helps students with special needs","zh":"帮助有特殊需求的学生"},{"en":"take ownership of and start creating","zh":"获得主导权并开始创作"},{"en":"Traditional instruments are the shape and size","zh":"传统乐器的形状和尺寸"},{"en":"mixture of software and a sensor","zh":"软件和传感器的结合"},{"en":"provide them with an ability to start","zh":"让他们有能力开始"}],"logicPhrases":[{"en":"because → of the sound that they need to make","zh":"因为他们需要发出的声音"},{"en":"if → want to make a sound like a plucked string","zh":"如果你想发出像拨弦一样的声音"},{"en":"whereas → with a Skoog because it's a mixture of software","zh":"而使用Skoog时，因为它融合了软件"},{"en":"because → it's a mixture of software and a sensor","zh":"因为它融合了软件和传感器"},{"en":"thus → handle making the sound","zh":"因此计算机可以负责发声"},{"en":"so → can design an object that's designed to be touched","zh":"所以我们可以设计一个专为触摸而设计的物体"},{"en":"so → enriching and it's really inspiring to actually work","zh":"如此充实，真正去做也真的很鼓舞人心"},{"en":"when → can provide them with an ability to start","zh":"当你能让他们有能力开始时"}]},{"id":3370,"name":"A ship","ref":"This lecture talks about human’s civilization, which is a ship driving into the future. Firstly, by understanding the features of the ship, including compass and crew, people should find a wise course without delay. Secondly, the civilization ship is the biggest and the only one in our time. Human’s future depends on the wisdom of our actions. Thirdly, humans make achievements through trial and error like other creatures, but unlike creatures, humans cannot afford errors now. In conclusion, the world is small and humans cannot afford big mistakes. 这个讲座讲的是人类的文明，这是一艘驶向未来的船。首先，通过了解船的特点，包括指南针和船员，人们应该找到一个明智的路线，而不是拖延。第二，这艘文明船是我们这个时代最大的也是唯一的一艘。人类的未来取决于我们行动的智慧。第三，人类像其他生物一样通过试错来取得成就，但与其他生物不同的是，人类现在不能承受错误。总之，世界很小，人类不能犯大错误。","ana":"\"Our civilization, which subsumes most of its predecessors, is a great ship steaming at speed into the future. “我们的文明涵盖了其所有之前的文明，它就像一艘高速驶向未来的巨轮。 It travels faster, further, and more laden than any before. 它比以往任何时候都跑得更快、更远、更重。 We may not be able to foresee every reef and hazard, but by reading her compass bearing and headway, by understanding her design, her safety record, and the abilities of her crew, we can, I think, plot a wise course between the narrows and bergs looming ahead. 我们或许无法预知每一个礁石和危险，但通过解读她的罗盘方位和航速，通过了解她的设计、她的安全记录以及船员的能力，我认为我们能够在这前方的狭窄航道和冰山之间规划出一条明智的航线。 And I believe we must do this without delay, because there are too many shipwrecks behind us. 而且我相信我们必须立即行动，因为身后已经发生了太多的沉船事故。 The vessel we are now aboard is not merely the biggest of all time; it is also the only one left. 我们现在乘坐的这艘船不仅是有史以来最大的；它也是唯一剩下的一个。 The future of everything we have accomplished since our intelligence evolved will depend on the wisdom of our actions over the next few years. 自从我们的智力进化以来，我们所完成的每一件事的未来都将取决于我们在未来几年里行动的智慧。 Like all creatures, humans have made their way in the world so far by trial and error; unlike other creatures, we have a presence so colossal that error is a luxury we can no longer afford. 像所有的生物一样，人类通过不断的尝试和错误在这个世界上取得了成功；与其他生物不同的是，我们的存在是如此巨大，以至于我们再也承受不起错误了。 The world has grown too small to forgive us any big mistakes.\" 这个世界太小了，不能原谅我们犯的任何大错。\"","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690261/591d4fa40876480ab950000b3d3f2ec1.mp3","phrases":[{"en":"a great ship steaming at speed","zh":"一艘高速前进的巨轮"},{"en":"faster, further, and more laden","zh":"更快、更远、负载更多"},{"en":"foresee every reef and hazard","zh":"预见每一处暗礁和危险"},{"en":"plot a wise course","zh":"规划一条明智的航线"},{"en":"too many shipwrecks behind us","zh":"身后有太多沉船"},{"en":"the only one left","zh":"唯一剩下的一艘"},{"en":"wisdom of our actions","zh":"我们行动的智慧"},{"en":"error is a luxury","zh":"犯错是一种奢侈"}],"logicPhrases":[{"en":"but → by reading her compass bearing and headway","zh":"但通过读取她的罗盘方位与航速"},{"en":"because → too many shipwrecks behind us","zh":"因为我们身后有太多沉船"},{"en":"since → depend on the wisdom of our","zh":"既然我们智力的进化将取决于我们……的智慧"},{"en":"so → far by trial and error","zh":"迄今为止靠试错"},{"en":"so → a luxury we can no longer","zh":"如此巨大，以致错误是我们再也无法承受的奢侈"}]},{"id":2551,"name":"A successful entrepreneur","ref":"The lecture mainly talks about good ideas. According to the lecture, a great idea should have several features. Firstly, the great idea should be various and novel. Secondly, the great idea should be unique, which means no one has thought about it. Thirdly, great ideas need to be transformative and productive. Finally, unique ideas are inspired by basic things. 这一讲座主要讲述了伟大创意。根据讲座，一个伟大的创意应该具备几个特点。首先，它应该是多样的和新颖的。其次，它应该是独特的，这意味着没有人曾想到过它。第三，伟大的创意需要兼具变革力量和生产潜力。最后，独特的创意往往受到基本事物的启发。","ana":"To be a successful entrepreneur, you should have good ideas, but the definition of a good idea varies depending on whom you ask. 要成为一名成功的企业家，你需要有好的创意，但“好创意”的定义因人而异。 A great idea should have several features. 一个伟大的创意应具备几个特征。 Firstly, the great idea should be various and novel. 首先，它应该兼具多样性和新颖性 Secondly, the great idea should be unique, which means no one has thought about it. 其次，它应该是独一无二的，也就是说没有人想到过这个点子。 Thirdly, it is essential for great ideas to be transformative and productive. 第三，伟大的创意必须具有变革性和生产性。 All ideas are essentially a combination of other smaller ideas, but this doesn't mean they can't be unique. 所有创意本质上都是由其他小创意组合而成，但这并不妨碍其独特性。 Merely copying doesn't make anything idiosyncratic, it's the individuality that one puts in which makes a concept stand out. 单纯的模仿无法使事物具有其独特性，正是人们注入的个性使一个概念脱颖而出。 Constant innovation leaves no room for stagnation and thus, adds on to the basic idea, effectively making it unique. 不断创新避免了停滞不前，并在基本创意的基础上不断完善，从而赋予其独特性。 Unique ideas are inspired by basic things, they are simply extensions of pre-existing notions. 独特的创意常常源于基本的事物，它们只是对已有观念的延伸。 And, an idea or a concept is unique only when it transcends its predecessor and serves its purpose in a better and more precise way. 只有当某个创意或概念超越前人，并以更优渥、更精准的方式达成目标时，才堪称真正的独特。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678141/0dd508cd6ab24ab1b7a08544d3286531.mp3","phrases":[{"en":"To be a successful entrepreneur","zh":"要成为成功的企业家"},{"en":"definition of a good idea varies","zh":"好主意的定义因人而异"},{"en":"A great idea should have several features","zh":"好主意应具备几个特征"},{"en":"various and novel","zh":"多样且新颖"},{"en":"no one has thought about it","zh":"独特，无人想到过"},{"en":"transformative and productive","zh":"有变革性且富有成效"},{"en":"combination of other smaller ideas","zh":"其他更小想法的组合"},{"en":"transcends its predecessor","zh":"超越其前身"}],"logicPhrases":[{"en":"but → the definition of a good idea varies depending on whom","zh":"但好点子的定义取决于对谁而言"},{"en":"which means → thought about","zh":"这意味着没人考虑过"},{"en":"but → this doesn't mean they can't be unique","zh":"但这并不意味着它们不能独一无二"},{"en":"thus → adds on to the basic idea","zh":"因此是对基本想法的补充"},{"en":"when → transcends its predecessor and serves its purpose in a","zh":"当它超越前身并在某种……中发挥其作用时"}]},{"id":4277,"name":"A survey","ref":"The lecture uses a hypothetical survey to illustrate sampling bias. While 62% of respondents in an online poll chose “Internet” as their primary news source, the survey’s design (conducted on globalandmail.com) means results only reflect heavy Internet users, not the general population. This highlights the critical role of methodology in ensuring valid conclusions. 讲座通过一个假设性调查案例阐释样本偏差问题。尽管在线调查显示62%的受访者将“互联网”作为主要新闻来源，但由于调查仅在globalandmail.com网站进行，结果仅反映重度互联网用户的行为，无法代表整体人群。这凸显了研究方法对结论可靠性的关键影响。","ana":"Let's say if I'm asking which source do you often use to get your information—newspaper? Radio? TV? 假设我问你通常从哪里获取信息——报纸？广播？电视？ The survey shows 62 of the people chose the Internet. 调查显示62%的人选择了互联网。 You might be thinking I’m going to say, how important the Internet is or how quickly it has changed the world for a few years. 你可能会认为我要谈论互联网的重要性，或者它如何在短短几年内迅速改变世界。 But what if I tell you this survey is conducted on the website globalandmail.com? 但如果我告诉你这项调查是在globalandmail.com网站上进行的呢？ Our answer will be different. 我们的结论会完全不同。 Because the people who did this survey on this website must be frequent users of Internet. 因为参与该网站调查的人一定是互联网的重度用户。 This sample is a biased sample. 这是一个有偏差的样本。 So we have to pay attention to how a survey is conducted. 因此，我们必须注意调查的开展方式。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693309/b5696af004094ded8773570f49f357dc.mp3","phrases":[{"en":"which source do you often use","zh":"你经常使用哪个来源"},{"en":"The survey shows 62","zh":"调查显示62"},{"en":"chose the Internet","zh":"选择了互联网"},{"en":"But what if I tell you","zh":"但如果我告诉你"},{"en":"conducted on the website globalandmail.com","zh":"在globalandmail.com网站上进行"},{"en":"must be frequent users of Internet","zh":"必是互联网的频繁使用者"},{"en":"This sample is a biased sample","zh":"这个样本是有偏样本"},{"en":"how a survey is conducted","zh":"调查是如何开展的"}],"logicPhrases":[{"en":"if → I'm asking which source do you often use to get","zh":"如果我问你经常使用哪个来源来获取"},{"en":"but → what if I tell you this survey is conducted","zh":"但如果我告诉你这项调查是在……进行的"},{"en":"if → I tell you this survey is conducted on the website","zh":"如果我告诉你这项调查是在网站上进行的"},{"en":"because → this survey on this website must","zh":"因为在这个网站上做这项调查的人一定……"},{"en":"so → pay attention to how a survey is","zh":"所以我们必须注意一项调查是如何……"}]},{"id":3380,"name":"A survey with 100 CEO","ref":"The lecture mainly talks about a survey with 100 CEO. In the beginning of the lecture, the speaker mentioned that the survey is about which area of activity should contribute most effort. He further discussed that the result from the survey is IT, because IT make a huge influence on our society. And it is time consuming and complex. At the end of the lectures, he concluded that other two are marketing of sales and financial management and they are equally important. 讲座主要讲述了一项针对 100 名 CEO 的调查。讲座一开始，主讲人就提到，这项调查是关于哪个领域的活动应做出最大努力。他进一步谈到，调查的结果是信息技术，因为信息技术对我们的社会影响巨大。而这是一项耗时且复杂的工作。讲座结束时，他总结说，其他两个领域是销售市场和财务管理，它们同样重要。","ana":"In our survey, over a hundred CEOs who had recently been through an acquisition or merger were asked which areas of their activities needed the most effort. 在我们的调研中，我们询问了百余位近期经历过并购交易的首席执行官，了解哪些业务领域最需投入精力。 As you can see, the most frequent response to this question was that information technology requires the most integration effort. 如图所示，最普遍的答复是信息技术需要投入最多的整合精力。 According to 58 of those we surveyed, IT was the most time-consuming and needed the most work. 58位受访者认为IT整合耗时最长、工作量最大。 This is understandable as many of the IT issues are extremely complex and the consequences of any change in IT can have a significant impact. 这完全可以理解，因为诸多IT问题极其复杂，任何IT变更都可能产生重大影响。 The key is how quickly and effectively IT integration can be achieved. 关键在于能否快速高效地完成IT整合。 And there has to be a clear understanding of the consequences there may be of not getting it right. 同时必须清醒认识整合失败的后果。 The two other areas requiring significant attention: sales, marketing and business development on the one hand, and financial management on the other both were selected by 49 of the respondents. 另两个重点领域——销售/营销/业务拓展（49人选择）与财务管理（49人选择）——同样需要高度重视。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690271/a820745fa5fe4298881ec0ead310ca81.mp3","phrases":[{"en":"over a hundred CEOs","zh":"超过一百位CEO"},{"en":"recently been through an acquisition or merger","zh":"最近经历过收购或合并"},{"en":"areas of their activities","zh":"他们的业务领域"},{"en":"information technology requires the most integration effort","zh":"信息技术需要最多的整合工作"},{"en":"58 of those we surveyed","zh":"受访者中有58人"},{"en":"IT issues are extremely complex","zh":"IT问题极其复杂"},{"en":"sales, marketing and business development","zh":"销售、营销和业务发展"},{"en":"financial management","zh":"财务管理"}],"logicPhrases":[{"en":"according to → 58 of those we surveyed","zh":"据58名受访者称"}]},{"id":2553,"name":"Alaska","ref":"The lecture talks about social issues. According to the lecture, native Alaskans are suffering from a lack of mental and emotional well-being. This is because many of the Native Americans are living under poor conditions, and alcohol abuse, domestic violence, homicides, and suicides are frequent among them, which of course, lead to families falling apart. In conclusion, Alaskan natives are losing hold of their communities, cultural identities, and most importantly, their childhoods. 这一讲座讲述了社会问题。根据讲座，阿拉斯加土著人正遭受心理和情感健康的困扰。这是因为许多土著美国人在恶劣生存条件下挣扎，酗酒、家庭暴力、凶杀和自杀在他们当中频繁发生，这当然导致家庭破裂。总之，阿拉斯加土著人正在失去他们的社区、文化身份，以及最重要的童年。","ana":"One of the social issues faced by the state of Alaska is the lack of mental and emotional well-being of the native Alaskans. 阿拉斯加州面临的社会问题之一是原住民的心理和情感健康状况不佳。 It is very unfortunate that many of the Native Americans are living under poor conditions throughout the country. 令人遗憾的是，许多美国原住民在全国各地都生活在恶劣的条件下。 In the cases of native Alaskans, even virtually entire villages are suffering from a lack of mental and emotional well-being, which includes continuing poor physical and mental health. 就阿拉斯加原住民而言，几乎整个村庄都处于心理和情感健康缺失的状态，包括持续的身体和心理健康问题。 Alcohol abuse, domestic violence, homicides, and suicides are frequent among them, which of course, lead to families falling apart. 酗酒、家庭暴力、凶杀和自杀在他们中间很常见，这些自然导致了家庭破裂。 It is tragic to see that many children are abused and not educated properly. 令人悲痛的是，许多儿童遭受虐待，且没有接受良好的教育。 As a matter of fact, the children themselves are abusing alcohol and other chemicals, and the rate is increasing over time. 事实上，这些儿童本身也在滥用酒精和其他化学物质，而且这一比例还在逐渐上升。 Since parents are suffering from mental illnesses and alcohol abuse, they can't take care of their children. 由于父母本身患有精神疾病并滥用酒精，他们无法照顾自己的孩子。 So many children are being taken care of by others or simply neglected. 因此，很多孩子不是被他人抚养，就是遭到忽视。 Therefore, we can conclude that Alaskan natives are losing hold of their communities, cultural identities, and most importantly, their childhoods. 因此，我们可以得出结论：阿拉斯加原住民正在失去他们的社区、文化认同，更重要的是，他们的童年。 So you can see how serious the issue is. 你可以看出这个问题有多严重。 Plus, rather than making a living for themselves, they are depending on public services and subsidies. 此外，他们没有靠自己谋生，而是过度依赖社会福利体系。 They have lost control of and responsibility for their economy and governing institutions. 他们已经失去了对自己经济和治理机构的控制权和自主管理能力。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678139/187d73a6c491475792b6d7fcd6fd0283.mp3","phrases":[{"en":"lack of mental and emotional well-being","zh":"缺乏心理和情绪健康"},{"en":"virtually entire villages are suffering","zh":"几乎整个村庄都在受苦"},{"en":"Alcohol abuse, domestic violence, homicides, and suicides","zh":"酗酒、家庭暴力、凶杀和自杀"},{"en":"lead to families falling apart","zh":"导致家庭破裂"},{"en":"children are abused and not educated properly","zh":"儿童受虐待且未受良好教育"},{"en":"parents are suffering from mental illnesses","zh":"父母患有精神疾病"},{"en":"losing hold of their communities","zh":"失去对社区的掌控"},{"en":"depending on public services and subsidies","zh":"依赖公共服务和补贴"}],"logicPhrases":[{"en":"since → suffering from mental illnesses and alcohol abuse","zh":"由于父母深受精神疾病和酗酒之苦"},{"en":"so → being taken care of by others or","zh":"所以许多孩子正由他人照看，或者"},{"en":"therefore → can conclude that Alaskan natives are losing hold","zh":"因此我们可以得出结论：阿拉斯加原住民正逐渐失去掌控"},{"en":"so → can see how serious the issue is","zh":"所以你能看出这个问题有多严重"}]},{"id":3355,"name":"Animal behavior","ref":"Two fundamental questions about animal behavior are referred to as proximate and ultimate. Proximate questions are those concerned with the mechanisms that bring about behavior. The ultimate questions are those concerned with the evolution of behavior. Two sub-questions are how does the behavior develop, and secondly what causes the behavior. For ultimate, you can ask how did the behavior evolve, and what is the adaptive significance of the behavior. Together these comprise four questions about animal behavior. 关于动物行为有两个基本问题，分别被称为近因问题和远因问题。近因问题关注的是导致行为发生的机制，而远因问题则关注行为的演化。近因问题的两个子问题是：行为是如何发展的？其次，是什么导致了这种行为？对于远因问题，可以问：这种行为是如何演化来的？以及这种行为的适应意义是什么？这四个问题合起来构成了关于动物行为的四个基本问题。","ana":"We can ask two fundamental questions about animal behavior, they referred to as proximate and ultimate. 我们可以对动物行为提出两个基本问题，它们被称为近因问题和远因问题。 Proximate questions are those concerned with the mechanisms that bring about behavior, ultimate questions are those concerned with the evolution of behavior. 近因问题关注的是引起行为的机制，远因问题关注的是行为的演化。 We can divide the proximate and ultimate questions into two sub-questions. 我们可以将近因问题和远因问题分别细分为两个子问题。 For proximate, how does the behavior develop, and secondly what causes the behavior. 对近因问题来说，第一个是行为是如何发展的，第二个是是什么引发了这种行为。 For ultimate, you can ask how did the behavior evolve, and secondly what is the adaptive significance of the behavior, what’s the purpose. 对于远因问题，可以问这种行为是如何演化而来的，以及这种行为的适应性意义是什么，它的目的是什么。 Together these comprise what are called Tinbergen's four questions about animal behavior. 这四个问题合在一起，被称为廷伯根关于动物行为的四个问题。 Niko Tinbergen was one of the founding fathers of the study of animal behavior. 尼科·廷伯根是动物行为学研究的奠基人之一。 These questions represent the different ways of studying animal behavior and understanding the difference between those four questions are fundamental to understanding behavior and indeed the whole of biology. 这些问题代表了研究动物行为的不同方式，理解这四个问题之间的差异对于理解行为本身乃至整个生物学都是根本性的。 How do we study animal behavior well that depends on the type of question we’re hoping to answer. 我们如何研究动物行为，这取决于我们希望解答的是哪种类型的问题。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690244/31209e7b2b0d403b9a04d7ac80861df5.mp3","phrases":[{"en":"two fundamental questions about animal behavior","zh":"关于动物行为的两个基本问题"},{"en":"proximate and ultimate","zh":"近因和终极因"},{"en":"mechanisms that bring about behavior","zh":"引发行为的机制"},{"en":"evolution of behavior","zh":"行为的进化"},{"en":"how does the behavior develop","zh":"行为如何发展"},{"en":"what causes the behavior","zh":"行为的成因是什么"},{"en":"adaptive significance of the behavior","zh":"行为的适应意义"},{"en":"Tinbergen's four questions about animal behavior","zh":"丁伯根关于动物行为的四个问题"}],"logicPhrases":[]},{"id":3348,"name":"Animal behavior V2","ref":"The reason why we study animal behavior is because we are interested in understanding why animals do what they do. Conservation biologists need to know what animals do if they’re going to save them. Fernando started out a research and it led to a complete overhaul of the entire field of neurobiology. And John tells you how fast an afield animal behavior is in his book. There are lots of new developments. 我们研究动物行为的原因是因为我们有兴趣理解动物为何会做出某种行为。保护生物学家如果要拯救动物，就需要知道它们的行为。费尔南多开始了他的研究，并促使了整个神经生物学领域的彻底改革。约翰在他的书中讲述了动物行为领域发展有多么迅速，事实上，这个领域有许多新的进展。","ana":"Why should we bother studying animal behavior? Well, first and foremost, because we are interested in understanding why animals do what they do. 我们为什么要研究动物行为呢？首先，最重要的是，因为我们有兴趣理解动物为什么做它们做的事情。 There are lots of other reasons for studying animal behavior. Conservation biologists need to know what animals do if they’re going to save them. 研究动物行为还有许多其他原因。保护生物学家需要了解动物的行为，以便在拯救它们时作出正确的决策。 Are those animals social or solitary? How much space do they need and how many mates do they have? 这些动物是群居还是独居？它们需要多少空间，有多少伴侣？ Sometimes you can’t predict the outcome of the research. Fernando Nottebohm started out being interested in how birds know what to sing. 有时候你无法预测研究的结果。费尔南多·诺特博姆最初对鸟类如何知道唱什么歌感兴趣。 Yet his research eventually led to a complete overhaul of the entire field of neurobiology, a totally unanticipated yet utterly monumental effect. 然而，他的研究最终导致了神经生物学整个领域的彻底变革，这一结果完全是意料之外的，却具有极其深远的影响。 And this is the course textbook by John Alcock the fact that this is in its ninth edition tells you how fast an afield animal behavior is. 这是约翰·阿尔科克（John Alcock）编写的课程教材，此书已更新至第九版，足见动物行为学这一领域发展之迅猛 There are lots of new developments. 这个领域有许多新的发展。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690235/5e1b588016bb4a6792d1a71d6366e8f7.mp3","phrases":[{"en":"studying animal behavior","zh":"研究动物行为"},{"en":"why animals do what they do","zh":"动物为何如此行事"},{"en":"Conservation biologists need to know","zh":"保护生物学家需要知道"},{"en":"social or solitary","zh":"群居还是独居"},{"en":"can’t predict the outcome","zh":"无法预测结果"},{"en":"Fernando Nottebohm started out","zh":"费尔南多·诺特博姆起初"},{"en":"complete overhaul of the entire field","zh":"整个领域的彻底变革"},{"en":"lots of new developments","zh":"许多新进展"}],"logicPhrases":[{"en":"because → are interested in understanding why animals do what","zh":"因为我们想了解动物为何会这样做"},{"en":"if → they’re going to save them","zh":"如果他们想要拯救它们"},{"en":"yet → his research eventually led to a complete overhaul of the","zh":"然而他的研究最终促成了对……的彻底改革"},{"en":"yet → utterly monumental effect And this is the course textbook","zh":"然而影响极其重大，而这就是课程教材"}]},{"id":4282,"name":"Architecture","ref":"The lecture discusses Napoleon III's grand projects to transform Paris in the 1850s. He wanted to be like Emperor Augustus, turning a city of cobblestones into one of asphalt. He replaced old medieval streets with 85 miles of wide new boulevards. These were lit by 20,000 gas lamps and lined with 50,000 trees. He also built 200 miles of sewers. As a result, Paris became a much safer and more pleasant place for people to stroll and enjoy café life. 这场讲座讨论了拿破仑三世在19世纪50年代改造巴黎的宏伟工程。他想效仿奥古斯都皇帝，将一座鹅卵石城市变成沥青城市。他用85英里宽阔的新大道取代了古老的中世纪街道。这些大道由2万盏煤气灯照明，并种植了5万棵树。他还修建了200英里的下水道。因此，巴黎变成了一个更安全、更宜人的地方，供人们漫步和享受咖啡馆生活。","ana":"The most visible manifestation of this wealth was a series of grand projects begun by Napoleon III, mainly in Paris. 这种财富最显著的体现，是拿破仑三世启动的一系列宏伟工程，这些工程主要集中在巴黎。 Soon after he came to power in the 1850s, he said, “I want to be a second Augustus,” making reference to the Emperor Augustus's claim that he'd found Rome a city of brick and left it one of marble. 19 世纪 50 年代他掌权后不久便表示：“我要成为第二个奥古斯都。” 他这里指的是奥古斯都皇帝曾宣称自己接手罗马时，罗马还是一座砖城，而他离开时，罗马已成为一座大理石之城。 In the case of Napoleon III, he found Paris in 1851 a city of cobblestones and twisting medieval streets, and he left it one of asphalt and macadam. 对于拿破仑三世而言，1851 年他接手的巴黎是一座遍布鹅卵石、中世纪小巷蜿蜒交错的城市，而他离开时，巴黎已变成一座以沥青和碎石为路面的城市。 Because what he began doing was bulldozing Old Paris—the ancient, medieval part of Paris—and replacing it with wide new boulevards: 85 miles of them, which he lit with some 20,000 gas lamps (which took out all the old 18th-century oil lamps, replacing them with gas, which gave a much cleaner, brighter, regular light). 因为他着手拆除旧巴黎 —— 也就是巴黎古老的中世纪区域 —— 并用宽阔的新林荫大道取而代之：这些大道总长 85 英里，他用约 2 万盏煤气灯为其照明（这些煤气灯取代了所有老式 18 世纪油灯，煤气发出的光线更洁净、更明亮且更稳定）。 Also, 50,000 trees are planted alongside them—many of them the chestnut trees that we now think of as synonymous with Paris. 此外，大道旁还栽种了 5 万棵树 —— 其中不少是栗子树，如今在我们眼中，栗子树已成为巴黎的代名词之一。 And he drained the streets with 200 miles of sewers: these new, famous Parisian sewers beneath the streets, thereby making the city a much safer, more pleasant place to wander, to stroll, to people-watch, to have coffee or absinthe in the cafés. 他还修建了 200 英里的下水道来疏通街道：这些全新且闻名的巴黎下水道位于街道下方，由此让这座城市成为更安全、更宜人的地方 —— 人们可以在此漫步、闲逛、观察行人，或是在咖啡馆里喝咖啡、品苦艾酒。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693314/c2d49812f36444ef99f493891523c914.mp3","phrases":[{"en":"grand projects begun by Napoleon III","zh":"拿破仑三世启动的宏大工程"},{"en":"mainly in Paris","zh":"主要集中在巴黎"},{"en":"I want to be a second Augustus","zh":"我想成为第二个奥古斯都"},{"en":"bulldozing Old Paris","zh":"推平旧巴黎"},{"en":"wide new boulevards","zh":"宽阔的新林荫大道"},{"en":"lit with some 20,000 gas lamps","zh":"用约两万盏煤气灯照明"},{"en":"50,000 trees are planted alongside them","zh":"沿路种植五万棵树"},{"en":"200 miles of sewers","zh":"200英里的下水道"}],"logicPhrases":[{"en":"because → what he began doing was bulldozing Old Paris","zh":"因为他开始做的就是铲平旧巴黎"}]},{"id":3349,"name":"Arctic and Antarctic","ref":"The lecture mainly talks about the polar regions, including Arctic and Antarctic. Moreover, they located at the top and bottom of the earth, and so the Arctic was named after the Greek word for bear. The lecture also mentions that now the Greek hypothesize that there would be the Anti-arctic, and these regions are opposite in many ways other than just their names and their location. Finally, the speaker mentions that the north pole isn’t on land, but it is one big ocean. 本讲座主要探讨了位于地球两端的极地地区——北极与南极。这两片区域分别坐落于地球的顶端与底端，其中\"北极\"的名称源于希腊语中的\"熊\"一词。讲座还提到，根据古希腊人的推测，应当存在一个与北极相对的区域，即\"南极\"。这两个地区除了名称和地理位置相对之外，在许多其他方面也呈现出对立特征。最后，讲者特别指出北极点并非位于陆地上，而是一片广阔的海洋。","ana":"So, when we talk about the polar regions, just to clarify exactly what we mean. 那么，当我们谈论极地地区时，为了澄清我们到底是什么意思。 And we have first of all the Arctic at the top of the earth and the Antarctic at the bottom, 首先，我们有地球顶端的北极和底端的南极， and so the Arctic was named after the Greek word for bear. 因此，北极这个名字来源于希腊语中的“熊”一词。 Now surprisingly it’s not after the polar bears that live in the Antarctic or live in the Arctic and based on it’s after the little and great bear constellations that can be seen in the sky. 令人惊讶的是，这个名字并不是为了北极熊或南极熊，而是来源于天空中可以看到的小熊座和大熊座星座。 Now the Greeks also hypothesize that there would be the Anti-arctic, which is how we get the name Antarctica and of course it wasn’t discovered until much later on. 希腊人还假设会有一个“反极地”，这就是我们得到“南极”这一名称的由来，当然，直到后来才被发现。 Now these regions are opposite in many ways other than just their names and their location on the globe, 现在，这些地区在许多方面与仅仅在名称和地球上的位置不同， and so if we look at the Arctic first of all, and the Arctic is actually ocean surrounded by land, 所以如果我们首先看看北极，北极实际上是被陆地包围的海洋， and so you can see here this is the UK down here and this kind of Russia and then American Canada around here, 你可以看到这里是英国在下方，这边是俄罗斯，然后是美洲和加拿大在这儿， and so there is a bit of land cover in our ice on the top in the Arctic, which is Greenland here and Macie all this area here. 因此，在北极的冰层上面有一些土地覆盖，比如格陵兰岛以及这一片地区。 Surprisingly a lot of people don’t realize that this isn’t actually land. The north pole isn’t on land. It’s just one big ocean. 令人惊讶的是，很多人并没有意识到北极并不在陆地上。北极只是一个巨大的海洋。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690237/2e62defb91714f708f773dc24b6a5fd3.mp3","phrases":[{"en":"when we talk about the polar regions","zh":"谈到极地地区时"},{"en":"Arctic at the top","zh":"北极在地球顶部"},{"en":"Antarctic at the bottom","zh":"南极在地球底部"},{"en":"named after the Greek word for bear","zh":"得名于希腊语中的“熊”"},{"en":"how we get the name Antarctica","zh":"南极洲这个名字的由来"},{"en":"these regions are opposite","zh":"这些地区截然相反"},{"en":"Arctic is actually ocean surrounded by land","zh":"北极其实是被陆地包围的海洋"},{"en":"north pole isn't on land","zh":"北极点不在陆地上"}],"logicPhrases":[{"en":"so → talk about the polar regions","zh":"那么，当我们谈到极地地区时"},{"en":"when → talk about the polar regions","zh":"当我们谈到极地地区时"},{"en":"so → named after the Greek word for bear","zh":"那么，北极是以希腊语中表示“熊”的词命名的"},{"en":"so → look at the Arctic first of all","zh":"那么，如果我们先来看北极"},{"en":"if → look at the Arctic first of all","zh":"如果我们先来看北极"},{"en":"so → can see here this is the UK down here","zh":"那么，你可以看到，这下面就是英国"},{"en":"so → a bit of land cover in our ice","zh":"那么，我们的冰层中有一点陆地覆盖"}]},{"id":3365,"name":"Aristotle","ref":"The lecture explains Aristotle’s view on rhetoric. He argues that rhetoric is necessary because most people can’t grasp abstract truth directly. Truth is like a soul—intangible and universal—while rhetoric acts as the body or tool to present it. According to Aristotle, only educated individuals can understand truth independently. For the general public, who are irrational or easily confused, persuasion techniques like stories or simplified ideas are needed to guide them toward truth. 讲座解释了亚里士多德的修辞学观点。他认为修辞是必要的，因为大多数人不能直接掌握抽象的真理。真理就像灵魂，无形而普遍，而修辞则是呈现它的身体或工具。亚里士多德认为，只有受过教育的人才能独立地理解真理。对于不理性或容易迷惑的普通大众来说，需要故事或简化想法等说服技巧来引导他们走向真理。","ana":"But Aristotle says the reason we need rhetoric is we have to be able to use it. 亚里士多德认为，我们之所以需要修辞学，是因为我们必须能够运用它。 We have to be able to use rhetoric influence, basically, the rebel, and the morons. 我们必须能够运用修辞来影响那些叛逆者和愚人。 We try to get them to understand truth. 我们要努力让他们理解真理。 Truth is suggested, is different than rhetoric. 真理是暗示，不同于修辞。 Rhetoric is the dressing, is the body, right? 修辞就像是外在的包装，是身体的部分，对吧？ Truth is the spirit, is the soul, is abstract. It doesn't have a body. It's not particular. 而真理则是精神层面的，是灵魂的，是抽象的。它没有实体，也不是具体的。 If you wanna get somebody to the truth, you might have to use some kind of tricks. Right? 如果你想让某人明白真相，你可能得用一些手段。 Because most people are not sound and can't see the truth. 因为大多数人并非理智且无法看清真相。 That's what we think. Most people are ramble. 这就是我们的看法。大多数人会胡言乱语。 Really. Only the educated be erudite are actually capable of seeing the truth. 只有受过良好教育、博学的人才能真正看清真相。 If you wanna get the general mass there, you may have to do fable a little bit. So Aristotle that is rhetoric. 如果你想让普通大众明白真相，你可能得稍微运用一些寓言之类的手段。这就是亚里士多德所说的修辞学。 Rhetoric is something that is used to influence people. Right? And it's a kind of mentally promised a logic. 修辞学是用来影响人的。对吧？它是一种在精神层面上做出逻辑承诺的东西。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690256/f1c59e5851b7491da9ac0f485d6c5265.mp3","phrases":[{"en":"Aristotle says the reason we need rhetoric","zh":"亚里士多德说我们需要修辞的原因"},{"en":"be able to use it","zh":"能够使用它"},{"en":"get them to understand truth","zh":"让他们理解真理"},{"en":"Rhetoric is the dressing, is the body","zh":"修辞是外衣，是躯体"},{"en":"Truth is the spirit, is the soul","zh":"真理是精神，是灵魂"},{"en":"use some kind of tricks","zh":"使用某种技巧"},{"en":"most people are not sound","zh":"大多数人并不健全/不理智"},{"en":"used to influence people","zh":"用来影响人们"}],"logicPhrases":[{"en":"but → Aristotle says the reason we need rhetoric is we","zh":"但亚里士多德说，我们需要修辞学，是因为我们拥有"},{"en":"if → wanna get somebody to the truth","zh":"如果你想让某人认识真理"},{"en":"because → not sound and can't see the truth","zh":"因为大多数人并不健全，看不清真理"},{"en":"if → wanna get the general mass there","zh":"如果你想让普通大众也到达那里"},{"en":"so → rhetoric","zh":"所以亚里士多德说，那就是修辞学；修辞学是一种被使用的东西"}]},{"id":3376,"name":"Australian city","ref":"This lecture talks about Australia. According to the speaker, he has mentioned some points of view. Australia’s location is important for the world’s export. Its international trade is also important. Since Australia has a broad territory. The Australian people are mainly living in 5 cities which are Melbourne, Sydney, Brisbane, Perth and so on. Perth is one of the most isolated city in the world and there are two leading companies such as Telstra and Qantas which are based in Perth. 本讲座的主题是澳大利亚。演讲者提到了一些观点。澳大利亚的地理位置对世界出口非常重要。其国际贸易也很重要。澳大利亚幅员辽阔。澳大利亚人主要居住在墨尔本、悉尼、布里斯班、珀斯等五个城市。珀斯是世界上最偏僻的城市之一，有两家领先的公司，如 Telstra 和 Qantas 都设在珀斯。","ana":"Australia's location is important for the world's export, and its international trade is also very important. 澳大利亚的地理位置对全球出口至关重要，其国际贸易也具有重要地位。 Since Australia has a broad territory, all towns are scattered around. 由于澳大利亚幅员辽阔，城镇分布十分分散。 There is a huge expense for transportation for trains and ferries. 铁路与轮渡运输需要巨额开支。 The government also pays large amount for its telecommunication to build up the connection among regions. 政府还需投入大量资金建设跨区域通信网络。 The Australian people are mainly living in five cities, and they are Melbourne, Sydney, Perth, Brisbane and so on. 澳大利亚人口主要集中在五大城市：墨尔本、悉尼、珀斯、布里斯班等。 The most special one is Perth, which is one of the most isolated cities in the world. 其中最特殊的是珀斯——全球最与世隔绝的城市之一。 However, this does not affect its status to be the largest city in Australia. 但这并不影响其作为澳大利亚最大城市的地位。 Most large companies, like the two leading companies, Telstra and Qantas, are all based in Perth. 包括两大龙头企业澳洲电信（Telstra）和澳洲航空（Qantas）在内，多数大公司总部都设在珀斯。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690267/3549e9fd5cc44347879277505f8a533a.mp3","phrases":[{"en":"Australia's location is important","zh":"澳大利亚的位置很重要"},{"en":"international trade is also very important","zh":"国际贸易也很重要"},{"en":"huge expense for transportation","zh":"交通开支巨大"},{"en":"government also pays large amount","zh":"政府也支出大量资金"},{"en":"mainly living in five cities","zh":"主要居住在五个城市"},{"en":"most special one is Perth","zh":"最特别的是珀斯"},{"en":"most isolated cities in the world","zh":"世界上最与世隔绝的城市"},{"en":"Telstra and Qantas, are all based in Perth","zh":"澳洲电信和澳航设在珀斯"}],"logicPhrases":[{"en":"since → a broad territory","zh":"由于澳大利亚幅员辽阔"},{"en":"so → on","zh":"所以，其中最特别的是珀斯"},{"en":"however → not affect its status to be the largest","zh":"然而，这并不影响其最大地位"}]},{"id":1593,"name":"Baby brain","ref":"The lecture is about babies and how they learn. When a baby is born, its brain is already relatively large and the baby immediately starts learning. It has to learn many skills, such as talking, walking, and playing. It can't do these things until it has watched and listened to someone doing them many times. There are important moments for parents of young babies like the first smile at about six weeks and starting to walk after about 9 months. 讲座是关于婴儿以及他们如何学习的。当婴儿出生时，它的大脑已经相对较大，婴儿立即开始学习。它必须学习许多技能，如说话、走路和玩耍。它不能做这些事情，直到它多次观察和听取别人做这些事情。对于年幼婴儿的父母来说，有一些重要的时刻，比如大约六周时的第一次微笑，大约九个月后开始走路。","ana":"When a baby is born, its brain is already a quarter of its final size. 当婴儿出生时，它的大脑已经是其最终大小的四分之一。 But when does a baby start to learn? 宝宝什么时候开始学习呢？ Well, experts believe that a baby is learning even before it is born. 专家认为，婴儿甚至在出生前就在学习。 When it is born, though, it will start learning very quickly, much more quickly than an adult. 然而，当它出生时，它会开始很快地学习，比成年人快得多。 At the beginning, the baby listens and watches all the skills being performed that it needs to learn, such as speaking, walking, playing, eating, and singing. 在一开始，婴儿会听并观察所有需要学习的技能，如说话、走路、玩耍、吃饭和唱歌。 Some parents think that their baby isn't learning, but it is. 一些父母认为他们的宝宝没有在学习，但它确实在学习。 The baby has to watch and listen to something many times before it can do that thing. 婴儿必须多次观看和聆听某个东西，才能做到那件事情。 For parents, an exciting moment is their baby's first smile. 对于父母来说，激动人心的时刻是宝宝的第一个微笑。 This happens at around 6 weeks old. 这发生在大约6周大的时候。 Another important moment is when baby takes its first step. 另一个重要的时刻是宝宝迈出第一步的时候。 The earliest this can happen is when the baby is about 9 months old. 这最早可能发生在婴儿大约9个月大的时候。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658434/ad4d1cf9de4949dfa7f2015a04d8c323.mp3","phrases":[{"en":"its brain is already a quarter","zh":"它的大脑已有四分之一"},{"en":"learning even before it is born","zh":"甚至在出生前就在学习"},{"en":"start learning very quickly","zh":"开始学得非常快"},{"en":"listens and watches all the skills","zh":"听并观察所有技能"},{"en":"baby's first smile","zh":"婴儿第一次微笑"},{"en":"around 6 weeks old","zh":"大约6周大时"},{"en":"baby takes its first step","zh":"婴儿迈出第一步"},{"en":"about 9 months old","zh":"大约9个月大时"}],"logicPhrases":[{"en":"when → born its brain is already a quarter","zh":"婴儿出生时，大脑已有成人的四分之一"},{"en":"but → does a baby start to learn","zh":"但婴儿什么时候开始学习？"},{"en":"when → does a baby start to learn","zh":"婴儿什么时候开始学习？"},{"en":"when → is born though it will start learning very quickly","zh":"不过，婴儿一出生就会很快开始学习"},{"en":"though → will start learning very quickly","zh":"不过它会很快开始学习"},{"en":"but → to watch and listen","zh":"但事实是，婴儿必须观察和倾听"},{"en":"when → baby takes its first step","zh":"当婴儿迈出第一步时"},{"en":"when → about 9 months old","zh":"当婴儿大约9个月大时"}]},{"id":3368,"name":"Bees talks","ref":"Bees perform this strange ritual when they encounter aggressive rival bees, for example, or predatory spiders hanging out at favored foraging spots. When they return to the hive, they headbutt hive mates performing the famous “waggle dance” that directs would-be foragers to rich sources of nectar. By halting their hive mates mid-dance, the scouting bees save them from perilous excursions. 例如，当蜜蜂遇到有攻击性的对手蜜蜂或在自己喜欢的觅食地点闲逛的掠食性蜘蛛时，它们就会进行这种奇怪的仪式。当它们回到蜂巢时，它们会用头撞着蜂巢同伴，表演著名的“摇摆舞”，引导潜在的觅食者找到丰富的花蜜来源。通过阻止正在跳舞的同伴，侦察的蜜蜂将他们从危险的短途旅行中解救出来。","ana":"Honey bees do a waggle dance to direct other bees to the sources of nectar. 蜜蜂通过摇摆舞来引导其他蜜蜂找到花蜜的来源。 The dancing bees like this one can be halted by a headbutt from another bee. 像这样正在跳舞的蜜蜂可能会被另一只蜜蜂的头部撞击而停止舞蹈。 Now research has found that this headbutt is actually a warning signal. 现在研究发现，这种头部撞击实际上是一种警告信号。 A feeding station was set up in the lab to mimic a source of nectar, then foraging bees were introduced to the dangers at the station, such as competition from rival colonies. 在实验室里设置了一个喂食站来模拟花蜜的来源，然后将觅食的蜜蜂引入到这个站的危险环境中，比如来自敌对蜂群的竞争。 When foragers returned to the hive they stopped bees dancing. 当觅食蜂返回蜂巢时，它们会停止跳舞。 Scientists think the behaviour warns dancers of a dangerous source of nectar. 科学家们认为这种行为是在向跳舞的蜜蜂发出危险花蜜来源的警告信号。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690259/8630016574f74b9b8f3e6747724e45a6.mp3","phrases":[{"en":"Honey bees do a waggle dance","zh":"蜜蜂跳摇摆舞"},{"en":"direct other bees","zh":"指引其他蜜蜂"},{"en":"sources of nectar","zh":"花蜜来源"},{"en":"halted by a headbutt","zh":"被头撞打断"},{"en":"actually a warning signal","zh":"其实是一种警告信号"},{"en":"feeding station was set up","zh":"设立了喂食站"},{"en":"competition from rival colonies","zh":"来自敌对蜂群的竞争"},{"en":"warns dancers of a dangerous source","zh":"警告舞者存在危险来源"}],"logicPhrases":[{"en":"when → foragers returned to the hive they stopped bees dancing","zh":"当觅食蜂返回蜂巢时，它们让蜜蜂停止了跳舞"}]},{"id":4279,"name":"Bilingual kids","ref":"The lecture discusses concerns about raising children bilingually, especially during preschool years. Many believe infants’ brains are inherently monolingual, leading parents to worry that hearing two languages at home might confuse their child. To reduce confusion, each parent can consistently uses one language. This helps children associate each language with a specific speaker. 讲座讨论了双语抚养孩子的问题，特别是在学龄前时期。许多人认为婴儿的大脑天生是单语的，这导致父母担心在家里听到两种语言可能会让他们的孩子感到困惑。为了减少混淆，每个家长可以始终使用一种语言。这有助于孩子们将每种语言与特定的说话者联系起来。","ana":"The arising concern that a lot of people have about raising children bilingually, especially the preschool year is based on the conceptualization that the human brain at birth is essentially monolingual. 许多人对双语抚养孩子，尤其是学龄前儿童的担忧是基于这样一种观念，即人类出生时的大脑本质上是单语的。 And the reason why come to this occasion. 也是我来到这个场合的原因。 Because often the parents will ask me if they use two languages at home will their child be confused, because they hearing two languages. 因为父母经常会问我，如果他们在家里使用两种语言，他们的孩子会不会感到困惑，因为他们听到的是两种语言。 And parents often ask my advice about whether they should use one language on parent role which is widely known that parents who are raising children bilingually. 家长们还会经常向我咨询，他们是否应该在家长的角色中只使用一种语言，这是众所周知的，即那些同时教孩子两种语言的家长的做法。 And the reason why most people think this is a good idea is that it will help to reduce the risks of the children being confused. Because they were able to associate each language with the separate speaker. 大多数人认为这是一个好主意，是因为这有助于降低孩子感到困惑的风险。因为孩子们能够将每种语言与不同的说话者联系起来。 The fear is that both parents use both languages, especially they use both languages interchangeable within the same conversation within the same sentences. The child will not be able to separate the languages. 而人们担心的是，如果父母同时使用两种语言，尤其是在同一段对话或同一句话中交替使用两种语言，孩子将无法区分这两种语言。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693311/8b26cdc9a4e449cab876248cbb81c953.mp3","phrases":[{"en":"raising children bilingually","zh":"双语养育孩子"},{"en":"human brain at birth is essentially m
