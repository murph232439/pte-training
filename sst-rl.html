bs. 跳蚤与瘟疫，原子与核弹。 Diminutive leaders in world history. 世界历史上的那些微小却关键的人物。 Soot is one of these little things. 烟灰（黑碳）就是这些微小事物之一。 Soot also known as black carbon is released when you burn dung, coal, diesel fuel and wood. 烟灰，也被称为黑碳，是在燃烧粪便、煤炭、柴油和木材时释放的。 From Los Angeles to Mumbai, soot causes respiratory illnesses like lung cancer and asthma and contributes to one point six million premature deaths every year. 从洛杉矶到孟买，烟灰会导致肺癌和哮喘等呼吸道疾病，并每年造成160万人过早死亡。 Mostly among the poor. 这些死亡案例大多发生在贫困人群中。 And it gets worse. 情况还会更糟。 Atmospheric currents carry soot thousands of miles from where it is produced, to the Himalayas and the Arctic. 大气环流会将烟灰从产生地携带数千英里，到达喜马拉雅山脉和北极地区。 Black carbon being black, absorbs sunlight, so even a little soot on snow makes it melt faster. 由于黑碳是黑色的，它会吸收阳光，因此即使雪上有一点点烟灰也会加速其融化。 And when snow melts global sea levels rise, threatening our freshwater indigenous communities and polar bears who hunt on the Arctic ice. 当雪融化时，全球海平面上升，威胁到我们的淡水、土著社区以及在北极冰上狩猎的北极熊。 Climate Change has been a big thing for a while and carbon dioxide has been its main cause. 气候变化已经是一个长期的重大问题，而二氧化碳一直是其主要成因。 Scientists estimate that soot causes twenty five percent of human-caused global warming. 科学家估计，烟灰导致了25%的人为全球变暖。 It's the second leading cause of Arctic warming after carbon dioxide. 它是继二氧化碳之后导致北极变暖的第二大因素。 Let's not underestimate the impact of this tiny particle. 我们不应低估这种微小颗粒的影响。 But there's good news, reducing black carbon may be the fastest way to slow global warming. 但有个好消息：减少黑碳可能是减缓全球变暖的最快方法。 Buy time for the Arctic. 为北极争取时间。 Yes even more so than changing a light bulb. 是的，甚至比更换节能灯泡更有效。 Since black carbon only stays in the atmosphere for a couple of weeks, reducing it will produce results immediately. 由于黑碳在大气中仅存留几周时间，减少它会立即产生效果。 Of course, reducing soot alone won't solve global warming, but solving our soot problem now will help buy time for the Arctic and allow us to deal with the bigger problem of carbon dioxide. 当然，仅靠减少烟灰并不能解决全球变暖问题，但解决当前的烟灰问题将为北极争取时间，并让我们能够应对更大的二氧化碳问题。 We have the cleaner industries,cook stoves,and diesel now we have to use them. 我们现在拥有更清洁的工业、炉灶和柴油技术，现在必须使用它们。 In developed nations, we've significantly reduced our black carbon, but we still have much more to do. 在发达国家，我们已经大幅减少了黑碳排放，但我们仍需付出更多努力。 We need to tighten our standards at home and invest in cleaner technologies in developing nations. 我们需要在国内外提高标准，并投资发展中国家的清洁技术。 But if you urge the US government and the European Union to take the lead on black carbon reduction, 但如果你能敦促美国政府和欧盟在减少黑碳排放方面发挥带头作用， you can make a big difference. 你就能产生巨大的影响。 Go to www. stopsoot. org 访问www.stopsoot.org网站 And help stop these little things from causing big trouble. 并帮助阻止这些微小的事物引发巨大的麻烦。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690250/05ba74a3fd0647f4991b061ba46b44d2.mp3","phrases":[{"en":"Soot is one of these little things","zh":"烟尘是这些小事物之一"},{"en":"Soot also known as black carbon","zh":"烟尘又称黑碳"},{"en":"burn dung, coal, diesel fuel and wood","zh":"燃烧粪便、煤炭、柴油和木材"},{"en":"one point six million premature deaths","zh":"一百六十万例过早死亡"},{"en":"Atmospheric currents carry soot thousands of miles","zh":"大气气流将烟尘携带数千英里"},{"en":"twenty five percent of human-caused global warming","zh":"人为全球变暖的百分之二十五"},{"en":"fastest way to slow global warming","zh":"减缓全球变暖的最快方法"},{"en":"Buy time for the Arctic","zh":"为北极争取时间"}],"logicPhrases":[{"en":"when → burn dung coal diesel fuel and wood","zh":"当你燃烧粪便、煤炭、柴油和木材时"},{"en":"so → even a little soot on snow makes it melt faster","zh":"所以，雪上哪怕有一点煤烟，也会让它融化得更快"},{"en":"when → snow melts global sea levels rise","zh":"当雪融化时，全球海平面会上升"},{"en":"while → been its main cause","zh":"而二氧化碳一直是其主要原因"},{"en":"but → there's good news reducing black carbon may be the fastest","zh":"但好消息是，减少黑碳可能是最快的办法"},{"en":"so → than changing a light bulb","zh":"所以，比换灯泡还快"},{"en":"since → black carbon only stays in the atmosphere for a couple","zh":"因为黑碳只在大气中停留几周"},{"en":"but → solving our soot problem now will help buy time","zh":"但现在解决我们的煤烟问题将有助于争取时间"}]},{"id":1595,"name":"Start in university","ref":"The lecture tells new students at university what they should do. The speaker says that students should go to lectures, but if they can't go to one, they can see a video of it online. It's better to go to lectures and take notes, though, because taking notes can help students remember important things from the lectures. 讲座告诉大学新生他们应该做什么。演讲者说学生应该去听课，但如果他们不能去听课，他们可以在网上看到讲座的视频。最好去听课并记笔记，因为记笔记可以帮助学生记住讲座中重要的事情。","ana":"As a new student, there are many things that you can do to get a good start at university. 作为一名新学生，你可以做很多事情来在大学里有一个良好的开端。 Attending lectures is something that we expect all students to do. 听课是我们期望所有学生都要做的事情。 If you miss a lecture though, or didn't quite understand the topic, or simply want to hear it again, you can watch a video recording of the lecture online. 如果你错过了一场讲座，或者不太理解这个话题，或者只是想再听一遍，你可以在线观看讲座的视频录像。 However, university life is very busy and you won't have much time, so it's better to concentrate and take good notes when you do attend a lecture. 然而，大学生活非常忙碌，你没有太多时间，所以当你参加讲座时，最好集中注意力并做好笔记。 If you make notes, it helps you to think about the important facts and ideas in the lecture, and writing these things down can help you to remember them again. 如果你做笔记，它可以帮助你思考讲座中的重要事实和想法，把这些东西写下来可以帮助你再次记住它们。 There may be lecture notes available online, but making your own notes is much more valuable. 网上可能有课堂讲稿，但自己做笔记更有价值。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658436/87636b245c2a44cd8f7ee27a931e3f31.mp3","phrases":[{"en":"get a good start at university","zh":"在大学有一个好的开始"},{"en":"Attending lectures","zh":"参加讲座"},{"en":"miss a lecture","zh":"错过讲座"},{"en":"watch a video recording","zh":"观看视频录像"},{"en":"university life is very busy","zh":"大学生活非常忙碌"},{"en":"concentrate and take good notes","zh":"集中注意力并做好笔记"},{"en":"important facts and ideas","zh":"重要的事实和观点"},{"en":"your own notes is much more valuable","zh":"自己做的笔记更有价值"}],"logicPhrases":[{"en":"if → miss a lecture though","zh":"不过，如果你缺了一节课"},{"en":"though → or didn't quite understand the topic","zh":"或者没太理解这个主题"},{"en":"however → very busy and you won't have much","zh":"然而大学生活非常忙碌，你不会有太多时间"},{"en":"so → it's better to concentrate and take good notes","zh":"所以最好专心听讲，好好记笔记"},{"en":"when → do attend a lecture","zh":"当你真的去听课时"},{"en":"if → make notes it helps you to think about the","zh":"如果你记笔记，有助于你思考所学内容"},{"en":"but → making your own notes is much more valuable","zh":"但自己记笔记要有价值得多"}]},{"id":4280,"name":"Stem cells","ref":"The lecture talks about stem cells. They are undifferentiated cells without specific functions. However, they have the potential to become all other kinds of cells to replace worn-out cells. Scientists hope to use them for regenerative medicine to replace damaged tissue or organs. For example, stem cell transplants can treat patients with blood diseases like leukemia. There are multiple kinds of stem cells used for medical treatments and research. 这场讲座讲的是干细胞。它们是未分化的细胞，没有特定的功能。然而，它们有潜力变成所有其他种类的细胞，以替换衰老的细胞。科学家希望将它们用于再生医学，以替换受损的组织或器官。例如，干细胞移植可以治疗像白血病这样的血液疾病患者。目前有多种干细胞被用于医疗治疗和科学研究中。","ana":"Stem cells are cells that are undifferentiated, meaning they do not have a specific job or function. 干细胞是未分化的细胞，这意味着它们没有特定的工作或功能。 While skin cells protect your body, muscle cells contract and nerve cells send signals, stem cells do not have any specific structures or functions. 虽然皮肤细胞保护你的身体，肌肉细胞收缩，神经细胞发送信号，但干细胞没有任何特定的结构或功能。 Stem cells do have the potential to become all other kinds of cells in your body. 干细胞确实有潜力成为你体内所有其他类型的细胞。 Your body uses stem cells to replace worn-out cells when they die. 你的身体会利用干细胞来替代坏死的细胞。 For example, you completely replace the lining of your intestines every four days. 例如，你每四天就彻底更换一次肠壁。 Stem cells beneath the lining of your intestines replace these cells as they wear out. 当这些细胞衰竭时，肠道内壁下的干细胞会代替它们。 Scientists hope that stem cells could be used to create a very special kind of personalized medicine, in which we could replace your own body parts with, well, your own body parts. 科学家们希望干细胞可以用来创造一种非常特殊的个性化医疗，在这种医疗中，我们可以用你自己的身体部位来代替你自己的身体部位。 Stem cell researchers are working hard to find ways in which to use stem cells to create new tissue to replace the parts of organs that are damaged by injury or disease. 干细胞研究人员正在努力寻找利用干细胞创造新组织的方法，以取代因受伤或疾病而受损的器官部分。 Using stem cells to replace damaged bodily tissue is called regenerative medicine. 使用干细胞替代受损的身体组织被称为再生医学。 For example, scientists currently use stem cells to treat patients with blood diseases such as leukemia. 例如，科学家目前使用干细胞治疗白血病等血液疾病患者。 Leukemia is a form of cancer that affects your bone marrow. 白血病是一种影响骨髓的癌症。 Bone marrow is the spongy tissue inside your bones where your blood cells are created. 骨髓是骨骼内的海绵状组织，血细胞就是在这里产生的。 In leukemia, some of the cells inside your bone marrow grow uncontrollably, crowding out the healthy stem cells that form your blood cells. 在白血病中，骨髓中的一些细胞不受控制地生长，挤占了形成血细胞的健康干细胞。 Some leukemia patients can receive a stem cell transplant. 一些白血病患者可以接受干细胞移植。 These new stem cells will create the blood cells needed by the patient's body. 这些新的干细胞将产生病人身体所需的血细胞。 There are actually multiple kinds of stem cells that scientists can use for medical treatments and research. 实际上，科学家可以将多种干细胞用于医学治疗和研究。 Adult stem cells or tissue-specific stem cells are found in small numbers in most of your body's tissues. 成体干细胞或组织特异性干细胞在你身体的大多数组织中都有少量存在。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693312/07e57124a8b949c98d1a6f9b25d0f6d4.mp3","phrases":[{"en":"Stem cells are undifferentiated","zh":"干细胞未分化"},{"en":"become all other kinds of cells","zh":"变成所有其他类型细胞"},{"en":"replace worn-out cells when they die","zh":"在细胞死亡时替换磨损细胞"},{"en":"lining of your intestines every four days","zh":"肠道内壁每四天"},{"en":"personalized medicine","zh":"个性化医疗"},{"en":"regenerative medicine","zh":"再生医学"},{"en":"blood diseases such as leukemia","zh":"白血病等血液疾病"},{"en":"stem cell transplant","zh":"干细胞移植"}],"logicPhrases":[{"en":"while → skin cells protect your body","zh":"虽然皮肤细胞保护你的身体"},{"en":"when → die For example you completely replace the lining","zh":"当它们死亡时，例如，你会完全替换内壁"},{"en":"for example → completely replace the lining of your intestines every four","zh":"例如，你每四天就会完全替换一次肠道内壁"},{"en":"for example → scientists currently use stem cells to treat patients with blood","zh":"例如，科学家目前使用干细胞治疗血液病患者"}]},{"id":3350,"name":"Sugar","ref":"The lecture is about sugar. There is sugar in a lot of foods where you don’t expect it. Besides, there are also other places where you see sugar and you don’t necessarily expect it. For example, sugar is the ingredient of peanut and beef stew, and you will not know this after you have read the food labels. Other food like fresh potatoes and carrots contain sugar, and you wouldn’t eat something like beef stew and expect to find this to be the case. 这堂讲座讲述的是糖。许多食物中都有糖，很多时候你并不预料到。例如，糖是花生酱和牛肉炖菜的成分之一，读了食品标签你才会知道这一点。像新鲜土豆和胡萝卜这类食物也含有糖，而你不会想到在牛肉炖菜中会发现糖的存在。","ana":"There’s sugar in a lot of foods where you don’t expect it. 很多食物中都含有糖，你可能没有预料到。 Of course there’s lots of sugar in donuts, ice cream, pastries, or other things that are sweet; candy of course, 当然，甜甜圈、冰淇淋、酥皮点心或其他甜食中含有很多糖；糖果当然也有， but there are other places where you see it and you don’t necessarily expect it. 但糖也存在于其他意想不到的食物中。 So as an example: peanut butter. 比如说：花生酱。 Here’s a list of ingredients from Skippy Peanut Butter and you see that sugar is the second most common ingredient. 这是Skippy花生酱的成分列表，你会看到糖是第二常见的成分。 So that you may know from the reading food labels that these ingredients in any food labels that are listed in order of how much there is in the food itself, 通过阅读食品标签你可能知道，食品标签上的成分是按照食物中各成分含量多少的顺序列出的， so sugar comes right after peanuts. 因此，糖排在花生之后。 Here’s another example, Beef stew, you wouldn’t necessarily expect to find sugar in beef stew but it’s there. 这是另一个例子，牛肉炖菜，你可能不太会想到牛肉炖菜里会有糖，但它确实在其中。 Now it’s down the list of ingredients, it’s actually toward the end, 它在成分列表中靠后，实际上是在最后面， but if you look at the marketing of this and food at the can, it says, there’s fresh potatoes and carrots, 但如果你看这个罐头的营销和食品标签，上面写着有新鲜的土豆和胡萝卜， but actually there’s more sugar in this than there is carrots. 但实际上，这里面的糖比胡萝卜还多。 And so you wouldn’t eat something like beef stew and expect to find this to be the case. 所以，你吃牛肉炖菜时，可能不会期待会有这种情况。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690238/6b75263b858b4b0eabd4b9f4e3686e51.mp3","phrases":[{"en":"sugar in a lot of foods","zh":"很多食物里都有糖"},{"en":"where you don’t expect it","zh":"在你意想不到的地方"},{"en":"donuts, ice cream, pastries","zh":"甜甜圈、冰淇淋、糕点"},{"en":"peanut butter","zh":"花生酱"},{"en":"Skippy Peanut Butter","zh":"Skippy花生酱"},{"en":"sugar is the second most common ingredient","zh":"糖是第二常见的成分"},{"en":"Beef stew","zh":"炖牛肉"},{"en":"more sugar than carrots","zh":"糖比胡萝卜还多"}],"logicPhrases":[{"en":"but → other places where you see","zh":"但还有其他地方你会看到"},{"en":"so → as an example: peanut butter","zh":"所以举个例子：花生酱"},{"en":"so → may know from the reading food labels","zh":"所以你可以通过看食品标签知道"},{"en":"so → sugar comes right after peanuts","zh":"所以糖紧跟在花生之后"},{"en":"but → it’s there Now it’s down the list of ingredients","zh":"但它就在那儿，只是现在排在配料表靠后的位置"},{"en":"but → look at the marketing of this and food","zh":"但如果你看看这个和食品的营销"},{"en":"if → look at the marketing of this and food","zh":"如果你看看这个和食品的营销"},{"en":"but → actually there’s more sugar in this than there is carrots","zh":"但实际上，这里面的糖比胡萝卜还多"}]},{"id":3367,"name":"Superhuman","ref":"The lecture mainly talks about superhuman strength. It is said that some people have incredible power to lift a car or move giant rocks when facing disaster. There is a heated debate on whether these stories are true. According to a large body of anecdotal evidence, in a time of crisis or fear, it is possible for a person to temporarily gain massive strength, but late they couldn’t do it again. 这个讲座主要讲超人的力量。据说，有些人在面对灾难时，有不可思议的力量举起汽车或移动巨大的岩石。关于这些故事是否真实存在着激烈的争论。根据大量的轶事证据，在危机或恐惧的时候，一个人有可能暂时获得巨大的力量，但后来他们就不能再这样做了。","ana":"Today we're going to recount heroic tales of superhuman feats of strength, when in the face of disaster, some people are said to have summoned up incredible physical power to lift a car off of an accident victim, move giant rocks, or like Big John of song, single-handedly hold up a collapsing beam to let the other miners escape. 今天我们要讲述的是超人力量的英雄故事，当面对灾难时，据说有些人会召唤出令人难以置信的力量，把一辆车从事故受害者身上抬起来，移动巨大的岩石，或者像歌曲中的大约翰一样，单枪匹马地撑起倒塌的横梁，让其他矿工逃脱。 Are such stories true? 这些故事是真的吗？ There are many anecdotes supporting the idea, but we're going to take a fact-based look at whether or not it truly is possible for an adrenalin-charged person to temporarily gain massive strength. 有很多轶事支持这一观点，但我们将以事实为基础，看看一个肾上腺素分泌旺盛的人是否真的有可能暂时获得巨大的力量。 In proper terminology, such a temporary boost of physical power would be called hysterical strength. 用恰当的术语来说，这种体力的暂时增强被称为歇斯底里的力量。 The majority of them are anecdotal, and interestingly not repeatable; in many cases, the person who summoned the superstrength later tried it again only to find that they couldn't do it. 其中大多数都是轶事，有趣的是不能重复；在很多情况下，召唤超能力的人后来又试了一次，却发现他们做不到。 Basically, what we have is a respectably large body of anecdotal evidence that suggests that in times of crisis, danger, or fear, some people have the ability to temporarily exercise superhuman strength. 基本上，我们所拥有的是相当多的轶事证据，这些证据表明，在危机、危险或恐惧的时候，有些人有能力暂时锻炼超人的力量。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690258/2a7f252f738c42ba9331e470146dad42.mp3","phrases":[{"en":"heroic tales of superhuman feats","zh":"超人力量的英雄传说"},{"en":"lift a car off","zh":"把汽车抬离"},{"en":"collapsing beam","zh":"坍塌的横梁"},{"en":"Are such stories true?","zh":"这些故事是真的吗？"},{"en":"take a fact-based look","zh":"基于事实进行审视"},{"en":"hysterical strength","zh":"应激性超常力量"},{"en":"not repeatable","zh":"不可重复"},{"en":"temporarily exercise superhuman strength","zh":"暂时发挥超人力量"}],"logicPhrases":[{"en":"when → in the face of disaster","zh":"当面对灾难时"},{"en":"but → we're going to take a fact-based look at whether or","zh":"但我们要基于事实来看是……还是……"}]},{"id":3351,"name":"Taxonomy","ref":"The lecture is about taxonomy. Taxonomy is how scientists classify organisms into different groups based on the characteristics that they share. An example is the US Postal Service. In this service, people can address it to a specific level, to their city and then to their street number. And in the same way, scientists use a taxonomy chart to pinpoint a living creature and organism and how it relates to everything else in the world. 这堂讲座讲述的是分类学。分类学是科学家根据有共同特征的生物将它们分入不同的组别。例如，美国邮政服务就是一个例子。在这个服务中，人们可以按照一定的层级来寄信，先是地址到所在的城市，然后到具体的街道号码。同样，科学家使用分类学图表来精确定位生物和有机体，并了解它们与世界上其他事物的关系。","ana":"Welcome to today's lesson. We're continuing with our study of taxonomy. 欢迎来到今天的课程，我们将继续学习分类学。 Taxonomy is how scientists classify organisms into different groups based on the characteristics that they share. 分类学是科学家根据生物体所共有的特征，将其分为不同组的方式。 So, for instance, a good way to think about taxonomy is the US Postal Service. 比如，一个很好的理解分类学的方式是通过美国邮政服务。 If we want to send a letter to someone, we first start off by addressing it to the nation they are in. 如果我们想要给某人寄信，首先要写上他们所在国家的地址。 By default, we usually assume that's America but it doesn't have to be a treat in England or Costa Rica or Spain. 通常我们默认寄往美国，但也可以是英国、哥斯达黎加或西班牙。 You put their nation or their kingdom. 你写上他们的国家或王国。 Then within that kingdom, you address it to a slightly more specific level, their states. 然后，在那个国家范围内，你会写上更具体的地方，像是他们的州。 So, for instance, South Carolina would be the same as a phylum. 例如，南卡罗来纳州就相当于生物学中的“门”。 And within that state, you would address it to their city and then to their street number, the street they live on. 然后，在州内，你会写上他们所在的城市，接着写上他们住的街道和街道号码。 Then you would address it to say their apartment complex and within that complex, you'd address it by their last name to their family and then finally their first name to the specific person you want to get it to. 接下来，你会写上他们的公寓楼，按姓氏确定家庭成员，最后写上名字，以便把信寄到你想要的人。 And in that way we're able to weed out all the 400 million people we don't want to send our letter to in America and pinpoint the exact person we want the letter to reach. 通过这种方式，我们能够排除美国所有不需要寄信的人，从而精确找到我们希望信件送达的具体人。 And in the same way, scientists use a taxonomy chart to pinpoint a living creature and organism and how it relates to everything else in the world. 同样地，科学家们使用分类学图表来确定一个生物体，并研究它如何与世界上其他所有事物相关。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690239/dad3f696ada3470399597876bb175165.mp3","phrases":[{"en":"continuing with our study of taxonomy","zh":"继续学习分类学"},{"en":"scientists classify organisms into different groups","zh":"科学家把生物分类到不同组别"},{"en":"taxonomy is the US Postal Service","zh":"分类学就像美国邮政服务"},{"en":"their nation or their kingdom","zh":"他们的国家或界"},{"en":"the same as a phylum","zh":"相当于一个门"},{"en":"address it to their city","zh":"把地址写到他们的城市"},{"en":"weed out all the 400 million people","zh":"排除掉那四亿人"},{"en":"scientists use a taxonomy chart","zh":"科学家使用分类学图表"}],"logicPhrases":[{"en":"so → for instance a good way to think about taxonomy is","zh":"所以，例如，思考分类学的一个好方法是"},{"en":"for instance → a good way to think about taxonomy is the US","zh":"例如，思考分类学的一个好方法是美国"},{"en":"if → want to send a letter to someone","zh":"如果我们想给某人寄一封信"},{"en":"but → to be a treat in England or","zh":"但在英格兰，它不一定是一种款待，或者"},{"en":"so → for instance South","zh":"所以，例如，南卡罗来纳州就相当于一个"},{"en":"for instance → be the same as a phylum","zh":"例如，南卡罗来纳州就相当于一个门"},{"en":"finally → their first name to the specific person you want","zh":"最后，是你要找的那个特定人的名"}]},{"id":3372,"name":"Teaching","ref":"This lecture is about teaching and learning. Firstly, teaching is motivated by students' needs of learning. Secondly, it is important to consider the result and byproducts of the learning process. Thirdly, new ideas can stimulate and motivate students. Finally, the unity of research and teaching close connection, exercising as well as interplay help speaker become a successful professor. 这个讲座是关于教与学的。首先，教学的动机是学生的学习需要。其次，重要的是要考虑学习过程的结果和副产品。第三，新的想法可以刺激和激励学生。最后，科研与教学的结合、紧密的联系、锻炼与互动有助于演讲者成为一名成功的教授。","ana":"All of my research and that I conducted was my 60 plus graduate students, was motivated by their need to learn, so that we can teach. 我所有的研究都是在我的 60 多名研究生身上进行的，我的动机是他们需要学习，这样我们才能教书。 Of course, in some inventions happened along the way but I've always considered the end the result. 当然，有些发明是在过程中发生的，但我始终认为最终的结果才是目的所在。 And I always consider that this invention to be byproduct, byproducts of the learning process. 而且我一直认为这些发明是学习过程的副产品。 The end product for me was always better understanding or when one really succeeded in unifying theory that can help us in teaching the subject. 对我来说，最终的成果始终是更好的理解，或者是在真正成功地将理论统一起来之后，这有助于我们在教学中更好地运用这些理论。 I've also looked at teaching as a vehicle to try new ideas, of new ways to doing things on an intelligent group of learners. 我还把教学视为尝试新想法、以一种明智的方式为一群学习者做事的工具。 That is as the vehicle for the teaching-research results. 这就是教学与研究成果的载体。 And in my experience, this kind of teaching is the most stimulated and motivating to students. I am also uncovered many interesting research problems is the cause of teaching subject. 根据我的经验，这种教学方式对学生来说是最具激励性和吸引力的。我还发现了许多源于教学主题的有趣研究问题。 It is this unity of research and teaching their close connection and the benefits gathered by exercising and the interplay that to be characterised the successful professor. 正是研究与教学的这种统一、它们之间的紧密联系以及通过实践所获得的益处，构成了成功教授者的特征。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690263/fdb1c52d74b84380a86a3cad88265de4.mp3","phrases":[{"en":"All of my research","zh":"我所有的研究"},{"en":"60 plus graduate students","zh":"六十多名研究生"},{"en":"motivated by their need to learn","zh":"受他们学习需求的驱动"},{"en":"byproducts of the learning process","zh":"学习过程的副产品"},{"en":"teaching as a vehicle","zh":"把教学作为载体"},{"en":"most stimulated and motivating to students","zh":"最能激发和激励学生"},{"en":"uncovered many interesting research problems","zh":"发现了许多有趣的研究问题"},{"en":"unity of research and teaching","zh":"研究与教学的统一"}],"logicPhrases":[{"en":"so → can teach 60 Of course","zh":"这样我们就能教60了，当然"},{"en":"but → I've always considered the end the result","zh":"但我一直认为目的就是结果"},{"en":"when → one really succeeded in unifying theory that can help us","zh":"当一个人真正成功统一了能帮助我们（的）理论时"}]},{"id":1578,"name":"Technology erode privacy","ref":"This lecture is about tensions between technology and privacy and as a society we need to argue about the amount of privacy and security we have. Firstly, privacy is a human right, which we care about, and we have many protections. Secondly, however, technology continues to erode privacy in three spatial dimensions, including security cameras, long lenses and body scanners. Thirdly, this process won’t slow down because of the quantum technologies. In conclusion, technology continues to erode our privacy. 这一讲座讨论了技术与隐私之间的紧张关系，作为一个社会，我们需要讨论我们拥有的隐私和安全的程度。首先，隐私是我们关心的人权，我们拥有许多保护措施。其次，然而，技术在三个空间维度上持续侵蚀隐私，包括监控摄像头、长焦镜头和身体扫描仪。第三，这一进程不会因量子技术而放缓。总结来说，技术继续侵蚀我们的隐私。","ana":"So that creates tensions and that's what I want to talk about. 这就产生了紧张局势，而这正是我想要讨论的话题。 Because I think it’s important we are as a society able to have an informed debate about how much privacy is enough but not too much, how much security is enough but not too much. 因为我认为，作为一个社会，我们能够进行有根据的辩论，讨论多少隐私是足够的但又不至于过多，多少安全是足够的但又不至于过多，这一点非常重要。 Privacy is a human right that simply quoting the Universal Declaration. 隐私是一项人权，这一点可以简单地引用《世界人权宣言》。 In the physical world, we’ve got all kinds of protections. 在现实世界中，我们有各种各样的保护措施。 There is evidence that we care about our privacy: we’ve got doors, we’ve got obscured glass, we’ve got locks, we wear clothes, we put up shutters. 有证据表明我们在乎隐私：我们有门，我们有遮挡的玻璃，我们有锁，我们穿衣服，我们装上百叶窗。 And technology continues to erode the privacy that exists in the real world in the three spatial dimensions. 而技术继续侵蚀在现实世界中存在的隐私，尤其是在三维空间中。 Security cameras, automatic number plate recognition take away anonymity. 监控摄像头、自动车牌识别技术剥夺了匿名性。 Long lenses paparazzi take away distance and the privacy that used to create. 配备长焦镜头的狗仔队消除了距离，也摧毁了距离曾经带来的隐私保护。 And body scanners are increasingly being used to see through clothes, for example. 例如，身体扫描仪越来越多地被用来透视衣服。 This process isn’t going to slow down and the new quantum technologies are actually being able to do gravitational sensing and that’s advancing at a remarkable rate and you can’t shield gravity. 这一进程不会减缓，而新的量子技术实际上能够进行引力感应，并且这一技术以惊人的速度进步，而人类无法屏蔽引力。 So some of the new quantum technologies are able already to see through walls and will, and there are technologies also for seeing round corners now using scattered light from lasers. 因此，一些新的量子技术已经能够并将会透过墙壁看见物体，并且现在也有使用激光散射光线的技术可以看到墙角处的物体。 Technology continues to erode privacy. 技术继续侵蚀隐私。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678151/41d4181bbe9246e8a6de1ab07b59d315.mp3","phrases":[{"en":"informed debate about how much privacy","zh":"关于隐私限度的知情辩论"},{"en":"Privacy is a human right","zh":"隐私是一项人权"},{"en":"we’ve got all kinds of protections","zh":"我们有各种保护措施"},{"en":"technology continues to erode the privacy","zh":"科技不断侵蚀隐私"},{"en":"three spatial dimensions","zh":"三个空间维度"},{"en":"automatic number plate recognition take away anonymity","zh":"自动车牌识别剥夺匿名性"},{"en":"new quantum technologies","zh":"新量子技术"},{"en":"Technology continues to erode privacy","zh":"科技持续侵蚀隐私"}],"logicPhrases":[{"en":"so → creates tensions and that's what I want to talk","zh":"所以这会产生紧张关系，而这正是我想谈的"},{"en":"because → I think it’s important we are as a society able","zh":"因为我认为，作为一个社会，我们能够……这一点很重要"},{"en":"but → not too much how much security is enough but not","zh":"但不能太多——多少安全才算足够，而又不过多"},{"en":"but → not too much","zh":"但不能太多——隐私是一项人权，它只是……"},{"en":"for example → This process isn’t going to slow down and the new","zh":"例如，这一进程不会放缓，而新的……"},{"en":"so → some of the new quantum technologies are able already","zh":"所以一些新的量子技术已经能够……"}]},{"id":3359,"name":"The politics of happiness","ref":"More countries are becoming interested in happiness research for policy making. Governments are exploring how public policies might change if they used happiness as an important measurement. Several developed nations including Australia, France and Britain are taking concrete actions by planning to regularly publish official happiness statistics. This development indicates that happiness is gradually becoming a significant consideration for policymakers in advanced economies, potentially shaping future governance approaches. 当前越来越多的国家开始将幸福研究纳入政策制定考量。各国政府正在探索，若将幸福感作为重要衡量指标，公共政策应如何相应调整。澳大利亚、法国和英国等发达国家已付诸实际行动，计划定期发布国民幸福指数官方统计。这一发展趋势表明，在发达经济体的政策制定过程中，幸福度正逐渐成为关键考量要素，未来可能深刻影响治理模式的变革。","ana":"As Joanne pointed out, only one country, tiny little Bhutan, wedged between China and India,has adopted the Gross National Happiness as the central index of government policy, and actually has a good deal of success in education and in health and in economic growth and in environmental preservation. 正如乔安妮所指出的，只有一个国家，即位于中国和印度之间的小国不丹，将国民幸福总值作为政府政策的中心指标，而且实际上在教育、卫生、经济增长和环境保护方面取得了很大的成功。They have a rather sophisticated way of measuring the effects of different policies on people's happiness. 他们有一种相当复杂的方法来衡量不同政策对人们幸福的影响。They are the only country to go that far.他们是唯一一个走得这么远的国家。 But you are now beginning to get other countries interested enough to do kind of white paper policy analyses of happiness research 但现在，其他国家也开始对幸福研究表现出足够兴趣，愿意撰写白皮书形式的政策分析报告。 what effects would it have if we used it more for public policy? 如果我们更多地将幸福研究应用于公共政策，会产生什么影响？ You are beginning to get countries like Australia, France, Great Britain, that are considering publishing regular statistics on happiness. 像澳大利亚、法国、英国等国家已经开始考虑定期发布幸福指数统计数据。 So it is beginning to become a subject of greater interest for policymakers and legislators in different advanced countries. 因此，幸福研究正逐渐成为不同发达国家政策制定者和立法者更关注的话题。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690249/bd16521835364c6f93661e5460d6f0e1.mp3","phrases":[{"en":"only one country, tiny little Bhutan","zh":"唯一一个国家，小小的不丹"},{"en":"wedged between China and India","zh":"夹在中国和印度之间"},{"en":"adopted the Gross National Happiness","zh":"采用了国民幸福总值"},{"en":"central index of government policy","zh":"政府政策的核心指标"},{"en":"sophisticated way of measuring","zh":"精细的衡量方式"},{"en":"white paper policy analyses","zh":"白皮书政策分析"},{"en":"Australia, France, Great Britain","zh":"澳大利亚、法国、英国"},{"en":"greater interest for policymakers and legislators","zh":"政策制定者和立法者更感兴趣"}],"logicPhrases":[{"en":"but → are now beginning to get other countries interested enough","zh":"但你现在开始让其他国家产生足够的兴趣"},{"en":"if → used it more for public policy","zh":"如果我们把它更多地用于公共政策"},{"en":"so → is beginning to become a subject of greater interest","zh":"因此，它正开始成为一个更受关注的话题"}]},{"id":4283,"name":"Thermodynamics and kinetic theory","ref":"After the 19th century, thermodynamics and kinetic theory didn’t blend properly. Thermodynamics has its roots in how material things respond to heat and temperature, whose laws were thought to be absolute. But kinetic theory states matter consists of atoms in random motion, creating fluctuations where thermodynamics laws can be violated. This raises questions. The lecture concludes thermodynamics laws are obeyed on average but can be violated during unusual fluctuations. 19世纪以后，热力学与动力学理论未能很好地融合。热力学源于物质对热量和温度的响应，其定律曾被认为是绝对的。但动力学理论认为，物质由处于随机运动中的原子组成，这种运动会产生涨落，使得热力学定律在某些情况下可能被打破。这引发了一系列问题。讲座最后指出，热力学定律总体上是成立的，但在异常涨落期间可能被暂时违反。","ana":"Coming out of the 19th century with all that happened and so quickly, some of these ideas, some of these theories like thermodynamics and kinetic theory, they didn't blend the way they should have. 走出19世纪经历了如此之多且如此迅速，其中一些观点、一些理论（如热力学和动力学理论）未能如应有的方式融合。 Thermodynamics has its roots in matter how material things respond to heat and temperature and so forth. 热力学源于物质如何对热量和温度等作出反应。 The laws of thermodynamics were thought to be absolute. 热力学定律曾被认为是绝对的。 Now take kinetic theory: if matter consists of atoms in random motion and that's what matter is, then you open up the possibility that there will be fluctuations in samples of matter such that the laws of thermodynamics can momentarily be violated. 现在看动力学理论：如果物质由随机运动的原子组成，而这就是物质的本质，那么你就打开了物质样本中可能出现波动的可能性，使得热力学定律在瞬间被打破。 Are the laws of thermodynamics valid absolute? 热力学定律是绝对有效的吗？ Are they obeyed statistically? 它们是统计性地被遵守的吗？ On average they're obeyed but they can be violated during unusual times, all right? 平均而言它们被遵守，但在特殊时期它们可能被打破，可以吧？","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693313/0986b6b1b368425f9689bf06e03fe3ae.mp3","phrases":[{"en":"Coming out of the 19th century","zh":"刚刚走出19世纪"},{"en":"thermodynamics and kinetic theory","zh":"热力学与分子运动论"},{"en":"they didn't blend","zh":"它们未能融合"},{"en":"laws of thermodynamics were thought to be absolute","zh":"热力学定律曾被认为是绝对的"},{"en":"matter consists of atoms in random motion","zh":"物质由随机运动的原子组成"},{"en":"fluctuations in samples of matter","zh":"物质样本中的涨落"},{"en":"laws of thermodynamics can momentarily be violated","zh":"热力学定律可暂时被违反"},{"en":"Are they obeyed statistically?","zh":"它们是统计上被遵守的吗？"}],"logicPhrases":[{"en":"so → quickly some of these ideas","zh":"很快，其中一些想法就……"},{"en":"so → forth","zh":"诸如此类。热力学定律曾被认为是绝对的"},{"en":"if → matter consists of atoms in random motion and that's what","zh":"如果物质由随机运动的原子构成，而这就是……"},{"en":"but → can be violated during unusual times","zh":"但在特殊时期，它们可能会被违背"}]},{"id":1587,"name":"Three principles","ref":"The lecture talks about equity. That is one of the guiding principles for a just city. According to the lecture, his choice of word equity is in fact based on Ross's argument that a policy ought to distribute benefits to people where the worst off become better off. In addition, we have to talk about the policy at the time it's being enacted, and equity means that you do not in fact take advantage of those people who are weakest. 这一讲座讲述了公平，这是一个公正城市的指导原则之一。根据讲座，演讲者选择使用“公平”这个词实际上是基于罗斯的论点，即政策应当分配利益，使得最处于困境的人变得更好。此外，我们还需要讨论政策实施时的情况，而公平意味着你不能利用那些最弱势的人群。","ana":"From reading philosophy, I came up with three principles as the guiding principles for a just city, of the principles of equity, democracy, and diversity. 通过阅读哲学著作，我提出了三条指导一个公正城市的基本原则，即公平、民主和多样性。 Of these were derived from the works of a number of philosophers, most preeminently I supposed on Ross. 这些原则源自多位哲学家的著作，尤其是我认为最主要的是罗斯（Ross）的理论。 My choice of word equity rather than equality is in fact based on Ross's argument that a policy ought to distribute benefits to people where the worst off become better off. 我选择用“公平”（equity）而非“平等”（equality）这个词，是基于罗斯的观点：政策应当分配利益，使最弱势群体的处境有所改善。 So the worst off don't have to become equal to everybody else but no policy should in fact make those who are most disadvantaged, more disadvantaged. 也就是说，最弱势群体不必与其他人变得完全平等，但任何政策都不应让他们的处境变得更糟。 And it means that we have to talk about the policy at the time it's being enacted. 这也意味着我们必须在政策执行时就对其进行讨论。 To say, while we have to make our city more competitive because sometime and by and by, the benefits will trickle down to those people who were worst off doesn't justify making them worst off at that time. 那种“先通过损害弱势群体利益提升城市竞争力，未来再通过涓滴效应补偿他们”的论调，并不能成为在当下让他们境况更糟的正当理由。 We have a lot of examples in the world of people whose homes were destroyed in the name of the greater good and say eventually they will benefit. 现实中我们有太多例子，人们的家园被以“更大利益”的名义摧毁，而他们被告知最终会受益。 But equity means that you do not in fact take advantage of those people who are weakest. 但“公平”意味着你实际上不能利用那些最弱势的人群来换取所谓的更大利益。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678137/e8700bf2ff264ab190f0d27487a7e279.mp3","phrases":[{"en":"three guiding principles","zh":"三条指导原则"},{"en":"equity, democracy, and diversity","zh":"公平、民主与多元"},{"en":"most preeminently on Ross","zh":"尤其基于罗斯"},{"en":"equity rather than equality","zh":"公平而非平等"},{"en":"worst off become better off","zh":"最弱势者境况改善"},{"en":"make most disadvantaged more disadvantaged","zh":"使最弱势者更加弱势"},{"en":"policy at the time enacted","zh":"政策在制定时"},{"en":"not take advantage of weakest","zh":"不利用最弱势者"}],"logicPhrases":[{"en":"so → to become equal to everybody","zh":"所以，处境最差的人不必变得与所有人平等"},{"en":"but → in fact make those who are most","zh":"但事实上，任何政策都不应让那些最……的人"},{"en":"while → make our city more competitive because sometime","zh":"尽管我们必须让城市更具竞争力，因为有时……"},{"en":"but → equity means that you do not in fact take advantage","zh":"但公平意味着你实际上并不占便宜"}]},{"id":1577,"name":"Three stages of brain development V2","ref":"The lecture is about brain. The brain builds basic circuits that are responsible for basic skills and it is prepared to be shaped by experience. The interaction between genetics and experience that shapes brain architecture is embedded in the reciprocal relationship, the relationships that children have with the adults in their lives. In addition, the brain has multiple sections and the sections relate to cognitive function, the process of emotion and involve in scene and hearing. 这一讲座讲述了大脑。大脑构建了负责基本技能的基础神经回路，并且为经验的塑造做好准备。遗传和经验之间的互动塑造大脑结构，这一过程嵌入在儿童与生活中成人之间的相互关系中。此外，大脑有多个区域，这些区域与认知功能、情感处理以及视觉和听觉等过程相关联。","ana":"The brain is basically built from the bottom up. 大脑的构建过程基本上是自下而上的。 First, the brain builds basic circuits that are responsible for basic skills. 首先，大脑构建出负责基本技能的基本神经回路。 And then more complex circuits are built on top of those basic circuits as we develop more complex skills. 随着我们掌握更复杂的技能，更高级的神经回路会在这些基础回路之上逐步形成。 Biologically, the brain is prepared to be shaped by experience. 从生物学角度来看，大脑天生具备被经验塑造的特质。 It's expecting the experiences that a young child has to literally influence the formation of its circuitry, it's built into our biology. 幼儿期的经历直接影响神经回路的形成，这种机制已深植于我们的生物属性之中。 The interaction between genetics and experience that shapes brain architecture is embedded in the reciprocal relationship, the relationships that children have with the adults in their lives. 基因与经验之间的相互作用塑造了大脑的结构，这种关系嵌入在儿童与其生活中的成人之间的互惠关系中。 And by that, we mean what we refer to as the serve-and-return nature of children's interaction with their adults development and the impact of experience on development is not a one-way street, it's a back-and-forth interaction. 我们指的就是“服务与回应”这一概念，即儿童与成人的互动发展，经验对发展的影响不是单向的，而是相互作用的过程。 The brain is a highly integrated organ which has multiple sections that specialized in different kinds of processes. 大脑是一个高度集成的器官，具有多个专门化处理不同类型过程的区域。 So we have parts of the brain that are involved more in cognitive function and other parts that are involved in processing emotion and parts involved in seeing and hearing. 因此，大脑有一些部分主要负责认知功能，其他部分则负责情感处理，还有一些部分与视觉和听觉相关。 So, if a child is emotionally kind of well put together and socially competent, that will affect more positive and productive learning. 所以，如果一个孩子情感上很稳定，且具备社交能力，那么这将促进更加积极和富有成效的学习。 And if a child is preoccupied with fears or anxiety or is dealing with considerable stress, no matter how intellectually gifted that child might be, his or her learning is going to be impaired by that kind of emotional interference. 如果一个孩子充满恐惧、焦虑或正在经历巨大的压力，那么不论这个孩子有多么聪明，他或她的学习都会因为情感上的干扰而受到影响。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678150/69d7d884c9c8453685a45e932c27196c.mp3","phrases":[{"en":"built from the bottom up","zh":"自下而上构建"},{"en":"basic circuits","zh":"基本神经回路"},{"en":"more complex circuits","zh":"更复杂的神经回路"},{"en":"prepared to be shaped by experience","zh":"准备好被经验塑造"},{"en":"interaction between genetics and experience","zh":"基因与经验之间的相互作用"},{"en":"serve-and-return nature","zh":"服务与回应特性"},{"en":"highly integrated organ","zh":"高度集成的器官"},{"en":"emotional interference","zh":"情感干扰"}],"logicPhrases":[{"en":"so → have parts of the brain that are involved more","zh":"所以，大脑中有些部分参与得更多"},{"en":"so → emotionally kind of well put together","zh":"所以，如果一个孩子在情绪上还算稳定"},{"en":"if → emotionally kind of well put together","zh":"如果一个孩子在情绪上还算稳定"},{"en":"if → preoccupied with fears or anxiety or is","zh":"如果一个孩子满脑子恐惧或焦虑，或者"}]},{"id":1573,"name":"Three types of questionnaires","ref":"In the questionnaires, questions can be divided into three types, called level measurement. Firstly, we have category type questions. It means participants select from a list of categories for their response. Secondly, we have ordinal type questions. These are similar to category questions, but there is some sort of order between them. Thirdly, we have continuous questions. These are any questions that can be answered by a number. 在问卷调查中，问题可以分为三种类型，称为测量等级。首先，我们有类别型问题。这意味着参与者从一系列类别中选择他们的回答。其次，我们有顺序型问题。这些问题与类别型问题相似，但选项之间存在某种顺序关系。第三，我们有连续型问题。这些问题是任何可以通过数字回答的问题。","ana":"What I've decided to provide is the steps that I take when analyzing my own questionnaires. 我决定提供的是我在分析自己问卷时采取的步骤。 However, before I begin, it would be useful to remind you of a few terms we use when talking about questionnaires. 然而，在我开始之前，提醒你们一些我们在谈论问卷时使用的术语会很有帮助。 Questions can be divided into three types. 问题可以分为三种类型。 This is sometimes called level measurement. 这有时被称为测量等级。 Firstly, we have category-type questions, which are also known as nominal questions. 首先，我们有类别型问题，也称为名义型问题。 These are when participants select from a list of categories for their response, such as male or female or they may include ethnic origin. 这些问题是让参与者从一系列类别中选择他们的回答，例如性别（男性或女性），或可能包括族裔背景等。 Secondly, we have ordinal-type questions. 其次，我们有顺序型问题。 These are similar to category questions. 这些问题与类别问题类似。 But instead of the categories being independent, there is some sort of order between them. 但是与类别问题不同的是，选项之间存在某种顺序关系。 If we ask people to indicate their age in categories, this is an ordinal type question. 如果我们让人们在类别中选择他们的年龄，这就是一个顺序型问题。 Thirdly, we have continuous questions. 第三，我们有连续型问题。 These are any questions that can be answered by a number. 这些是任何可以用数字回答的问题。 It could be an open-ended question asking participants to tell you how many times they attended lectures or how often they used a VLE. 它可以是一个开放式问题，要求参与者告诉你他们参加讲座的次数或使用虚拟学习环境（VLE）的频率。 Or it could involve asking them to rate the importance or intensity of some experience. 或者它可能包括要求他们对某些经历的重要性或强度进行评分。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678147/c33aa756f07348dc84850d29451ee2d3.mp3","phrases":[{"en":"the steps when analyzing questionnaires","zh":"分析问卷的步骤"},{"en":"Questions can be divided into three types","zh":"问题分为三类"},{"en":"level of measurement","zh":"测量层级"},{"en":"category-type or nominal questions","zh":"类别型或名义问题"},{"en":"select from a list of categories","zh":"从类别列表中选择"},{"en":"ordinal-type questions","zh":"顺序型问题"},{"en":"there is some sort of order between them","zh":"它们之间存在顺序"},{"en":"continuous questions answered by a number","zh":"用数字回答的连续型问题"}],"logicPhrases":[{"en":"when → analyzing my own questionnaires However","zh":"然而，在分析我自己的问卷时"},{"en":"however → before I begin it would be useful to remind","zh":"不过，在开始之前，有必要提醒"},{"en":"when → talking about questionnaires","zh":"谈到问卷时，问题可分为三类"},{"en":"when → participants select from a list of categories for their response","zh":"当参与者从一系列类别中选择作答时"},{"en":"but → instead of the categories being independent","zh":"但类别并非相互独立"},{"en":"instead → of the categories being independent","zh":"而非类别相互独立"},{"en":"if → ask people to indicate their age in categories","zh":"如果我们让人们按年龄段来表明年龄"}]},{"id":2554,"name":"Tobacco","ref":"The lecture talks about cigarette advertising. According to the lecture, over the past few months, the government has been pushing to remove all advertising outlets for the tobacco industry, and in particular pushing for plain packaging. The tobacco industry argues that the cigarette box is not a form of advertising, while the speaker believes that the cigarette box has actually become iconic to each brand. So she hopes that the government will introduce plain packaging, and the UK will stop cigarette companies from using their box as a form of advertising. 讲座讨论了香烟广告问题。根据讲座内容，过去几个月来，政府一直在推动取消烟草行业的所有广告渠道，特别是推行统一包装（plain packaging）。烟草行业认为香烟盒本身并不是一种广告形式，但主讲人则认为，香烟盒实际上已经成为各个品牌的重要标志。因此，她希望政府能推行统一包装政策，从而在英国阻止烟草公司利用烟盒作为广告手段。","ana":"Over the past few months, the government has been pushing to remove all advertising outlets for the tobacco industry, and in particular pushing for plain packaging. 在过去几个月里，政府一直在推动取消烟草行业的所有广告渠道，尤其是在推动实行简化包装方面。 The tobacco industry, however, is against this and they in particular argue that the cigarette box is not a form of advertising. 然而，烟草行业对此表示反对，他们特别强调香烟盒并不是广告的一种形式。 Michaela has been doing her Ph.D. looking at cigarette advertising and how it's changed over the last 50 years. 米凯拉正在攻读博士学位，研究香烟广告及其在过去50年中的变化。 Basically, I've accessed advertising from the tobacco industry since the 1950s and just analyze the images and looked at the use of the cigarette box within the adverts. 基本上，我查阅了自20世纪50年代以来的烟草广告，分析了其中的图像，并研究了香烟盒在广告中的作用。 In the very early adverts, the cigarette box is a very small part of the adverts and they focus much more on the social aspects of smoking. 在最早期的广告中，香烟盒所占比例非常小，广告更注重展示吸烟的社交属性。 However, as you move through the decades and get closer to the present day, the cigarette box became more and more of a focal point in the adverts. 然而，随着时间推移，接近当代，香烟盒在广告中的地位变得越来越突出。 My argument is that the cigarette box has actually become iconic to each brand. 我的论点是，香烟盒实际上已经成为每个品牌的标志性元素。 So when a smoker takes a box out of their pocket, they are actually advertising that brand. 所以当一位吸烟者从口袋里拿出香烟盒时，实际上就在为那个品牌打广告。 So what we hope will come out of this is that the government will introduce plain packaging. 因此，我们希望这一研究最终能促使政府推出简化包装政策。 And like Australia which has already introduced its policy and Ireland which is again beginning to introduce its policy, we hope that the UK will stop cigarette companies from using their box as a form of advertising. 就像澳大利亚已经实施该政策，爱尔兰也开始推行类似政策一样，我们希望英国也能禁止烟草公司利用香烟盒作为品牌传播载体。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678140/c9f68c45e69046d2a1a9e01404e04e61.mp3","phrases":[{"en":"Over the past few months","zh":"在过去几个月里"},{"en":"remove all advertising outlets","zh":"取消所有广告渠道"},{"en":"tobacco industry, however, is against this","zh":"烟草行业反对这一点"},{"en":"cigarette box is not a form of advertising","zh":"烟盒不是一种广告形式"},{"en":"Michaela has been doing her Ph.D","zh":"Michaela一直在读博士"},{"en":"changed over the last 50 years","zh":"过去50年间的变化"},{"en":"cigarette box has actually become iconic","zh":"烟盒实际上已变得具有标志性"},{"en":"government will introduce plain packaging","zh":"政府将引入平装包装"}],"logicPhrases":[{"en":"however → is against this and they in particular argue that the","zh":"然而有人反对这一点，他们尤其认为"},{"en":"since → the 1950s and just analyze the images and looked","zh":"自20世纪50年代以来，仅分析图像并进行观察"},{"en":"however → as you move through the decades and get closer","zh":"然而，随着年代推移并越来越接近"},{"en":"so → a smoker takes a box out of their pocket","zh":"所以，当吸烟者从口袋里掏出一盒烟时"},{"en":"when → a smoker takes a box out of their pocket","zh":"当吸烟者从口袋里掏出一盒烟时"},{"en":"so → come out of this is","zh":"所以，我们希望由此得出的是"}]},{"id":3375,"name":"Trade-offs triangle","ref":"Poor people should not pay the price for the biodiversity protection. There is a debate about whether you can keep economic growth which can solve the poverty issues without damaging biodiversity. The answer is that it is impossible to reach a win-win solution among conservation, development and poverty. If you set bio-diversity as your goal, you run the risk of hurting the poor and the economy. 穷人不应该为保护生物多样性付出代价。人们争论的焦点是，能否在不破坏生物多样性的情况下保持经济增长，从而解决贫困问题。答案是不可能在保护、发展和贫困之间达成双赢的解决方案。如果把生物多样性作为目标，就有可能伤害穷人和经济。","ana":"Well, it's about whether you can achieve a win-win solution, 问题关键在于能否实现双赢的解决方案， whether you can achieve economic growth which brings wealth in order to cut poverty without damaging the biodiversity. 即在促进经济增长、创造财富以消除贫困的同时，不破坏生物多样性。 And the argument is that if you want to protect the biodiversity, you have to focus on that as a goal, 争论焦点在于：若要将保护生物多样性作为核心目标， but if you do that, you run the risk of hurting the poor 就可能面临加剧贫困的风险， and you also run the risk of inconvenience and reducing the economic growth. 同时可能造成发展受阻和经济增长放缓。 We use the developed and industrialized countries to see this argument this axis argues about.. 我们以发达工业化国家为例阐释这一矛盾 We let us say, a government wishing to start drilling for oil in place X, which is for the wildlife under wildlife conservation society, urging them not to on the grounds that it's a wilderness. 假设某政府计划在X地开采石油，而野生动物保护协会以该地区属于原始荒野为由，强烈呼吁政府停止开采。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690266/ba1310fd58114f1cb9d3901e2515f846.mp3","phrases":[{"en":"achieve a win-win solution","zh":"实现双赢方案"},{"en":"economic growth which brings wealth","zh":"带来财富的经济增长"},{"en":"cut poverty without damaging the biodiversity","zh":"减少贫困而不破坏生物多样性"},{"en":"protect the biodiversity","zh":"保护生物多样性"},{"en":"run the risk of hurting the poor","zh":"冒伤害穷人的风险"},{"en":"reducing the economic growth","zh":"降低经济增长"},{"en":"drilling for oil in place X","zh":"在X地钻探石油"},{"en":"wildlife conservation society","zh":"野生动物保护协会"}],"logicPhrases":[{"en":"in order to → cut poverty without damaging the biodiversity","zh":"为了在不破坏生物多样性的情况下减少贫困"},{"en":"if → want to protect the biodiversity","zh":"如果你想保护生物多样性"},{"en":"but → do that you run the risk of hurting","zh":"但如果你那样做，就有可能伤害"},{"en":"if → do that you run the risk of hurting the","zh":"如果你那样做，就有可能伤害到"}]},{"id":1579,"name":"Tutorial","ref":"The general topic of this lecture is about tutorials. Firstly, the speaker mentioned that students were asked to prepare tutorials in advance by giving them a reading list. Then the speaker said that students are led by tutors, who are usually master or PhD students. Finally, the speaker mentioned that the difference between lectures and tutorials is that the size of tutorial is relatively small, which is usually about 5 to 15 students. 这一讲座的主题关于辅导课。首先，讲者提到学生们被要求提前准备辅导课，通过提供阅读清单来进行准备。接着，讲者表示，辅导课是由导师带领的，通常导师是硕士或博士生。最后，讲者提到，讲座和辅导课的区别在于辅导课的规模相对较小，通常有5到15个学生。","ana":"My name is Evie Carroll. 我的名字是Evie Carroll。 I’m a second year studying international business. 我是国际商务专业的大二学生。 My degree subject is made up of tutorials, lectures and independent learning. 我的学位课程包括辅导课、讲座和独立学习。 And today I’m going to speak about tutorials. 今天我将谈论辅导课。 Before each tutorial, we’re asked to prepare in advance. 在每次辅导课之前，我们都会被要求提前准备。 We’re usually given a reading list, which we have to complete before each tutorial. 我们通常会得到一份阅读清单，必须在每次辅导课之前完成。 We are given websites to look at, each annals to look at and we have to prepare by writing our notes down. 我们还会被提供一些网站和年鉴让我们查阅，准备时需要做笔记。 In every tutorial, there is about 5 to 15 students and these are led by the tutors which are usually masters or PhD students. 每次辅导课上大约有5到15个学生，由通常是硕士或博士生的导师主讲。 And then when we come into the tutorial we are put into small groups. 然后，当我们进入辅导课时，我们会被分成小组。 I’m asked to discuss our ideas, generate new ideas and then feedback to the class. 我被要求讨论我们的想法，产生新想法，然后向全班反馈。 During our tutorials, there’s lots of support given. 我们的辅导课上，有许多人能够提供支持。 Our tutors are there so that we can ask questions at any time. 我们的导师在场，方便我们随时提问。 We also have our peers there, to which we can also ask questions. 我们还会有同学在场，我们也可以向他们提问。 If we need help before the tutorial, we can email any of the tutors and they’ll provide you with help. 如果我们在辅导课之前需要帮助，可以通过电子邮件联系任何一位导师，他们会提供帮助。 The difference between lectures and tutorials is that in lectures you usually have about 200 to 300 students whereas in tutorials are about 5 to 15 students, 讲座和辅导课的区别在于，讲座上通常有大约200到300个学生，而辅导课上大约只有5到15个学生， which allows you to discuss matters, put your hands up and talk to your tutors about any difficulties you may have with a subject. 这让你能够讨论问题，举手发言，并与导师讨论你在某个学科上遇到的困难。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678152/36c7598f05c344acab1231ff490628c4.mp3","phrases":[{"en":"My name is Evie Carroll","zh":"我叫 Evie Carroll"},{"en":"second year studying international business","zh":"国际商务专业二年级学生"},{"en":"tutorials, lectures and independent learning","zh":"辅导课、讲座和自主学习"},{"en":"today I’m going to speak about tutorials","zh":"今天我要讲辅导课"},{"en":"given a reading list","zh":"拿到阅读清单"},{"en":"5 to 15 students","zh":"5 到 15 名学生"},{"en":"masters or PhD students","zh":"硕士或博士生"},{"en":"difference between lectures and tutorials","zh":"讲座与辅导课的区别"}],"logicPhrases":[{"en":"when → come into the tutorial we are put into small","zh":"进入辅导课时，我们会被分成小组"},{"en":"so → can ask questions at any time","zh":"这样我们就能随时提问"},{"en":"if → need help before the tutorial","zh":"如果我们在辅导课前需要帮助"},{"en":"whereas → about 5 to 15 students","zh":"而辅导课上大约有5到15名学生"}]},{"id":1602,"name":"Typography","ref":"Typography is about how you organize letters and text on a page. The aim is to do this so that it's easy to read and looks nice. A typography is important because we're very good at looking at the style and appearance of a document and making judgments about its purpose. This a research has provided proof of this. People were given pages written using invented words. Although they couldn't understand the content, they were still able to make judgments about the quality of the information from how it was presented in the document. 排版是关于如何在页面上组织字母和文本。目的是这样做，以便它易于阅读并且看起来漂亮。排版很重要，因为我们非常擅长查看文档的风格和外观，并对其目的做出判断。这项研究为此提供了证据。人们被给予用虚构的词语书写的页面。尽管他们无法理解内容，但他们仍然能够根据信息在文档中的呈现方式来判断信息的质量。","ana":"Typography is the art and technique of arranging letters and text on a page so that readers can read it easily and it looks attractive. 排版是在页面上排列字母和文本的艺术和技术，以便读者可以轻松阅读，并且看起来很吸引人。 So people want to read it. 所以人们想读它。 Why does typography matter? 那么，为什么排版很重要？ Well, we live in a visual world, we're used to figuring out the aim of a document by looking at its style and appearance even before we start reading it. 我们生活在一个可视化的世界里，我们习惯于在开始阅读文档之前就通过查看文档的样式和外观来确定文档的目的。 Whenever we see a document, we form an immediate judgment. 每当我们看到一份文件，我们就会立即做出判断。 We're experts at doing this. 我们是这方面的专家。 Recent research into readers' responses to different types of print designs has revealed some common assumptions readers make when they first see a document. 最近针对读者对不同类型印刷设计的反应进行的研究揭示了读者第一次看到文件时做出的一些常见假设。 Subjects were presented with carefully designed pages, but couldn't read any of the text because it contained words which don't actually exist. 受试者看到精心设计的页面，但无法阅读任何文本，因为其中包含实际上不存在的单词。 Despite this, they could still make important decisions based on how the information was presented. 尽管如此，他们仍然可以根据信息的呈现方式做出重要决策。 They quickly decided how accurate the content was and a possible use of the document. 他们很快就决定了内容的准确性以及文档的可能用途。 They also looked at the boxes of texts and images to decide how serious the text might be. 他们还研究了文本和图像的盒子，以确定文本的严重程度。 If the text boxes were in lots of different colors, shapes and sizes, then these were related to negative qualities. 如果文本框有很多不同的颜色、形状和大小，那么这些与负面品质有关。 These results confirm that readers respond to how something is designed as soon as they see it. 这些结果证实，读者一看到某物就会对它的设计做出反应。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658429/7d2172a86cfa4e2c88753003c6141f5c.mp3","phrases":[{"en":"Typography is the art and technique","zh":"排版是一门艺术和技巧"},{"en":"arranging letters and text","zh":"排列字母和文字"},{"en":"Why does typography matter","zh":"排版为什么重要"},{"en":"we live in a visual world","zh":"我们生活在视觉世界"},{"en":"form an immediate judgment","zh":"形成即时判断"},{"en":"Recent research into readers' responses","zh":"近期对读者反应的研究"},{"en":"common assumptions readers make","zh":"读者常有的假设"},{"en":"readers respond to how something is designed","zh":"读者会对设计方式作出反应"}],"logicPhrases":[{"en":"so → read it easily and it looks attractive","zh":"让读者读起来轻松，而且看起来吸引人"},{"en":"so → want to read","zh":"让人们愿意读"},{"en":"when → first see a document","zh":"当他们第一次看到文档时"},{"en":"but → couldn't read any of the text because it contained words","zh":"但因为里面有文字，读不了任何文本"},{"en":"because → contained words which don't actually exist","zh":"因为它包含实际并不存在的单词"},{"en":"despite → still make important decisions based on how","zh":"尽管如此，他们仍能根据其如何……做出重要决定"},{"en":"if → in lots of different colors","zh":"如果文本框有多种不同颜色"}]},{"id":1585,"name":"Universal philosophy","ref":"The lecture talks about a universal philosophy. According to the lecture, there are some value structures that apply to all of us. Now, the idea is to test that as well. Sport is universal because the values are specified at a very thin level at the top. There are these rules and we all have to abide by just these rules. But there are lots of things about football that aren't rules specified. In conclusion, there are these universal rules to apply to everybody. 这一讲座讲述了关于普遍哲学的内容。根据讲座，有一些价值结构适用于我们所有人。现在，研究的目标是验证这一点。体育是普遍的，因为其价值观在顶层有非常明确的规定。有这些规则，我们所有人都必须遵守这些规则。但是，足球中有很多方面并没有明确的规则。总之，存在一些普遍适用于每个人的基本规则。","ana":"Okay. So this is the big benefit of a universal philosophy. 好的，这就是普世哲学的一个重要好处。 It says it applies to everybody. 它声称适用于所有人。 Well, looks that doesn't, you know, 205 or 206 countries in the world. And you've got something that applies to everybody. That's a bit strange, isn't it? 不过，看起来好像并不是这样。你知道，世界上有205或206个国家，而你却有一个东西声称对所有人都适用。这是不是有点奇怪？ No, says liberal theory. There are some value structures that apply to all of us. “不”，自由主义理论说：“这并不奇怪”。有一些价值体系确实适用于我们所有人。 You couldn't have the United Nations without it. 如果没有这一点，你根本不可能有联合国的存在。 It couldn't tell you that the Universal Declaration of Human Rights without this idea of values that apply to all of us just because we are humans. 如果没有“只因为我们是人类就适用的价值观”这一理念，就不会有《世界人权宣言》。 Now, the idea is to test that as well. 现在，我们的想法是对这一点进行检验。 Why is sport universal? Why does everybody play football? 为什么体育是普世的？为什么每个人都踢足球？ It's because the values are specified at a very thin level at the top. 这是因为这些价值是在最顶层以高度精炼的方式界定的。 There are these rules and we all have to abide by just these rules. 这就形成了一套规则，我们所有人都必须遵守这套规则。 But there are lots of things about football that aren't rules specified. 但足球运动中的很多方面并没有被规则明确界定。 So Brazilian football is different from Italian football, from British football, from German football, from Spanish football. 所以巴西足球不同于意大利足球、英国足球、德国足球、西班牙足球。 It's culturally specific, but acknowledges that there are these universal general rules to apply to everybody. 它具有文化特性，但也承认存在适用于所有人的普遍规则。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658439/4841ef77930c4700bc7bcd5e99ecfac6.mp3","phrases":[{"en":"big benefit of a universal philosophy","zh":"普遍哲学的一大好处"},{"en":"applies to everybody","zh":"适用于所有人"},{"en":"205 or 206 countries","zh":"205或206个国家"},{"en":"value structures that apply","zh":"适用的价值结构"},{"en":"Universal Declaration of Human Rights","zh":"《世界人权宣言》"},{"en":"Why is sport universal","zh":"为什么体育具有普遍性"},{"en":"specified at a very thin level","zh":"在非常薄的层面上被规定"},{"en":"universal general rules","zh":"普遍的一般规则"}],"logicPhrases":[{"en":"so → the big benefit of a universal philosophy","zh":"所以这就是普世哲学的一大好处"},{"en":"because → are humans “ ” Now","zh":"因为我们是人类“ ”现在"},{"en":"because → specified at a very thin level","zh":"因为这些价值是在非常细微的层面被规定的"},{"en":"but → lots of things about football that aren't rules","zh":"但足球有很多方面并不是规则"},{"en":"so → different from Italian football","zh":"所以巴西足球不同于意大利足球"},{"en":"but → these universal general rules to apply","zh":"但也承认有这些普遍通用规则可以适用"}]},{"id":3363,"name":"Venus","ref":"The lecture discusses how our understanding of Venus evolved from science fiction to scientific reality. Before the space age, people imagined Venus as a lush, Earth-like planet. However, in 1967, NASA’s Mariner 4 and 5 missions revealed its true nature: extreme heat and sulfuric acid clouds, making it uninhabitable. These findings disproved earlier assumptions. Recent data from the Venus Express mission shows some Earth-like features, but Venus remains vastly different from our planet. 讲座讨论了我们对金星的理解是如何从科幻小说演变成科学现实的。在太空时代之前，人们把金星想象成一个郁郁葱葱的类地行星。然而，在1967年，美国宇航局的水手4号和5号任务揭示了它的真实性质：极端的高温和硫酸云，使它不适合居住。这些发现推翻了早先的假设。来自金星快车任务的最新数据显示了一些类似地球的特征，但金星与我们的星球仍然有很大的不同。","ana":"There is a picture, sort of artist's impression, before the space age of what Venus might be like on its surface and so this was looking at the planet Venus, it was science fiction and science fact all the way up to 56 before the start of the space age but it wasn't completely disproved, 在太空时代到来之前，有一幅类似艺术家构想的图景，描绘了金星表面可能的样子。这幅图是关于金星的，涵盖了从太空时代开始前的 56 年间从科幻到科学事实的所有内容，但这个观点并未完全被否定。 this idea of a really sort of lush environment on Venus until 1967, which is when the first measurements in detail were done at Venus. 在 1967 年之前，人们一直认为金星上有着非常茂盛的环境，而实际上直到那时，才有了对金星的详细详细测量。 So Mariner four and Mariner five confirmed the feeling from an earlier space mission that in fact the surface of Venus was not like this at all, but extremely hot and, and also that the clouds were made of sulfuric acid so there wasn't a nice water cycle like is going on in this picture 因此，水手四号和水手五号证实了早期太空任务所传达的感觉，即金星的表面根本不像这样，而是极其炎热的，而且云层是由硫酸构成的，所以并没有像图中那样有正常的水循环， and so, that it had to wait for these in situ measurements by space craft to actually do that and so Venus turned out not to be quite as Earth like as we thought 直到这些航天器进行现场测量之后，我们才能真正了解金星的情况。所以金星实际上并不像我们想象的那样与地球相似， and I'll sort of tell you about some of the latest results from Venus Express, which, which they actually there are some Earth like features, but to a large extent, it's not like the Earth. 我会大概跟你们讲讲 “金星快车” 所取得的一些最新成果，实际上金星上有一些与地球相似的特征，但在很大程度上，它与地球并不相同。 Okay, so a brief comparison between. 好的，接下来让我们做一个简要的对比。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690254/bbd432fe383e455b81bc64a8023dd8d1.mp3","phrases":[{"en":"before the space age","zh":"在太空时代之前"},{"en":"lush environment on Venus","zh":"金星上繁茂的环境"},{"en":"until 1967","zh":"直到1967年"},{"en":"Mariner four and Mariner five","zh":"水手4号和水手5号"},{"en":"extremely hot","zh":"极其炎热"},{"en":"clouds were made of sulfuric acid","zh":"由硫酸构成的云层"},{"en":"latest results from Venus Express","zh":"金星快车号的最新结果"},{"en":"not like the Earth","zh":"不像地球"}],"logicPhrases":[{"en":"so → looking at the planet Venus","zh":"所以这是在观测金星"},{"en":"but → wasn't completely disproved 56 this idea of a really","zh":"但这并没有完全推翻这个……的想法"},{"en":"when → done at Venus","zh":"当首次在金星进行详细测量时"},{"en":"so → Mariner four and Mariner five confirmed the feeling from an","zh":"所以水手4号和水手5号证实了来自……的印象"},{"en":"but → extremely hot and and also that the clouds were made","zh":"但（它）极其炽热，而且云层是由……构成的"},{"en":"so → there wasn't a nice water cycle like is going","zh":"所以没有像……那样良好的水循环"},{"en":"so → wait for these in situ measurements","zh":"所以它只能等待这些原位测量"},{"en":"so → Venus turned out not to be quite as Earth like","zh":"所以事实证明，金星并不那么像地球"}]},{"id":3373,"name":"Wilson","ref":"Wilson is a famous writer in the US, who have a profound impact on American culture. He thought modern literature should be read and appreciated by ordinary people. Although some writers’ work is difficult to read. Wilson made effort to establish American life and innovative literature, which is as equally great as Europe. He thought literature is a part of life for everyone, and encourage people to read more. 威尔逊是美国著名的作家，对美国文化产生了深远的影响。他认为现代文学应该被普通人阅读和欣赏。虽然有些作家的作品很难读。威尔逊努力建立起与欧洲同等伟大的美国生活和创新文学。他认为文学是每个人生活的一部分，并鼓励人们多读书。","ana":"Wilson came from a different world. 威尔逊来自一个截然不同的世界。 And he became the focal point of a board mainstream. 他成为了主流文化中一个核心人物。 American culture that thought that modern literature and wanted modern literature to be able to be read and appreciated by ordinary people. 这种美国文化认为现代文学应当能够被普通民众阅读和欣赏。 They were not modernists in an abstract sense. 他们并非那种抽象意义上的现代主义者。 And certainly, some of them like TS Eliot and Faulkner were too difficult for some of their writings to be read by ordinary people. 当然，像泰斯・艾略特和福克纳这样的作家，其部分作品对于一些普通人来说过于艰深，难以读懂。 But this was a world before the division between the brows or between a lead or whatever had established itself as a part of our consciousness. 但这是一个尚未形成那种 “思想界分歧” 或 “观念分歧” 的时代。 Wilson was a major player in the successful effort of his generation to establish at the heart of American life and innovative literature that would equal the great cultures of Europe. 威尔逊是其那一代人成功努力的领军人物，他们试图将创新文学融入美国生活的核心，并使之与欧洲的伟大文化相媲美。 And he knew that the great cultures of Europe were there. He was not a product of a narrow American Studies kind of training at all. 他知道欧洲的伟大文化是存在的。他完全没有接受那种狭隘的美国研究式训练。 He joined a high artistic standard with an openness to all experience and a belief that literature was as much of a part of life for everyone as conversation. 他以高超的艺术水准、对所有经验的开放态度以及认为文学对于每个人来说都如同交谈一样是生活的一部分这一信念，融入了这种艺术标准之中。 He thought the Proust and Joyce and Yeats and Eliot could and should be read by ordinary Americans and helped that to happen. 他认为普鲁斯特、乔伊斯、叶芝和艾略特的作品能够并且应该被普通美国人所阅读，并促成了这一目标的实现。 Wilson was a very various man. Over a period of almost 50 years, he was a dedicated, a literary journalist, and an investigative reporter, a brilliant memoirist, and dedicated journal keeper. 威尔逊是一个非常多才多艺的人。在将近 50 年的时间里，他一直是一位兢兢业业的文学记者、调查记者、才华横溢的回忆录作者以及勤奋的记录者。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690264/d0b2c20b9332455f90d3c0df2eccd2e9.mp3","phrases":[{"en":"Wilson came from a different world","zh":"威尔逊来自一个不同的世界"},{"en":"focal point of a board mainstream","zh":"主流关注的焦点"},{"en":"wanted modern literature to be","zh":"希望现代文学被阅读"},{"en":"appreciated by ordinary people","zh":"被普通人欣赏"},{"en":"major player in the successful effort","zh":"成功努力中的主要参与者"},{"en":"establish at the heart of American life","zh":"在美国生活核心确立"},{"en":"Proust and Joyce and Yeats and Eliot","zh":"普鲁斯特、乔伊斯、叶芝和艾略特"},{"en":"over a period of almost 50 years","zh":"在将近50年的时间里"}],"logicPhrases":[{"en":"but → a world before the division between the brows","zh":"但这是一个尚无眉间之分的世界"}]}]}

  kw=(kw||'').toLowerCase();
  var arr=cur().filter(x=>!kw||x.name.toLowerCase().includes(kw));
  document.getElementById('list').innerHTML=arr.map(x=>'<div class="card" data-id="'+x.id+'"><div><div class="cname">'+esc(x.name)+'</div><div class="cmeta">'+(TT==='sst'?'官方音频 · 写 50-70 词摘要':'官方音频 · 准备 10 秒 + 说 40 秒')+'</div></div><div class="go">开始 →</div></div>').join('')||'<div style="text-align:center;color:#98a0ae;padding:40px">没有找到题目</div>';
}
function fmtAudio(sec){if(!isFinite(sec))return '--:--';sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+':'+('0'+(sec%60)).slice(-2)} function updateAudioMeta(){var el=document.getElementById('audioMeta');if(!el)return;if(!CUR){el.textContent='时长 --:--';return}if(CUR.readyState>=1)el.textContent='时长 '+fmtAudio(CUR.duration);else CUR.addEventListener('loadedmetadata',function(){el.textContent='时长 '+fmtAudio(CUR.duration)},{once:true})} function practice(item){
  clearT();
  var k=(item.logicPhrases||[]).map(p=>'<span class="kw">'+esc(p.en)+(p.zh?'<span style="display:block;font-size:11.5px;color:#8b93a3;font-weight:400;margin-top:1px">'+esc(p.zh)+'</span>':'')+'</span>').join('');
  var ana=esc(item.ana).replace(/&lt;br\s*\/?&gt;/gi,'\n').replace(/\n{2,}/g,'\n');
  var body='';
  if(TT==='sst'){
    body='<div class="panel"><div class="row"><button class="bigbtn" id="playBtn">▶ 播放音频</button><span id="audioMeta" style="font-size:13px;color:#8b93a3">时长 --:--</span><span class="timer" id="timer">08:30</span><button class="bigbtn ghost" id="startBtn">开始计时</button></div><div class="tips">先听音频，再写摘要。写完点下面的按钮对照范文。</div></div>'+
    '<div class="panel"><textarea id="ans" placeholder="在这里写你的摘要（50-70 词）..."></textarea><div class="wc" id="wc">0 词</div></div>';
  } else {
    body='<div class="panel"><div class="row"><button class="bigbtn" id="playBtn">▶ 播放音频</button><span id="audioMeta" style="font-size:13px;color:#8b93a3">时长 --:--</span></div><div class="rlstep" id="rlstep">听完整段讲座后，按「开始复述」。先给 10 秒准备，然后说 40 秒。</div><div class="row"><span class="phase" id="phase">准备开始</span><span class="timer" id="timer">00:00</span><button class="bigbtn ghost" id="startBtn">开始复述</button></div></div>'+
    '<div class="panel"><div class="tips">复述时对着手机录音，说完回听一遍，再对照下面的范文。RL 评分看内容覆盖和流利度，不用背原文。</div></div>';
  }
  body+='<div class="panel"><div class="row"><button class="bigbtn ghost" data-sec="refSec">看参考范文</button><button class="bigbtn ghost" data-sec="anaSec">看中文对照</button><button class="bigbtn ghost" data-sec="kwSec">看关键词</button></div>'+
  '<div class="sec" id="refSec"><h3>参考范文</h3><div class="ref">'+hlSig(item.ref)+'</div></div>'+
  '<div class="sec" id="anaSec"><h3>中文对照</h3><div class="ana">'+ana+'</div></div>'+
  '<div class="sec" id="kwSec"><h3>关键词</h3><div class="kws">'+k+'</div><div class="tips">听音频时抓这些词组，然后用它们组织摘要/复述。</div></div></div>';
  document.getElementById('list').innerHTML='<span class="back" id="back">← 返回列表</span><div class="panel"><div class="ptitle">'+esc(item.name)+'</div></div>'+body;
  document.getElementById('playBtn').onclick=function(){ var b=this; if(CUR && !CUR.paused){CUR.pause();return;} if(!CUR || CUR.__src!==item.audio){if(CUR){try{CUR.pause()}catch(e){}} CUR=new Audio(item.audio);CUR.__src=item.audio;CUR.onplay=function(){b.textContent='❚❚ 暂停'};CUR.onpause=function(){b.textContent='▶ 继续播放'};CUR.onended=function(){b.textContent='▶ 播放音频'};updateAudioMeta();} updateAudioMeta(); if(CUR.ended)CUR.currentTime=0; CUR.play().catch(function(){b.textContent='▶ 播放音频';alert('音频加载失败')}); };
  document.getElementById('startBtn').onclick=function(){
    var b=this;
    if(TIMER){clearT();b.textContent=TT==='sst'?'继续计时':'开始复述';return;}
    if(TT==='sst'){ LEFT=LEFT||510; PHASE=''; pfmt(); b.textContent='暂停';
      TIMER=setInterval(function(){LEFT--;if(LEFT<=0){clearT();LEFT=0;b.textContent='开始计时';}pfmt();},1000);
    } else {
      // RL: 10 秒准备 -> 40 秒复述
      LEFT=10; PHASE='prep'; pfmt(); document.getElementById('phase').textContent='准备中（10 秒）'; b.textContent='准备中…'; b.disabled=true;
      TIMER=setInterval(function(){
        LEFT--;
        if(LEFT<=0){
          if(PHASE==='prep'){ PHASE='rec'; LEFT=40; pfmt(); document.getElementById('phase').textContent='开始复述（40 秒）'; b.textContent='复述中…'; }
          else { clearT(); PHASE=''; document.getElementById('phase').textContent='完成，对照范文'; b.textContent='再练一次'; b.disabled=false; return; }
        }
        pfmt();
      },1000);
    }
  };
  var ta=document.getElementById('ans');
  if(ta) ta.oninput=function(){ var n=(this.value.trim().match(/[A-Za-z][A-Za-z'’-]*/g)||[]).length; var el=document.getElementById('wc'); el.textContent=n+' 词'; el.className='wc'+(n>=50&&n<=70?' ok':''); };
  document.getElementById('back').onclick=function(){ clearT(); renderList(document.getElementById('q').value); };
  document.querySelectorAll('[data-sec]').forEach(function(b){ b.onclick=function(){ document.getElementById(b.dataset.sec).classList.toggle('on'); }; });
  LEFT=TT==='sst'?510:0; PHASE=''; pfmt();
}
document.getElementById('tabs').onclick=function(e){ if(e.target.tagName!=='BUTTON')return; TT=e.target.dataset.t;
  document.getElementById('tabs').querySelectorAll('button').forEach(function(b){b.className=(b.dataset.t===TT?'on':'')});
  clearT(); renderList(document.getElementById('q').value); };
document.getElementById('q').oninput=function(){ renderList(this.value); };
document.getElementById('list').onclick=function(e){ var c=e.target.closest?e.target.closest('.card'):null; if(c){var it=cur().find(x=>x.id===+c.dataset.id); if(it)practice(it);} };
renderList('');
