<script>
var D={"sst":[{"id":4451,"name":"A female novelist","ref":"The speaker shares her personal journey from writing non-fiction to fulfilling her dream of becoming a novelist. Inspired by the belief that true art requires taking risks, she finally began writing fiction in the early 1990s. As a result, she drafted the first chapter of her acclaimed novel, \"The Secret Life of Bees,\" in 1992, which remains largely unchanged in the final published version.","ana":"I have been writing non-fiction for years actually, but secretly wanting to be a novelist. 实际上，我多年来一直在写非虚构作品，但心里暗暗希望成为一名小说家。 When I first started writing at the age of 30, it was with the intention of writing fiction, but I took a little detour for 10 or 12 years, and write non-fiction which I absolutely have no regret about at all. 我30岁开始写作时，本打算写小说，但却绕了个小路，写了十到十二年的非虚构作品，而对此我完全不后悔。 I think it's exactly the right thing for me to do. 我认为这是我当时最正确的选择。 But there's this dream tucked away inside of me to do this. 但我内心深处一直藏着这个梦想。 Now I was remembering reading something that wrote, who is a great novelist from Mississippi who had a big influence on me actually. 现在我记得读过一位来自密西西比的伟大小说家的话，她对我影响很大。 She said, \"no art ever came out of not risking your neck.\" 她说：“任何艺术都不会出自不冒风险的人。” And I think she's absolutely right about that. 我认为她说得完全正确。 It felt that way to me at the time; it actually feels that way every time I sit down to write something. 当时我就是这种感觉；实际上，每次我坐下来写东西时都会有这种感觉。 Finally, in the early 90s, I took my deep breath and started writing fiction. 最终，在90年代初，我深吸一口气，开始写小说。 It felt risky to me at the time to do that. 当时这样做对我来说很冒险。 And one of the very first things that I wrote was, what I thought was going to be the first chapter of a novel, called \"The Secret Life of Bees.\" 我写的第一批东西之一，是我认为会成为小说《蜜蜂的秘密生活》的第一章。 I wrote it in 1992, and it is actually essentially the first chapter of the novel as it is now. 我在1992年写了它，实际上它就是现在小说的第一章的基本内容。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693679/72316ba707434484812af152cc66af73.mp3","phrases":[{"en":"writing non-fiction for years","zh":"写了多年非虚构"},{"en":"secretly wanting to be a novelist","zh":"私下想当小说家"},{"en":"started writing at the age of 30","zh":"30 岁开始写作"},{"en":"took a little detour for 10 or 12 years","zh":"绕道了 10 到 12 年"},{"en":"a great novelist from Mississippi","zh":"来自密西西比的伟大小说家"},{"en":"no art ever came out of not risking your neck","zh":"不冒险就出不了艺术"},{"en":"in the early 90s, started writing fiction","zh":"90 年代初开始写小说"},{"en":"The Secret Life of Bees","zh":"蜜蜂的秘密生活"}],"logicPhrases":[{"en":"but → secretly wanting to be a novelist","zh":"但暗地里想当小说家"},{"en":"when → I first started writing at the age of 30","zh":"我30岁刚开始写作时"},{"en":"but → I took a little detour for 10 or 12 years","zh":"但我绕了10到12年的弯路"},{"en":"but → there's this dream tucked away inside of me","zh":"但我内心深处藏着一个想实现的梦"},{"en":"finally → in the early 90s I took my deep breath","zh":"终于在90年代初，我深吸了一口气"}]},{"id":4467,"name":"A good engineer","ref":"Engineers should know how to work with a complicated system, and sometimes, the inspirations are from their personal life experience. A complicated system cannot see, so engineering is to help virtualize it by using systems. As complicated systems are becoming reliable, engineers should deliver reliable outcomes as well. To develop a reliable system, engineers need to consider the risks, potential, predictability and accuracy.","ana":"Today, this course you are going to take is about what engineering is and how to work with a complicated system. 今天，你们将要学习的这门课程是关于“什么是工程”以及“如何与复杂系统打交道”。 You guys should know the answers, because all of you guys are from the engineering course. 你们应该知道这些问题的答案，因为你们都来自工程专业。 Especially, when you design, build, debug and develop something new, during these process, you are working with the complicated system. 特别是当你在设计、构建、调试和开发新事物的过程中，你就是在与一个复杂系统打交道。 How to program complicated systems and how would you know it actually works before producing it. 如何对复杂系统进行编程？又如何在它被实际制造出来之前就知道它是可行的？ Inspirations are from your daily life, you probably need to consider your personal life experience. 灵感来源于你的日常生活，你可能需要结合自己的生活经验来思考。 And from the common everyday life to the tiny things that you cannot see virtually, and the inspirations normally exist in the tiny levels. 从日常生活中常见的现象，到那些肉眼看不见的微小细节，灵感往往就存在于这些细微之处。 A complicated system such as your laptops running Microsoft systems. 比如你的笔记本电脑运行微软系统，这就是一个复杂系统。 That means the system is not able to see, which means you guys have to virtualize it. 这意味着这个系统是无法直接看到的，也就是说你们必须通过虚拟化的方式来理解和操作它。 Engineering is here to help virtualize by using systems. 工程的作用就是通过系统来帮助我们实现这种虚拟化。 Nowadays, the complicated systems are relatively reliable, and you guys work upon these and need to deliver the new outcomes which are reliable as well. 如今，这些复杂系统已经相对可靠，你们将在这些系统之上进行工作，并创造出同样可靠的新成果。 This is what we do now and we are good at. 这就是我们现在所做的，而且我们已经非常擅长于此。 Engineering is to help virtualize by using systems. 工程的本质就是利用系统来实现虚拟化。 In order to develop and produce a reliable system, you need to consider more on the risks, potential, predictability and accuracy. 为了开发并制造出一个可靠的系统，你需要更多地考虑风险、潜力、可预测性和准确性。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693065/28e1c1f7fe244e7ea3561558d7a2b50c.mp3","phrases":[{"en":"what engineering is","zh":"工程是什么"},{"en":"work with a complicated system","zh":"处理复杂系统"},{"en":"design, build, debug and develop","zh":"设计、构建、调试和开发"},{"en":"Inspirations are from your daily life","zh":"灵感来自日常生活"},{"en":"a complicated system like laptops","zh":"像笔记本这样的复杂系统"},{"en":"virtualize it","zh":"将它虚拟化"},{"en":"the complicated systems are relatively reliable","zh":"复杂系统相对可靠"},{"en":"risks, predictability and accuracy","zh":"风险、可预测性和准确性"}],"logicPhrases":[{"en":"because → from the engineering course","zh":"因为你们都是工程专业的"},{"en":"especially → design build debug and develop something new","zh":"尤其是在你设计、构建、调试和开发新东西时"},{"en":"when → design build debug and develop something new","zh":"当你设计、构建、调试和开发新东西时"},{"en":"that means → not able to see","zh":"这意味着系统无法看到"},{"en":"which means → virtualize","zh":"这意味着你们必须进行虚拟化"},{"en":"in order to → develop and produce a reliable system","zh":"为了开发并生产出可靠的系统"}]},{"id":4453,"name":"A mother’s loan","ref":"The speaker shares her severe financial struggle caused by massive student loans. Although her college degree helps her secure a job, high interest rates make the debt unpayable, and monthly payments exceed her family income. Consequently, she deeply regrets her educational choice. Furthermore, this heavy financial burden forces her children to rely on government loans for their future college education.","ana":"I'm 43 years old, and I owe tens of thousands of dollars in student loans. 我今年43岁，欠下了数万美元的助学贷款。 Oh sure, I knew the loans were piling up as I went through school. 当然，在上学的过程中，我知道贷款在不断累积。 But with one loan coming from here, another from there, I had no idea of the rock slide that was building. 但是，由于这里一笔贷款，那里一笔贷款，我完全没有意识到这正在酝酿一场“山崩”。 Fifteen years later, I still experience moments of sheer horror regarding my family’s financial situation. 十五年后，我依然时常为家庭的经济状况感到彻骨的恐惧。 My monthly student loan payment is more than triple my car payment. 我每月的助学贷款还款额是车贷的三倍多。 OK, so without my college degree, I would not have been able to get my current job. 好吧，如果没有大学学位，我是不可能得到现在这份工作的。 For that I'm grateful but at what cost? 对此我心怀感激，但代价是什么？ My loans have been accruing at a rate of 10 percent, and now they have burgeoned to well. 我的贷款以10%的利率不断累积，如今已经膨胀得不可收拾。 I'm an English major; you do the math. 我是学英语的，你来算算吧。 I don't think they'll ever get paid off. 我不认为这些贷款有一天能还清。 We’re in debt way past our eyeballs, and there's no hope in sight. 我们已经债台高筑，完全看不到希望。 I'm being kept in class a financial class of graduates whose only hope for attending college meant borrowing money from the government. 我被困在这样一个“财务阶层”里：一群毕业生，他们唯一能够上大学的途径就是向政府借钱。 Because of our mounting credit card debt and monthly payments that far exceed our family’s income, my kids will also join the class of citizens who can’t rely on their parents for college support. 由于我们不断增加的信用卡债务以及远远超过家庭收入的月供，我的孩子们也将加入那群无法依靠父母资助来上大学的公民行列。 Do I wish I'd chosen another educational route? You bet. 我是否希望自己当初选择另一条教育之路？当然。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693686/2ea949fda7234e748923c149349cddc7.mp3","phrases":[{"en":"43 years old and owes student loans","zh":"43 岁还欠着学生贷款"},{"en":"loans were piling up","zh":"贷款不断累积"},{"en":"monthly loan payment is triple my car payment","zh":"月供是车贷的三倍"},{"en":"without my degree, no current job","zh":"没有学位就没有现在的工作"},{"en":"loans accruing at 10 percent","zh":"贷款以 10% 累积"},{"en":"an English major","zh":"英语专业"},{"en":"my kids will also join the class","zh":"我的孩子也会加入这个阶层"},{"en":"can't rely on their parents for college","zh":"无法依靠父母上大学"}],"logicPhrases":[{"en":"but → with one loan coming from here","zh":"但有一笔贷款来自这里"},{"en":"so → without my college degree I would not have been able","zh":"所以没有大学学位，我本不可能……"},{"en":"but → at what cost","zh":"但代价是什么？我的贷款一直在以……的速度累积"},{"en":"because → of our mounting credit card debt and monthly payments","zh":"由于我们不断增加的信用卡债务和每月还款"}]},{"id":2140,"name":"AI","ref":"Al is not automatically fair to all sections of society; it is as biased as the people who create it or the texts it considers. It learns from the content of these texts, so may learn biased attitudes. Procedures are therefore needed to ensure that what Al learns is fair to all sections of society.","ana":"The proclamation that artificial intelligence, or AI, will improve decision making by taking the human element out of the process, hence removing bias for or against certain sections of society, is not entirely accurate. 声称人工智能（AI）将通过消除决策过程中的人为因素来改进决策，从而消除对社会某些群体的偏见，这种说法并不完全准确。 AI is likely to be as biased as the designers who create it or the material it considers. 人工智能很可能与创造它的设计者或它所考虑的材料一样带有偏见。 An AI system may trawl through countless newspaper and magazine articles in order to learn about the world. 一个人工智能系统可能会搜寻无数的报纸和杂志文章，以便了解世界。 If those texts are biased towards 1 section of society, the AI system will learn from this and go on to perpetuate this attitude. 如果这些文本对社会某个群体带有偏见，人工智能系统将从中学习并继续强化这种态度。 It is therefore paramount that that organizations put in place procedures to analyze AI systems, both at the design stage and when the system is operating, in order to ensure that the systems have a fair and unbiased view of the world. 因此，至关重要的是，各组织应制定相应的程序，在人工智能系统的设计阶段和运行过程中对其进行分析，以确保这些系统对世界持有公平和公正的看法。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658777/1c53a71bbf0046149463586f7fd49270.mp3","phrases":[{"en":"artificial intelligence, or AI","zh":"人工智能，即AI"},{"en":"improve decision making","zh":"改进决策"},{"en":"taking the human element out","zh":"消除人为因素"},{"en":"removing bias","zh":"消除偏见"},{"en":"not entirely accurate","zh":"并不完全准确"},{"en":"as biased as the designers","zh":"与设计者一样有偏见"},{"en":"perpetuate this attitude","zh":"延续这种态度"},{"en":"fair and unbiased view","zh":"公平无偏见的观点"}],"logicPhrases":[{"en":"in order to → learn about the world ， 。 If those texts are","zh":"为了了解世界，如果那些文本是"},{"en":"if → biased towards 1 section of society","zh":"如果那些文本偏向社会的某一部分"},{"en":"therefore → paramount that that organizations put in place procedures to analyze","zh":"因此至关重要的是，组织要建立程序来分析"},{"en":"when → operating in order to ensure that the","zh":"当系统运行时，为了确保"},{"en":"in order to → ensure that the systems have a fair and unbiased view","zh":"为了确保这些系统具有公平且无偏见的视角"}]},{"id":4444,"name":"Amory Lovins","ref":"The lecture introduces Amory Lovins, a polymath and consultant regarded as an eccentric genius. He dedicates himself to energy conservation and solving problems using existing technology. He demonstrates his ideas practically by living in a mountain house without a furnace. His remarkable dedication and unconventional approach attract public attention, inspiring journalist Elizabeth Kolbert to write a profile about him titled \"Mr. Green.\"","ana":"Who knows who Amory Lovins is? 谁知道阿莫里·洛文斯（Amory Lovins）是谁？ Nobody. 没人知道。 Amory Lovins is an unusual character. 阿莫里·洛文斯是一个与众不同的人物。 He is something of polymath. 他可以说是一个博学多才的人。 Just to say, he is sort of him of knowledge across a wide range of fields. 也就是说，他在多个领域都有广泛的知识。 He’s not an academic. 他不是学术界人士。 He has a consulting company which he runs off until huge recently out of his home in Colorado. 他有一家咨询公司，直到最近，他一直从科罗拉多州的家中运营这家公司。 He is outside Snowmass in a house built into the side of the mountain that has no furnace. 他住在斯诺马斯外的一栋建在山坡上的房子里，这栋房子没有暖炉。 For that 30 years, he has been kind of iconic plastic oddball genius, thinking of ways to save energy, thinking of ways to solve problems using technology that already exists. 在过去30年里，他一直被视为标志性的古怪天才，思考如何节约能源，以及如何利用现有技术解决问题。 And he has demonstrated several of them. 而且他已经展示了其中的几个方法。 He also offers he is something that he is such of oddballs that people tend to think he is kind of crazy. 他也表现出一种古怪的特质，以至于人们往往认为他有些疯狂。 Anyway, Elizabeth Kolbert, went to spend some time with Amory Lovins. 无论如何，伊丽莎白·科尔伯特（Elizabeth Kolbert）去与阿莫里·洛文斯共度一段时间。 And so he has written his pieces called Mr. Green. 于是，他写了几篇作品，称为《格林先生》（Mr. Green）。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693663/18d72b305df8407fbaf00ef56d462ec1.mp3","phrases":[{"en":"an unusual character","zh":"一个不同寻常的人"},{"en":"something of a polymath","zh":"有点像博学家"},{"en":"a consulting company","zh":"一家咨询公司"},{"en":"a house built into the side of the mountain","zh":"建在山边的房子"},{"en":"a house with no furnace","zh":"没有炉子的房子"},{"en":"iconic oddball genius","zh":"标志性的古怪天才"},{"en":"thinking of ways to save energy","zh":"思考节能的方法"},{"en":"solve problems using technology","zh":"用现有技术解决问题"}],"logicPhrases":[{"en":"so → has written his pieces called Mr","zh":"因此他写了他那些名为Mr的作品"}]},{"id":4461,"name":"Andrew Carnegie","ref":"Scotland-born Andrew Carnegie and his family moved to America when he was 13. He found jobs working in a fabric mill and telegraph office. Carnegie always did well at whatever he set his mind to. Later he built the most successful steel factory and made great fortunes in the steel company, but he gave 90 percent of money away to worthy causes.","ana":"Andrew Carnegie was born in Scotland in 1835. 安德鲁·卡内基于1835年出生在苏格兰。 His family moved to America when he was 13 and settled in Pittsburgh. 他13岁时，全家搬到了美国，并在匹兹堡定居。 He found jobs working in a fabric mill and telegraph office. 他找到了在纺织厂和电报局工作的机会。 Carnegie always did well at whatever he set his mind to. 无论做什么，卡内基总是全力以赴，做得很好。 He was known to make improvements to any job he held. 他以不断改进自己所做的每一项工作而闻名。 While working for the telegraph office, he began studying the railroad system, and he soon became the superintendent. 在电报局工作期间，他开始研究铁路系统，不久后便成为总管。 He took the money he had saved and invested in an oil company. 他把自己存下的钱投资了一家石油公司。 His investment return was good and then he went to England to learn how to make steel. 他的投资回报丰厚，之后他前往英国学习如何制造钢铁。 He wanted to make steel that was cheaper and more durable than American steel. 他想要制造出比美国现有钢铁更便宜、更耐用的钢材。 He came back with his knowledge and built a huge steel factory. 他带着所学知识回国，建立了一座巨大的钢铁工厂。 Carnegie's factory was very successful and he sold it for 480 million dollars. 卡内基的工厂非常成功，后来他以4.8亿美元的价格将其出售。 Carnegie was a very wealthy man but he was more interested in philanthropy than spending his money on himself. 卡内基是一位非常富有的人，但他更热衷于慈善事业，而不是把钱花在自己身上。 He spent the rest of his life giving his money away to worthy causes. 他用余生将财富捐给各种值得支持的事业。 Reading and learning were very important to him, so he built many libraries. 阅读与学习对他来说非常重要，因此他建立了许多图书馆。 He also established universities and research institutes. 他还创办了大学和研究机构。 Carnegie built hospitals, museums, and theaters. 卡内基还修建了医院、博物馆和剧院。 One of the most recognizable buildings he built was Carnegie Hall in New York City. 他建造的最著名的建筑之一是位于纽约市的卡内基音乐厅。 Carnegie Hall hosts many concerts and symphonies each year and is an important part of New York City culture. 卡内基音乐厅每年举办众多音乐会和交响乐演出，是纽约市文化的重要象征。 Andrew Carnegie passed away at the age of 83. 安德鲁·卡内基于83岁时去世。 In his lifetime he gave away 90% of his fortune. 他一生中共捐出了自己90%的财富。 He is known as a man who was selfless and wanted to do good for others. 他被世人铭记为一位无私、致力于帮助他人的人。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693059/428cef8ba0674fa784fee768a4dc47a1.mp3","phrases":[{"en":"born in Scotland in 1835","zh":"1835 年生于苏格兰"},{"en":"family moved to America at 13","zh":"13 岁移居美国"},{"en":"working in a fabric mill and telegraph office","zh":"在纺织厂和电报局工作"},{"en":"became superintendent of the railroad","zh":"成为铁路主管"},{"en":"went to England to learn how to make steel","zh":"去英国学炼钢"},{"en":"sold his factory for 480 million dollars","zh":"以 4.8 亿美元卖掉工厂"},{"en":"more interested in philanthropy","zh":"更热衷于慈善"},{"en":"gave away 90% of his fortune","zh":"捐出 90% 的财产"}],"logicPhrases":[{"en":"when → was 13 and settled in Pittsburgh","zh":"他13岁定居匹兹堡时"},{"en":"while → working for the telegraph office","zh":"在电报局工作期间"},{"en":"but → was more interested in philanthropy than spending his money","zh":"但他更热衷于慈善，而不是花钱"},{"en":"so → built many libraries","zh":"因此他建了许多图书馆，还创办了大学和科研机构"}]},{"id":3792,"name":"Australian immigration","ref":"The first inhabitants of Australia were the ancestors of the indigenous people. Their migration occurred during the Pleistocene epoch when sea levels were lower. Australia and New Guinea were connected by a land bridge known as Sahul. As sea levels rose 10,000 years ago, Australia became a separate landmass. In recent years, Australia has experienced significant immigration, with the majority coming from Asia, particularly China and India.","ana":"The first inhabitants in Australia were the ancestors of the present indigenous people. 澳大利亚最早的居民是现今原住民的祖先。 Whether these first migrations involved one or several successive waves and distinct peoples is still subject to academic debate, as is its timing. 这些最初的迁徙是一次性完成的，还是经历了多波次、不同族群的迁移，以及具体的时间仍存在学术争议。 The minimum widely accepted time frame places presence of humans in Australia at 40,000 to 43,000 years Before Present, while the upper range supported by others is 60,000 to 70,000 years BP. 目前普遍接受的最早人类到达澳大利亚的时间为距今4万至4万3千年，而另一些研究则认为可追溯到距今6万至7万年前。 In any event, this migration was achieved during the closing stages of the Pleistocene epoch, when sea levels were typically much lower than they are today. 无论如何，这次迁徙发生在更新世末期，那时的海平面远低于今天。 Repeated episodes of extended glaciation resulted in decreases of sea levels by some 100–150 m. 多次长时间的冰川作用导致海平面下降了大约100至150米。 The continental coastline therefore extended much further out into the Timor Sea than it does today, and Australia and New Guinea formed a single landmass (known as Sahul), connected by an extensive land bridge across the Arafura Sea, Gulf of Carpentaria and Torres Strait. 因此，大陆海岸线比现在更向外延伸至帝汶海，澳大利亚和新几内亚形成了一块单一的大陆（称为“萨胡尔”），通过阿拉弗拉海、卡奔塔利亚湾和托雷斯海峡上的广阔陆桥相连。 The ancestral Australian Aboriginal peoples were thus long established and continued to develop, diversify and settle through much of the continent. 因此，澳大利亚原住民的祖先早已定居，并在大陆大部分地区不断发展、分化并繁衍生息。 As the sea levels again rose at the terminus of the most recent glacial period some 10,000 years ago, the Australian continent once more became a separated landmass. 约一万年前最近一次冰河时期结束时，随着海平面上升，澳大利亚大陆再次成为一块孤立的陆地。 However, the newly formed 150 km wide Torres Strait with its chain of islands still provided the means for cultural contact and trade between New Guinea and the northern Cape York Peninsula. 然而，新形成的、宽达150公里的托雷斯海峡及其一连串岛屿，仍然为新几内亚与约克角半岛北部之间的文化交流和贸易提供了可能。 During the 1970s and 1980s around 120,000 southern Asian refugees migrated to Australia. 在20世纪70年代和80年代期间，约有12万名来自南亚的难民移居澳大利亚。 During that twenty years, Australia first began to adopt a policy of what Minister of Immigration Al Grassby termed \"multiculturalism\". 在这二十年间，澳大利亚首次开始推行移民部长阿尔·格拉斯比所称的“多元文化主义”政策。 In 2004–05, Australia accepted 123,000 new settlers, a 40% increase over the past 10 years. 在2004至2005年度，澳大利亚接纳了12.3万名新移民，比过去十年增长了40%。 The largest number of immigrants (40,000 in 2004–05) moved to Sydney. 其中最多移民选择定居的城市是悉尼（2004–05年达4万人）。 The majority of immigrants came from Asia, led by China and India. 大多数移民来自亚洲，主要来源国是中国和印度。","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691689/5d47bce3664d4b28a389d76a23a1b8d7.mp3","phrases":[{"en":"the first inhabitants in Australia","zh":"澳大利亚最早的居民"},{"en":"ancestors of the present indigenous people","zh":"原住民的祖先"},{"en":"the minimum time frame 40,000 years","zh":"至少 4 万年前"},{"en":"sea levels much lower than today","zh":"海平面比现在低得多"},{"en":"Australia and New Guinea formed a single landmass","zh":"澳新曾是一块陆地"},{"en":"an extensive land bridge","zh":"一座广阔的陆桥"},{"en":"around 120,000 southern Asian refugees","zh":"约 12 万亚洲难民"},{"en":"a policy of multiculturalism","zh":"多元文化政策"}],"logicPhrases":[{"en":"while → the upper range supported by others is 60","zh":"而其他研究支持的上限是60"},{"en":"when → typically much lower than they are today","zh":"当海平面通常远低于如今时"},{"en":"therefore → extended much further out into the Timor Sea","zh":"因此向帝汶海延伸得远得多"},{"en":"thus → long established and continued to develop","zh":"因此早已确立并持续发展"},{"en":"however → the newly formed 150 km wide Torres Strait","zh":"然而，新形成的150公里宽的托雷斯海峡"}]},{"id":3802,"name":"Basic social values","ref":"The lecture is mainly about basic social values. According to the speaker, many basic social values are passed on unconsciously, already in babyhood. And most people in different ways are working with the unloving side of society in a way and trying to find ways to provide a more caring response, especially those working in Africa who often deal with traumatic social problems.","ana":"But I think just to put it in a nutshell, that many basic social values are passed on unconsciously, already in babyhood. 但我想简要地说，许多基本的社会价值观其实在婴儿时期就已经被无意识地传递了。 Adults convey a great deal to babies about the kind of society they're living in. 成年人会向婴儿传达大量关于他们所处社会的信息。 And, you know, the most basic level, for example, whether the world is supportive and safe or challenging and dangerous. 比如说，在最基本的层面上，这个世界是支持而安全的，还是充满挑战而危险的。 And all of us in different ways are working with the unloving side of society in a way and trying to find ways to offer a more caring response. 我们所有人都以不同的方式在某种程度上面对着社会中缺乏关爱的一面，并试图找到更具关怀性的回应方式。 And particularly those people who are working in Africa are often doing really cutting-edge work in dealing with traumatic social problems such as the AIDS epidemic, the aftermath of war, homelessness and so on. 特别是那些在非洲工作的人，他们常常在应对诸如艾滋病疫情、战争后遗症、无家可归等创伤性社会问题方面开展非常前沿的工作。 Whilst probably the majority of you who've actually made it here today are putting your creative energy into, I'm sure, wonderful, but probably more tried and tested kind of projects. 而今天在座的大多数人可能已经将你们的创造力投入到我相信非常精彩但也更成熟、经过验证的项目之中。","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691718/3c2e77f6064d4fa58337cd83a5480abe.mp3","phrases":[{"en":"basic social values are passed on unconsciously","zh":"基本社会价值观无意识传递"},{"en":"already in babyhood","zh":"在婴儿期就已开始"},{"en":"adults convey a great deal to babies","zh":"大人向婴儿传递很多"},{"en":"whether the world is supportive and safe","zh":"世界是支持安全还是危险"},{"en":"the unloving side of society","zh":"社会缺少关爱的一面"},{"en":"a more caring response","zh":"更有爱心的回应"},{"en":"cutting-edge work in Africa","zh":"在非洲的前沿工作"},{"en":"traumatic social problems like AIDS","zh":"艾滋病等创伤性社会问题"}],"logicPhrases":[{"en":"but → I think just to put it in a nutshell","zh":"但我想，简而言之"},{"en":"for example → supportive and safe or challenging","zh":"例如，世界是支持性的、安全的，还是充满挑战的"},{"en":"so → on Whilst probably the majority of you who've actually made","zh":"等等。尽管你们中大多数人可能确实做过"},{"en":"but → probably more tried and tested kind of projects","zh":"但可能是更经实践检验的项目"}]},{"id":2124,"name":"Bees waggle dance","ref":"Honeybees communicate using a waggle dance to share nectar sources. Researchers found that the dance can be interrupted by a headbutt, which serves as a warning. Scientists mimicked a nectar source in a lab and observed foraging bees returning to the hive to stop dancing bees when potential dangers were present. This behavior study sheds light on the intricate communication system and collaborative efforts of honeybees.","ana":"Honeybees have a unique way of communicating with each other—the waggle dance. 蜜蜂有一种独特的相互交流方式——摇摆舞。 When a bee finds a good source of nectar, it will perform a waggle dance to inform other bees about it. 当一只蜜蜂发现了一个良好的花蜜来源时，它会跳起摇摆舞来通知其他蜜蜂。 However, this dance can be interrupted by a headbutt from another bee, which researchers have discovered is actually a warning signal. 然而，这种舞蹈可能会被另一只蜜蜂的顶头动作打断，研究人员发现这实际上是一种警告信号。 To study this behavior, scientists set up a feeding station in the lab to mimic a source of nectar. 为了研究这种行为，科学家在实验室中设置了喂食站，以模拟花蜜的来源。 They then introduced foraging bees to potential dangers at the station, such as competition from rival colonies. 然后，他们让觅食蜂在喂食站面临潜在的危险，例如来自竞争蜂群的干扰。 When the foragers returned to the hive, they were observed stopping the dancing bees. 当觅食蜂返回蜂巢时，观察到它们会阻止正在跳舞的蜜蜂继续跳舞。 This led the researchers to believe that the headbutt serves as a warning to the dancers about the dangerous source of nectar. 这使研究人员相信，顶头动作实际上是在向跳舞的蜜蜂发出关于花蜜来源存在危险的警告。 The lecture also mentioned that bees can use their dance and sounds to describe different flowers and the environment. 讲座还提到，蜜蜂可以利用舞蹈和声音来描述不同的花朵和环境。 This study sheds light on the complex communication system of honeybees and the way they work together to ensure the safety of the colony and the success of their foraging efforts. 这项研究揭示了蜜蜂复杂的交流系统，以及它们如何协作以确保蜂群的安全和觅食能够成功。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678216/884ce7b0e60b48f8b9e21953869a972c.mp3","phrases":[{"en":"the waggle dance","zh":"摇摆舞"},{"en":"a good source of nectar","zh":"好的花蜜来源"},{"en":"inform other bees","zh":"通知其他蜜蜂"},{"en":"interrupted by a headbutt","zh":"被头撞打断"},{"en":"a warning signal","zh":"一个警告信号"},{"en":"set up a feeding station","zh":"设置喂食站"},{"en":"competition from rival colonies","zh":"来自竞争蜂群的竞争"},{"en":"the complex communication system","zh":"复杂的交流系统"}],"logicPhrases":[{"en":"when → a bee finds a good source of nectar","zh":"当一只蜜蜂找到优质花蜜源时"},{"en":"however → be interrupted by a headbutt from another","zh":"然而，这种舞蹈可能会被另一只蜜蜂用头撞打断"},{"en":"when → the foragers returned to the hive","zh":"当采集蜂返回蜂巢时"}]},{"id":3787,"name":"Bees' genes and Darwin","ref":"A healthy honeybee hive revolves around the queen’s egg-laying capacity of up to 2500 eggs a day. The majority of the colony comprises female workers, while a small number of male drones rely on the workers for sustenance. The worker bees’ tireless efforts in gathering resources take a toll, as they live for approximately 30 days, but the hive is continually replenished by new generations.","ana":"A healthy hive of honeybees functions like a perfect and fluid organism; at the center of all activity is the queen, the egg-laying machine. 一个健康的蜜蜂蜂群运作得就像一个完美而流畅的有机体，所有活动的中心是蜂王——这是一台产卵机器。 The queen is actually a slave to her duties, laying up to 2500 eggs a day, as many as two million in her lifetime. 实际上，蜂王被她的职责所束缚，每天最多可产卵2500枚，在其一生中总共可达约200万枚。 The worker bees are all female and make up the bulk of the colony. 工蜂都是雌性，构成了蜂群的绝大部分。 In a typical hive of 30000 bees, only about 100 are males called drones, with oversized eyes and bulky bodies. 在一个拥有三万只蜜蜂的典型蜂巢中，只有大约100只是雄性蜜蜂（称为雄蜂），它们长着大眼睛和笨重的身体。 Drones are not equipped to gather pollen or nectar and must rely on the workers to feed them. 雄蜂不具备采集花粉或花蜜的能力，必须依靠工蜂来喂养它们。 The invaluable work bees do takes its toll in the summer. 蜜蜂们所从事的宝贵工作在夏季对它们造成了巨大的损耗。 Workers only live around 30 days, literally work to death. 工蜂的寿命只有大约30天，可以说是“劳累致死”。 But the hive is constantly replenished with new generations of bees ready to go to work from the moment they hatch. 但蜂群会不断有新一代蜜蜂补充进来，这些新蜜蜂从孵化那一刻起就准备好投入工作。","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691666/f00e8f53ad104a42923abaf13654a0c4.mp3","phrases":[{"en":"a healthy hive functions like an organism","zh":"健康的蜂巢像一个有机体"},{"en":"at the center is the queen","zh":"中心是蜂后"},{"en":"laying up to 2500 eggs a day","zh":"每天最多产 2500 个卵"},{"en":"worker bees are all female","zh":"工蜂都是雌性"},{"en":"a typical hive of 30000 bees","zh":"典型蜂巢有 3 万只蜜蜂"},{"en":"only about 100 are male drones","zh":"只有约 100 只是雄蜂"},{"en":"workers only live around 30 days","zh":"工蜂只能活约 30 天"},{"en":"constantly replenished with new generations","zh":"不断补充新一代"}],"logicPhrases":[{"en":"but → constantly replenished with new generations of bees","zh":"但蜂巢不断补充新一代蜜蜂"}]},{"id":3795,"name":"Biggish city","ref":"The lecture talks about the population of cities in the past. According to the speaker, the population of cities in history could be numbered in thousands rather than millions. Interestingly enough, both Plato and Leonardo chose the same figures, twenty-five to thirty thousand inhabitants, for their ideal cities. Now, the number of citizens is kept deliberately low because a small population would be easier to manage.","ana":"We have briefly looked at some of the problems involved in running a biggish city like, say, Melbourne, keeping the road and rail systems running, policing, providing food and housing, and so on. 我们已经简要地探讨了运营一个中等规模城市（比如墨尔本）所面临的一些问题，如保持道路和铁路系统的正常运行、治安管理、提供食物和住房等等。 In another lecture, I'm going to deal with what we must now call megalopolis-cities with populations of ten million or more. 在另一场讲座中，我将讨论我们现在必须称为“大都市群”的城市——人口达一千万甚至更多的城市。 However, first I want to go back in history to when the population of cities could be numbered in the thousands rather than millions. 不过，首先我想回顾一下历史，回到城市人口是以千计而非以百万计的时代。 One of the earliest theorists of the city was, of course, Plato, who created an ideal city in his text, The Republic. 当然，最早的城市理论家之一是柏拉图，他在其著作《理想国》中构想了一座理想城市。 The population of this city would be around twenty-five to thirty thousand at most. 这座城市的人口最多大约为两万五千到三万人。 Oddly enough, the same figures were chosen by Leonardo da Vinci for his ideal cities. 有趣的是，列奥纳多·达·芬奇也为他设想的理想城市选择了同样的数字。 Now, of these twenty-five to thirty thousand inhabitants, only about five thousand would be citizens. 在这两万五千到三万居民中，只有大约五千人是真正的公民。 A reason for this might be that it is the largest number that could be addressed publicly at one time and by one person, and makes a voting system much easier to manage. 出现这种现象的一个原因可能是，这是一个人可以一次向公众公开演讲并面对的最大人数，也使投票制度更容易管理。 Also, perhaps the numbers are kept deliberately low because a large population would be harder to control, or because, in practical terms, fewer inhabitants are easier to feed from local supplies without having to depend on outside sources. 此外，这些数字可能被刻意设定得很低，因为人口太多会更难控制，或者从实际角度来看，较少的居民更容易依靠本地资源供养，而不必依赖外部供应。","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691694/829404ecaf9e4b748ec0d14937d3ff28.mp3","phrases":[{"en":"problems of running a biggish city","zh":"管理大城市的难题"},{"en":"keeping the road and rail systems running","zh":"维持道路和铁路运行"},{"en":"cities with ten million or more","zh":"人口千万以上的城市"},{"en":"Plato, who created an ideal city","zh":"柏拉图创造了理想城邦"},{"en":"his text, The Republic","zh":"他的著作理想国"},{"en":"twenty-five to thirty thousand at most","zh":"最多 2.5 到 3 万人"},{"en":"only about five thousand would be citizens","zh":"只有约 5000 人是公民"},{"en":"the largest number addressed publicly","zh":"能公开演讲的最大人数"}],"logicPhrases":[{"en":"so → on In another lecture I'm going to deal with what","zh":"那么，在另一讲中我将讨论什么"},{"en":"however → first I want to go back in history","zh":"不过，首先我想回顾历史"},{"en":"when → be numbered in the thousands","zh":"当城市人口只能以千计时"},{"en":"because → be harder to control","zh":"因为人口众多会更难控制"},{"en":"because → in practical terms fewer inhabitants are easier to feed","zh":"因为从实际来看，居民越少越容易养活"}]},{"id":4463,"name":"Boys and girls","ref":"Research shows that girls tend to outperform boys in English results due to differences in learning styles and brain mechanisms. Boys demonstrate a greater awareness of developments in physics and technology, whereas girls tend to be more interested in sociable fields. This finding suggests the need for teachers to adopt different teaching approaches for boys and girls to enhance their learning experiences.","ana":"The research shows that girls have a higher level of English results than boys in the same class, because boys and girls are different in learning styles, and their brain functions are different in mechanisms. 研究表明，在同一班级中，女生的英语成绩高于男生，这是因为男生和女生在学习风格上存在差异，大脑功能的运作机制也有所不同。 Male students were detected to be significantly more aware of the developments in the field of physics than female students. 研究发现，男生对物理学领域发展的关注度明显高于女生。 According to the content analysis results concerning this finding, unlike female students male students were more interested in technological developments. 根据与此发现相关的内容分析结果，与女生不同，男生对技术发展更感兴趣。 This finding is not surprising when the passive social role of females and the general social structure in which they tend to more sociable fields are considered. 当考虑到女性在社会中较为被动的角色，以及整体社会结构使她们倾向于选择更具社交性的领域时，这一发现并不令人意外。 This finding may have occurred due to the fact that males are generally more interested in technology than females. 这一现象的出现可能是因为男性通常比女性对技术更感兴趣。 Previous studies support this finding. 先前的研究也支持这一结论。 Boys are more simplified, and teachers' teaching style normally suits girls better than boys. 男生的思维方式相对更简单直接，而教师的教学方式通常更适合女生而非男生。 Teachers should find different teaching approaches respectively for boys and girls. 因此，教师应分别为男生和女生寻找不同的教学方法。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693061/18deb212f44a4680b6c42a0a77b1e05a.mp3","phrases":[{"en":"girls have higher English results","zh":"女生英语成绩更高"},{"en":"different in learning styles","zh":"不同的学习风格"},{"en":"brain functions are different in mechanisms","zh":"大脑功能机制不同"},{"en":"males more aware of physics developments","zh":"男生更关注物理发展"},{"en":"more interested in technology","zh":"男生对技术更感兴趣"},{"en":"the passive social role of females","zh":"女性的被动社会角色"},{"en":"teachers' style suits girls better","zh":"老师风格更适合女生"},{"en":"different teaching approaches","zh":"不同的教学方法"}],"logicPhrases":[{"en":"because → different in learning styles","zh":"因为男孩和女孩的学习风格不同"},{"en":"according to → the content analysis results concerning this finding","zh":"根据与该发现有关的内容分析结果"},{"en":"when → the passive social role of females and the general social","zh":"当女性的被动社会角色与一般社会"}]},{"id":2139,"name":"Child-rearing","ref":"Although many people think that small children should be cared for at home, being looked after outside the home can also have positive effects if the children can build relationships and learn skills. There's no evidence that it's better if one child is looked after by one person or if they are cared for in a group, but children benefit if each staff member is only responsible for a small number of them.","ana":"Many people believe that it's always better for the development of very young children under the age of three to be cared for within the home. 许多人认为，对于三岁以下的幼儿来说，在家中照料总更有利于他们的发展。 But a recent research study in the us suggests that this is not always the case. 但美国最近的一项研究表明，情况并非总是如此。 Being cared for outside the home can actually bring benefits if the children can build relationships with the workers who look after them and they have the opportunity to develop skills. 如果孩子们能够与照顾他们的工作人员建立关系，并且有机会发展技能，那么在家庭以外的环境中接受照料实际上可以带来益处。 The research also suggests that it makes no difference if one child is looked after by one person or if they're part of a group of children in a place that's similar to a sure. 研究还表明，一个孩子由一个人照顾，还是在一群孩子中（类似于托儿所）接受照料，并没有什么区别。 And we can say for sure that a situation where each member of staff looks after a small number of children is often very positive for the children involved. 我们可以肯定地说，每位工作人员照顾少量孩子的情况通常对参与其中的孩子们来说是非常积极的。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658776/654b306f1a8c43b19887f90dc1ce0a66.mp3","phrases":[{"en":"children under three cared for at home","zh":"三岁以下在家照顾"},{"en":"a recent research study in the US","zh":"美国最近的一项研究"},{"en":"cared for outside the home brings benefits","zh":"在外照顾也有好处"},{"en":"build relationships with the workers","zh":"与工作人员建立关系"},{"en":"the opportunity to develop skills","zh":"发展技能的机会"},{"en":"one person or a group of children","zh":"一个人照顾还是一群孩子"},{"en":"each member of staff looks after a small number","zh":"每位员工照看少量孩子"},{"en":"positive for the children involved","zh":"对孩子有积极影响"}],"logicPhrases":[{"en":"but → a recent research study in the us suggests","zh":"但美国最近的一项研究表明"},{"en":"if → build relationships with the workers who look","zh":"如果孩子们能与照看他们的工作人员建立关系"},{"en":"if → looked after by one person or","zh":"如果一个孩子由一个人照看，或者"},{"en":"if → they're part of a group of children in a place","zh":"如果他们是某个地方一群孩子中的一员"}]},{"id":2123,"name":"Children directors","ref":"Children are facing social difficulties with particular risks. In an experiment in a high school, the students were told to be a movie director and to choose their story structure. The students worked with each other, which involved lots of different skills. The movies they had made were actually cool. Then, the researchers tested the intervention effect, and they found this can improve their self-regulation and critical thinking skills.","ana":"Social skills are vital in enabling an individual to have and maintain positive interactions with others. 社交技能对于使个体能够与他人建立并维持积极的互动关系至关重要。 Many of these skills are crucial in making and sustaining friendships. 其中许多技能在建立和维持友谊方面非常关键。 Social interactions do not always run smoothly and an individual needs to be able to implement appropriate strategies, such as conflict resolution when difficulties in interactions arise. 社交互动并不总是一帆风顺的，当互动中出现困难时，个体需要能够采取适当的策略，例如进行冲突解决。 It is also important for individuals to have 'empathy' as it allows them to respond in an understanding and caring way to how others are feeling. 同理心对个体来说也很重要，因为它使人们能够以理解和关心的方式回应他人的感受。 Children are facing social difficulties with particular risks. 儿童正面临特殊的社交困难和风险。 Young people who do not have strong relationships with the adults in their family are even more at risk. 那些与家庭中成年人没有建立稳固关系的年轻人面临的风险更大。 In an experiment in a high school, which lasted for 8 to 12 weeks, the students were told to be a movie director and to choose their own story structure. 在一个持续了8到12周的高中实验中，学生们被要求扮演电影导演的角色，并自行选择故事结构。 The students worked with each other, which involved lots of different skills, and social interactivity. 学生们相互合作，过程中涉及多种不同的技能以及社交互动。 The movies they had made were actually cool. 他们制作的电影实际上非常精彩。 Then, the researchers tested the intervention effect, finding this can improve their self-regulation, and they found this can improve their self-regulation and critical thinking skills. 随后，研究人员测试了这种干预的效果，发现它有助于提升学生的自我调节能力以及批判性思维技能。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678653/496d77f31adf4eb9ac1de87a37790035.mp3","phrases":[{"en":"social skills are vital","zh":"社交技能很重要"},{"en":"maintaining positive interactions","zh":"维持积极的互动"},{"en":"making and sustaining friendships","zh":"建立并维持友谊"},{"en":"conflict resolution","zh":"冲突解决"},{"en":"empathy","zh":"同理心"},{"en":"an experiment in a high school, which lasted for 8 to 12 weeks","zh":"高中里持续 8 到 12 周的实验"},{"en":"choose their own story structure","zh":"自己选择故事结构"},{"en":"improve their self-regulation and critical thinking","zh":"提升自我调节和批判性思维"}],"logicPhrases":[{"en":"when → difficulties in interactions arise","zh":"当互动中出现困难时，这对个人来说也很重要"}]},{"id":4443,"name":"Citizenship curriculum","ref":"The lecture discusses a report on the development of citizenship education in schools. While it praises schools that successfully implement the curriculum, it criticizes those where the subject is marginalized. Despite some challenges, citizenship education remains valuable for developing students' core skills and values. However, its implementation faces major obstacles, including a lack of leadership commitment, insufficient teacher training, and an uncertain position in the curriculum.","ana":"Last month I published alongside my annual report a subject report on the development of citizenship in schools. 上个月，我在年度报告的同时发布了一份关于学校公民教育发展的专题报告。 The report celebrates the success of some schools in implementing the citizenship curriculum. 报告表彰了一些在实施公民课程方面取得成功的学校。 It praises those schools where there have been substantial developments in the subject, and which now go a long way towards fulfilling national curriculum requirements. 报告赞扬了那些在该学科有显著进展、并且在很大程度上满足国家课程要求的学校。 In the report, we are critical of schools which have not taken citizenship seriously, either through reluctance or lack of capacity to make appropriate provision in the curriculum. 在报告中，我们批评了那些未认真对待公民教育的学校，无论是由于不情愿还是缺乏在课程中做出适当安排的能力。 Citizenship is marginalized in the curriculum in one-fifth of schools. 在五分之一的学校中，公民教育在课程中被边缘化。 It is less well established in the curriculum than other subjects, and less well taught, and some critics have seized on this as a reason for wanting to step back from supporting it. 与其他学科相比，它在课程中的地位不够稳固，教学也不够充分，一些批评者以此为理由，希望减少对其的支持。 Yet, the progress made to date by the more committed schools suggests that the reasons for introducing citizenship are both worthwhile and can be fulfilled, given the time and resources. 然而，到目前为止，一些更投入的学校取得的进展表明，引入公民教育的理由既值得，也能够在有时间和资源的情况下实现。 Indeed, those reasons are given added weight by national and global events of the past few months. 事实上，过去几个月的国内外事件进一步强化了这些理由。 While not claiming too much, citizenship can address core skills, attitudes, and values that young people need to consider as they come to terms with a changing world. 虽然不夸大其词，公民教育可以涉及年轻人在应对变化的世界时需要考虑的核心技能、态度和价值观。 The main problems standing in the way of implementation of citizenship continue to be: the lack of commitment on the part of many school leaders; and insufficient amount of initial and in-service training provision to ensure that every school can call upon teachers with subject expertise; and its uncertain place in the curriculum. 阻碍公民教育实施的主要问题仍然是：许多学校领导缺乏投入；初始培训和在职培训不足，无法确保每所学校都能依靠具备学科专长的教师；以及它在课程中的不确定地位。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693662/79481a8bee0f464592ed1dc62a56b48a.mp3","phrases":[{"en":"a subject report on citizenship in schools","zh":"关于学校公民课的学科报告"},{"en":"schools in implementing the citizenship curriculum","zh":"成功实施公民课程"},{"en":"fulfilling national curriculum requirements","zh":"满足国家课程要求"},{"en":"citizenship is marginalized in one-fifth of schools","zh":"公民课在五分之一学校被边缘化"},{"en":"less well established and less well taught","zh":"建立和教学都不够好"},{"en":"introducing citizenship is worthwhile","zh":"引入公民课是值得的"},{"en":"core skills, attitudes and values","zh":"核心技能、态度和价值观"},{"en":"a lack of commitment from school leaders","zh":"学校领导缺乏投入"}],"logicPhrases":[{"en":"yet → the progress made to date by the more committed schools","zh":"然而，更投入的学校迄今取得的进展"},{"en":"while → not claiming too much citizenship can address core skills","zh":"尽管不宜夸大，公民教育仍可涉及核心技能"}]},{"id":3799,"name":"Climate change in Australia","ref":"This lecture mainly talks about the sea levels of Australia. When the sea level is rising, the consequences may well be huge. This is because there will be more floods. Also, climate change will mean more rain and droughts. Many mega cities are likely to be affected by the sea level rising, and this means more people have to deal with it.","ana":"Sea levels are rising and the consequences could be huge. 海平面正在上升，其后果可能是巨大的。 By the end of this century, areas that only flood once every hundred years could start to flood several times every year. 到本世纪末，那些原本每百年才淹没一次的地区可能会每年被淹多次。 The rising sea is the sleeping giant of climate change. 上升的海水是气候变化中的“沉睡巨人”。 Climates may change, you might have more drought, and you might have more rain. 气候可能会发生变化，你可能会遇到更多的干旱，也可能会有更多的降雨。 But I think for me, the biggest issue, the biggest concern is what we'll do in the coming centuries. 但对我而言，最大的问题、最令人担忧的是我们在未来几个世纪将采取什么行动。 Unfortunately, many of the megacities in the world, and that also applies to the larger cities in Australia, have been built in low-lying areas. 不幸的是，世界上许多超级大城市，以及澳大利亚的一些较大城市，都建在低洼地区。 That means much of the world's population will eventually have to deal with sea-level rise. 这意味着世界大部分人口最终都将不得不面对海平面上升的问题。 The question is, how high will the waters get? 问题是，海水会上升到多高？ Well, we go to the remote northwest of Australia and make a disturbing discovery. 我们前往澳大利亚遥远的西北部，并做出了一个令人不安的发现。 According to this geologist's work. Sea levels could ultimately go up by a staggering nine meters. 根据这位地质学家的说法，工作表明：海平面最终可能会上升高达九米，这一数字令人震惊。","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691712/0c9d23d1985a4ec5abe19da7d8a491f2.mp3","phrases":[{"en":"sea levels are rising","zh":"海平面正在上升"},{"en":"flood once every hundred years","zh":"百年一遇的洪水"},{"en":"the sleeping giant of climate change","zh":"气候变化的沉睡巨人"},{"en":"more drought and more rain","zh":"更多干旱和降雨"},{"en":"megacities built in low-lying areas","zh":"超大城市建在低洼地区"},{"en":"deal with sea-level rise","zh":"应对海平面上升"},{"en":"the remote northwest of Australia","zh":"澳大利亚偏远的西北部"},{"en":"sea levels could go up by nine meters","zh":"海平面可能上升 9 米"}],"logicPhrases":[{"en":"but → I think for me the biggest issue","zh":"但我觉得对我来说最大的问题是"},{"en":"that means → much of the world's population will eventually have to deal","zh":"这意味着世界大部分人口最终将不得不面对"},{"en":"according to → this geologist's work Sea levels could ultimately go up","zh":"根据这位地质学家的研究，海平面最终可能上升"}]},{"id":2132,"name":"Coffee","ref":"Although coffee originated in east Africa, much of it is now grown in Brazil. The crops there all stem from one individual plant, which means that they are vulnerable to contagion. As a result, the current outbreak of a disease called coffee rust is wiping out South American crops. This will probably lead to raised prices unless production elsewhere, such as in Vietnam, can be increased rapidly.","ana":"As you probably know, coffee is the second largest commodity by traded value in the world after oil. 正如你可能知道的那样，咖啡是世界上仅次于石油的第二大交易商品。 You probably also know that it's grown in Brazil, 你可能也知道它生长在巴西， but you may not realize that it's not native to that country. 但你可能没有意识到它不是巴西原产的。 It originated in East Africa. 它起源于东非。 So if it came from there, how did it cross the Pacific? 如果它来自那里，它是如何穿越太平洋的？ Well, the Dutch took coffee to a number of different places around the world, including South America, where it thrived. 嗯，荷兰人把咖啡带到世界各地，包括南美洲，在那里它蓬勃发展。 Nowadays, all the coffee cultivated in Brazil comes from that one seedling, which was of a variety called Robusta. 如今，巴西种植的所有咖啡都来自那棵幼苗，它是一种叫做Robusta的品种。 Now, because it all comes from the one plant, genetically, Robusta isn't particularly varied, 现在，因为它们都来自一种植物，从基因上讲，Robusta并不是特别多样化， which unfortunately means its resistance to disease is, well, rather on the low side. 这不幸地意味着它对疾病的抵抗力很低。 And well, this is exactly what has happened recently. 这正是最近发生的事情。 A pathogen called coffee rust is ravaging coffee crops across South America. 一种被称为咖啡锈病的病原体正在席卷南美洲的咖啡作物。 So what it looks like is that the price of coffee is, well, going to skyrocket on the wholesale market, 所以看起来咖啡的价格在批发市场上将会飞涨， unless production is increased dramatically in a short space of time in other countries such as, you know, Vietnam, which seems rather unlikely. 除非在其他国家，比如越南，产量在短时间内急剧增加，这似乎是不太可能的。 So in short, there's a good chance that your morning coffee is going to become, well, quite pricey and pretty soon at that. 所以，简而言之，你早上的咖啡很有可能会变得相当昂贵，而且很快就会如此。","audio":"https://ti.koolearn.com/upload/ti/sardine/2656000-2657000/2656875/cca7644f97e043108c257f4fa094be96.mp3","phrases":[{"en":"the second largest commodity by traded value","zh":"交易额第二大的商品"},{"en":"originated in East Africa","zh":"起源于东非"},{"en":"the Dutch took coffee around the world","zh":"荷兰人把咖啡带到世界各地"},{"en":"all Brazilian coffee from one seedling","zh":"巴西咖啡都来自一株幼苗"},{"en":"a variety called Robusta","zh":"一个叫 Robusta 的品种"},{"en":"its resistance to disease is","zh":"它的抗病性很低"},{"en":"coffee rust is ravaging coffee crops","zh":"咖啡锈病正在毁坏作物"},{"en":"the price will skyrocket","zh":"价格将暴涨"}],"logicPhrases":[{"en":"but → may not realize that it's not native","zh":"但你可能没意识到，它并非原产于当地"},{"en":"so → came from there","zh":"所以，如果它来自那里"},{"en":"if → came from there how did it cross the Pacific","zh":"如果它来自那里，它又是怎么跨越太平洋的呢？"},{"en":"because → all comes from the one plant","zh":"因为它全都来自同一种植物"},{"en":"so → what it looks like is that the price of coffee","zh":"所以看起来，咖啡的价格"},{"en":"so → in short there's a good chance that your morning coffee","zh":"所以简而言之，你早上的咖啡很可能"}]},{"id":2125,"name":"Cosmology and maths","ref":"In this lecture, the speaker explores the profound connection between mathematics and cosmology, arguing that mathematics is an inherent part of nature itself, not just a tool for explanation. They emphasize the omnipresence of mathematical patterns in the natural world, linking them to the workings of the universe. The speaker concludes that mathematics is a fundamental aspect of the cosmos, shaping our understanding and enabling us to interpret the universe.","ana":"The speaker is discussing the intricate relationship between mathematics and cosmology. 演讲者正在探讨数学与宇宙学之间复杂的联系。 Back in the 1970s, the lecturer pursued a career in physics while actively engaging in the field of cosmology. 早在20世纪70年代，这位讲师就投身于物理学领域，并积极从事宇宙学的研究。 Throughout this period, scientists passionately sought to harness the power of mathematics as a means to unravel the mysteries of the universe. 在这一时期，科学家们热情地探索如何利用数学的力量来揭开宇宙的奥秘。 According to the speaker, this quest for mathematical understanding led them to a fascinating realization: mathematics is an omnipresent force in the natural world. 根据演讲者的说法，这种对数学理解的追求使他们得出了一个引人深思的结论：数学是自然界中无处不在的一种力量。 In the speaker's perspective, mathematics is not just a tool used by scientists to explain the universe; rather, it is an inherent and fundamental aspect of nature itself. 在演讲者看来，数学不仅仅是科学家用来解释宇宙的工具；相反，它是自然本身固有且基本的一部分。 Nature, cosmology, and mathematics are all interconnected, forming a complex web of relationships that shape our understanding of the cosmos. 自然、宇宙学和数学彼此相互关联，构成了一个复杂的关系网络，塑造了我们对宇宙的理解。 As the speaker delves into the heart of their argument, they emphasize that mathematics can be found virtually everywhere in nature. 当演讲者深入阐述其观点时，他强调数学几乎在自然界的所有地方都能找到。 From the graceful spiral of a seashell to the precise orbits of celestial bodies, mathematical patterns and principles underpin the very fabric of our world. 从贝壳优雅的螺旋形状到天体精确的运行轨道，数学的模式和原理支撑着我们世界的本质结构。 These mathematical foundations allow us to comprehend and interpret the workings of the universe, making it an indispensable language for cosmologists. 这些数学基础使我们能够理解和诠释宇宙的运行机制，使其成为宇宙学家不可或缺的语言。 In conclusion, the speaker asserts that mathematics is the underlying system that enables us to explain the universe and nature. 最后，演讲者指出，数学是我们解释宇宙和自然现象的基础系统。 It is not merely a tool but a fundamental aspect of the cosmos itself. 它不仅仅是一种工具，更是宇宙本身的基本组成部分。 This profound connection between mathematics, nature, and cosmology has guided scientists in their pursuit of knowledge and continues to shape our understanding of the universe's grand design. 数学、自然与宇宙学之间这种深刻的联系，指引着科学家们不断追求知识，并持续塑造着我们对宇宙宏伟蓝图的理解。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678217/2e0843e5401d4966b5e07fb41a80158c.mp3","phrases":[{"en":"relationship between mathematics and cosmology","zh":"数学与宇宙学的关系"},{"en":"pursued a career in physics","zh":"从事物理学研究"},{"en":"harness the power of mathematics","zh":"利用数学的力量"},{"en":"unravel the mysteries of the universe","zh":"解开宇宙的奥秘"},{"en":"mathematics is omnipresent in nature","zh":"数学在自然界无处不在"},{"en":"spiral of a seashell","zh":"海螺的螺旋"},{"en":"the precise orbits of celestial bodies","zh":"天体的精确轨道"},{"en":"mathematics is the underlying system","zh":"数学是底层系统"}],"logicPhrases":[{"en":"while → actively engaging in the field of cosmology","zh":"在积极投身宇宙学领域时"},{"en":"according to → the speaker this quest for mathematical understanding led them","zh":"据演讲者称，这种对数学理解的追求引领了他们"},{"en":"but → a fundamental aspect of the cosmos itself","zh":"但宇宙本身的一个基本方面"}]},{"id":3788,"name":"Credit card experiment","ref":"In an experiment on customers’ behaviors, one group of inactive credit card users received a message offering benefits that they could gain by using the cards, while the other group received a message implying a penalty if it’s not used. The result shows that customers are more motivated by a potential loss when not using this card than the benefit they could gain by using the card.","ana":"A recent study on customer behavior investigated the impact of different messaging strategies on inactive credit card users. 最近一项关于消费者行为的研究调查了不同信息策略对不活跃信用卡用户的影响。 One group was presented with a message emphasizing the benefits they could enjoy by using their cards, while the other group received a communication implying a penalty for non-use. 其中一组收到的信息强调使用信用卡可以带来的好处，而另一组则收到了暗示不使用卡片将面临处罚的通知。 Surprisingly, the results revealed that customers were more influenced by the potential loss of not using the card than the potential benefits of using it. 令人惊讶的是，研究结果表明，客户更容易受到“不使用卡片可能导致损失”的影响，而不是“使用卡片可能获得好处”的激励。 This suggests that the fear of missing out or facing a penalty may be a stronger motivator for customer action than the promise of rewards. 这表明，与奖励承诺相比，对错失机会或遭受处罚的担忧可能是促使客户采取行动的更强动机。 These findings have important implications for businesses and marketers seeking to engage inactive customers, indicating that messaging focusing on potential losses or penalties may be more effective in encouraging customer activity. 这些发现对于希望重新激活不活跃客户的商家和营销人员具有重要意义，表明强调潜在损失或处罚的信息可能在激发客户行为方面更为有效。 Further research in this area could lead to a better understanding of consumer decision-making and the psychological factors driving behavior. 该领域的进一步研究有助于更深入地理解消费者的决策过程及其背后的心理驱动因素。","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691680/c5b7e21242ed45fbb17babb92050becd.mp3","phrases":[{"en":"study on customer behavior","zh":"一项顾客行为研究"},{"en":"the impact of different messaging strategies","zh":"信息策略的影响"},{"en":"emphasizing the benefits of using cards","zh":"强调用卡的好处"},{"en":"implying a penalty for non-use","zh":"暗示不使用的惩罚"},{"en":"influenced by the potential loss","zh":"受潜在损失影响"},{"en":"the fear of missing out","zh":"错失恐惧"},{"en":"a stronger motivator than rewards","zh":"比奖励更强的动力"},{"en":"implications for businesses and marketers","zh":"对企业与营销人员的启示"}],"logicPhrases":[{"en":"while → the other group received a communication implying a penalty","zh":"而另一组收到了一则暗示惩罚的通知"}]},{"id":4469,"name":"Curator","ref":"This topic is about practices, techniques and methods of curators. Museums are good at creating and communicating history where museums are defined by their collections. Curators understand material culture as evidence of people's life to understand people. Curators are different from other historians. Academic historians concentrated on words and photographers concentrate on images, while curators deal with objects that are evidence of the past. They arrange objects into exhibitions.","ana":"I am going to talk today mostly about what I do as a curator here at the National Museum of Australia but I want to draw some generalities from that in terms of a series of curatorial practices, tools, techniques and methods that I think could be of interest to your students and to you in developing extension history courses. 今天我主要想谈谈我在澳大利亚国家博物馆作为策展人的工作，但我也希望通过讨论一系列我认为可能对你们的学生以及你们在开发扩展历史课程时感兴趣的策展实践、工具、技术和方法来从中得出一些普遍性的结论。 I want to talk about what I do as a curator and then from that also talk a bit about the kinds of history that I think museums are particularly good at creating and communicating. 我想谈谈我作为策展人的工作，然后基于此也谈谈我认为博物馆特别擅长创造和传播的历史类型。 I think this is something I would really like to discuss because it is not necessarily very well understood is that I think museums, as Dave insisted by putting up my quote in his slide, create a very particular kind of history. 我认为这是一个非常值得讨论的话题，因为并不是所有人都充分理解这一点，即我认为博物馆（正如Dave在他的幻灯片中引用我的话所坚持的那样）创造了一种非常特殊的历史。 It’s not the kind of history that gets created in books or in dating films or in compositions, it’s a very particular kind of history that grows out of the fact that museums are centrally interested and defined by their collections. 这种历史不是书中、约会电影或作品中创造的那种历史，而是一种非常特殊的由博物馆对其藏品的核心兴趣和定义中产生的历史。 I should say that is not an uncontested view of museums but it is certainly my view of museums. 应该指出的是，这不是对博物馆没有争议的看法，但这确实是我的看法。 Curators try to understand material culture as evidence of other people’s lives as a means to try to understand other people - what they look like, what they did, how they made a living, what they hoped for in their lives, how they tried to construct their world and why they made particular choices. 策展人尝试将物质文化理解为他人生活证据的一种方式，以试图理解其他人——他们的长相、他们做了什么、他们如何谋生、他们在生活中希望得到什么、他们如何试图构建自己的世界以及为什么做出特定的选择。 One way in which curators differ from other historians is therefore in terms of how we interrogate the past, what elements we use to communicate the past. 因此，策展人与其他历史学家的一个不同之处在于我们如何审视过去，以及我们使用哪些元素来传达过去。 Most academic historians are trained very much in the discipline of words and they concentrate on words still today, although it is changing a little bit. 大多数学术历史学家受过严格的文字训练，并且直到今天仍然专注于文字，尽管这种情况正在发生一点变化。 If you go through university history primarily you are encouraged to draw on things like archival accounts, manuscripts and now oral histories, and most of that work is actually promulgated in the form of books. 如果你学习大学历史，主要被鼓励利用档案记录、手稿，现在还有口述历史等资源，而且大部分研究成果实际上是以书籍的形式传播的。 There are also other kinds of historians. Obviously, filmmakers and photographers concentrate on creating images of the world and arranging them in meaningful sequences, but curators attend to objects. 也有其他类型的历史学家。显然，电影制作者和摄影师专注于创建世界的图像并将它们排列成有意义的序列，但策展人关注的是物品。 We look at objects as evidence of the past and try to arrange objects in meaningful ways called exhibitions. 我们将物品视为过去的证据，并尝试以被称为展览的有意义的方式安排这些物品。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693067/a6f38701ceaa4203ace15d85bcaab75e.mp3","phrases":[{"en":"what I do as a curator","zh":"我作为策展人的工作"},{"en":"curatorial practices, tools, techniques and methods","zh":"策展实践、工具和方法"},{"en":"museums create a particular kind of history","zh":"博物馆创造一种特殊的历史"},{"en":"defined by their collections","zh":"由他们的藏品定义"},{"en":"Curators try to understand material culture","zh":"策展人理解物质文化"},{"en":"curators differ from other historians","zh":"策展人如何区别于其他历史学家"},{"en":"academic historians concentrate on words","zh":"学术历史学家专注文字"},{"en":"curators attend to objects in exhibitions","zh":"策展人关注展览中的物品"}],"logicPhrases":[{"en":"but → I want to draw some generalities from that in terms","zh":"但我想从中归纳出一些一般性结论"},{"en":"because → is not necessarily very well understood is that I","zh":"因为有一点未必得到充分理解，那就是我"},{"en":"but → is certainly my view of museums","zh":"但这确实是我对博物馆的看法"},{"en":"therefore → in terms of how we interrogate the past","zh":"因此，就我们如何追问过去而言"},{"en":"although → is changing a little bit","zh":"尽管情况正在略有改变"},{"en":"if → go through university history primarily you are encouraged","zh":"如果你在大学里主要学历史，你会受到鼓励"},{"en":"but → curators attend to objects","zh":"但策展人关注物件。我们把物件视为证据。"}]},{"id":4447,"name":"Development of genes","ref":"The lecture discusses the rapid evolution of human cognitive function over the past 500,000 years. This fast development only occurs through changes in a small number of genes, because requiring multiple gene changes makes such rapid evolution impossible. Consequently, the genetic differences between ancient humans and modern people remain relatively small. Ultimately, a limited number of genes are responsible for endowing humans with powerful cognitive abilities.","ana":"The pace, the pace of which that the human minds have evolved over the last half million years and more recently the last 200,000 years has been so frighteningly rapid that the evolution of cognitive function and perception in different ways, can only happen to the actions of a small number of genes. 人类心智在过去五十万年，尤其是最近二十万年的进化速度如此惊人，以至于认知功能和感知以不同方式的演化，只可能依赖少量基因的作用。 If one needed to adapt a dozen of genes changes and concert, in order to acquire the penetrating minds that we now have, which our ancestors 500,000 years ago didn't have, the evolution could not have taken, could not have occurred so quickly. 如果为了获得我们现在拥有的深刻心智而必须同时改变十几个基因，而我们的五十万年前的祖先并不具备这些心智，那么这种进化不可能发生得如此迅速。 And for that reason alone, one begins to suspect that the genetic differences between people who lived 500,000 years ago sever that cognitive functions than ours are not so large. 仅凭这一点，人们就会怀疑，五十万年前的人与我们在认知功能上的基因差异并不大。 Therefore, a rather small number of genes, maybe responsible for comforting us that powerful minds which we now, which the most of us now processed. 因此，可能只有少量基因负责塑造我们现在的大脑，使我们拥有如此强大的心智。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693670/a937d5e8c5b74337ac2aaa610ab4d062.mp3","phrases":[{"en":"the pace of human minds evolving","zh":"人类心智进化的速度"},{"en":"the last 200,000 years","zh":"过去 20 万年"},{"en":"the evolution of cognitive function and perception","zh":"认知功能和感知的进化"},{"en":"the actions of a small number of genes","zh":"少量基因的作用"},{"en":"a dozen gene changes in concert","zh":"十几个基因协同变化"},{"en":"the penetrating minds that we now have","zh":"我们现在拥有的敏锐心智"},{"en":"our ancestors 500,000 years ago","zh":"50 万年前的祖先"},{"en":"the genetic differences are not so large","zh":"基因差异并不大"}],"logicPhrases":[{"en":"so → frighteningly rapid that the evolution of cognitive function and perception","zh":"认知功能与感知的进化快得如此惊人，以至于……"},{"en":"if → one needed to adapt a dozen of genes changes","zh":"如果只需适应十几处基因变化"},{"en":"in order to → acquire the penetrating minds that we now","zh":"为了获得我们如今拥有的敏锐头脑"},{"en":"so → quickly And for that reason alone","zh":"如此迅速，且仅凭这一原因"},{"en":"so → large Therefore a rather small number of genes","zh":"如此之大，因此只需相当少的基因"},{"en":"therefore → a rather small number of genes","zh":"因此，基因数量相当少"}]},{"id":4450,"name":"Devolution of power","ref":"The lecture discusses the concept of devolution, which involves moving governmental power from the federal to the state level. While Republicans support this approach to bring power closer to the people, the speaker argues that it actually moves power away from citizens. This is because a hidden part of the power system, specifically private power, remains unknown to the public.","ana":"Well, that’s one aspect of what’s called, reducing government - modifying government, to be more precise. 嗯，这就是所谓“缩减政府”的一个方面——更准确地说，是对政府进行调整。 Another aspect of it is what’s called “devolution” - reducing - moving governmental power from the Federal to the State level. 另一个方面是所谓的“权力下放”——将政府权力从联邦转移到州一级。 And that has a kind of a rationale which you hear all over the time - place. 这种做法有一种你随处可听到的理由。 For example, there was an op-ed a couple of weeks ago in the New York Times by John Cogan - Hoover Institute at Stanford, who has pointed out what he called a philosophical issue that divides the Democrats from the Republicans. 例如，几周前，《纽约时报》刊登了斯坦福胡佛研究所的约翰·科根的评论文章，他指出了一个哲学问题，这个问题划分了民主党和共和党。 The philosophical issue is that the Democrats believe in big government and entitlements, and the Republicans believe in getting power down closer to the people, to the States, because they’re kind of populist types. 这个哲学问题是，民主党相信大政府和福利权利，而共和党则相信将权力下放给人民，更靠近各州，因为他们偏向民粹主义。 Well, it takes about maybe three seconds’ thought to realize that moving power down to the States, in funding and so on, is just moving it away from the people, for a perfectly elementary reason: there’s a hidden part of the system - of the power system that you’re not supposed to know about, or think about, and that’s private power. 其实，只需三秒钟就能意识到，将权力下放到各州——包括资金等——只是将权力从人民手中移开，原因很简单：系统中存在一个隐藏部分——你不应该知道或考虑的权力部分，那就是私人权力。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693678/e503c508e4d445bbb26798aec4cbcb1e.mp3","phrases":[{"en":"reducing and modifying government","zh":"缩减和调整政府"},{"en":"devolution: moving power from Federal to State","zh":"权力下放：从联邦到州"},{"en":"an op-ed in the New York Times","zh":"纽约时报的专栏"},{"en":"Hoover Institute at Stanford","zh":"斯坦福胡佛研究所"},{"en":"a philosophical issue dividing Democrats and Republicans","zh":"分裂两党的哲学问题"},{"en":"Democrats believe in big government","zh":"民主党信奉大政府"},{"en":"Republicans want power closer to the people","zh":"共和党希望权力更贴近人民"},{"en":"a hidden part: private power","zh":"隐藏的部分：私人权力"}],"logicPhrases":[{"en":"for example → an op-ed a couple of weeks ago","zh":"例如，几周前有一篇评论文章"},{"en":"because → they’re kind of populist types","zh":"因为他们算是那种民粹派"},{"en":"so → just moving it away from the people","zh":"所以，这只是在把它从民众身边移开"}]},{"id":2130,"name":"Dialects","ref":"The lecture discusses the differences between dialects and accents, emphasizing the influence of geography, society, family, and education in shaping dialects. It highlights the dynamic nature of language by noting that speakers of Received Pronunciation may integrate words from other dialects. The lecture provides a comprehensive analysis of the influential role of dialects and accents in communication and cultural preservation, showcasing the diverse and evolving nature of language.","ana":"The lecture delivers a detailed exploration of the distinctions between dialects and accents. 讲座详细探讨了方言与口音之间的区别。 It underscores the shaping of dialects by diverse influences such as geography, society, family, and education. 它强调了地理、社会、家庭和教育等多种因素对方言形成的影响。 It is particularly notable that even speakers of Received Pronunciation may integrate words from other dialects, highlighting the dynamic nature of language. 值得注意的是，即使是标准发音的使用者也可能融入来自其他方言的词汇，突显了语言的动态特性。 This underscores the adaptability and interconnectedness of dialects within our linguistic landscape. 这进一步强调了在我们的语言环境中，方言所具有的适应性及其相互关联的特性。 Overall, the lecture presents a comprehensive analysis of the nuanced differences between dialects and accents, bringing to light their influential role in shaping communication and preserving cultural identities. 总体而言，讲座对方言与口音之间细微差别的分析，揭示了它们在塑造交流方式和保护文化身份方面的重要作用。 It shines a spotlight on the diverse and evolving nature of language, and how it intricately reflects our individual and collective experiences. 讲座也聚焦于语言多样且不断演变的本质，以及它如何深刻反映了我们个人与集体的经历。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678651/197d3bf048df412eb723f576aea84447.mp3","phrases":[{"en":"the distinctions between dialects and accents","zh":"方言与口音的区别"},{"en":"shaped by geography, society, family and education","zh":"受地理、社会、家庭和教育影响"},{"en":"speakers of Received Pronunciation","zh":"标准发音的使用者"},{"en":"integrate words from other dialects","zh":"融入其他方言的词"},{"en":"the dynamic nature of language","zh":"语言的动态性"},{"en":"the adaptability of dialects","zh":"方言的适应性"},{"en":"preserving cultural identities","zh":"保存文化身份"},{"en":"the diverse and evolving nature of language","zh":"语言不断演变"}],"logicPhrases":[]},{"id":4448,"name":"Drug ads","ref":"The lecture discusses the increase in pharmaceutical TV advertising and its impact on consumers. Although the information is technically accurate, researchers find the ads misleading. They exaggerate the negative impact of health conditions and suggest that medication magically restores life control. Furthermore, these advertisements ignore lifestyle changes that help treat conditions, highlighting that prescription drug marketing differs significantly from ordinary product promotion.","ana":"The amount of money drug companies spend on TV ads has doubled in recent years. 近年来，制药公司在电视广告上的支出已翻了一番。 And it's no wonder: studies show the commercials' work: consumers go to their doctors with a suggestion for a prescription drug they saw advertised on TV. 这不足为奇：研究显示这些广告确实有效——消费者会带着在电视上看到的处方药建议去看医生。 Now a study in the Annals of Family Medicine raises questions about the message these ads promote, NPR's Patty Neighmond reports. 据NPR的帕蒂·奈蒙德报道，《家庭医学年鉴》的一项研究对这些广告传递的信息提出了质疑。 You're most likely to see drug ads during prime time, especially around the news. 你最有可能在黄金时段看到药品广告，尤其是在新闻时段附近。 Researchers analyzed 38 ads aimed at people with conditions like hypertension, herpes, high cholesterol, depression, arthritis, and allergies. 研究人员分析了38则针对高血压、疱疹、高胆固醇、抑郁症、关节炎和过敏等疾病患者的广告。 The drug industry says the ads arm consumers with information. 制药行业称这些广告为消费者提供了信息。 But researchers found that though the information was technically accurate, the tone was misleading. 但研究人员发现，尽管信息在技术上是准确的，其语气却具有误导性。 UCLA psychologist Dominick Frosch headed the study. 加州大学洛杉矶分校心理学家多米尼克·弗罗施主持了这项研究。 \"What we would see in these ads is that before taking the prescription drug, the character's life was out of control and the loss of control really extended beyond just the impact of the health condition,\" “我们在这些广告中看到的是，在服用处方药之前，角色的生活失控，而这种失控远远超出了健康状况本身的影响，” For example, herpes patients were portrayed as being incapacitated for days, insomniacs utterly out of synch on the job and depressed patients friendless and boring at parties. 例如，疱疹患者被描绘成几天无法正常生活，失眠者在工作中完全失去节奏，抑郁患者在聚会上孤单无趣。 \"When the character is then shown taking the drug, he then magically regains complete control of his life.\" “当广告中角色服药后，他就神奇地完全掌控了自己的生活。” None of the ads, of course, mentioned lifestyle changes that could also help treat the condition. 当然，这些广告都没有提到可能有助于治疗疾病的生活方式改变。 After all, it's mass marketing. 毕竟，这是大众营销。 But in this case, Frosch says, prescription medications are not like soap. 但弗罗施表示，在这种情况下，处方药可不像香皂。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693671/cc9481aecafb4e9c860d593bbf98d849.mp3","phrases":[{"en":"on TV ads has doubled","zh":"电视广告支出翻倍"},{"en":"consumers ask doctors for advertised drugs","zh":"消费者向医生要广告中的药"},{"en":"a study in the Annals of Family Medicine","zh":"家庭医学年刊的研究"},{"en":"drug ads during prime time","zh":"黄金时段的药品广告"},{"en":"researchers analyzed 38 ads","zh":"研究者分析了 38 个广告"},{"en":"the tone was misleading","zh":"语气具有误导性"},{"en":"the character's life was out of control","zh":"角色的生活失控"},{"en":"none mentioned lifestyle changes","zh":"都没提到生活方式的改变"}],"logicPhrases":[{"en":"especially → around the news Researchers analyzed 38 ads aimed at people","zh":"尤其是在新闻方面，研究人员分析了38则面向大众的广告"},{"en":"but → researchers found that though the information was technically accurate","zh":"但研究人员发现，尽管这些信息在技术上是准确的"},{"en":"though → technically accurate","zh":"尽管这些信息在技术上是准确的"},{"en":"for example → portrayed as being incapacitated for days","zh":"例如，疱疹患者被描绘成会连续数日无法正常活动"},{"en":"when → then shown taking the drug","zh":"当随后画面显示该角色服用这种药物时"},{"en":"but → in this case Frosch says","zh":"但弗罗施说，在这种情况下"}]},{"id":4445,"name":"Einstein","ref":"The lecture explains the evolution of the universe concept. Traditionally, people view space as a completely fixed and unchangeable stage for celestial bodies. However, Einstein transforms this perspective by predicting that space itself undergoes continuous dynamic change. Furthermore, the astronomer Edwin Hubble makes the crucial discovery that confirms his prediction, proving that the universe is truly dynamic rather than static.","ana":"For thousands of years, philosophers and astronomers and thinkers of all sorts have imagined that the universe, the space around us, was rather like this floor in front of us. 几千年来，哲学家、天文学家以及各种思想家一直认为宇宙——我们周围的空间——就像我们面前的地板一样。 It was fixed and unchangeable, and things happen on it, just as people walk around. 它是固定且不变的，事件发生在其上，就像人们在地板上行走一样。 So the stars, the comets, and the planets, and the other heavenly bodies moved around and traced down their parts on this completely unchanging stage of space. 因此，恒星、彗星、行星以及其他天体在这个完全不变的空间舞台上移动并演绎它们的轨迹。 In the 20th century, as the result of Einstein’s work, that view of the universe was completely transformed. 20世纪，由于爱因斯坦的工作，这种对宇宙的看法被彻底改变。 We began to understand that there was no absolutely fixed stage of space at all on which all celestial notions were played out. 我们开始明白，根本不存在一个绝对固定的空间舞台来承载所有天体的活动。 But in some sense, on the larger scale in the universe, the space itself was in this state of a continuous dynamic change. 但从某种意义上说，在宇宙的更大尺度上，空间本身处于持续动态变化的状态。 That was a prediction made by Einstein. 这是爱因斯坦所做的一个预测。 But it was the astronomer Edwin Hubble who is the owner of the honor of making the discovery that our universe was really like that. 但发现我们的宇宙确实如此的荣誉属于天文学家埃德温·哈勃（Edwin Hubble）。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693664/b44c4c30aa5340068ffe6941389057a0.mp3","phrases":[{"en":"philosophers and astronomers imagined the universe","zh":"哲学家和天文学家想象宇宙"},{"en":"the universe was like this floor","zh":"宇宙像这块地板"},{"en":"fixed and unchangeable","zh":"固定不变"},{"en":"the space was an unchanging stage","zh":"空间是不变的舞台"},{"en":"Einstein's work transformed that view","zh":"爱因斯坦的工作改变了这一观点"},{"en":"no absolutely fixed stage of space","zh":"没有绝对固定的空间舞台"},{"en":"space itself was in continuous dynamic change","zh":"空间本身在持续动态变化"},{"en":"the astronomer Edwin Hubble made the discovery","zh":"天文学家哈勃做出了发现"}],"logicPhrases":[{"en":"so → the stars the comets and the planets","zh":"所以，恒星、彗星和行星"},{"en":"but → in some sense on the larger scale in the universe","zh":"但在某种意义上，在宇宙的更大尺度上"},{"en":"but → was the astronomer Edwin Hubble who is the owner","zh":"但天文学家埃德温·哈勃才是其拥有者"}]},{"id":2138,"name":"Enough sleep","ref":"Several studies have found that not getting enough sleep can cause serious problems. One particular study showed that lack of sleep makes it more difficult to complete tasks and more difficult to concentrate on simple tasks. This means that getting too little sleep can be dangerous and expensive. lt's become clear that not getting enough sleep has negative effects on how people do things at work and at home.","ana":"Several recent studies from researchers around the world all suggest that not getting enough sleep causes people more serious problems than they might think. 来自世界各地研究人员最近的几项研究都表明，睡眠不足给人们带来的问题比他们想象的要严重得多。 One interesting study carried out last year has shown that not getting enough sleep, so less than 7 hours a night, makes it twice as difficult to complete a task which requires you to do several different things in a specific order. 去年进行的一项有趣的研究表明，睡眠不足，即每晚睡眠少于 7 小时，会使完成需要按特定顺序执行多项任务的工作难度增加一倍。 Even more interesting is the result that you'll find it three times as difficult to concentrate on a simple task if you've had too little sleep. 更令人惊讶的是，如果你睡眠不足，你会发现专注于一项简单的任务的难度会增加两倍。 Those are amazing results, and they mean that if you aren't sleeping enough, you basically need to take care all of the time because you could easily make mistakes which put you in danger or cost you a lot of money. 这些结果令人震惊，这意味着如果你睡眠不足，基本上需要时刻小心，因为你很容易犯下可能让你身处险境或损失大量金钱的错误。 For the first time, we're seeing very clearly that not getting enough sleep has very negative effects on people's ability to perform, both at work and in the home. 我们首次非常清楚地看到，睡眠不足对人们在工作和家庭中的表现能力都有非常负面的影响。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658775/771665f267b047f28b286914ef60770b.mp3","phrases":[{"en":"Several recent studies from researchers","zh":"来自研究人员的几项近期研究"},{"en":"not getting enough sleep causes","zh":"睡眠不足导致"},{"en":"One interesting study carried out last year","zh":"去年进行的一项有趣研究"},{"en":"less than 7 hours a night","zh":"每晚少于7小时"},{"en":"twice as difficult to complete a task","zh":"完成任务难度加倍"},{"en":"three times as difficult to concentrate","zh":"集中注意力难三倍"},{"en":"negative effects on people's ability to perform","zh":"对人们表现能力的负面影响"},{"en":"both at work and in the home","zh":"在工作和家庭中"}],"logicPhrases":[{"en":"so → less than 7 hours a night","zh":"所以每晚少于7小时"},{"en":"if → too little sleep","zh":"如果你睡眠太少"},{"en":"if → aren't sleeping enough you basically need to take care","zh":"如果你睡眠不足，基本上就得当心"},{"en":"because → could easily make mistakes which put you in danger","zh":"因为你很容易犯错，从而让自己陷入危险"}]},{"id":3803,"name":"Experiment on climate change","ref":"Climate change is one of the challenges facing our world today. In the 1930s, when people first noticed climate change, they have been trying to deal with it, but it is difficult to observe changes in climate from area to area. Although scientists have different views on climate change, cutting greenhouse gas emissions, saving energy, and driving fewer miles may help keep the earth cooler in the future.","ana":"Humans are faced with many challenges, one of which is climate change. 人类面临着许多挑战，其中之一就是气候变化。 An experiment was conducted on the environment and climate in the 1930s when people first noticed climate change. 在20世纪30年代，当人们首次注意到气候变化时，曾开展过相关的环境与气候实验。 Humans have been trying to change their lifestyles to deal with it, but the observation of climate change is difficult from area to area. 人类一直在尝试改变生活方式以应对气候变化，但从地区到地区，对气候变化的观察却十分困难。 A method is introduced to help understand the mechanism of the climate system. 为了解决这个问题，一种方法被引入，用以帮助理解气候系统的机制。 Researchers predict that temperatures will increase about two to 10 degrees Fahrenheit by the end of the century. 研究人员预测，到本世纪末，全球气温将上升约2至10华氏度。 What's less certain is what rising temperatures mean for the planet. 目前尚不确定的是，气温上升究竟会对地球意味着什么。 Some climate models predict subtle changes. 一些气候模型预测变化将是温和的。 Others forecast rising sea levels, which could flood coastal areas around the world. 另一些则预测海平面将上升，可能淹没全球沿海地区。 Weather patterns could change, making hurricanes more frequent. 天气模式也可能发生变化，使飓风更加频繁。 Severe droughts could become more common in warm areas, and species unable to adapt to the changing conditions would face extinction, although much remains to be learned about global warming. 严重干旱可能在温暖地区变得更加常见，而无法适应变化的物种将面临灭绝，尽管关于全球变暖仍有许多未知之处。 Many organizations advocate cutting greenhouse gas emissions to reduce the impact of global warming. 许多组织提倡减少温室气体排放，以减轻全球变暖的影响。 Consumers can help by saving energy around the house, switching to compact fluorescent light bulbs, and driving fewer miles in the car each week. 消费者也可以做出贡献，比如在家节约能源、改用紧凑型荧光灯泡，以及每周减少驾车行驶的里程。 These simple changes may help keep the earth cooler in the future. 这些简单的改变可能有助于在未来让地球保持更凉爽。","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691719/b572ab058a1f4494b40d0926ab105f57.mp3","phrases":[{"en":"humans are faced with climate change","zh":"人类面临气候变化"},{"en":"an experiment conducted in the 1930s","zh":"1930 年代做的实验"},{"en":"change their lifestyles to deal with it","zh":"改变生活方式来应对"},{"en":"the observation of climate change is difficult","zh":"观察气候变化很难"},{"en":"temperatures will increase about two to 10 degrees","zh":"气温将上升 2 到 10 度"},{"e
