n":"rising sea levels, which could flood coastal areas","zh":"海平面上升可能淹没沿海"},{"en":"hurricanes more frequent","zh":"飓风更频繁"},{"en":"species face extinction","zh":"物种面临灭绝"}],"logicPhrases":[{"en":"when → first noticed climate change","zh":"当人们最初注意到气候变化时"},{"en":"but → difficult from area","zh":"但从区域角度观测气候变化很困难"},{"en":"although → much remains to be learned about global warming","zh":"尽管关于全球变暖仍有很多需要了解"}]},{"id":4462,"name":"Free sugars","ref":"Both fruits and milk contain sugar, and this sugar is a healthy sugar. Unhealthy sugar is normally found in desserts and ice cream. It's much easier to consume excess sugar from foods and drinks that contain \"free sugars\". Free sugars in this case have been removed from their naturally occurring source. In addition, directly eating fruits is better because the human body can process them easily.","ana":"Both fruits and milk contain sugar, and this sugar is healthy sugar. 水果和牛奶都含有糖分，这种糖属于健康的糖。 Many people have heard that sugar is bad, and think that this must also therefore apply to fruits. 许多人听说过糖对健康有害，因此认为水果中的糖也一定是有害的。 Unhealthy sugar is normally found in desserts, ice cream etc. 不健康的糖通常存在于甜点、冰淇淋等食物中。 It's much easier to consume excess sugar from foods and drinks that contain \"free sugars\". 从含有“游离糖”的食物和饮料中更容易摄入过量的糖分。 Free sugars include these same sugars, but in this case they have been removed from their naturally occurring source, rather than being eaten as natural parts of fruits, dairy products, and some vegetables and grains. 游离糖包含同样的糖分，但它们已经被从原本天然存在的来源中分离出来，而不是像水果、乳制品以及一些蔬菜和谷物那样作为天然成分被摄入。 This includes sugar that is added to food and drinks by food companies, cooks or consumers. 这包括由食品公司、厨师或消费者添加到食物和饮料中的糖。 Many people drink juices, and this is a healthy approach. 很多人喝果汁，这被认为是一种健康的方式。 But directly eating fruits is better, because the human body can process it easily. 但直接吃水果更好，因为人体更容易处理完整的水果。 It is better to eat a small piece of fruit, which our bodies can digest better rather than drink smoothies or more than half a cup of fruit juice because it is the same as drinking soft drinks. 吃一小块水果对我们来说更健康，因为身体更容易消化吸收，而不是喝果昔或超过半杯的果汁，因为那实际上和喝软饮料没什么区别。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693060/1301c3b555204c7e8abeb2c5c62cb4a6.mp3","phrases":[{"en":"fruits and milk contain sugar","zh":"水果和牛奶含健康的糖"},{"en":"unhealthy sugar in desserts and ice cream","zh":"甜点和冰淇淋中的不健康糖"},{"en":"excess sugar from free sugars","zh":"游离糖带来的过量糖分"},{"en":"removed from their natural source","zh":"从天然来源中分离出来"},{"en":"sugar added by food companies","zh":"食品公司添加的糖"},{"en":"drinking juices vs eating fruits","zh":"喝果汁与吃水果"},{"en":"the body can process fruit easily","zh":"身体能轻松处理水果"},{"en":"smoothies are like soft drinks","zh":"冰沙等同于软饮料"}],"logicPhrases":[{"en":"therefore → apply to fruits Unhealthy sugar is normally found in desserts","zh":"因此，这也适用于水果；不健康的糖通常存在于甜点中"},{"en":"but → in this case they have been removed from their naturally","zh":"但在这种情况下，它们已从天然形态中被去除"},{"en":"but → better","zh":"但直接吃水果更好"},{"en":"because → process it easily","zh":"因为人体能轻松处理它"},{"en":"because → is the same as drinking soft drinks","zh":"因为这与喝汽水一样"}]},{"id":4452,"name":"Globalization","ref":"The lecture defines globalization from two perspectives. First, it refers to the proliferation of cross-border transactions, including increased international trade, communication, and multinational companies. Second, it functions as an integrated economic system characterized by a global division between producing and consuming goods. Ultimately, this mutual dependence among countries represents a new stage of economic progression compared to past industrial economies.","ana":"Globalization, what is globalization? 全球化，什么是全球化？ I think that it takes on a few different definitions in one sense of the word. 我认为这个词在某种意义上有几种不同的定义。 Globalization means proliferation of transactions across country. 全球化意味着跨国交易的增加。 So, one way of thinking about globalization is a way to describe, increase international communications, more trade happening between countries and be less self-sufficient in providing goods and services to their people and more companies that have offices in multiple countries, which we call multinationals. 因此，一种看待全球化的方式是描述国际交流的增加、国家之间贸易的增多、在为本国人民提供商品和服务方面的自给自足减少，以及更多在多个国家设有办公室的公司，这些公司被称为跨国公司。 So, the source of growth in travel and communication and corporate trade across borders. 所以，旅行、通信和跨境企业贸易是增长的来源。 And this way of thinking about globalization is the continuation of thinking that has been around for a long time, such as when the Europeans went to the Orient, to find spices, which was also an example of global trade and communication. 这种看待全球化的方式是长期以来思维方式的延续，比如欧洲人前往东方寻找香料，这也是全球贸易和交流的一个例子。 Another way to think of globalization though, is an economic system. 然而，另一种看待全球化的方式是将其视为一种经济体系。 It is a system in which countries become integrated in a way that never had been before. 这是一个各国以前从未有过的整合体系。 In this system, we see a global split in the process between consuming and producing goods. 在这个体系中，我们看到全球范围内消费与生产商品的分工。 Some countries produce goods, some countries consume goods, and then these countries in different areas of the globe depend on each other in a kind of organic solidarity rather than having an economic system being just inside your country. 一些国家生产商品，一些国家消费商品，这些分布在全球不同地区的国家相互依赖，以一种有机的团结方式，而不是仅在本国内部运行经济体系。 The system is the way economy in your country functions depends on economy of another country. 这个体系意味着一个国家的经济运作依赖于另一个国家的经济。 And in fact this way of thinking about globalization represents a new area of economic progression. 事实上，这种看待全球化的方式代表了一种新的经济发展领域。 The past industrialist economy has been a global issue. 过去的工业经济就是一个全球性的问题。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693684/01ad1f4ca2904cca99fccb1b969b60ed.mp3","phrases":[{"en":"globalization has a few definitions","zh":"全球化有几个定义"},{"en":"proliferation of transactions across country","zh":"跨国交易激增"},{"en":"increased international communications","zh":"国际交流增加"},{"en":"less self-sufficient in providing goods","zh":"提供商品时自给自足程度降低"},{"en":"companies that have offices in multiple countries","zh":"在多个国家设办公室的公司"},{"en":"Europeans went to the Orient to find spices","zh":"欧洲人去东方找香料"},{"en":"a global split between consuming and producing","zh":"消费与生产的全球分工"},{"en":"organic solidarity","zh":"有机团结"}],"logicPhrases":[{"en":"so → one way of thinking about globalization is a way","zh":"因此，思考全球化的一种方式就是……"},{"en":"so → the source of growth in travel and communication and corporate","zh":"因此，旅行、通信和企业增长的动力来源"},{"en":"when → the Europeans went to the Orient","zh":"当欧洲人前往东方时"},{"en":"though → is an economic system","zh":"尽管是一种经济体系，它也是一种体系"}]},{"id":4454,"name":"Governments use tricks","ref":"The lecture highlights the fundamental importance of well-informed citizens and strongly criticizes governments that deliberately withhold information. Instead of providing the truth, these regimes use various deceptive tricks to cover up their mistakes. Specifically, they deny actual events, fabricate false ones, and spin undeniable facts. Ultimately, these strategies aim to mislead the public and distract the world from their wrongdoings.","ana":"I suppose it's the truism to point out that citizens need to be well-informed. 我想，说公民需要充分知情可能是句老生常谈。 Maybe it's something we take for granted in our liberal western democracies. 在我们自由的西方民主国家，这或许是被视为理所当然的事情。 But there will be plenty of societies, well, that is run counter to explicit government policy. 但是在许多社会中，这却与政府的明确政策背道而驰。 Many areas of the world still suffer from the reverie of the deliberate missing information. 世界上许多地方仍然遭受着“刻意遗漏信息”的梦魇。 Governments, especially the unelected ones, but also some elected ones, have denied the events that have ever taken place. 政府，尤其是未经选举产生的政府，但也包括一些经过选举产生的政府，会否认曾经发生过的事件。 They pretend that other events did take place. 他们假装其他事件确实发生过。 They would help spin what they cannot deny. 他们会编造他们无法否认的事实。 Ensure they've used every trick of the book, to pull the eyes of the world, and in an attempt to cover up their mistakes. 可以肯定的是，他们会使出浑身解数，欺骗全世界，企图掩盖自己的错误。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693687/c66ab146085f49b2883c4c45fd647efc.mp3","phrases":[{"en":"citizens need to be well-informed","zh":"公民需要充分知情"},{"en":"liberal western democracies take it for granted","zh":"西方民主国家视为理所当然"},{"en":"the deliberate missing information","zh":"故意缺失的信息"},{"en":"Governments, especially the unelected ones","zh":"政府，尤其是非民选的"},{"en":"denied the events that took place","zh":"否认发生过的事件"},{"en":"pretend that other events did take place","zh":"假装其他事件发生过"},{"en":"spin what they cannot deny","zh":"粉饰无法否认的事"},{"en":"every trick of the book","zh":"用尽一切手段"}],"logicPhrases":[{"en":"but → be plenty of societies","zh":"但会有很多社会"},{"en":"especially → the unelected ones but also some elected ones","zh":"尤其是非选举产生的，但也有一些选举产生的"},{"en":"but → also some elected ones have denied the events","zh":"但也有一些当选者否认了已经发生的事件"}]},{"id":4464,"name":"Hook sentence","ref":"An essay is a chance to identify your read and learned. If you want to wow your teacher and attract readers’ attention, polish the introduction by adding an essay hook. A hook is a catchy sentence or paragraph in the introduction, which is engaging and interesting. Some popular hook choices include using an interesting quote or a statistic.","ana":"An essay is a chance to identify your read and learned. 写一篇文章是展示你所阅读和所学到内容的机会。 As a writer, you first need to collect many materials, then write an essay in four or five paragraphs, structures and quotes. 作为一名作者，你首先要收集大量资料，然后按照四到五段的结构，并引用相关语句来撰写文章。 If someone is searching for a book or article to read, he or she will decide from the very beginning whether this work is worth attention. 如果有人在寻找一本书或一篇文章来阅读，他或她会在一开始就能决定这部作品是否值得关注。 If you want to wow your teacher, polish the introduction, especially the first couple of sentences. 如果你想给老师留下深刻印象，就要打磨好引言部分，尤其是前两句话。 Add an essay hook — something interesting, funny, shocking, or intriguing to win the reader's attention. 加入一个吸引人的开头——一些有趣、幽默、令人震惊或引人入胜的内容，以赢得读者的注意力。 Build an emotional connection with your reader right from the start. 从一开始就与读者建立情感联系。 A hook in the essay is a catchy sentence or paragraph in the impressive introduction which serves as an attention element and an important part. 文章中的“吸睛句”是一段引人注目的引言中的一句抓人眼球的句子或段落，它起到了吸引注意的作用，是非常重要的组成部分。 An excellent hook sentence is engaging and interesting; it is a perfect method to start an argumentative or persuasive essay. 一个出色的吸睛句应当具有吸引力和趣味性；它是开始一篇议论文或说服文的理想方式。 The hook for your essay often appears in the first sentence. 你文章的吸睛句通常出现在第一句话中。 The opening paragraph includes a thesis sentence. 开篇段落应包含论点句（主旨句）。 Some popular hook choices can include using an interesting quote, a little-known fact, famous last words, or a statistic. 一些常见的吸睛句选择包括使用有趣的引语、鲜为人知的事实、名人的临终遗言，或者一个有冲击力的统计数据。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693062/3e1641c96107478eabd7d410b519ad6f.mp3","phrases":[{"en":"an essay is a chance to show what you learned","zh":"作文是展示所学"},{"en":"in four or five paragraphs","zh":"写四到五段"},{"en":"polish the introduction","zh":"打磨引言"},{"en":"add an essay hook","zh":"加一个钩子句"},{"en":"interesting, funny, shocking or intriguing","zh":"有趣、好笑、震撼或引人入胜"},{"en":"Build an emotional connection with your reader","zh":"与读者建立情感联系"},{"en":"an attention element","zh":"吸引注意的元素"},{"en":"using a quote or statistic","zh":"用引语或数据"}],"logicPhrases":[{"en":"if → searching for a book or article to read","zh":"如果有人想找本书或文章来读"},{"en":"if → want to wow your teacher","zh":"如果你想惊艳你的老师"},{"en":"especially → the first couple of sentences","zh":"尤其是开头的几句话"}]},{"id":2142,"name":"Iconoclast","ref":"An iconoclast is someone who challenges established ideas and beliefs. This can be seen as a negative but in business it should be valued. lconoclasts ask the simple question “Why?” and they will not accept things like other people do. In fact, they spot changes that can be made to make a business more efficient. Businesses should listen to them and not try to change them.","ana":"So moving on with our studies on innovative thinkers, let's now consider the iconoclast. 那么，继续我们对创新思想家的研究，现在让我们来探讨一下“反传统者”。 An iconoclast can be defined someone who challenges established ideas and beliefs. 反传统者可以被定义为挑战既有观念和信仰的人。 Put simply, it's someone who hasn't stopped asking that vital question, why the term iconoclast is often used negatively. 简单来说，就是那些从未停止追问那个关键问题“为什么”的人，尽管“反传统者”这个词通常带有负面含义。 But in a business context, an iconoclast can be indispensable. 但在商业环境中，反传统者可能是不可或缺的。 The fact that they ask this question of established procedures and methods means that they may be able to uncover chinks in a company's armor and find efficiencies that their colleagues are oblivious to. 他们对既有的程序和方法提出质疑，这意味着他们可能能够发现公司弱点，并找到他们的同事们没有注意到的效率提升之处。 It has long been known that your average person tends to stop questioning something if they are increasingly exposed to it. 人们早就知道，普通人如果越来越频繁地接触某件事，往往会停止质疑它。 Iconoclasts may see through this with searing clarity and are unlikely to tolerate continued exposure. 反传统者可能会以敏锐的洞察力看穿这一点，并且不太可能容忍持续的接触。 Rather than force them to conform, businesses do well to listen to them. 与其强迫他们顺从，企业不如好好倾听他们的意见。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658781/a3676c7b1f8a4acc82ef108e322ad851.mp3","phrases":[{"en":"innovative thinkers","zh":"创新思考者"},{"en":"an iconoclast challenges established ideas","zh":"反传统者挑战既定观念"},{"en":"someone who keeps asking why","zh":"不断问为什么的人"},{"en":"indispensable in a business context","zh":"在商业环境中不可或缺"},{"en":"uncover chinks in a company's armor","zh":"发现公司的弱点"},{"en":"find efficiencies that their colleagues are oblivious to","zh":"发现同事忽略的效率"},{"en":"people stop questioning when repeatedly exposed","zh":"反复接触后不再质疑"},{"en":"businesses do well to listen to them","zh":"企业应该倾听他们"}],"logicPhrases":[{"en":"so → moving on with our studies on innovative thinkers","zh":"那么继续我们对创新思想者的研究"},{"en":"but → in a business context an iconoclast can be indispensable","zh":"但在商业环境中，反传统者可能不可或缺"},{"en":"if → are increasingly exposed","zh":"如果他们接触得越来越多"}]},{"id":3794,"name":"Implicit and explicit memory","ref":"Implicit memory and explicit memory are the two main types of memory. Implicit memory is also called procedural memory and cannot be consciously recalled. Implicit memory is about cultural and social background, such as using language naturally or driving automatically. Explicit memory is also known as episodic memory, related to personal life experiences. It is about time and space, such as remembering birthdays or answering questions in a test.","ana":"So I'm going to talk a little bit briefly about different systems of memory. 我将简要地谈谈记忆的不同系统。 And in fact, much of the memory that influences and guides our everyday life actually kind of hides in the background. 实际上，影响和指导我们日常生活的许多记忆都隐藏在背景之中。 You actually don't know that you're using the bulk of your memory. 你甚至不会意识到自己正在大量使用记忆。 And this is called implicit or procedural memory. 这种记忆被称为内隐记忆或程序性记忆。 This includes things like cultural and social norms. 它包括文化和社会规范等内容。 So kind of understanding how you're supposed to behave in a classroom or expecting a certain thing to happen when you walk into a restaurant. 比如你知道在教室里应该如何表现，或者走进餐厅时会预期发生某些事情。 These are all things that we've learned and acquired over our years, but it's not necessarily something that we think about. 这些是我们多年学习和积累的结果，但我们并不一定会主动去思考它们。 Language also, in many aspects, is something that is fairly automatic and that we've acquired and use very naturally, and other learned skills such as reading or driving. 语言在很多方面也是相当自动化的，是我们已经掌握并自然运用的技能，还包括阅读或驾驶等其他习得的技能。 These are things that might have been effortful at one time, but now they just come very easily and automatically to us. 这些技能曾经可能需要付出努力才能掌握，但现在对我们来说已经变得非常轻松和自动化了。 And in fact, if you actually try to describe to somebody how you drive or how to drive, you actually kind of mix you up. 事实上，如果你试图向别人解释你是如何开车或开车的步骤，你反而可能会感到混乱。 So these are in a lot of cases, consciousness kind of gets in the way of a lot of these aspects of implicit memory. 所以在很多情况下，意识反而会干扰我们对内隐记忆的运用。 Now, when we're talking about our memory, so for instance, people tell me a lot that their memories are bad. 当我们谈论“记忆”时，比如说很多人会告诉我他们的记忆力不好。 When people are saying when they talk about their memory, they're usually talking about explicit or episodic memory. 当人们谈论自己的记忆力时，他们通常指的是外显记忆或情景记忆。 And these are very different from implicit memories. 这些记忆与内隐记忆非常不同。 These are memories that have a very specific tag of space and time. 它们是带有明确时空标签的记忆。 These are highly personal memories, usually. 通常是高度个人化的记忆。 So this could be everything from remembering what you ate for breakfast to what you did on your last vacation, or remembering a significant birthday that you had several years ago, or... Or just an answer to a multiple choice question on a test. 这可以包括从记住你早餐吃了什么，到你上一次度假做了什么，或回忆几年前的一个重要生日，或者……甚至只是考试中一道选择题的答案。","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691690/82afaea0935c441ba323b7e59285e036.mp3","phrases":[{"en":"different systems of memory","zh":"不同的记忆系统"},{"en":"of hides in the background","zh":"记忆隐藏于背景中"},{"en":"implicit or procedural memory","zh":"内隐或程序性记忆"},{"en":"cultural and social norms","zh":"文化和社会规范"},{"en":"learned skills such as reading or driving","zh":"阅读或驾驶等技能"},{"en":"consciousness kind of gets in the way","zh":"意识会干扰"},{"en":"explicit or episodic memory","zh":"外显或情景记忆"},{"en":"specific tag of space and time","zh":"特定的时间和空间标记"}],"logicPhrases":[{"en":"so → I'm going to talk a little bit briefly about different","zh":"所以我要稍微简短地谈一谈不同的……"},{"en":"so → kind of understanding how you're supposed to behave in a","zh":"所以要大致理解在……中你该如何表现"},{"en":"when → walk into a restaurant","zh":"当你走进一家餐厅时"},{"en":"but → it's not necessarily something that we think about","zh":"但这未必是我们会去思考的事"},{"en":"but → now they just come very easily and automatically to us","zh":"但现在它们对我们来说来得轻而易举、自然而然"},{"en":"if → actually try to describe to somebody how you drive","zh":"如果你真的试着向别人描述你是怎么开车的"},{"en":"so → in a lot of cases","zh":"所以这些在很多情况下……"},{"en":"when → we're talking about our memory","zh":"当我们谈到自己的记忆时"}]},{"id":4455,"name":"Indian peasants' debt","ref":"The lecture explains the severe debt crisis among Indian peasants caused by the high costs of commercial seeds and pesticides. Driven by globalization, farmers lack capital and must borrow money to buy these expensive agricultural materials. Consequently, the seed and pesticide companies act as both sellers and major creditors, trapping the peasants in a continuous cycle of debt.","ana":"The debt today is so high, it’s two hundred thousand rupees, three hundred thousand rupees of peasant who have no capital. 如今农民的债务高得惊人，往往是二十万、三十万卢比，而他们根本没有资本。 They who know within a year or two, when they accumulate that kind of debt. 他们自己也清楚，在一两年内就会积累起如此巨额的债务。 Where is the debt coming from? 这些债务从何而来？ It's coming from a seed that is costing a hundred thousand to two hundred thousand rupees per kilogram, depending on what you got. 它源于高价种子——每公斤要价十万到二十万卢比，具体价格取决于种类。 Seeds that used to be free, used to be theirs. 这些种子过去是免费的，原本属于他们自己。 Pesticides each time, the more they use, the more they have to use, 12 sprays, 15 sprays, 20 sprays. 而农药也是如此，用得越多，就必须用得更多，从十二次喷洒到十五次，再到二十次。 Pesticides used in just the last five years in the land areas of India has shown up by 2000 percent. 在过去五年间，印度耕地上的农药使用量暴涨了2000%。 That’s why the free market and globalization have brought and since we are talking about peasants, who have no money, who have no capital, they can only buy expensive seeds and expensive pesticides by borrowing. 这就是所谓自由市场和全球化带来的结果，而我们说的是农民——他们既无资金又无资本，只能靠借债购买昂贵的种子和农药。 And who lend that money? 那么，这笔钱是谁借给他们的呢？ The seed companies that sell the pesticides, which are the same companies that sell the seeds, as you know, are now also the major creditors. 正是那些销售农药和种子的种子公司，而你知道，这些公司如今也是主要的债权人。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693693/2a44a164f977496aba3ab39a54d72e93.mp3","phrases":[{"en":"debt today is so high","zh":"如今债务高得惊人"},{"en":"two hundred thousand rupees","zh":"二十万卢比"},{"en":"Where is the debt coming from?","zh":"这些债务从何而来？"},{"en":"Seeds that used to be free","zh":"过去免费的种子"},{"en":"Pesticides each time","zh":"每次使用农药"},{"en":"shown up by 2000 percent","zh":"增长了2000%"},{"en":"free market and globalization","zh":"自由市场和全球化"},{"en":"major creditors","zh":"主要债权人"}],"logicPhrases":[{"en":"so → high it’s two hundred thousand rupees","zh":"高达二十万卢比"},{"en":"when → accumulate that kind of debt","zh":"当他们累积那种债务时"},{"en":"since → are talking about peasants","zh":"既然我们说的是农民"}]},{"id":4446,"name":"International environmental law","ref":"The lecture highlights the crucial role of domestic legislation in implementing international environmental law. It traces the history of UK environmental controls and explains that early regulations lack proper enforcement, which makes them ineffective. Additionally, the Industrial Revolution worsens environmental damage because industrialists prioritize economic profit. Therefore, comprehensive statutory controls on pollutant discharge become essential for effective environmental protection.","ana":"Before we consider international environmental law and climate change we need to consider domestic legislation, as it is within the sovereign states that international law is put into practice. 在考虑国际环境法和气候变化之前，我们需要先考虑国内立法，因为国际法的实施依赖于主权国家。 This reflects the environmentalists' maxim, 'think globally act locally.' 这反映了环境保护者的格言：“全球思考，本地行动。” United Kingdom legislative control over the impacts of man's activity on the environment is not new. 英国对人类活动对环境影响的立法控制并非新鲜事。 As long ago as the reign of Charles II the main concern was the production of smoke from the burning of sea coal. 早在查理二世统治时期，主要关注的是燃烧海煤产生的烟雾。 Almost all areas of trade and industry were subject to very detailed legislative controls at that time, although some were governed by 'self-regulation' in the form of guilds, which regulated both supply and methods of production. 当时几乎所有贸易和工业领域都受到非常详细的立法控制，尽管有些行业由行会形式的“自我监管”管理，规范供应和生产方法。 However, the measures implemented were mostly ineffective because then, as now, the specifying of legal duties and standards without providing any appropriate enforcement merely indicated good intentions but were of little practical effect. 然而，这些措施大多无效，因为无论当时还是现在，仅仅规定法律责任和标准而没有提供适当的执行手段，只表明了良好意图，但几乎没有实际效果。 The next stage was prompted by the Industrial Revolution with the urbanization of society and its profound effects on the environment. 下一个阶段是由工业革命推动的，伴随社会城市化及其对环境的深远影响。 Local industrialists used the Adam Smith model to maximize their economic benefit, but this was to the detriment of the local environment with the operation of 'Gresham's Law' that is, the bad drives out the good. 当地工业家采用亚当·斯密模式以最大化经济利益，但这损害了当地环境，体现了“格雷欣法则”的作用，即劣质排挤良好。 Those industrialists who were concerned for either the health of their employees or the local environment faced higher costs than their competitors. 那些关心员工健康或当地环境的工业家，其成本高于竞争对手。 The result was the need for increasingly comprehensive statutory controls on the discharge of pollutants into various receiving media. 结果是需要对污染物排放到各类受纳介质中实施日益全面的法定控制。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693669/c30f61d5f398497abcf3cc4e7b004942.mp3","phrases":[{"en":"domestic legislation within sovereign states","zh":"主权国家的国内立法"},{"en":"think globally act locally","zh":"全球思考，本地行动"},{"en":"legislative control over man's activity","zh":"对人类活动的立法控制"},{"en":"the reign of Charles II","zh":"查理二世统治时期"},{"en":"self-regulation in the form of guilds","zh":"行会形式的自我监管"},{"en":"measures were mostly ineffective","zh":"措施大多无效"},{"en":"the Industrial Revolution with the urbanization","zh":"工业革命与城市化"},{"en":"statutory controls on pollutants","zh":"对污染物的法定管控"}],"logicPhrases":[{"en":"although → governed by 'self-regulation' in the form of guilds","zh":"尽管有些受行会形式的“自我监管”约束"},{"en":"however → mostly ineffective","zh":"然而，已实施的措施大多无效"},{"en":"because → then as now the specifying of legal duties and standards","zh":"因为当时和现在一样，需要明确法律义务和标准"},{"en":"but → were of little practical effect","zh":"但实际作用甚微"},{"en":"but → to the detriment of the local environment","zh":"但这损害了当地环境"}]},{"id":2131,"name":"International law","ref":"The lecture discusses the historical significance of international law, particularly its role in ending prolonged conflicts. It emphasizes the impact of prolonged periods of war, leading to the creation of new rules governing the behavior between states. Additionally, it highlights the establishment of international law in 1648 and underscores its implications function and power dynamics in promoting stability among nations.","ana":"This lecture provides a historical perspective on the establishment of international law, emphasizing the pivotal role it played in ending protracted conflicts. 本次讲座从历史的角度探讨了国际法的建立，强调了它在结束长期冲突中所发挥的关键作用。 It begins by highlighting the painful lesson learned from prolonged periods of war, prompting the creation of a new set of rules governing the behavior between states. 讲座首先指出，正是从长期战争带来的痛苦教训中，催生了一套新的规范国家行为的规则。 The lecture underscores the significance of this development, particularly in the context of prolonged conflicts with no peace for 30 or even 100 years. 讲座强调了这一发展的意义，尤其是在那些持续数十年甚至百年没有和平的历史背景下。 Additionally, the roles of powerful nations such as the United States and Australia in shaping international law are discussed. 此外，讲座还讨论了诸如美国和澳大利亚等强国在塑造国际法过程中所扮演的角色。 It is noted that international law was formally established in 1648 as a means to end incessant wars between states and alleviate the strains of military force. 值得注意的是，国际法于1648年正式确立，旨在结束国家之间连绵不断的战争，并缓解军事力量带来的压力。 Overall, the lecture emphasizes the implication function and power dynamics of international law, shedding light on its historical significance and its role in curbing conflicts and promoting stability among nations. 总体而言，讲座强调了国际法的功能性含义及其背后的权力动态，揭示了其历史意义以及在遏制冲突、促进国家间稳定方面所发挥的作用。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678652/2f80cb191ad24163b9a0d4cbc53a3a07.mp3","phrases":[{"en":"the establishment of international law","zh":"国际法的建立"},{"en":"the pivotal role it played in ending protracted conflicts","zh":"在结束长期冲突中的关键作用"},{"en":"the painful lesson from prolonged wars","zh":"长期战争的痛苦教训"},{"en":"a new set of rules governing the","zh":"规范国家行为的新规则"},{"en":"conflicts with no peace for 30 or even 100 years","zh":"30 年甚至 100 年无和平"},{"en":"the roles of the United States and Australia","zh":"美国和澳大利亚的作用"},{"en":"formally established in 1648","zh":"1648 年正式确立"},{"en":"curbing conflicts and promoting stability","zh":"遏制冲突、促进稳定"}],"logicPhrases":[]},{"id":2127,"name":"International trading system","ref":"The international trading system has evolved significantly since the WTO's establishment, with globalization driving open trade policies and expanded commerce. Countries opening ports enabled consumers worldwide to access diverse, high-quality products at competitive prices. This interconnected system fosters economic growth by facilitating cross-border exchange of ideas, technologies, and opportunities for development. The speaker believes that open trade is a boon to global prosperity.","ana":"In our exploration of the international trading system, we acknowledge the significant changes since the inception of the World Trade Organization (WTO). 在我们对国际贸易体系的探讨中，我们承认自世界贸易组织（WTO）成立以来发生的重大变化。 As countries opened up, an era of increased international trade commenced. 随着各国的开放，一个国际贸易日益增长的时代开始了。 Globalization has been the keystone, prompting nations to welcome foreign trade by opening their ports, fostering a globally connected economy. 全球化成为了关键推动力，促使各国通过开放港口来欢迎对外贸易，从而促成了全球经济的互联互通。 The ramifications of this shift touch every facet of commerce. 这一转变的影响触及商业的方方面面。 As a result, consumers around the world now enjoy a broader range of products, competitive pricing, and improved quality. 因此，全球消费者如今可以享受到更丰富的产品选择、更具竞争力的价格以及更高的产品质量。 This trend has ushered in an era of unprecedented consumer benefits and widespread economic growth. 这一趋势开启了一个前所未有的消费者福利提升和广泛经济增长的时代。 To conclude from my perspective, the decision to engage in open trade has been immensely positive. 从我的角度来看，参与开放贸易的决定是非常积极的。 Trading across borders should not just be seen as a strategic economic move, but as a force that enriches societies by exposing them to new ideas, technologies, and opportunities for development. 跨境贸易不应仅仅被视为一种战略性的经济举措，而应被看作是一种力量，它通过让社会接触新的思想、技术和发展的机会来丰富整个社会。 It's a conviction of mine that trade openness is indeed a boon to global prosperity. 我坚信，贸易开放确实是全球繁荣的一大福音。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678648/c48c1a5d574643fcbdda540cb0b32080.mp3","phrases":[{"en":"the international trading system","zh":"国际贸易体系"},{"en":"changes since the World Trade Organization","zh":"自世贸组织以来的变化"},{"en":"an era of increased international trade","zh":"国际贸易增长的时代"},{"en":"globalization as the keystone","zh":"全球化是基石"},{"en":"opening their ports","zh":"开放港口"},{"en":"a broader range of products, competitive pricing","zh":"更广的产品范围和竞争价格"},{"en":"unprecedented consumer benefits","zh":"前所未有的消费者利益"},{"en":"a boon to global prosperity","zh":"促进全球繁荣"}],"logicPhrases":[{"en":"since → the inception of the World Trade Organization (WTO)","zh":"自世界贸易组织（WTO）成立以来"},{"en":"as a result → consumers around the world now enjoy a broader range","zh":"因此，世界各地的消费者如今享有更广泛的选择"},{"en":"but → as a force that enriches societies by exposing them","zh":"但作为一种通过让社会接触外界来丰富社会的力量"}]},{"id":3789,"name":"Journalism and internet","ref":"David Olivia Garcia, co-host of New Mexico in Focus and managing editor for the New Mexico Independent, believes that the Internet has great benefits for journalism, offering various mediums to tell stories and connect with other journalistic work. However, John Fleck, a columnist for the Albuquerque Journal, argues that the Internet actually makes journalists more efficient in terms of gathering information and confirming facts.","ana":"David Olivia Garcia is a co-host of New Mexico in Focus and is also the managing editor for the New Mexico Independent, which is an online news site. 大卫·奥利维亚·加西亚是《聚焦新墨西哥》（New Mexico in Focus）的联合主持人，同时也是在线新闻网站“新墨西哥独立网”（New Mexico Independent）的主编。 He says that the Internet has some great benefits for journalism. 他表示，互联网为新闻业带来了一些巨大的优势。 The Internet is this new, amazing medium. Not so new: it's been around quite some time now. 互联网是一种全新而令人惊叹的媒介。不过它也不算新了，已经存在相当长一段时间了。 But it's maturing as, among other things, a place for journalism. 但作为新闻传播平台之一，它正在日趋成熟。 In a sense, the Internet allows you to tell stories better than in a newspaper or on television. 从某种意义上说，互联网让你能够比报纸或电视更好地讲述新闻故事。 For this reason, you can do it all online: you can have the written word, you can have still photographs, you can have video. 正因为如此，你可以在网上完成所有这些内容：你可以发布文字报道、静态图片和视频。 You can link and kind of connect to the other journalism that has been done on a given topic. 你还可以进行链接，将当前报道与围绕某一主题已有的其他新闻报道连接起来。 So it's not like you're in a vacuum. 因此，你并不是在一个信息真空中工作。 The Internet has had a negative impact on these papers. 互联网对传统纸质媒体产生了负面影响。 However, John Fleck, who is a columnist for the Albuquerque Journal and also has his own blog, says that he doesn't think that's entirely the case. 然而，《阿尔伯克基日报》（Albuquerque Journal）的专栏作家、同时也拥有自己博客的约翰·弗莱克表示，他认为情况并不完全是这样。 It really makes me more efficient as a journalist in terms of information gathering, confirmation, helping me get the background necessary to write a story. 作为一名记者，它确实在信息收集和核实方面提高了我的效率，帮助我获取撰写一篇报道所需的背景资料。 So it's really good for that. 所以在这方面，它非常有用。","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691682/67f174d0fbc64dd0aaac9c49ad92d8fb.mp3","phrases":[{"en":"the Internet has some great benefits for journalism","zh":"互联网对新闻业有很大好处"},{"en":"tell stories better than in a newspaper","zh":"比报纸更好地讲故事"},{"en":"the written word, stills and video","zh":"文字、图片和视频"},{"en":"link to other journalism on a topic","zh":"链接到该话题的其他报道"},{"en":"the Internet has had a negative impact","zh":"互联网带来了负面影响"},{"en":"more efficient as a journalist","zh":"作为记者更高效"},{"en":"information gathering and confirmation","zh":"信息收集和核实"},{"en":"getting the background to write a story","zh":"获取写报道的背景"}],"logicPhrases":[{"en":"so → new: it's been around quite some time now","zh":"说它新？它其实已经存在很久了"},{"en":"but → it's maturing as among other things","zh":"但它正在逐渐成熟，这也是其中一方面"},{"en":"so → it's not like you're in a vacuum","zh":"所以并不是说你身处真空"},{"en":"however → a columnist for the Albuquerque Journal","zh":"然而，约翰·弗莱克是《阿尔伯克基日报》的专栏作家"},{"en":"so → it's really good","zh":"所以这真的很好"}]},{"id":3797,"name":"Leadership","ref":"The lecture talks about leadership. Leaders can define or clarify goals through various means such as issuing memos, executive orders, or laws, as well as using charisma, rhetoric, and example. Leadership can range from highly visible and authoritative to casual and low-key. Historically, authoritative leadership has been predominantly exhibited by men, but this pattern is changing as more women take up visible leadership roles.","ana":"A leader can define or clarify goals by issuing a memo or an executive order, an edict or a fatwa or a tweet, by passing a law, barking a command, or presenting an interesting idea in a meeting of colleagues. 领导者可以通过发布备忘录、行政命令、法令、法特瓦或推文，通过立法、下达命令，或在同事会议上提出一个有趣的想法来定义或明确目标。 Leaders can mobilize people's energies in ways that range from subtle, quiet persuasion to the coercive threat or the use of deadly force. 领导者可以调动人们能量的方式多种多样，从温和安静的劝说，到强制性的威胁，甚至使用致命武力。 Sometimes a charismatic leader such as Martin Luther King Jr. can define goals and mobilize energies through rhetoric and the power of example. 有时，像马丁·路德·金这样的魅力型领导者可以通过修辞和榜样的力量来设定目标并激发能量。 We can think of leadership as a spectrum, in terms of both visibility and the power the leader wields. 我们可以从可见性和领导者所掌握的权力两个方面，把领导力看作一个光谱。 On one end of the spectrum, we have the most visible: authoritative leaders like the president of the United States or the prime minister of the United Kingdom, or a dictator such as Hitler or Qaddafi. 在这个光谱的一端是最具可见性的：权威型领导者，比如美国总统、英国首相，或者像希特勒或卡扎菲这样的独裁者。 At the opposite end of the spectrum is casual, low-key leadership found in countless situations every day around the world, leadership that can make a significant difference to the individuals whose lives are touched by it. 而在另一端，则是日常生活中随处可见的随意而低调的领导方式，这种领导力虽然低调，却能对被它影响的人们的生活产生重大影响。 Over the centuries, the first kind, the out-in-front, authoritative leadership, has generally been exhibited by men. 几个世纪以来，第一种即站在前台的权威型领导通常由男性担任。 Some men in positions of great authority, including Nelson Mandela, have chosen a strategy of \"leading from behind\" more often, however, top leaders have been quite visible in their exercise of power. 一些身居高位的男性，包括纳尔逊·曼德拉，更常选择“从后方领导”的策略。然而，大多数高层领导者在行使权力时表现得非常显眼。 Women (as well as some men) have provided casual, low-key leadership behind the scenes. 女性（以及部分男性）则在幕后提供了轻松而低调的领导力。 But this pattern has been changing, as more women have taken up opportunities for visible, authoritative leadership. 但这一模式正在发生变化，越来越多的女性获得了走向前台、展现权威型领导力的机会。","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691706/4f9828223de242e4801b4278efe062e8.mp3","phrases":[{"en":"a leader can define or clarify goals","zh":"领导者能定义或明确目标"},{"en":"mobilize people's energies","zh":"调动人们的能量"},{"en":"subtle, quiet persuasion","zh":"微妙安静的劝说"},{"en":"a charismatic leader such as Martin Luther King Jr","zh":"像马丁·路德·金这样的魅力领袖"},{"en":"leadership as a spectrum","zh":"领导力是一个谱系"},{"en":"authoritative leaders like the president","zh":"像总统这样的权威领袖"},{"en":"casual, low-key leadership","zh":"随意低调的领导"},{"en":"women have taken up visible leadership","zh":"女性开始担任显性领导"}],"logicPhrases":[{"en":"however → been quite visible in their exercise","zh":"不过，高层领导人在锻炼方面一直颇为显眼"},{"en":"but → been changing","zh":"但这种模式一直在变化"}]},{"id":4457,"name":"Los Angeles","ref":"Since Los Angeles was established in 1781, the rapidly increasing population puts strain on the Los Angeles River. A new water source has to be found for the city’s development as an urban center. The creation of the Los Angeles Aqueduct led to tragedies and draining of important landmarks. The Water Department eventually settled on Owens Lake as the perfect candidate to supply Los Angeles with water for expansion.","ana":"In 1781 Los Angeles is established and named Pablo de la Renta de Los Angeles by forty-four families from Mexico as a fort for soldiers. 1781年，洛杉矶由来自墨西哥的四十四户家庭建立，并被命名为“帕布罗·德拉伦塔·德·洛杉矶”，最初是一个供士兵使用的堡垒。 More than sixty-five years later, the discovery of gold and silver medal draws settlers from across the country to northern California. 六十多年后，金矿和银矿的发现吸引了来自全美各地的移民前往北加州。 After the rush for gold dies down, Americans had flocked to Northern California for a fortune begin to disperse and settle parts of Southern California. 在淘金热逐渐冷却之后，那些曾涌入北加州寻求财富的美国人开始分散并定居到南加州的部分地区。 By 1870, the small town of Los Angeles has gained more than five thousand six hundred residents, which multiplies nearly 20 times by the turn of the century. 到1870年时，这个名为洛杉矶的小城镇已拥有超过五千六百名居民，而到世纪之交时，这一数字增长了近20倍。 The rapidly increasing population puts additional strain on the Los Angeles River, the city's main source of water, which has not been helped by a recent two years of drought. 迅速增长的人口给洛杉矶河——这座城市的主水源——带来了更大的压力，而最近两年的干旱更是雪上加霜。 In order to avoid tragedy, a new water source has to be found. 为了避免灾难，必须寻找新的水源。 The city of Los Angeles is a development as an urban center and a growing thirst for water facilitated the triumph of the creation of the Los Angeles Aqueduct, but simultaneously led to the tragedies of St. Francis Dam and the draining of important landmarks like Mono Lake and Owen Zone. 随着洛杉矶作为城市中心的发展，以及日益增长的用水需求，洛杉矶引水渠得以建成，这是一项伟大的成就；但同时也导致了圣弗朗西斯科大坝的悲剧，以及包括莫诺湖和欧文斯地区在内的多个重要地标被抽干。 In the year 1900, the city of Los Angeles is growing faster than its water resources, a need for the city is as clear as the water they need. 1900年时，洛杉矶市的增长速度已经超过了其水资源的增长速度，城市对水的需求如同它所需要的水一样清晰明了。 In 1902, Irish American civil engineer William Holland was named superintendent of the Los Angeles Water Department. 1902年，美籍爱尔兰裔土木工程师威廉·霍兰被任命为洛杉矶水务局主管。 Soon after the department began considering options to quench the city of Los Angeles's growing thirst, they eventually settled on a lake. 该部门不久后便开始考虑解决洛杉矶日益增长的用水需求的方案，最终他们将目光锁定在一个湖泊上。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693055/72ca6701588d44ae88732b21f6a27a51.mp3","phrases":[{"en":"1781 Los Angeles is established","zh":"1781 年洛杉矶建立"},{"en":"forty-four families from Mexico","zh":"来自墨西哥的 44 个家庭"},{"en":"the discovery of gold and silver","zh":"金银矿的发现"},{"en":"by 1870, over 5,600 residents","zh":"到 1870 年超过 5600 居民"},{"en":"the rapidly increasing population","zh":"人口的快速增长"},{"en":"strain on the Los Angeles River","zh":"洛杉矶河的压力"},{"en":"the Los Angeles Aqueduct","zh":"洛杉矶输水渠"},{"en":"the draining of Mono Lake","zh":"莫诺湖的干涸"}],"logicPhrases":[{"en":"in order to → avoid tragedy a new water source has to be found","zh":"为了避免悲剧，必须找到新的水源"},{"en":"but → simultaneously led to the tragedies of St","zh":"但同时也导致了 St 的悲剧"}]},{"id":2134,"name":"Loss leader strategy","ref":"A loss leader is when companies intentionally sell their products at an unprofitable price in order to attract new customers. The aim of the loss leader strategy is usually for companies to build a loyal customer base so that when they eventually increase their prices, they will make a profit. However, the loss leader strategy is a potential risk especially for small companies.","ana":"Now, as we all know, companies usually set out to make a profit on the goods and services they sell. However, that's not always the case. So today we're going to look at a strategy called the loss leader and why companies may decide to use it. 现在，众所周知，公司通常以销售商品和服务来获取利润为目标。然而，情况并非总是如此。所以今天我们要探讨一种称为“亏损领导者”的策略，以及公司可能决定采用这种策略的原因。 Basically, a loss leader is a product or service that the company is willing to sell at a very low price, even though it will lead to a financial loss. 基本上，“亏损领导者”是指公司愿意以极低的价格出售的产品或服务，即使这会导致财务亏损。 For instance, brand new products are often sold at a special promotional or introductory price. 例如，全新的产品通常以特别的促销价或 introductory price（介绍性价格）出售。 The idea is that this low price will help spread the word about the product, so in essence, it serves as a form of marketing. 其目的是，这个低价将有助于传播产品的口碑，所以本质上，它是一种营销形式。 The low price will tempt people to at least try it once, and then if the products are hit, there will be enough loyal customers that will continue to purchase it even once the company has increased the price. 低价会吸引人们至少尝试一次，如果产品受欢迎，就会有足够的忠实顾客，即使公司提高价格后也会继续购买。 So the rationale is that the short-term loss is worth the potential long term gain. 因此，其基本原理是，短期的损失值得潜在的长期收益。 However, it should be noted that this strategy is of course highly risky. 然而，应该指出的是，这种策略当然具有很高的风险。 After all, there's nothing stopping customers from switching to other brands once the introductory price disappears. 毕竟，一旦促销价消失，没有什么能阻止顾客转向其他品牌。 And obviously any decision which involves a financial loss has to be carefully calculated. 显然，任何涉及财务损失的决定都必须经过仔细计算。 Large companies may have the financial power to take this sort of risk, but for a new or small company, the financial implications are huge. 大型公司可能拥有承担这种风险的财力，但对于一家新公司或小公司来说，其财务影响是巨大的。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658783/73539a3ce85d46bf922c3b1b795c50f5.mp3","phrases":[{"en":"a strategy called the loss leader","zh":"一种叫引流品的策略"},{"en":"sell at a very low price","zh":"以极低价格出售"},{"en":"lead to a financial loss","zh":"导致财务损失"},{"en":"a special introductory price","zh":"特别的新品价"},{"en":"serves as a form of marketing","zh":"起到营销作用"},{"en":"tempt people to try it once","zh":"吸引人们尝试一次"},{"en":"build enough loyal customers","zh":"培养足够的忠实顾客"},{"en":"the short-term loss is worth the potential long term gain","zh":"短期损失值得长期收益"}],"logicPhrases":[{"en":"however → that's not always the case","zh":"然而，情况并不总是如此"},{"en":"so → today we're going to look at a strategy called the","zh":"所以今天我们要探讨一种叫做……的策略"},{"en":"though → will lead to a financial loss","zh":"尽管这会造成经济损失"},{"en":"for instance → often sold at a special promotional","zh":"例如，全新产品常以特别促销价出售"},{"en":"so → in essence it serves as a form of marketing","zh":"所以本质上，它是一种营销手段"},{"en":"if → be enough loyal customers","zh":"如果产品大受欢迎，就会有足够多的忠实顾客"},{"en":"so → that the short-term loss is worth the","zh":"所以其逻辑是，短期损失是值得的"},{"en":"however → should be noted that this strategy is of course","zh":"然而，需要注意的是，这种策略当然……"}]},{"id":4468,"name":"Luxury brand","ref":"How a luxury brand forms is hard to explain. For standard business, a luxury brand is about the exclusivity through high prices and low stock. However, some luxury brands are characterized by huge quantity in sales and low prices. The speaker thinks both cases are relative. Therefore, the reason to explain the formation of a luxury brand is complicated. In business community, it refers to the more expensive brands.","ana":"The question today is, what makes a luxury brand a luxury brand and how do we distinguish it is very hard to answer. 今天我们要回答“一个奢侈品牌之所以成为奢侈品牌的原因是什么？”以及“我们如何区分它？”这个问题非常困难。 The standard business response is to say, 'they are more exclusive'. 商业领域常见的回答是：“它们更具排他性”。 And we get exclusivity by having high price and relatively small amounts of the product available. 这种排他性来自于高价和相对较少的产品供应量。 The reality, however, of luxury brands is that they are sold in their millions, and in some cases, are not priced that much higher than the standard output. 然而现实是，奢侈品牌的产品销量可以达到数百万件，有些产品的价格甚至比普通产品高不了太多。 The only way I can really answer your question is to say, it is all relative. 我唯一能回答你的方式是说：这一切都是相对的。 As you said in your introduction, it wasn’t that long ago in Australia that we would have considered two televisions to be a luxury, or even further back, one color television. 正如你在引言中所说，在不太久远的澳大利亚历史中，拥有两台电视机曾被视为一种奢侈，更早的时候，拥有一台彩色电视机就是奢侈品。 And you can make a strong argument, for example, that Starbucks in China, right now, is a luxury purchase – because of its cost, because of how frequently it is purchased by many people. 例如，你可以有力地论证：如今在中国，星巴克是一种奢侈消费——因为它的价格、也因为它被很多人购买的频率。 So, I think the long answer is a complicated one, but the answer is, it depends who you talk to. 所以，我认为这个问题的完整答案很复杂，但最终的答案是：这取决于你问的是谁。 I think in the business community what we would say, is that there is a small cluster of 'more expensive brands' which have a distinct strategy that we would identify as being 'luxury brands' and they start with the Rolls Royces and the Tiffanys and the Louis Vuittons of the world. 我想在商业界，我们会说：有一小部分“更昂贵的品牌”，它们有着独特的战略，我们可以将它们认定为“奢侈品牌”，比如劳斯莱斯、蒂芙尼和路易威登这些世界知名的品牌。 And, I think that tends to be how we see them. 我想，这就是我们通常看待它们的方式。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693066/561a9a9de48a40a3ac25945f303d10ec.mp3","phrases":[{"en":"what makes a luxury brand","zh":"什么造就奢侈品牌"},{"en":"the standard business response","zh":"标准的商业回答"},{"en":"they are more exclusive","zh":"它们更排他"},{"en":"exclusivity by having high price","zh":"通过高价实现排他"},{"en":"sold in their millions","zh":"以百万计的销量"},{"en":"it is all relative","zh":"都是相对的"},{"en":"Starbucks in China, right now, is a luxury purchase","zh":"星巴克在中国是奢侈消费"},{"en":"a small cluster of more expensive brands","zh":"一小群更贵的品牌"}],"logicPhrases":[{"en":"however → that they are sold","zh":"然而，奢侈品牌的特点在于它们会被出售"},{"en":"for example → Starbucks in China right now","zh":"例如，现在中国的星巴克"},{"en":"because → of its cost because of how frequently it is purchased","zh":"因为它的成本，也因为它被购买的频率"},{"en":"because → of how frequently it is purchased by many people","zh":"因为很多人经常购买它"},{"en":"so → I think the long answer is a complicated one","zh":"所以我认为，详细答案很复杂"},{"en":"but → it depends who you talk","zh":"但答案是，这取决于你跟谁聊"}]},{"id":2129,"name":"Multiculturalism & cultural diversity","ref":"Multiculturalism promotes acceptance of diverse cultures, fostering inclusivity and harmony by celebrating differences rather than enforcing assimilation. It contrasts with the \"melting pot\" model, preserving cultural identities to enrich societal coexistence. By embracing multiculturalism, societies can broaden understanding of the world and fosters a sense of unity and acceptance. In this way, we can create a more vibrant and enriching society for all.","ana":"Multiculturalism is an important aspect of our society, as it encourages us to embrace and appreciate the diverse cultures that make up our world. 多元文化主义是我们社会的重要组成部分，因为它鼓励我们接受并欣赏构成我们世界的多元文化。 This concept promotes the idea that we should not only tolerate, but also celebrate and learn from the differences in our society. 这一理念提倡我们不仅应容忍差异，还应庆祝并从中学习。 Rather than expecting everyone to conform to one dominant culture, multiculturalism encourages respect for individual traditions and beliefs. 多元文化主义并不强求所有人都去适应一种主流文化，而是鼓励人们尊重各自的传统文化和信仰。 By recognizing and valuing cultural diversity, we can create a more inclusive and harmonious society. 通过认可和重视文化多样性，我们可以创造一个更具包容性和和谐性的社会。 This is in contrast to the idea of a melting pot, where diversity is expected to disappear as everyone assimilates into one homogeneous culture. 这与“大熔炉”观念形成对比，在后者中，多样性被认为会随着所有人融入一种同质文化而逐渐消失。 Embracing multiculturalism allows us to broaden our understanding of the world and fosters a sense of unity and acceptance amongst different groups. 拥抱多元文化主义使我们能够拓宽对世界的理解，并在不同群体之间培养团结与接纳的意识。 Ultimately, it is through respecting and celebrating our differences that we can create a more vibrant and enriching society for all. 最终，正是通过对差异的尊重与庆祝，我们才能为所有人建立一个更加充满活力且富有意义的社会。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678650/8cc1069e3a2349dda333a7b33ea0d798.mp3","phrases":[{"en":"Multiculturalism is an important","zh":"多元文化主义很重要"},{"en":"embrace and appreciate the diverse cultures","zh":"接纳并欣赏多元文化"},{"en":"celebrate and learn from the differences","zh":"欣赏并从差异中学习"},{"en":"respect for individual traditions and beliefs","zh":"尊重个人传统和信仰"},{"en":"a more inclusive and harmonious society","zh":"更包容和谐的社会"},{"en":"in contrast to the melting pot","zh":"与大熔炉的对比"},{"en":"broaden our understanding of the world","zh":"拓宽对世界的理解"},{"en":"a more vibrant and enriching society","zh":"更有活力的社会"}],"logicPhrases":[{"en":"but → also celebrate and learn from the differences in our society","zh":"但也要欣赏并学习我们社会中的差异"}]},{"id":4456,"name":"Negative bias","ref":"The passage explains that emotions can be categorized as positive or negative, and provides examples of the physical expressions associated with anger and happiness. It discusses how anger increases blood flow to the hands and releases adrenaline, while happiness and calmness inhibit negative emotions. It acknowledges the influence of hormones on our actions. The passage also mentions a forthcoming discussion on healthy and unhealthy expressions of emotions.","ana":"Next, let's look at a positive and negative emotions and positive and negative expression of these emotions. 接下来，我们来看看积极情绪和消极情绪，以及这些情绪的积极和消极表达方式。 No one can see positive and negative. 没有人能直接看到“积极”或“消极”。 I mentioned earlier that there is a range of feelings that we there's a range of expressions that we feel ranging from anger, sadness, shame, frustration or depression, disgust, love, calm or happiness or sadness. 我之前提到过，我们有一系列的感受，也有各种各样的情绪表达，从愤怒、悲伤、羞耻、沮丧或抑郁，到厌恶、爱、平静、快乐或悲伤。 So if I'm looking at these emotions, I can broadly categorize all of them in either being positive or negative. 因此，当我观察这些情绪时，我可以将它们大致归类为积极或消极两类。 So let's take, for instance, anger and fear. 比如，我们可以看看愤怒和恐惧这两种情绪。 So if I'm feeling angry, what happens is all the blood, the blood flow is increased towards my hands. 当我感到愤怒时，血液会大量流向双手。 As a result, it makes it easier for me to grasp a weapon or to make a strike. 这让我更容易握住武器或发起攻击。 And that is a lot of adrenaline that is released, which increases energy necessary for the action. 同时，体内会释放大量肾上腺素，为即将采取的行动提供所需能量。 On the other hand, if I'm feeling happy, if I'm feeling calm. 另一方面，如果我感到快乐或者平静。 The major center is the brain for a lot of activity, and this inhibits negative emotions as feeling negative or negative emotions from entering our mind. 大脑是许多活动的主要中枢，它会抑制负面情绪进入我们的思维。 So this is what happens. 这就是实际发生的过程。 It has a lot to do with hormones. 这与荷尔蒙有很大关系。 It has a lot to do with. 这也与很多因素有关。 This is a reason why they see that it was in an impulse. 这也是为什么人们会说：“我当时一时冲动。” I happened to slap the person, but I didn't mean it. 我碰巧打了那个人一巴掌，但我不是故意的。 When I'm angry, I don't realize that I end up hitting the person. 当我生气的时候，我没有意识到自己最终真的动手打了人。 So this has a lot to do with your hormones. 这种行为也与你的荷尔蒙水平密切相关。 Once you have once you know what you're feeling, once you are aware, you have labeled your feelings really well. 一旦你了解了自己的感受，一旦你有了觉察，并准确地给自己的情绪贴上了标签。 This is exactly what happens when there's blood flow rushing through your own hands. 你就能清楚地知道当血液涌向双手时，身体正在发生什么。 And then it makes it easier for you to make a strike, to grasp something or to defend yourself. 这让你更容易做出打击动作、抓住某物或保护自己。 This is exactly what happens when we're talking about positive and negative expression of our feelings. 这正是我们在谈论情绪的积极与消极表达时所发生的事情。 This is positive and negative. 这就是积极与消极的区别。 Next, we look at the healthy and the unhealthy ways of expressing ourselves. 接下来，我们将探讨表达自我的健康与不健康方式。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693054/db5a01603f974e3980613bebb950f1b1.mp3","phrases":[{"en":"positive and negative emotions","zh":"积极和消极情绪"},{"en":"a range of expressions","zh":"一系列的表达"},{"en":"anger, sadness, shame, frustration","zh":"愤怒、悲伤、羞耻、沮丧"},{"en":"categorize them as positive or negative","zh":"分为积极或消极"},{"en":"blood flow is increased towards my hands","zh":"血流向手部增加"},{"en":"me to grasp a weapon or to make a strike","zh":"更容易抓武器或出手"},{"en":"adrenaline is released, increasing energy","zh":"释放肾上腺素，增加能量"},{"en":"happiness and calm inhibit negative emotions","zh":"快乐平静抑制消极情绪"}],"logicPhrases":[{"en":"so → I'm looking at these emotions","zh":"那么，如果我观察这些情绪"},{"en":"if → I'm looking at these emotions","zh":"如果我观察这些情绪"},{"en":"so → let's take for instance anger and fear","zh":"那么，以愤怒和恐惧为例"},{"en":"for instance → anger and fear So if I'm feeling angry","zh":"比如愤怒和恐惧，那么如果我感到愤怒"},{"en":"so → I'm feeling angry what happens is all the blood","zh":"那么，如果我感到愤怒，发生的是所有血液"},{"en":"if → I'm feeling angry what happens is all the blood","zh":"如果我感到愤怒，发生的是所有血液"},{"en":"as a result → makes it easier for me to grasp a weapon","zh":"结果，这让我更容易抓起武器"},{"en":"if → I'm feeling happy if I'm feeling calm","zh":"如果我感到快乐，如果我感到平静"}]},{"id":4458,"name":"Neolithic stones","ref":"Historical objects have quite a lot of mathematical significance. These Neolithic stones are probably the first examples of humans exploring the concept of symmetry. One of the intriguing things about these stones is that we don't actually know what they're for, and that's why the speaker likes them. Mathematics is a great subject, created the technology around us, but mathematicians create our mathematical objects for the joy and the beauty.","ana":"I suppose you wouldn't expect perhaps to find a mathematician in a museum of historical objects, but actually, the objects that I've been drawn to in this museum have quite a lot of mathematical significance. 你或许不会想到会在一个历史文物博物馆里遇到一位数学家，但事实上，我在这家博物馆中被吸引的那些展品其实具有相当多的数学意义。 These Neolithic stones, discovered in Scotland, dating back 5,000 years, are probably the first examples of humans exploring the concept of symmetry. 这些在苏格兰发现的新石器时代石块，距今已有五千年历史，它们可能是人类最早探索对称性概念的实例。 And that's what I do as a practicing mathematician. I spend my life trying to understand what symmetries are possible, in nature and in mathematics and abstractly. 而这正是我作为一名职业数学家所做的工作。我毕生都在努力理解自然界、数学中以及抽象层面可能存在的各种对称性。 And here I've got a connection, going back 5,000 years, to people who are already trying to understand–how can I arrange patches on the side of these stone balls in a symmetrical manner? 在这里，我与五千年前的人们建立起了联系——他们当时就已经在尝试理解一个问题：如何将这些石球表面的图案以对称的方式排列？ One of the intriguing things about these stones is that we don't actually know what they're for. 关于这些石块，一个引人入胜的谜团是，我们实际上并不知道它们的用途是什么。 They might have been for divination—trying to predict the future. 它们可能是用于占卜——预测未来。 They might have been part of a game. They look very much like dice, but we don't really think there is any game associated with them. 它们也可能是某种游戏的一部分。它们看起来很像骰子，但我们并不认为它们真的和任何游戏有关。 Maybe they were just for chucking around, they're very nice in the hand when you hold them. 也许它们只是用来抛掷玩耍的，当你拿在手里时，手感非常好。 Or maybe they were symbols of power in the clan. 或者，它们可能是氏族中权力的象征。 I suppose that's why I like them because we don't really know what they are. 我想这正是我喜欢它们的原因之一——因为我们真的不知道它们到底是什么。 If I had a theory about why they were doing this it would be that actually, they were starting to be mathematicians, and that here we see the first example of abstract thought at work. 如果我要推测一下他们为何制作这些石块，我会认为，他们其实已经开始成为数学家了，而这也标志着我们第一次看到抽象思维的运用。 That these weren't for a purpose. 这些石块并不是为了某个具体的目的而制造的。 Mathematics is a great subject, created a lot of the technology around us, but mathematicians we create our mathematical objects for the joy and the beauty, 数学是一门伟大的学科，它创造了我们周围许多技术；但对我们数学家来说，我们创造数学对象是为了其中的乐趣与美感， so it will be lovely to think that these didn't actually have a use, that they were just really a celebration of what's possible. 因此，我认为非常美好的一种想法是：这些石块其实并没有实际用途，它们只是对“可能性”的一种庆祝。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693056/3403a847be504bb4a643d219020342c7.mp3","phrases":[{"en":"Neolithic stones discovered in Scotland","zh":"在苏格兰发现的新石器石头"},{"en":"dating back 5,000 years","zh":"可追溯到 5000 年前"},{"en":"the first examples of exploring symmetry","zh":"探索对称性的最早例子"},{"en":"arranging patches symmetrically","zh":"对称地排列斑块"},{"en":"we don't actually know what they're for","zh":"我们不知道它们的用途"},{"en":"might have been for divination","zh":"可能用于占卜"},{"en":"symbols of power in the clan","zh":"氏族权力的象征"},{"en":"the first example of abstract thought","zh":"抽象思维的最早例子"}],"logicPhrases":[{"en":"but → actually the objects that I've been drawn","zh":"但事实上，我一直被吸引的那些物件"},{"en":"but → don't really think there is any game associated","zh":"但我们并不真的认为有什么与之相关的游戏"},{"en":"when → hold them Or maybe they were symbols of power","zh":"当你握住它们时，又或许它们是权力的象征"},{"en":"because → don't really know what they are","zh":"因为我们并不真正知道它们是什么"},{"en":"if → a theory about why they were doing","zh":"如果我有一个理论来解释他们为什么这样做"},{"en":"but → mathematicians we create our mathematical objects for the joy","zh":"但作为数学家，我们创造数学对象是为了快乐"},{"en":"so → will be lovely to think that these didn't actually","zh":"所以，想到这些实际上并没有……会很美好"}]},{"id":3796,"name":"Organizational study","ref":"This lecture is mainly about organisation courses. Firstly, organisation courses are very important. Organisation courses will help us to get leadership skills in our careers. Those skills that are supplied by organisation courses will be helpful to our careers. People can learn how to satisfy the boss. People had better learn organisation courses if they want to get long terms of successful careers.","ana":"It's really recommended that everybody take some organization studies courses even if you're not planning to become a management specialist. 我强烈建议每个人都选修一些组织学课程，即使你并不打算成为一名自然领域的专家。 These courses will provide leadership skills that we've got courses such as Rosens' Leadership Development. 这些课程将提供领导力方面的技能，我们有像《罗森斯领导力发展》这样的课程。 They're going to give you the interpersonal competencies and skills to advance in your career. 它们将帮助你获得推动职业发展的各种人际交往能力和技能。 So I think org (organisation) studies give people a place to go into a number of different careers, be it in the public sector, the private sector or a nonprofit. 所以我认为组织学为人们进入各种不同的职业道路提供了可能，无论是在公共部门、私营企业还是非营利机构。 I think everyone needs to understand how organizations are structured, how they function and how people interact. 每个人都应该了解组织是如何构建的、它们如何运作以及人与人之间如何互动。 And then to get to your strategic goal. 这样才能实现你的战略目标。 It's really important to take organization studies courses. 因此，选修组织学课程非常重要。 And I know it's a bit of a hard sell for a lot of students who are appearing in it. 我知道这对很多学生来说听起来不是那么吸引人。 But over and over, alumni come back to me and say, you know what, the most important course I've ever taken was organization studies. 但反复地，校友们回来告诉我：“你知道吗，我上过的最重要的课程就是组织学。” And I really wish I took it more because those are the skills that really help me move up in my career. 而且我真希望当时多选修几门，因为正是这些技能真正帮助我在职业生涯中不断晋升。 So those are the competencies or political skills for understanding myself for knowing how to work with difficult people, for knowing how to manage my boss, knowing how to structure the organization, knowing how to create sustainable competitive advantage. 这些能力或说政治技能包括：了解自己、学会与难相处的人合作、懂得如何管理上司、如何建立组织结构、如何创造可持续的竞争优势。 And those are the skills that really differentiate people who are going to have long term successful careers. 而这些技能正是那些拥有长期成功职业生涯的人所具备的特质。","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691704/ea2895ae34c941a68ee5f446fa1ec559.mp3","phrases":[{"en":"take organization studies courses","zh":"修组织研究课程"},{"en":"leadership skills","zh":"领导力技能"},{"en":"interpersonal competencies","zh":"人际能力"},{"en":"careers in public, private or nonprofit","zh":"公共、私营或非营利职业"},{"en":"how organizations are structured, how they function","zh":"组织的构建与运作"},{"en":"political skills","zh":"政治技能"},{"en":"how to work with difficult people","zh":"如何与难相处的人共事"},{"en":"manage my boss","zh":"管理上司"}],"logicPhrases":[{"en":"if → you're not planning to become a management specialist","zh":"如果你不打算成为管理专家"},{"en":"so → I think org (organisation) studies give people a place","zh":"所以我认为组织研究能给人一席之地"},{"en":"but → over and over alumni come back to me and say","zh":"但校友们一再回来对我说"},{"en":"because → the skills that really help me move up","zh":"因为正是这些技能真正帮我晋升"},{"en":"so → the competencies or political skills for understanding myself","zh":"所以这些就是理解自我所需的能力或政治技能"}]},{"id":4465,"name":"Paper rejection","ref":"Rejection can be a disappointing experience. The chance of getting a paper published is becoming smaller and smaller, but rejections will lead to better results and will be good for the career path. Use this feedback to improve your paper for submission to another journal. Also, publication does not mean funding. Investors will learn how to attract and engage young researchers at the same time.","ana":"Rejection happens to all of us, and it can be a disappointing experience. 拒绝是每个人都会经历的事情，它可能是一次令人失望的经历。 I will now give some advice for young researchers. 现在，我想给年轻的研究人员一些建议。 Many things have changed today, which can be a troubling issue. 如今许多事情都发生了变化，这可能会带来一些困扰。 The chance of getting a paper published is becoming smaller and smaller. 论文被发表的机会正变得越来越小。 Although it never is easy to take, rejection is particularly hard at the beginning of your career. 虽然被拒绝从来都不容易接受，但在你职业生涯的初期尤其困难。 But rejections will lead to a better result and will be good for the career path. 但拒绝最终可能会带来更好的结果，并对你的职业发展有益。 Use this feedback to improve your paper for submission to another journal as well as your next, more robust study of the topic. 请利用这些反馈意见来改进你的论文，以便再次投稿到其他期刊，同时也要用于你今后对该主题更深入的研究。 Usually, several individuals with expertise in the topic have donated substantial time to provide detailed advice to advance your paper and future work. 通常，几位在该领域有专长的人士已经花费了大量时间，为你提供了详细的建议，以帮助你提升论文和未来的工作。 Also, remember that publication does not mean funding. 此外，请记住：发表论文并不等于获得资助。 Investors will learn how to attract and engage young researchers at the same time. 投资者也应学会如何吸引并支持年轻的研究人员。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693063/ae72bdecb2c448bca190034b63971eda.mp3","phrases":[{"en":"rejection happens to all of us","zh":"拒稿人人都会遇到"},{"en":"advice for young researchers","zh":"给年轻研究者的建议"},{"en":"the chance of being published is smaller","zh":"发表机会变小"},{"en":"rejection is particularly hard at the beginning of your career","zh":"生涯初期拒稿很难"},{"en":"rejections will lead to a better result","zh":"拒稿带来更好的结果"},{"en":"feedback to improve your paper","zh":"用反馈改进论文"},{"en":"submit to another journal","zh":"投稿到另一个期刊"},{"en":"publication does not mean funding","zh":"发表不等于获得资助"}],"logicPhrases":[{"en":"although → easy to take","zh":"尽管这从来都不容易接受"},{"en":"but → lead to a better result and will","zh":"但拒绝会带来更好的结果，并且会"}]},{"id":4459,"name":"Poetry","ref":"Poetry is an important part of art and culture. Poetry is from the oldest form of literature. The English language in poems and poetry is difficult to understand, making it hard for readers to enjoy poetry, because poems use literary expressions. However, you should learn to simply enjoy it to know more about literature knowledge.","ana":"Today, poetry means an important part of art and culture. 今天，诗歌被视为艺术和文化中重要的一部分。 We often talk about the knowledge about the literature in poems. 我们经常谈论诗歌中的文学知识。 Poetry is from the oldest form of literature, probably predates the origin of writing itself. 诗歌是文学最古老的形式之一，甚至可能早于书写的起源。 The oldest written manuscripts we have are poems. 我们现存最古老的书面手稿就是诗歌。 Mostly epic poems tell the stories of ancient mythology. 这些诗歌大多是史诗，讲述着古代神话故事。 The English language in poems and poetry is difficult to understand, often giving readers a feeling of frustration, making it hard for readers to enjoy poetry. 诗歌中使用的英语语言往往难以理解，常让读者感到沮丧，使他们难以享受诗歌的乐趣。 This is because poems use literary expressions. 这是因为诗歌使用了文学性的表达方式。 Poetry was once written according to fairly strict rules of meter and rhyme, and each culture has its own rule. 诗歌曾经是按照相当严格的格律和押韵规则写成的，每种文化都有自己的规则。 Some poems incorporate rhyme schemes with two or more lines that end in like-sounding words. 一些诗歌采用押韵结构，其中两行或更多行以相似发音的词结尾。 You should learn to simply enjoy it to know more about literature knowledge. 你应该学会去简单地欣赏诗歌，从而了解更多关于文学的知识。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693057/3cdfec5af93147168d993979edc59b95.mp3","phrases":[{"en":"poetry means an important part of art","zh":"诗歌是艺术的重要部分"},{"en":"the oldest form of literature","zh":"最古老的文学形式"},{"en":"predates the origin of writing","zh":"早于文字的起源"},{"en":"The oldest written manuscripts we have are poems","zh":"最古老的手稿是诗歌"},{"en":"epic poems tell stories of mythology","zh":"史诗讲述神话故事"},{"en":"The English language in poems and poetry is difficult","zh":"诗歌中的英语很难"},{"en":"strict rules of meter and rhyme","zh":"严格的格律和押韵规则"},{"en":"rhyme schemes with like-sounding words","zh":"押韵方案"}],"logicPhrases":[{"en":"because → poems use literary expressions","zh":"因为诗歌使用文学表达，诗歌曾按照"},{"en":"according to → fairly strict rules of meter and rhyme","zh":"根据相当严格的格律和押韵规则"}]},{"id":3798,"name":"Population growth","ref":"The speech talks about the population. The growing population is a challenge. It brings pressure on resources. Now we have 7 billion people, and they all need water, food, and other resources. These are all problems of security because the growth will not be equally distributed. This population growth will impact the balance of power. Urban growth is remarkable.","ana":"I hereby do not even need to elaborate too much why I think it is that population matters in the world. 我在此甚至不想过多阐述为什么我认为人口问题在世界上很重要。 These are the kind of topics which are normally cited when thinking about the population, its challenges, its problems, its opportunities, and its own problems. 当我们思考人口问题时，通常会提到这些话题，包括它面临的挑战、问题、机遇以及其自身的问题。 After all, pressure on resources is a very obvious point. 毕竟，资源压力是一个非常明显的问题。 When the world population has now reached 7 billion and is increasing by 7 to 8 million people per year, a diminishing number of course. 目前世界人口已达到70亿，并且每年仍在增加700万到800万人，当然这个数字正在逐渐减少。 But nonetheless it's still quite a challenge, particularly when global population is almost certain to add another 3 billion to that 6 billion with all kinds of questions as to the adequacy of resources, water, particularly in global climate change, but also food and other aspects of resources. 但即便如此，这仍然是一个相当大的挑战，尤其是当全球人口几乎肯定会从60亿再增加30亿时，各种关于资源是否充足的疑问也随之而来，包括水，尤其是在全球气候变化背景下，还有粮食和其他资源方面的问题。 These are all problems of security because this growth will not be equally distributed between different parts of the world. 这些都是安全问题，因为这种增长不会在全球不同地区之间平均分布。 Some parts of the world will grow. Other parts of the world will shrink. 世界上一些地区将增长，而另一些地区则会萎缩。 The balance of power, therefore, will correspondingly change for demographic reasons, as we will see. 因此，正如我们将看到的那样，出于人口结构的原因，权力的平衡也将相应发生变化。 Urban growth is remarkable. We already have megacities of 20 million people. These are going to grow even further in due course. 城市化的增长十分显著。我们已经有了人口达2000万的超级城市，它们在未来还将继续增长。 One wonders just how far they can grow before certain aspects of the infrastructure start breaking down. 人们不禁要问，在某些基础设施开始崩溃之前，这些城市还能扩张到什么程度。","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691707/710547712b92434399f9d43e15b77389.mp3","phrases":[{"en":"pressure on resources","zh":"资源压力"},{"en":"the world population has now reached 7 billion","zh":"世界人口已达 70 亿"},{"en":"increasing by 7 to 8 million people per year","zh":"每年增加 700 到 800 万"},{"en":"adequacy of resources, water and food","zh":"资源、水和食物的充足性"},{"en":"problems of security","zh":"安全问题"},{"en":"urban growth is remarkable","zh":"城市增长惊人"},{"en":"megacities of 20 million people","zh":"2000 万人口的超大城市"},{"en":"infrastructure start breaking down","zh":"基础设施开始崩溃"}],"logicPhrases":[{"en":"when → thinking about the population its challenges","zh":"在思考人口问题及其挑战时"},{"en":"when → now reached 7 billion and is","zh":"当世界人口现已达到70亿，并且正在……"},{"en":"but → nonetheless it's still quite a challenge","zh":"但尽管如此，这仍是个不小的挑战"},{"en":"when → almost certain to add another 3 billion","zh":"当全球人口几乎肯定会再增加30亿时"},{"en":"but → also food and other aspects of resources","zh":"但也涉及粮食和其他资源方面"},{"en":"because → not be equally distributed between different parts","zh":"因为这种增长在不同地区之间不会均衡分布"},{"en":"therefore → will correspondingly change for demographic reasons","zh":"因此会因人口原因而相应变化"}]},{"id":2136,"name":"Question Bank","ref":"Employees' work performance is directly affected by the interior design of their workplace. One inexpensive method for improving performance is placing plants around the office, because they can affect employee productivity and well-being, as well as reducing stress. Another is redesigning office space as open-plan offices can reduce communication by making staff feel reluctant to share ideas openly. Office design therefore has important effects on work culture.","ana":"We need to consider more closely the relationship between the interior of a building and its influence on an individual, because interior designers should evaluate the direct outcome their proposals can have on an employee. 我们需要更仔细地考虑建筑物内部与其对个人的影响之间的关系，因为室内设计师应该评估他们的提案对员工产生的直接影响。 Design can affect them in several ways. 设计会以多种方式影响他们。 Firstly, setting aside spaces for plants in an office is linked to worker well-being and performance. 首先，在办公室为植物留出空间与工人的健康和表现有关。 Research has shown that the simplicity of having plants in a working environment positively affects air quality. 研究表明，只是在工作环境中种植植物这种简单之事，就会对空气质量产生积极影响。 Air that is more filtered than has knock-on effects such as increased productivity, greater concentration and a reduction in stress. 经过更多过滤的空气具有连锁效应，如提高生产力、更集中注意力和减少压力。 This clearly shows that at minimum cost to companies, working performance can be improved. 这清楚地表明，以最低的公司成本，工作绩效可以得到改善。 The second one is not as cost effectively, it concerns office space. 第二个问题不那么具有成本效益，它涉及到办公空间。 While an open plan office is seen to promote interaction and boost communication and productivity, this isn't always true. 虽然开放式办公室被认为可以促进互动、促进沟通和提高生产力，但事实并非总是如此。 I think it has now been proven that it can go the opposite way. 我认为现在已经证明它可以走相反的路。 Open plan offices lead to a lack of face-to-face communication and an over-reliance on electronic interactions as staff feel vulnerable and exposed and less inclined to share ideas. 开放式办公室导致缺乏面对面的沟通和过度依赖电子互动，因为员工感到脆弱和暴露，不太愿意分享想法。 Finally, it seems clear that the interior of a building directly affects performance at work. 最后，很明显，建筑物的内部直接影响工作表现。 Therefore, we should not underestimate how work culture is affected by office design. 因此，我们不应该低估办公室设计对工作文化的影响。","audio":"https://ti.koolearn.com/upload/ti/sardine/2657000-2658000/2657239/a6d707af7a0e41d397907c8d3c5521ac.mp3","phrases":[{"en":"the relationship between building interior and employees","zh":"建筑内部与员工的关系"},{"en":"interior design affects employee performance","zh":"室内设计影响员工表现"},{"en":"plants in an office is linked to worker well-being","zh":"办公室绿植与幸福感相关"},{"en":"positively affects air quality","zh":"改善空气质量"},{"en":"increased productivity and concentration","zh":"提高生产力和专注度"},{"en":"open plan offices promote interaction","zh":"开放式办公室促进互动"},{"en":"a lack of face-to-face communication","zh":"缺乏面对面交流"},{"en":"an over-reliance on electronic interactions","zh":"过度依赖电子交流"}],"logicPhrases":[{"en":"because → evaluate the direct outcome their proposals can","zh":"因为室内设计师应评估其方案能带来的直接结果"},{"en":"while → an open plan office is seen to promote interaction","zh":"虽然开放式办公室被认为能促进互动"},{"en":"finally → seems clear that the interior of a building directly","zh":"最后，似乎很明显，建筑的室内会直接……"},{"en":"therefore → should not underestimate how work culture is affected","zh":"因此，我们不应低估工作文化所受的影响"}]},{"id":2126,"name":"Singapore","ref":"In the lecture, we analyzed Singapore’s dynamic approach to globalization, noting its multicultural population and economic prowess. Citing a University of Chicago professor’s work, we discussed Singapore’s global strategy before exploring its pioneering role in future urban development. By highlighting academic opinions, the talk concluded that Singapore is a model of multiculturalism and innovative urban planning within the global context.","ana":"In today's lecture, I explored Singapore's unique relationship with globalization. 今天的讲座中，我探讨了新加坡与全球化之间独特的联系。 We started by examining its diverse population and the successful blend of cultures thriving within this small yet powerful island nation. 我们首先考察了新加坡多元的人口结构以及在这个小而强大的岛国中繁荣发展的文化融合现象。 I also referenced insights from a University of Chicago professor who has studied Singapore's economic strategies extensively. 我还引用了一位来自芝加哥大学、长期深入研究新加坡经济策略的教授的观点。 Later, we delved into potential future city models and how they might manifest in places like Singapore, which continues to be at the forefront of urban development and planning. 随后，我们深入探讨了未来城市模型以及它们可能在像新加坡这样的地方如何呈现，新加坡一直走在城市开发与规划的前列。 The lecture concluded by citing various academic perspectives to offer a well-rounded discussion; names of notable professors were mentioned to credit their contributions to our understanding of globalization and its impact on Singapore. 讲座以引用多种学术观点作为结尾，旨在提供一个全面的讨论；几位知名教授的名字被提及，以表彰他们在帮助我们理解全球化及其对新加坡影响方面所做出的贡献。 As we scrutinize the examples set by Singapore, it becomes clear that this nation exemplifies the complex dynamics of globalization, standing as a beacon of multiculturalism and forward-thinking urban planning. 当我们仔细审视新加坡所树立的榜样时，可以清楚地看到这个国家体现了全球化的复杂动态，成为多元文化和前瞻性城市规划的典范。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678647/b6e3f591e0124fe2a33d11ca619fb5fa.mp3","phrases":[{"en":"Singapore's unique relationship with globalization","zh":"新加坡与全球化的独特关系"},{"en":"its diverse population","zh":"它多元的人口"},{"en":"the successful blend of cultures","zh":"文化的成功融合"},{"en":"a University of Chicago professor","zh":"芝加哥大学教授"},{"en":"Singapore's economic strategies","zh":"新加坡的经济策略"},{"en":"potential future city models","zh":"未来城市模型"},{"en":"at the forefront of urban development","zh":"处于城市发展的前沿"},{"en":"a beacon of multiculturalism","zh":"多元文化的典范"}],"logicPhrases":[{"en":"yet → powerful island nation I also referenced insights from a University","zh":"然而，这个强大的岛国，我还参考了一所大学的见解"}]},{"id":2137,"name":"Skill-based curriculum","ref":"Although knowledge will be less valued in future job markets, people are still not keen on introducing a curriculum based on skills. This is because the education system is not ready to teach or assess critical thinking collaboration or the other cross-disciplinary skills that businesses value.","ana":"There's a broad agreement that the skills that children will need in the future are different from those that their parents needed in the past. 人们普遍认为，孩子未来需要的技能与他们的父母过去需要的技能不同。 And many people now believe that cross-disciplinary skills, things like critical thinking or collaboration or problem-solving are going to be necessary to survive in the future. 现在许多人相信跨学科技能，比如批判性思维、协作或解决问题，对于未来的生存是必要的。 We can already see that information and knowledge are increasing at an incredible rate, 我们已经可以看到，信息和知识正以惊人的速度增长， such a rate, in fact, that no one individual can ever hope to learn everything they need to know about every subject and stay truly up to date. 事实上，这样的速度让任何人都无法希望学习他们需要知道的关于每个主题的一切，并保持真正的最新状态。 What they need are the skills to locate knowledge, and then use that knowledge in jobs. 他们需要的是找到知识的技能，然后将这些知识用于工作中。 Bear in mind that those jobs may not even exist yet. 请记住，这些工作可能还不存在。 Now, this may be the case, but one of the biggest challenges with delivering cross-disciplinary skills in the school syllabus is that many teachers were trained to teach knowledge, facts rather than skills. 现在，情况可能是这样，但在学校教学大纲中提供跨学科技能的最大挑战之一是，许多教师接受的培训是教授知识事实而不是技能。 Most assessments work with knowledge content. 大多数评估都与知识内容一起工作。 If we are to change the skills that children leave school with, we need to go through a phase of transition that some of those in the education profession feel deeply uncomfortable with. 如果我们要改变离开学校的孩子的技能，我们需要经历一个过渡阶段，一些教育行业的人对此深感不舒服。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658773/fb4440efe7034cc18c7d22c1b0818793.mp3","phrases":[{"en":"the skills that children will need in the future","zh":"孩子未来需要的技能"},{"en":"cross-disciplinary skills","zh":"跨学科技能"},{"en":"critical thinking and problem-solving","zh":"批判性思维和解决问题"},{"en":"information is increasing at an incredible rate","zh":"信息以惊人速度增长"},{"en":"the skills to locate knowledge","zh":"定位知识的技能"},{"en":"jobs may not even exist yet","zh":"工作可能还不存在"},{"en":"teachers trained to teach facts","zh":"老师被训练教事实"},{"en":"a phase of transition","zh":"一个过渡阶段"}],"logicPhrases":[{"en":"yet → be the case","zh":"然而现在情况可能确实如此"},{"en":"but → one of the biggest challenges with delivering cross-disciplinary skills","zh":"但传授跨学科技能的最大挑战之一"},{"en":"if → are to change the skills that children leave school","zh":"如果我们要改变孩子离校时掌握的技能"}]},{"id":3790,"name":"Sleep","ref":"Sleep is essential for learning and memory. Getting enough sleep before and after learning helps consolidate information in the brain. Lack of sleep impairs memory and learning processes. Sleep prepares the brain to absorb new information, acting like a dry sponge. Without sleep, memory circuits become overwhelmed, hindering the absorption of new memories.","ana":"This is a new discovery about learning and memory. 这是一种与学习和记忆相关的新发现。 It is a good thing for you to get enough sleep, and a bad thing for you if not. 睡眠充足对你有益，而睡眠不足则对你有害。 People need to sleep before learning, and people also need to sleep after learning. 人们在学习之前需要睡眠，在学习之后也需要睡眠。 When you are asleep, the memory can consolidate all the information into your brain. 当你入睡时，记忆会将所有信息整合到你的大脑中。 From this point, it may only get worse. 从这个角度来看，情况可能会更糟。 Not only will I tell you about the wonderfully good things that happen when you get sleep, but the alarmingly bad things that happen when you don't get enough both for your brain and your body. 我不仅会告诉你获得足够睡眠带来的诸多好处，还会告诉你睡眠不足对大脑和身体造成的令人担忧的负面影响。 Let me start with the brain and the functions of learning and memory, because what we've discovered over the past 10 or so years is that you need sleep after learning to essentially hit the save button on those new memories so that you don't forget. 让我先从大脑以及学习与记忆的功能谈起。因为在过去大约十年的时间里我们发现，学习之后你需要睡眠，这就像为新的记忆按下“保存”按钮，从而避免遗忘。 But recently, we discovered that you also need sleep before learning and now to actually prepare your brain almost like a dry sponge, ready to initially soak up new information. 但最近我们还发现，学习之前你也需要睡眠，它能让你的大脑像一块干燥的海绵一样，准备好吸收新的信息。 And without sleep, the memory circuits of the brain essentially become waterlogged, as it were. 如果没有足够的睡眠，大脑的记忆回路可以说就像被水浸透了一样。 And you can't absorb new memories. 你就无法吸收新的记忆内容。","audio":"https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691683/fff7d4700ed84c6b9b5b52ba52ce04f6.mp3","phrases":[{"en":"a new discovery about learning and memory","zh":"关于学习和记忆的新发现"},{"en":"need sleep before and after learning","zh":"学习前后都需要睡眠"},{"en":"the memory consolidates information","zh":"记忆巩固信息"},{"en":"hit the save button on those new memories","zh":"为新记忆按下保存键"},{"en":"prepare your brain almost like a dry sponge","zh":"让大脑像干海绵"},{"en":"soak up new information","zh":"吸收新信息"},{"en":"memory circuits become waterlogged","zh":"记忆回路被水浸透"},{"en":"can't absorb new memories","zh":"无法吸收新记忆"}],"logicPhrases":[{"en":"if → not People need to sleep before learning","zh":"否则，人们需要在学习前睡觉"},{"en":"when → are asleep the memory can consolidate all the information","zh":"当你睡着时，记忆能巩固所有信息"},{"en":"when → get sleep but the alarmingly bad things that happen","zh":"当你睡够时，却会发生令人震惊的坏事"},{"en":"but → the alarmingly bad things that happen when you don't get","zh":"但当你没睡够时发生的令人震惊的坏事"},{"en":"when → don't get enough both for your brain and your","zh":"当你没得到足够睡眠，对你的大脑和你的……都不够"},{"en":"because → what we've discovered over the past 10 or so years","zh":"因为过去大约10年里我们所发现的"},{"en":"so → that you need sleep after learning to essentially","zh":"所以这些年表明，学习后你需要睡眠，本质上是为了……"},{"en":"so → don't forget “ ” But recently","zh":"这样你就不会忘记“ ” 但最近"}]},{"id":2141,"name":"Smart skin","ref":"There is now an electronic skin called a smart skin that can be worn to monitor bodily processes. Athletes like it because it gives them real-time information about their bodies as they are training. lt can monitor various things by analysing their sweat. The skin can also show a person's heartbeat. The smart skin is very portable and scientists are exploring the numerous different uses it could have.","ana":"So the development of stretchable electronics or smart skin has long been dreamed of, but it's now become a reality. 因此，可延展电子或智能皮肤的开发长期以来一直是一个梦想，但现在已经成为现实。 It is basically an electronic skin that can be worn in order to monitor various bodily processes. 它基本上是一种可以穿戴的电子皮肤，用于监测各种身体过程。 It's proving particularly popular with elite athletes during training a
