onolingual","zh":"人类大脑出生时本质上是单语的"},{"en":"use two languages at home","zh":"在家使用两种语言"},{"en":"will their child be confused","zh":"他们的孩子会困惑吗"},{"en":"use one language on parent role","zh":"在父母角色中使用一种语言"},{"en":"associate each language with the separate speaker","zh":"将每种语言与不同说话者联系起来"},{"en":"both parents use both languages","zh":"父母双方都使用两种语言"},{"en":"child will not be able to separate","zh":"孩子将无法区分"}],"logicPhrases":[{"en":"especially → based on the conceptualization that the","zh":"尤其是学前阶段基于这样一种概念："},{"en":"because → ask me if they use two","zh":"因为父母常常会问我，如果他们使用两种……"},{"en":"if → use two languages at home will their child","zh":"如果他们在家里使用两种语言，他们的孩子会……"},{"en":"because → hearing two languages And parents often ask my advice","zh":"因为他们听到两种语言，而且家长常征求我的建议"},{"en":"because → were able to associate each language with the separate","zh":"因为他们能将每种语言与各自独立的……联系起来"},{"en":"especially → use both languages interchangeable within the same conversation within","zh":"尤其是他们在同一段对话中互换使用两种语言"}]},{"id":1580,"name":"Biology","ref":"The lecture is about biology. Firstly, the speaker talks about DNA and genetics in cells, in bacteria, and in other stuff. The speaker also talks about the definition of biology. That is the study of life in living organisms. Everyone has different ideas about what is life, for example, your grandma or your best friend or even a philosopher will have different answers. Therefore, in the study of life, scientists needed to agree on the definition of life. 这一讲座是关于生物学的。首先，讲者讨论了细胞中的DNA和遗传学，包括细菌以及其他生物体中的遗传物质。讲者还谈到了生物学的定义——即研究生命和生物体。每个人对什么是生命有不同的看法，例如你的奶奶、最好的朋友，甚至一个哲学家都会给出不同的答案。因此，在研究生命时，科学家们需要就生命的定义达成共识。","ana":"Welcome to your very first tutorial in biology. 欢迎来到你们的第一次生物学辅导课。 Now, in this video series what I want to do is I want to talk to you guys about many different topics concerning biology. 在这个视频系列中，我想和大家讨论许多与生物学相关的话题。 For example, I want to talk to you guys about DNA and genetics in cells, in bacteria, in life and a whole bunch of interesting stuff. 例如，我想和大家讨论DNA和细胞、细菌、生命中的遗传学，以及许多有趣的内容。 But since this is the very first video, I think what we should do in this video is just stick with the very basics. 但由于这是第一期视频，我认为我们应该在本期视频中从最基础的内容开始。 And the first thing I want to do is talk to you guys about what is biology. 我想做的第一件事是和大家讨论什么是生物学。 So, let's go ahead and answer that question. 那么，让我们继续回答这个问题。 And the definition of biology is this: the study of life in living organisms. 生物学的定义是：研究生物体的生命。 All right, that makes sense up to a certain point up until organisms because you may have heard of organisms before. 好吧，这个定义在某种程度上是有道理的，直到提到“生物体”这个概念，因为你可能以前听说过生物体。 And you may have your own definition but the scientific definition of an organism is a living thing. 你可能有自己的定义，但生物学上对生物体的定义是：一个有生命的东西。 Well, that's easy. We know what living things are. 这很简单。我们知道什么是有生命的东西。 I'm a living thing, plants, grass is a living thing. 我就是一个有生命的存在，植物、草也是有生命的东西。 My puppy named Old Dan, cutest puppy ever, by the way, is a living thing but whenever we talk about living things. 我的小狗，名字叫Old Dan，顺便说一句，它是最可爱的小狗，它也是一个有生命的东西，但每当我们谈论有生命的东西时， Believe it or not, things get rid of complicated because then you have to ask yourself 'what is life'. 信不信由你，事情变得复杂了，因为你必须问自己：“什么是生命？” Well, of course, if you ask your grandma or your best friend or even if you ask a philosopher 'what is life', everyone is going to give you kind of a different definition of their outlook on life. 当然，如果你问你的奶奶、最好的朋友，甚至是问一个哲学家“什么是生命”，每个人都会给你一种不同的生命观定义。 However, whenever scientists and biologists were first deciding, you know what, what is life? 然而，当科学家和生物学家首次决定时，你知道吗，什么是生命？ That's the problem that they had everyone had their own separate definition of life itself. 这是他们遇到的问题，每个人都有自己不同的生命定义。 So, what they need to do before biology was even invented, which is of course the study of life, is scientists needed to agree on the definition of life. 所以，在生物学尚未发明之前（生物学当然是研究生命的学科），科学家们需要对生命的定义达成一致。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678153/37052472409644a6a7e84b6b6affebbb.mp3","phrases":[{"en":"very first tutorial in biology","zh":"生物学的第一堂辅导课"},{"en":"many different topics concerning biology","zh":"许多与生物学相关的不同主题"},{"en":"stick with the very basics","zh":"只讲最基础的内容"},{"en":"what is biology","zh":"什么是生物学"},{"en":"study of life in living organisms","zh":"对生命及生物体的研究"},{"en":"scientific definition of an organism","zh":"生物体的科学定义"},{"en":"what is life","zh":"什么是生命"},{"en":"agree on the definition of life","zh":"就生命的定义达成一致"}],"logicPhrases":[{"en":"for example → I want to talk to you guys about DNA","zh":"比如，我想和大家聊聊DNA"},{"en":"but → the very first video","zh":"但既然这是第一个视频"},{"en":"since → the very first video","zh":"既然这是第一个视频"},{"en":"so → let's go ahead and answer that question","zh":"那我们就来回答那个问题吧"},{"en":"because → heard of organisms before","zh":"因为你以前可能听说过生物体"},{"en":"but → the scientific definition of an organism is a living thing","zh":"但生物体的科学定义是有生命的东西"},{"en":"but → whenever we talk about living things","zh":"但每当我们谈到生物时"},{"en":"because → to ask yourself 'what is life'","zh":"因为那样你就得问自己“生命是什么”"}]},{"id":1591,"name":"Bystander effect","ref":"The bystander effect is when people who witness something that they could and should prevent end up taking no action at all. Research suggests that the higher the number of witnesses, the lower the probability that someone will try to intervene. Psychologists attribute this to diffusion of responsibility because in such situations, everyone is waiting for another person to take action. There are ways that we can reduce the influence of the bystander effect. The key principle is to encourage people to imagine that they are the only person who can take action in a situation. 旁观者效应是指那些目睹了他们可以而且应该阻止的事情的人最终没有采取任何行动。研究表明，证人数量越多，有人试图干预的可能性就越低。心理学家将此归因于责任的分散，因为在这种情况下，每个人都在等待另一个人采取行动。有一些方法可以减少旁观者效应的影响。关键原则是鼓励人们想象自己是唯一能够在某种情况下采取行动的人。","ana":"In today's session, we're going to look at an important concept in psychology, which is called the bystander effect. 在今天的会议中，我们将探讨心理学中一个重要的概念，即旁观者效应。 When there's an emergency situation in public, you'd hope that a person nearby would intervene and help. 当公共场合出现紧急情况时，你希望附近的人能够介入并提供帮助。 But actually, most people have a tendency to, well, do nothing. 但实际上，大多数人都有一种倾向，嗯，什么都不做。 That's the bystander effect, essentially. 这基本上就是旁观者效应。 And here's the interesting thing. 这就是有趣的事情。 The more people there are in an emergency situation, the less likely it is that anyone will actually intervene. 紧急情况下的人越多，任何人实际干预的可能性就越小。 There's an inverse relationship between the number of bystanders and the amount of help offered. 旁观者的数量与提供的帮助数量之间存在反比关系。 So why is that? 为什么呢？ Well, researchers have identified something called diffusion of responsibility. 研究人员已经确定了一种叫做责任分散的现象。 Basically, everyone just assumes that someone else will take charge of the situation instead of them. 基本上，每个人都假设别人会代替他们负责局势。 And obviously that can lead to potentially serious consequences. 显然这可能会导致潜在的严重后果。 So that brings me to ways that this problem can be tackled. 这就引出了解决这个问题的方法。 Of course, we should be educating people in school and workplaces about basic first aid and what to do in an emergency that will give people more confidence, but that doesn't address the bystander effect. 当然，我们应该在学校和工作场所教育人们关于基本的急救以及在紧急情况下该怎么做，这将给人们更多的信心，但这并没有解决旁观者效应。 Basically, we have to minimize the diffusion of responsibility. 基本上，我们必须尽量减少责任的分散。 And the best way of doing this is by getting people to imagine that they are the only person available to intervene. 最好的方法是让人们想象自己是唯一可以干预的人。 This gives them the responsibility, so they will be more likely to step in. 这赋予了他们责任，因此他们将更有可能介入。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658432/ed3f4a85d45c4d41a28554c008880408.mp3","phrases":[{"en":"important concept in psychology","zh":"心理学中的重要概念"},{"en":"bystander effect","zh":"旁观者效应"},{"en":"emergency situation in public","zh":"公共场合的紧急情况"},{"en":"tendency to, well, do nothing","zh":"什么都不做的倾向"},{"en":"inverse relationship between the number of bystanders","zh":"旁观者数量与帮助之间的反比关系"},{"en":"diffusion of responsibility","zh":"责任分散"},{"en":"minimize the diffusion of responsibility","zh":"尽量减少责任分散"},{"en":"only person available to intervene","zh":"唯一可以干预的人"}],"logicPhrases":[{"en":"when → there's an emergency situation in public","zh":"当公共场合发生紧急情况时"},{"en":"but → a tendency","zh":"但实际上大多数人都有一种倾向"},{"en":"so → that ？ Well","zh":"那为什么会这样呢？嗯"},{"en":"instead → of them ， 。 And obviously that can lead","zh":"而不是他们。显然，这会导致"},{"en":"so → brings me to ways that this problem can","zh":"所以这就让我想到解决这个问题的办法"},{"en":"but → doesn't address the bystander effect","zh":"但这并没有解决旁观者效应"},{"en":"so → will be more likely to step","zh":"所以他们更有可能介入"}]},{"id":1592,"name":"Canned laughter","ref":"Canned laughter is a sound recording of people's laughter, which is added to make it appear as if a live audience is responding directly to the scene, As studio audiences can behave in unexpected ways, canned laughter is a way of getting laughter in the right places and is also used when a scene is shot away from a studio. Research has shown that canned laughter can also make a program seem funnier to viewers. People are more likely to laugh when they hear canned laughter during a program, Use of canned laughter is becoming less common, but it's still an important element of TV comedy in many countries. 罐装笑声是人们笑声的录音，它被添加以使其看起来像是现场观众直接对现场做出反应，因为工作室观众可以以意想不到的方式表现。罐头笑声是一种在正确的地方获得笑声的方式，也可以在场景从工作室拍摄出来时使用。研究表明，罐装笑声还可以使节目对观众来说更有趣。当人们在节目中听到罐装的笑声时，他们更有可能发笑，罐装的笑声正在变得越来越少，但在许多国家，它仍然是电视喜剧的重要组成部分。","ana":"Today's session is about a feature of TV production called Canned Laughter. 今天的会议是关于电视制作的一个特点，叫做罐头笑声。 A recording of a studio audience laughing inserted into a program so the finished product sounds as if the studio audience is laughing along as the action unfolds. 将演播室观众笑声的录音插入节目中，这样完成的产品听起来就像演播室观众在行动展开时一起笑一样。 There are several reasons for the use of canned laughter, which we can divide into technical reasons and creative ones. 使用罐装笑声有几个原因，我们可以将其分为技术原因和创意原因。 In terms of technical aspects, canned laughter compensates for the unpredictability of live studio audiences. 在技术方面，罐装笑声弥补了现场工作室观众的不可预测性。 For instance, some individuals might laugh too loudly or in what producers consider to be the wrong places, or they might even clap and cheer, all of which can interfere with the scene. 例如，有些人可能笑得太大声或在制片人认为错误的地方，或者他们甚至可能鼓掌和欢呼，所有这些都可能干扰场景。 And of course, canned laughter is also needed when scenes take place outside a studio. 当然，当场景在演播室外面发生时，也需要罐装笑声。 However, canned laughter is also believed to enhance the program itself. 然而，罐装笑声也被认为可以增强节目本身。 Research has shown that the inclusion of canned laughter can actually change people's perceptions of what they're watching. 研究表明，罐装笑声的加入实际上可以改变人们对他们正在观看的内容的看法。 It's been demonstrated that viewers are more likely to laugh or have a favorable impression of a scene when they can hear other people laughing. 已经证明，当观众能听到其他人笑的时候，他们更有可能笑或者对场景有好印象。 So canned laughter is great news for television executives that crave high ratings. 所以罐装笑声对于渴望高收视率的电视高管来说是个好消息。 Of course, as viewers' tastes in comedy have changed, many shows have moved away from the use of canned laughter. 当然，随着观众对喜剧品味的变化，许多节目已经不再使用罐装笑声。 Nevertheless, it remains an effective and familiar aspect of TV comedy. 尽管如此，它仍然是电视喜剧的一个有效和熟悉的方面。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658433/c8d040019331450284e2b12df458a18b.mp3","phrases":[{"en":"feature of TV production called Canned Laughter","zh":"电视制作中称为罐头笑声的特点"},{"en":"recording of a studio audience laughing","zh":"录制演播室观众的笑声"},{"en":"inserted into a program","zh":"插入节目中"},{"en":"technical reasons and creative ones","zh":"技术原因和创意原因"},{"en":"compensates for the unpredictability","zh":"弥补不可预测性"},{"en":"scenes take place outside a studio","zh":"场景发生在演播室外"},{"en":"change people's perceptions","zh":"改变人们的感知"},{"en":"remains an effective and familiar aspect","zh":"仍是有效且熟悉的一部分"}],"logicPhrases":[{"en":"so → the finished product sounds as if the studio audience is","zh":"所以最终成品听起来就像现场观众正……"},{"en":"if → laughing along as the action unfolds","zh":"如果随着情节展开，现场观众也跟着笑"},{"en":"for instance → laugh too loudly or in what producers","zh":"例如，有些人可能笑得太大声，或者以制片人……的方式笑"},{"en":"when → scenes take place outside a studio","zh":"当场景发生在演播室外时"},{"en":"however → also believed to enhance the program itself","zh":"然而，罐头笑声也被认为能提升节目本身"},{"en":"when → can hear other people laughing","zh":"当他们听到别人在笑时"},{"en":"so → great news for television executives that crave","zh":"所以，对渴望……的电视高管来说，罐头笑声是个好消息"}]},{"id":1603,"name":"Cave paintings","ref":"The world's first artists did cave paintings. They lived maybe as long as 40000 years ago. Instead of people, they painted animals. Animals were important because they used them for food and clothes. They also made hand prints on cave walls by painting around their hands. Research on paintings in a French cave showed that both men and women did them. People used to think the artists were usually men, but women have smaller hands than men, and most handprints in that cave were smaller ones. This is important because we now have to think again about who those early artists were. 世界上最早的艺术家创作了洞穴壁画。他们大概生活在40000年前。他们画的不是人，而是动物。动物很重要，因为它们用它们做食物和衣服。他们还通过在洞穴墙壁上画上手印。对法国一个洞穴中绘画的研究表明，男人和女人都进行过绘画。人们过去认为艺术家通常是男性，但女性的手比男性小，并且那个洞穴中的大多数手印都是较小的。这很重要，因为我们现在必须重新思考那些早期艺术家是谁。","ana":"The world's first artists were ancient people who lived 40000 years ago or more and did cave paintings. 世界上最早的艺术家是生活在40000年前或更长时间前并进行洞穴壁画的古代人。 But what did they paint? 但是他们画了什么呢？ And who exactly were these early artists? 这些早期艺术家究竟是谁？ Well, they didn't paint human beings. 嗯，他们没有画人类。 Instead, they painted animals on the walls of their caves. 相反，他们在洞穴的墙壁上画动物。 That's because animals were very important to them. 那是因为动物对他们非常重要。 After all, the animals provided them with food and clothing, as well as animals. 毕竟，动物为他们提供食物和衣服，以及动物。 They put their hands against the cave walls and painted around them. 他们把手放在洞穴墙壁上，在周围画画。 And it's these handprints which may help us to answer the second question, who did the paintings? 正是这些手印可以帮助我们回答第二个问题，谁做了这些画？ For a long time, it was believed that it was mostly men. 长期以来，人们认为主要是男性。 However, research done on paintings in a cave in France has shown that the artists were often women and not just men. 然而，对法国洞穴中绘画的研究表明，艺术家通常是女性而不仅仅是男性。 We know this because the size of women's hands is smaller than men's hands. 我们之所以知道这一点，是因为女人的手比男人的手小。 In fact, the majority of the hand prints in the French cave were smaller ones. 事实上，法国洞穴中的大多数手印都是较小的。 This has made us think again about who the world's first artists really were. 这让我们重新思考世界上最早的艺术家到底是谁。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658430/dd33a669d39b4a04b9c74769a6f5b5e6.mp3","phrases":[{"en":"world's first artists","zh":"世界上最早的艺术家"},{"en":"lived 40000 years ago","zh":"生活在四万年前"},{"en":"did cave paintings","zh":"绘制洞穴壁画"},{"en":"painted animals on the walls","zh":"在墙上画动物"},{"en":"provided them with food and clothing","zh":"为它们提供食物和衣物"},{"en":"hands against the cave walls","zh":"把手贴在洞穴墙壁上"},{"en":"paintings in a cave in France","zh":"法国洞穴中的壁画"},{"en":"artists were often women","zh":"艺术家常常是女性"}],"logicPhrases":[{"en":"but → they paint And who exactly were these early","zh":"但他们画了什么呢？这些早期的人究竟是谁？"},{"en":"instead → painted animals on the walls of their caves","zh":"相反，他们在洞穴墙壁上画动物。"},{"en":"because → very important to them","zh":"因为动物对他们非常重要。"},{"en":"however → research done on paintings in a cave","zh":"然而，对法国一处洞穴中绘画的研究已经……"},{"en":"because → smaller than men's hands","zh":"因为女性的手比男性的手小。"}]},{"id":3374,"name":"Chest X-Ray","ref":"The picture of the x-ray is a good example using the biomedical technology. The x-ray can go through our body, and doctor can look into our bodies, which they cannot do it without the help of x-ray. We can see bones, organs in the x-ray. The doctor can diagnose it, and know what’s wrong with our body. It shows the integration of biomedical technology. x射线的图片是使用生物医学技术的一个很好的例子。x光可以穿过我们的身体，医生可以检查我们的身体，没有x光的帮助他们无法做到这一点。我们可以在x光片中看到骨头和器官。医生可以诊断，知道我们的身体出了什么问题。它展示了生物医学技术的融合。","ana":"This is one picture that you probably you all know what it is when you see it. 这是一张大家看到后应该能立刻认出的图片。 It's a familiar looking image. 这是一幅非常熟悉的图像。 It's something that probably we all have some personal experience with,right? 想必我们每个人都有过相关的亲身经历，对吧？ This is a chest x-ray that would be taken in your doctor's office, for example, or a radiologist's office. 这是一张在医生办公室或放射科可能会拍摄的胸部 X 光片。 And it is a good example of Biomedical Engineering and that it takes a physical principle, that is how do x-rays interact with the tissues of your body, and it uses that physics, that physical principle to develop a picture of what's inside your body, so to look inside and see things that you couldn't see without this device. 它很好地体现了生物医学工程的原理，即利用 X 射线与人体组织相互作用的物理原理，通过这种物理原理来生成体内器官的图像，从而能够透视内部并看到通过这种设备才能看到的物体。 And you'll recognize some parts of the image, you can see the ribcage here, the bones you can see the heart is the large bright object down here. 你们会认出图片中的某些部分，比如这里可以看到胸腔，能看到骨骼，而心脏就是下面那个较大的亮物体。 If you, have good eyesight from the distance,you can seethe vessels leading out of the heart and into the lungs, and the lungs are darker spaces within the ribcage. 如果你们从远处看的话，还能看到从心脏流出并进入肺部的血管，而肺部则是胸腔内的较暗区域。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690265/a5a2692e5bf94f8d8b40aa37cd16d15a.mp3","phrases":[{"en":"familiar looking image","zh":"熟悉的图像"},{"en":"chest x-ray","zh":"胸部X光片"},{"en":"good example of Biomedical Engineering","zh":"生物医学工程的好例子"},{"en":"x-rays interact with the tissues","zh":"X射线与组织相互作用"},{"en":"see the ribcage here","zh":"在这里看到胸腔"},{"en":"heart is the large bright object","zh":"心脏是大的明亮物体"},{"en":"vessels leading out of the heart","zh":"从心脏延伸出的血管"},{"en":"lungs are darker spaces","zh":"肺部是较暗的区域"}],"logicPhrases":[{"en":"when → see it","zh":"当你看到它时，它是一张看起来很熟悉的图像"},{"en":"for example → or a radiologist's office X And it is a good","zh":"例如，或者放射科医生的办公室 X，而且这很不错"},{"en":"so → to look inside and see things that you couldn't see","zh":"从而观察内部，看到你原本看不到的东西"},{"en":"if → have good eyesight from the distance","zh":"如果你从远处看视力很好"}]},{"id":3353,"name":"Civilization and art","ref":"This lecture talks about civilization and art. It is impossible to have a civilization without art. Civilization reflects the production of culture and the producers of art and culture should mirror back to the core of the society. People themselves and individuals are relating to the social structure at that time. Art is the vehicle through which we understand that were you to take away art, and it also reflects that how people look at the world in different ways. 这节课讲述了文明与艺术的关系。没有艺术就不可能有文明。文明反映了文化的生产，而艺术和文化的生产者应该将社会的核心反映出来。人们自身以及个体与当时的社会结构之间的关系也在其中体现。艺术是我们理解这一切的媒介。如果没有艺术，我们将无法看到人们如何以不同的方式看待世界。","ana":"I have said before that you can’t have a civilization that doesn’t have art when we think about the great civilizations historically. 我之前说过，任何一个文明如果没有艺术是无法存在的，尤其是当我们回顾历史上那些伟大的文明时。 All of them had a great production of culture and art because a society has built to observe itself and the sophistication of the great civilizations was their ability to look at themselves. 它们都有着伟大的文化和艺术创作，因为一个社会的建立是为了观察自身，而伟大文明的复杂性就在于它们能够自我反思。 And what allows a society to do that are the producers of art and culture with mirror back to the core of the society exactly. 而使社会能够做到这一点的正是艺术和文化的创造者，他们将社会的核心精确地映射出来。 What is being produced at that moment? How people are thinking of themselves and how individuals are relating to the social structure at that time. 那个时代生产的是什么？人们如何看待自己，个体如何与当时的社会结构相关联。 Art is the vehicle through which we understand that. 艺术是我们理解这一切的载体。 Were you to take away art, what would be that mirror? How would we see what we were about? 如果去掉艺术，我们的镜子在哪里？我们如何看待我们自己的存在？ How would we understand what was going on in Paris at the time of the Impressionists when people were learning to see in a completely different way? 我们如何理解印象派画家时代巴黎的情景，当时人们正在学习以一种完全不同的方式来看待世界？ Pre-cinematography Pierre all of these things are just emerging and here are people looking at the world in a very different way, which was considered so radical at that time. 在电影摄影术之前，所有这些都刚刚出现，且这些人以一种非常不同的方式看待世界，而这在当时被认为是非常激进的。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690242/df80ca77fd2247cda72fbf8724adcdd6.mp3","phrases":[{"en":"civilization that doesn’t have art","zh":"没有艺术的文明"},{"en":"great production of culture and art","zh":"文化和艺术的巨大产出"},{"en":"a society has built to observe itself","zh":"一个社会建立以观察自身"},{"en":"ability to look at themselves","zh":"自我审视的能力"},{"en":"producers of art and culture","zh":"艺术和文化的生产者"},{"en":"mirror back to the core","zh":"反映社会核心"},{"en":"Art is the vehicle","zh":"艺术是媒介"},{"en":"Paris at the time of the Impressionists","zh":"巴黎印象派时期"}],"logicPhrases":[{"en":"when → think about the great civilizations historically","zh":"当我们从历史角度思考伟大文明时"},{"en":"because → built to observe itself and the sophistication","zh":"因为一个社会已构建出观察自身及其精妙复杂之处"},{"en":"when → were learning to see in a completely different way","zh":"当人们学会以完全不同的方式观看时"},{"en":"so → radical at that time","zh":"在当时如此激进"}]},{"id":3378,"name":"Climate change","ref":"This lecture talks about the influence of climate change. According to the speaker, he has mentioned some points of view. Climate change will make less production and less food. It is difficult for developing countries to deal with climate change due to their financial status and other issues. There are many people living in hungry, especially in Africa. The climate change will also have negative effects on the world economy. 本讲座讲述了气候变化的影响。演讲者提到了一些观点。气候变化将导致减产和粮食减少。由于发展中国家的财政状况和其他问题，它们很难应对气候变化。许多人生活在饥饿之中，尤其是在非洲。气候变化还会对世界经济产生负面影响。","ana":"Some adverse effects of climate changes to agricultural productions. 气候变化对农业生产造成诸多负面影响。 Some lands are unsuitable for growing crops. 部分土地已不再适宜作物生长。 There will be millions of people facing hunger in Africa in the near future. 近期非洲将有数百万人面临饥荒威胁。 Climate change will result in less production and less food. 气候变化将导致粮食减产与食品短缺。 It is difficult for developing countries to deal with climate change due to their financial status and other issues. 受制于财政状况等因素，发展中国家难以应对气候变化。 There are many people living in hunger especially in Africa. 目前已有大量人口处于饥饿状态，尤以非洲为甚。 The climate change has devastating effects on world economy. 气候变化对全球经济造成破坏性影响。 The tropical areas on earth are dry and hot, and are originally not suitable for food production. 地球热带区域原本就因干旱炎热而不利粮食生产。 The change of climate leads to extreme weather conditions such as floods and hurricanes, which exacerbates the food production. 气候变迁引发洪水、飓风等极端天气，进一步恶化粮食生产环境。 As a result, it leads to a continuous decline in food supply annually around 10 to 17%. 由此导致全球粮食供应量以每年10%-17%的速度持续递减。 And this trend is perceived to be continuing in the future by 2070. 预计这一趋势将延续至2070年。 The regions suffering the most will be some African countries. 部分非洲国家将成为受灾最严重的地区。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690269/4a34ee05632f44a18a5c11ccd26b2b02.mp3","phrases":[{"en":"adverse effects of climate changes","zh":"气候变化的不利影响"},{"en":"unsuitable for growing crops","zh":"不适合种植作物"},{"en":"millions of people facing hunger in Africa","zh":"非洲数百万人面临饥饿"},{"en":"less production and less food","zh":"产量和食物减少"},{"en":"difficult for developing countries","zh":"发展中国家面临困难"},{"en":"extreme weather conditions such as floods","zh":"洪水等极端天气"},{"en":"continuous decline in food supply","zh":"粮食供应持续下降"},{"en":"regions suffering the most","zh":"受灾最严重的地区"}],"logicPhrases":[{"en":"especially → in Africa","zh":"尤其在非洲，气候变化对世界造成毁灭性影响"},{"en":"as a result → leads to a continuous decline in food supply annually","zh":"因此，这导致粮食供应每年持续下降"}]},{"id":3366,"name":"Clouds","ref":"The lecture is about clouds.There are a lot of interesting things about clouds.The key question that people not directly address until very recently is what actually forms these clouds.The clouds are incredibly important players in climate change, and that they reflective the white, they reflect the light back into space and so they’re keeping things much, much cooler than they would be if they weren’t there.They also play a huge role in regional weather. 这个讲座是关于云的。关于云有很多有趣的事情。人们直到最近才直接提出的关键问题是，这些云究竟是什么形成的。云在气候变化中扮演着非常重要的角色，它们反射白光，它们将光反射回太空，所以它们使温度比没有它们时低得多。它们在地区天气中也起着巨大的作用。","ana":"There is a lot of interesting. What forms these clouds, why are these clouds there, why do they sort of stick around? 这里有很多有趣的内容。这些云是怎么形成的？为什么会有这些云存在？它们又为何会一直停留在那里？ At the center, every cloud drop has a particle. 在云的核心部分，每一个云滴都附有一个微粒。 You can't grow a cloud drop without having a particle there for the water to condense on. 如果没有这样的微粒，水就无法凝结形成云滴。 The key question that people not directly address until very recently is what actually forms these clouds. 直到最近，人们才开始探讨一个关键问题，即究竟是什么造就了这些云。 So for once you're looking out at over the ocean, turns out sea spray, sea salt is a very effective nucleus for forming clouds. 当你俯瞰海洋时，结果发现海浪喷溅物、海盐是形成云滴的非常有效的微粒。 So it's a really good chance that those are loaded with sea salt. 因此，这些云很有可能富含海盐。 But if you go inland, you start to have pollution come from all kinds of places, and so different sources form clouds more effectively than others, and we're trying to unravel which sources are actually contributing to the clouds. 但当你进入内陆地区时，就会发现来自各种地方的污染也随之而来，所以不同的污染源对云的形成作用也各不相同。我们正试图弄清楚究竟是哪些污染源在对云的形成产生影响。 The clouds are incredibly important players in climate change, and that they reflective the white, they reflect the light back into space and so they're keeping things much, much cooler than they would be if they weren't there. 云在气候变化中起着极其重要的作用，它们反射白色，将光线反射回太空，从而使地球的温度比没有云时要低得多。 They also play huge role in regional weather, so in actual we're starting to see shifts where having more pollution input into the clouds is affecting weather patterns, in particular, is actually reducing the precipitation so we're starting to see drought in areas with super high levels of air pollution. 它们在区域气候方面也发挥着重要作用，因此实际上我们已经开始看到一些变化：由于更多的污染物进入云层，这影响了天气模式，特别是导致降水量减少，因此我们开始在空气污染程度极高的地区看到干旱现象。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690257/71d5f54d9b334282be62307c4b7292c7.mp3","phrases":[{"en":"What forms these clouds","zh":"这些云是如何形成的"},{"en":"every cloud drop has a particle","zh":"每个云滴都有一个微粒"},{"en":"what actually forms these clouds","zh":"究竟是什么形成了这些云"},{"en":"sea salt is a very effective nucleus","zh":"海盐是非常有效的凝结核"},{"en":"pollution come from all kinds of places","zh":"污染来自各种地方"},{"en":"different sources form clouds more effectively","zh":"不同来源更有效地形成云"},{"en":"important players in climate change","zh":"气候变化中的重要参与者"},{"en":"affecting weather patterns reducing precipitation","zh":"影响天气模式并减少降水"}],"logicPhrases":[{"en":"so → for once you're looking out at over the ocean","zh":"所以这一次，你正眺望着海洋"},{"en":"so → it's a really good chance that those are loaded","zh":"所以那些很可能已满载"},{"en":"but → go inland you start to have pollution come","zh":"但如果你深入内陆，污染就开始出现"},{"en":"if → go inland you start to have pollution come","zh":"如果你深入内陆，污染就开始出现"},{"en":"so → different sources form clouds more effectively than others","zh":"所以不同来源形成云比另一些更有效"},{"en":"so → they're keeping things much much cooler than they would","zh":"所以它们让温度比原本低得多"},{"en":"if → weren't there","zh":"如果它们不在那里，它们也在区域层面发挥巨大作用"},{"en":"so → in actual we're starting to see shifts where having more","zh":"所以实际上，我们开始看到拥有更多……的转变"}]},{"id":1583,"name":"Cosmic Civilization","ref":"The lecture talks about the possibility of existence of other cosmic civilizations. Every year, 7 stars are formed, but most planets around them are either too hot or too cold to appear life. Only 20% of all planets meet all necessary criteria that have chance to have life. However, the chance of appearance of life is very small, which is close to zero. Even though it is important to continue the search, it is very hard to find other cosmic civilizations. 讲座讨论了其他宇宙文明存在的可能性。每年有7颗新恒星形成，但围绕它们的大多数行星要么太热，要么太冷，无法孕育生命。只有20%的行星满足所有必要条件，才有机会存在生命。然而，生命出现的可能性非常小，几乎接近于零。尽管继续探索其他宇宙文明非常重要，但要找到它们却非常困难。","ana":"It begins by stating that every year, seven new stars are formed. 它一开始指出，每年都会形成七颗新的恒星。 However, most of the planets orbiting these stars are either too hot or too cold to sustain life. 然而，围绕这些恒星运行的大多数行星要么过热，要么过冷，无法维持生命。 Only around 20% of all planets meet the necessary criteria to have the possibility of hosting life. 只有大约 20% 的行星符合可能孕育生命的必要条件。 Despite these favorable conditions, the chances of life actually appearing are incredibly small, almost close to zero. 尽管有这些有利条件，生命真正出现的几率却非常小，几乎为零。 This has made the search for other cosmic civilizations extremely difficult. 这使得寻找其他宇宙文明变得极其困难。 Scientists have been tirelessly exploring the vast expanse of the universe, using various methods such as radio signals and telescope observations, in the hope of finding evidence of extraterrestrial life. 科学家们一直不懈地探索广袤的宇宙，借助无线电信号、望远镜观测等多种方法，希望找到地外生命的证据。 While the lecture does not provide concrete proof of the existence of other civilizations, it emphasizes the importance of continuing the search. 尽管这场讲座并未提供其他文明存在的确凿证据，但它强调了继续探索的重要性。 The quest to discover other cosmic civilizations not only helps us understand the universe better but also raises fundamental questions about the origins of life and our place in the cosmos. 探索其他宇宙文明的过程不仅有助于我们更好地理解宇宙，还引发了关于生命起源以及我们在宇宙中位置的根本性问题。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658438/573e79e98df548d9956c33e945291b0d.mp3","phrases":[{"en":"every year, seven new stars are formed","zh":"每年形成七颗新恒星"},{"en":"too hot or too cold","zh":"太热或太冷"},{"en":"Only around 20% of all planets","zh":"只有约20%的行星"},{"en":"chances of life actually appearing","zh":"生命实际出现的几率"},{"en":"search for other cosmic civilizations","zh":"寻找其他宇宙文明"},{"en":"radio signals and telescope observations","zh":"无线电信号和望远镜观测"},{"en":"importance of continuing the search","zh":"继续搜寻的重要性"},{"en":"origins of life and our place","zh":"生命的起源和我们的位置"}],"logicPhrases":[{"en":"however → most of the planets orbiting these stars are either too","zh":"然而，围绕这些恒星运行的大多数行星要么太"},{"en":"despite → these favorable conditions the chances of life actually appearing are","zh":"尽管有这些有利条件，生命实际出现的几率仍然"},{"en":"while → not provide concrete proof of the existence","zh":"虽然讲座没有提供关于存在的确凿证据"},{"en":"but → also raises fundamental questions about the origins of life","zh":"而且还提出了关于生命起源的根本性问题"}]},{"id":1589,"name":"Dietary guidance","ref":"The speaker said that some health messages about food are confusing. For example, there are debates about whether fat or sugar is bad for you, when in fact both are problematic. She said that dietary guidance to the public should shift away from a focus on individual nutrients, such as protein and carbohydrate towards guidelines relating to actual food, for example, meat, vegetables or biscuits. Moreover, the issue isn't about deciding which foods to eat or to abstain from. Instead, it's about eating patterns as a whole and the proportions of the different foods in relation to each other. 演讲者提到，一些关于食物的健康信息令人困惑。例如，人们争论脂肪或糖哪一种有害，而实际上两者皆有问题。她认为，向公众提供的饮食指导应该从关注蛋白质、碳水化合物等单一营养素，转变为关于实际食物的指导，比如肉类、蔬菜或饼干。此外，问题的关键不在于决定哪些食物该吃还是该戒掉，而是在于整体的饮食模式以及不同食物之间的比例关系。","ana":"I think there are a lot of confusing messages about health and food out there that don't really help the cause. 我认为有很多关于健康和食物的信息令人困惑，对我们的目标并没有真正帮助。 Look at the most recent debate, fat versus sugar, two things that we know scientifically are of concern. 看看最近的争论，脂肪与糖，从科学角度我们知道这两样东西是值得关注的。 And I think a big problem is that in the field of nutrition science, we look at individual nutrients like fat, carbohydrate, protein, etc., to figure out the metabolic consequences of food. 我认为一个很大的问题是，在营养科学领域，我们关注单个营养素，比如脂肪、碳水化合物、蛋白质等，以此来研究食物的代谢影响。 And so when we're putting out public guidance about what we should be eating, we talk in terms of nutrients instead of converting those nutrients into foods like fish, fruit, cookies, and so on. 因此，当我们发布关于应该吃什么的公共指导时，我们用营养素来讨论，而不是将这些营养素转化为具体的食物，比如鱼、水果、饼干等等。 But I think talking about foods rather than nutrients is an important step we need to take. 但我觉得谈论食物，而非营养素，是我们需要采取的重要一步。 At the same time, we don't have to say to people, you can eat this or you can't eat that, but we should help give people a wider view of the relative proportions of various food groups and dietary patterns on the whole. 同时，我们不需要告诉人们你能吃这个或不能吃那个，但我们应该帮助人们更全面地了解各类食物群和整体饮食模式的相对比例。","audio":"https://ti.koolearn.com/upload/ti/sardine/2657000-2658000/2657057/20e292dbf7cc4fde8985497458b43330.mp3","phrases":[{"en":"confusing messages about health and food","zh":"关于健康和食物的混乱信息"},{"en":"recent debate, fat versus sugar","zh":"近期争论：脂肪与糖"},{"en":"field of nutrition science","zh":"营养科学领域"},{"en":"individual nutrients like fat, carbohydrate, protein","zh":"脂肪、碳水、蛋白质等单一营养素"},{"en":"metabolic consequences of food","zh":"食物的代谢后果"},{"en":"putting out public guidance","zh":"发布公共指南"},{"en":"foods rather than nutrients","zh":"关注食物而非营养素"},{"en":"relative proportions of various food groups","zh":"各类食物群的相对比例"}],"logicPhrases":[{"en":"so → we're putting out public guidance about what we should","zh":"所以，当我们发布关于我们应该怎样做的公众指南时"},{"en":"when → we're putting out public guidance about what we should","zh":"当我们发布关于我们应该如何的公众指南时"},{"en":"instead → of converting those nutrients into foods like fish","zh":"而不是把那些营养素转化成鱼之类的食物"},{"en":"so → on But I think talking about foods rather than nutrients","zh":"所以，但我认为，谈论食物而不是营养素"},{"en":"but → I think talking about foods rather than nutrients is an","zh":"但我认为，谈论食物而不是营养素是一个"},{"en":"but → should help give people a wider view of the","zh":"但我们应该帮助人们更广泛地看待……"}]},{"id":4281,"name":"Dimension","ref":"A dimension is defined by the number of numbers needed to specify a location. For example, the Earth’s equator is one-dimensional because only longitude is required to pinpoint a location there. The Earth’s surface and the space above the Earth is two and three-dimensional respectively. Mathematically, dimensions aren’t limited to three—four-dimensional space needs four numbers, five-dimensional space needs five, and so on. An event, like a finger snap, requires four numbers to specify—three for its spatial location and one for the time it occurs. 维度由确定一个位置所需的数字数量来定义。例如，地球的赤道是一维的，因为只需经度就能确定那里的一个位置。地球表面和地球上方的空间分别是二维和三维的。从数学角度而言，维度并不局限于三维 —— 四维空间需要四个数字，五维空间需要五个数字，依此类推。像打响指这样的事件，确定它需要四个数字 —— 三个用于表示其空间位置，一个用于表示其发生时间。","ana":"So, let me begin with the notion of a dimension. 那么，我先从 “维度” 的概念讲起。 A dimension is simply how many numbers you need to specify a location. 维度指的就是确定一个位置所需要的数字数量。 So, if we think about the surface of the earth, the equator is one-dimensional: you need to specify only one number to specify a location on the equator, namely the longitude. 比如说，我们想想地球表面：赤道是一维的 —— 要确定赤道上的一个位置，只需要一个数字，也就是经度。 The surface of the earth, altogether, is of course two-dimensional: you need to specify two numbers—latitude and longitude—to specify a location on the earth. 而整个地球表面当然是二维的 —— 要确定地球上的一个位置，需要两个数字，即纬度和经度。 The space above the earth is three-dimensional: if I want to tell you the location of a hang glider, I need to give you the latitude, longitude, and altitude. 地球上方的空间则是三维的 —— 如果我想告诉你一个悬挂式滑翔机的位置，就需要给你三个信息：纬度、经度和海拔高度。 But mathematically, there’s no reason to stop at three dimensions. A four-dimensional space is simply a space in which you need to specify four numbers to specify a location in that space. 但从数学角度来说，维度并不局限于三维。四维空间指的就是确定其中一个位置需要四个数字的空间； A five-dimensional space would be one in which you need to specify five numbers, etc. 五维空间则需要五个数字，以此类推。 In fact, I claim you already know an example of a four-dimensional space. 其实，我敢说你已经知道一个四维空间的例子了。 So let's define an event: just to be an occurrence that happens in a small region of space at a definite time. 我们先来定义 “事件”：事件指的是在某个小空间区域、某个特定时间发生的一件事。 In other words, an event is like a snap of your fingers or a clap of your hands. 换句话说，像打响指、拍手这样的行为都可以算作事件。 And now, the collection of all events—if I want to specify an event, I need to give you four numbers: I need to tell you where it happens in space and when it happens in time. 而所有事件的集合 —— 如果我要描述一个事件，就需要四个数字：我得告诉你它发生在空间的哪个位置，以及发生在时间的哪个时刻。","audio":"https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693315/61acafb6d55a4482a8d44ec2acead956.mp3","phrases":[{"en":"notion of a dimension","zh":"维度的概念"},{"en":"how many numbers you need","zh":"需要多少个数字"},{"en":"specify a location","zh":"确定一个位置"},{"en":"equator is one-dimensional","zh":"赤道是一维的"},{"en":"surface of the earth","zh":"地球表面（二维例子）"},{"en":"space above the earth is three-dimensional","zh":"地球上方的空间是三维的"},{"en":"no reason to stop at three dimensions","zh":"没有理由止步于三维"},{"en":"define an event","zh":"定义一个事件"}],"logicPhrases":[{"en":"so → let me begin with the notion of a dimension","zh":"那么，我先从维度的概念讲起"},{"en":"so → think about the surface of the earth","zh":"那么，如果我们想想地球表面"},{"en":"if → think about the surface of the earth","zh":"如果我们考虑地球表面"},{"en":"if → I want to tell you the location of a hang","zh":"如果我想告诉你一个东西的位置"},{"en":"but → mathematically there’s no reason to stop at three dimensions","zh":"但从数学上讲，没有理由止步于三维"},{"en":"so → let's define an event: just to be an occurrence","zh":"那么，让我们定义一个事件：它只是一次发生"},{"en":"if → I want to specify an event","zh":"如果我想指定一个事件"},{"en":"when → happens in time","zh":"当它在时间中发生时"}]},{"id":1574,"name":"Discovering the port of Roman London","ref":"This lecture is about the historical records of Roman London. There are few records of its history in both antiquity and contemporary references. If the historian try to write the history of Roman London, it's really difficult because of the lack of data. And so, the port of London was discovered with no historical documentation, like custom books. We have to understand the port entirely from archaeological evidence. 这节讲座讲的是罗马时期伦敦的历史记录。无论是古代还是当时的文献资料，关于这段历史的记载都非常少。如果历史学家试图撰写罗马伦敦的历史，会非常困难，因为缺乏相关数据。因此，伦敦港口的发现就没有历史文献的记载，比如海关书籍。我们只能完全依靠考古证据来了解这个港口。","ana":"But what we are going to discuss today is how the port of London was discovered and what we discovered about it. 但今天我们要讨论的是伦敦港口是如何被发现的，以及我们发现了关于它的哪些信息。 Now if you look at the historical records of Roman London, there is only about 14 actual references to London in antiquity and contemporary references. 现在，如果你查看罗马时期伦敦的历史记录，你会发现古代和同期文献中提到伦敦的地方实际上只有大约14处。 And all those only one is in the first century, there are none at all at the second or third century. 而这些记载中，只有一个出现在公元一世纪，二世纪和三世纪完全没有任何记载。 There is only one in the late third century and there are four in the fourth century. 而公元三世纪末只有一个记载，四世纪有四个记载。 So if you are a historian trying to write the history of Roman London, it's really difficult. 所以，如果你是一个历史学家，试图写出罗马时期伦敦的历史，那真的很困难。 You don't have much data, you're going to depend on the archaeological evidence, the material evidence of the port and indeed the town to have any understanding of what happened then. 你没有太多的数据，你将不得不依赖考古证据、港口的实物证据，甚至是城镇的实物证据，才能理解当时发生了什么。 And so, what we're looking at here is how did we discover about the port of London, there is no historical documentation, no customs books, no tariffs, no idea of the taxes. 所以，我们在这里研究的是我们是如何发现伦敦港口的，那里没有历史文献、没有海关书籍、没有关税记录，也没有税收的任何概念。 We have to understand the port entirely from the archaeological evidence. 我们必须完全通过考古证据来理解这个港口。 So that's what we are going to do today. 这就是我们今天要做的事情。 So, if we move on to the next slide, I love live streaming. Thank you very much. 那么，如果我们进入下一张幻灯片，我喜欢直播。非常感谢。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678148/b0873f2b92844c50b8b276a2e60bdbf2.mp3","phrases":[{"en":"how the port of London was discovered","zh":"伦敦港口是如何被发现的"},{"en":"historical records of Roman London","zh":"罗马伦敦的历史记录"},{"en":"only about 14 actual references","zh":"只有约 14 处真实记载"},{"en":"only one is in the first century","zh":"一世纪只有一处"},{"en":"none in the second or third century","zh":"二三世纪完全没有"},{"en":"depend on the archaeological evidence","zh":"依靠考古证据"},{"en":"the material evidence of the port","zh":"港口的实物证据"},{"en":"no customs books, no tariffs","zh":"没有海关记录、没有关税"}],"logicPhrases":[{"en":"but → going to discuss today is how the","zh":"但今天我们要讨论的是，……是如何"},{"en":"if → look at the historical records of Roman London","zh":"如果你查看罗马时期伦敦的历史记录"},{"en":"so → are a historian trying to write the history","zh":"所以，如果你是一位试图撰写这段历史的历史学家"},{"en":"if → are a historian trying to write the history","zh":"如果你是一位试图撰写这段历史的历史学家"},{"en":"so → what we're looking at here is how did we discover","zh":"所以，我们这里要看的是：我们是如何发现……的"},{"en":"so → going to do today","zh":"所以，这就是我们今天要做的事情"},{"en":"so → move on to the next slide","zh":"那么，如果我们继续看下一张幻灯片"},{"en":"if → move on to the next slide","zh":"如果我们继续看下一张幻灯片"}]},{"id":1568,"name":"Double pendulum","ref":"The chaos physics equation for a double pendulum explores the unpredictability and complexity of its motion. Even minor differences in initial conditions can lead to significant variations in behavior, known as the butterfly effect. Researchers use computer simulations and physical models to study this system, gaining insights into its nonlinear dynamics. The double pendulum serves as an intriguing example of chaos theory and highlights the intricate dynamics of seemingly simple physical systems. 双摆的混沌物理方程探讨了其运动的不可预测性和复杂性。即使初始条件存在微小差异，也会导致行为上的显著变化，这种现象被称为“蝴蝶效应”。研究人员通过计算机模拟和物理模型来研究这一系统，从而深入了解其非线性动力学特性。双摆是混沌理论的一个引人入胜的例子，它揭示了看似简单的物理系统所具有的复杂动力学行为。","ana":"The chaos physics equation for a double pendulum is a fascinating topic that explores the intricate dynamics of this system. 双摆混沌物理方程是一个探讨该系统复杂动力学特性的引人入胜的主题。 The equation involves a set of coupled differential equations that describe the motion of the two linked pendulums. 该方程包含一组描述两个连结摆锤运动的耦合微分方程。 Factors such as the length of each arm, the mass of the pendulum bob, and the initial angles of displacement all contribute to the complexity of the equation. 诸如每根摆臂长度、摆锤质量以及初始偏转角度等因素均会影响该方程的复杂性。 What makes the double pendulum intriguing is its sensitivity to initial conditions. 双摆的独特之处在于其对初始条件的敏感性。 Even the smallest deviation in the starting position or velocity can lead to drastically different outcomes. 即使起始位置或速度存在微小偏差，也会导致截然不同的结果。 This phenomenon, commonly known as the butterfly effect, highlights the chaotic nature of the double pendulum's motion. 这一现象通常称为蝴蝶效应，凸显了双摆运动的混沌特性。 The chaos physics equation for the double pendulum has practical relevance in various fields, such as robotics and physics education. 双摆混沌物理方程在机器人学和物理教育等多个领域具有实际意义。 Researchers use computer simulations and physical models to experiment with this system, gaining insights into its nonlinear behavior. 研究人员通过计算机模拟和物理模型对此系统进行实验，从而深入了解其非线性行为。 In conclusion, the chaos physics equation for the double pendulum showcases the complexity and unpredictability of its motion. 总之，双摆混沌物理方程展示了其运动的复杂性和不可预测性。 This system serves as an intriguing example of chaos theory, reminding us of the intricate dynamics hidden within seemingly simple physical systems. 该系统作为混沌理论的生动案例，提醒我们看似简单的物理系统中可能隐藏着复杂的动力学特性。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658427/5d8f2912274c4f4b8d02d506016825e9.mp3","phrases":[{"en":"the chaos physics equation","zh":"混沌物理方程"},{"en":"the dynamics of a double pendulum","zh":"双摆的动力学"},{"en":"coupled differential equations","zh":"耦合微分方程"},{"en":"the length, mass and initial angles","zh":"长度、质量和初始角度"},{"en":"sensitivity to initial conditions","zh":"对初始条件的高度敏感"},{"en":"the butterfly effect","zh":"蝴蝶效应"},{"en":"computer simulations and physical models","zh":"计算机模拟和物理模型"},{"en":"complexity and unpredictability of its motion","zh":"运动的复杂性和不可预测性"}],"logicPhrases":[]},{"id":1584,"name":"Early Robot","ref":"The first robots were characters in a play in the 1920s called Rossum’s Universal Robots, and the writer was Karel Capek. People tend to thinks of robots as cute cuddly toys. But the first robots were actually created and imagined in a time of absolute political turmoil, which was the First World War. The robots are actually in the play assembled on a production line. Even even though they are human, they are assembled and these robots are designed to labour, and that is their primary purpose in society. 第一次机器人出现在1920年代的一部名为《罗萨姆的万能机器人》（Rossum's Universal Robots）的戏剧中，作者是卡雷尔·恰佩克。人们通常把机器人看作是可爱、温顺的玩具。但实际上，最初的机器人是在第一次世界大战这一极端政治动荡的时期被创造和构思出来的。戏剧中的机器人实际上是通过生产线组装的。尽管它们是人类外形，但它们是被组装出来的，设计的主要目的是劳动，这也是它们在社会中的首要角色。","ana":"This is a kind of object that you’re probably all familiar with when you had the term robot, but I’m gonna show you the very, very first robots. 说到机器人，你们可能都很熟悉，但我将向你们展示最早的机器人。 These were the very first robots. They were characters in a play in the 1920s called Rossum’s Universal Robots, and the play was written by Czech writer called Karel Capek. 这些就是最早的机器人。它们是1920年代一部名为《罗斯姆的万能机器人》剧中的角色，这部剧由捷克作家卡雷尔·恰佩克创作。 And basically, these robots, you know, people tend to think of robots as kind of cute cuddly toys or, you know, Hollywood depictions kind of devoid of politics. 基本上，这些机器人，你知道，人们往往认为机器人是那种可爱、毛茸茸的玩具，或者像好莱坞描绘的那样，不带政治色彩。 But the first robots were actually created and imagined in a time of absolute political turmoil. 但最早的机器人实际上是在一个完全政治动荡的时期创造和构思出来的。 You just had the First World War, you know, it finished had a devastating impact across Europe and so people were kind and people are kind of reflecting on what does it mean to be human, what makes us human, those kinds of question. 第一次世界大战结束后，欧洲满目疮痍，人们由此开始反思什么是人类、是什么使我们成为人类这类问题。 And this kind of context is what inspired Capek to kind of write this play. 正是这种背景启发了恰佩克创作这部剧。 And interestingly, these robots being human, they are actually in the play assembled on a production line, a bit like the Ford manufacturing production line. 有趣的是，这些机器人成为“人类”后，在剧中实际上是在一个生产线上组装的，类似于福特的制造生产线。 So even though they are human, they are assembled and these robots are designed to labor, and that is their primary purpose in society. 所以尽管它们是“人类”，它们仍然被组装，这些机器人被设计为劳动者，这是它们在社会中的主要目的。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678157/8b84bcb1405349f499bac35f651dbd42.mp3","phrases":[{"en":"very first robots","zh":"最早的机器人"},{"en":"characters in a play in the 1920s","zh":"20世纪20年代戏剧中的角色"},{"en":"Rossum’s Universal Robots","zh":"《罗素姆万能机器人》"},{"en":"Czech writer called Karel Capek","zh":"捷克作家卡雷尔·恰佩克"},{"en":"time of absolute political turmoil","zh":"绝对政治动荡的时期"},{"en":"what does it mean to be human","zh":"作为人意味着什么"},{"en":"assembled on a production line","zh":"在流水线上组装"},{"en":"designed to labor","zh":"被设计来劳动"}],"logicPhrases":[{"en":"when → had the term robot","zh":"当你用到“机器人”这个词时"},{"en":"but → I’m gonna show you the very","zh":"但我要向你们展示的正是……"},{"en":"but → actually created and imagined in a","zh":"但最早的机器人实际上是在一个……中被创造和想象出来的"},{"en":"so → were kind and people are kind of reflecting","zh":"所以人们很善良，而人们也在某种程度上反思着"},{"en":"so → human","zh":"所以，即使他们是人类"},{"en":"though → assembled and these robots are","zh":"尽管他们是人类，他们却是被组装起来的，而这些机器人是……"}]},{"id":3356,"name":"Early spring","ref":"The lecture mainly talks about the spring time phenomena, which means that first blooms of flowers are getting earlier. The first cause if the rising temperature and another reason is urban light pollution, which pushed bud burst earlier, and way beyond what rising temperatures could achieve. The lecture also mentions that this disruptive timing can ripple through the ecosystem such as caterpillars and birds. However, smarter lighting could help with reducing early bud burst. 本次讲座重点探讨了春季物候提前现象，即植物开花期普遍提早的趋势。该现象主要由两大因素驱动：其一是持续上升的气温，其二是城市光污染——后者对花芽提前萌发的促进作用甚至远超温度变化的影响。讲座进一步指出，这种物候时序的紊乱会在生态系统中产生连锁反应，波及毛毛虫与鸟类等生物。不过研究也表明，通过优化城市照明方案能够有效缓解花芽过早萌发的问题。","ana":"The Earth's temperature is rising. 地球的气温正在上升。 And as it does, springtime phenomena—like the first bloom of flowers—are getting earlier and earlier. 随着气温的升高，春季现象，比如花朵的首次盛开，正变得越来越早。 But rising temperatures aren't the only factor. 但气温上升并不是唯一的因素。 Urban light pollution is also quickening the coming of spring. 城市的光污染也在加快春天的到来。 \"So temperature and light are really contributing to a double whammy of making everything earlier.\" “所以气温和光线的变化共同形成了叠加效应，让一切都提前发生。” Richard Ffrench-Constant, an entomologist at the University of Exeter. 这是理查德·弗伦奇-康斯坦特说的，他是埃克塞特大学的一位昆虫学家。 He and his colleagues compiled 13 years of data from citizen scientists in the U.K., who tracked the first bud burst of four common trees. 他和他的同事们整理了英国公民科学家们在13年间收集的数据，这些人追踪了四种常见树木的首次发芽时间。 Turns out, light pollution from streetlights in cities, and along roads pushed bud burst a full week earlier. 结果发现，来自城市街灯和公路的光污染使得树木的发芽时间提前了整整一周。 Way beyond what rising temperatures could achieve. 远远超过了气温上升本身所能引起的提前幅度。 This disruptive timing can ripple through the ecosystem. 这种时序的扰乱会在生态系统中产生连锁反应。 \"The caterpillars that feed on trees are trying to match the hatching of their eggs to the timing of bud burst.\" “以树叶为食的毛毛虫会试图将卵的孵化时间与树木发芽的时间匹配。” \"Because the caterpillars want to feed on the juiciest and least chemically protected leaves.\" “因为毛毛虫想吃的是最嫩、化学防御最弱的叶子。” \"And it's not just the caterpillars, of course, that are important.\" “当然，重要的不只是毛毛虫。” \"But the knock-on effect is on nesting birds, which are also trying to hatch their chicks at the same time that there's the maximum number of caterpillars.\" “这种影响会传递到筑巢的鸟类，它们也会试图让自己的雏鸟孵化时间与毛毛虫数量最多的时候重合。” So earlier buds could ultimately affect the survival of birds, and beyond. 所以发芽时间提前最终可能会影响鸟类的生存，甚至波及更广泛的生态关系。 The findings are in the Proceedings of the Royal Society B. 这一研究成果发表在《皇家学会学报B辑》上。 The world's becoming increasingly urbanized, and light pollution is growing which Ffrench-Constant says could trick trees into budding earlier and earlier. 世界正变得日益城市化，光污染也在加剧，弗伦奇-康斯坦特表示，这可能会误导树木越来越早地发芽。 But smarter lighting like LEDs that dial down certain wavelengths could help. 不过，更智能的照明方式，比如减少某些波长的LED灯，可能会有所帮助。 \"Perhaps the exciting thing is, if we understand more about how light affects this bud burst, we might be able to devise smarter sort of streetlighting that has less red components, and therefore less early bud burst.\" “也许令人振奋的是，如果我们更了解光线如何影响树木发芽，我们或许能设计出更智能的街灯，减少红光成分，从而减少树木的早发芽现象。” Thus keeping springtime an actual springtime phenomenon. 从而让春天现象真正出现在春天。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690246/66d213bd36de4fceb12a4e8bb30cd346.mp3","phrases":[{"en":"Earth's temperature is rising","zh":"地球温度正在上升"},{"en":"Urban light pollution","zh":"城市光污染"},{"en":"quickening the coming of spring","zh":"加速春天的到来"},{"en":"compiled 13 years of data","zh":"汇总了13年的数据"},{"en":"pushed bud burst a full week earlier","zh":"使发芽整整提前一周"},{"en":"ripple through the ecosystem","zh":"在整个生态系统中产生连锁反应"},{"en":"maximum number of caterpillars","zh":"毛毛虫数量的高峰"},{"en":"smarter lighting like LEDs","zh":"像LED这样的智能照明"}],"logicPhrases":[{"en":"but → rising temperatures aren't the only factor","zh":"但气温上升并非唯一因素。"},{"en":"so → really contributing to a double whammy","zh":"所以温度和光照确实在共同造成双重打击。"},{"en":"because → the caterpillars want to feed on the juiciest and least","zh":"因为毛毛虫想取食最多汁、最不……"},{"en":"but → on nesting birds","zh":"但连锁反应会影响到筑巢的鸟类。"},{"en":"so → ultimately affect the survival of birds","zh":"所以更早发芽最终可能影响鸟类的生存。"},{"en":"but → smarter lighting like LEDs that dial down certain wavelengths could","zh":"但像LED这样可调低某些波长的更智能照明可能……"},{"en":"if → understand more about how light affects this bud burst","zh":"如果我们更了解光如何影响这种发芽"},{"en":"therefore → less early bud burst \" “ ” Thus keeping springtime","zh":"因此提前发芽更少，\" “ ” 从而保持春季"}]},{"id":2552,"name":"File a patent","ref":"This lecture is mainly about patent. It would be impossible to get a patent on presentation clickers, since they have been used for a while. However, if we are able to get a patent on them, it would be incredibly valuable. Every single clicker that was made after that point would infringe, and we could collect $1-2 each. That would be added up to be a decent amount of money. If we choose the million-word version, we have almost 100% chance of getting that patent, but the value of that patent would be close to zero. 这一讲座主要讲述专利。如果我们能够为点击器获得专利，那将是非常有价值的。从那时起，每一个制造的点击器都会侵权，而制造每个点击器可能都需支付一两美元。最终，累积起来会成为一笔相当可观的金额。如果我们要申请的专利是极尽详细的百万字版本，我们几乎有100%的机会获得专利，但这个专利的价值几乎为零。","ana":"We’re thinking about this and we’re trying to say, alright, well, let’s file on a patent on this clicker. 我们在思考这个问题，试图说，好吧，让我们为这个点击器申请专利。 If I were to go to the patent office and say, alright, I want a patent on a clicker, period. 如果我去专利局说，好吧，我想要一个点击器的专利，就这样。 The patent officer would just laugh. 专利官员只会笑。 You know, the clicker has been around for a while. Presentation clickers have been around for a while. 你知道，点击器已经存在一段时间了，演示用点击器也已经存在很久了。 And so there would be a 0% chance that you would actually get that. 因此，你几乎不可能获得这个专利。 If we were to somehow convince the patent office that we should be able to get on a patent on clicker, period. 如果我们能以某种方式说服专利局，认为我们应该获得点击器的专利。 It would, however, be incredibly valuable. 然而，这将会是非常有价值的。 Every single clicker that was made after this point would infringe. 此后，每个制作的点击器都会侵犯该专利。 And when it infringes, maybe we take one or two dollars each. 当它侵犯专利时，或许我们每次能收取一两美元。 That would be added up to be a decent amount of money. 这些加起来将会是一个可观的金额。 On the other end of the spectrum, let’s go to the million-word version. 从另一个角度来看，假设我们选择百万字版本。 I go to the patent office and I say, I want a patent on this exact thing. 我去专利局说，我想要这个精确的东西的专利。 And those million words describe every single radius, every single material, every single thing about this. 而这百万个字描述了每一个半径、每一种材料、每一个细节。 And the patent officer says, yeah, we've never seen that before. Go ahead and take it. 然后专利官员说，嗯，我们从没见过这个，去吧，给你专利。 Almost 100% of chance of getting that patent, but the value of that patent would be close to zero. 几乎100%的机会可以获得这个专利，但这个专利的价值几乎为零。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678145/a1b32a79179b4522ad5cbdc92889bfbb.mp3","phrases":[{"en":"file on a patent on this clicker","zh":"为这个点击器申请专利"},{"en":"patent officer would just laugh","zh":"专利审查员只会一笑置之"},{"en":"0% chance","zh":"0%的可能性"},{"en":"incredibly valuable","zh":"极其有价值"},{"en":"after this point would infringe","zh":"此后生产的都会侵权"},{"en":"million-word version","zh":"百万字版本"},{"en":"Almost 100% of chance","zh":"几乎100%的机会"},{"en":"would be close to zero","zh":"价值会接近零"}],"logicPhrases":[{"en":"if → to go to the patent office and say","zh":"如果我去专利局说"},{"en":"while → been around for a","zh":"虽然演示翻页笔已经存在了一段时间"},{"en":"while → be a 0% chance","zh":"而这样一来，几率为0%"},{"en":"so → be a 0% chance that you would actually","zh":"所以你实际上……的可能性为0%"},{"en":"if → were to somehow convince the patent office","zh":"如果我们能以某种方式说服专利局"},{"en":"however → be incredibly valuable Every single clicker that was made after","zh":"然而会极其有价值；此后制造的每一支翻页笔"},{"en":"when → infringes maybe we take one or two dollars each","zh":"当它侵权时，也许我们每支收取一两美元"},{"en":"but → be close to zero","zh":"但那个专利的价值将接近于零"}]},{"id":3357,"name":"Fire safety","ref":"BSI leads the way in testing and certification of fire safety products, including fire extinguishers, hoses, and alarm panels. They help clients to gain access into the European market. They test for compatibility of fire detection and fire alarm system components.They also perform tests on individual detection components. For the public, they provide the reassurance that fire safety products are effective and reliable. BSI在消防安全产品的测试和认证方面处于领先地位，包括灭火器、消防水带和报警面板。他们帮助客户进入欧洲市场，并测试火灾探测和报警系统组件的兼容性。他们还对单独的探测组件进行测试。对于公众来说，他们提供了消防安全产品有效性和可靠性的保证。","ana":"With over 40 years unrivaled experience and a worldwide reputation, BSI leads the way in testing and certification of fire safety products. 凭借超过40年无可匹敌的经验和享誉全球的声誉，BSI在消防安全产品的测试与认证领域处于领先地位。 Based on our dedicated labs in Hemel Hempstead, our team provides BSI Kitemark and CE testing and certification for a broad range of products, including fire extinguishers, hoses, alarm panels, and heat and smoke detectors. 我们在赫默尔亨普斯特德的专用实验室基础上，团队为各类产品提供BSI风筝标志和CE标志的测试与认证服务，包括灭火器、水带、报警面板，以及热感与烟感探测器。 We help clients to gain access into the European market by ensuring that products meet all the CE mark requirements. 我们协助客户进入欧洲市场，确保其产品符合所有CE标志要求。 And we are familiar with the market access regulations of most countries across the world, enabling customers to enter markets globally. 同时，我们熟悉全球大多数国家的市场准入规定，帮助客户开拓全球市场。 The BSI Kitemark is categorized as a British superbrand and acknowledged the world over as a symbol of trust, integrity, and quality. BSI风筝标志被归类为英国超级品牌，并被全球公认为信任、诚信与质量的象征。 It provides the reassurance that vital product safety and performance requirements have been met. 这一标志为产品符合关键安全与性能要求提供了有力保障。 Our team subjects each product to a rigorous set of tests along with robust production control audits designed specifically to ensure that they conform to required standards of safety and quality. 我们的团队会对每一款产品进行严格的测试，并配合严密的生产控制审核，确保其符合所需的安全和质量标准。 We test for compatibility of fire detection and fire alarm system components to ensure that they're compatible and connectable. 我们还会测试火灾探测与报警系统组件之间的兼容性，确保它们互兼容、可连接。 This service meets the growing requirement of European regulatory authorities to meet national installation guidelines. 这一服务满足了欧洲监管机构日益增长的需求，以满足各国安装规范要求。 We also perform tests on individual detection components. 我们也对单个探测部件进行测试。 Fire suppression products such as fire extinguishers are subjected to rigorous tests designed to ensure that they're effective, safe and capable of performing in environments and conditions in which they're stored and used. 如灭火器等灭火产品，也将接受一系列严格测试，以确保其在储存和使用的各种环境与条件下仍然有效、安全、可靠。 The symbols for BSI Kitemark and CE certification represent quality, safety, and trust. BSI风筝标志和CE认证标志象征着质量、安全与信任。 For specifiers, they demonstrate a commitment to best practice procurement. 对于采购方而言，这些标志体现了其对最佳采购实践的承诺。 And for the public, they provide the reassurance that fire safety products are effective and reliable. 而对于公众来说，这些标志则提供了消防安全产品有效且可靠的信心保障。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690247/b22ff7495a7a4db488f1acd452996075.mp3","phrases":[{"en":"over 40 years unrivaled experience","zh":"40 多年无与伦比的经验"},{"en":"testing and certification of fire safety products","zh":"消防安全产品的测试与认证"},{"en":"dedicated labs in Hemel Hempstead","zh":"位于 Hemel Hempstead 的专门实验室"},{"en":"BSI Kitemark and CE testing and certification","zh":"BSI Kitemark 和 CE 测试与认证"},{"en":"gain access into the European market","zh":"进入欧洲市场"},{"en":"categorized as a British superbrand","zh":"被归类为英国超级品牌"},{"en":"rigorous set of tests","zh":"严格的测试组合"},{"en":"fire detection and fire alarm system components","zh":"火灾探测和火灾报警系统组件"}],"logicPhrases":[]},{"id":1588,"name":"Four fundamental forces","ref":"The lecture talks about four fundamental forces that work in the universe. According to the lecture, gravity is one of the four forces. It's what keeps our ankles to the surface of the earth, and keeps the Earth in orbit around the Sun. Another force is the electromagnetic force. That is the force that is responsible for the electricity, electric currents for light. There are two other forces that we're less familiar with, one of those forces is called the strong nuclear force. The other nuclear force is called the weak nuclear force. 这一讲座讲述了宇宙中四种基本力。根据讲座，引力是其中一种力。它使我们的双脚稳稳站在地球表面，并能使地球围绕太阳转。另一种力是电磁力。这种力与电流、光以及电力的作用息息相关。还有两种我们不太熟悉的力，其中一种叫做强核力。另一种核力叫做弱核力。","ana":"There are four fundamental forces at work in the universe. 宇宙中存在四种基本作用力。 Some of them are very familiar from everyday life. Some of them are not. 其中一些在日常生活中非常熟悉，而另一些则不然。 So we all know about gravity. 比如我们都知道引力。 That's one of the four forces. 引力是这四种力之一。 It's what keeps our ankles to the surface of the earth, and keeps the Earth in orbit around the Sun. 它使我们的双脚紧贴地面，也使地球围绕太阳运转。 There is another force that we're very familiar with, which is the electromagnetic force. 还有另一种我们也很熟悉的力，那就是电磁力。 That is the force that is responsible for the electricity, electric currents for light, for the sun's light, that's electromagnetic radiation coming from the Sun to the Earth. 电磁力负责电能、电流、光的传播，以及阳光——即从太阳传到地球的电磁辐射。 There are two other forces though that are somewhat less familiar. 不过，还有另外两种我们不太熟悉的力。 They are the nuclear forces. 它们是核力。 They are forces that are at work within the nuclear atoms. 这些力作用在原子核内部。 One of those forces is called the strong nuclear force. 其中一种叫做强核力。 That really is the force that bides protons to protons, bides the quarks inside of the protons and neutrons keeping them from flying out. 它是真正将质子彼此结合在一起的力量，也将质子和中子内部的夸克束缚住，防止它们飞散。 The other nuclear force is called the weak nuclear force. 另一种核力叫做弱核力。 And that's a force that predominantly we know of because it's responsible for radioactivity and radioactive decay. 我们主要了解它是因为它负责放射性现象，即放射性衰变。 So those four forces—strong nuclear force, weak nuclear force, electromagnetic force and gravitational force—those are the forces that work in the universe. 因此，这四种力——强核力、弱核力、电磁力和引力——就是宇宙中起作用的基本力。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678138/5ec50bc10090411e92a2a7499f5ccb1d.mp3","phrases":[{"en":"There are four fundamental forces","zh":"存在四种基本力"},{"en":"we all know about gravity","zh":"我们都了解引力"},{"en":"electromagnetic force","zh":"电磁力"},{"en":"responsible for the electricity","zh":"负责电力/电流"},{"en":"two other forces","zh":"另外两种力"},{"en":"strong nuclear force","zh":"强核力"},{"en":"weak nuclear force","zh":"弱核力"},{"en":"responsible for radioactivity","zh":"负责放射性"}],"logicPhrases":[{"en":"so → all know about gravity","zh":"所以我们都了解引力"},{"en":"though → are somewhat less familiar","zh":"不过这些就没那么熟悉了"},{"en":"because → it's responsible for radioactivity and radioactive decay","zh":"因为它导致放射性和放射性衰变"},{"en":"so → those four forces strong nuclear force","zh":"那么这四种力中的强核力"}]},{"id":1586,"name":"Gas giants","ref":"The lecture talks about two theories for how the gas giants formed. According to the lecture, one theory is called core accretion, and the other is called disk instability. It's unclear exactly how they formed but you're right what we're trying to do. So it's very possible that the insides of these planets could have metallic cores, hydrogen cores, and rocky portions. But the higher pressure we can get in the lab, the closer we can get to understanding the interiors of the gas giants and exoplanets that are so big. 这一讲座讲述了关于气态巨行星形成的两种理论。根据讲座，一种理论叫做核吸积理论，另一种叫做星盘不稳定理论。目前还不完全清楚它们到底是如何形成的，但我们正在努力探索。气态巨行星的内部很可能具有金属核心、氢核心和岩石部分。不过，我们在实验室中能获得的更高压力，能够帮助我们更接近理解气态巨行星和如此庞大的系外行星的内部结构。","ana":"So there are two theories for how the gas giants formed. 关于气态巨行星是如何形成的，有两种理论。 One is the same theory I showed you just now — core accretion, right? 其中一个就是我刚刚给你展示的核吸积理论，对吧？ And the other is called disk instability, and one of our colleagues at DTM has done a lot of work on that. 另一个理论叫做星盘不稳定理论，我们在DTM（地球与行星实验室）的一位同事对此做了大量研究。 And so it's unclear exactly how they formed but you're right — what we're trying to do, the reason we're trying to get the higher and higher pressure in the lab is because we are trying to understand more about the pressure inside the gas giants. 因此，目前它们究竟是如何形成的还不明确，但你说得对——我们在实验室中尝试获得越来越高的压力，正是因为我们想更好地了解气态巨行星内部的压力。 It's thought that the gas giants also have a metallic core, but maybe a metallic core is not made of iron. 人们认为气态巨行星也有金属态内核，但这种金属态内核可能并不是由铁构成的。 Hydrogen, for example, becomes metallic at a certain pressure, ok? 例如，氢在某一特定压力下会变成金属态，明白吗？ So it's very possible that the insides of these planets could have metallic cores, could have hydrogen cores, could have rocky portions. 所以，这些行星内部很可能有金属态内核，也可能是氢核，或者包含岩石成分。 We're not sure. 我们目前还不能确定。 But the higher pressure we can get in the lab, the closer we can get to understanding the interiors of the gas giants and the exoplanets that are so big. 但我们在实验室中获得的压力越高，我们就越接近理解这些气态巨行星以及那些巨大的系外行星的内部结构。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658440/8c03da842ca047eba622a00c59ccba20.mp3","phrases":[{"en":"how the gas giants formed","zh":"气态巨行星是如何形成的"},{"en":"core accretion","zh":"核心吸积"},{"en":"disk instability","zh":"盘不稳定性"},{"en":"unclear exactly how they formed","zh":"它们究竟如何形成尚不清楚"},{"en":"higher and higher pressure in the lab","zh":"实验室中获得越来越高的压力"},{"en":"pressure inside the gas giants","zh":"气态巨行星内部的压力"},{"en":"metallic core is not made of iron","zh":"金属核心并非由铁构成"},{"en":"becomes metallic at a certain pressure","zh":"氢在一定压力下变为金属"}],"logicPhrases":[{"en":"so → two theories for how the gas giants formed","zh":"所以关于气态巨行星如何形成，有两种理论"},{"en":"so → it's unclear exactly how they formed but you're right","zh":"所以它们究竟如何形成尚不清楚，但你说得对"},{"en":"but → you're right what we're trying","zh":"但你说得对，我们正在尝试做的事情"},{"en":"because → are trying to understand more about the pressure inside","zh":"因为我们正试图更多地了解内部的压力"},{"en":"but → maybe a metallic core is not made of iron","zh":"但也许金属核心不是由铁构成的"},{"en":"for example → becomes metallic at a certain pressure","zh":"例如，在特定压力下会变成金属态"},{"en":"so → it's very possible that the insides of these planets could","zh":"所以这些行星的内部很可能可以"},{"en":"but → get in the lab","zh":"但我们在实验室里能获得的压力越高"}]},{"id":1570,"name":"Globalization","ref":"This is globalization about the example of chicken died and bank bust. This is the miracle enabled us to transship our bodies and our minds around the planet ever faster and ever cheaper. There is a lot of bad stuff and good stuff. A lot of extraordinary successes of the Millennium Development Goals. Humanity is capable of achieving extraordinary progress if acts together and tries hard. 这一讲座讲述了全球化的例子，包括鸡的死亡和银行的破产。全球化是一个奇迹，使我们能够以更快、更经济的方式将我们的身体和思想传递到地球的各个角落。全球化既带来了许多坏事，也伴随着许多好事。千年发展目标取得了许多非凡的成就。人类如果共同努力、全力以赴，完全有能力取得非凡的进展。","ana":"I've been thinking a lot about the world recently and how it's changed over the last 20, 30, 40 years. 最近，我一直在思考世界，以及它在过去的20年、30年、40年里是如何变化的。 Twenty or thirty years ago, if a chicken caught a cold and sneezed and died in a remote village in East Asia, it would have been a tragedy for the chicken and its closest relatives, but I don't think there was much possibility of us fearing a global pandemic and the deaths of millions. 二三十年前，如果一只鸡在东亚的一个偏远村庄感冒、打喷嚏然后死掉，那对这只鸡及其亲近的亲戚来说是个悲剧，但我不认为我们会担心全球疫情爆发，导致数百万人死亡的可能性。 Twenty or thirty years ago, if a bank in North America lent too much money to some people who couldn't afford to pay it back and the bank went bust, that was bad for the lender and bad for the borrower, but we didn't imagine it would bring the global economic system to its knees for nearly a decade. 二三十年前，如果北美的一家银行向一些还不起款的人借出了过多的钱，银行倒闭，那对贷方和借方来说都是坏事，但我们并没有想到这会让全球经济体系瘫痪近十年。 This is globalization. 这就是全球化。 This is the miracle that has enabled us to transship our bodies and our minds and our words and our pictures and our ideas and our teaching and our learning around the planet ever faster and ever cheaper. 这就是全球化的奇迹，它使我们能够以更快、更经济的方式将我们的身体、思想、言辞、图片、观念、教学和学习传输到全球各地。 It's brought a lot of bad stuff, like the stuff that I just described, but it's also brought a lot of good stuff. 它带来了许多不好的东西，比如我刚才描述的那种情况，但它也带来了许多好东西。 A lot of us are not aware of the extraordinary successes of the Millennium Development Goals, several of which have achieved their targets long before the due date. 我们许多人没有意识到千年发展目标带来的非凡成就，其中几个早早就达成了预定的目标。 That proves that this species of humanity is capable of achieving extraordinary progress if it really acts together and it really tries hard. 这证明了人类这一物种，如果真正团结一致并努力行动，是能够取得非凡进展的。","audio":"https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678143/1640b3caebe340d3a589b857864c3bf5.mp3","phrases":[{"en":"how the world has changed","zh":"世界如何变化"},{"en":"a chicken sneezing in East Asia","zh":"东亚一只鸡打喷嚏"},{"en":"a global pandemic and millions of deaths","zh":"全球疫情和数百万人死亡"},{"en":"a bank in North America went bust","zh":"北美一家银行破产"},{"en":"bring the global economic system to its knees","zh":"让全球经济体系崩溃"},{"en":"transship our bodies, minds and ideas","zh":"转移身体、思想和想法"},{"en":"ever faster and ever cheaper","zh":"越来越快、越来越便宜"},{"en":"the Millennium Development Goals","zh":"千年发展目标"}],"logicPhrases":[{"en":"if → a chicken caught a cold and sneezed and died","zh":"如果一只鸡感冒了，打个喷嚏就死了"},{"en":"but → I don't think there was much possibility of us fearing","zh":"但我觉得我们不太可能会害怕"},{"en":"if → a bank in North America lent too much money","zh":"如果北美一家银行放贷过多"},{"en":"but → bring the global economic system","zh":"但我们没想到它会给全球经济体系带来……"},{"en":"but → it's also brought a lot of good stuff","zh":"但它也带来了很多好东西"},{"en":"if → really acts together and it really tries hard","zh":"如果它真的齐心协力，真的尽力而为"}]},{"id":3361,"name":"Government Blogging","ref":"The lecture discusses challenges of government blogging compared to regular blogs. Normally, blogs allow two-way interaction where readers comment or challenge the author. However, when government bodies like the White House blog, online comments often turn hostile or disrespectful, leading to chaos. To manage this, governments may need to moderate comments. But citizens might feel the government is controlling free speech. This creates a conflict: maintaining order or preserving open dialogue, which undermines the original purpose of blog interaction. 讲座讨论了政府博客与普通博客相比所面临的挑战。通常，博客允许双向互动，读者可以评论或挑战作者。然而，在政府机构，例如白宫博客下，网上评论往往变得充满敌意或不尊重，导致混乱。为了解决这个问题，政府可能需要缓和言论。但公民可能会觉得政府在控制言论自由。这就产生了一种冲突：维持秩序还是保留公开对话，而后者破坏了博客互动的初衷。","ana":"We normally see blogging as a two-way interaction, in which the blogger creates the content and the readers interact or challenge the author. 我们通常认为写博客是一种双向互动，博主创造内容，读者互动或挑战作者。 But the case will be much difficult when it comes to government, such as the White House. 但如果涉及到政府，比如白宫，情况就困难得多了。 Because people will become more coarse and rude online, especially in the comment area. 因为人们会在网上变得更加粗俗和粗鲁，尤其是在评论区。 Hence the governor blog may go wild and chaotic. So the government will have to administrate the comment. 因此，州长的博客可能会变得疯狂和混乱。因此，政府将不得不管理评论。 Once the government starts administrating the comment, citizens may find the government manipulating what should be said and what should be shown, which contradicts the original intention. 一旦政府开始管理评论，公民可能会发现政府在操纵应该说什么，应该展示什么，这与初衷相矛盾。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690252/a128c98b3b574fe7848b448f8395a8c5.mp3","phrases":[{"en":"blogging as a two-way interaction","zh":"博客是一种双向互动"},{"en":"blogger creates the content","zh":"博主创建内容"},{"en":"readers interact or challenge","zh":"读者互动或质疑"},{"en":"difficult when it comes to government","zh":"涉及政府时就变得困难"},{"en":"such as the White House","zh":"例如白宫"},{"en":"coarse and rude online","zh":"在网上粗鲁无礼"},{"en":"government administrate the comment","zh":"政府管理评论"},{"en":"contradicts the original intention","zh":"违背最初意图"}],"logicPhrases":[{"en":"but → be much difficult when it comes","zh":"但这种情况一旦出现，将会困难得多"},{"en":"when → comes to government such as the White House","zh":"当涉及白宫这样的政府时"},{"en":"because → will become more coarse and rude online","zh":"因为人们在网上会变得更粗俗无礼"},{"en":"especially → in the comment area Hence the governor blog may go","zh":"尤其在评论区，因此州长博客可能会关闭"},{"en":"so → to administrate the comment","zh":"所以政府将不得不管理评论"}]},{"id":1594,"name":"Health problem","ref":"There are two big problems in the world. These are that people don't get enough exercise and that they use too much electricity. There is a way to solve both these problems with a special kind of exercise bike which someone has invented. If you use the bike, you can get fit and you can also create electricity and use it in your home. 世界上有两大问题。这些是人们没有得到足够的锻炼，并且他们使用太多的电。有一种方法可以用某人发明的一种特殊的健身车来解决这两个问题。如果你使用自行车，你可以变得健康，也可以发电并在家里使用。","ana":"So now I want to look at two big problems in the world today and something that someone has invented to solve these problems. 所以现在我想看看当今世界的两大问题，以及有人发明的东西来解决这些问题。 The first problem is that people don't get enough exercise, which is obviously bad for people's health. 第一个问题是人们没有得到足够的锻炼，这显然对人们的健康有害。 The second is that people are using too much electricity. 第二个问题是人们使用了太多的电。 The process of making electricity causes pollution, which is also bad for our health as well as being bad for the environment. 发电的过程会造成污染，这不仅对我们的健康有害，也对环境有害。 So here we might have a solution, an exercise bike perhaps. 在这里我们可能有一个解决方案，也许是一辆健身车。 You were thinking, well, that solves problem number one, the exercise problem, but what about problem two? 你在想，这解决了问题一，运动问题，但问题二呢？ Well, this is where the idea for the invention comes from. 这就是发明的想法来源。 What if you could solve the pollution and health problems at the same time? 如果你能同时解决污染和健康问题会怎样？ So how about an exercise bike that can create electricity? 那么，有没有可以发电的健身自行车呢？ You can then use that electricity for power in your home. 然后，您可以将这些电力用于家庭动力。","audio":"https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658435/ebd57d6fd97e4b4e97e6963d4a51e936.mp3","phrases":[{"en":"two big problems in the world today","zh":"当今世界两大问题"},{"en":"people don't get enough exercise","zh":"人们缺乏足够锻炼"},{"en":"bad for people's health","zh":"对人们的健康有害"},{"en":"people are using too much electricity","zh":"人们使用过多电力"},{"en":"making electricity causes pollution","zh":"发电造成污染"},{"en":"bad for the environment","zh":"对环境有害"},{"en":"an exercise bike that can create electricity","zh":"能发电的健身自行车"},{"en":"use that electricity for power","zh":"把那种电用于供电"}],"logicPhrases":[{"en":"so → now I want to look at two big problems","zh":"那么现在，我想谈谈两个大问题。"},{"en":"so → a solution","zh":"那么这里我们也许有解决办法。"},{"en":"but → what about problem two Well","zh":"但第二个问题呢？嗯。"},{"en":"if → could solve the pollution and health problems at the","zh":"如果你能解决污染和健康问题，在……"},{"en":"so → how about an exercise bike that can create electricity","zh":"那么，能发电的健身自行车怎么样？"}]},{"id":1600,"name":"Higher education and further education","ref":"Students who wish to continue their education after finishing school have two main options, namely higher or further education. Higher education involves studying for an academic degree. Students develop various skills that can be applied to many different professional contexts, so degrees are valued by employers. However, they are time consuming and expensive. By contrast, further education train students for a specific vocation. Students get practical work experience and learn the skills they need for a specific job. Although they might not be able to transfer these skills into other professions later. 希望在完成学业后继续接受教育的学生有两种主要选择，即高等教育或继续教育。高等教育包括攻读学位。学生培养各种技能，可以应用于许多不同的职业环境，因此学位受到雇主的重视。然而，它们既耗时又昂贵。相比之下，继续教育可以基于特定的职业需求对学生进行培养。学生获得实际工作经验，学习特定工作所需的技能。虽然他们以后可能无法将这些技能转移到其他职业中。","ana":"Today, we're looking at the study options available to students after completing school, and the two main choices are higher education and further education. 今天，我们来探讨学生完成学业后可以选择的学习途径，主要分为高等教育和继续教育两大类。 Higher education basically means studying for a university degree. 高等教育通常指攻读大学学位。 This involves detailed study and is usually theoretical in nature. 这涉及到深入的学习，且多以理论为主。 That said, the skills students learn can be used in many different careers, so companies are eager to hire graduates. 尽管如此，学生学到的技能可以广泛应用于多种职业领域，因此企业热衷于招聘大学毕业生。 However, remember that degree courses are long and costly. 然而需要注意的是，学位课程耗时长且费用高。 Conversely, further education focuses more on practical skills rather than theoretical knowledge. 相比之下，继续教育更注重实践技能而非理论知识。 These courses prepare students for a specific job, such as training to be a chef and offer great practical work experience opportunities. 这类课程旨在为学生提供特定职业的培训，例如厨师培训，并且提供丰富的实践工作的机会。 However, as the skills learnt on further education courses tend to be more specialized, they can not be transferred to other types of career very easily. 然而，由于继续教育课程所教授的技能往往较为专业化，这些技能很难轻易转移到其他类型的职业中。 As you can see, it's important to compare the pros and cons of higher and further education carefully before making a decision. 由此可见，在做出选择之前，仔细权衡高等教育与继续教育的优缺点是非常重要的。","audio":"https://ti.koolearn.com/upload/ti/sardine/2657000-2658000/2657206/b7c9b04bddc64340bfe39090d33bcaf6.mp3","phrases":[{"en":"study options available","zh":"可用的学习选择"},{"en":"higher education and further education","zh":"高等教育与继续教育"},{"en":"studying for a university degree","zh":"攻读大学学位"},{"en":"usually theoretical in nature","zh":"通常是理论性的"},{"en":"degree courses are long and costly","zh":"学位课程漫长且昂贵"},{"en":"further education focuses more on practical skills","zh":"继续教育更注重实践技能"},{"en":"prepare students for a specific job","zh":"为学生从事特定工作做准备"},{"en":"compare the pros and cons","zh":"比较利弊"}],"logicPhrases":[{"en":"so → eager to hire graduates","zh":"因此公司急于招聘毕业生"},{"en":"however → remember that degree courses are long and costly","zh":"但请记住，学位课程既漫长又昂贵"},{"en":"however → as the skills learnt on further education courses tend","zh":"然而，由于继续教育课程中所学的技能往往……"}]},{"id":3352,"name":"Immigration control","ref":"The economists calculated that removing all immigration controls would double the size of the world economy or would lead to disproportionately big gains. A study found that a typical immigrant who arrives in US ends up with $20,000 a year. The countries they come from gain money as well. People send money back to their countries in formal and informal channels. The money is directly paid for food, clean water, and medicines. 经济学家计算出，取消所有移民控制将使全球经济规模翻倍，或者至少会带来不成比例的大幅增长。一项研究发现，典型的移民到达美国后每年收入为20,000美元。移民原籍的国家也会从中获益。移民通过正式和非正式渠道将钱汇回家乡。这些资金直接用于民生需求，如食品、净水和药品。","ana":"Now the economists calculated, it’s a back of the envelope calculation, that removing all immigration controls would double the size of the world economy, and even a small relaxation of immigration controls would lead to disproportionately big gains. 现在经济学家们计算出，虽然这只是一个粗略的估算，但如果取消所有移民控制，全球经济的规模将翻倍，即使是稍微放宽移民控制，也会带来不成比例的大幅增长。 Now for an ethical point of view, it’s hard to argue against a policy that will do so much to help people that are much poorer than ourselves. 从伦理角度来看，很难反对这样一项政策，因为它能帮助那些比我们贫穷得多的人。 The famous Rand Study reckons that a typical immigrant who arrives in the US ends up with $20,000 a year, that’s rough. 著名的兰德研究认为，一个典型的移民到达美国后，每年收入大约为2万美元，这是粗略的估算。 It’s not just the migrants themselves who gain, it’s the countries they come from. 获益的不仅仅是移民本身，还有他们来自的国家。 Already, the migrants working for poor countries working in rich countries send home around 200 billion dollars a year, through formal channels, and about twice as that through informal channels. 目前，来自贫穷国家的移民在富裕国家工作，通过正式渠道每年汇回大约2000亿美元，通过非正式渠道汇回的金额约为这个数额的两倍。 And that compares to the neat a hundred million dollars that Western governments give in aid. 这与西方政府提供的1亿美元援助相比，差距巨大。 These remittances are not wasted on weapons or siphoned off into Swiss bank accounts; they go straight into the pockets of local people. 这些汇款并没有浪费在武器上，也没有被转移到瑞士银行账户里；它们直接进入当地人民的口袋。 They pay for food, clean water, and medicines, they help kids in school, they help start up new businesses. 它们用于支付食品、清洁水和药品，帮助孩子上学，帮助创办新企业。","audio":"https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690241/963b665def424a9ba85eb60884d10666.mp3","phrases":[{"en":"removing all immigration controls","zh":"取消所有移民管制"},{"en":"double the size of the world economy","zh":"让世界经济规模翻倍"},{"en":"disproportionately big gains","zh":"不成比例的巨大收益"},{"en":"The famous Rand Study","zh":"著名的兰德研究"},{"en":"ends up with $20,000 a year","zh":"最终年收入两万美元"},{"en":"send home around 200 billion dollars","zh":"寄回约2000亿美元"},{"en":"These remittances are not wasted","zh":"这些汇款没有被浪费"},{"en":"pay for food, clean water, and medicines","zh":"用于食物、清洁水和药品"}],"logicPhrases":[{"en":"so → much to help people that are much poorer than ourselves","zh":"有太多可以帮助那些远比我们贫穷的人的事情"}]},{"id":1572,"name":"Innovation and invention","ref":"This lecture talks about the relationship between innovation and invention. Firstly, the speaker mentions that people think innovation equals invention but it’s not correct. Secondly, the speaker mentions that innovation generates value for the world and gives people satisfaction, but the invention is an idea that does not generate value. Thirdly, the speaker mentions that innovation equals invention times commercialization. In conclusion, innovation equals to commercializing a new idea to make value. 这一讲座讨论了创新与发明之间的关系。首先，讲者提到人们认为创新等同于发明，但这是不正确的。其次，讲者提到创新为世界创造了价值并带给人们满足感，而发明本身只是一个没有产生价值的想法。第三，讲者提到创新等于发明乘以商业化。总的来说，创新是发明与商业化的结合，从而创造价值。","ana":"He says innovation equals invention. 他说创新等于发明。 Let me just stop here. 让我在这里停一下。 Innovation equals invention often people mistake these two things for the same thing. 创新是否等于发明？许多人常常把这两者混淆为相同的东西。 Innovation equals invention, they are not. 创新并不等于发明。 Innovation is something that generates value for the world. 创新是能够为世界创造价值的东西。 It makes something faster, better, cheaper. 它让某些东西变得更快、更好、更便宜。 It gives someone some great satisfaction. 它给人带来极大的满足感。 An invention is an idea, a technology, a patent. 发明是一种想法、一项技术或一个专利。 In and of itself, it does not generate value. 单就其本身而言，发明并不会创造价值。 So these two are not
