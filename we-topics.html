<script>
var D=[{"id":"4344","name":"After-class activities","topic":"There are numerous after-class activities for students. Is it good or not?","stance":"整体有益","reasons":[{"en":"Taking part in after-class activities helps students develop social skills and teamwork, because they have to cooperate with classmates in clubs and sports teams.","zh":"参加课外活动能帮学生培养社交和团队能力，因为他们必须在社团和运动队里和同学合作。","expand":"举例：社团、运动队、志愿活动"},{"en":"These activities also give students a break from academic pressure, which keeps them mentally healthy and improves their concentration in class.","zh":"这些活动也让学生从学业压力中解脱出来，保持心理健康，也能提高课堂专注度。","expand":"对比：只学习 vs 有活动"},{"en":"Participating in diverse after-class activities allows students to explore personal interests and discover potential career paths, while developing practical skills like leadership, time management, and creativity that regular classes often neglect.","zh":"参加多样的课外活动让学生探索个人兴趣并发现潜在职业方向，同时培养领导力、时间管理和创造力等常规课堂常忽视的实用技能。","expand":"可举例：机器人社团、辩论队、志愿者项目如何帮助学生发现未来专业或职业方向，并锻炼课堂外的软技能。","angle":"个人发展/技能拓展"},{"en":"However, too many compulsory after-class activities can consume students' rest and study time, causing stress and fatigue; therefore, schools should offer optional programs rather than forcing everyone to join.","zh":"然而，过多强制性的课外活动会占用学生的休息和学习时间，造成压力和疲劳；因此学校应提供可选项目，而不是强迫所有人参加。","expand":"可对比：自愿选择的活动能放松和提升能力；强制且过量的活动会挤占作业、睡眠和家庭时间，所以关键在适度与选择。","angle":"潜在弊端/条件限制"}],"writing":"两个理由各配一个例子，用 First of all / Besides 连接，结尾重申课外活动的重要性。 这道利弊题建议立场为“整体有益”。写作时先明确表态：课外活动总体利大于弊；主体第一段用已有理由和新增个人发展理由展开好处；主体第二段承认过多或强制安排可能带来压力，但强调学校应提供选择并合理控制数量，因此不推翻整体有益立场。结尾重申：只要适度且自愿，课外活动对学生成长利大于弊。","questionType":"利弊题"},{"id":"1720","name":"Age restrictions","topic":"Age restrictions can be seen everywhere. It is believed that people should not do things until they reach the right age, such as marriage, and driving. Select one activity and state the minimum age that you think. Support with your own experiences.","stance":"支持合理年龄限制（以驾驶为例，18 岁）","reasons":[{"en":"I believe the minimum age for driving should be 18, because younger teenagers are not mature enough to judge risks and react quickly in dangerous situations.","zh":"我认为开车的最低年龄应该是 18 岁，因为更小的青少年不够成熟，无法判断风险或在危险中快速反应。","expand":"举例：交通事故率、反应能力"},{"en":"At 18, people are usually more responsible and can understand the legal consequences of dangerous driving.","zh":"18 岁时人们通常更有责任感，能理解危险驾驶的法律后果。","expand":"对比：未成年 vs 18 岁"},{"en":"From my own experience, waiting until 18 to start driving let me complete supervised practice and pass a formal test, so I felt far safer than friends who began driving younger without proper training.","zh":"从我自己的经历看，等到18岁才开始学车让我完成了监督练习并通过正式考试，因此我比那些更早无正规训练开车的朋友安全得多。","expand":"可具体写第一次学车、教练监督、路考通过，再对比朋友过早开车或违规上路的经历，突出培训与考试的作用。","angle":"个人经历/培训与考试"},{"en":"A minimum driving age of 18 also creates a clear, uniform legal standard, making it easier for schools, insurers, and police to provide training, assess risk, and enforce safe driving rules.","zh":"驾驶最低年龄为18岁也建立了清晰统一的法律标准，使学校、保险公司和警方更容易提供培训、评估风险并执行安全驾驶规则。","expand":"可展开统一标准如何方便驾校课程、保险定价和交警执法，并说明18岁与法定成年身份一致。","angle":"制度/法律与执行"}],"writing":"先选定一个活动（驾驶），明确给出年龄，再用两个理由支撑，最后用个人经历补充。 回答时先明确选择驾驶并给出最低年龄18岁，然后按‘成熟度→责任感→个人培训经历→制度统一’展开；个人经历可用第一次学车、路考或朋友违规驾驶的简短例子，确保紧扣最低年龄。","questionType":"选择活动并陈述最低年龄的观点题（选择驾驶，最低年龄18岁，支持合理年龄限制，并用个人经历支撑）"},{"id":"4342","name":"AI translation","topic":"Advanced technology such as artificial intelligence can translate a foreign language easily. Do you think learning a foreign language is still necessary? Support with your own experience.","stance":"仍然需要学外语","reasons":[{"en":"I still think learning a foreign language is necessary, because AI translation cannot capture tone, humour or cultural meaning in a real conversation.","zh":"我仍然认为学外语是必要的，因为 AI 翻译无法捕捉真实对话中的语气、幽默和文化含义。","expand":"举例：和外国人聊天、谈判"},{"en":"Speaking a language yourself opens up job opportunities and helps you build personal relationships that a translation app never can.","zh":"自己会说一门语言能带来工作机会，也能帮你建立翻译软件无法建立的个人关系。","expand":"个人经历：工作中用外语"},{"en":"Learning a foreign language also strengthens memory, attention and problem-solving skills, which AI tools cannot do for learners who simply accept instant translations without mental effort.","zh":"学习外语还能增强记忆力、注意力和解决问题的能力，而仅仅接受即时翻译的AI工具无法为不愿付出脑力努力的学习者提供这种训练。","expand":"可结合个人学习经历，比如背单词、语法练习如何提升长期记忆和逻辑思维，说明AI翻译只是工具，不能替代大脑训练。","angle":"认知发展/教育价值"},{"en":"Moreover, relying only on AI translation can be risky in emergencies, medical appointments or legal situations, so speaking the language yourself ensures accuracy, privacy and timely communication.","zh":"此外，只依赖AI翻译在紧急情况、医疗预约或法律场景中可能有风险，因此自己会说这门语言能确保准确性、隐私和及时沟通。","expand":"举例：旅行中生病、签合同、报警或与医生沟通时，AI可能出错、没网或泄露隐私，自己会外语更安全可靠。","angle":"实际风险/可靠性/隐私"}],"writing":"先亮立场（仍然必要），两个理由分别讲'翻译的局限'和'语言的价值'，结尾用个人经验收束。 开头先明确立场：Although AI translation is convenient, learning a foreign language is still necessary. 然后依次用已有理由（文化语气、工作关系）和新理由（认知发展、紧急/隐私场景）展开，最后用个人经历收尾，并确保全文直接回应“是否仍然需要学外语”。","questionType":"同意/不同意题（Opinion/Agree-Disagree）"},{"id":"3503","name":"Air travel","topic":"Some people think air travel has more negative impact than positive on modern life. What do you think?","stance":"利大于弊","reasons":[{"en":"I believe air travel brings more benefits, because it connects countries, boosts tourism and allows people to work and study abroad.","zh":"我认为航空旅行利大于弊，因为它连接国家、促进旅游业，让人们能出国工作学习。","expand":"举例：旅游、留学、国际贸易"},{"en":"Although it produces carbon emissions, airlines are now investing in cleaner fuels and more efficient planes, so the negative impact can be reduced.","zh":"虽然它产生碳排放，但航空公司正在投资更清洁的燃料和更高效的飞机，负面影响可以减轻。","expand":"让步 + 反驳"},{"en":"Furthermore, air travel also plays a vital role in emergency and humanitarian operations, as it delivers medical teams, organs, and relief supplies to disaster zones within hours, saving countless lives that slower transport could not.","zh":"此外，航空旅行在紧急救援和人道主义行动中也至关重要，因为它能在数小时内将医疗队、器官和救援物资送到灾区，拯救无数较慢交通无法挽救的生命。","expand":"可举例：地震救援、疫情期间医疗物资运输、跨国器官移植、战乱地区撤侨。","angle":"紧急救援/生命救援"},{"en":"In addition, air travel strengthens cultural exchange and family ties, because it enables people to visit relatives, attend international events, and experience different traditions, which broadens understanding and reduces prejudice in modern multicultural societies.","zh":"此外，航空旅行加强文化交流和家庭纽带，因为它让人们能够探亲、参加国际活动、体验不同传统，从而在现代多元文化社会中拓宽理解并减少偏见。","expand":"可举例：留学生回国探亲、移民家庭团聚、国际会议、体育赛事、艺术展览。","angle":"社会文化/家庭团聚"}],"writing":"用 Although 句先承认缺点，再反驳，最后表态——这种'让步+反驳'是 WE 高分结构。 这两条理由可作为已有理由的递进补充：先承认航空有碳排放问题但可改善，再说明航空不仅促进经济与教育，还能救命并维系文化与家庭联系，因此利大于弊。写作时可将紧急救援理由放在经济理由后，将文化交流理由放在让步反驳前或后，形成多角度支持。","questionType":"同意/不同意题（明确支持利大于弊）"},{"id":"1792","name":"Art galleries ","topic":"\"The experience of viewing art in galleries doesn't bear comparison with the experience of viewing an artwork in a digitalized form.\" How far do you agree with this statement? Support your point of view with reasons and/or examples from your own experience.","stance":"实体画廊更好","reasons":[{"en":"I agree that viewing art in a gallery is better, because you can see the real size, texture and brushwork of a painting, which a screen can never show.","zh":"我同意在画廊看艺术更好，因为你能看到画作的真实尺寸、质感和笔触，屏幕无法呈现。","expand":"具体描述：尺寸、质感、光线"},{"en":"Galleries also create a quiet, focused environment where visitors can slow down and think about the work, while digital viewing is often distracted and rushed.","zh":"画廊还营造安静专注的环境，让参观者慢下来思考作品，而数字化观看常常分心匆忙。","expand":"对比：专注 vs 分心"},{"en":"Another advantage of galleries is that curators place works in a thoughtful sequence and context, so viewers can understand an artist's development or a movement, whereas a digital image usually appears alone and stripped of this narrative.","zh":"画廊的另一个优势是，策展人会把作品放在经过思考的顺序和语境中，让观众理解艺术家的成长或某个艺术运动，而数字图像通常孤立出现，剥离了这种叙事。","expand":"可展开策展顺序、主题展厅、说明牌、灯光如何帮助理解作品；对比数字平台中作品常被算法推荐或碎片化浏览，缺少上下文。","angle":"策展语境/叙事"},{"en":"Furthermore, galleries turn art viewing into a shared social experience, where people can discuss interpretations face to face, while digital viewing is often solitary and mediated by screens, which weakens the communal exchange of ideas.","zh":"此外，画廊把观艺术变成一种共享的社交体验，人们可以面对面讨论对作品的理解，而数字观看常常是孤独的、由屏幕中介的，这削弱了思想的公共交流。","expand":"可举与朋友、导览员或其他观众现场讨论的例子；对比独自刷数字图片、缺少即时互动和社区感。","angle":"社交共享/公共体验"}],"writing":"先表态同意，两个理由分别讲'感官体验'和'专注环境'，最后让步一句（数字化也有便利）。 本题为同意/不同意题，建议立场为实体画廊更好。两条新理由分别从策展语境和社交共享切入，避免与已有真实质感、专注环境重复。主体段可用‘观点+对比数字形式+个人例子’结构，例子可选某次展览的策展顺序或与朋友讨论画作的经历。","questionType":"同意/不同意题（How far do you agree?）"},{"id":"3500","name":"Assessing own products","topic":"There are both advantages and disadvantages to company workers assessing their products and services. Discuss.","stance":"有利有弊，需配套机制","reasons":[{"en":"One advantage is that workers who assess their own products take more responsibility for quality, because they can spot problems early and fix them.","zh":"一个优势是员工评估自己的产品会对质量更负责，因为他们能及早发现问题并解决。","expand":"举例：生产线质检"},{"en":"However, the disadvantage is that employees may be too lenient with their own work, so mistakes can be missed without an independent check.","zh":"但缺点是员工可能对自己的工作太宽容，没有独立检查就可能漏掉错误。","expand":"举例：客户投诉、返工"},{"en":"Another benefit is that involving workers in self-assessment can boost their engagement and motivation, since being trusted to evaluate their own output makes them feel valued and encourages continuous improvement.","zh":"另一个优势是让员工参与自我评估能提升他们的参与度和积极性，因为被信任评估自己的产出会让他们感到被重视，并鼓励持续改进。","expand":"可举例：定期自评表、团队复盘会；机制上可把自评与培训、改进目标结合，避免流于形式。","angle":"员工参与/激励"},{"en":"A further drawback is that self-assessment can be time-consuming and may require training, diverting workers from core duties and creating an administrative burden for the company.","zh":"另一个缺点是自我评估可能耗时且需要培训，使员工偏离核心职责，并给公司带来行政负担。","expand":"可举例：一线员工花大量时间填表；机制上可简化评估表、抽样检查或把自评纳入常规复盘。","angle":"成本/时间/培训负担"}],"writing":"Discuss 题两面都要写，正文两段分别讲优缺点，结尾给平衡观点：可以自查，但要配合独立审核。 本题为双边讨论题，立场应明确为“有利有弊，需配套机制”。主体段可先写优点（已有：早发现问题、负责；新增：提升参与度），再写缺点（已有：自我宽容、漏错；新增：耗时且需培训），最后提出平衡措施，如独立抽查、简化流程、自评与绩效脱钩或结合培训。","questionType":"双边讨论题（advantages and disadvantages）"},{"id":"4359","name":"Bid to host sports events","topic":"What do you think of bidding to host sports events? Is it a blessing or a curse? Give your opinions.","stance":"双刃剑，但利大于弊","reasons":[{"en":"Hosting sports events can boost the local economy and improve a city's international image, because it attracts tourists and investment.","zh":"举办体育赛事能提振当地经济、提升城市国际形象，因为它吸引游客和投资。","expand":"举例：奥运会、世界杯"},{"en":"However, hosting can also be a curse, because building stadiums and infrastructure may cost far more than the event earns.","zh":"但举办也可能是诅咒，因为建场馆和基础设施的花费可能远超赛事收入。","expand":"对比：收入 vs 成本"},{"en":"Hosting major sports events can inspire local residents, especially young people, to take up sports and volunteer, creating lasting social benefits that often outweigh the short-term financial costs.","zh":"举办大型体育赛事能激励当地居民，尤其是年轻人参与运动和志愿服务，创造持久社会效益，往往超过短期财政成本。","expand":"可展开社区凝聚力、志愿者文化、青少年体育参与率和全民健康意识，说明这些软性收益能延续到赛后。","angle":"社会效益/长期遗产"},{"en":"The curse can also appear long after the event, when expensive stadiums become white elephants and public funds are diverted from hospitals, schools, and housing.","zh":"诅咒也可能在赛事结束很久后显现：昂贵场馆沦为白象，公共资金从医院、学校和住房中被抽走。","expand":"可展开赛后场馆闲置、维护费高昂、机会成本巨大，以及民生预算被挤压带来的公众不满。","angle":"机会成本/公共财政/赛后遗产"}],"writing":"题目问 blessing or curse，正文一段写 blessing、一段写 curse，结尾给出自己的判断。 这道题应按双边讨论处理：先承认举办赛事可能带来经济、形象和社会收益，也承认成本、债务和赛后闲置等风险；然后明确立场：总体是双刃剑，但利大于弊。写作时可把已有理由和新理由连用：先写经济与形象收益，再写成本风险，接着补社会长期效益，最后补公共资金机会成本，结尾重申只要做好预算透明和赛后场馆利用规划，长期收益通常超过代价。","questionType":"利弊/双边讨论题（blessing or curse）"},{"id":"3506","name":"Celebrities' privacy","topic":"Should celebrities give up the right to privacy?","stance":"不应完全放弃，但要有限度","reasons":[{"en":"I do not think celebrities should give up all privacy, because they are still ordinary people who deserve a private life with their families.","zh":"我认为名人不应放弃所有隐私，因为他们仍是普通人，应该享有与家人在一起的私人生活。","expand":"举例：狗仔跟拍、家人受影响"},{"en":"However, when their behaviour affects public interest, some information should be reported, so the line depends on the situation.","zh":"但当他们的行为涉及公共利益时，一些信息应该被报道，所以界线取决于具体情况。","expand":"让步 + 界定标准"},{"en":"Celebrities do not lose their legal right to privacy simply because they are famous, so the law should protect them from intrusive acts such as hidden cameras and unauthorized medical or financial disclosures.","zh":"名人不会仅因出名就失去法律隐私权，因此法律应保护他们免受隐藏摄像头、未经授权的医疗或财务披露等侵扰。","expand":"可展开法律底线：名气不等于放弃基本权利；举例住宅偷拍、医疗记录泄露、财务信息被曝光，说明这些与公共利益无关时应受保护。","angle":"法律权利/基本人权"},{"en":"The media should focus on celebrities’ professional work and accountable conduct rather than satisfying idle curiosity, because unlimited gossip can harm mental health and discourage talented people from entering public life.","zh":"媒体应关注名人的专业工作和应问责行为，而非满足无聊的好奇心，因为无限制的八卦会损害心理健康，并让有才华的人不愿进入公众生活。","expand":"可展开媒体责任：报道应服务于知情与监督，而非猎奇；举例网络暴力、焦虑抑郁、艺人退圈，说明过度窥探有社会成本。","angle":"媒体伦理/社会影响"}],"writing":"不要一边倒。先说不应全放弃（理由：也是普通人），再给限定（涉及公共利益例外），结尾重申原则。 这两条理由接在已有理由之后使用：先承认名人仍享有法律隐私权，再指出媒体应克制猎奇并关注真正有价值的公共监督，最后重申立场——不应完全放弃隐私，但涉及公共利益时应有合理限度。","questionType":"同意/不同意题（立场：不应完全放弃，但要有限度）"},{"id":"1730","name":"Cheaper public transportation","topic":"What are the advantages and problems of cheaper public transportation? Give your opinion from your own experience.","stance":"利大于弊，但要配套措施","reasons":[{"en":"Cheaper public transport benefits ordinary people, because it reduces commuting costs and encourages more people to leave their cars at home.","zh":"更便宜的公共交通对普通人有好处，因为它降低通勤成本，鼓励更多人不开车。","expand":"举例：月票降价、上班族受益"},{"en":"However, lower fares can lead to overcrowding and put pressure on government budgets, so the service may become less reliable.","zh":"但票价降低会导致拥挤，也给政府预算带来压力，服务可能变得不那么可靠。","expand":"对比：收入减少 vs 需求增加"},{"en":"From my own experience, cheaper fares make public transport a more realistic option for low-income students and part-time workers, giving them wider access to education and job opportunities across the city.","zh":"依我自己的经验，更低票价让公共交通成为低收入学生和兼职工作者更现实的选择，让他们更容易在全城获得教育和就业机会。","expand":"可结合个人或朋友因票价降低而愿意跨区上学、实习或兼职的例子，说明交通成本如何影响机会公平。","angle":"社会公平与机会可及性（利）"},{"en":"In my city, cheap tickets without extra funding often mean older buses and fewer late-night services, so passengers may face longer waits and feel less safe when travelling after work.","zh":"在我所在的城市，低价票若没有额外资金支持，往往意味着老旧公交车和更少的深夜班次，因此乘客可能等更久，下班后出行也感到更不安全。","expand":"举例：夜间下班等车时间长、车辆老旧、照明或安保不足，说明低价若缺乏配套会损害服务质量与安全感。","angle":"服务质量与安全/财政可持续性（弊）"}],"writing":"题目要 advantages + problems。正文一段写好处（省钱、环保），一段写问题（拥挤、财政），结尾给出自己的判断。 建议段落结构：先明确立场“利大于弊，但需配套措施”。主体段1用已有理由和新利说明降低通勤成本、促进机会公平；主体段2用已有弊和新弊说明拥挤、预算压力、夜间服务与安全风险；结论重申政府应提供定向补贴、增加班次、改善调度与安保，才能让低价交通真正惠民。","questionType":"利弊题（advantages and problems + opinion）"},{"id":"4346","name":"Children education","topic":"Parents play an important role in educating children as much as teachers. Do you agree or disagree?","stance":"同意，两者同等重要","reasons":[{"en":"I agree that parents are as important as teachers, because children learn values, habits and attitudes at home before they even start school.","zh":"我同意父母和老师同样重要，因为孩子在上学前就在家里学到价值观、习惯和态度。","expand":"举例：礼貌、阅读习惯"},{"en":"Teachers provide knowledge and structure, while parents give emotional support, and the two together produce better results.","zh":"老师提供知识和结构，父母提供情感支持，两者结合效果更好。","expand":"对比：知识 vs 情感"},{"en":"Parents also reinforce what teachers teach by supervising homework, checking progress, and encouraging regular study at home, which helps children remember lessons and stay motivated over time.","zh":"父母还通过监督作业、检查进度和鼓励在家规律学习来强化老师所教的内容，这帮助孩子记住课程并长期保持动力。","expand":"举例：每天检查作业、设定固定学习时间、周末复习本周内容，说明父母把课堂知识延伸到家庭。","angle":"学习巩固/家校配合"},{"en":"Because parents know their child's personality and needs, they can give individual attention that teachers with large classes often cannot provide, making education more effective.","zh":"因为父母了解孩子的性格和需求，他们能给予大班老师常常无法提供的个别关注，使教育更有效。","expand":"举例：对害羞的孩子多鼓励表达，对注意力弱的孩子安排短时学习任务，体现因材施教。","angle":"个性化支持/因材施教"}],"writing":"agree/disagree 题先明确立场。两个理由分别从'家庭打底'和'家校互补'展开，结尾总结两者缺一不可。 本题是同意/不同意题，立场必须明确选同意：父母与老师同等重要。已有理由可作第一个主体段，新理由可分别作第二、三主体段；每段用主题句+解释+具体例子，并用In addition/Moreover等衔接。坚持双边作用，不要只写父母或只写老师，PTE写作控制在200-300词。","questionType":"Agree/Disagree（同意/不同意）"},{"id":"4361","name":"Choose university","topic":"Some students choose a university near where they live and continue to stay at home with families, while other students choose a university away from family, what are the advantages and disadvantages for both sides?","stance":"各有利弊","reasons":[{"en":"Studying near home is cheaper and safer, because students can save on rent and meals and still receive family support.","zh":"在离家近的地方上学更便宜也更安全，因为学生可以省下房租和餐费，还能得到家人支持。","expand":"举例：房租、饮食开销"},{"en":"However, studying away from home develops independence and social skills, since students must manage their time, money and daily life on their own.","zh":"但离家上学能培养独立性和社交能力，因为学生必须自己管理时间、金钱和日常生活。","expand":"举例：自己做饭、打理生活"},{"en":"Staying near home can limit personal growth, because students may rely on their parents for meals, laundry and decisions, so they have fewer chances to solve problems independently.","zh":"在离家近的地方上学可能限制个人成长，因为学生可能依赖父母做饭、洗衣和做决定，因此独立解决问题的机会更少。","expand":"可举例说明家务依赖、日常决策依赖，以及毕业后适应独立生活较慢。","angle":"离家近的缺点：依赖性强、独立性不足"},{"en":"Studying away from family can be expensive and lonely, since students must pay for accommodation, food and travel while coping with homesickness and unfamiliar surroundings without immediate family support.","zh":"离家上学可能既昂贵又孤独，因为学生要支付住宿、饮食和交通费用，同时还要在陌生环境中应对思乡情绪，无法及时得到家人支持。","expand":"可展开住宿交通开销、思乡情绪、陌生环境适应困难等具体问题。","angle":"离家远的缺点：经济压力大、情感孤独"}],"writing":"题目问 both sides 的优缺点，正文分成两段，一段写近、一段写远，结尾可以说'取决于学生性格'。 这篇文章应按双边利弊结构展开：先写离家近的优点与缺点，再写离家远的优点与缺点，最后结论说明两种选择各有利弊，取决于学生的经济条件、性格和家庭支持。已有两句分别覆盖离家近的优点和离家远的优点，新增两句正好补齐两边的缺点，形成完整对称论证。","questionType":"双边利弊题（advantages and disadvantages for both sides）"},{"id":"3514","name":"City","topic":"Over half of the population lives in cities. Is it a positive or negative development?","stance":"以积极为主，但需规划","reasons":[{"en":"I think urbanisation is largely positive, because cities offer more job opportunities, better education and easier access to healthcare.","zh":"我认为城市化整体是积极的，因为城市提供更多工作机会、更好的教育和更便利的医疗。","expand":"举例：就业、学校、医院"},{"en":"However, rapid urban growth also brings overcrowding, pollution and high housing prices, so governments need careful planning.","zh":"但城市快速扩张也带来拥挤、污染和高房价，所以政府需要仔细规划。","expand":"让步 + 提条件"},{"en":"Another positive aspect is that concentrating people in cities can make public services more efficient, since transport, hospitals and schools can serve larger populations at a lower cost per person.","zh":"另一个积极方面是，将人口集中在城市可让公共服务更高效，因为交通、医院和学校能以更低的人均成本服务更多人口。","expand":"可展开公共交通、医疗和教育的规模效应，说明政府预算和资源利用效率更高。","angle":"积极-公共服务效率/规模经济"},{"en":"Nevertheless, this trend can drain rural areas of young workers and leave farms and small towns struggling, so balanced regional investment is needed alongside urban expansion.","zh":"然而，这一趋势可能抽走乡村的年轻劳动力，使农场和小城镇陷入困境，因此城市扩张的同时需要均衡的区域投资。","expand":"可举例乡村老龄化、农业劳动力短缺、小城镇衰退，并提出区域投资、远程工作和农业补贴等方案。","angle":"消极+方案-乡村流失/区域平衡"}],"writing":"positive/negative 题要选边。先写积极面（机会多），再承认问题（拥挤、房价），结尾给出'需要规划'的条件。 写作时先明确总体立场：城市化总体积极，但必须规划。主体段1可接在已有积极理由后，用“公共服务效率”继续支持城市集中人口的好处；主体段2先承接已有“拥挤、污染、高房价”的让步，再补“乡村流失与区域失衡”，最后提出区域投资、住房交通规划等条件。结论重申：积极为主，但政策规划决定其可持续性。","questionType":"利弊题（positive or negative development），需明确总体立场并覆盖积极与消极"},{"id":"4340","name":"Compulsory learning","topic":"Some people think learning a foreign language at school should be compulsory. Do you agree with it? Use your experience or examples to support your viewpoint.","stance":"同意必修，但要灵活","reasons":[{"en":"I agree that learning a foreign language should be compulsory, because it gives every student a basic skill for future study and work.","zh":"我同意外语应该是必修，因为它给每个学生未来学习和工作的基本技能。","expand":"举例：英语在工作中的用处"},{"en":"However, schools should not force every student to reach the same level, because students have different interests and abilities.","zh":"但学校不应该要求每个学生达到同样水平，因为学生的兴趣和能力不同。","expand":"让步 + 建议"},{"en":"Compulsory foreign language education can reduce social inequality, because it ensures that students from poorer families also get the chance to learn languages that wealthy families often pay for privately.","zh":"外语必修可以减少社会不平等，因为它确保贫困家庭的学生也有机会学习富裕家庭常私下付费学习的语言。","expand":"可举贫困学生通过学校免费外语课获得与私教学生竞争的机会，说明必修能促进教育公平。","angle":"社会公平/教育公平"},{"en":"Making language learning compulsory at school also builds cross-cultural awareness, helping students respect different ways of life and communicate more confidently in an increasingly globalised society.","zh":"学校把语言学习设为必修也能培养跨文化意识，帮助学生尊重不同生活方式，并在日益全球化的社会中更自信地交流。","expand":"可举国际交流、留学或网络合作，说明外语必修培养尊重差异与全球沟通能力。","angle":"跨文化理解/全球化"}],"writing":"先同意（基础技能人人需要），再补充条件（不强求统一水平），这样立场就不是一边倒。 本题是同意/不同意题，建议立场为同意必修但灵活实施。可把新理由接在第一条支持理由后，形成基本技能、教育公平、跨文化理解的支持段；再用已有让步理由说明不必要求同一水平，建议提供不同语种或难度选择，结尾重申 compulsory but flexible。","questionType":"Agree/Disagree（同意/不同意题）"},{"id":"4363","name":"Creativity","topic":"Creativity is something that a person is born with, other people think that creativity can be taught or developed. To what aspect do you agree or disagree?","stance":"可以培养，天赋也有影响","reasons":[{"en":"I believe creativity can be developed, because training, practice and a supportive environment help people generate new ideas.","zh":"我认为创造力可以培养，因为训练、练习和支持性环境能帮人产生新想法。","expand":"举例：艺术课、头脑风暴"},{"en":"However, natural talent also plays a role, since some people are born with stronger imagination or curiosity.","zh":"但天赋也有作用，因为有些人天生想象力或好奇心更强。","expand":"让步"},{"en":"Moreover, schools and workplaces can teach practical creative strategies, such as brainstorming, mind mapping and questioning assumptions, which enable even less naturally imaginative individuals to produce original solutions.","zh":"此外，学校和工作场所可以教授实用的创造策略，如头脑风暴、思维导图和质疑假设，这使天生想象力较弱的人也能提出原创方案。","expand":"可举课堂创意训练或公司创新工作坊为例，说明具体方法能弥补天赋差距。","angle":"教育方法/可训练策略"},{"en":"In addition, creativity often depends on accumulated knowledge and diverse experiences, so reading widely, travelling and collaborating with different people can gradually strengthen a person's ability to connect ideas.","zh":"此外，创造力往往依赖积累的知识和多样经历，因此广泛阅读、旅行以及与不同的人合作，能逐渐增强一个人连接想法的能力。","expand":"可展开为知识储备和跨领域经验为灵感提供素材，说明创造力像肌肉一样可被后天锻炼。","angle":"知识积累/多元经验"}],"writing":"这是'天生 vs 培养'的对立题，两方面都要写，结尾可以偏向'可培养'，因为这样更符合教育意义。 这道题问“在多大程度上同意”，建议采用部分同意立场：主体段先承认天赋提供起点，但重点论证创造力可通过教育方法、知识积累和多元经验持续开发。写作时可用 Moreover 和 In addition 连接新理由，再用 However 让步天赋影响，结尾重申“可培养为主、天赋为辅”。","questionType":"同意/不同意（部分同意：创造力主要可培养，天赋也有影响）"},{"id":"2555","name":"Dangerous activities","topic":"Nowadays, more and more people engage in dangerous activities, such as skydiving and motorcycling. Are you in favor of them? Why? Use examples to support your opinion.","stance":"支持，但强调安全","reasons":[{"en":"I am in favour of dangerous activities to some extent, because they give people excitement, confidence and a sense of achievement.","zh":"我在一定程度上支持危险活动，因为它们给人刺激、自信和成就感。","expand":"举例：跳伞、登山"},{"en":"However, participants must follow strict safety rules and receive proper training, otherwise the risks outweigh the benefits.","zh":"但参与者必须遵守严格的安全规则并接受适当训练，否则风险大于收益。","expand":"让步 + 条件"},{"en":"Another reason I support these activities is that they can teach participants to manage fear and make quick decisions under pressure; for example, skydivers learn to stay calm during emergencies.","zh":"我支持这些活动的另一个原因是，它们能教会参与者管理恐惧，并在压力下快速决策；例如，跳伞者学会在紧急情况下保持冷静。","expand":"可举跳伞者处理开伞异常、摩托车手应对复杂路况，说明抗压与决策能力可迁移到工作和生活。","angle":"心理韧性 / 决策能力"},{"en":"I also favour these activities because, when managed responsibly, adventure sports can bring economic benefits to local communities through tourism, equipment sales and event organisation, creating jobs and income.","zh":"我也支持这些活动，因为如果管理得当，冒险运动可以通过旅游、装备销售和赛事组织为当地社区带来经济利益，创造就业和收入。","expand":"可举跳伞基地、摩托车赛事带动住宿、餐饮、装备租赁和就业，说明其社会经济价值。","angle":"社会经济 / 旅游就业"}],"writing":"用 to some extent 表示有条件的支持，先写价值（成长、成就感），再写条件（安全、训练）。 两条理由可接在已有第二条之后：第一条深化支持，强调心理与决策收益；第二条补充社会经济效益，避免与已有刺激感和安全规则重复。结尾可重申支持危险活动，但必须依赖专业监管与个人责任。","questionType":"同意/不同意题（立场：支持，但强调安全）"},{"id":"3511","name":"Differential education","topic":"Discuss the advantages and disadvantages of differential education, i. e. splitting students into different classes according to their academic performance.","stance":"有利有弊","reasons":[{"en":"One advantage of splitting students by ability is that teachers can match the pace and materials to each group, so both strong and weak students improve faster.","zh":"按能力分班的一个好处是老师能根据每组调整进度和材料，让强和弱的学生都进步更快。","expand":"举例：快班拓展、慢班补基础"},{"en":"However, it can also label students and lower the confidence of those in lower groups, which may widen the gap instead of closing it.","zh":"但它也可能给学生贴标签，降低低分组学生的自信，可能拉大而不是缩小差距。","expand":"举例：心理影响"},{"en":"Differential education can allow motivated students to compete with similar peers, creating a more challenging classroom atmosphere that pushes high achievers to work harder and achieve better academic results.","zh":"差异化教育能让有动力的学生与水平相近的同伴竞争，营造更具挑战性的课堂氛围，促使高成就学生更努力并取得更好成绩。","expand":"可展开同伴竞争和榜样作用：快班中水平接近，学生更容易被激发，课堂节奏更紧凑，学习目标更明确。","angle":"advantage: peer competition and challenge"},{"en":"Another drawback is that differential education may reduce social mixing among students from different backgrounds, limiting their opportunities to learn from diverse perspectives and weakening school unity and mutual support.","zh":"另一个缺点是，差异化教育可能减少不同背景学生之间的社会融合，限制他们学习多元观点的机会，并削弱学校团结和相互支持。","expand":"可举例说明分层后学生只与同层同学相处，缺少跨能力合作，导致社交隔离、校园凝聚力下降，甚至加剧阶层差异。","angle":"disadvantage: social segregation and weakened unity"}],"writing":"Discuss 题写两面。优点从'因材施教'讲，缺点从'贴标签'讲，结尾给平衡结论。 本题为利弊题，建议立场写“有利有弊”。开头表明分班既能提升教学针对性，也可能带来标签化和社交隔离；主体一段写利，可连用已有教师匹配进度和新理由同伴竞争；一段写弊，可连用已有自信受损和新理由社交融合减少。结尾可提出灵活分层、定期调整、心理支持等条件性建议，体现平衡结论。","questionType":"Discuss advantages and disadvantages（利弊题）"},{"id":"1763","name":"Extreme sports","topic":"In your opinion, what are the advantages and disadvantages of extreme or adventure sports?","stance":"有利有弊，需做好防护","reasons":[{"en":"Extreme sports give participants a strong sense of achievement and help them overcome fear, which builds confidence that carries over into daily life.","zh":"极限运动给参与者强烈的成就感，帮他们克服恐惧，这种自信会延续到日常生活中。","expand":"举例：跳伞、攀岩后的变化"},{"en":"However, the risk of serious injury is high, and medical costs and long recovery periods can affect a person's work and family life.","zh":"但严重受伤的风险很高，医疗费用和漫长的恢复期会影响工作和家庭生活。","expand":"举例：受伤案例、医疗费用"},{"en":"In addition, extreme sports can foster social bonds and teamwork, as participants often join communities, share training tips, and celebrate achievements together, which expands their support network and reduces isolation.","zh":"此外，极限运动能促进社交联系和团队合作，因为参与者常常加入社群、分享训练技巧并共同庆祝成就，这能扩大他们的支持网络并减少孤独感。","expand":"可举例：登山队、跑酷社群、潜水俱乐部；强调团队协作、归属感和心理支持。","angle":"优势：社交与心理支持"},{"en":"In addition, they can be expensive and time-consuming, since specialized equipment, travel to remote locations, and frequent training require substantial money and commitment, potentially straining budgets and schedules.","zh":"此外，它们也可能昂贵且耗时，因为专业装备、前往偏远地点和频繁训练需要大量金钱和投入，可能给预算和时间安排带来压力。","expand":"可举例：滑雪装备、潜水课程、跳伞旅行费用；说明对普通家庭和经济压力的影响。","angle":"劣势：经济与时间成本"}],"writing":"题目只要 advantages and disadvantages，正文两段分别展开，结尾加一句建议（做好防护和专业训练）。 本题问 advantages and disadvantages，必须利弊两边都覆盖。建议立场为“有利有弊，需做好防护”。正文可先承认极限运动带来成就感、自信、社交支持和团队归属，再指出受伤风险、医疗恢复成本以及装备旅行训练的经济时间压力。结尾强调通过专业培训、防护装备和严格监管，可以降低风险并保留其积极价值。","questionType":"利弊题（advantages and disadvantages）"},{"id":"4339","name":"Financial learning","topic":"As dealing with money is such an important skill, all children should be taught financial management at school. Do you agree with it or not?","stance":"同意","reasons":[{"en":"I agree that financial management should be taught at school, because young people need to budget, save and avoid debt when they start working.","zh":"我同意学校应该教理财，因为年轻人开始工作时需要做预算、存钱和避免负债。","expand":"举例：助学贷款、信用卡"},{"en":"Learning about money early also prevents serious mistakes later, since habits formed in childhood are hard to change.","zh":"早点学理财也能避免以后的严重错误，因为童年形成的习惯很难改变。","expand":"对比：有/无理财教育"},{"en":"Furthermore, teaching financial management in school ensures that all children, including those whose parents lack money knowledge, receive equal preparation for adult life rather than leaving this vital skill to family background.","zh":"此外，学校教授理财能确保所有孩子，包括父母缺乏理财知识的孩子，都能为成年生活获得平等准备，而不是把这项关键技能交给家庭背景决定。","expand":"可举低收入家庭、移民家庭或父母忙于生计无暇教理财的例子，说明学校统一课程能缩小机会差距。","angle":"公平性/普及性"},{"en":"In addition, schools can teach financial management through practical activities such as budgeting projects and savings simulations, making maths lessons more relevant and helping students apply knowledge immediately.","zh":"此外，学校可以通过预算项目、储蓄模拟等实践活动教授理财，让数学课更贴近现实，并帮助学生立即运用知识。","expand":"可写班级银行、模拟购物、记账比赛或复利计算，说明实践教学能提升参与度和长期记忆。","angle":"教学方法/实用技能"}],"writing":"agree 题先表态，两个理由从'实用技能'和'习惯养成'展开，结尾建议纳入学校课程。 本文应明确同意：先承认理财是重要生活技能，再用两条新理由补充“公平性”和“教学方法”层面。每段采用主题句—解释—例子—回扣题目结构，结尾重申所有孩子都应在校接受理财教育。","questionType":"同意/不同意（Agree/Disagree）"},{"id":"4360","name":"Good handwriting","topic":"Nowadays, people are more likely to type words. Do you think good handwriting is still important? Give your opinions.","stance":"仍重要，但形式在变化","reasons":[{"en":"I still think handwriting is important, because writing by hand helps people remember information and organise their thoughts more effectively.","zh":"我仍然认为手写重要，因为手写能帮人更好地记忆信息和组织思路。","expand":"举例：记笔记、考试"},{"en":"However, typing is now more practical for work and study, so handwriting is becoming a personal skill rather than a daily necessity.","zh":"但现在打字在工作和学习中更实用，手写正在变成个人技能而不是日常必需。","expand":"让步 + 界定"},{"en":"Even in a typing-heavy era, good handwriting remains crucial in early education because forming letters by hand strengthens children's reading and spelling skills, and this foundation cannot be fully replaced by keyboard practice.","zh":"即使在打字为主的时代，好手写仍在早期教育中至关重要，因为用手写字母能加强儿童的阅读和拼写能力，而这一基础无法被键盘练习完全取代。","expand":"可举小学识字、拼写测试，说明手写与读写能力关联，强调基础教育中的不可替代性。","angle":"教育/认知发展"},{"en":"Moreover, neat handwriting still carries social meaning, as a clear handwritten note, signature or exam script can show care, respect and personal identity, especially in situations where typed text feels impersonal or is not allowed.","zh":"此外，工整的手写仍具有社会意义，因为清晰的便条、签名或考试答卷能体现用心、尊重和个人身份，尤其在打字文本显得冷漠或不被允许的场合。","expand":"可举签名、感谢卡、手写考试、法律文件，说明打字不能完全替代，强调正式和情感场景。","angle":"社会/情感/正式场合"}],"writing":"不要简单说重要或不重要。表态'仍重要'，再承认打字的实用性，这样显得有层次。 先保留已有两条形成让步结构；第一条新理由放在支持手写重要段落，作为教育层面的补充；第二条新理由放在让步后或结论前，说明特定场景仍离不开好手写，最终落回仍重要但形式在变化。两条英文理由均符合25-45词，可直接嵌入正文。","questionType":"Opinion / agree-disagree: whether good handwriting is still important"},{"id":"4343","name":"Government fund","topic":"Should governments allocate funds to which areas of concern? Climate change? Education? Public health? Explain your idea with examples.","stance":"优先教育和公共健康","reasons":[{"en":"I think education deserves the largest share of government funding, because it improves people's skills and benefits the economy in the long term.","zh":"我认为教育应该获得最多的政府资金，因为它提升人们的技能，长期看有利于经济。","expand":"举例：学校建设、奖学金"},{"en":"Public health is equally important, since a healthy population reduces the burden on hospitals and helps the country develop.","zh":"公共健康同样重要，因为健康的人口能减轻医院负担，帮助国家发展。","expand":"举例：医保、疫苗"},{"en":"In addition, funding education, especially in low-income communities, can reduce social inequality and crime, because equal access to schools gives disadvantaged children a realistic path to better jobs and stable lives.","zh":"此外，资助教育，尤其是低收入社区的教育，可以减少社会不平等和犯罪，因为平等的入学机会为弱势儿童提供通往更好工作和稳定生活的现实路径。","expand":"举例：农村学校建设、助学金、职业培训；对比只投入气候项目对弱势群体的即时帮助有限。","angle":"社会公平/社会稳定"},{"en":"Moreover, investing in public health strengthens long-term productivity, since preventive care, vaccination, and clean water keep workers healthy and reduce the costly spread of infectious diseases.","zh":"此外，投资公共健康能增强长期生产力，因为预防保健、疫苗接种和清洁饮水让劳动者保持健康，并减少传染病高昂的传播代价。","expand":"举例：全国疫苗计划、基层诊所、清洁饮水项目；说明健康劳动力比事后治疗更能推动经济。","angle":"预防医疗/经济生产力"}],"writing":"题目问 which areas，选 1-2 个领域讲清楚，每个理由配一个例子，不要泛泛而谈。 本题是资金分配优先题：开头明确政府应优先教育和公共健康，虽然气候变化也重要；主体段分别用已有理由和新理由支撑，每段给出具体例子；结尾重申优先顺序并说明理由。","questionType":"资金分配优先题（选择/论述类）"},{"id":"1719","name":"Home to workplace","topic":"Do you think it has a positive or negative impact on you if you buy a home close to the workplace?","stance":"整体积极","reasons":[{"en":"I think it has a positive impact, because living close to work saves commuting time and reduces daily stress.","zh":"我认为这是积极的影响，因为住得近能省下通勤时间，减少日常压力。","expand":"举例：早上多睡、准时到岗"},{"en":"However, it may also blur the line between work and personal life, since people can easily go back to the office after hours.","zh":"但也可能模糊工作与生活的界限，因为人们下班后很容易回办公室。","expand":"让步"},{"en":"Buying a home near my workplace also lowers transport costs and makes my monthly budget more predictable, so I can save or invest more for long-term financial security.","zh":"买在工作地点附近的房子还能降低交通成本，让每月预算更可预测，因此我能存下或投资更多钱，获得长期财务保障。","expand":"举例：少开车或坐车后，油费、停车费和公交月票下降；把省下的钱用于储蓄、进修或家庭应急。","angle":"经济成本/财务稳定"},{"en":"A shorter commute also lets me walk or cycle to work, which improves my physical health and gives me more daily energy for both job tasks and family time.","zh":"更短的通勤也让我可以步行或骑车上班，这能改善身体健康，并让我每天有更多精力处理工作与家庭事务。","expand":"举例：不用挤地铁，顺路买菜或接孩子；运动量增加，晚上不那么累，工作效率更高。","angle":"健康/精力/生活质量"}],"writing":"positive/negative 题选边（积极），再用 however 承认一个潜在问题，结尾重申整体是好的。 本题问 positive or negative impact，写作时开头必须直接回答：整体来看是积极影响。主体段可先写已有积极理由（省时减压），再接新理由（降低交通成本、步行骑行改善健康），然后用已有让步（工作生活界限模糊）体现平衡，但立刻说明可通过设定下班仪式、不在家处理工作来缓解，最后重申整体积极。","questionType":"正负影响题（positive or negative impact）"},{"id":"4354","name":"Human activities","topic":"Lots of scientists agree that human activities increase global temperatures. Do you agree? Please give solutions for global warming.","stance":"同意，并给解决方案","reasons":[{"en":"I agree that human activities are the main cause, because burning fossil fuels and cutting down forests release huge amounts of carbon dioxide.","zh":"我同意人类活动是主因，因为燃烧化石燃料和砍伐森林释放大量二氧化碳。","expand":"举例：工厂、汽车、森林砍伐"},{"en":"To solve this, governments should invest in renewable energy and encourage people to use public transport and recycle.","zh":"为了解决这个问题，政府应该投资可再生能源，鼓励人们使用公共交通和回收。","expand":"举例：太阳能、电动车"},{"en":"I also agree because modern agriculture and livestock farming produce large amounts of methane and nitrous oxide, which trap far more heat than carbon dioxide and clearly show human influence on the climate.","zh":"我也同意，因为现代畜牧业和农业会排放大量甲烷和一氧化二氮，它们锁住热量的能力远高于二氧化碳，清楚表明人类活动对气候的影响。","expand":"可举例：牛等反刍动物排放甲烷，化肥使用释放一氧化二氮；可提减少肉类消费和改善农耕方式。","angle":"补充同意立场：农业与畜牧业排放"},{"en":"Another solution is for governments to impose carbon taxes or cap-and-trade systems, so companies are financially pushed to cut emissions and invest in cleaner technologies.","zh":"另一个解决方案是政府征收碳税或实行碳排放交易体系，从而在经济上推动企业减排并投资更清洁的技术。","expand":"可解释碳税提高化石燃料成本，碳交易限制排放总量，收入可用于补贴绿色创新。","angle":"解决方案：经济手段与碳定价"}],"writing":"这题有两个任务（agree + solutions），正文一段表同意、一段给方案，两边都要写足。 本题是两部分问题：先明确同意人类活动导致全球变暖，再给出解决方案。这两条可接在已有理由后：第一条继续加强“同意”立场，从农业和畜牧业排放切入；第二条继续补充“解决方案”，从碳税或碳交易切入。PTE WE 中可按“立场—原因—方案—总结”展开，注意每段用主题句、解释和例子。","questionType":"同意并给解决方案（两部分问题）"},{"id":"4348","name":"Immigration","topic":"Many people choose to emigrate to other countries. What are the advantages and disadvantages of living in a foreign country? Discuss with your own experience.","stance":"有利有弊","reasons":[{"en":"Living in a foreign country gives people new opportunities, because they can study at better universities, find higher-paying jobs and experience a different culture.","zh":"在国外生活给人新机会，因为他们能上更好的大学、找到更高薪的工作、体验不同的文化。","expand":"举例：留学、海外工作"},{"en":"However, immigrants often face language barriers and homesickness, and adjusting to a new culture can be stressful.","zh":"但移民常面临语言障碍和思乡，适应新文化也可能很有压力。","expand":"举例：语言、孤独感"},{"en":"Living abroad can strengthen personal independence and global awareness, as people must solve daily problems alone and interact with diverse communities, which builds confidence and cross-cultural communication skills.","zh":"在国外生活能增强个人独立性和全球意识，因为人们必须独自解决日常问题并与多元社区互动，这会建立自信和跨文化沟通能力。","expand":"举例：独自租房、办银行卡或签证、与不同文化背景的人合作，说明这些经历如何提升适应力。","angle":"利：个人成长/全球视野"},{"en":"Another drawback is that skilled immigrants may suffer career setbacks, since foreign qualifications are sometimes unrecognised and local employers often prefer native-born candidates with local experience.","zh":"另一个缺点是，技术移民可能遭遇职业挫折，因为国外学历有时不被认可，当地雇主也常偏好有本地经验的本土候选人。","expand":"举例：医生、律师、教师等资质认证难，求职要求本地经验，导致降级就业或转行。","angle":"弊：职业发展/资质认证"}],"writing":"题目要求 advantages and disadvantages，正文各一段，结尾可以用个人经历或见闻补充。 本题是利弊题，必须两边都写。建议把新增利接在已有第一条优势后，用 In addition 或 Another benefit is that 连接；把新增弊接在已有第二条劣势后，用 Another drawback is that 连接。结论保持平衡：移民既带来成长与机会，也带来适应与职业风险，取决于个人情况和东道国政策。个人经历可用一句具体例子支撑，不要写成故事。","questionType":"利弊题（advantages and disadvantages）"},{"id":"1797","name":"International languages","topic":"Of the estimated 7,000 languages spoken in the world today, nearly half are in danger of disappearing, in some cases because they are being replaced by international languages. In your view, does this matter?","stance":"很重要","reasons":[{"en":"I believe this matters, because every language carries unique knowledge, stories and ways of understanding the world.","zh":"我认为这很重要，因为每种语言都承载着独特的知识、故事和理解世界的方式。","expand":"举例：土著语言、传统知识"},{"en":"Losing a language also means losing part of human cultural diversity, which cannot be recovered once it disappears.","zh":"一种语言消失也意味着人类文化多样性的一部分消失，一旦失去就无法挽回。","expand":"对比：消失前 vs 消失后"},{"en":"Furthermore, losing a language can weaken a community's identity and intergenerational connection, because younger speakers may no longer fully access elders' memories, values and social norms.","zh":"此外，失去一种语言会削弱社区的身份认同和代际联系，因为年轻使用者可能无法再充分接触长辈的记忆、价值观和社会规范。","expand":"可举土著社区或移民家庭为例，说明祖辈故事、习俗、称呼和价值观若无法传给下一代，社区认同会逐渐松散。","angle":"社会/身份认同/代际传承"},{"en":"In addition, when international languages replace smaller ones, speakers of endangered languages may face pressure to abandon their heritage, entrenching inequality and weakening confidence in local cultures.","zh":"此外，当国际语言取代较小语言时，濒危语言使用者可能面临放弃自身传承的压力，从而加剧不平等并削弱对本地文化的信心。","expand":"可讨论教育、就业和媒体如何奖励国际语言，使母语使用者处于劣势，进而强化语言等级与社会不公平。","angle":"社会公平/权力关系/语言政策"}],"writing":"先明确表态（matters），两个理由从'知识载体'和'文化多样性'展开，结尾建议保护小语种。 开头必须明确表态：Yes, it does matter. 主体段可将已有理由与新理由结合：先谈独特知识与文化多样性，再谈身份代际断裂及语言压力造成的不平等。结尾重申保护濒危语言不仅是保存词汇，也是维护社区权利与文化生态。","questionType":"观点题（是否重要/同意不同意）"},{"id":"4353","name":"Job satisfaction","topic":"Is it realistic for everyone to expect job satisfaction? Please use examples or your personal experience to support your idea.","stance":"不现实，但可以改善","reasons":[{"en":"I do not think it is realistic for everyone, because many people simply cannot find work that matches both their interests and their financial needs.","zh":"我认为对每个人来说都不太现实，因为很多人根本找不到既符合兴趣又满足经济需求的工作。","expand":"举例：毕业生、转行的人"},{"en":"Still, people can improve their satisfaction by developing skills, changing their attitude, or finding meaning in the work they do.","zh":"不过，人们可以通过提升技能、改变心态或从工作中找到意义来提升满意度。","expand":"举例：培训、业余项目"},{"en":"Because job satisfaction depends heavily on factors outside an individual's control, such as managers, pay, working hours and economic cycles, it cannot be guaranteed for every worker.","zh":"因为工作满意度在很大程度上取决于个人无法控制的因素，比如管理者、薪酬、工作时间和经济周期，所以它无法对每个劳动者都得到保证。","expand":"可举例：行业衰退裁员、糟糕上司、低薪岗位；说明不是个人努力不足。","angle":"外部结构性因素"},{"en":"Even so, governments and employers can make satisfaction more attainable by improving wages, working conditions and training opportunities, which helps more people, though not all.","zh":"即便如此，政府和雇主可以通过提高工资、改善工作条件和提供培训机会，让满意度更容易实现，这能帮助更多人，尽管不是所有人。","expand":"可举例：最低工资、职场反霸凌、带薪培训；强调制度改善有限但有效。","angle":"政策与雇主责任"}],"writing":"先给否定判断（不现实），再用 Still 转折给出积极出路，这样立场不消极。 PTE WE 中，开头直接回应：It is not realistic for everyone, but it can be improved. 主体段一用外部因素说明为何不能保证；主体段二用制度与雇主改善说明仍可提升。结尾重申立场，避免绝对化，使用 while/although/even so 衔接。例子要具体简短。","questionType":"同意/不同意题（立场题）"},{"id":"3513","name":"Life choices","topic":"Some people argue that young people should concentrate on studying or work, and some people think it is better to put energy into activities designed to broaden their experience, such as international travel and volunteering. Support with examples or cases.","stance":"两者需要平衡","reasons":[{"en":"Focusing on study or work builds professional skills and financial stability, which young people need before they can explore the world.","zh":"专注学习或工作能建立专业技能和经济基础，这是年轻人探索世界之前需要的。","expand":"举例：考证、职业起步"},{"en":"However, travel and volunteering broaden people's horizons and develop soft skills, so they should not be ignored.","zh":"但旅行和志愿活动能拓宽视野、培养软技能，所以不应该被忽视。","expand":"举例：海外志愿、实习"},{"en":"Balancing study or work with experiential activities helps young people apply classroom knowledge to real situations, making them more employable because employers value practical skills, adaptability, and evidence of initiative.","zh":"平衡学习或工作与体验型活动，能帮助年轻人把课堂知识应用到真实情境中，使他们更具就业竞争力，因为雇主重视实践技能、适应能力和主动性。","expand":"举例：学生利用假期参加国际志愿者项目，把语言、沟通和解决问题能力写进简历，从而在毕业后更快找到工作。","angle":"就业竞争力/知行合一"},{"en":"Focusing too much on either path can be harmful: exclusive study or work may cause burnout and narrow perspectives, while endless travel or volunteering may delay financial independence and career progress.","zh":"过度偏向任何一方都可能有害：只学习或工作可能导致倦怠和视野狭窄，而无休止的旅行或志愿服务可能推迟经济独立和职业发展。","expand":"举例：毕业后连续多年工作却从不休假，或长期间隔年却没有规划，都说明应分阶段平衡，而不是走向极端。","angle":"风险平衡/长期可持续"}],"writing":"这题是两个观点的对比，正文各写一段，结尾给平衡建议：先打好基础，再适度拓展。 本题是双边讨论题，必须覆盖“专注学习或工作”和“投入旅行、志愿服务等拓展经历”两边，并用例子支撑。建议立场为两者需要平衡：先承认学习或工作能带来专业技能和经济基础，再说明旅行和志愿能拓宽视野、培养软技能；新增理由可强调平衡能提升就业竞争力，以及过度偏向任一方会带来倦怠、视野狭窄或职业延迟。结论应重申按阶段和条件分配精力，而非二选一。","questionType":"双边讨论题"},{"id":"4358","name":"Life experience or education","topic":"Some people argue that experience is the best teacher. Life experiences can teach more effectively than books or formal school education. How far do you agree with this idea? Support your opinion with reasons or your personal experience.","stance":"部分同意，两者结合最好","reasons":[{"en":"I partly agree that experience is a good teacher, because real-life challenges teach practical skills and judgment that books cannot provide.","zh":"我部分同意经验是好老师，因为现实中的挑战能教出书本无法提供的实用技能和判断力。","expand":"举例：工作中学会沟通"},{"en":"However, formal education gives people systematic knowledge and theory, which helps them understand why things work, not just how.","zh":"但正规教育给人系统的知识和理论，帮人们理解事情背后的原因，而不只是怎么操作。","expand":"对比：理论 vs 实践"},{"en":"Experience also builds resilience and emotional intelligence, since people learn from mistakes, feedback and unpredictable situations in ways that textbooks rarely simulate, strengthening their ability to cope with real-world pressure.","zh":"经验还能培养韧性和情商，因为人们从错误、反馈和不可预测的情境中学习，而这是教科书很少能模拟的，从而增强他们应对现实压力的能力。","expand":"可举实习、兼职或团队项目中的失败与反馈，说明软技能如何提升。","angle":"经验价值/软技能"},{"en":"In addition, experience alone can be narrow or biased because it is limited to personal circumstances, so formal education is needed to provide broader perspectives and transferable understanding.","zh":"此外，单靠经验可能狭隘或偏颇，因为它受个人环境限制，所以需要正规教育来提供更广阔的视角和可迁移的理解。","expand":"可举只靠个人行业经验会忽略跨领域理论，正规课程提供知识框架。","angle":"经验局限/两者结合"}],"writing":"How far 题要用部分同意（partly agree），两边都要写，结论是理论和经验互补。 建议结构：开头明确“部分同意，经验与正规教育互补”；主体1用已有第一条加新理由1说明经验价值；主体2用已有第二条加新理由2指出经验局限与正规教育必要性；结论重申两者结合。每段采用主题句+解释+例子，总字数200-300，避免绝对化表达。","questionType":"Opinion (How far do you agree?)"},{"id":"4356","name":"Looking for a job","topic":"When you look for work, some people think salary is more important while others think the working conditions are more important. Which one is more important when you are looking for a job?","stance":"工作条件更重要，但薪水也重要","reasons":[{"en":"Salary matters, because a higher income provides financial security and allows people to support their families and plan for the future.","zh":"薪水重要，因为高收入能带来经济保障，让人们养家并为未来做规划。","expand":"举例：房贷、家庭开销"},{"en":"However, working conditions matter more in the long run, since a supportive environment and reasonable hours affect daily happiness and health.","zh":"但长期来看工作条件更重要，因为支持性的环境和合理的工时影响每天的幸福和健康。","expand":"对比：高薪高压 vs 平衡"},{"en":"Good working conditions often include flexibility, paid leave, and remote options, which save time and money and therefore add real value that a higher salary may not provide.","zh":"良好的工作条件通常包括灵活性、带薪休假和远程选择，这些节省时间和金钱，因此增加高薪可能无法提供的实际价值。","expand":"可举例：远程办公节省通勤费和午餐费，带薪休假提升生活质量；对比高薪但无灵活性的工作，说明实际价值。","angle":"非货币福利/实际价值"},{"en":"Working conditions also shape career growth, because clear promotion paths and skills training can raise a worker's long-term income more effectively than a slightly higher starting salary.","zh":"工作条件也塑造职业成长，因为清晰的晋升路径和技能培训能比略高的起薪更有效地提高员工的长期收入。","expand":"可举例：有培训和晋升通道的公司，几年后薪资涨幅更大；起薪高但无成长会限制未来跳槽和加薪。","angle":"职业发展/长期收入潜力"}],"writing":"Which one 题要求表态。可以先写薪水的合理性，再说明工作条件更持久，最后给出自己的选择。 本题为二选一，但建议采取让步立场：薪水重要，但工作条件更重要。开头明确立场；主体先用已有理由承认薪水，再用两条新理由从非货币福利和职业成长说明工作条件更关键；结尾总结工作条件带来长期幸福和收入潜力。注意每段主题句+解释+例子。","questionType":"二选一（Which is more important，选择类，需明确立场，可让步）"},{"id":"3502","name":"Maximum wage","topic":"Should there be a maximum wage for high pay people? Is it good or bad?","stance":"弊大于利，建议用累进税代替","reasons":[{"en":"I do not think a maximum wage is a good idea, because it may discourage talented people from working hard or taking risky jobs.","zh":"我认为最高工资不是好主意，因为它可能打击优秀人才努力工作或承担高风险工作的积极性。","expand":"举例：医生、创业者"},{"en":"However, extremely high pay gaps can cause social unfairness, so progressive tax is a better solution than a fixed cap.","zh":"但极高的收入差距会造成社会不公，所以累进税比固定上限更合适。","expand":"对比：最高工资 vs 累进税"},{"en":"A strict maximum wage could also encourage highly skilled professionals and innovative companies to relocate to countries without such a cap, weakening the domestic economy and reducing the tax base.","zh":"严格的最高工资还可能促使高技能专业人才和创新企业迁往没有此类上限的国家，从而削弱本国经济并缩小税基。","expand":"可举例金融、科技高管迁往新加坡或迪拜，说明人才与资本外流会减少投资、就业和税收。","angle":"国际竞争/人才资本外流"},{"en":"A fixed maximum wage may simply push employers to use bonuses, shares or luxury benefits to reward executives, making the rule easy to avoid and harder to enforce than a transparent tax system.","zh":"固定的最高工资可能只会促使雇主用奖金、股票或奢侈福利来奖励高管，使这一规定容易被规避，且比透明的税收制度更难执行。","expand":"可举例基本工资设上限但期权、津贴不受限；对比累进税按总收入征收更透明。","angle":"政策漏洞/执行可行性"}],"writing":"先反对（会打击积极性），再承认问题（差距过大），最后提出替代方案（税收调节）。 写作时先明确不赞成最高工资，再承认收入差距问题，最后提出累进税作为替代；确保同时回答 should 和 good/bad，避免只写一边。","questionType":"利弊题（Should there be...? Is it good or bad?）：需明确立场并覆盖利弊；本题立场为最高工资弊大于利，建议用累进税替代。"},{"id":"1718","name":"Media violence","topic":"Many people say there is much violence promoted in mass media. What is your opinion?","stance":"需要重视，但不该全面禁止","reasons":[{"en":"I think media violence should be taken seriously, because repeated exposure may make young people less sensitive to real violence.","zh":"我认为媒体暴力应该被认真对待，因为反复接触可能让年轻人对真实的暴力变得不敏感。","expand":"举例：游戏、影视作品"},{"en":"However, banning it completely is not practical, so age ratings and parental guidance are better solutions.","zh":"但完全禁止不现实，所以分级制度和家长指导是更好的办法。","expand":"建议：分级、家长陪同"},{"en":"Moreover, violence in media can sometimes reflect real social conflicts or serve artistic and journalistic purposes, so a total ban would unnecessarily restrict freedom of expression and public access to important stories.","zh":"此外，媒体中的暴力有时能反映真实的社会冲突，或服务于艺术和新闻目的，因此全面禁止会不必要地限制表达自由和公众获取重要故事的渠道。","expand":"可举战地新闻、现实主义电影或历史剧，说明“一刀切”会损害公众知情权和创作空间。","angle":"表达自由/媒体社会功能"},{"en":"A more effective response is to promote media literacy education, helping viewers, especially teenagers, analyze violent content critically and question the messages behind it instead of simply censoring it.","zh":"更有效的应对方式是推动媒体素养教育，帮助观众，尤其是青少年，批判性地分析暴力内容并质疑其背后的信息，而不是简单地审查它。","expand":"可写学校开设媒体素养课程、家长与孩子讨论屏幕内容，培养辨别能力和理性判断。","angle":"教育/长期解决方案"}],"writing":"先承认问题（可能有负面影响），再说完全禁止不现实，最后给出可行方案。 本题为观点题，立场应明确：媒体暴力值得重视，但不应全面禁止。写作时可用让步—反驳—替代方案结构：先承认对青少年的潜在危害，再指出全面禁止不现实且损害表达自由，最后提出分级、家长指导、媒体素养教育等综合措施。新理由可接在现有理由后：先连 Moreover 补充反对全面禁止的理由，再用 A more effective response 引出教育方案。","questionType":"同意/不同意（观点题）"},{"id":"4349","name":"National \nhappiness \nindex","topic":"More people consider the national happiness index as a better measurement of a country's success than the country's economic growth. What do you think about the idea? What can be used to measure national happiness?","stance":"应该作为补充指标","reasons":[{"en":"I think the happiness index is valuable, because economic growth does not always mean people live better lives.","zh":"我认为幸福指数有价值，因为经济增长并不总意味着人们生活得更好。","expand":"举例：高 GDP 但压力大的国家"},{"en":"However, economic growth still matters, since without it governments cannot fund healthcare, education or housing.","zh":"但经济增长仍然重要，因为没它政府无法支撑医疗、教育或住房。","expand":"举例：公共服务的资金来源"},{"en":"A national happiness index should therefore act as a complementary measure, because it captures social trust, health and environmental quality that GDP often overlooks when judging national progress.","zh":"因此，国家幸福指数应作为补充指标，因为它能反映GDP在衡量国家进步时常常忽视的社会信任、健康和环境质量。","expand":"展开：说明幸福指数不能替代GDP，而是补充GDP；举例社会信任、预期寿命、空气质量、工作生活平衡等GDP不直接显示的内容。","angle":"补充指标/立场细化"},{"en":"To measure national happiness, governments can combine subjective life-satisfaction surveys with objective indicators such as healthy life expectancy, social support and freedom to make life choices.","zh":"为了衡量国家幸福，政府可以把主观生活满意度调查与客观指标结合起来，例如健康预期寿命、社会支持和自由选择生活的程度。","expand":"展开：主观调查可参考Gallup世界民意调查中的生活满意度，客观指标可包括WHO健康预期寿命、社会支持网络、个人自由度等。","angle":"测量方法/主客观结合"}],"writing":"这题有两问（怎么看 + 怎么衡量）。正文一段评观点，一段给衡量指标（健康、教育、环境、人际关系）。 本题为两部分问题：先回应幸福指数是否比经济增长更好，再回答如何测量国家幸福。建议立场为幸福指数应作为补充指标而非替代GDP。主体段一可用已有两条理由加新增理由一，说明幸福指数补充GDP但GDP仍不可缺；主体段二用新增理由二给出具体测量方式；结论重申二者结合最合理。","questionType":"两部分问题（观点+测量方法）"},{"id":"4355","name":"Nature and Nurture","topic":"Scientists have been debating the impact of nature and nurture on people's personalities and behavior. Which one do you think has a greater influence on people's personalities and behavior?","stance":"后天影响更大","reasons":[{"en":"I believe nurture has a greater influence, because family, education and culture shape how people think and behave.","zh":"我认为后天影响更大，因为家庭、教育和文化塑造了人的思维和行为。","expand":"举例：不同环境长大的双胞胎"},{"en":"However, nature also plays a role, since genes affect personality, talent and even health.","zh":"但先天也有作用，因为基因影响性格、天赋甚至健康。","expand":"让步"},{"en":"Social environment and life experiences can gradually change behavior over time, so nurture often has a stronger and more lasting effect than fixed genetic tendencies.","zh":"社会环境和人生经历会随着时间逐渐改变行为，因此后天往往比固定的基因倾向产生更强烈、更持久的影响。","expand":"可举例说明移民适应新文化、工作环境改变沟通方式，或长期教育改变价值观，突出环境影响的持续性和可塑性。","angle":"动态经验/终身塑造"},{"en":"Because humans learn most social skills and values through daily interaction, nurture ultimately governs how innate potential is expressed in everyday personality and personal conduct.","zh":"由于人通过日常互动学习大部分社交技能和价值观，后天最终决定先天潜能如何在日常性格和个人行为中表现出来。","expand":"可举同卵双胞胎被不同家庭收养后性格差异，或儿童在不同文化中学会不同礼貌和情绪表达，说明基因潜能需靠环境表达。","angle":"社会化/潜能表达"}],"writing":"Which one 题要选边（后天更大），但必须承认先天的作用，否则显得片面。 写作时开头明确立场：后天影响更大；主体先写家庭、教育、文化，再补终身经验和社会化两条支持，随后用让步段承认基因作用，但重申环境与经历更能解释性格和行为差异。","questionType":"单边立场题（选择后天影响更大，兼顾让步）"},{"id":"1796","name":"Online teaching","topic":"All teaching should be done online and not in traditional classroom environments. How far do you agree with this statement? Support your point of view with reasons and/or examples from your own experience.","stance":"部分同意，不能完全取代","reasons":[{"en":"I partly agree, because online teaching is flexible and gives students access to courses and teachers they could not reach otherwise.","zh":"我部分同意，因为线上教学灵活，让学生能接触到原本无法获得的课程和老师。","expand":"举例：偏远地区、录播课"},{"en":"However, it cannot fully replace traditional classrooms, because face-to-face discussion and immediate feedback are difficult to achieve online.","zh":"但它无法完全取代传统课堂，因为面对面的讨论和即时反馈在线上很难实现。","expand":"对比：课堂互动 vs 屏幕"},{"en":"Another limitation is that online teaching is less effective for practical subjects, since students cannot use specialised equipment or receive hands-on guidance in laboratories, workshops, or sports fields.","zh":"另一个局限是线上教学对实践类科目效果较差，因为学生无法在实验室、车间或运动场使用专业设备或获得动手指导。","expand":"举例：医学、化学实验、体育、艺术等需要现场操作和设备。","angle":"学科适用性/实践技能"},{"en":"In addition, traditional classrooms foster social skills and emotional support, as students learn to cooperate, resolve conflicts, and build confidence through daily face-to-face interaction with peers and teachers.","zh":"此外，传统课堂培养社交技能和情感支持，因为学生通过每天与同学和老师面对面互动学会合作、解决冲突并建立自信。","expand":"举例：小组项目、课堂辩论、课外活动。","angle":"社会化/情感发展"}],"writing":"How far 题用部分同意（partly agree），两边都写，结论是线上线下结合。 这道题问How far do you agree，必须表明同意程度。建议立场为部分同意：先承认线上教学灵活、可及性强，再用新增理由说明实践课程受限、社交情感支持不足，因此不能完全取代传统课堂。结论建议采用混合教学，使论证连贯。","questionType":"同意程度题（How far do you agree?）"},{"id":"3504","name":"Over-competitive","topic":"What are the advantages and disadvantages of being over-competitive to individuals and society?","stance":"有利有弊","reasons":[{"en":"One advantage is that competition pushes people to work harder and improve their skills, which raises overall performance.","zh":"一个优势是竞争推动人们更努力、提升技能，从而提高整体表现。","expand":"举例：职场、升学"},{"en":"However, being over-competitive can cause stress, damage relationships and lead to unethical behaviour.","zh":"但过度竞争会造成压力、损害人际关系，还可能导致不道德行为。","expand":"举例：作弊、人际关系紧张"},{"en":"At the societal level, an over-competitive environment can accelerate innovation and economic efficiency, because firms and individuals strive to outperform rivals, though this benefit depends on rules that prevent harm.","zh":"在社会层面，过度竞争的环境可以加速创新和经济效率，因为企业和个人都努力超越对手，不过这种好处取决于是否有规则防止伤害。","expand":"可展开企业研发投入、国家竞争力、技术进步和效率提升；同时强调需要监管防止恶性竞争。","angle":"社会/经济优势"},{"en":"For society, excessive competitiveness can widen inequality and weaken cooperation, as winners accumulate resources while losers are left behind, which reduces trust and social cohesion.","zh":"对社会而言，过度竞争可能加剧不平等并削弱合作，因为赢家积累资源而输家被甩在后面，这会降低信任和社会凝聚力。","expand":"可举例财富差距、教育资源不均、社区关系冷漠；说明社会整体可能因零和思维而付出代价。","angle":"社会/公平/合作劣势"}],"writing":"题目问 advantages and disadvantages，正文各一段，结尾给平衡建议（适度竞争，重在自我提升）。 本题为利弊题，需平衡讨论。已有理由覆盖个人层面的利与弊；新增理由从社会/经济层面补充利与弊。写作时可先承认过度竞争带来创新与效率，再指出其加剧不平等和削弱合作，最后给出有条件或平衡立场。","questionType":"利弊题"},{"id":"4352","name":"Overcrowding","topic":"As the urban population grows, city roads are busy and public areas such as parking are packed. People feel that city space is overcrowding. What solutions can you think of for this problem?","stance":"给出两个解决方案","reasons":[{"en":"The most effective solution is to improve public transport, because when more people take the subway and buses, the number of private cars drops.","zh":"最有效的办法是改善公共交通，因为当更多人坐地铁和公交，私家车数量会减少。","expand":"举例：地铁扩建、票价优惠"},{"en":"Governments should also develop satellite towns, so that people can live and work outside the city centre.","zh":"政府还应该发展卫星城，让人们能在市中心以外生活和工作。","expand":"举例：新区、通勤铁路"},{"en":"In addition, city authorities should charge drivers to enter central areas during peak hours, because this discourages unnecessary car use and frees up crowded roads and parking spaces.","zh":"此外，城市管理部门应在高峰时段对进入市中心的司机收费，因为这会抑制不必要的汽车使用，并释放拥挤的道路和停车空间。","expand":"举例：伦敦、新加坡的拥堵费或低排放区；说明收费如何减少车流并增加公共空间。","angle":"交通需求管理/经济杠杆"},{"en":"Moreover, urban planners should design mixed-use communities where homes, offices and shops are within walking distance, so residents rely less on cars for daily trips.","zh":"此外，城市规划者应设计混合用途社区，让住宅、办公室和商店在步行距离内，这样居民日常出行更少依赖汽车。","expand":"举例：15分钟城市、社区商业与办公；说明减少通勤和停车需求。","angle":"土地利用规划/减少出行需求"}],"writing":"题目只要 solutions，正文直接给两个方案，每个配一句解释和一个例子，不需要表态。 本题是问题解决题，立场为提出解决方案。四条理由可形成递进方案：改善公共交通、发展卫星城、拥堵收费限行、混合用途社区规划。每条理由都直接提出措施并解释其缓解道路拥堵和停车拥挤的结果，避免只描述问题。","questionType":"问题解决题（Problem-solution）"},{"id":"1741","name":"Paying teachers for student achievements","topic":"There is a current trend of paying teachers for student achievements. Some people agree that it is an incentive for teachers to link student achievements to teacher salaries, while others disagree. What is your opinion?","stance":"部分同意，需多指标评价","reasons":[{"en":"I partly agree, because linking pay to results can motivate teachers to focus more on student progress.","zh":"我部分同意，因为把薪水与结果挂钩能激励老师更关注学生的进步。","expand":"举例：进步奖励"},{"en":"However, it may also encourage teachers to focus only on test scores and ignore creativity or students with difficulties.","zh":"但也可能让老师只盯着考试分数，忽略创造力和有困难的学生。","expand":"对比：分数 vs 全面发展"},{"en":"In addition, I believe any performance-pay system should use multiple measures, such as classroom observations and student progress, rather than relying only on test scores.","zh":"此外，我认为任何绩效工资制度都应采用多种指标，如课堂观察和学生进步，而非只依赖考试分数。","expand":"提出解决方案：用多指标评价替代单一分数，举例课堂观察、学生进步、同行评价，说明这样更全面公平。","angle":"解决方案/条件限定"},{"en":"Moreover, rewarding teachers solely for student results is often unfair because factors like family background and school resources strongly affect achievement beyond a teacher's control.","zh":"此外，仅因学生成绩奖励教师往往并不公平，因为家庭背景和学校资源等因素会强烈影响成绩，超出教师的控制范围。","expand":"展开公平性：学生成绩受家庭、资源、基础等影响，教师无法完全控制，所以单看成绩可能误判教师努力。","angle":"公平性/反对理由"}],"writing":"先给部分同意，再指出风险，最后建议用多指标（进步、参与、创造力）来评价，而不是只看分数。 开头明确部分同意：绩效工资可激励教师关注学生进步，但必须配合多指标评价。主体第一段用已有理由支持激励作用；第二段用已有理由和新理由二说明单一成绩挂钩会导致应试、忽视全面发展且不公平；第三段用新理由一提出课堂观察、学生进步、同行评价等多指标方案。结论重申有条件支持，强调设计合理的绩效工资才有效。","questionType":"同意/不同意（部分同意，需多指标评价）"},{"id":"4357","name":"Public \ntransportation \nsystem","topic":"What are the strengths and weaknesses of the public transportation system in your country?","stance":"有优势也有不足","reasons":[{"en":"The main strength is that it is affordable and environmentally friendly, since one full bus can replace dozens of private cars.","zh":"主要优势是便宜且环保，因为一辆满载的公交车能替代几十辆私家车。","expand":"举例：票价、碳排放"},{"en":"The weakness is that in peak hours buses and trains are crowded and often delayed.","zh":"缺点是高峰时段公交和地铁拥挤，还经常晚点。","expand":"举例：早高峰、晚点"},{"en":"Another strength is that the network usually covers most urban districts and key destinations, allowing residents without cars to reach work, schools, and hospitals conveniently.","zh":"另一个优势是公交网络通常覆盖大多数城区和主要目的地，使没有汽车的居民也能方便地到达工作地点、学校和医院。","expand":"可举学生、老人、无车通勤者为例，说明线路覆盖主要生活场景，降低出行门槛。","angle":"优势—城市覆盖范围/可达性"},{"en":"A further weakness is that services in rural and remote areas are often limited, so residents there must rely on private cars or endure long waiting times to travel.","zh":"另一个不足是农村和偏远地区的公共交通服务往往有限，因此当地居民不得不依赖私家车或忍受漫长等待才能出行。","expand":"可举例乡村班次少、周末停运、老人就医难，说明区域发展不均衡。","angle":"不足—乡村与偏远地区覆盖不足/区域公平"}],"writing":"strengths and weaknesses 题各写一段，结尾给一句改进建议（增加班次、改善准点率）。 本题必须同时讨论 strengths 和 weaknesses。建议主体段先写优势，再接“Another strength is that...”补充城市覆盖广；然后写不足，用“A further weakness is that...”补充乡村服务有限。结尾要明确“总体而言，公共交通既有优点也有不足”，避免只写一边。","questionType":"优缺点题（strengths and weaknesses）"},{"id":"3510","name":"Public open space","topic":"Some people believe that all cities and towns should have at least one large public open space. To what extent do you agree or disagree?","stance":"同意","reasons":[{"en":"I agree, because public open spaces give people a place to exercise, relax and escape from the noise of the city.","zh":"我同意，因为公共开放空间给人们运动、放松和远离城市噪音的地方。","expand":"举例：公园、广场"},{"en":"They also bring different groups together, which builds a stronger sense of community.","zh":"它们还把不同群体聚在一起，建立更强的社区感。","expand":"举例：社区活动"},{"en":"Another reason I agree is that a large public open space can act as the city's green lung, lowering temperatures, absorbing air pollution, and supporting wildlife in otherwise concrete-heavy urban areas.","zh":"我也同意，因为大型公共开放空间可以充当城市的绿肺，在混凝土密集的城市区域降低温度、吸收空气污染并支持野生动物。","expand":"可举例夏季降温、空气质量改善、城市生物多样性。","angle":"环境可持续/城市生态"},{"en":"A further reason I agree is that well-designed open spaces can boost local economies by attracting visitors, hosting events, and increasing nearby business activity, which benefits towns of all sizes.","zh":"此外，我同意，因为设计良好的开放空间可以通过吸引游客、举办活动和增加附近商业活动来提振地方经济，这使各种规模的城镇都受益。","expand":"可举例周末市集、音乐节、咖啡馆和零售生意。","angle":"经济/地方商业"}],"writing":"To what extent 题先明确同意，两个理由从'个人健康'和'社区关系'展开，结尾承认需要考虑维护成本。 本题是 to what extent agree/disagree 题，建议立场同意；开头直接表态，主体段每条理由按主题句+解释+例子展开；已有理由对应健康休闲和社区凝聚，新增理由对应环境生态和地方经济，结论重申所有城镇都应至少保留一个大型公共开放空间。","questionType":"Agree/Disagree (to what extent)"},{"id":"1789","name":"Purpose of education","topic":"Some people think the purpose of education is to prepare for the future workforce and make good members of society. Others think the purpose of education should lead to self-fulfillment. What is your opinion?","stance":"两者兼顾","reasons":[{"en":"I think education should prepare people for work, because practical skills help them support themselves and contribute to society.","zh":"我认为教育应该为工作做准备，因为实用技能帮他们养活自己并为社会做贡献。","expand":"举例：职业培训"},{"en":"However, education should also help people fulfil their potential, since a job alone cannot give everyone a meaningful life.","zh":"但教育也应该帮人实现潜能，因为只有一份工作无法给每个人有意义的人生。","expand":"举例：艺术、人文课程"},{"en":"A balanced education is more effective because self-fulfillment nurtures curiosity and adaptability, which are exactly the qualities that help graduates succeed in a rapidly changing workforce.","zh":"均衡的教育更有效，因为自我实现培养好奇心和适应力，而这些正是帮助毕业生在快速变化的劳动力中取得成功的品质。","expand":"举例：项目式学习、跨学科课程、终身学习；说明适应力既服务就业，也来自自我实现。","angle":"两者结合/未来技能"},{"en":"Moreover, combining workforce preparation with self-fulfillment can reduce social inequality, since practical training offers economic mobility while personal growth gives disadvantaged learners the confidence to aim higher.","zh":"此外，把职业准备与自我实现结合起来能减少社会不平等，因为实用培训提供经济流动机会，而个人成长给弱势学习者追求更高目标的信心。","expand":"举例：奖学金、职业指导、导师制、社区项目；说明经济流动与自信如何同时造福个人和社会。","angle":"社会公平/社会凝聚力"}],"writing":"这题是两个观点的对比，正文各写一段，结尾给出平衡观点：工作准备和自我实现并不冲突。 建议用“先承认职业/社会需求，再引入自我实现”的让步—整合结构；连接词可用 while, rather than, therefore。结论重申：教育应同时培养可就业能力和完整的人，而不是二选一。","questionType":"Opinion — What is your opinion?（建议立场：两者兼顾）"},{"id":"4341","name":"Restorations of buildings","topic":"More and more countries spend large amounts of money on the restoration of buildings instead of on modern housing. To what extent do you agree or disagree with this analysis? Support your writing with your experience and/or examples.","stance":"部分同意，需要平衡","reasons":[{"en":"I partly agree that too much is spent on restoration, because historical buildings do preserve culture and attract tourists.","zh":"我部分同意修复花费过多，因为历史建筑确实保存文化、吸引游客。","expand":"举例：古城、地标建筑"},{"en":"However, modern housing is also essential, since many people still lack affordable places to live.","zh":"但现代住房同样重要，因为很多人仍缺乏负担得起的住房。","expand":"对比：旅游收益 vs 居住需求"},{"en":"Moreover, excessive restoration can gentrify neighbourhoods by raising property values and rents, which forces long-term residents out and deepens the housing shortage for low-income families.","zh":"此外，过度修复会通过抬高房价和租金使社区绅士化，迫使长期居民搬离，并加深低收入家庭的住房短缺。","expand":"举例：历史城区改造后租金上涨，原住民和小商户迁出，旅游化社区反而减少本地可负担住房。","angle":"社会影响/绅士化"},{"en":"Therefore, governments should fund restoration through tourism taxes or public-private partnerships so that heritage is preserved without draining the budget needed for modern affordable housing.","zh":"因此，政府应通过旅游税或公私合作来资助修复，这样既能保护遗产，又不会耗尽现代保障性住房所需的预算。","expand":"提出具体政策：征收专项旅游税、引入企业赞助、用修复后商业收益反哺住房建设。","angle":"政策方案/资金机制"}],"writing":"To what extent 题用部分同意，两方面都写，结论是资金应该在文化遗产和住房之间平衡。 本文按部分同意立场展开：先承认修复有文化和旅游价值，再强调现代住房是基本需求，接着用绅士化说明过度修复的负面后果，最后用旅游税或公私合作提出平衡方案。结论重申政府应设定预算比例，优先保障可负担住房，同时以可持续资金支持遗产修复，避免简单二选一。","questionType":"同意/不同意题（To what extent do you agree or disagree）"},{"id":"1799","name":"Robots","topic":"An increasing number of robots are being used nowadays to perform a wide variety of tasks. Do you think robots are going to increase or decrease our quality of life?","stance":"提高生活质量，但需处理就业","reasons":[{"en":"I think robots will increase our quality of life, because they can handle dangerous, repetitive or precise tasks faster and more accurately than humans.","zh":"我认为机器人会提高生活质量，因为它们能比人类更快更准地处理危险、重复或精密的任务。","expand":"举例：工厂、手术、救援"},{"en":"However, they may reduce jobs in some industries, so governments need to retrain workers for new roles.","zh":"但它们可能减少某些行业的岗位，所以政府需要为工人提供再培训。","expand":"让步 + 解决"},{"en":"Robots can lower production costs and make everyday goods and services more affordable, so even low-income families may enjoy a higher material standard of living.","zh":"机器人可以降低生产成本，使日常商品和服务更可负担，因此即使低收入家庭也可能享受更高的物质生活水平。","expand":"可展开制造业、物流和农业自动化如何降低价格，提升普通家庭购买力，并与已有“效率提升”理由形成经济层面的补充。","angle":"经济福利/生活成本"},{"en":"By taking over routine household chores, robots can give people more free time for family, rest and creative pursuits, which directly improves their emotional well-being.","zh":"通过接管日常家务，机器人可以给人们更多自由时间用于家庭、休息和创造性追求，这直接提升他们的情绪健康。","expand":"可举例扫地机器人、智能厨房和洗衣折叠设备，说明家务时间减少后，人们能更好平衡工作与生活，提升幸福感。","angle":"闲暇与幸福感/工作生活平衡"}],"writing":"increase/decrease 题选边（提高），但要正面处理'就业'这个反方论点，给出解决方式。 立场明确选 increase：开头写 I believe robots will increase our quality of life, although job displacement must be managed. 主体按“危险重复精密任务→降低生活成本→释放闲暇提升幸福感”展开，再用已有让步句承认可能减少岗位并强调政府再培训。结论重申提高生活质量，但需配套就业政策。这样既直接回答 increase/decrease，也覆盖反方担忧。","questionType":"同意/不同意题（选择 increase 或 decrease 的立场题）"},{"id":"1784","name":"Scientific subject","topic":"Which subject will you choose for study of science? Explain it with examples.","stance":"选择生物学","reasons":[{"en":"I would choose biology, because it explains how living things work and connects directly to health, food and the environment.","zh":"我会选生物学，因为它解释生物如何运作，直接关系到健康、食物和环境。","expand":"举例：疾病、基因、生态"},{"en":"Biology also opens up many career paths, from medicine and research to environmental protection.","zh":"生物学也打开很多职业路径，从医学、研究到环境保护。","expand":"举例：医生、科研人员"},{"en":"A further reason I choose biology is that it combines laboratory experiments with fieldwork, letting students test ideas about ecosystems and human health in real situations.","zh":"我选择生物学的另一个原因是它把实验室实验与实地考察结合，让学生在真实情境中检验关于生态系统和人类健康的想法。","expand":"可举水质检测、生态调查、公共卫生数据等例子，说明生物学不是死记硬背，而是能动手验证和解决现实问题。","angle":"实践性/研究方法"},{"en":"Choosing biology also helps me understand urgent social issues like pandemics and climate change, enabling informed personal decisions and meaningful participation in public debates today.","zh":"选择生物学还帮助我理解流行病和气候变化等紧迫社会议题，使我今天能做出明智的个人决定并有意义地参与公共讨论。","expand":"可举疫苗选择、环保政策、可持续消费等例子，说明学生物学能提升个人判断力和社会参与度。","angle":"社会相关性/公民责任"}],"writing":"题目要你选一个学科，不能泛泛而谈。选定生物学后，两个理由分别讲'和生活相关'和'职业前景'。 本题是选择+解释类，开头必须明确选择生物学，并用 because/since 给出理由；每个理由后紧跟一个具体例子，如医学、生态或公共卫生。新增理由不要重复健康、食物、环境和职业路径，重点补充实践研究方法与社会议题参与。","questionType":"选择+解释类（Which subject will you choose... Explain it with examples）"},{"id":"1795","name":"Selecting specialist areas of study","topic":"In some countries, children can choose which subjects they study from the age of 14. This allows them to select a specialist area and to stop studying subjects they do not like. What do you think are the benefits and disadvantages of doing this?","stance":"有利有弊","reasons":[{"en":"One benefit is that students can focus on subjects they enjoy and develop deeper knowledge in their specialist area.","zh":"一个好处是学生能专注自己喜欢的科目，在专业领域学得更深。","expand":"举例：艺术、理科专长者"},{"en":"However, choosing too early may limit their options, because teenagers often do not know what they really want to do.","zh":"但选得太早可能限制他们的选择，因为青少年常常不知道自己真正想做什么。","expand":"对比：早定 vs 晚定"},{"en":"Another benefit is that early subject choice can reduce stress and boredom, making school more engaging because teenagers spend more time on materials that match their interests and strengths.","zh":"另一个好处是，提早选科能减少压力和厌倦感，让学校生活更有吸引力，因为青少年能把更多时间花在符合自己兴趣和优势的内容上。","expand":"可展开：不喜欢的科目容易导致厌学、走神和低参与度；允许选择能提升学习动力和课堂投入。可补一句平衡：核心基础课仍应保留，避免完全放任。","angle":"学习动机与心理健康"},{"en":"A key disadvantage is that specialisation at fourteen may narrow students' general knowledge, leaving them weaker in essential skills such as writing, numeracy, and understanding of society and science.","zh":"一个主要缺点是，14岁就专业化可能缩窄学生的通识知识，使他们在写作、计算以及理解社会和科学等基本能力上更薄弱。","expand":"可展开：过早放弃数学、语言、历史等科目，会影响未来转专业、职业选择和公民素养。可建议保留必修核心课，并延后重大分流。","angle":"通识教育与长期能力"}],"writing":"benefits + disadvantages 各一段，结尾给建议：可以提供专业方向，但要保留转换的灵活性。 这是利弊题，立场建议“有利有弊”。主体段可先写好处：已有“专注兴趣并深入学习”＋新增“减少压力、提升参与度”；再写坏处：已有“选得太早限制选择”＋新增“知识面变窄、基础技能受损”。结论保持平衡：支持一定程度的14岁选科，但学校应保留核心必修课并提供职业与学业指导。","questionType":"利弊题（benefits and disadvantages）"},{"id":"3507","name":"Short working weeks","topic":"Unemployment among young people is a serious problem. Some people suggest shorter working weeks instead of laying off employees. What do you think are the advantages and disadvantages? Is it also applicable to adults?","stance":"有利有弊，部分适用成人","reasons":[{"en":"One advantage is that shorter weeks can preserve jobs, because the same amount of work is shared among more employees.","zh":"一个优势是缩短工作周能保住岗位，因为同样的工作量由更多员工分担。","expand":"举例：经济低迷期的企业"},{"en":"However, it may reduce income for workers and increase costs for companies, since they need more staff to cover the same tasks.","zh":"但可能减少员工收入、增加公司成本，因为需要更多人完成同样的任务。","expand":"对比：员工收入 vs 企业成本"},{"en":"Another advantage is that reduced working hours can improve employees' health and productivity, while giving young people more time to gain training or education, which may raise their long-term employability.","zh":"另一个优势是，缩短工时可以改善员工健康与生产力，同时让年轻人有更多时间接受培训或教育，这可能提升他们的长期就业能力。","expand":"可举年轻员工边工作边学习、实习或技能培训，减少长期失业导致的技能退化；也可说健康改善降低缺勤率、提高工作效率。","angle":"advantage：健康、生产力与长期就业力"},{"en":"However, shorter weeks are only partly suitable for adults, because many have fixed mortgages and family costs, so reduced pay may cause financial hardship unless implemented in flexible or high-income sectors.","zh":"然而，缩短工时只部分适用于成年人，因为许多人背负固定房贷和家庭开支，所以除非在灵活或高收入行业实施，否则减薪可能造成经济困难。","expand":"对比成年人与年轻人在财务责任上的差异；说明知识型、弹性行业较适用，制造业或低薪岗位难适用。可联系建议立场“部分适用成人”。","angle":"applicability：成人适用性与财务负担限制"}],"writing":"题目有两问（优缺点 + 是否适用成人），正文要先讲优缺点，最后单独回答成人是否适用。 此题属于利弊加适用性两部分题。主体段先补充缩短工时的额外好处，如健康、培训与长期就业力；再讨论成人是否适用，强调仅部分适用，取决于行业、收入与家庭负担。结论重申有利有弊，不能一概而论，需分人群和行业设计政策。","questionType":"advantages and disadvantages + applicability (two-part question)"},{"id":"3501","name":"Studying plays","topic":"There are both problems and benefits for high school students studying plays and works of theatres written centuries ago. Discuss and use your own experience.","stance":"有益也有问题","reasons":[{"en":"One benefit is that classic plays develop students' language, imagination and understanding of history and human nature.","zh":"一个好处是经典戏剧能提升学生的语言、想象力，以及对历史和人性理解。","expand":"举例：莎士比亚作品"},{"en":"However, the old-fashioned language can be hard to understand, which may discourage students and reduce their interest.","zh":"但过时的语言很难理解，可能让学生受挫、失去兴趣。","expand":"举例：阅读困难"},{"en":"Another advantage is that performing or discussing these plays can build students' confidence and teamwork, because they must interpret roles together and present ideas in front of classmates.","zh":"另一个好处是表演或讨论这些戏剧能建立学生的自信和团队合作，因为他们必须一起诠释角色并在同学面前呈现观点。","expand":"可举课堂小组表演《麦克白》片段，学生分工记台词、设计动作、互相纠错，最后展示。","angle":"benefit: performance/teamwork/confidence"},{"en":"A further problem is that these centuries-old works often reflect outdated social values, so some students may feel alienated or uncomfortable rather than engaged in classroom discussion.","zh":"另一个问题是这些几百年前的作品常反映过时的社会价值观，因此一些学生可能感到疏离或不适，而不是投入课堂讨论。","expand":"比如《威尼斯商人》中性别或种族刻板印象，需要老师引导批判性讨论，避免学生排斥。","angle":"problem: outdated values/student engagement"}],"writing":"题目只要 problems and benefits，正文各一段，结尾用个人经历补充，并建议配合现代解读。 将两条新理由分别放在两个主体段：benefit段接在经典戏剧价值后，problem段接在语言难度后；用 Another advantage is that... / A further problem is that... 过渡；结尾用个人经历，如小组表演或课堂讨论，证明利弊并存并重申立场。","questionType":"双边讨论题（Discuss both benefits and problems）"},{"id":"4362","name":"Subject choosing","topic":"Rather than choose a subject that is suitable for future employment possibilities, you should choose a subject that you are interested in or could get good grades. Agree or disagree?","stance":"部分同意，兴趣和就业要平衡","reasons":[{"en":"I partly agree that students should choose subjects they are interested in, because interest keeps them motivated and helps them get better results.","zh":"我部分同意学生应该选感兴趣的科目，因为兴趣能保持动力，也帮他们拿到更好的成绩。","expand":"举例：喜欢历史所以成绩好"},{"en":"However, employment prospects should not be ignored, since students need practical skills to support themselves after graduation.","zh":"但就业前景也不应忽视，因为学生毕业后需要实用技能来养活自己。","expand":"举例：就业率高的专业"},{"en":"Another reason for a balanced choice is that a student's interests often change, while labour-market demands can shift quickly, so relying on either alone may lead to regret after graduation.","zh":"另一个支持平衡选择的理由是，学生的兴趣常常会变，而劳动力市场需求也可能迅速变化，因此只依赖其中任何一方都可能在毕业后后悔。","expand":"可举例：入学时喜欢某专业，毕业时行业萎缩；或兴趣转向，导致转专业成本高。","angle":"长期风险/适应力"},{"en":"Moreover, combining passion with employability allows graduates to enter a stable field first and then pursue their interests through further study or career changes, which is more realistic.","zh":"此外，把热情与就业能力结合起来，能让毕业生先进入稳定领域，再通过深造或职业转换追求兴趣，这更现实。","expand":"可举例：先做稳定工作积累资金，再用业余时间学习或转行到真正热爱的领域。","angle":"职业路径/现实规划"}],"writing":"先用 partly agree 表态，再说明为什么就业也要考虑，结尾建议在两者之间找交集。 本题是同意/不同意题，建议立场为部分同意。主体段可先承认兴趣与好成绩能带来动力和学术表现，再说明就业前景与实用技能的重要性，最后用两条新理由强调兴趣会变、市场会变，以及先就业再追求兴趣的平衡策略。","questionType":"同意/不同意题（部分同意）"},{"id":"4364","name":"Successful people","topic":"It is often said that people's lives are defined by the place where they grew up. Choose a successful person and discuss how that person's accomplishments were or were not influenced by the place where they lived when they were young.","stance":"环境有影响，但个人努力更重要","reasons":[{"en":"The place where people grow up can shape their opportunities, because access to education, role models and resources varies greatly.","zh":"成长的地方会影响机会，因为教育、榜样和资源的可及性差异很大。","expand":"举例：选择一个具体成功人物"},{"en":"However, personal effort and determination matter more, since many successful people came from difficult backgrounds.","zh":"但个人努力和决心更重要，因为很多成功人士出身艰难。","expand":"举例：同一人物的早年经历"},{"en":"South Africa’s social and political tensions during Elon Musk’s youth may have encouraged his independent thinking and ambition, showing that a difficult environment can influence character even when it limits opportunity.","zh":"埃隆·马斯克青年时期南非的社会与政治紧张，可能促使他形成独立思考与雄心，表明艰难环境即使限制机会，也能影响性格。","expand":"接在已有“地点影响机会”后，用同一人物说明地点还塑造性格与价值观，但这是间接影响，为下文个人选择做铺垫。","angle":"地点影响/性格塑造"},{"en":"Yet Musk’s later decision to leave South Africa for North America, despite the difficulty of moving, shows that deliberate personal choices, not his birthplace, shaped his path to entrepreneurial success.","zh":"然而，马斯克后来决定离开南非前往北美，尽管搬迁困难，这表明塑造他创业成功道路的是深思熟虑的个人选择，而非出生地。","expand":"接在已有“个人努力更重要”后，用移民和主动换环境说明地点只是起点，个人选择与行动才决定最终成就。","angle":"个人能动性/迁移选择"}],"writing":"题目要求选一个成功人物贯穿全文，两个理由都要落在这个人身上，不要泛泛举例。 写作时先明确选择Elon Musk，主体第一段承认南非成长影响其性格与早期兴趣，第二段用移居北美和创业选择论证地点不能定义成就，结论重申环境提供条件但个人能动性更关键；每段用具体细节，避免只写空泛总结。","questionType":"人物例证型双边讨论题"},{"id":"1790","name":"Taking part in sport","topic":"\"Taking part in sport as an adult is important for health and happiness.\" To what extent do you agree with this statement? Provide reasons and/or examples to support your ideas.","stance":"同意","reasons":[{"en":"I agree, because regular exercise keeps adults physically healthy and reduces the risk of heart disease and obesity.","zh":"我同意，因为规律运动让成年人保持身体健康，降低心脏病和肥胖的风险。","expand":"举例：跑步、游泳"},{"en":"Sport also improves mental health, since it relieves stress and helps people feel happier and more confident.","zh":"运动也改善心理健康，因为它减压，让人更快乐、更自信。","expand":"举例：团队运动、社交"},{"en":"I also agree because participating in sport gives adults valuable social connections, as team activities and fitness classes reduce loneliness and create a sense of belonging that directly boosts happiness.","zh":"我也同意，因为参与运动给成年人带来宝贵的社交联系，团队活动和健身课减少孤独，并创造直接提升幸福感的归属感。","expand":"举例：业余足球、跑步俱乐部或社区健身课，让成年人结识朋友并减少孤独。","angle":"社交联系/归属感"},{"en":"Furthermore, I agree because regular sport builds discipline and a sense of purpose, helping adults maintain a structured routine and feel more accomplished, which raises long-term life satisfaction and happiness.","zh":"此外，我同意，因为规律运动培养自律和目标感，帮助成年人保持规律作息并更有成就感，从而提升长期生活满意度和幸福感。","expand":"举例：晨跑、每周固定训练或完成比赛目标，增强自律和成就感。","angle":"自律/目标感/生活满意度"}],"writing":"To what extent 题先表态同意，两个理由从'身体'和'心理'两个层面展开，各配一个例子。 这是一道同意程度题，建议立场为同意。两条新理由分别从社交归属和自律目标感补充已有身体健康与心理健康，可写成四段主体：身体健康→心理减压→社交幸福→目标与生活满意度，最后重申完全同意。每条理由后加一个具体例子，如跑步俱乐部、晨跑计划。","questionType":"同意/不同意（To what extent do you agree?）"},{"id":"4351","name":"Taking part in Sports","topic":"People should take part in sports either individually or in teams because people can learn many useful skills. How far do you agree? Explain and use examples or your own experience.","stance":"同意","reasons":[{"en":"I agree, because team sports teach cooperation, communication and how to handle both winning and losing.","zh":"我同意，因为团队运动教合作、沟通，以及如何面对输赢。","expand":"举例：足球队、接力赛"},{"en":"Individual sports also build self-discipline and time management, since athletes must train regularly on their own.","zh":"个人运动也培养自律和时间管理，因为运动员必须自己规律训练。","expand":"举例：游泳、长跑"},{"en":"I also agree because sports, whether solo or team-based, teach participants to set goals and persevere; athletes must improve personal bests or help a team reach a shared target, which builds resilience useful in study and work.","zh":"我也同意，因为体育无论个人还是团队都教人设定目标并坚持；运动员必须提升个人最好成绩或帮助团队实现共同目标，这培养了对学习和工作有用的韧性。","expand":"可举例：个人跑者记录时间并逐步突破，团队为赛季目标一起训练；强调目标设定与抗压坚持。","angle":"目标设定/韧性"},{"en":"Another reason I agree is that sports teach respect for rules and fair play, as individuals and teams must follow regulations, accept referees' decisions and treat opponents politely, skills that improve workplace ethics and social responsibility.","zh":"我同意的另一个理由是体育教人尊重规则和公平竞争，因为个人和团队都必须遵守规则、接受裁判判罚并礼貌对待对手，这些技能提升职场道德和社会责任感。","expand":"可举例：足球比赛中服从判罚、网球中尊重界内界外、赛后与对手握手；说明规则意识可迁移到职场和社会生活。","angle":"规则意识/公平竞争"}],"writing":"how far 题表态同意，两个理由分别讲'团队技能'和'个人品质'，各配一个例子。 本题为 How far do you agree，建议明确同意。新理由可与已有理由并列使用：主体段先写团队运动教合作与输赢态度，个人运动教自律与时间管理，再补充运动培养目标韧性及规则公平意识。每段采用“观点+解释+个人/团队例子”，如校队训练、马拉松备赛、裁判判罚，结尾重申同意并说明这些技能对学习和工作都有价值。","questionType":"同意/不同意题（How far do you agree?）"},{"id":"1794","name":"Tax on high-sugar products","topic":"In many countries, people are consuming considerably larger amounts of sugar than is healthy. Some people think that a tax on products that contain high levels of sugar is the only way to change behaviour. How far do you agree with that idea?","stance":"部分同意，但不是唯一办法","reas
