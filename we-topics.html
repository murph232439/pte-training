ons":[{"en":"I partly agree, because higher prices can discourage people from buying sugary drinks and reduce consumption.","zh":"我部分同意，因为更高的价格能阻止人们购买含糖饮料，减少消费。","expand":"举例：其他国家的糖税效果"},{"en":"However, a tax alone is not enough, since education about healthy eating and clear food labels are also important.","zh":"但仅靠税收不够，因为健康饮食教育和清晰的食品标签同样重要。","expand":"对比：单一措施 vs 综合措施"},{"en":"I also partly disagree that taxation is the only solution, since a sugar tax may be regressive, burdening low-income households while failing to change addicted consumers’ habits.","zh":"我也部分不同意税收是唯一办法，因为糖税可能具有累退性，给低收入家庭带来负担，却无法改变成瘾消费者的习惯。","expand":"可举低收入家庭食品支出占比高、成瘾者价格不敏感，说明税不是唯一有效手段。","angle":"公平性/政策局限"},{"en":"I would therefore argue that governments should combine taxation with measures such as banning sugary drink advertising to children and subsidising healthier alternatives, because behaviour change needs a supportive food environment.","zh":"因此我认为，政府应把税收与禁止向儿童投放含糖饮料广告、补贴更健康替代品等措施结合，因为行为改变需要支持性的食品环境。","expand":"广告限制减少诱导、补贴降低健康食品价格，与已有教育标签形成互补。","angle":"综合政策/环境干预"}],"writing":"题目里有 only way 这个绝对说法，用 partly agree 反驳，说明糖税有用但不充分。 将新理由接在已有理由之后：先承认糖税有效，再用公平性和成瘾者价格不敏感说明其非唯一，最后用广告限制与健康食品补贴提出配套方案，结尾回扣“部分同意，但糖税不是唯一办法”。","questionType":"同意/不同意（How far do you agree?）"},{"id":"1791","name":"Team sports","topic":"\"Team sports are invariably more beneficial for the people who take part in them than individual sports. \"How far do you agree with this statement? Support your point of view with reasons and/or examples from your own experience.","stance":"部分同意","reasons":[{"en":"I partly agree that team sports are more beneficial, because players learn to cooperate, communicate and support each other toward a common goal.","zh":"我部分同意团队运动更有益，因为球员要学会合作、沟通和互相支持，才能达成共同目标。","expand":"举例：比赛中的配合"},{"en":"However, individual sports also have value, since they build self-discipline and teach people to rely on themselves.","zh":"但个人运动也有价值，因为它们能培养自律，教会人们依靠自己。","expand":"举例：游泳、长跑"},{"en":"In addition, team sports can create a strong sense of belonging and social support, which may improve participants' mental health and help them handle pressure better than training alone.","zh":"此外，团队运动能营造强烈的归属感和社会支持，这可能比独自训练更能改善参与者的心理健康，并帮助他们更好地应对压力。","expand":"举例：赛后队友互相鼓励、共同庆祝胜利，缓解焦虑和孤独感。","angle":"团队运动—心理与社交归属"},{"en":"Conversely, individual sports often offer greater flexibility, allowing people to train at their own pace and around busy schedules, so they may be more sustainable for those who dislike group settings.","zh":"相反，个人运动通常提供更大的灵活性，让人们按自己的节奏并围绕繁忙日程训练，因此对不喜欢群体环境的人来说可能更可持续。","expand":"举例：上班族可独自晨跑或游泳，不必迁就队伍时间，更容易长期坚持。","angle":"个人运动—灵活性与可及性"}],"writing":"invariably 是绝对词，回答时用 partly agree，既认可团队运动，也承认个人运动的价值。 采用部分同意结构：开头明确虽团队运动在社交归属方面突出，但并非 invariably 优于个人运动；主体第一段用已有理由和新理由支持团队运动好处，第二段用已有理由和新理由说明个人运动价值；结尾重申益处取决于个人目标、性格和生活方式。可用 In addition、Conversely、While、However 连接，避免绝对化表达。","questionType":"How far do you agree?（部分同意/partly agree）"},{"id":"1798","name":"Technology and creativity","topic":"Nowadays, many people use devices, such as tablets or mobile phones, that are linked to the Internet and involve looking at screens for long periods of time. Should we be worried that this type of technology is limiting creativity?","stance":"取决于使用方式","reasons":[{"en":"I think there is some reason to worry, because spending hours passively watching screens leaves less time for imaginative play and hands-on creation.","zh":"我认为担忧有一定道理，因为长时间被动看屏幕，留给想象和动手创作的时间就少了。","expand":"举例：刷短视频 vs 画画"},{"en":"However, technology can also support creativity, since people can use apps to draw, compose music, edit videos and share ideas worldwide.","zh":"但科技也能促进创造力，因为人们可以用应用画画、作曲、剪视频，并与全世界分享想法。","expand":"举例：设计软件、编程"},{"en":"Excessive screen time may fragment attention through constant notifications and multitasking, and since creativity often requires sustained concentration and deep reflection, this habit can genuinely weaken original thinking.","zh":"过度使用屏幕可能通过不断通知和多任务切换使注意力碎片化；而创造力往往需要持续专注和深度反思，因此这种习惯确实可能削弱原创思考。","expand":"可展开说明通知、短视频切换和多任务如何打断深度工作，降低发散思维和持续构思能力；与已有“被动看屏幕减少创作时间”形成递进，进一步解释担忧为何有道理。","angle":"担忧/认知机制/注意力碎片化"},{"en":"Yet when users deliberately employ devices for learning, problem-solving or collaborative projects, screens can function as creative tools rather than distractions, so the outcome depends on purposeful use and guidance.","zh":"然而，当用户有意识地用设备学习、解决问题或开展协作项目时，屏幕可以成为创造工具而非干扰，因此结果取决于有目的的使用和引导。","expand":"可举例编程、小组项目、在线课程和教师或家长引导下的数字创作，说明主动使用能培养问题解决和迭代思维；与已有“用应用创作分享”连用，但重点转向目的性与引导。","angle":"条件性支持/主动使用/引导"}],"writing":"题目问 should we be worried，要给条件性的回答：关键看是被动消费还是主动创造。 本题开头应直接回应：Whether we should be worried depends on how this technology is used. 主体段可先承认被动、过度、无引导的屏幕使用可能限制创造力，再说明主动、有目的、有引导的使用不一定限制，甚至能促进创造力。两条新理由可分别接在已有担忧理由之后和已有支持理由之后，形成递进与平衡。结尾重申：technology itself is neutral; balanced and guided use is the key.","questionType":"同意/不同意（Should 问句，条件性立场：取决于使用方式）"},{"id":"3512","name":"Technology used for space travel","topic":"Governments should focus on people's lives or technologies used for space travel. To what extent do you agree with it? Use your examples.","stance":"优先民生，但兼顾航天","reasons":[{"en":"I partly agree that governments should focus on people's lives, because problems like healthcare, education and housing affect millions of people every day.","zh":"我部分同意政府应关注民生，因为医疗、教育和住房问题每天都影响数百万人。","expand":"举例：医院、学校"},{"en":"However, space technology also brings long-term benefits, since satellites improve communication, weather forecasting and navigation.","zh":"但航天技术也带来长期好处，因为卫星改善通信、天气预报和导航。","expand":"举例：GPS、气象"},{"en":"Governments should prioritise people's lives because public welfare is their core responsibility, and without stable incomes, clean water and basic safety, citizens cannot support expensive space programmes.","zh":"政府应优先考虑民众生活，因为公共福利是其核心职责；若没有稳定收入、清洁用水和基本安全，公民无法支持昂贵的航天项目。","expand":"举例：基础公共服务、公众信任、税收支持；说明民生不稳会削弱长期航天预算的政治基础。","angle":"民生优先/社会稳定/公共信任"},{"en":"At the same time, well-targeted space research can generate medical, material and robotic innovations that later improve hospitals, farming and disaster relief, so it should complement rather than replace social spending.","zh":"同时，目标明确的航天研究可以带来医疗、材料和机器人创新，这些创新之后会改善医院、农业和救灾，因此它应补充而非取代社会支出。","expand":"举例：航天技术转化到医疗设备、农业监测、救灾机器人；强调预算分配而非二选一。","angle":"航天反哺民生/预算平衡"}],"writing":"to what extent 题用 partly agree，两边都写，结尾给出合理的资源分配建议。 这是同意/不同意题，建议采取“部分同意”立场：先支持民生优先，再承认航天在财政可承受且能服务民生时值得保留；结论可写政府应优先民生，同时以有限、透明预算发展航天，直接回应To what extent。","questionType":"同意/不同意题（To what extent do you agree?）"},{"id":"1793","name":"Tertiary education","topic":"Some people believe that tertiary education should focus mainly on preparation for the workplace. Others see it as a broader preparation for life. Explain where your opinion lies between these points of view, giving reasons and/or examples as justification.","stance":"在两者之间","reasons":[{"en":"Tertiary education should prepare students for the workplace, because practical skills and internships help them find jobs after graduation.","zh":"大学教育应该为学生进入职场做准备，因为实用技能和实习能帮他们毕业后找到工作。","expand":"举例：实习、职业课程"},{"en":"However, university should also prepare students for life, since critical thinking and broad knowledge help them make better decisions.","zh":"但大学也应该为学生的人生做准备，因为批判性思维和广博知识帮他们做更好的决定。","expand":"举例：通识课程"},{"en":"A balanced curriculum is better because focusing only on workplace training can make graduates vulnerable when industries change, while broad life preparation alone may leave them without the specific skills employers expect.","zh":"平衡的课程更好，因为只注重职场训练会让毕业生在行业变化时很脆弱，而只注重人生准备又可能让他们缺少雇主期望的具体技能。","expand":"可举例说明AI和自动化导致岗位快速变化，因此学生既需要可迁移能力，也需要一定专业技能。","angle":"平衡与适应力"},{"en":"Universities should combine career-focused learning with life-focused learning, because transferable abilities such as communication, teamwork, and ethical judgment improve both professional success and personal wellbeing.","zh":"大学应把职业导向学习和人生导向学习结合，因为沟通、团队合作和伦理判断等可迁移能力既能提升职业成功，也能提升个人幸福。","expand":"可举例小组项目、课堂演讲和伦理案例分析，说明这些能力在工作和生活中都长期有用。","angle":"可迁移能力与双赢"}],"writing":"题目 explicit 地要求说明你的位置（where your opinion lies），所以要明确表态：两边都重要，但侧重哪边。 这两条理由可接在已有两条之后：先承认职场准备和人生准备各有价值，再用第一条说明单一极端的风险，用第二条提出融合方案，最后重申自己支持两者平衡的中间立场。","questionType":"双边讨论题（立场在两者之间）"},{"id":"1752","name":"The Digital Age","topic":"Some people claim that the digital age has made us lazier, others claim it has made us more knowledgeable. Discuss both opinions and use your own experience to support them. ​​​​​​​","stance":"整体是进步，但要注意依赖","reasons":[{"en":"I think the digital age has made us more knowledgeable, because we can access information, courses and global news within seconds.","zh":"我认为数字时代让我们更有知识，因为我们能在几秒内获取信息、课程和全球新闻。","expand":"举例：在线学习、搜索"},{"en":"However, it can also make us lazier, since people rely on search engines instead of memorising or thinking deeply.","zh":"但它也可能让人变懒，因为人们依赖搜索引擎，不再记忆或深入思考。","expand":"对比：主动使用 vs 被动依赖"},{"en":"From my own experience, digital platforms can also make us more knowledgeable, because interactive tutorials and online communities let us practise new skills and receive feedback far faster than traditional books.","zh":"根据我自己的经历，数字平台也能让我们更有知识，因为互动教程和在线社区让我们能练习新技能并获得反馈，比传统书籍快得多。","expand":"个人例子：通过 YouTube、B站或论坛学编程、修图、烹饪，边做边得到反馈；与只读书本对比。","angle":"知识获取 / 技能实践 / 主动学习"},{"en":"In my own experience, digital convenience can make us lazier as well, since apps automatically handle tasks like navigation and shopping, reducing our need to plan, calculate or remember routes ourselves.","zh":"以我自己的经历，数字便利也会让我们更懒，因为应用自动处理导航和购物等任务，减少了我们自行计划、计算或记路的需要。","expand":"个人例子：以前看纸质地图、心算找零、列购物清单；现在依赖 GPS、外卖和一键下单。","angle":"日常依赖 / 自动化 / 认知惰性"}],"writing":"Discuss both opinions 题两面都写，最后给出自己的立场（整体进步，但要避免依赖）。 此题必须双边讨论，不能只写更有知识或只写更懒。建议开头表明总体立场：数字时代整体是进步，但要警惕依赖。主体段一用已有理由1加新理由1，支撑更有知识，并加入个人在线学习经历；主体段二用已有理由2加新理由2，支撑更懒，并加入个人依赖导航、外卖或自动推荐的经历。结尾回扣两边，强调平衡使用技术。","questionType":"双边讨论题（Discuss both views + own experience）"},{"id":"4347","name":"The purpose of education","topic":"The purpose of education is for workers and good members of society, or individuals to fulfill their lives. Which opinion do you agree with?","stance":"两者兼顾","reasons":[{"en":"I think education should prepare people to contribute to society, because a country needs skilled workers and responsible citizens.","zh":"我认为教育应该培养人贡献社会，因为国家需要熟练的工人和负责任的公民。","expand":"举例：职业培训、公民教育"},{"en":"However, it should also help individuals fulfil their lives, since personal interests and happiness matter as much as economic contribution.","zh":"但它也应该帮个人实现人生，因为个人兴趣和幸福和经济贡献同样重要。","expand":"举例：艺术、志愿服务"},{"en":"Education should also teach students to cooperate, think critically, and resolve social problems, because democratic communities depend on citizens who can make informed collective decisions beyond simply filling jobs.","zh":"教育也应教学生合作、批判思考和解决社会问题，因为民主社区依赖能做出明智集体决策的公民，而不仅是填补工作岗位。","expand":"可举例：社区服务项目、课堂辩论、公共议题研究；说明这些能力让国家和社会受益，而不只是培训岗位技能。","angle":"社会功能/公民能力"},{"en":"Meanwhile, education helps individuals discover their talents, values, and sense of purpose, so they can design lives they find meaningful rather than merely conforming to external expectations.","zh":"同时，教育帮助个人发现自身才能、价值观和人生目标，从而设计自己认为有意义的生活，而非仅仅迎合外界期待。","expand":"可举例：生涯规划、心理咨询、选修课、志愿服务；说明个人意义不等于自私，仍可反哺社会。","angle":"个人发展/自我实现"}],"writing":"题目是二选一，但可以给'两者兼顾'的答案，并说明为什么两者不冲突。 本题问 Which opinion do you agree with?，建议立场为两者兼顾。开头明确写 I agree with a balanced view: education should serve both society and individuals. 主体先写社会目的，再写个人实现，最后说明二者相互促进，避免只支持一边。","questionType":"二选一观点题（Which opinion do you agree with?）"},{"id":"3499","name":"The value of humanities","topic":"Some say that in today’s world, the value of humanities has been eclipsed by the necessity of preparing for specific wealth-producing careers, such as medicine. What is your opinion about the role in today’s changing world of the study of the humanities?","stance":"仍然重要","reasons":[{"en":"I think the humanities are still valuable, because subjects like history and literature develop critical thinking and help people understand different perspectives.","zh":"我认为人文学科仍然有价值，因为历史和文学等学科培养批判性思维，帮人理解不同观点。","expand":"举例：分析文本、讨论伦理"},{"en":"They also benefit careers, since communication, empathy and ethical judgment are important in law, business and medicine.","zh":"它们对职业也有帮助，因为沟通、同理心和伦理判断在法律、商业和医学中都很重要。","expand":"举例：医生需要同理心"},{"en":"In an era of rapid automation and AI, humanities remain vital because they teach us to question technological change, imagine alternative futures, and make ethical decisions that machines cannot make alone.","zh":"在自动化和人工智能迅速发展的时代，人文学科依然至关重要，因为它们教我们质疑技术变革、想象替代性未来，并做出机器无法独自完成的伦理决策。","expand":"可举例说明AI生成内容、基因编辑或平台算法带来的伦理争议，强调人文训练能提供价值判断和未来想象。","angle":"科技时代/伦理判断"},{"en":"Moreover, the humanities sustain democratic societies by helping citizens interpret media, recognize propaganda, and appreciate cultural differences, which is essential in a globally connected and politically polarized world.","zh":"此外，人文学科通过帮助公民解读媒体、识别宣传并欣赏文化差异来维系民主社会，这在全球互联且政治极化的世界中至关重要。","expand":"可联系假新闻、社交媒体回音室和跨文化冲突，说明历史、哲学与文学如何培养负责任的公民。","angle":"公民社会/文化理解"}],"writing":"题目暗示'人文学科被冷落'，回答时要正面反驳这个说法，从思维和职业两个角度说明价值。 本题为同意/不同意类，立场应明确保持“人文学科在今天仍然重要”。建议将已有理由与新理由合并为两个主体段：第一段写个人能力与职业价值，用已有两条理由；第二段写时代适应与社会价值，用新增两条理由，形成“个人—职业—科技—社会”的递进。每段用主题句加解释和例子，结论重申人文学科不是医学等职业的对立面，而是其必要补充。","questionType":"Opinion (agree/disagree): humanities remain important"},{"id":"4345","name":"Tuition fee","topic":"Because university degrees can get jobs with higher salaries, university students should pay the full cost of their education. Do you agree or not?","stance":"部分同意，需要资助配套","reasons":[{"en":"I partly agree, because students benefit personally from higher salaries after graduation, so they should contribute to the cost.","zh":"我部分同意，因为学生毕业后获得更高薪水，个人受益，所以应该分担费用。","expand":"举例：毕业后的薪资差异"},{"en":"However, paying the full cost would exclude poor students, so scholarships and loans are necessary to keep education fair.","zh":"但全额付费会把贫困学生排除在外，所以需要奖学金和贷款来保证教育公平。","expand":"对比：公平 vs 效率"},{"en":"I disagree with full fees because universities generate broad public benefits, such as better healthcare, research and public services, so taxpayers should share the cost while students pay a fair portion.","zh":"我不同意全额收费，因为大学产生广泛的公共收益，如更好的医疗、科研和公共服务，所以纳税人应分担成本，而学生支付合理份额。","expand":"可举医学研究、公共服务人才、社会创新等例子，说明高等教育不只让个人受益，因此不应由学生独自承担全部成本。","angle":"社会收益/纳税人责任"},{"en":"A fair funding model should let graduates repay through income-contingent contributions, so students still share costs without being blocked by upfront fees that poor families cannot afford.","zh":"公平的资助模式应让毕业生按收入比例还款，这样学生仍分担成本，又不会因贫困家庭无法承担的前期费用而被挡在门外。","expand":"可说明毕业后收入达到一定水平才还款，低收入时暂缓，兼顾个人责任与教育机会公平。","angle":"资助机制/公平与效率"}],"writing":"agree/disagree 题用 partly agree，先承认合理之处，再指出公平问题，给出资助方案。 放在主体段：先承认个人受益，再以公共收益反驳全额收费，最后提出收入挂钩还款作为折中方案；结论重申部分同意，需资助配套。","questionType":"同意/不同意（Do you agree or not?）"},{"id":"3515","name":"Unhealthy lifestyles","topic":"Poor lifestyles hurt people's health. List some unhealthy lifestyles and discuss what government services could help.","stance":"列问题 + 给政府建议","reasons":[{"en":"Two common unhealthy lifestyles are sitting for long hours and eating too much fast food, both of which can lead to obesity and heart disease.","zh":"两种常见的不健康生活方式是长时间久坐和吃太多快餐，这两者都会导致肥胖和心脏病。","expand":"举例：办公室工作、外卖"},{"en":"Governments can help by funding public sports facilities, offering free health checks and taxing sugary drinks.","zh":"政府可以通过资助公共运动设施、提供免费体检和对含糖饮料征税来帮助。","expand":"举例：社区健身房、免费体检"},{"en":"Other unhealthy lifestyles include smoking, excessive alcohol consumption and chronic sleep deprivation, which weaken immunity and increase the risks of cancer, liver disease and mental health problems.","zh":"其他不健康生活方式包括吸烟、过度饮酒和长期睡眠不足，这些会削弱免疫力，并增加患癌症、肝病和心理健康问题的风险。","expand":"可具体列举吸烟、酗酒、熬夜或睡眠不足，并说明它们分别对肺、肝和情绪状态的危害，作为对已有“久坐+快餐”问题的补充。","angle":"问题补充：更多不健康生活方式与健康风险"},{"en":"Governments should also provide accessible counseling, smoking cessation services and stricter limits on alcohol advertising, so people can change these habits with professional support rather than willpower alone.","zh":"政府还应提供易获得的心理咨询、戒烟服务和更严格的酒类广告限制，这样人们就能在专业支持下改变这些习惯，而不是只靠意志力。","expand":"可举例社区心理咨询、戒烟门诊、限制酒类广告和销售时间，说明政府服务如何降低不健康习惯的发生率。","angle":"方案补充：公共卫生服务与监管"}],"writing":"题目有两个任务（列生活方式 + 政府服务），正文两段各答一问，不要只写一边。 在主体段中，可先接第一条继续扩展不健康生活方式，再用第二条转入政府服务，形成“问题—方案”逻辑；注意不要重复久坐、快餐、公共运动设施、免费体检和含糖饮料税等已有表达。","questionType":"问题解决题（列出不健康生活方式并讨论政府服务）"},{"id":"3508","name":"Wearing uniforms","topic":"Should schools have strict rules on wearing uniforms?","stance":"应该有，但不要过严","reasons":[{"en":"I think schools should have uniform rules, because they reduce peer pressure about clothes and create a sense of equality.","zh":"我认为学校应该有校服规定，因为它们减少衣着上的攀比，营造平等感。","expand":"举例：不同家庭背景的学生"},{"en":"However, the rules should not be too strict, since students should have some freedom to express themselves on special days.","zh":"但规定不应该太严，因为学生应该在特殊日子有一些表达自我的自由。","expand":"让步：主题活动日"},{"en":"Strict uniform rules can also save families money and reduce morning stress, because parents do not need to buy many fashionable outfits or children argue about what to wear each day.","zh":"严格的校服规定还能节省家庭开支、减少早晨压力，因为家长不必购买许多时尚服装，孩子也不用每天争论穿什么。","expand":"可举例：低收入家庭、早晨准备时间、校服循环使用；说明统一着装能降低经济负担并提高效率。","angle":"经济负担与日常效率"},{"en":"Moreover, moderately strict uniform rules help schools identify students and maintain safety, while allowing some flexibility prevents students from feeling that their personal identity is completely controlled.","zh":"此外，适度严格的校服规定有助于学校识别学生、维护安全，而允许一定灵活性可避免学生觉得个人身份被完全控制。","expand":"可展开：校外活动身份识别、访客管理、安全演练；同时保留配饰、发型等有限选择，体现平衡。","angle":"校园安全与管理柔性"}],"writing":"Should 题给出'应该有但要有度'的回答，先讲好处，再给条件，避免走极端。 开头明确立场：学校应有校服规定，但不应过度严格。主体可先写支持严格的理由（平等、省钱、安全），再让步说明不宜过严（表达自由、有限选择），结尾重申平衡。每条理由后接具体例子，避免只写空泛口号。","questionType":"同意/不同意题（Should 问题；立场：应该有校服规定，但不应过严）"},{"id":"3509","name":"Women raise a family","topic":"More and more women are raising a family with a career. Please give your suggestions on a personal level and national level.","stance":"给个人和国家两层的建议","reasons":[{"en":"On a personal level, women can share housework and childcare with their partners, so that family duties do not fall only on them.","zh":"在个人层面，女性可以和伴侣分担家务和育儿，这样家庭责任不会只落在她们身上。","expand":"举例：家务分工、家人帮忙"},{"en":"At the national level, governments should provide affordable childcare and flexible working arrangements, so that mothers can stay in work.","zh":"在国家层面，政府应该提供可负担的托儿服务和灵活的工作安排，让妈妈们能继续工作。","expand":"举例：托儿补贴、弹性工作"},{"en":"On a personal level, women should protect their mental and physical health by setting realistic daily priorities and seeking emotional support, because long-term burnout can make it much harder to sustain both a career and a family.","zh":"在个人层面，女性应通过设定切合实际的每日优先级和寻求情感支持来保护身心健康，因为长期倦怠会让同时维持事业和家庭变得更难。","expand":"举例：设定每日优先级、规律运动、心理咨询、向伴侣或朋友倾诉，避免过度追求完美。","angle":"个人健康/可持续性"},{"en":"At the national level, governments should introduce shared parental leave and tax incentives for firms that promote women into leadership, so that career penalties are reduced and fathers take on more family responsibility.","zh":"在国家层面，政府应引入共享育儿假，并为提拔女性进入领导层的公司提供税收激励，从而减少职业惩罚，并让父亲承担更多家庭责任。","expand":"举例：父亲强制育儿假、企业晋升女性可获税收减免、反职场歧视条款。","angle":"国家政策/性别平等与职业发展"}],"writing":"题目 explicit 要求 personal level 和 national level，正文分两段，每段一个层面。 建议类题目需在开头明确从个人和国家两个层面提出建议。可先用已有“分担家务”作为个人层第一点，再接“保护身心健康与寻求支持”；国家层先用“托儿与弹性工作”，再接“共享育儿假与税收激励”。每条建议后紧跟目的或结果，用 also/moreover 自然衔接，结尾重申两层配合才能帮助女性兼顾家庭与事业。","questionType":"建议类（个人层面 + 国家层面）"},{"id":"3505","name":"Working less time","topic":"In the future, people will work less time at their jobs. To what extent do you agree with it? Please support your opinion with your own experience.","stance":"部分同意，但变化不均衡","reasons":[{"en":"I partly agree, because automation and AI can take over repetitive tasks, so people may need to work fewer hours.","zh":"我部分同意，因为自动化和 AI 能接手重复性工作，人们可能工作时间更少。","expand":"举例：工厂自动化、远程办公"},{"en":"However, some industries still need long hours, and not all workers can benefit equally, so the change may be uneven.","zh":"但有些行业仍需要长时间工作，不是所有工人都能平等受益，所以变化可能不均衡。","expand":"对比：知识型 vs 服务型"},{"en":"Governments and unions may push for shorter official workweeks, as four-day-week trials have shown, yet temporary and self-employed workers are often excluded, so future reductions in working time will depend heavily on employment status.","zh":"政府和工会可能推动缩短正式工作周，正如四天工作制试验所示，但临时工和自雇者常被排除，因此未来工时减少将在很大程度上取决于就业身份。","expand":"可举英国或冰岛四天工作制试验，并对比正式员工与零工、自雇者的覆盖差异；用来支撑‘部分同意但变化不均衡’。","angle":"政策制度/就业身份"},{"en":"Rising living costs may force many people to work longer or take second jobs to maintain their income, so even if technology raises efficiency, the total time people actually spend working may not fall for everyone.","zh":"不断上涨的生活成本可能迫使许多人延长工时或做第二份工作以维持收入，因此即使技术提高了效率，所有人实际花在工作上的总时间也未必会下降。","expand":"可结合通胀、房租、副业和零工经济，说明经济压力会抵消技术带来的工时减少；与自动化理由形成让步对比。","angle":"经济压力/生活成本"}],"writing":"to what extent 用 partly agree，说明趋势存在但要指出不均衡，最后给个人经验的例子。 立场保持‘部分同意，但变化不均衡’。开头明确：技术可能减少部分人的工时，但并非普遍趋势。主体段一可用自动化、政府或工会推动四天工作制来支持减少工时；主体段二可用行业需求、生活成本、就业身份差异来说明不均衡。结合个人经验时，可写远程办公、兼职、家人加班或身边正式员工与零工的不同情况；PTE WE建议200-300词，每条理由可作主题句并接具体例子。","questionType":"To what extent agree/disagree（同意程度题，需明确支持部分同意但变化不均衡）"},{"id":"4350","name":"Works of literature","topic":"Works of literature are a waste of time for students today. Do you agree and or disagree? Explain your idea using examples or your own experience.","stance":"不同意","reasons":[{"en":"I disagree, because literature develops language skills, imagination and the ability to see the world through other people's eyes.","zh":"我不同意，因为文学作品提升语言能力、想象力，以及从他人视角看世界的能力。","expand":"举例：阅读小说带来的改变"},{"en":"It also preserves culture and history, since classic works reflect the values and struggles of their time.","zh":"它也保存文化和历史，因为经典作品反映那个时代的价值观和困境。","expand":"举例：经典作品"},{"en":"Moreover, literature is not a waste of time because it sharpens critical thinking, teaching students to interpret ambiguous evidence, question assumptions, and form reasoned judgments useful in academic and professional life.","zh":"此外，文学并非浪费时间，因为它培养批判性思维，教学生解读模糊证据、质疑假设并形成理性判断，这对学术和职业生活都有用。","expand":"可举例说明分析小说中的不可靠叙述者、人物动机或伦理冲突，能迁移到法律、商业、医学等需要处理复杂信息的领域。","angle":"批判性思维/职业准备"},{"en":"In addition, reading literature strengthens concentration and deep reading, which are rare in a distracted digital age, enabling students to process long, complex texts instead of skimming fragmented information.","zh":"此外，阅读文学能增强专注力和深度阅读能力，这在分心的数字时代很稀缺，能让学生处理长篇复杂文本，而不是略读碎片化信息。","expand":"可对比刷短视频与读小说的注意力模式，说明深度阅读如何提升学习耐力、理解复杂论证和考试长文的能力。","angle":"专注力/数字时代"}],"writing":"disagree 题先明确否定（文学作品不是浪费时间），两个理由从语言和文化展开。 写作时可把两条理由作为第三、第四主体段，分别用 Moreover 和 In addition 衔接已有理由；每段先给理由，再补一个具体例子，最后回扣不同意立场：文学不是浪费时间，而是培养可转移的思维、职业与专注能力。","questionType":"同意/不同意题（Do you agree or disagree）— 立场：不同意"},{"id":"1800","name":"Zoos","topic":"Zoos have a long history and nowadays millions of people all over the world still enjoy visiting them every year. Do zoos benefit modern society and can they play a useful role in aiding wildlife conservation?","stance":"有条件地有益","reasons":[{"en":"I think zoos can benefit society, because they protect endangered species and support breeding programmes.","zh":"我认为动物园能造福社会，因为它们保护濒危物种，支持繁育计划。","expand":"举例：大熊猫繁育"},{"en":"However, zoos must provide proper living conditions, otherwise animals suffer and the educational value is limited.","zh":"但动物园必须提供合适的生活条件，否则动物受罪，教育价值也有限。","expand":"让步 + 条件"},{"en":"On the benefit side, well-run zoos can educate urban visitors about biodiversity and habitat loss, which may encourage everyday choices that reduce harm to the natural world.","zh":"从受益角度看，管理良好的动物园能教育城市游客了解生物多样性和栖息地丧失，这可能鼓励人们做出减少对自然世界伤害的日常选择。","expand":"可举学校团体、解说牌、互动展览等例子，说明教育如何转化为环保行为；同时强调只适用于管理规范的动物园。","angle":"社会教育与公众意识"},{"en":"By funding field projects and joining reintroduction programmes, reputable zoos can help restore wild populations, so they play a useful conservation role beyond simply displaying animals.","zh":"通过资助野外项目和参与再引入计划，声誉良好的动物园能帮助恢复野生种群，因此它们发挥着不仅仅是展示动物的有益保护作用。","expand":"举例：动物园资助反盗猎、栖息地恢复或物种放归项目，并说明这种资金与专业支持对野外保护有实际贡献。","angle":"保护资金与野外放归"}],"writing":"题目有两问（benefit + conservation role），正文分别回答，结尾给出条件（动物福利）。 本题是两部分问题，建议立场为有条件地有益。开头直接回答：动物园可受益社会并助力保护，但前提是管理规范、以动物福利和野外保护为核心。已有理由1和新理由1支持社会受益，新理由2支持保护作用，已有理由2作为条件限制。结尾重申：只有高标准动物园才值得支持，否则应改革或淘汰。","questionType":"two-part question: benefits to modern society + role in wildlife conservation"}]
var KEY=localStorage.getItem('ds_key')||'';
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function syncKey(){var b=document.getElementById('keyBtn');if(KEY){b.textContent='API Key 已设置';b.className='keybtn set';}else{b.textContent='设置 API Key';b.className='keybtn';}}
function list(kw){
  kw=(kw||'').toLowerCase();
  var a=D.filter(x=>!kw||x.name.toLowerCase().includes(kw)||x.topic.toLowerCase().includes(kw));
  document.getElementById('list').innerHTML=a.map(x=>'<div class="card" data-id="'+x.id+'"><div style="flex:1"><div class="cname">'+esc(x.name)+'</div><div class="cmeta" style="color:#667;font-size:13.5px;line-height:1.5;margin-top:4px">'+esc(x.topic.length>90?x.topic.slice(0,90)+'…':x.topic)+'</div></div><div class="go">练 →</div></div>').join('')||'<div style="text-align:center;color:#98a0ae;padding:40px">没有找到</div>';
}
async function grade(idx, zh, ref){
  var box=document.getElementById('in'+idx), fb=document.getElementById('fb'+idx), ans=document.getElementById('ans'+idx), ex=document.getElementById('ex'+idx);
  var txt=(box.value||'').trim();
  if(!txt){fb.className='fb on';fb.textContent='先写下你的英文翻译，再点 AI 精修。';return;}
  if(!KEY){fb.className='fb on';fb.textContent='参考译句：\n'+ref+'\n\n还没有设置 API Key，点右上角「设置 API Key」填一下。';return;}
  fb.className='fb on loading'; fb.textContent='精修中…';
  var sys='你是PTE WE写作的翻译精修老师。学生把中文理由翻译成英文。请优先保留学生原本正确的意思和用词，不要为了高级而高级，也不要把参考答案整句硬替换。只评价翻译，不重写论点。输出必须简洁，严格按以下格式：\n准确度：准确 / 部分准确 / 偏离\n精修版：一句完整英文\n关键修改：\n- 原表达 → 修改表达：原因（最多三条，没有问题就写“无需修改”）\n复用表达：一个可以迁移到写作里的英文表达\n下一步：一句操作建议';
  var usr='中文原句：'+zh+'\n参考表达：'+ref+'\n学生翻译：'+txt;
  try{
    var r=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+KEY},body:JSON.stringify({model:'deepseek-chat',messages:[{role:'system',content:sys},{role:'user',content:usr}],temperature:0.3})});
    var d=await r.json();
    if(d.error){fb.textContent='参考译句：\n'+ref+'\n\n接口返回错误：'+(d.error.message||'未知错误');return;}
    var refined=(d.choices&&d.choices[0]&&d.choices[0].message.content)||'没有返回内容';
    fb.textContent='参考译句：\n'+ref+'\n\nAI 精修：\n'+refined;
  }catch(e){ fb.textContent='参考译句：\n'+ref+'\n\n请求失败：'+e.message+'（检查网络或 Key）'; }
}
function show(it){
  var h='<span class="back" id="back">← 返回列表</span>';
  h+='<div class="panel"><div class="ptitle">'+esc(it.name)+'</div><div class="lbl">完整题目</div><div class="topic">'+esc(it.topic)+'</div><div class="lbl">提问方式</div><span class="stance">'+esc(it.questionType||'通用观点题')+'</span><div class="lbl">建议立场</div><span class="stance">'+esc(it.stance)+'</span></div>';
  it.reasons.forEach(function(r,i){
    h+='<div class="rs"><div class="zh">'+esc(r.zh)+'</div><textarea id="in'+i+'" placeholder="写下你的英文翻译..."></textarea>'+
    '<div class="acts"><button onclick="grade('+i+',\''+r.zh.replace(/'/g,"\\'")+'\',\''+r.en.replace(/'/g,"\\'")+'\')">AI 精修</button><button class="ghost" onclick="document.getElementById(\'ans'+i+'\').classList.toggle(\'on\');document.getElementById(\'ex'+i+'\').classList.toggle(\'on\')">参考译句</button></div>'+
    '<div class="fb" id="fb'+i+'"></div><div class="ans" id="ans'+i+'">'+esc(r.en)+'</div><div class="ex" id="ex'+i+'">关键展开：'+esc(r.expand)+(r.angle?' · 角度：'+esc(r.angle):'')+'</div></div>';
  });
  h+='<div class="panel"><div class="lbl">写法建议</div><div class="wr">'+esc(it.writing)+'</div></div>';
  document.getElementById('list').innerHTML=h;
  document.getElementById('back').onclick=()=>list(document.getElementById('q').value);
}
document.getElementById('q').oninput=function(){list(this.value)};
document.getElementById('list').onclick=function(e){
  var c=e.target.closest?e.target.closest('.card'):null; if(!c)return;
  var it=D.find(x=>String(x.id)===c.dataset.id); if(it)show(it);
};
document.getElementById('keyBtn').onclick=()=>{document.getElementById('keyInput').value=KEY;document.getElementById('mask').classList.add('on')};
document.getElementById('keySave').onclick=()=>{KEY=document.getElementById('keyInput').value.trim();localStorage.setItem('ds_key',KEY);document.getElementById('mask').classList.remove('on');syncKey()};
document.getElementById('keyClear').onclick=()=>{KEY='';localStorage.removeItem('ds_key');document.getElementById('keyInput').value='';syncKey()};
syncKey(); list('');
</script></body></html>
